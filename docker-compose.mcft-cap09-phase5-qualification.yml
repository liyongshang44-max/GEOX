services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: geox_mcft_cap09_phase5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geox_mcft_cap09_phase5 -h 127.0.0.1 -p 5432"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: phase5minio
      MINIO_ROOT_PASSWORD: phase5minio-secret
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live > /dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-ceu"]
    command:
      - |
        mc alias set phase5 http://minio:9000 phase5minio phase5minio-secret
        mc mb --ignore-existing phase5/mcft-cap09-phase5-raw
        mc anonymous set private phase5/mcft-cap09-phase5-raw

  database-platform-bootstrap:
    build:
      context: .
      dockerfile: docker/mcft-cap09-runtime.Dockerfile
    image: geox/mcft-cap09-runtime:phase5-qualification
    working_dir: /app
    init: true
    restart: "no"
    command: ["node", "apps/server/dist/database/platform_bootstrap.js"]
    environment:
      GEOX_DB_PLATFORM_ADMIN_DATABASE_URL: postgres://postgres:postgres@postgres:5432/geox_mcft_cap09_phase5
      GEOX_MIGRATION_DATABASE_URL: postgres://geox_mcft_migrator_v1:phase5-migrator@postgres:5432/geox_mcft_cap09_phase5
      GEOX_RUNTIME_DATABASE_URL: postgres://geox_runtime_v1:phase5-generic-runtime@postgres:5432/geox_mcft_cap09_phase5
      GEOX_MCFT_MIGRATOR_PASSWORD: phase5-migrator
      GEOX_RUNTIME_DATABASE_PASSWORD: phase5-generic-runtime
    depends_on:
      postgres:
        condition: service_healthy

  service-identity-bootstrap:
    image: geox/mcft-cap09-runtime:phase5-qualification
    working_dir: /app
    init: true
    restart: "no"
    command: ["node", "apps/server/dist/hosting/mcft_cap09_phase5_identity_bootstrap.js"]
    environment:
      GEOX_DB_PLATFORM_ADMIN_DATABASE_URL: postgres://postgres:postgres@postgres:5432/geox_mcft_cap09_phase5
      GEOX_MCFT_CAP09_EVIDENCE_SERVICE_PASSWORD: phase5-evidence-service
      GEOX_MCFT_CAP09_TWIN_SERVICE_PASSWORD: phase5-twin-service
    depends_on:
      database-platform-bootstrap:
        condition: service_completed_successfully

  evidence-runtime:
    image: geox/mcft-cap09-runtime:phase5-qualification
    working_dir: /app
    init: true
    restart: "no"
    profiles: ["runtime"]
    command: ["node", "apps/server/dist/hosting/mcft_cap09_evidence_runtime.js"]
    environment:
      DATABASE_URL: postgres://geox_mcft_cap09_evidence_service_v1:phase5-evidence-service@postgres:5432/geox_mcft_cap09_phase5
      GEOX_MCFT_CAP09_TENANT_ID: tenantA
      GEOX_MCFT_CAP09_PROJECT_ID: projectA
      GEOX_MCFT_CAP09_GROUP_ID: groupA
      GEOX_MCFT_CAP09_FIELD_ID: field_e3r1
      GEOX_MCFT_CAP09_SEASON_ID: season_2026
      GEOX_MCFT_CAP09_ZONE_ID: zone_root
      GEOX_MCFT_CAP09_EVIDENCE_TARGET_LOGICAL_TIME: ${GEOX_PHASE5_A0:?GEOX_PHASE5_A0 is required}
      GEOX_MCFT_CAP09_EVIDENCE_REQUESTED_AT: ${GEOX_PHASE5_REQUESTED_AT:?GEOX_PHASE5_REQUESTED_AT is required}
      GEOX_MCFT_CAP09_EVIDENCE_REQUEST_PREFIX: ${GEOX_PHASE5_EVIDENCE_REQUEST_PREFIX:-phase5-live}
      GEOX_MCFT_CAP09_EVIDENCE_SOURCE_FAMILIES: KBS_SOIL,GFS_BUNDLE
      GEOX_MCFT_CAP09_RAW_S3_ENDPOINT: http://minio:9000
      GEOX_MCFT_CAP09_RAW_S3_BUCKET: mcft-cap09-phase5-raw
      GEOX_MCFT_CAP09_RAW_S3_REGION: us-east-1
      GEOX_MCFT_CAP09_RAW_S3_ACCESS_KEY_ID: phase5minio
      GEOX_MCFT_CAP09_RAW_S3_SECRET_ACCESS_KEY: phase5minio-secret
      GEOX_MCFT_CAP09_RAW_S3_ALLOW_INSECURE_HTTP: "1"
      GEOX_MCFT_CAP09_PYTHON_EXECUTABLE: python
      GEOX_MCFT_CAP09_LEASE_OWNER: ${GEOX_PHASE5_EVIDENCE_LEASE_OWNER:-phase5-evidence-primary}
      GEOX_MCFT_CAP09_LEASE_DURATION_SECONDS: "900"
      GEOX_MCFT_CAP09_SUCCESS_WAIT_MS: "0"
      GEOX_MCFT_CAP09_STANDBY_WAIT_MS: "100"
      GEOX_MCFT_CAP09_RETRY_WAIT_MS: "250"
    depends_on:
      service-identity-bootstrap:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  phase5-prepare:
    image: geox/mcft-cap09-runtime:phase5-qualification
    working_dir: /app
    init: true
    restart: "no"
    profiles: ["runtime"]
    command:
      [
        "pnpm",
        "exec",
        "tsx",
        "scripts/runtime_acceptance/PREPARE_MCFT_CAP_09_PHASE5_TWO_SERVICE_24T_V1.ts"
      ]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/geox_mcft_cap09_phase5
      GEOX_DEPLOYMENT_SUBJECT_COMMIT: ${GEOX_DEPLOYMENT_SUBJECT_COMMIT:?GEOX_DEPLOYMENT_SUBJECT_COMMIT is required}
      GEOX_MCFT_CAP09_PHASE5_A0: ${GEOX_PHASE5_A0:?GEOX_PHASE5_A0 is required}
      GEOX_MCFT_CAP09_PHASE5_CREATED_AT: ${GEOX_PHASE5_REQUESTED_AT:?GEOX_PHASE5_REQUESTED_AT is required}
      GEOX_MCFT_CAP09_PHASE5_MANIFEST_OUTPUT: /qualification/phase5-manifest.json
      GEOX_MCFT_CAP09_PHASE5_PREPARE_PROOF_OUTPUT: /qualification/phase5-prepare-result.json
    volumes:
      - ./acceptance-output:/qualification
    depends_on:
      service-identity-bootstrap:
        condition: service_completed_successfully

  twin-runtime:
    image: geox/mcft-cap09-runtime:phase5-qualification
    working_dir: /app
    init: true
    restart: "no"
    profiles: ["runtime"]
    command: ["node", "apps/server/dist/hosting/mcft_cap09_twin_runtime.js"]
    environment:
      DATABASE_URL: postgres://geox_mcft_cap09_twin_service_v1:phase5-twin-service@postgres:5432/geox_mcft_cap09_phase5
      GEOX_MCFT_CAP09_TWIN_MANIFEST_PATH: /qualification/phase5-manifest.json
      GEOX_MCFT_CAP09_CROP_AUTHORITY_PATH: /app/docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S6-FORMAL-CROP-CONTEXT-AUTHORITY-V3.json
      GEOX_MCFT_CAP09_CONFIGURATION_MATRIX_PATH: /app/docs/digital_twin/mcft/GEOX-MCFT-00-CONFIGURATION-BINDING-MATRIX.json
      GEOX_MCFT_CAP09_ACCELERATED_CLOCK_AT: ${GEOX_PHASE5_O23:?GEOX_PHASE5_O23 is required}
      GEOX_MCFT_CAP09_ACCELERATED_CLOCK_ACK: MCFT_CAP09_PHASE5_ACCELERATED_WAIT_AND_CLOCK_ONLY
      GEOX_MCFT_CAP09_STOP_AFTER_TERMINAL_TICKS: ${GEOX_PHASE5_STOP_AFTER_TERMINAL_TICKS:-24}
      GEOX_MCFT_CAP09_LEASE_OWNER: ${GEOX_PHASE5_TWIN_LEASE_OWNER:-phase5-twin-primary}
      GEOX_MCFT_CAP09_LEASE_DURATION_SECONDS: "300"
      GEOX_MCFT_CAP09_SUCCESS_WAIT_MS: "0"
      GEOX_MCFT_CAP09_STANDBY_WAIT_MS: "100"
      GEOX_MCFT_CAP09_RETRY_WAIT_MS: "250"
      GEOX_MCFT_CAP09_TERMINAL_WAIT_MS: ${GEOX_PHASE5_TERMINAL_WAIT_MS:-25}
      GEOX_MCFT_CAP09_NO_DUE_WAIT_MS: "100"
      GEOX_MCFT_CAP09_BACKPRESSURE_WAIT_MS: "100"
    volumes:
      - ./acceptance-output:/qualification
    depends_on:
      service-identity-bootstrap:
        condition: service_completed_successfully

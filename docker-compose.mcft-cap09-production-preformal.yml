name: geox-mcft-cap09-production-v1

services:
  geox-mcft-cap09-evidence-runtime-v1:
    image: geox-mcft-cap09-runtime:${GEOX_DEPLOYMENT_SUBJECT_COMMIT:?GEOX_DEPLOYMENT_SUBJECT_COMMIT is required}
    build:
      context: .
      dockerfile: docker/mcft-cap09-runtime.Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command:
      - sh
      - -c
      - >-
        mkdir -p /var/log/geox/mcft-cap09/evidence &&
        exec node apps/server/dist/runtime/mcft_cap09_evidence_preformal_owner_runtime.js
        >> /var/log/geox/mcft-cap09/evidence/runtime.log 2>&1
    environment:
      GEOX_DEPLOYMENT_SUBJECT_COMMIT: ${GEOX_DEPLOYMENT_SUBJECT_COMMIT:?required}
      GEOX_MCFT_CAP09_EVIDENCE_RUNTIME_SERVICE_ID: local-docker://fae5f756-ef25-40d5-9777-5b2c3d4837a1/geox-mcft-cap09-evidence-runtime-v1
      GEOX_MCFT_CAP09_PRODUCTION_RUNTIME_START_AUTHORITY_PATH: /run/geox/mcft-cap09/runtime-start-authority.json
      GEOX_MCFT_CAP09_PRODUCTION_OWNER_CUTOVER_AUTHORITY_PATH: /run/geox/mcft-cap09/owner-cutover-authority.json
      GEOX_MCFT_CAP09_EVIDENCE_RUNTIME_DATABASE_URL: ${GEOX_MCFT_CAP09_EVIDENCE_RUNTIME_DATABASE_URL:?required}
      GEOX_MCFT_CAP09_TENANT_ID: ${GEOX_MCFT_CAP09_TENANT_ID:?required}
      GEOX_MCFT_CAP09_PROJECT_ID: ${GEOX_MCFT_CAP09_PROJECT_ID:?required}
      GEOX_MCFT_CAP09_GROUP_ID: ${GEOX_MCFT_CAP09_GROUP_ID:?required}
      GEOX_MCFT_CAP09_FIELD_ID: ${GEOX_MCFT_CAP09_FIELD_ID:?required}
      GEOX_MCFT_CAP09_SEASON_ID: ${GEOX_MCFT_CAP09_SEASON_ID:?required}
      GEOX_MCFT_CAP09_ZONE_ID: ${GEOX_MCFT_CAP09_ZONE_ID:?required}
      GEOX_MCFT_CAP09_EVIDENCE_S3_ENDPOINT: ${GEOX_MCFT_CAP09_EVIDENCE_S3_ENDPOINT:?required}
      GEOX_MCFT_CAP09_EVIDENCE_S3_BUCKET: ${GEOX_MCFT_CAP09_EVIDENCE_S3_BUCKET:?required}
      GEOX_MCFT_CAP09_EVIDENCE_S3_REGION: ${GEOX_MCFT_CAP09_EVIDENCE_S3_REGION:?required}
      GEOX_MCFT_CAP09_EVIDENCE_S3_ACCESS_KEY_ID: ${GEOX_MCFT_CAP09_EVIDENCE_S3_ACCESS_KEY_ID:?required}
      GEOX_MCFT_CAP09_EVIDENCE_S3_SECRET_ACCESS_KEY: ${GEOX_MCFT_CAP09_EVIDENCE_S3_SECRET_ACCESS_KEY:?required}
    volumes:
      - type: bind
        source: ${GEOX_MCFT_CAP09_PRODUCTION_RUNTIME_START_AUTHORITY_PATH:?required}
        target: /run/geox/mcft-cap09/runtime-start-authority.json
        read_only: true
      - type: bind
        source: ${GEOX_MCFT_CAP09_PRODUCTION_OWNER_CUTOVER_AUTHORITY_PATH:?required}
        target: /run/geox/mcft-cap09/owner-cutover-authority.json
        read_only: true
      - type: bind
        source: ${GEOX_MCFT_CAP09_DURABLE_LOG_ROOT:?required}/evidence
        target: /var/log/geox/mcft-cap09/evidence
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  geox-mcft-cap09-twin-runtime-v1:
    image: geox-mcft-cap09-runtime:${GEOX_DEPLOYMENT_SUBJECT_COMMIT:?GEOX_DEPLOYMENT_SUBJECT_COMMIT is required}
    build:
      context: .
      dockerfile: docker/mcft-cap09-runtime.Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command:
      - sh
      - -c
      - >-
        mkdir -p /var/log/geox/mcft-cap09/twin &&
        exec node apps/server/dist/runtime/mcft_cap09_twin_preformal_owner_runtime.js
        >> /var/log/geox/mcft-cap09/twin/runtime.log 2>&1
    environment:
      GEOX_DEPLOYMENT_SUBJECT_COMMIT: ${GEOX_DEPLOYMENT_SUBJECT_COMMIT:?required}
      GEOX_MCFT_CAP09_TWIN_RUNTIME_SERVICE_ID: local-docker://fae5f756-ef25-40d5-9777-5b2c3d4837a1/geox-mcft-cap09-twin-runtime-v1
      GEOX_MCFT_CAP09_PRODUCTION_RUNTIME_START_AUTHORITY_PATH: /run/geox/mcft-cap09/runtime-start-authority.json
      GEOX_MCFT_CAP09_PRODUCTION_OWNER_CUTOVER_AUTHORITY_PATH: /run/geox/mcft-cap09/owner-cutover-authority.json
      GEOX_MCFT_CAP09_TWIN_RUNTIME_DATABASE_URL: ${GEOX_MCFT_CAP09_TWIN_RUNTIME_DATABASE_URL:?required}
      GEOX_MCFT_CAP09_TENANT_ID: ${GEOX_MCFT_CAP09_TENANT_ID:?required}
      GEOX_MCFT_CAP09_PROJECT_ID: ${GEOX_MCFT_CAP09_PROJECT_ID:?required}
      GEOX_MCFT_CAP09_GROUP_ID: ${GEOX_MCFT_CAP09_GROUP_ID:?required}
      GEOX_MCFT_CAP09_FIELD_ID: ${GEOX_MCFT_CAP09_FIELD_ID:?required}
      GEOX_MCFT_CAP09_SEASON_ID: ${GEOX_MCFT_CAP09_SEASON_ID:?required}
      GEOX_MCFT_CAP09_ZONE_ID: ${GEOX_MCFT_CAP09_ZONE_ID:?required}
      GEOX_MCFT_CAP09_TWIN_RUNTIME_CURRENT_CROP_AUTHORITY_PATH: /run/geox/mcft-cap09/current-crop-authority.json
      GEOX_MCFT_CAP09_TWIN_RUNTIME_BIOLOGICAL_STAGE_ARCHITECTURE_EFFECTIVENESS_PATH: /run/geox/mcft-cap09/biological-stage-architecture-effectiveness.json
    volumes:
      - type: bind
        source: ${GEOX_MCFT_CAP09_PRODUCTION_RUNTIME_START_AUTHORITY_PATH:?required}
        target: /run/geox/mcft-cap09/runtime-start-authority.json
        read_only: true
      - type: bind
        source: ${GEOX_MCFT_CAP09_PRODUCTION_OWNER_CUTOVER_AUTHORITY_PATH:?required}
        target: /run/geox/mcft-cap09/owner-cutover-authority.json
        read_only: true
      - type: bind
        source: ${GEOX_MCFT_CAP09_PRODUCTION_CURRENT_CROP_AUTHORITY_PATH:?required}
        target: /run/geox/mcft-cap09/current-crop-authority.json
        read_only: true
      - type: bind
        source: ${GEOX_MCFT_CAP09_PRODUCTION_BIOLOGICAL_STAGE_ARCHITECTURE_EFFECTIVENESS_PATH:?required}
        target: /run/geox/mcft-cap09/biological-stage-architecture-effectiveness.json
        read_only: true
      - type: bind
        source: ${GEOX_MCFT_CAP09_DURABLE_LOG_ROOT:?required}/twin
        target: /var/log/geox/mcft-cap09/twin
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

name: geox-mcft-cap09-production-v1

services:
  geox-mcft-cap09-evidence-runtime-v1:
    image: geox-mcft-cap09-runtime:${GEOX_DEPLOYMENT_SUBJECT_COMMIT:?GEOX_DEPLOYMENT_SUBJECT_COMMIT is required}
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    command:
      - sh
      - -c
      - >-
        mkdir -p /var/log/geox/mcft-cap09/evidence &&
        exec node apps/server/dist/runtime/mcft_cap09_evidence_formal_v5_active_runtime.js
        >> /var/log/geox/mcft-cap09/evidence/runtime.log 2>&1
    environment:
      GEOX_DEPLOYMENT_SUBJECT_COMMIT: ${GEOX_DEPLOYMENT_SUBJECT_COMMIT:?GEOX_DEPLOYMENT_SUBJECT_COMMIT is required}
      GEOX_MCFT_CAP09_PREFORMAL_MODE: OWNER_CUTOVER
      GEOX_MCFT_CAP09_EVIDENCE_RUNTIME_SERVICE_ID: local-docker://fae5f756-ef25-40d5-9777-5b2c3d4837a1/geox-mcft-cap09-evidence-runtime-v1

      # Existing operational Evidence owner lane.
      GEOX_MCFT_CAP09_PRODUCTION_RUNTIME_START_AUTHORITY_PATH: /run/geox/mcft-cap09/runtime-start-authority.json
      GEOX_MCFT_CAP09_PRODUCTION_OWNER_CUTOVER_AUTHORITY_PATH: /run/geox/mcft-cap09/owner-cutover-authority.json
      GEOX_MCFT_CAP09_EVIDENCE_RUNTIME_DATABASE_URL: ${GEOX_MCFT_CAP09_EVIDENCE_RUNTIME_DATABASE_URL:?GEOX_MCFT_CAP09_EVIDENCE_RUNTIME_DATABASE_URL is required}
      GEOX_MCFT_CAP09_TENANT_ID: ${GEOX_MCFT_CAP09_TENANT_ID:?GEOX_MCFT_CAP09_TENANT_ID is required}
      GEOX_MCFT_CAP09_PROJECT_ID: ${GEOX_MCFT_CAP09_PROJECT_ID:?GEOX_MCFT_CAP09_PROJECT_ID is required}
      GEOX_MCFT_CAP09_GROUP_ID: ${GEOX_MCFT_CAP09_GROUP_ID:?GEOX_MCFT_CAP09_GROUP_ID is required}
      GEOX_MCFT_CAP09_FIELD_ID: ${GEOX_MCFT_CAP09_FIELD_ID:?GEOX_MCFT_CAP09_FIELD_ID is required}
      GEOX_MCFT_CAP09_SEASON_ID: ${GEOX_MCFT_CAP09_SEASON_ID:?GEOX_MCFT_CAP09_SEASON_ID is required}
      GEOX_MCFT_CAP09_ZONE_ID: ${GEOX_MCFT_CAP09_ZONE_ID:?GEOX_MCFT_CAP09_ZONE_ID is required}
      GEOX_MCFT_CAP09_EVIDENCE_S3_ENDPOINT: ${GEOX_MCFT_CAP09_EVIDENCE_S3_ENDPOINT:?GEOX_MCFT_CAP09_EVIDENCE_S3_ENDPOINT is required}
      GEOX_MCFT_CAP09_EVIDENCE_S3_BUCKET: ${GEOX_MCFT_CAP09_EVIDENCE_S3_BUCKET:?GEOX_MCFT_CAP09_EVIDENCE_S3_BUCKET is required}
      GEOX_MCFT_CAP09_EVIDENCE_S3_REGION: ${GEOX_MCFT_CAP09_EVIDENCE_S3_REGION:?GEOX_MCFT_CAP09_EVIDENCE_S3_REGION is required}
      GEOX_MCFT_CAP09_EVIDENCE_S3_ACCESS_KEY_ID: ${GEOX_MCFT_CAP09_EVIDENCE_S3_ACCESS_KEY_ID:?GEOX_MCFT_CAP09_EVIDENCE_S3_ACCESS_KEY_ID is required}
      GEOX_MCFT_CAP09_EVIDENCE_S3_SECRET_ACCESS_KEY: ${GEOX_MCFT_CAP09_EVIDENCE_S3_SECRET_ACCESS_KEY:?GEOX_MCFT_CAP09_EVIDENCE_S3_SECRET_ACCESS_KEY is required}

      # Subordinate Formal-v5 forcing lane.
      GEOX_MCFT_CAP09_FORMAL_V5_EVIDENCE_RUNTIME_DATABASE_URL: ${GEOX_MCFT_CAP09_FORMAL_V5_EVIDENCE_RUNTIME_DATABASE_URL:?GEOX_MCFT_CAP09_FORMAL_V5_EVIDENCE_RUNTIME_DATABASE_URL is required}
      GEOX_MCFT_CAP09_FORMAL_RAW_S3_ENDPOINT: ${GEOX_MCFT_CAP09_FORMAL_RAW_S3_ENDPOINT:?GEOX_MCFT_CAP09_FORMAL_RAW_S3_ENDPOINT is required}
      GEOX_MCFT_CAP09_FORMAL_RAW_S3_BUCKET: ${GEOX_MCFT_CAP09_FORMAL_RAW_S3_BUCKET:?GEOX_MCFT_CAP09_FORMAL_RAW_S3_BUCKET is required}
      GEOX_MCFT_CAP09_FORMAL_RAW_S3_REGION: ${GEOX_MCFT_CAP09_FORMAL_RAW_S3_REGION:?GEOX_MCFT_CAP09_FORMAL_RAW_S3_REGION is required}
      GEOX_MCFT_CAP09_FORMAL_RAW_S3_ACCESS_KEY_ID: ${GEOX_MCFT_CAP09_FORMAL_RAW_S3_ACCESS_KEY_ID:?GEOX_MCFT_CAP09_FORMAL_RAW_S3_ACCESS_KEY_ID is required}
      GEOX_MCFT_CAP09_FORMAL_RAW_S3_SECRET_ACCESS_KEY: ${GEOX_MCFT_CAP09_FORMAL_RAW_S3_SECRET_ACCESS_KEY:?GEOX_MCFT_CAP09_FORMAL_RAW_S3_SECRET_ACCESS_KEY is required}
      GEOX_MCFT_CAP09_FORMAL_V5_ARM_PATH: /run/geox/mcft-cap09/formal-v5/arm-v1.json
      GEOX_MCFT_CAP09_FORMAL_V5_A0_BOOTSTRAP_PATH: /run/geox/mcft-cap09/formal-v5/a0-bootstrap-v1.json
      GEOX_MCFT_CAP09_FORMAL_V5_MANIFEST_PATH: /run/geox/mcft-cap09/formal-v5/formal-window-manifest-v1.json
      GEOX_MCFT_CAP09_FORMAL_V5_CURRENT_CROP_AUTHORITY_PATH: /run/geox/mcft-cap09/formal-v5/current-crop-authority.json
    volumes:
      - type: bind
        source: ${GEOX_MCFT_CAP09_PRODUCTION_RUNTIME_START_AUTHORITY_PATH:?GEOX_MCFT_CAP09_PRODUCTION_RUNTIME_START_AUTHORITY_PATH is required}
        target: /run/geox/mcft-cap09/runtime-start-authority.json
        read_only: true
      - type: bind
        source: ${GEOX_MCFT_CAP09_PRODUCTION_OWNER_CUTOVER_AUTHORITY_PATH:?GEOX_MCFT_CAP09_PRODUCTION_OWNER_CUTOVER_AUTHORITY_PATH is required}
        target: /run/geox/mcft-cap09/owner-cutover-authority.json
        read_only: true
      - type: bind
        source: ${GEOX_MCFT_CAP09_FORMAL_V5_ARM_PATH:?GEOX_MCFT_CAP09_FORMAL_V5_ARM_PATH is required}
        target: /run/geox/mcft-cap09/formal-v5/arm-v1.json
        read_only: true
      - type: bind
        source: ${GEOX_MCFT_CAP09_FORMAL_V5_A0_BOOTSTRAP_PATH:?GEOX_MCFT_CAP09_FORMAL_V5_A0_BOOTSTRAP_PATH is required}
        target: /run/geox/mcft-cap09/formal-v5/a0-bootstrap-v1.json
        read_only: true
      - type: bind
        source: ${GEOX_MCFT_CAP09_FORMAL_V5_MANIFEST_PATH:?GEOX_MCFT_CAP09_FORMAL_V5_MANIFEST_PATH is required}
        target: /run/geox/mcft-cap09/formal-v5/formal-window-manifest-v1.json
        read_only: true
      - type: bind
        source: ${GEOX_MCFT_CAP09_FORMAL_V5_CURRENT_CROP_AUTHORITY_PATH:?GEOX_MCFT_CAP09_FORMAL_V5_CURRENT_CROP_AUTHORITY_PATH is required}
        target: /run/geox/mcft-cap09/formal-v5/current-crop-authority.json
        read_only: true
      - type: bind
        source: ${GEOX_MCFT_CAP09_DURABLE_LOG_ROOT:?GEOX_MCFT_CAP09_DURABLE_LOG_ROOT is required}/evidence
        target: /var/log/geox/mcft-cap09/evidence
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  geox-mcft-cap09-twin-runtime-v1:
    image: geox-mcft-cap09-runtime:${GEOX_DEPLOYMENT_SUBJECT_COMMIT:?GEOX_DEPLOYMENT_SUBJECT_COMMIT is required}
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    command:
      - sh
      - -c
      - >-
        mkdir -p /var/log/geox/mcft-cap09/twin &&
        exec node apps/server/dist/runtime/mcft_cap09_twin_runtime_v3.js
        >> /var/log/geox/mcft-cap09/twin/runtime.log 2>&1
    environment:
      GEOX_DEPLOYMENT_SUBJECT_COMMIT: ${GEOX_DEPLOYMENT_SUBJECT_COMMIT:?GEOX_DEPLOYMENT_SUBJECT_COMMIT is required}
      GEOX_MCFT_CAP09_TWIN_RUNTIME_SERVICE_ID: local-docker://fae5f756-ef25-40d5-9777-5b2c3d4837a1/geox-mcft-cap09-twin-runtime-v1
      GEOX_MCFT_CAP09_FORMAL_V5_TWIN_RUNTIME_DATABASE_URL: ${GEOX_MCFT_CAP09_FORMAL_V5_TWIN_RUNTIME_DATABASE_URL:?GEOX_MCFT_CAP09_FORMAL_V5_TWIN_RUNTIME_DATABASE_URL is required}
      GEOX_MCFT_CAP09_FORMAL_V5_ARM_PATH: /run/geox/mcft-cap09/formal-v5/arm-v1.json
      GEOX_MCFT_CAP09_FORMAL_V5_A0_BOOTSTRAP_PATH: /run/geox/mcft-cap09/formal-v5/a0-bootstrap-v1.json
      GEOX_MCFT_CAP09_FORMAL_V5_MANIFEST_PATH: /run/geox/mcft-cap09/formal-v5/formal-window-manifest-v1.json
      GEOX_MCFT_CAP09_FORMAL_V5_CURRENT_CROP_AUTHORITY_PATH: /run/geox/mcft-cap09/formal-v5/current-crop-authority.json
      GEOX_MCFT_CAP09_FORMAL_V5_CROP_AUTHORITY_PATH: /app/docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S6-FORMAL-CROP-CONTEXT-AUTHORITY-V3.json
      GEOX_MCFT_CAP09_FORMAL_V5_CONFIGURATION_MATRIX_PATH: /app/docs/digital_twin/mcft/GEOX-MCFT-00-CONFIGURATION-BINDING-MATRIX.json
      GEOX_MCFT_CAP09_FORMAL_V5_BIOLOGICAL_STAGE_ARCHITECTURE_EFFECTIVENESS_PATH: /app/docs/digital_twin/GEOX-DT-02-BIOLOGICAL-STAGE-AUTHORITY-EFFECTIVENESS-V1.json
      GEOX_MCFT_CAP09_TWIN_RUNTIME_LEASE_DURATION_SECONDS: ${GEOX_MCFT_CAP09_TWIN_RUNTIME_LEASE_DURATION_SECONDS:-300}
      GEOX_MCFT_CAP09_TWIN_RUNTIME_IDLE_POLL_MS: ${GEOX_MCFT_CAP09_TWIN_RUNTIME_IDLE_POLL_MS:-5000}
      GEOX_MCFT_CAP09_TWIN_RUNTIME_NOT_READY_POLL_MS: ${GEOX_MCFT_CAP09_TWIN_RUNTIME_NOT_READY_POLL_MS:-15000}
      GEOX_MCFT_CAP09_TWIN_RUNTIME_TERMINAL_POLL_MS: ${GEOX_MCFT_CAP09_TWIN_RUNTIME_TERMINAL_POLL_MS:-0}
      GEOX_MCFT_CAP09_TWIN_RUNTIME_RETRY_BASE_MS: ${GEOX_MCFT_CAP09_TWIN_RUNTIME_RETRY_BASE_MS:-1000}
      GEOX_MCFT_CAP09_TWIN_RUNTIME_RETRY_MAXIMUM_MS: ${GEOX_MCFT_CAP09_TWIN_RUNTIME_RETRY_MAXIMUM_MS:-60000}
    volumes:
      - type: bind
        source: ${GEOX_MCFT_CAP09_FORMAL_V5_ARM_PATH:?GEOX_MCFT_CAP09_FORMAL_V5_ARM_PATH is required}
        target: /run/geox/mcft-cap09/formal-v5/arm-v1.json
        read_only: true
      - type: bind
        source: ${GEOX_MCFT_CAP09_FORMAL_V5_A0_BOOTSTRAP_PATH:?GEOX_MCFT_CAP09_FORMAL_V5_A0_BOOTSTRAP_PATH is required}
        target: /run/geox/mcft-cap09/formal-v5/a0-bootstrap-v1.json
        read_only: true
      - type: bind
        source: ${GEOX_MCFT_CAP09_FORMAL_V5_MANIFEST_PATH:?GEOX_MCFT_CAP09_FORMAL_V5_MANIFEST_PATH is required}
        target: /run/geox/mcft-cap09/formal-v5/formal-window-manifest-v1.json
        read_only: true
      - type: bind
        source: ${GEOX_MCFT_CAP09_FORMAL_V5_CURRENT_CROP_AUTHORITY_PATH:?GEOX_MCFT_CAP09_FORMAL_V5_CURRENT_CROP_AUTHORITY_PATH is required}
        target: /run/geox/mcft-cap09/formal-v5/current-crop-authority.json
        read_only: true
      - type: bind
        source: ${GEOX_MCFT_CAP09_DURABLE_LOG_ROOT:?GEOX_MCFT_CAP09_DURABLE_LOG_ROOT is required}/twin
        target: /var/log/geox/mcft-cap09/twin
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

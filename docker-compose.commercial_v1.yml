# GEOX Commercial v1 compose baseline.
# Includes independent database platform bootstrap, one-shot MCFT-CAP-07 migration,
# one-shot B-Line Commercial workload-principal bootstrap, isolated workload credential
# volumes, Runtime, web, mqtt, worker, executor, telemetry ingest, and minio.

services:
  postgres:
    image: postgres:16
    container_name: geox-v1-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "5433:5432"
    volumes:
      - geox_v1_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -h 127.0.0.1 -p 5432"]
      interval: 3s
      timeout: 2s
      retries: 20

  commercial-principal-secret-init:
    image: alpine:3.20
    container_name: geox-v1-commercial-principal-secret-init
    restart: "no"
    entrypoint: ["/bin/sh", "-ceu"]
    command:
      - |
        generate_secret() {
          target="$$1"
          if [ ! -s "$$target" ]; then
            umask 077
            od -An -N32 -tx1 /dev/urandom | tr -d ' \n' > "$$target"
          fi
          chmod 0444 "$$target"
        }
        generate_secret /secrets/telemetry/db_password
        generate_secret /secrets/telemetry/mqtt_password
        generate_secret /secrets/jobs/db_password
        generate_secret /secrets/executor/db_password
        generate_secret /secrets/executor/mqtt_password
        echo "[commercial-principal-secret-init] isolated workload credentials ready"
    volumes:
      - geox_v1_telemetry_credentials:/secrets/telemetry
      - geox_v1_jobs_credentials:/secrets/jobs
      - geox_v1_executor_credentials:/secrets/executor

  database-platform-bootstrap:
    build:
      context: .
      dockerfile: docker/runtime.Dockerfile
      args:
        BUILD_COMMAND: pnpm --filter @geox/contracts build && pnpm --filter @geox/control-kernel build && pnpm --filter @geox/device-skills build && pnpm --filter @geox/skill-registry build && pnpm --filter @geox/server build
    image: geox/server-runtime:local
    working_dir: /app
    init: true
    restart: "no"
    command: ["node", "apps/server/dist/database/platform_bootstrap.js"]
    environment:
      GEOX_DB_PLATFORM_ADMIN_DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      GEOX_MIGRATION_DATABASE_URL: postgres://geox_mcft_migrator_v1:${GEOX_MCFT_MIGRATOR_PASSWORD:?GEOX_MCFT_MIGRATOR_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      GEOX_RUNTIME_DATABASE_URL: postgres://geox_runtime_v1:${GEOX_RUNTIME_DATABASE_PASSWORD:?GEOX_RUNTIME_DATABASE_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      GEOX_MCFT_MIGRATOR_PASSWORD: ${GEOX_MCFT_MIGRATOR_PASSWORD:?GEOX_MCFT_MIGRATOR_PASSWORD is required}
      GEOX_RUNTIME_DATABASE_PASSWORD: ${GEOX_RUNTIME_DATABASE_PASSWORD:?GEOX_RUNTIME_DATABASE_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy

  mcft-cap07-migration:
    build:
      context: .
      dockerfile: docker/runtime.Dockerfile
      args:
        BUILD_COMMAND: pnpm --filter @geox/contracts build && pnpm --filter @geox/control-kernel build && pnpm --filter @geox/device-skills build && pnpm --filter @geox/skill-registry build && pnpm --filter @geox/server build
    image: geox/server-runtime:local
    working_dir: /app
    init: true
    restart: "no"
    command: ["node", "apps/server/dist/database/mcft_cap07_migration.js"]
    environment:
      GEOX_MIGRATION_DATABASE_URL: postgres://geox_mcft_migrator_v1:${GEOX_MCFT_MIGRATOR_PASSWORD:?GEOX_MCFT_MIGRATOR_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      GEOX_DEPLOYMENT_SUBJECT_COMMIT: ${GEOX_DEPLOYMENT_SUBJECT_COMMIT:?GEOX_DEPLOYMENT_SUBJECT_COMMIT is required}
    depends_on:
      database-platform-bootstrap:
        condition: service_completed_successfully

  bline-commercial-principal-bootstrap:
    build:
      context: .
      dockerfile: docker/runtime.Dockerfile
      args:
        BUILD_COMMAND: pnpm --filter @geox/contracts build && pnpm --filter @geox/control-kernel build && pnpm --filter @geox/device-skills build && pnpm --filter @geox/skill-registry build && pnpm --filter @geox/server build
    image: geox/server-runtime:local
    working_dir: /app
    init: true
    restart: "no"
    entrypoint: ["/bin/sh", "-ceu"]
    command:
      - |
        export GEOX_TELEMETRY_DATABASE_PASSWORD="$$(cat /run/geox/telemetry/db_password)"
        export GEOX_JOBS_DATABASE_PASSWORD="$$(cat /run/geox/jobs/db_password)"
        export GEOX_EXECUTOR_DATABASE_PASSWORD="$$(cat /run/geox/executor/db_password)"
        exec node apps/server/dist/database/bline_commercial_principal_bootstrap.js
    environment:
      GEOX_DB_PLATFORM_ADMIN_DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - geox_v1_telemetry_credentials:/run/geox/telemetry:ro
      - geox_v1_jobs_credentials:/run/geox/jobs:ro
      - geox_v1_executor_credentials:/run/geox/executor:ro
    depends_on:
      commercial-principal-secret-init:
        condition: service_completed_successfully
      server:
        condition: service_healthy

  mqtt:
    image: eclipse-mosquitto:2
    container_name: geox-v1-mqtt
    environment:
      GEOX_TELEMETRY_MQTT_USERNAME: ${GEOX_TELEMETRY_MQTT_USERNAME:-geox_telemetry_ingest_v1}
      GEOX_EXECUTOR_MQTT_USERNAME: ${GEOX_EXECUTOR_MQTT_USERNAME:-geox_executor_v1}
    volumes:
      - geox_v1_telemetry_credentials:/run/geox/telemetry:ro
      - geox_v1_executor_credentials:/run/geox/executor:ro
    depends_on:
      commercial-principal-secret-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-ceu"]
    command:
      - |
        mkdir -p /tmp/mosquitto-config /tmp/mosquitto-data /tmp/mosquitto-log
        printf 'listener 1883 0.0.0.0\nallow_anonymous false\npassword_file /tmp/mosquitto-config/passwords\nacl_file /tmp/mosquitto-config/acl\npersistence false\n' > /tmp/mosquitto-config/mosquitto.conf
        mosquitto_passwd -b -c /tmp/mosquitto-config/passwords "$$GEOX_TELEMETRY_MQTT_USERNAME" "$$(cat /run/geox/telemetry/mqtt_password)"
        mosquitto_passwd -b /tmp/mosquitto-config/passwords "$$GEOX_EXECUTOR_MQTT_USERNAME" "$$(cat /run/geox/executor/mqtt_password)"
        printf 'user %s\ntopic read telemetry/+/+\ntopic read heartbeat/+/+\n\nuser %s\ntopic write #\n' "$$GEOX_TELEMETRY_MQTT_USERNAME" "$$GEOX_EXECUTOR_MQTT_USERNAME" > /tmp/mosquitto-config/acl
        exec mosquitto -c /tmp/mosquitto-config/mosquitto.conf
    ports:
      - "1883:1883"

  minio:
    image: minio/minio:latest
    container_name: geox-v1-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "9000:9000"
      - "9002:9001"
    volumes:
      - geox_v1_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live > /dev/null"]
      interval: 3s
      timeout: 2s
      retries: 30

  minio-init:
    image: minio/mc:latest
    container_name: geox-v1-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      GEOX_EVIDENCE_S3_BUCKET: ${GEOX_EVIDENCE_S3_BUCKET:-evidence-exports-v1}
    restart: "no"
    entrypoint: ["/bin/sh", "-ceu"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "[minio-init] waiting for minio"
          sleep 1
        done
        echo "[minio-init] creating bucket $$GEOX_EVIDENCE_S3_BUCKET (idempotent)"
        mc mb --ignore-existing local/"$$GEOX_EVIDENCE_S3_BUCKET"
        echo "[minio-init] verifying bucket exists: $$GEOX_EVIDENCE_S3_BUCKET"
        mc stat local/"$$GEOX_EVIDENCE_S3_BUCKET"
        echo "[minio-init] listing buckets"
        mc ls local
        echo "[minio-init] setting bucket policy private (idempotent)"
        mc anonymous set private local/"$$GEOX_EVIDENCE_S3_BUCKET" || true
        echo "[minio-init] done"

  server:
    build:
      context: .
      dockerfile: docker/runtime.Dockerfile
      args:
        BUILD_COMMAND: pnpm --filter @geox/contracts build && pnpm --filter @geox/control-kernel build && pnpm --filter @geox/device-skills build && pnpm --filter @geox/skill-registry build && pnpm --filter @geox/server build
    image: geox/server-runtime:local
    container_name: geox-v1-server
    working_dir: /app
    init: true
    restart: unless-stopped
    command: ["node", "apps/server/dist/server.js"]
    environment:
      DB_DRIVER: postgres
      DATABASE_URL: postgres://geox_runtime_v1:${GEOX_RUNTIME_DATABASE_PASSWORD:?GEOX_RUNTIME_DATABASE_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      GEOX_RUNTIME_DATABASE_URL: postgres://geox_runtime_v1:${GEOX_RUNTIME_DATABASE_PASSWORD:?GEOX_RUNTIME_DATABASE_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      GEOX_RUNTIME_DATABASE_ROLE: geox_runtime_v1
      GEOX_MCFT_CAP_07_STARTUP_PREFLIGHT_REQUIRED: "1"
      DB_STRICT: "1"
      NODE_ENV: production
      GEOX_RUNTIME_ENV: ${GEOX_RUNTIME_ENV:-pilot}
      GEOX_TOKENS_JSON: ${GEOX_TOKENS_JSON:-}
      GEOX_TOKENS_FILE: ${GEOX_TOKENS_FILE:-}
      GEOX_SYSTEM_PROFILE: controlled_pilot
      GEOX_INTERNAL_BASE_URL: http://server:3000
      GEOX_INTERNAL_TASK_ISSUER_TOKEN_ID: ${GEOX_INTERNAL_TASK_ISSUER_TOKEN_ID:-tok_internal_task_issuer_v1}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      GEOX_ALLOWED_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      GEOX_APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      GEOX_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      MQTT_AUTH_REQUIRED: "1"
      GEOX_MQTT_AUTH_REQUIRED: "1"
      # Compatibility assertion for runtime_security_v1 only. This is not a Mosquitto credential.
      MQTT_PASSWORD: ${APP_SECRET:?APP_SECRET is required}
      GEOX_EXECUTION_DEFAULT_DISABLED: ${GEOX_EXECUTION_DEFAULT_DISABLED:-1}
      GEOX_EXECUTION_ENABLE_EXPLICITLY: ${GEOX_EXECUTION_ENABLE_EXPLICITLY:-0}
      GEOX_EXECUTION_ENABLE_REASON: ${GEOX_EXECUTION_ENABLE_REASON:-controlled-pilot-runtime-explicit}
      GEOX_DEVTOOLS_ENABLED: ${GEOX_DEVTOOLS_ENABLED:-0}
      ALERT_WEBHOOK_URL: ""
      ALERT_WECHAT_WEBHOOK_URL: ""
      ALERT_DINGTALK_WEBHOOK_URL: ""
      ALERT_EMAIL_WEBHOOK_URL: ""
      ALERT_EMAIL_TO: ""
      TWILIO_ACCOUNT_SID: ""
      TWILIO_AUTH_TOKEN: ""
      TWILIO_FROM_NUMBER: ""
      ALERT_SMS_TO: ""
      GEOX_EVIDENCE_STORAGE_MODE: S3_COMPAT
      GEOX_EVIDENCE_S3_ENDPOINT: http://minio:9000
      GEOX_EVIDENCE_S3_PUBLIC_ENDPOINT: ${GEOX_EVIDENCE_S3_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
      GEOX_EVIDENCE_S3_BUCKET: ${GEOX_EVIDENCE_S3_BUCKET:-evidence-exports-v1}
      GEOX_EVIDENCE_S3_REGION: us-east-1
      GEOX_EVIDENCE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      GEOX_EVIDENCE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      GEOX_EVIDENCE_S3_FORCE_PATH_STYLE: "true"
      GEOX_EVIDENCE_S3_PRESIGN_TTL_SEC: "900"
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mcft-cap07-migration:
        condition: service_completed_successfully
      mqtt:
        condition: service_started
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s

  telemetry-ingest:
    build:
      context: .
      dockerfile: docker/runtime.Dockerfile
      args:
        BUILD_COMMAND: pnpm --filter @geox/contracts build && pnpm --filter @geox/device-skills build && pnpm --filter @geox/skill-registry build && pnpm --filter @geox/telemetry-ingest build
    image: geox/telemetry-ingest-runtime:local
    container_name: geox-v1-telemetry-ingest
    working_dir: /app
    init: true
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ceu"]
    command:
      - |
        export DATABASE_URL="postgres://geox_telemetry_ingest_v1:$$(cat /run/geox/telemetry/db_password)@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}"
        export GEOX_MQTT_PASSWORD="$$(cat /run/geox/telemetry/mqtt_password)"
        exec node apps/telemetry-ingest/dist/apps/telemetry-ingest/src/main.js
    environment:
      DB_DRIVER: postgres
      DB_STRICT: "1"
      NODE_ENV: production
      GEOX_RUNTIME_ENV: ${GEOX_RUNTIME_ENV:-pilot}
      GEOX_SYSTEM_PROFILE: controlled_pilot
      GEOX_BASE_URL: http://server:3000
      GEOX_TENANT_ID: tenantA
      GEOX_PROJECT_ID: projectA
      GEOX_GROUP_ID: groupA
      GEOX_MQTT_URL: mqtt://mqtt:1883
      GEOX_MQTT_USERNAME: ${GEOX_TELEMETRY_MQTT_USERNAME:-geox_telemetry_ingest_v1}
    volumes:
      - geox_v1_telemetry_credentials:/run/geox/telemetry:ro
    depends_on:
      postgres:
        condition: service_healthy
      bline-commercial-principal-bootstrap:
        condition: service_completed_successfully
      server:
        condition: service_started

  jobs:
    build:
      context: .
      dockerfile: docker/runtime.Dockerfile
      args:
        BUILD_COMMAND: pnpm --filter @geox/contracts build && pnpm --filter @geox/control-kernel build && pnpm --filter @geox/device-skills build && pnpm --filter @geox/skill-registry build && pnpm --filter @geox/server build
    image: geox/jobs-runtime:local
    container_name: geox-v1-jobs
    working_dir: /app
    init: true
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ceu"]
    command:
      - |
        export DATABASE_URL="postgres://geox_jobs_v1:$$(cat /run/geox/jobs/db_password)@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}"
        exec node apps/server/dist/jobs/runtime.js
    environment:
      DB_DRIVER: postgres
      DB_STRICT: "1"
      NODE_ENV: production
      GEOX_RUNTIME_ENV: ${GEOX_RUNTIME_ENV:-pilot}
      GEOX_SYSTEM_PROFILE: controlled_pilot
      GEOX_WORKER_ID: geox-v1-jobs
      GEOX_WORKER_TYPE: jobs
      GEOX_BASE_URL: http://server:3000
      GEOX_TENANT_ID: tenantA
      GEOX_PROJECT_ID: projectA
      GEOX_GROUP_ID: groupA
      AGRONOMY_AGENT_ENABLED: "1"
    volumes:
      - geox_v1_jobs_credentials:/run/geox/jobs:ro
    depends_on:
      postgres:
        condition: service_healthy
      bline-commercial-principal-bootstrap:
        condition: service_completed_successfully
      server:
        condition: service_started

  executor:
    build:
      context: .
      dockerfile: docker/runtime.Dockerfile
      args:
        BUILD_COMMAND: pnpm --filter @geox/contracts build && pnpm --filter @geox/control-kernel build && pnpm --filter @geox/device-skills build && pnpm --filter @geox/skill-registry build && pnpm --filter @geox/executor build
    image: geox/executor-runtime:local
    working_dir: /app
    init: true
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ceu"]
    command:
      - |
        export DATABASE_URL="postgres://geox_executor_runtime_v1:$$(cat /run/geox/executor/db_password)@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}"
        export GEOX_MQTT_PASSWORD="$$(cat /run/geox/executor/mqtt_password)"
        exec node apps/executor/dist/runtime_loop.js
    environment:
      DB_DRIVER: postgres
      DB_STRICT: "1"
      NODE_ENV: production
      GEOX_RUNTIME_ENV: ${GEOX_RUNTIME_ENV:-pilot}
      GEOX_SYSTEM_PROFILE: controlled_pilot
      GEOX_WORKER_ID: geox-v1-executor
      GEOX_WORKER_TYPE: executor
      GEOX_INTERNAL_BASE_URL: http://server:3000
      GEOX_BASE_URL: http://server:3000
      GEOX_AO_ACT_TOKEN: ${GEOX_EXECUTOR_TOKEN:?GEOX_EXECUTOR_TOKEN is required}
      GEOX_EXECUTOR_ID: ${GEOX_EXECUTOR_ID:-}
      GEOX_TENANT_ID: tenantA
      GEOX_PROJECT_ID: projectA
      GEOX_GROUP_ID: groupA
      GEOX_MQTT_URL: mqtt://mqtt:1883
      GEOX_MQTT_USERNAME: ${GEOX_EXECUTOR_MQTT_USERNAME:-geox_executor_v1}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-3000}
      ALERT_WEBHOOK_URL: ""
      ALERT_WECHAT_WEBHOOK_URL: ""
      ALERT_DINGTALK_WEBHOOK_URL: ""
      ALERT_EMAIL_WEBHOOK_URL: ""
      ALERT_EMAIL_TO: ""
      TWILIO_ACCOUNT_SID: ""
      TWILIO_AUTH_TOKEN: ""
      TWILIO_FROM_NUMBER: ""
      ALERT_SMS_TO: ""
    volumes:
      - geox_v1_executor_credentials:/run/geox/executor:ro
    depends_on:
      postgres:
        condition: service_healthy
      bline-commercial-principal-bootstrap:
        condition: service_completed_successfully
      server:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: geox/web-runtime:local
    container_name: geox-v1-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  geox_v1_pgdata:
  geox_v1_minio_data:
  geox_v1_telemetry_credentials:
    name: geox-v1-telemetry-credentials
  geox_v1_jobs_credentials:
    name: geox-v1-jobs-credentials
  geox_v1_executor_credentials:
    name: geox-v1-executor-credentials

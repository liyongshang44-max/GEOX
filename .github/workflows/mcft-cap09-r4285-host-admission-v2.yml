name: R4285 Host Admission V2 contract negatives
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/runtime_acceptance/MCFT_CAP09_R4285_ADMISSION_V2.cjs'
      - 'scripts/runtime_acceptance/MCFT_CAP09_R4285_HOST_ADMISSION_V2.cjs'
      - 'scripts/runtime_acceptance/MCFT_CAP09_R4285_WINDOWS_HOST_V2.cjs'
      - 'scripts/runtime_acceptance/MCFT_CAP09_R4285_PERMIT_ATOMIC_V2.cjs'
      - 'scripts/runtime_acceptance/MCFT_CAP09_R4285_STAGE_CAPABILITY_V2.cjs'
      - 'scripts/runtime_acceptance/MCFT_CAP09_R4285_PARENT_STAGE_DISPATCH_V2.cjs'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP09_R4285_V2_WINDOWS_EXECUTION_WIRING.test.cjs'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP09_R4285_ADMISSION_V2.test.cjs'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP09_R4285_HOST_ADMISSION_V2.test.cjs'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP09_R4285_V2_PERMIT_WINDOW.test.cjs'
      - '.github/workflows/mcft-cap09-r4285-host-admission-v2.yml'
jobs:
  contract-negatives:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and fail-closed contract tests
        run: |
          node --check scripts/runtime_acceptance/MCFT_CAP09_R4285_ADMISSION_V2.cjs
          node --check scripts/runtime_acceptance/MCFT_CAP09_R4285_HOST_ADMISSION_V2.cjs
          node --check scripts/runtime_acceptance/MCFT_CAP09_R4285_WINDOWS_HOST_V2.cjs
          node --check scripts/runtime_acceptance/MCFT_CAP09_R4285_PERMIT_ATOMIC_V2.cjs
          node --check scripts/runtime_acceptance/MCFT_CAP09_R4285_STAGE_CAPABILITY_V2.cjs
          node --check scripts/runtime_acceptance/MCFT_CAP09_R4285_PARENT_STAGE_DISPATCH_V2.cjs
          node --test scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP09_R4285_ADMISSION_V2.test.cjs scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP09_R4285_HOST_ADMISSION_V2.test.cjs scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP09_R4285_V2_PERMIT_WINDOW.test.cjs scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP09_R4285_V2_WINDOWS_EXECUTION_WIRING.test.cjs
      - name: No permit or physical action on CI
        run: echo 'NON_AUTHORIZED_SYNTHETIC_CONTRACT_TESTS_ONLY'

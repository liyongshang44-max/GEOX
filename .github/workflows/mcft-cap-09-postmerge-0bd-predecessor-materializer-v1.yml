name: mcft-cap-09-postmerge-0bd-predecessor-materializer-v1

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-postmerge-0bd-predecessor-materializer-v1.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact governance carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize bounded 0bd predecessor governance blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance-output
          node <<'NODE'
          const fs = require('node:fs');
          const predecessor = '0bd2300c9c8a58025df9212d7c14e640606add83';
          const previous = '5050f1c08d2528048c56d56add4cbb068b956925';
          const oldVar = 'TWIN_V2_RUNTIME_SELECTION_ADOPTION_PROTECTED_MAIN_PREDECESSOR_SHA';
          const newVar = 'TWIN_V2_RUNTIME_SELECTION_ADOPTION_MERGE_PROTECTED_MAIN_PREDECESSOR_SHA';
          const qcpWorkflow = '.github/workflows/mcft-cap-09-qualification-control-plane-v1.yml';
          const postMergeWorkflow = '.github/workflows/mcft-cap-09-post-merge-v13-control-plane-v1.yml';
          const qcpAuthority = 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-CONTROL-PLANE-V1.json';
          const evidenceRegistry = 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-EVIDENCE-REGISTRY-V1.json';
          const preflight = 'scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_ALL_BLOCKERS_V1.cjs';
          const targets = [qcpWorkflow, postMergeWorkflow, qcpAuthority, evidenceRegistry, preflight];

          function replaceOnce(text, before, after, code) {
            const count = text.split(before).length - 1;
            if (count !== 1) throw new Error(`${code}:COUNT=${count}`);
            return text.replace(before, after);
          }

          let qcp = fs.readFileSync(qcpWorkflow, 'utf8');
          const qcpEnv = `  ${oldVar}: '${previous}'\n`;
          qcp = replaceOnce(qcp, qcpEnv, qcpEnv + `  ${newVar}: '${predecessor}'\n`, 'QCP_ENV_ANCHOR');
          const qcpGuard = `[ \"$base\" != \"$${oldVar}\" ]; then`;
          qcp = replaceOnce(qcp, qcpGuard, `[ \"$base\" != \"$${oldVar}\" ] && [ \"$base\" != \"$${newVar}\" ]; then`, 'QCP_BASE_GUARD');
          const qcpExpected = `process.env.${oldVar}];`;
          qcp = replaceOnce(qcp, qcpExpected, `process.env.${oldVar}, process.env.${newVar}];`, 'QCP_EXPECTED_PREDECESSOR_SET');
          fs.writeFileSync(qcpWorkflow, qcp);

          let post = fs.readFileSync(postMergeWorkflow, 'utf8');
          const postEnv = `  ${oldVar}: '${previous}'\n`;
          post = replaceOnce(post, postEnv, postEnv + `  ${newVar}: '${predecessor}'\n`, 'POSTMERGE_ENV_ANCHOR');
          const postGuard = `[ \"$base_sha\" != \"$${oldVar}\" ]; then`;
          post = replaceOnce(post, postGuard, `[ \"$base_sha\" != \"$${oldVar}\" ] && [ \"$base_sha\" != \"$${newVar}\" ]; then`, 'POSTMERGE_BASE_GUARD');
          fs.writeFileSync(postMergeWorkflow, post);

          let authority = fs.readFileSync(qcpAuthority, 'utf8');
          const authorityAnchor = `    \"${previous}\"\n  ],\n  \"stacked_predecessor_branch\"`;
          authority = replaceOnce(authority, authorityAnchor, `    \"${previous}\",\n    \"${predecessor}\"\n  ],\n  \"stacked_predecessor_branch\"`, 'QCP_AUTHORITY_PREDECESSOR_SET');
          JSON.parse(authority);
          fs.writeFileSync(qcpAuthority, authority);

          let evidence = fs.readFileSync(evidenceRegistry, 'utf8');
          const evidenceAnchor = `          \"${previous}\"\n        ],\n        \"dependency_digest_must_match_current\": true,`;
          evidence = replaceOnce(evidence, evidenceAnchor, `          \"${previous}\",\n          \"${predecessor}\"\n        ],\n        \"dependency_digest_must_match_current\": true,`, 'EVIDENCE_GOVERNED_PREDECESSOR_SET');
          JSON.parse(evidence);
          fs.writeFileSync(evidenceRegistry, evidence);

          let pre = fs.readFileSync(preflight, 'utf8');
          const oldConst = `    const twinV2RuntimeSelectionAdoptionProtectedMainBase = String(process.env.${oldVar} || \"\");\n`;
          const newConst = `    const twinV2RuntimeSelectionAdoptionMergeProtectedMainBase = String(process.env.${newVar} || \"\");\n`;
          pre = replaceOnce(pre, oldConst, oldConst + newConst, 'PREFLIGHT_ENV_ANCHOR');
          const oldBase = '        (/^[0-9a-f]{40}$/.test(twinV2RuntimeSelectionAdoptionProtectedMainBase) && args.base === twinV2RuntimeSelectionAdoptionProtectedMainBase)\n';
          const newBase = '        (/^[0-9a-f]{40}$/.test(twinV2RuntimeSelectionAdoptionProtectedMainBase) && args.base === twinV2RuntimeSelectionAdoptionProtectedMainBase) ||\n        (/^[0-9a-f]{40}$/.test(twinV2RuntimeSelectionAdoptionMergeProtectedMainBase) && args.base === twinV2RuntimeSelectionAdoptionMergeProtectedMainBase)\n';
          pre = replaceOnce(pre, oldBase, newBase, 'PREFLIGHT_DURABLE_BASE_ANCHOR');
          fs.writeFileSync(preflight, pre);

          const outputs = {};
          async function createBlob(path) {
            const content = fs.readFileSync(path, 'utf8');
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({content, encoding:'utf-8'}),
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`CREATE_BLOB_FAILED:${path}:${response.status}:${body}`);
            const parsed = JSON.parse(body);
            if (!/^[0-9a-f]{40}$/.test(parsed.sha || '')) throw new Error(`CREATE_BLOB_INVALID_SHA:${path}`);
            outputs[path] = parsed.sha;
            console.log(`MATERIALIZED_BLOB ${path} ${parsed.sha}`);
          }

          Promise.all(targets.map(createBlob)).then(() => {
            fs.writeFileSync('acceptance-output/MCFT_CAP_09_POSTMERGE_0BD_PREDECESSOR_MATERIALIZER_V1.json', JSON.stringify({
              schema:'geox_mcft_cap09_postmerge_0bd_predecessor_materializer_v1',
              status:'PASS',
              predecessor_sha:predecessor,
              authority_ceiling:{
                runtime_mutation:false,
                production_rolling_authority_activation:false,
                production_runtime_restart:false,
                formal_v5_arm:false,
                a0_execution:false,
                o00_started:false,
                b_line_touched:false,
                mcft_cap09_completed:false
              },
              blobs:outputs
            }, null, 2) + '\n');
          }).catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload materializer result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-postmerge-0bd-predecessor-materializer-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/MCFT_CAP_09_POSTMERGE_0BD_PREDECESSOR_MATERIALIZER_V1.json
          if-no-files-found: error
          retention-days: 7

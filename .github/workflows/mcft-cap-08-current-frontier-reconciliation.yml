name: mcft-cap-08-current-frontier-reconciliation

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-08-current-frontier-reconciliation.yml'
      - 'docs/digital_twin/GEOX-DIGITAL-TWIN-MASTER-TASK-LINE-V2.md'
      - 'docs/digital_twin/GEOX-DT-02-MCFT-IMPLEMENTATION-MAP-V2.md'
      - 'docs/digital_twin/GEOX-MCFT-VERTICAL-CAPABILITY-LINE-MATRIX-V2.json'
      - 'docs/digital_twin/mcft/GEOX-MCFT-SSOT-CURRENT-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-CURRENT-FRONTIER-V1.json'
      - 'docs/handoff/GEOX-MCFT-CAP-08-S6-HANDOFF.md'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_CURRENT_FRONTIER_RECONCILIATION.cjs'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S5-EFFECTIVENESS-AUTHORITY-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S5_EFFECTIVENESS_SETTLEMENT.cjs'
      - '.github/workflows/mcft-cap-08-s5-architecture-deviation-adjudication.yml'
      - '.github/workflows/mcft-cap-08-s5-replay-dataset-v2-prequalification.yml'
      - '.github/workflows/mcft-cap-08-s5-replay-dataset-v2-exact-sha-attestation.yml'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S5-ARCHITECTURE-DEVIATION-ADJUDICATION-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S5-ARCHITECTURE-DEVIATION-STATUS-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S5-REPLAY-DATASET-V2-PREQUALIFICATION-CONTRACT-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S5-REPLAY-DATASET-V2-WORKFLOW-DECLARATION-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S5_ARCHITECTURE_DEVIATION_ADJUDICATION.cjs'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S5_REPLAY_DATASET_V2_PREQUALIFICATION_BOUNDARY.cjs'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_08_S5_REPLAY_DATASET_V2_PREQUALIFICATION_DB.ts'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: read
  statuses: read

concurrency:
  group: mcft-cap08-current-frontier-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  current-frontier-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 20.11.1 }
      - name: Download exact S6 completion authority
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 8891897316
          path: acceptance-input/s6-exact-sha
          repository: liyongshang44-max/GEOX
          github-token: ${{ github.token }}
      - name: Validate current frontier transition
        env:
          MCFT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          MCFT_S6_ARTIFACT_DIR: acceptance-input/s6-exact-sha
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance-output
          files="$(git diff --name-only "$MCFT_BASE_SHA"...HEAD)"
          if grep -Fxq 'docs/handoff/GEOX-MCFT-CAP-08-S6-HANDOFF.md' <<<"$files"; then
            node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_CURRENT_FRONTIER_RECONCILIATION.cjs
          elif grep -Fxq 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S5-EFFECTIVENESS-AUTHORITY-V1.json' <<<"$files"; then
            node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S5_EFFECTIVENESS_SETTLEMENT.cjs
            cp acceptance-output/MCFT_CAP_08_S5_EFFECTIVENESS_SETTLEMENT_RESULT.json acceptance-output/MCFT_CAP_08_CURRENT_FRONTIER_RECONCILIATION_RESULT.json
          elif grep -Eq 'S5_REPLAY_DATASET_V2_PREQUALIFICATION|mcft_cap08_s5_prequalification|replay-dataset-v2' <<<"$files"; then
            node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S5_REPLAY_DATASET_V2_PREQUALIFICATION_BOUNDARY.cjs | tee acceptance-output/MCFT_CAP_08_CURRENT_FRONTIER_RECONCILIATION_RESULT.json
          else
            node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S5_ARCHITECTURE_DEVIATION_ADJUDICATION.cjs | tee acceptance-output/MCFT_CAP_08_CURRENT_FRONTIER_RECONCILIATION_RESULT.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap-08-current-frontier-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: acceptance-output/MCFT_CAP_08_CURRENT_FRONTIER_RECONCILIATION_RESULT.json
          if-no-files-found: error
          retention-days: 90

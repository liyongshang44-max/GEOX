name: mcft-cap-09-t3r1-persistent-lifecycle-qualification

on:
  push:
    branches:
      - agent/mcft-cap09-t3r1-persistent-lifecycle-qualification
    paths:
      - '.github/workflows/mcft-cap-09-t3r1-persistent-lifecycle-qualification.yml'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-T3R1-PERSISTENT-LIFECYCLE-QUALIFICATION-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_T3R1_PERSISTENT_LIFECYCLE_QUALIFICATION.cjs'
      - 'scripts/runtime_acceptance/PROBE_MCFT_CAP_09_T3R1_PERSISTENT_LIFECYCLE_QUALIFICATION.mjs'
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-t3r1-persistent-lifecycle-qualification.yml'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-T3R1-PERSISTENT-LIFECYCLE-QUALIFICATION-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_T3R1_PERSISTENT_LIFECYCLE_QUALIFICATION.cjs'
      - 'scripts/runtime_acceptance/PROBE_MCFT_CAP_09_T3R1_PERSISTENT_LIFECYCLE_QUALIFICATION.mjs'

permissions:
  contents: read

concurrency:
  group: mcft-cap09-t3r1-persistent-lifecycle-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  t3r1-persistent-lifecycle-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm

      - name: Resolve exact stacked base and subject
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "subject_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_sha=e556e8c4a3ba601bc73af42077afc557a9715781" >> "$GITHUB_OUTPUT"
            echo "subject_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install exact repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for KBS live qualification
        run: pnpm exec playwright install --with-deps chromium

      - name: Syntax-check qualification code
        run: |
          node --check scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_T3R1_PERSISTENT_LIFECYCLE_QUALIFICATION.cjs
          node --check scripts/runtime_acceptance/PROBE_MCFT_CAP_09_T3R1_PERSISTENT_LIFECYCLE_QUALIFICATION.mjs

      - name: Validate exact stacked governance boundary
        env:
          MCFT_BASE_SHA: ${{ steps.authority.outputs.base_sha }}
          MCFT_SUBJECT_SHA: ${{ steps.authority.outputs.subject_sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_T3R1_PERSISTENT_LIFECYCLE_QUALIFICATION.cjs

      - name: Execute live T3R1 persistent lifecycle qualification
        env:
          MCFT_SUBJECT_SHA: ${{ steps.authority.outputs.subject_sha }}
        run: node scripts/runtime_acceptance/PROBE_MCFT_CAP_09_T3R1_PERSISTENT_LIFECYCLE_QUALIFICATION.mjs

      - name: Verify truthful persistent-state result contract
        shell: node {0}
        run: |
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_T3R1_PERSISTENT_LIFECYCLE_QUALIFICATION_RESULT.json','utf8'));
          const subject = '${{ steps.authority.outputs.subject_sha }}';
          if (result.status !== 'PASS') throw new Error('T3R1_PERSISTENT_LIVE_PASS_REQUIRED');
          if (result.subject_sha !== subject) throw new Error('T3R1_PERSISTENT_EXACT_HEAD_RESULT_REQUIRED');
          if (result.lifecycle_establishment?.status !== 'RESOLVED_CANDIDATE') throw new Error('T3R1_PERSISTENT_ESTABLISHMENT_REQUIRED');
          if (result.lifecycle_establishment?.crop !== 'corn' || result.lifecycle_establishment?.hybrid_product_code !== 'P0306Q' || result.lifecycle_establishment?.replicate_1_explicitly_included !== true) throw new Error('T3R1_PERSISTENT_ESTABLISHMENT_SCOPE_REQUIRED');
          if (result.transition_sweep?.provider_coverage_completeness_proven !== false) throw new Error('T3R1_PERSISTENT_COMPLETENESS_CLAIM_FORBIDDEN');
          if (result.transition_sweep?.proved_no_termination_occurred !== false) throw new Error('T3R1_PERSISTENT_PROVED_NO_TERMINATION_FORBIDDEN');
          if (result.transition_sweep?.provider_silence_used_as_evidence !== false) throw new Error('T3R1_PERSISTENT_SILENCE_EVIDENCE_FORBIDDEN');
          if (result.transition_sweep?.provider_retrieval_time_used_as_coverage_watermark !== false) throw new Error('T3R1_PERSISTENT_RETRIEVAL_WATERMARK_FORBIDDEN');
          if (result.lifecycle_horizon?.maximum_total_days !== 180 || result.lifecycle_horizon?.creates_active !== false || result.lifecycle_horizon?.truncation_only !== true || result.lifecycle_horizon?.support_event_renewal_used !== false) throw new Error('T3R1_PERSISTENT_HORIZON_CONTRACT_REQUIRED');
          if (result.season_lifecycle?.observation_freshness_refreshed_by_persistence !== false || result.season_lifecycle?.evaluated_at_emitted_as_observed_at !== false) throw new Error('T3R1_PERSISTENT_OBSERVATION_NONCLAIM_REQUIRED');
          if (result.amendment_16_effectiveness?.amendment_16_effective_on_protected_main_for_this_stacked_run !== false || result.amendment_16_effectiveness?.current_result_may_be_adopted_as_protected_main_authority !== false || result.amendment_16_effectiveness?.exact_main_rerun_required_after_effectiveness !== true) throw new Error('T3R1_PERSISTENT_STACKED_NONAUTHORITY_REQUIRED');
          for (const field of ['runtime_write_count','database_write_count','scheduler_write_count','formal_evidence_write_count']) {
            if (result[field] !== 0) throw new Error(`T3R1_PERSISTENT_ZERO_WRITE_REQUIRED:${field}`);
          }
          if (result.ea5e2_operational_activation_qualified !== false || result.formal_window_started !== false || result.formal_execution_count !== '0/24') throw new Error('T3R1_PERSISTENT_OPERATIONAL_EFFECT_FORBIDDEN');

          const outcome = result.qualification_outcome;
          if (!['ACTIVE_CANDIDATE','TERMINATED','CONFLICTED','EXPIRED'].includes(outcome)) throw new Error(`T3R1_PERSISTENT_OUTCOME_INVALID:${outcome}`);
          if (outcome === 'ACTIVE_CANDIDATE') {
            if (result.transition_sweep?.known_termination_result !== 'NONE_FOUND' || result.transition_sweep?.known_termination_count !== 0) throw new Error('T3R1_PERSISTENT_ACTIVE_REQUIRES_NO_KNOWN_TERMINATION');
            if (result.transition_sweep?.known_contradiction_result !== 'NONE_FOUND' || result.transition_sweep?.known_contradiction_count !== 0) throw new Error('T3R1_PERSISTENT_ACTIVE_REQUIRES_NO_KNOWN_CONTRADICTION');
            if (result.lifecycle_horizon?.valid_at_evaluation_time !== true) throw new Error('T3R1_PERSISTENT_ACTIVE_REQUIRES_VALID_HORIZON');
            if (result.season_lifecycle?.domain_state !== 'ACTIVE' || result.season_lifecycle?.authority_status !== 'RESOLVED' || result.season_lifecycle?.authority_validity !== 'VALID' || result.season_lifecycle?.authority_mode !== 'GOVERNED_PERSISTENT_STATE' || result.season_lifecycle?.active_consumable_candidate !== true) throw new Error('T3R1_PERSISTENT_ACTIVE_STATE_CONTRACT_REQUIRED');
          } else if (outcome === 'TERMINATED') {
            if (result.season_lifecycle?.domain_state !== 'TERMINATED' || result.season_lifecycle?.authority_status !== 'RESOLVED' || !result.season_lifecycle?.termination_event_id) throw new Error('T3R1_PERSISTENT_TERMINATED_CONTRACT_REQUIRED');
          } else if (outcome === 'CONFLICTED') {
            if (result.season_lifecycle?.authority_status !== 'CONFLICTED' || result.season_lifecycle?.active_consumable_candidate !== false) throw new Error('T3R1_PERSISTENT_CONFLICTED_CONTRACT_REQUIRED');
          } else if (outcome === 'EXPIRED') {
            if (result.season_lifecycle?.authority_validity !== 'EXPIRED' || result.season_lifecycle?.active_consumable_candidate !== false || result.season_lifecycle?.termination_event_id !== null) throw new Error('T3R1_PERSISTENT_EXPIRED_CONTRACT_REQUIRED');
          }

          console.log(JSON.stringify({
            status:'PASS',
            outcome,
            establishment_observation_id:result.lifecycle_establishment.provider_observation_id,
            known_termination:result.transition_sweep.known_termination_result,
            known_contradiction:result.transition_sweep.known_contradiction_result,
            last_support:result.continuity_support,
            horizon_end:result.lifecycle_horizon.horizon_end_utc,
            lifecycle:result.season_lifecycle,
            next_frontier:result.next_frontier
          }));

      - name: Upload sanitized stacked qualification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-t3r1-persistent-lifecycle-${{ steps.authority.outputs.subject_sha }}
          path: |
            acceptance-output/MCFT_CAP_09_T3R1_PERSISTENT_LIFECYCLE_QUALIFICATION_GOVERNANCE_RESULT.json
            acceptance-output/MCFT_CAP_09_T3R1_PERSISTENT_LIFECYCLE_QUALIFICATION_RESULT.json
          if-no-files-found: error
          retention-days: 90

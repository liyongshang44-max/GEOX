name: pfe-14-class-b-operational-projection-adjudication-v1

on:
  pull_request:
    paths:
      - 'docs/frontend-productization/PFE-14-CLASS-B-OPERATIONAL-PROJECTION-ADJUDICATION-V1.md'
      - 'docs/frontend-productization/PFE-14-CLASS-B-OPERATIONAL-PROJECTION-ADJUDICATION-V1.json'
      - 'scripts/frontend_acceptance/ACCEPTANCE_PFE_14_CLASS_B_OPERATIONAL_PROJECTION_ADJUDICATION_V1.cjs'
      - '.github/workflows/pfe-14-class-b-operational-projection-adjudication-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  class-b-adjudication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
      - name: Revalidate Evidence Health qualification
        run: node scripts/frontend_acceptance/ACCEPTANCE_PFE_14_EVIDENCE_HEALTH_PRODUCTIZATION_QUALIFICATION_V1.cjs
      - name: Validate Class-B operational projection adjudication
        run: node scripts/frontend_acceptance/ACCEPTANCE_PFE_14_CLASS_B_OPERATIONAL_PROJECTION_ADJUDICATION_V1.cjs

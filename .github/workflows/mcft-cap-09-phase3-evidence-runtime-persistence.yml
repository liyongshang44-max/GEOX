      - 'apps/server/src/external_evidence/s3_compatible_private_evidence_object_client_v1.ts'
      - 'apps/server/src/external_evidence/s3_compatible_private_candidate_manifest_store_v1.ts'
      - 'apps/server/src/external_evidence/mcft_cap09_phase7_private_candidate_capture_promotion_v1.ts'
      - 'apps/server/src/external_evidence/s3_compatible_private_retained_raw_reader_v1.ts'
      - 'apps/server/src/external_evidence/verified_retained_raw_replay_v1.ts'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_GFS_PARTIAL_PAIR_REHYDRATION_V1.ts'
      - 'apps/server/src/external_evidence/mcft_cap09_gfs_partial_pair_rehydration_v1.ts'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_KBS_RAW_HOURLY_PUBLICATION_CYCLE_V1.ts'
      - 'apps/server/src/external_evidence/mcft_cap09_kbs_raw_hourly_publication_cycle_service_v1.ts'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_VERIFIED_RETAINED_RAW_REPLAY_V1.ts'
      - 'apps/server/src/persistence/external_evidence/postgres_external_formal_evidence_visibility_v1.ts'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EXTERNAL_EVIDENCE_FACT_REPLAY_PROVENANCE_V1.ts'
      - 'apps/server/src/persistence/external_evidence/postgres_external_evidence_fact_replay_provenance_v1.ts'
      - 'apps/server/src/persistence/twin_runtime/postgres_external_formal_evidence_ingress_v1.ts'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-PRODUCTION-HOSTING-ARCHITECTURE-AND-DEVELOPMENT-ROUTE-V1.md'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PHASE7_PRIVATE_CANDIDATE_IO_V1.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcft-cap09-phase3-evidence-persistence-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  postgres-evidence-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phase3_evidence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d phase3_evidence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/phase3_evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact repository dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned GFS scientific stack and prove product decoder
        run: |
          python -m pip install --disable-pip-version-check             'eccodes==2.47.0'             'eccodeslib==2.47.3.23'             'numpy==1.26.4'             'refet==0.4.2'
          python -m eccodes selfcheck
          python apps/server/src/external_evidence/provider/python/mcft_cap09_gfs_scientific_core_v1.py selftest
          python apps/server/src/external_evidence/provider/python/mcft_cap09_gfs_raw_bundle_decoder_v1.py selftest
          python apps/server/src/external_evidence/provider/python/mcft_cap09_kbs_raw_hourly_scientific_core_v1.py selftest
      - name: Apply Phase3 Evidence persistence schema only
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/server/db/migrations/2026_08_27_mcft_cap_09_phase3_evidence_runtime_persistence.sql
      - name: Apply idempotent KBS publication baseline pointer extension
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/server/db/migrations/2026_09_01_mcft_cap_09_kbs_publication_baseline_pointer.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/server/db/migrations/2026_09_01_mcft_cap_09_kbs_publication_baseline_pointer.sql
      - name: Apply idempotent Evidence source poll schedule extension
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/server/db/migrations/2026_09_01_mcft_cap_09_evidence_source_poll_schedule.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/server/db/migrations/2026_09_01_mcft_cap_09_evidence_source_poll_schedule.sql
      - name: Prove product and acceptance types
        run: |
          pnpm --filter @geox/server run typecheck
          pnpm exec tsc --noEmit --pretty false --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext --esModuleInterop --types node \
            scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PHASE3_EVIDENCE_RUNTIME_PERSISTENCE_V1.ts \
            scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PHASE3_EVIDENCE_SUPPLY_CADENCE_PROFILES_V1.ts \
            scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PHASE3_EVIDENCE_RUNTIME_CYCLE_V1.ts \
            scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PHASE3_EVIDENCE_RUNTIME_HOST_V1.ts \
            scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PHASE3_GFS_RAW_BUNDLE_COMPOSER_V1.ts \
            scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PHASE3_EVIDENCE_RUNTIME_ACL_V1.ts \
            scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PHASE3_EVIDENCE_RUNTIME_COMPOSITION_V1.ts \
            scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PHASE7_PRIVATE_CANDIDATE_IO_V1.ts \
            scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_KBS_PUBLICATION_BASELINE_V1.ts \
            scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_KBS_PUBLICATION_BASELINE_POINTER_V1.ts \
            scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_KBS_PUBLICATION_SNAPSHOT_COMPARISON_V1.ts \
            scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_VERIFIED_RETAINED_RAW_REPLAY_V1.ts \
            scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_KBS_RAW_HOURLY_PUBLICATION_CYCLE_V1.ts \
            scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EXTERNAL_EVIDENCE_FACT_REPLAY_PROVENANCE_V1.ts \
            scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_GFS_PARTIAL_PAIR_REHYDRATION_V1.ts \
            scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PRODUCTION_EVIDENCE_SOURCE_PLAN_EXECUTOR_V1.ts \
            scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PRODUCTION_PROVIDER_ATTEMPT_FENCE_V1.ts \
            scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EVIDENCE_SOURCE_POLL_SCHEDULE_POSTGRES_V1.ts \
            scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_GFS_RETRY_SCHEDULE_POSTGRES_V1.ts \
            scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_GFS_TARGET_PAIR_HISTORY_POSTGRES_V1.ts
      - name: Prove durable Evidence lease and supply cursor semantics
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PHASE3_EVIDENCE_RUNTIME_PERSISTENCE_V1.ts
      - name: Prove durable fenced source poll schedule and restart throttle
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EVIDENCE_SOURCE_POLL_SCHEDULE_POSTGRES_V1.ts
      - name: Prove durable GFS retry throttle and per-target attempt budget
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_GFS_RETRY_SCHEDULE_POSTGRES_V1.ts
      - name: Prove canonical GFS hourly target-pair history
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_GFS_TARGET_PAIR_HISTORY_POSTGRES_V1.ts
      - name: Prove fenced KBS publication baseline current pointer
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_KBS_PUBLICATION_BASELINE_POINTER_V1.ts
      - name: Prove retained KBS snapshot historical-prefix comparison
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_KBS_PUBLICATION_SNAPSHOT_COMPARISON_V1.ts
      - name: Prove reusable verified retained-raw replay primitive
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_VERIFIED_RETAINED_RAW_REPLAY_V1.ts
      - name: Prove KBS complete-table publication cycle semantics
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_KBS_RAW_HOURLY_PUBLICATION_CYCLE_V1.ts
      - name: Prove generic Evidence cadence profiles
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PHASE3_EVIDENCE_SUPPLY_CADENCE_PROFILES_V1.ts
      - name: Prove one canonical Evidence Runtime supply cycle
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PHASE3_EVIDENCE_RUNTIME_CYCLE_V1.ts
      - name: Prove long-running Evidence Runtime host lifecycle
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PHASE3_EVIDENCE_RUNTIME_HOST_V1.ts
      - name: Prove source-plan to single-host attempt execution core
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PRODUCTION_EVIDENCE_SOURCE_PLAN_EXECUTOR_V1.ts
      - name: Prove provider-attempt fence before provider I/O
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PRODUCTION_PROVIDER_ATTEMPT_FENCE_V1.ts
      - name: Prove product GFS raw bundle composition
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PHASE3_GFS_RAW_BUNDLE_COMPOSER_V1.ts
      - name: Start isolated private candidate object store
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f mcft-cap09-phase7-private-minio >/dev/null 2>&1 || true
          docker run -d --name mcft-cap09-phase7-private-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=phase7access \
            -e MINIO_ROOT_PASSWORD=phase7-private-secret-key-001 \
            minio/minio:latest server /data
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null
          docker run --rm --network host \
            -e MC_HOST_phase7=http://phase7access:phase7-private-secret-key-001@127.0.0.1:9000 \
            minio/mc:latest mb --ignore-existing phase7/mcft-cap09-phase7-private
          docker run --rm --network host \
            -e MC_HOST_phase7=http://phase7access:phase7-private-secret-key-001@127.0.0.1:9000 \
            minio/mc:latest anonymous set private phase7/mcft-cap09-phase7-private
      - name: Prove durable private candidate and retained-raw I/O
        env:
          PHASE7_PRIVATE_S3_ENDPOINT: http://127.0.0.1:9000
          PHASE7_PRIVATE_S3_BUCKET: mcft-cap09-phase7-private
          PHASE7_PRIVATE_S3_REGION: us-east-1
          PHASE7_PRIVATE_S3_ACCESS_KEY_ID: phase7access
          PHASE7_PRIVATE_S3_SECRET_ACCESS_KEY: phase7-private-secret-key-001
        run: |
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PHASE7_PRIVATE_CANDIDATE_IO_V1.ts
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_KBS_PUBLICATION_BASELINE_V1.ts
      - name: Create isolated ACL qualification surface
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE public.facts (
            fact_id text PRIMARY KEY,
            occurred_at timestamptz NOT NULL,
            source text NOT NULL,
            record_json jsonb NOT NULL,
            ingested_at timestamptz NOT NULL DEFAULT transaction_timestamp()
          );
          CREATE TABLE public.twin_runtime_lease_v1 (id integer PRIMARY KEY);
          CREATE TABLE public.twin_runtime_checkpoint_latest_index_v1 (id integer PRIMARY KEY, value text);
          CREATE TABLE public.twin_shadow_online_scheduler_cursor_v1 (id integer PRIMARY KEY);
          CREATE TABLE public.approvals (id integer PRIMARY KEY);
          CREATE TABLE public.actions (id integer PRIMARY KEY);
          SQL
      - name: Prove replay-complete External Evidence fact provenance readback
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EXTERNAL_EVIDENCE_FACT_REPLAY_PROVENANCE_V1.ts
      - name: Prove zero-provider GFS partial-pair retained rehydration
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_GFS_PARTIAL_PAIR_REHYDRATION_V1.ts
      - name: Apply v13 Evidence-plane forcing operational schema
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/server/db/migrations/2026_08_25_mcft_cap_09_v13_forcing_base_continuity.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/server/db/migrations/2026_08_25_mcft_cap_09_v13_forcing_controller_admission.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/server/db/migrations/2026_08_25_mcft_cap_09_v13_forcing_controller_lifecycle.sql
      - name: Apply Phase3 Evidence Runtime ACL
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/server/db/migrations/2026_08_27_mcft_cap_09_phase3_evidence_runtime_acl.sql
      - name: Reproduce V13 successor ACL reset
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/server/db/migrations/2026_08_28_mcft_cap_09_v13_evidence_runtime_fenced_promotion_acl.sql
      - name: Apply forward Phase3 ACL carry-forward remediation
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/server/db/migrations/2026_09_01_mcft_cap_09_v13_evidence_runtime_phase3_acl_carryforward.sql
      - name: Prove Evidence Runtime database ACL separation
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PHASE3_EVIDENCE_RUNTIME_ACL_V1.ts
      - name: Prove deployable Evidence Runtime composition
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PHASE3_EVIDENCE_RUNTIME_COMPOSITION_V1.ts
      - name: Prove Phase3 persistence boundary has no Twin runtime or cadence ownership
        shell: python
        run: |
          import pathlib
          core_files = [
              pathlib.Path("apps/server/src/external_evidence/mcft_cap09_evidence_runtime_persistence_v1.ts"),
              pathlib.Path("apps/server/src/external_evidence/mcft_cap09_evidence_supply_cadence_profile_v1.ts"),
              pathlib.Path("apps/server/src/external_evidence/mcft_cap09_evidence_runtime_cycle_service_v1.ts"),
              pathlib.Path("apps/server/src/external_evidence/mcft_cap09_evidence_runtime_host_v1.ts"),
              pathlib.Path("apps/server/src/external_evidence/mcft_cap09_evidence_runtime_host_attempt_v1.ts"),
              pathlib.Path("apps/server/src/external_evidence/mcft_cap09_evidence_runtime_composition_v1.ts"),
              pathlib.Path("apps/server/src/external_evidence/mcft_cap09_production_evidence_work_items_v1.ts"),
              pathlib.Path("apps/server/src/external_evidence/provider/gfs_nomads_raw_bundle_composer_v1.ts"),
              pathlib.Path("apps/server/src/external_evidence/provider/gfs_nomads_bundle_transport_v1.ts"),
              pathlib.Path("apps/server/src/persistence/external_evidence/postgres_evidence_runtime_persistence_v1.ts"),
              pathlib.Path("apps/server/src/persistence/external_evidence/postgres_evidence_source_poll_schedule_v1.ts"),
              pathlib.Path("apps/server/src/persistence/external_evidence/postgres_gfs_retry_schedule_v1.ts"),
              pathlib.Path("apps/server/src/external_evidence/mcft_cap09_gfs_retry_schedule_v1.ts"),
              pathlib.Path("apps/server/src/external_evidence/mcft_cap09_evidence_source_poll_schedule_v1.ts"),
              pathlib.Path("apps/server/src/external_evidence/mcft_cap09_production_evidence_source_due_policy_v1.ts"),
              pathlib.Path("apps/server/src/persistence/external_evidence/postgres_kbs_publication_baseline_pointer_v1.ts"),
              pathlib.Path("apps/server/src/external_evidence/mcft_cap09_kbs_publication_baseline_pointer_v1.ts"),
              pathlib.Path("apps/server/src/external_evidence/mcft_cap09_kbs_raw_hourly_publication_cycle_service_v1.ts"),
              pathlib.Path("apps/server/src/external_evidence/verified_retained_raw_replay_v1.ts"),
              pathlib.Path("apps/server/src/external_evidence/mcft_cap09_gfs_partial_pair_rehydration_v1.ts"),

              pathlib.Path("apps/server/src/persistence/external_evidence/postgres_external_evidence_fact_replay_provenance_v1.ts"),
              pathlib.Path("apps/server/src/persistence/external_evidence/postgres_evidence_runtime_governed_ingress_v1.ts"),
          ]
          decoder_file = pathlib.Path("apps/server/src/external_evidence/provider/gfs_raw_bundle_evidence_decoder_v1.ts")
          kbs_comparison_file = pathlib.Path("apps/server/src/external_evidence/provider/kbs_raw_hourly_publication_comparison_v1.ts")
          core_text = "\n".join(p.read_text(encoding="utf-8") for p in core_files)
          decoder_text = decoder_file.read_text(encoding="utf-8")
          kbs_comparison_text = kbs_comparison_file.read_text(encoding="utf-8")

          core_forbidden = [
              "setInterval(",
              "setTimeout(",
              "process.env",
              "child_process",
              "scripts/runtime_acceptance",
              "INSERT INTO twin_",
              "UPDATE twin_",
              "DELETE FROM twin_",
          ]
          for marker in core_forbidden:
              if marker in core_text:
                  raise SystemExit(f"PHASE3_EVIDENCE_CORE_FORBIDDEN_DEPENDENCY:{marker}")

          decoder_forbidden = [
              "setInterval(",
              "setTimeout(",
              "process.env",
              "scripts/runtime_acceptance",
              "INSERT INTO",
              "UPDATE ",
              "DELETE FROM",
              "RuntimeTickCursor",
          ]
          for marker in decoder_forbidden:
              if marker in decoder_text:
                  raise SystemExit(f"PHASE3_EVIDENCE_DECODER_FORBIDDEN_DEPENDENCY:{marker}")
          if 'from "node:child_process"' not in decoder_text:
              raise SystemExit("PHASE3_EVIDENCE_DECODER_PRODUCT_PYTHON_BRIDGE_REQUIRED")
          if "mcft_cap09_gfs_raw_bundle_decoder_v1.py" not in decoder_text:
              raise SystemExit("PHASE3_EVIDENCE_DECODER_PRODUCT_DRIVER_BINDING_REQUIRED")

          kbs_comparison_forbidden = [
              "setInterval(",
              "setTimeout(",
              "process.env",
              "scripts/runtime_acceptance",
              "INSERT INTO",
              "UPDATE ",
              "DELETE FROM",
              "RuntimeTickCursor",
          ]
          for marker in kbs_comparison_forbidden:
              if marker in kbs_comparison_text:
                  raise SystemExit(f"PHASE3_KBS_COMPARISON_BRIDGE_FORBIDDEN_DEPENDENCY:{marker}")
          if 'from "node:child_process"' not in kbs_comparison_text:
              raise SystemExit("PHASE3_KBS_COMPARISON_PRODUCT_PYTHON_BRIDGE_REQUIRED")
          if "MCFT_CAP09_KBS_RAW_HOURLY_SCIENTIFIC_CORE_RELATIVE_PATH_V1" not in kbs_comparison_text:
              raise SystemExit("PHASE3_KBS_COMPARISON_PRODUCT_CORE_AUTHORITY_BINDING_REQUIRED")
          repo = pathlib.Path("apps/server/src/persistence/external_evidence/postgres_evidence_runtime_persistence_v1.ts").read_text(encoding="utf-8")
          if "twin_runtime_lease_v1" in repo:
              raise SystemExit("PHASE3_EVIDENCE_LEASE_MUST_BE_INDEPENDENT_FROM_TWIN_RUNTIME_LEASE")
          if "external_evidence_producer_lease_v1" not in repo or "external_evidence_supply_cursor_v1" not in repo:
              raise SystemExit("PHASE3_EVIDENCE_PERSISTENCE_TABLE_BINDING_REQUIRED")
          print("PHASE3_EVIDENCE_PERSISTENCE_BOUNDARY_PASS")
      - name: Stop isolated private candidate object store
        if: always()
        run: docker rm -f mcft-cap09-phase7-private-minio >/dev/null 2>&1 || true
      - name: Upload Phase3 Evidence persistence proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-phase3-evidence-persistence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_PHASE3_EVIDENCE_RUNTIME_PERSISTENCE_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_EVIDENCE_SOURCE_POLL_SCHEDULE_POSTGRES_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_GFS_RETRY_SCHEDULE_POSTGRES_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_GFS_TARGET_PAIR_HISTORY_POSTGRES_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_PHASE3_EVIDENCE_SUPPLY_CADENCE_PROFILES_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_PHASE3_EVIDENCE_RUNTIME_CYCLE_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_PHASE3_EVIDENCE_RUNTIME_HOST_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_PRODUCTION_EVIDENCE_SOURCE_PLAN_EXECUTOR_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_PHASE3_GFS_RAW_BUNDLE_COMPOSER_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_PHASE3_EVIDENCE_RUNTIME_ACL_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_PHASE3_EVIDENCE_RUNTIME_COMPOSITION_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_PHASE7_PRIVATE_CANDIDATE_IO_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_KBS_PUBLICATION_BASELINE_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_KBS_PUBLICATION_BASELINE_POINTER_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_KBS_PUBLICATION_SNAPSHOT_COMPARISON_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_VERIFIED_RETAINED_RAW_REPLAY_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_KBS_RAW_HOURLY_PUBLICATION_CYCLE_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_EXTERNAL_EVIDENCE_FACT_REPLAY_PROVENANCE_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_GFS_PARTIAL_PAIR_REHYDRATION_V1_RESULT.json
          if-no-files-found: warn
          retention-days: 90

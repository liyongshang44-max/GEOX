name: mcft-cap-09-phase5-two-service-accelerated-24t
# exact-head execution trigger marker: runtime/product semantics are unchanged

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-phase5-two-service-accelerated-24t.yml'
      - '.github/workflows/mcft-cap-09-phase5-production-equivalent-containers.yml'
      - 'docker/mcft-cap09-runtime.Dockerfile'
      - 'docker-compose.mcft-cap09-phase5-qualification.yml'
      - 'apps/server/scripts/write_dist_entries.cjs'
      - 'apps/server/src/external_evidence/mcft_cap09_evidence_runtime_process_v1.ts'
      - 'apps/server/src/external_evidence/mcft_cap09_evidence_runtime_composition_v1.ts'
      - 'apps/server/src/external_evidence/qualification/mcft_cap09_phase5_controlled_evidence_work_items_v1.ts'
      - 'apps/server/src/external_evidence/qualification/mcft_cap09_phase5_evidence_runtime_qualification_v1.ts'
      - 'apps/server/src/external_evidence/qualification/mcft_cap09_phase5_capture_a0_fixture_v1.ts'
      - 'apps/server/src/runtime/twin_runtime/mcft_cap09_twin_runtime_process_v1.ts'
      - 'apps/server/src/runtime/twin_runtime/mcft_cap09_twin_runtime_composition_v1.ts'
      - 'apps/server/src/runtime/twin_runtime/qualification/mcft_cap09_phase5_twin_runtime_qualification_v1.ts'
      - 'apps/server/src/runtime/twin_runtime/qualification/mcft_cap09_phase5_prepare_24t_v1.ts'
      - 'apps/server/src/runtime/twin_runtime/qualification/mcft_cap09_phase5_verify_24t_v1.ts'
      - 'apps/server/src/persistence/twin_runtime/postgres_mcft_cap09_twin_canonical_fact_writer_v1.ts'
      - 'apps/server/src/persistence/twin_runtime/postgres_forecast_scenario_repository_v1.ts'
      - 'apps/server/src/persistence/twin_runtime/postgres_forecast_scenario_recovery_repository_v1.ts'
      - 'apps/server/db/migrations/2026_08_27_mcft_cap_09_phase5_twin_fact_writer_acl.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcft-cap09-phase5-two-service-24t-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  production-equivalent-24t:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      COMPOSE_FILE: docker-compose.mcft-cap09-phase5-qualification.yml
      GEOX_DEPLOYMENT_SUBJECT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      GEOX_PHASE5_POSTGRES_USER: postgres
      GEOX_PHASE5_POSTGRES_PASSWORD: phase5-postgres-24t
      GEOX_PHASE5_DATABASE_NAME: geox_mcft_cap09_phase5_24t
      GEOX_PHASE5_MIGRATOR_PASSWORD: phase5-migrator-24t
      GEOX_PHASE5_GENERIC_RUNTIME_PASSWORD: phase5-generic-runtime-24t
      GEOX_PHASE5_EVIDENCE_DATABASE_PASSWORD: phase5-evidence-24t
      GEOX_PHASE5_TWIN_DATABASE_PASSWORD: phase5-twin-24t
      GEOX_PHASE5_MINIO_ACCESS_KEY: phase5minio24t
      GEOX_PHASE5_MINIO_SECRET_KEY: phase5minio24t-secret
      GEOX_PHASE5_RAW_BUCKET: mcft-cap09-phase5-24t-raw
      GEOX_PHASE5_S3_REGION: us-east-1
      GEOX_PHASE5_TENANT_ID: tenant_mcft_external
      GEOX_PHASE5_PROJECT_ID: project_mcft_cap09
      GEOX_PHASE5_GROUP_ID: group_public_research
      GEOX_PHASE5_FIELD_ID: field_kbs_mcse_t4r1
      GEOX_PHASE5_SEASON_ID: season_2026_corn
      GEOX_PHASE5_ZONE_ID: zone_kbs_mcse_t4r1_crop_formal_v1
      # Placeholders satisfy Compose interpolation before live capture. They are never
      # consumed by prepare/Twin until replaced with the capture-bound values.
      GEOX_PHASE5_A0: '2099-01-01T00:00:00.000Z'
      GEOX_PHASE5_CREATED_AT: '2098-12-31T23:30:00.000Z'
      GEOX_PHASE5_ACCELERATED_THROUGH_LOGICAL_TIME: '2099-01-02T00:00:00.000Z'

    steps:
      - name: Checkout exact Phase5 subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact head and create private qualification roots
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GEOX_DEPLOYMENT_SUBJECT_COMMIT"
          fixture_root="$RUNNER_TEMP/mcft-cap09-phase5-24t-$actual/fixtures"
          control_root="$RUNNER_TEMP/mcft-cap09-phase5-24t-$actual/control"
          mkdir -p "$fixture_root" "$control_root"
          chmod 700 "$fixture_root" "$control_root"
          {
            echo "GEOX_PHASE5_FIXTURE_ROOT=$fixture_root"
            echo "GEOX_PHASE5_CONTROL_ROOT=$control_root"
          } >> "$GITHUB_ENV"

      - name: Require central exact-path ownership
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/governance_acceptance/PLAN_MCFT_CAP_09_CHECK_APPLICABILITY_V1.cjs \
            --base '${{ github.event.pull_request.base.sha }}' \
            --head "$GEOX_DEPLOYMENT_SUBJECT_COMMIT" \
            --generation v13 \
            --stage SUCCESSOR_SUBJECT_PRE_MERGE \
            --out "$GEOX_PHASE5_CONTROL_ROOT/applicability-plan.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync(process.env.GEOX_PHASE5_CONTROL_ROOT+'/applicability-plan.json','utf8'));
          if(p.status!=='PASS'||p.unknown_changed_paths.length||p.authority_errors.length||p.resolver_errors.length){
            throw new Error('PHASE5_24T_CENTRAL_PLAN_NOT_PASS:'+JSON.stringify({
              status:p.status,unknown:p.unknown_changed_paths,authority:p.authority_errors,resolver:p.resolver_errors
            }));
          }
          const row=p.decisions.find(x=>x.check_id==='PHASE5_PRODUCTION_EQUIVALENT_CONTAINERS');
          if(!row||row.status!=='REQUALIFY') throw new Error('PHASE5_24T_REQUALIFY_ROUTE_REQUIRED');
          NODE

      - name: Build exact scientific Runtime image
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f "$COMPOSE_FILE" build database-platform-bootstrap
          image="geox/mcft-cap09-phase5-qualification:$GEOX_DEPLOYMENT_SUBJECT_COMMIT"
          docker image inspect "$image" >/dev/null

      - name: Start isolated PostgreSQL and private raw store
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f "$COMPOSE_FILE" up -d postgres minio
          docker compose -f "$COMPOSE_FILE" run --rm --no-deps minio-init
          docker compose -f "$COMPOSE_FILE" run --rm --no-deps database-platform-bootstrap
          docker compose -f "$COMPOSE_FILE" run --rm --no-deps service-principal-bootstrap

      - name: Capture real causal A0 soil and GFS raw objects
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f "$COMPOSE_FILE" --profile qualification-orchestration             run --rm --no-deps fixture-capture
          proof="$GEOX_PHASE5_FIXTURE_ROOT/capture-proof.json"
          test -f "$proof"
          test "$(jq -r .status "$proof")" = "PASS"
          test "$(jq -r .subject_sha "$proof")" = "$GEOX_DEPLOYMENT_SUBJECT_COMMIT"
          test "$(jq -r .fake_grib_used "$proof")" = "false"
          test "$(jq -r .fixture_raw_upload_authorized "$proof")" = "false"
          a0="$(jq -r .a0 "$proof")"
          o00="$(jq -r .o00 "$proof")"
          o23="$(jq -r .o23 "$proof")"
          created="$(jq -r .capture_started_at "$proof")"
          o07="$(date -u -d "$o00 +7 hours" '+%Y-%m-%dT%H:%M:%S.000Z')"
          {
            echo "GEOX_PHASE5_A0=$a0"
            echo "GEOX_PHASE5_CREATED_AT=$created"
            echo "GEOX_PHASE5_ACCELERATED_THROUGH_LOGICAL_TIME=$o23"
            echo "GEOX_PHASE5_O00=$o00"
            echo "GEOX_PHASE5_O07=$o07"
            echo "GEOX_PHASE5_O23=$o23"
          } >> "$GITHUB_ENV"
          now="$(date -u +%s)"
          boundary="$(date -u -d "$a0" +%s)"
          if [ "$now" -ge "$boundary" ]; then
            echo "PHASE5_24T_CAPTURE_MISSED_CAUSAL_A0_BOUNDARY" >&2
            exit 1
          fi

      - name: Run same Evidence process graph against captured raw
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f "$COMPOSE_FILE" --profile qualification-runtime             run --rm --no-deps evidence-runtime             2>&1 | tee "$GEOX_PHASE5_CONTROL_ROOT/evidence-runtime.log"
          now="$(date -u +%s)"
          boundary="$(date -u -d "$GEOX_PHASE5_A0" +%s)"
          if [ "$now" -gt "$boundary" ]; then
            echo "PHASE5_24T_EVIDENCE_INGESTION_AFTER_A0" >&2
            exit 1
          fi
          count="$(docker compose -f "$COMPOSE_FILE" exec -T postgres             psql -U "$GEOX_PHASE5_POSTGRES_USER" -d "$GEOX_PHASE5_DATABASE_NAME" -Atc             "SELECT count(*) FROM public.facts WHERE source='mcft_cap09_external_formal_evidence_v1' AND record_json->>'type' IN ('soil_moisture_observation_v1','future_weather_assumption_v1','future_et0_assumption_v1');")"
          test "$count" -ge 3

      - name: Prepare A0 and exact 24-slot manifest from canonical Evidence DB
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f "$COMPOSE_FILE" --profile qualification-orchestration             run --rm --no-deps qualification-prepare             2>&1 | tee "$GEOX_PHASE5_CONTROL_ROOT/prepare.log"
          test "$(jq -r .status "$GEOX_PHASE5_CONTROL_ROOT/prepare-proof.json")" = "PASS"
          test "$(jq -r .engineering_bootstrap_fixture_count "$GEOX_PHASE5_CONTROL_ROOT/prepare-proof.json")" = "0"
          test "$(jq -r .bootstrap_lease_release_mode "$GEOX_PHASE5_CONTROL_ROOT/prepare-proof.json")" = "NATURAL_TTL_EXPIRY"
          test "$(jq -r .bootstrap_lease_duration_seconds "$GEOX_PHASE5_CONTROL_ROOT/prepare-proof.json")" = "1"
          test "$(jq -r .subject_sha "$GEOX_PHASE5_CONTROL_ROOT/prepare-proof.json")" = "$GEOX_DEPLOYMENT_SUBJECT_COMMIT"
          sleep 2

      - name: Run O00-O07 then graceful Twin container stop
        shell: bash
        run: |
          set -euo pipefail
          export GEOX_PHASE5_ACCELERATED_THROUGH_LOGICAL_TIME="$GEOX_PHASE5_O07"
          docker compose -f "$COMPOSE_FILE" --profile qualification-runtime             up -d --no-deps twin-runtime
          cid="$(docker compose -f "$COMPOSE_FILE" ps -q twin-runtime)"
          test -n "$cid"
          reached=0
          for attempt in $(seq 1 300); do
            failed="$(docker compose -f "$COMPOSE_FILE" exec -T postgres               psql -U "$GEOX_PHASE5_POSTGRES_USER" -d "$GEOX_PHASE5_DATABASE_NAME" -Atc               "SELECT count(*) FROM public.twin_shadow_online_scheduler_slot_v1 WHERE state='FAILED';")"
            if [ "$failed" -ne 0 ]; then
              docker logs "$cid" >&2 || true
              exit 1
            fi
            terminal="$(docker compose -f "$COMPOSE_FILE" exec -T postgres               psql -U "$GEOX_PHASE5_POSTGRES_USER" -d "$GEOX_PHASE5_DATABASE_NAME" -Atc               "SELECT count(*) FROM public.twin_shadow_online_scheduler_slot_v1 WHERE state IN ('COMPLETED','DEGRADED');")"
            if [ "$terminal" -ge 8 ]; then reached=1; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$cid")" != "true" ]; then
              docker logs "$cid" >&2 || true
              exit 1
            fi
            sleep 2
          done
          test "$reached" = "1"
          docker kill --signal=SIGTERM "$cid" >/dev/null
          exit_code="$(docker wait "$cid")"
          docker logs "$cid" > "$GEOX_PHASE5_CONTROL_ROOT/twin-o00-o07.log" 2>&1 || true
          test "$exit_code" = "0"
          cursor="$(docker compose -f "$COMPOSE_FILE" exec -T postgres             psql -U "$GEOX_PHASE5_POSTGRES_USER" -d "$GEOX_PHASE5_DATABASE_NAME" -Atc             "SELECT next_slot_index FROM public.twin_shadow_online_scheduler_cursor_v1;")"
          test "$cursor" = "8"

      - name: Restart Twin container and recover O08-O23 from durable cursor
        shell: bash
        run: |
          set -euo pipefail
          export GEOX_PHASE5_ACCELERATED_THROUGH_LOGICAL_TIME="$GEOX_PHASE5_O23"
          docker compose -f "$COMPOSE_FILE" --profile qualification-runtime             up -d --no-deps --force-recreate twin-runtime
          cid="$(docker compose -f "$COMPOSE_FILE" ps -q twin-runtime)"
          test -n "$cid"
          reached=0
          for attempt in $(seq 1 600); do
            failed="$(docker compose -f "$COMPOSE_FILE" exec -T postgres               psql -U "$GEOX_PHASE5_POSTGRES_USER" -d "$GEOX_PHASE5_DATABASE_NAME" -Atc               "SELECT count(*) FROM public.twin_shadow_online_scheduler_slot_v1 WHERE state='FAILED';")"
            if [ "$failed" -ne 0 ]; then
              docker logs "$cid" >&2 || true
              exit 1
            fi
            terminal="$(docker compose -f "$COMPOSE_FILE" exec -T postgres               psql -U "$GEOX_PHASE5_POSTGRES_USER" -d "$GEOX_PHASE5_DATABASE_NAME" -Atc               "SELECT count(*) FROM public.twin_shadow_online_scheduler_slot_v1 WHERE state IN ('COMPLETED','DEGRADED');")"
            if [ "$terminal" -ge 24 ]; then reached=1; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$cid")" != "true" ]; then
              docker logs "$cid" >&2 || true
              exit 1
            fi
            sleep 2
          done
          test "$reached" = "1"
          docker kill --signal=SIGTERM "$cid" >/dev/null
          exit_code="$(docker wait "$cid")"
          docker logs "$cid" > "$GEOX_PHASE5_CONTROL_ROOT/twin-o08-o23.log" 2>&1 || true
          test "$exit_code" = "0"

      - name: Verify exact 24T canonical and DB isolation closure
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f "$COMPOSE_FILE" --profile qualification-orchestration             run --rm --no-deps qualification-verify             2>&1 | tee "$GEOX_PHASE5_CONTROL_ROOT/verify.log"
          proof="$GEOX_PHASE5_CONTROL_ROOT/verify-proof.json"
          test "$(jq -r .status "$proof")" = "PASS"
          test "$(jq -r .exact_24t_complete "$proof")" = "true"
          test "$(jq -r .terminal_tick_count "$proof")" = "24"
          test "$(jq -r .forcing_mode_count "$proof")" = "24"
          test "$(jq -r .db_layer_evidence_twin_bidirectional_isolation "$proof")" = "true"
          test "$(jq -r .late_exact_kbs_batch_covered "$proof")" = "false"
          jq -n             --arg subject "$GEOX_DEPLOYMENT_SUBJECT_COMMIT"             --arg a0 "$GEOX_PHASE5_A0"             --arg o00 "$GEOX_PHASE5_O00"             --arg o07 "$GEOX_PHASE5_O07"             --arg o23 "$GEOX_PHASE5_O23"             '{status:"PASS",schema_version:"geox_mcft_cap09_phase5_exact_head_24t_workflow_v1",
              subject_sha:$subject,a0:$a0,o00:$o00,first_process_through:$o07,o23:$o23,
              twin_container_restart_count:1,durable_cursor_restart_recovery:true,
              same_exact_image_subject:true,raw_fixture_uploaded:false,
              production_owner_cutover:false,formal_v5_armed:false}'             > "$GEOX_PHASE5_CONTROL_ROOT/workflow-proof.json"

      - name: Upload non-raw exact-head qualification proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-phase5-two-service-24t-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ env.GEOX_PHASE5_FIXTURE_ROOT }}/capture-proof.json
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/phase5-manifest.json
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/prepare-proof.json
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/verify-proof.json
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/workflow-proof.json
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/evidence-runtime.log
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/prepare.log
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/twin-o00-o07.log
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/twin-o08-o23.log
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/verify.log
          if-no-files-found: warn
          retention-days: 90

      - name: Destroy qualification state and raw fixture
        if: always()
        shell: bash
        run: |
          set +e
          docker compose -f "$COMPOSE_FILE" --profile qualification-runtime --profile qualification-orchestration             down -v --remove-orphans
          sudo rm -rf "${GEOX_PHASE5_FIXTURE_ROOT:-}" "${GEOX_PHASE5_CONTROL_ROOT:-}"

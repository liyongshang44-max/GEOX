name: Product MCFT Formal read-only P0 boundary

on:
  pull_request:
    paths:
      - '.github/workflows/product-mcft-formal-readonly-p0.yml'
      - 'apps/server/src/product_api/product_api_public_runtime_v1.ts'
      - 'apps/server/src/product_api/product_api_public_runtime_v1.test.ts'
      - 'apps/server/src/product_projection/customer/customer_formal_v5_readiness_v1.ts'
      - 'apps/server/src/product_projection/customer/customer_formal_v5_readiness_v1.test.ts'
      - 'apps/server/src/product_projection/customer/customer_product_projection_builder_v1.ts'
      - 'scripts/product_acceptance/PREFLIGHT_GEOX_PRODUCT_MCFT_FORMAL_READ_V1.ts'
      - 'docs/product_projection/GEOX-PRODUCT-MCFT-FORMAL-V5-READINESS-P0-2026-10-09.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
      - run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - run: pnpm install --frozen-lockfile
      - name: Verify Product↔Formal 4-key freeze / 6-key resolution / isolation cases
        run: node --import tsx --test apps/server/src/product_projection/customer/customer_formal_v5_readiness_v1.test.ts
      - name: Verify existing Product public runtime guard
        run: node --import tsx --test apps/server/src/product_api/product_api_public_runtime_v1.test.ts
      - name: Verify existing Wave-02 customer projection regressions
        run: node --import tsx --test apps/server/src/product_projection/customer/customer_product_projection_builder_v1.test.ts
      - name: No production credentials or direct effect
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GEOX_PRODUCT_DATABASE_URL:-}"
          test -z "${GEOX_PRODUCT_FORMAL_DATABASE_URL:-}"
          if node --import tsx scripts/product_acceptance/PREFLIGHT_GEOX_PRODUCT_MCFT_FORMAL_READ_V1.ts >/tmp/product-p0.txt 2>&1; then
            echo 'P0 preflight MUST be host-only and explicit' >&2
            exit 1
          fi
          grep -Fq 'PRODUCT_FORMAL_EXPLICIT_READ_ONLY_PREFLIGHT_FLAG_REQUIRED' /tmp/product-p0.txt
          echo "PRODUCT_FORMAL_NON_EFFECTFUL_CI=PASS"

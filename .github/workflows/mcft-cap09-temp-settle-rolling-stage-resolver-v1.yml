name: mcft-cap09-temp-settle-rolling-stage-resolver-v1

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap09-temp-settle-rolling-stage-resolver-v1.yml'

permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Patch governance and successor predecessor atomically
        shell: node {0}
        env:
          BASE_SHA: d67a2b3cce037c1eaad4d7d051d1f6a11eb09fc3
        run: |
          const fs=require('node:fs');
          const base=process.env.BASE_SHA;
          const qcpPath='docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-CONTROL-PLANE-V1.json';
          const regPath='docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-EVIDENCE-REGISTRY-V1.json';
          const preflightPath='scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_ALL_BLOCKERS_V1.cjs';
          const formalPath='.github/workflows/mcft-cap-09-qualification-control-plane-v1.yml';
          const postmergePath='.github/workflows/mcft-cap-09-post-merge-v13-control-plane-v1.yml';
          const qcp=JSON.parse(fs.readFileSync(qcpPath,'utf8'));
          if(!Array.isArray(qcp.governed_successor_predecessor_shas)) throw new Error('QCP_GOVERNED_PREDECESSORS_REQUIRED');
          if(!qcp.governed_successor_predecessor_shas.includes(base)) qcp.governed_successor_predecessor_shas.push(base);
          const resolverId='TWIN_V2_ROLLING_STAGE_AUTHORITY_RESOLVER_SEAM_V1';
          qcp.dependency_resolvers[resolverId]={
            kind:'EXACT_PATH_SET',
            paths:[
              '.github/workflows/mcft-cap-09-twin-v2-rolling-stage-authority-resolver-seam-v1.yml',
              'apps/server/src/runtime/twin_runtime/mcft_cap09_current_crop_authority_resolver_v1.test.ts',
              'apps/server/src/runtime/twin_runtime/mcft_cap09_current_crop_authority_resolver_v1.ts',
              'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_TWIN_V2_ROLLING_STAGE_AUTHORITY_RESOLVER_SEAM_V1.cjs'
            ]
          };
          if(!Array.isArray(qcp.checks)) throw new Error('QCP_CHECKS_REQUIRED');
          const template=qcp.checks.find(x=>x.check_id==='TWIN_V2_STAGE_AUTHORITY_SUCCESSOR');
          if(!template) throw new Error('TWIN_V2_TEMPLATE_CHECK_REQUIRED');
          const check=JSON.parse(JSON.stringify(template));
          check.check_id='TWIN_V2_ROLLING_STAGE_AUTHORITY_RESOLVER_SEAM';
          check.owner='MCFT_CAP09_TWIN_V2_ROLLING_STAGE_AUTHORITY_RESOLVER_QUALIFICATION';
          check.authority_refs=['docs/digital_twin/GEOX-DT-02-ARCHITECTURE-AMENDMENT-03-BIOLOGICAL-STAGE-AUTHORITY.md'];
          check.resolver_ids=[resolverId];
          check.historical_evidence_policy='FRESH_EXACT_HEAD_REQUALIFICATION_REQUIRED_NO_CARRY_FORWARD';
          check.execution_workflow='.github/workflows/mcft-cap-09-twin-v2-rolling-stage-authority-resolver-seam-v1.yml';
          check.execution_workflow_status='IMPLEMENTED_AT_SUCCESSOR_HEAD';
          check.fail_policy='FAIL_CLOSED';
          check.carry_forward_policy='NONE';
          check.requalification_triggers=[resolverId];
          check.diagnostic_command='node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_TWIN_V2_ROLLING_STAGE_AUTHORITY_RESOLVER_SEAM_V1.cjs';
          const idx=qcp.checks.findIndex(x=>x.check_id===check.check_id);
          if(idx>=0) qcp.checks[idx]=check; else qcp.checks.push(check);
          fs.writeFileSync(qcpPath,JSON.stringify(qcp,null,2)+'\n');

          const reg=JSON.parse(fs.readFileSync(regPath,'utf8'));
          const governed=reg.requalification_evidence?.durable_anchors?.rules?.governed_successor_predecessors;
          if(!Array.isArray(governed)) throw new Error('REGISTRY_GOVERNED_PREDECESSORS_REQUIRED');
          if(!governed.includes(base)) governed.push(base);
          fs.writeFileSync(regPath,JSON.stringify(reg,null,2)+'\n');

          let pre=fs.readFileSync(preflightPath,'utf8');
          const oldDecl='    const postProductionLiveRollingRefreshBase = String(process.env.POST_PRODUCTION_LIVE_ROLLING_REFRESH_PREDECESSOR_SHA || "");';
          const newDecl=oldDecl+'\n    const rollingStageResolverProtectedMainBase = String(process.env.ROLLING_STAGE_RESOLVER_PROTECTED_MAIN_PREDECESSOR_SHA || "");';
          if(!pre.includes('rollingStageResolverProtectedMainBase')){
            if(!pre.includes(oldDecl)) throw new Error('PREFLIGHT_DECL_BOUNDARY_REQUIRED');
            pre=pre.replace(oldDecl,newDecl);
          }
          const oldTail='        (/^[0-9a-f]{40}$/.test(postProductionLiveRollingRefreshBase) && args.base === postProductionLiveRollingRefreshBase)\n      ) &&';
          const newTail='        (/^[0-9a-f]{40}$/.test(postProductionLiveRollingRefreshBase) && args.base === postProductionLiveRollingRefreshBase) ||\n        (/^[0-9a-f]{40}$/.test(rollingStageResolverProtectedMainBase) && args.base === rollingStageResolverProtectedMainBase)\n      ) &&';
          if(!pre.includes('args.base === rollingStageResolverProtectedMainBase')){
            if(!pre.includes(oldTail)) throw new Error('PREFLIGHT_BASE_BOUNDARY_REQUIRED');
            pre=pre.replace(oldTail,newTail);
          }
          fs.writeFileSync(preflightPath,pre);

          let formal=fs.readFileSync(formalPath,'utf8');
          const formalEnv="  POST_PRODUCTION_LIVE_ROLLING_REFRESH_PREDECESSOR_SHA: 'd82d25f76535b2779ef6b15b3eb32c15c245dedf'";
          const formalNew="  ROLLING_STAGE_RESOLVER_PROTECTED_MAIN_PREDECESSOR_SHA: '"+base+"'";
          if(!formal.includes(formalNew)){
            if(!formal.includes(formalEnv)) throw new Error('FORMAL_ENV_BOUNDARY_REQUIRED');
            formal=formal.replace(formalEnv,formalEnv+'\n'+formalNew);
          }
          const formalCond='[ "$base" != "$POST_PRODUCTION_LIVE_ROLLING_REFRESH_PREDECESSOR_SHA" ]';
          const formalCondNew=formalCond+' && [ "$base" != "$ROLLING_STAGE_RESOLVER_PROTECTED_MAIN_PREDECESSOR_SHA" ]';
          if(!formal.includes(formalCondNew)){
            if(!formal.includes(formalCond)) throw new Error('FORMAL_SHELL_BOUNDARY_REQUIRED');
            formal=formal.replace(formalCond,formalCondNew);
          }
          const formalJs='process.env.POST_PRODUCTION_LIVE_ROLLING_REFRESH_PREDECESSOR_SHA];';
          const formalJsNew='process.env.POST_PRODUCTION_LIVE_ROLLING_REFRESH_PREDECESSOR_SHA, process.env.ROLLING_STAGE_RESOLVER_PROTECTED_MAIN_PREDECESSOR_SHA];';
          if(!formal.includes(formalJsNew)){
            if(!formal.includes(formalJs)) throw new Error('FORMAL_JS_BOUNDARY_REQUIRED');
            formal=formal.replace(formalJs,formalJsNew);
          }
          fs.writeFileSync(formalPath,formal);

          let post=fs.readFileSync(postmergePath,'utf8');
          const postEnv="  ROLLING_CURRENT_CROP_CANDIDATE_PROTECTED_MAIN_PREDECESSOR_SHA: 'd82d25f76535b2779ef6b15b3eb32c15c245dedf'";
          const postNew="  ROLLING_STAGE_RESOLVER_PROTECTED_MAIN_PREDECESSOR_SHA: '"+base+"'";
          if(!post.includes(postNew)){
            if(!post.includes(postEnv)) throw new Error('POSTMERGE_ENV_BOUNDARY_REQUIRED');
            post=post.replace(postEnv,postEnv+'\n'+postNew);
          }
          const postCond='[ "$base_sha" != "$ROLLING_CURRENT_CROP_CANDIDATE_PROTECTED_MAIN_PREDECESSOR_SHA" ]';
          const postCondNew=postCond+' && [ "$base_sha" != "$ROLLING_STAGE_RESOLVER_PROTECTED_MAIN_PREDECESSOR_SHA" ]';
          if(!post.includes(postCondNew)){
            if(!post.includes(postCond)) throw new Error('POSTMERGE_SHELL_BOUNDARY_REQUIRED');
            post=post.replace(postCond,postCondNew);
          }
          fs.writeFileSync(postmergePath,post);

      - name: Rebind EA5E2 generated graph exactly
        shell: bash
        run: |
          set -euo pipefail
          rm -rf acceptance-output
          set +e
          node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_RUNTIME_DEPENDENCY_GRAPH_V4.cjs >/tmp/ea5e2-first.out 2>/tmp/ea5e2-first.err
          first=$?
          set -e
          test "$first" -ne 0
          test -f acceptance-output/MCFT_CAP_09_EA5E2_RUNTIME_DEPENDENCY_GRAPH_V4.json
          expected="$(node -e "const p=require('./acceptance-output/MCFT_CAP_09_EA5E2_RUNTIME_DEPENDENCY_GRAPH_V4.json');if(!/^sha256:[0-9a-f]{64}$/.test(p.expected_dependency_graph_sha256||''))process.exit(1);process.stdout.write(p.expected_dependency_graph_sha256)")"
          EXPECTED="$expected" node <<'NODE'
          const fs=require('node:fs');
          const p='scripts/runtime_acceptance/MCFT_CAP_09_EA5E2_RUNTIME_DEPENDENCY_GRAPH_V4_BINDING.cjs';
          let t=fs.readFileSync(p,'utf8');
          const re=/\/\/\s*EA5E2_ROLLING_RUNTIME_DEPENDENCY_GRAPH_SHA256=(?:sha256:[0-9a-f]{64}|__EA5E2_ROLLING_RUNTIME_DEPENDENCY_GRAPH_SHA256__)\s*/;
          if(!re.test(t)) throw new Error('EA5E2_BINDING_MARKER_REQUIRED');
          t=t.replace(re,`// EA5E2_ROLLING_RUNTIME_DEPENDENCY_GRAPH_SHA256=${process.env.EXPECTED}\n`);
          fs.writeFileSync(p,t);
          NODE
          rm -rf acceptance-output
          node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_RUNTIME_DEPENDENCY_GRAPH_V4.cjs
          node -e "const p=require('./acceptance-output/MCFT_CAP_09_EA5E2_RUNTIME_DEPENDENCY_GRAPH_V4.json');if(p.status!=='PASS')process.exit(1);console.log('EA5E2_REBOUND='+p.expected_dependency_graph_sha256)"

      - name: Validate patched governance structure
        shell: node {0}
        env:
          BASE_SHA: d67a2b3cce037c1eaad4d7d051d1f6a11eb09fc3
        run: |
          const fs=require('node:fs');
          const base=process.env.BASE_SHA;
          const q=JSON.parse(fs.readFileSync('docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-CONTROL-PLANE-V1.json','utf8'));
          const r=JSON.parse(fs.readFileSync('docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-EVIDENCE-REGISTRY-V1.json','utf8'));
          const rid='TWIN_V2_ROLLING_STAGE_AUTHORITY_RESOLVER_SEAM_V1';
          const check=q.checks.find(x=>x.check_id==='TWIN_V2_ROLLING_STAGE_AUTHORITY_RESOLVER_SEAM');
          if(!q.governed_successor_predecessor_shas.includes(base)) throw new Error('QCP_BASE_NOT_GOVERNED');
          if(!q.dependency_resolvers[rid]||q.dependency_resolvers[rid].paths.length!==4) throw new Error('RESOLVER_REGISTRATION_INVALID');
          if(!check||check.resolver_ids.length!==1||check.resolver_ids[0]!==rid||check.execution_workflow!=='.github/workflows/mcft-cap-09-twin-v2-rolling-stage-authority-resolver-seam-v1.yml') throw new Error('CHECK_REGISTRATION_INVALID');
          if(!r.requalification_evidence.durable_anchors.rules.governed_successor_predecessors.includes(base)) throw new Error('REGISTRY_BASE_NOT_GOVERNED');
          const formal=fs.readFileSync('.github/workflows/mcft-cap-09-qualification-control-plane-v1.yml','utf8');
          const post=fs.readFileSync('.github/workflows/mcft-cap-09-post-merge-v13-control-plane-v1.yml','utf8');
          if((formal.match(/ROLLING_STAGE_RESOLVER_PROTECTED_MAIN_PREDECESSOR_SHA/g)||[]).length<3) throw new Error('FORMAL_PREDECESSOR_NOT_FULLY_PATCHED');
          if((post.match(/ROLLING_STAGE_RESOLVER_PROTECTED_MAIN_PREDECESSOR_SHA/g)||[]).length<2) throw new Error('POSTMERGE_PREDECESSOR_NOT_FULLY_PATCHED');

      - name: Create settlement commit and attempt push
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-CONTROL-PLANE-V1.json \
            docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-EVIDENCE-REGISTRY-V1.json \
            scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_ALL_BLOCKERS_V1.cjs \
            scripts/runtime_acceptance/MCFT_CAP_09_EA5E2_RUNTIME_DEPENDENCY_GRAPH_V4_BINDING.cjs \
            .github/workflows/mcft-cap-09-qualification-control-plane-v1.yml \
            .github/workflows/mcft-cap-09-post-merge-v13-control-plane-v1.yml
          git commit -m 'chore(mcft-cap09): govern rolling stage resolver successor'
          echo "SETTLEMENT_COMMIT=$(git rev-parse HEAD)"
          echo "SETTLEMENT_PARENT=$(git rev-parse HEAD^)"
          echo "SETTLEMENT_TREE=$(git rev-parse HEAD^{tree})"
          set +e
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          code=$?
          set -e
          echo "PUSH_EXIT_CODE=$code"
          exit "$code"

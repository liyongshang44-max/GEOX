name: mcft-cap-08-s6-formal-cross-run-comparator-authority-candidate

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-08-s6-formal-cross-run-comparator-authority-candidate.yml'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-FORMAL-CROSS-RUN-COMPARATOR-AUTHORITY-CANDIDATE-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-FORMAL-CROSS-RUN-COMPARATOR-AUTHORITY-OBJECT-SET-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-FORMAL-CROSS-RUN-COMPARATOR-AUTHORITY-ISSUANCE-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-FORMAL-CROSS-RUN-COMPARATOR-AUTHORITY-BOUNDARY-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_FORMAL_CROSS_RUN_COMPARATOR_AUTHORITY_CANDIDATE_V1.cjs'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: read

concurrency:
  group: mcft-cap08-s6-formal-cross-run-comparator-authority-candidate-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  authority-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact authority candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
      - name: Download exact settled Formal RUN_A artifact
        uses: actions/download-artifact@v4
        with:
          name: mcft-cap-08-s6-RUN_A-ce9d6b4df8c708c0d4a99bb24846e1bc44b3cf59
          path: acceptance-input/formal-run-a
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30845476698
      - name: Download exact settled Formal RUN_B artifact
        uses: actions/download-artifact@v4
        with:
          name: mcft-cap-08-s6-RUN_B-ce9d6b4df8c708c0d4a99bb24846e1bc44b3cf59
          path: acceptance-input/formal-run-b
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30877450717
      - name: Audit exact formal inputs and comparator implementation qualification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance-input
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'mcft-cap08-formal-comparator-authority-candidate'}
          def get(path):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}{path}',headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          runs={'run_a':get('/actions/runs/30845476698'),'run_b':get('/actions/runs/30877450717'),'implementation':get('/actions/runs/30881117123')}
          artifact_specs={'run_a':(30845476698,8868535301),'run_b':(30877450717,8880057024),'implementation':(30881117123,8881320548)}
          artifacts={}
          for key,(run_id,artifact_id) in artifact_specs.items():
              items=get(f'/actions/runs/{run_id}/artifacts?per_page=100').get('artifacts',[])
              item=next((x for x in items if x.get('id')==artifact_id),None)
              if item is None: raise SystemExit(f'MISSING_ARTIFACT:{key}:{artifact_id}')
              artifacts[key]={'id':item['id'],'name':item['name'],'digest':item.get('digest'),'expired':item.get('expired')}
          result={'schema_version':'geox_mcft_cap08_s6_formal_cross_run_comparator_authority_input_audit_v1','status':'PASS','exact_subject_sha':'ce9d6b4df8c708c0d4a99bb24846e1bc44b3cf59','run_a':{'workflow_run_id':runs['run_a']['id'],'workflow_run_attempt':runs['run_a']['run_attempt'],'event':runs['run_a']['event'],'conclusion':runs['run_a']['conclusion'],'head_sha':runs['run_a']['head_sha'],'artifact_id':artifacts['run_a']['id'],'artifact_digest':artifacts['run_a']['digest']},'run_b':{'workflow_run_id':runs['run_b']['id'],'workflow_run_attempt':runs['run_b']['run_attempt'],'event':runs['run_b']['event'],'conclusion':runs['run_b']['conclusion'],'head_sha':runs['run_b']['head_sha'],'artifact_id':artifacts['run_b']['id'],'artifact_digest':artifacts['run_b']['digest']},'implementation':{'workflow_run_id':runs['implementation']['id'],'workflow_run_attempt':runs['implementation']['run_attempt'],'event':runs['implementation']['event'],'conclusion':runs['implementation']['conclusion'],'head_sha':runs['implementation']['head_sha'],'artifact_id':artifacts['implementation']['id'],'artifact_digest':artifacts['implementation']['digest']}}
          with open('acceptance-input/FORMAL_COMPARATOR_AUTHORITY_INPUT_AUDIT.json','w',encoding='utf-8') as f: json.dump(result,f,indent=2); f.write('\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Validate non-effective comparator authority candidate
        env:
          MCFT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          MCFT_RUN_A_ARTIFACT_DIR: acceptance-input/formal-run-a
          MCFT_RUN_B_ARTIFACT_DIR: acceptance-input/formal-run-b
          MCFT_COMPARATOR_INPUT_AUDIT: acceptance-input/FORMAL_COMPARATOR_AUTHORITY_INPUT_AUDIT.json
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_FORMAL_CROSS_RUN_COMPARATOR_AUTHORITY_CANDIDATE_V1.cjs
      - name: Upload authority candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap-08-s6-formal-cross-run-comparator-authority-candidate-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: |
            acceptance-output/MCFT_CAP_08_S6_FORMAL_CROSS_RUN_COMPARATOR_AUTHORITY_CANDIDATE_RESULT.json
            acceptance-input/FORMAL_COMPARATOR_AUTHORITY_INPUT_AUDIT.json
          if-no-files-found: error
          retention-days: 365

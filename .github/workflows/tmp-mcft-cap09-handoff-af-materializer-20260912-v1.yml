name: TMP MCFT CAP-09 Handoff AF Materializer 20260912 v1

on:
  push:
    branches:
      - tmp/mcft-cap09-handoff-af-materializer-20260912-v1
    paths:
      - docs/handoff/.tmp/GEOX-MCFT-CAP-09-HANDOFF-AF-PAYLOAD-2026-09-12.md
      - .github/workflows/tmp-mcft-cap09-handoff-af-materializer-20260912-v1.yml

permissions:
  contents: write

jobs:
  clean-graft-af:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temp carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize and validate AF pure-prepend clean graft
        shell: bash
        env:
          EXPECTED_PARENT: ffedcad99d8cd1907fd1c4f516112e0396489fea
          TARGET_BRANCH: docs/mcft-cap09-handoff-2026-08-26-phase2-evidence-module-frontier
          HANDOFF: docs/handoff/GEOX-MCFT-CAP-09-HANDOFF-2026-08-27.md
          PAYLOAD: docs/handoff/.tmp/GEOX-MCFT-CAP-09-HANDOFF-AF-PAYLOAD-2026-09-12.md
          SENTINEL: '<!-- MCFT_CAP09_HANDOFF_AF_PAYLOAD_END -->'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$TARGET_BRANCH" --no-tags

          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_PARENT" || {
            echo "AUTHORITATIVE_HEAD_DRIFT expected=$EXPECTED_PARENT actual=$remote_head" >&2
            exit 41
          }

          git cat-file -e "$EXPECTED_PARENT^{commit}"
          git cat-file -e "$EXPECTED_PARENT:$HANDOFF"

          python3 - <<'PY'
          from pathlib import Path
          import os
          raw = Path(os.environ['PAYLOAD']).read_bytes()
          lines = raw.splitlines(keepends=True)
          sentinel = os.environ['SENTINEL'].encode()
          if not lines or lines[-1].rstrip(b'\r\n') != sentinel:
              raise SystemExit('AF_PAYLOAD_SENTINEL_MISSING_OR_TRUNCATED')
          body = b''.join(lines[:-1])
          if not body.startswith(b'# AF '):
              raise SystemExit('AF_PAYLOAD_TOP_HEADING_INVALID')
          if b'# AE ' in body:
              raise SystemExit('AF_PAYLOAD_MUST_NOT_EMBED_PREVIOUS_AE_SECTION')
          Path('/tmp/af-body.bin').write_bytes(body.rstrip(b'\r\n') + b'\n\n')
          PY

          git show "$EXPECTED_PARENT:$HANDOFF" > /tmp/old-handoff.bin

          python3 - <<'PY'
          from pathlib import Path
          old = Path('/tmp/old-handoff.bin').read_bytes()
          af = Path('/tmp/af-body.bin').read_bytes()
          if not old.startswith(b'# AE '):
              raise SystemExit('AUTHORITATIVE_OLD_TOP_NOT_AE')
          new = af + old
          if not new.endswith(old):
              raise SystemExit('OLD_BLOB_NOT_EXACT_SUFFIX')
          Path('/tmp/new-handoff.bin').write_bytes(new)
          PY

          new_blob="$(git hash-object -w /tmp/new-handoff.bin)"
          git read-tree "$EXPECTED_PARENT^{tree}"
          git update-index --add --cacheinfo "100644,$new_blob,$HANDOFF"
          new_tree="$(git write-tree)"
          new_commit="$(printf '%s\n' 'docs(mcft-cap09): hand off CTO digest-stable proof-materialization gate' | git commit-tree "$new_tree" -p "$EXPECTED_PARENT")"

          test "$(git rev-parse "$new_commit^")" = "$EXPECTED_PARENT"

          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$EXPECTED_PARENT" "$new_commit")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$HANDOFF"

          numstat="$(git diff --numstat "$EXPECTED_PARENT" "$new_commit" -- "$HANDOFF")"
          adds="$(printf '%s\n' "$numstat" | awk '{print $1}')"
          dels="$(printf '%s\n' "$numstat" | awk '{print $2}')"
          test "$adds" -gt 0
          test "$dels" -eq 0

          git show "$new_commit:$HANDOFF" > /tmp/final-handoff.bin
          python3 - <<'PY'
          from pathlib import Path
          old = Path('/tmp/old-handoff.bin').read_bytes()
          new = Path('/tmp/final-handoff.bin').read_bytes()
          if not new.endswith(old):
              raise SystemExit('FINAL_OLD_BLOB_NOT_EXACT_SUFFIX')
          if not new.startswith(b'# AF '):
              raise SystemExit('FINAL_TOP_NOT_AF')
          PY

          if git ls-tree -r --name-only "$new_commit" | grep -E 'GEOX-MCFT-CAP-09-HANDOFF-AF-PAYLOAD|tmp-mcft-cap09-handoff-af-materializer' ; then
            echo "TEMP_MATERIALIZER_LEAKED_INTO_FINAL_TREE" >&2
            exit 47
          fi

          remote_head_before_push="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head_before_push" = "$EXPECTED_PARENT"

          git push origin "$new_commit:refs/heads/$TARGET_BRANCH"

          remote_head_after_push="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head_after_push" = "$new_commit"

          echo "AF_CLEAN_GRAFT_PARENT=$EXPECTED_PARENT"
          echo "AF_CLEAN_GRAFT_HEAD=$new_commit"
          echo "AF_ADDITIONS=$adds"
          echo "AF_DELETIONS=$dels"
          echo "AF_MATERIALIZATION=SUCCESS"

name: mcft-cap-09-ea5b5a-external-cap04-state-source

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-ea5b5a-external-cap04-state-source.yml'
      - 'apps/server/src/runtime/twin_runtime/external_formal_cap04_input_authority_v1.ts'
      - 'apps/server/src/runtime/twin_runtime/external_formal_cap04_state_source_builder_v1.ts'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5B5A_EXTERNAL_CAP04_STATE_SOURCE.ts'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA5B5A-EXTERNAL-CAP04-STATE-SOURCE-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5B5A_EXTERNAL_CAP04_STATE_SOURCE.cjs'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: mcft-cap09-ea5b5a-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  external-cap04-state-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm

      - name: Resolve exact EA5B5A base
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_sha=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install exact repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax-check EA5B5A governance gate
        run: node --check scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5B5A_EXTERNAL_CAP04_STATE_SOURCE.cjs

      - name: Validate exact EA5B5A governance boundary
        env:
          MCFT_BASE_SHA: ${{ steps.authority.outputs.base_sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5B5A_EXTERNAL_CAP04_STATE_SOURCE.cjs

      - name: Re-prove CAP08 G3 frozen-core successor compatibility
        env:
          MCFT_BASE_SHA: ${{ steps.authority.outputs.base_sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S2_G3_BOUNDARY.cjs

      - name: Typecheck server
        shell: bash
        run: |
          set -o pipefail
          mkdir -p acceptance-output
          pnpm --filter @geox/server run typecheck 2>&1 | tee acceptance-output/EA5B5A_SERVER_TYPECHECK.log

      - name: Prove External CAP04 input and canonical State-source authority
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5B5A_EXTERNAL_CAP04_STATE_SOURCE.ts

      - name: Re-prove EA5B2 CAP04 External soil binding threading
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5B2_CAP04_EXTERNAL_BINDING_THREADING.ts

      - name: Re-prove EA5B3 External Runtime Config compatibility resolver
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5B3_EXTERNAL_RUNTIME_CONFIG_RESOLVER.ts

      - name: Re-prove EA5B4A External 100-mm operator authority
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5B4A_EXTERNAL_OPERATOR_AUTHORITY.ts

      - name: Re-prove EA5B4B honest External A0 provenance profile
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5B4B_EXTERNAL_A0_PROVENANCE_PROFILE.ts

      - name: Re-prove historical CAP04 single-tick behavior
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_04_SINGLE_TICK_INTEGRATION.ts

      - name: Re-prove historical CAP04 negative behavior
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_04_SINGLE_TICK_INTEGRATION_NEGATIVE.ts

      - name: Verify EA5B5A remains candidate-only
        shell: node {0}
        run: |
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_EA5B5A_EXTERNAL_CAP04_STATE_SOURCE_GOVERNANCE_RESULT.json','utf8'));
          if (result.status !== 'PASS') throw new Error('EA5B5A_GOVERNANCE_PASS_REQUIRED');
          if (result.external_five_source_authority_qualified !== true || result.external_crop_authority_qualified !== true) throw new Error('EA5B5A_INPUT_AUTHORITY_REQUIRED');
          if (result.external_cap04_state_source_candidate_qualified !== true || result.external_100mm_operator_authority_preserved !== true) throw new Error('EA5B5A_STATE_SOURCE_REQUIRED');
          if (result.historical_cap04_state_source_builder_unchanged !== true) throw new Error('EA5B5A_HISTORICAL_BUILDER_INVARIANT_REQUIRED');
          if (result.external_forecast_authority_qualified !== false || result.external_a1_a2_record_set_qualified !== false) throw new Error('EA5B5A_PREMATURE_FORECAST_EFFECT');
          if (result.canonical_persistence_authorized !== false || result.ea5b_complete !== false || result.ea5c_authorized !== false || result.formal_o00_start_authorized !== false) throw new Error('EA5B5A_PREMATURE_FRONTIER_EFFECT');
          if (result.database_write_count !== 0 || result.public_provider_request_count !== 0) throw new Error('EA5B5A_ZERO_WRITE_NONCLAIM_REQUIRED');
          console.log(JSON.stringify({status:'PASS',five_source_authority:true,crop_authority:true,state_source_candidate:true,persistence:false,ea5b_complete:false,ea5c:false,o00:false}));

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap-09-ea5b5a-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_EA5B5A_EXTERNAL_CAP04_STATE_SOURCE_GOVERNANCE_RESULT.json
            acceptance-output/MCFT_CAP_08_S2_G3_BOUNDARY_RESULT.json
            acceptance-output/EA5B5A_SERVER_TYPECHECK.log
          if-no-files-found: warn
          retention-days: 90

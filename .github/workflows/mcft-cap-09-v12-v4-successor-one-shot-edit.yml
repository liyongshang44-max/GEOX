name: mcft-cap-09-v12-v4-successor-one-shot-edit

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-v12-v4-successor-one-shot-edit.yml'

permissions:
  contents: write

jobs:
  exact-branch-edit:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/mcft-cap09-t4r1-v12-formal-v4-successor' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Require exact PR identity and protected-main base
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.event.pull_request.number }}' = '3285'
          test '${{ github.event.pull_request.base.sha }}' = '274ce26d4f67049b891e253e148ed9be571c4bce'
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
      - name: Teach v12 adapter to migrate frozen V3 authority symbols to V4
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/runtime_acceptance/EXECUTE_MCFT_CAP_09_T4R1_AMENDMENT_19_PERSISTENT_24T_SUCCESSOR.ts')
          s = p.read_text()

          old_constants = '''const SOURCE_BLOCKED_DB = "geox_mcft_cap09_s6_accel24t_am19_blocked_v4";\nconst PREVIOUS_MAIN_DB = "geox_mcft_cap09_s6_accel24t_am19_v11";'''
          new_constants = '''const SOURCE_BLOCKED_DB = "geox_mcft_cap09_s6_accel24t_am19_blocked_v4";\nconst SOURCE_AUTHORITY_BLOB_SYMBOL = "MCFT_CAP09_AM19_FRESH_STORE_AUTHORITY_BLOB_V3";\nconst TARGET_AUTHORITY_BLOB_SYMBOL = "MCFT_CAP09_AM19_FRESH_STORE_AUTHORITY_BLOB_V4";\nconst SOURCE_AUTHORITY_REF_SYMBOL = "MCFT_CAP09_AM19_FRESH_STORE_AUTHORITY_REF_V3";\nconst TARGET_AUTHORITY_REF_SYMBOL = "MCFT_CAP09_AM19_FRESH_STORE_AUTHORITY_REF_V4";\nconst PREVIOUS_MAIN_DB = "geox_mcft_cap09_s6_accel24t_am19_v11";'''
          if s.count(old_constants) != 1:
              raise SystemExit(f'MCFT_CAP09_ADAPTER_CONSTANT_INSERTION_CARDINALITY:{s.count(old_constants)}')
          s = s.replace(old_constants, new_constants)

          old_helper = '''function exactReplace(source: string, oldValue: string, newValue: string, code: string): string {\n  const count = source.split(oldValue).length - 1;\n  assert.equal(count, 1, `${code}:${count}`);\n  return source.replace(oldValue, newValue);\n}\n'''
          new_helper = '''function exactReplace(source: string, oldValue: string, newValue: string, code: string): string {\n  const count = source.split(oldValue).length - 1;\n  assert.equal(count, 1, `${code}:${count}`);\n  return source.replace(oldValue, newValue);\n}\n\nfunction exactReplaceCount(source: string, oldValue: string, newValue: string, expectedCount: number, code: string): string {\n  const count = source.split(oldValue).length - 1;\n  assert.equal(count, expectedCount, `${code}:${count}`);\n  return source.split(oldValue).join(newValue);\n}\n'''
          if s.count(old_helper) != 1:
              raise SystemExit(f'MCFT_CAP09_ADAPTER_HELPER_INSERTION_CARDINALITY:{s.count(old_helper)}')
          s = s.replace(old_helper, new_helper)

          old_build = '''  generated = exactReplace(generated, SOURCE_BLOCKED_DB, BLOCKED_DB, "T4R1_AM19_P24_BLOCKED_DB_REPLACEMENT_CARDINALITY");\n  generated = exactReplace(generated, HISTORICAL_CANDIDATE_GATE, SUCCESSOR_CANDIDATE_GATE, "T4R1_AM19_P24_CANDIDATE_GATE_REPLACEMENT_CARDINALITY");\n  assert(!generated.includes(HISTORICAL_PARENT_DB), "T4R1_AM19_P24_HISTORICAL_PARENT_DB_SURVIVED");'''
          new_build = '''  generated = exactReplace(generated, SOURCE_BLOCKED_DB, BLOCKED_DB, "T4R1_AM19_P24_BLOCKED_DB_REPLACEMENT_CARDINALITY");\n  generated = exactReplace(generated, HISTORICAL_CANDIDATE_GATE, SUCCESSOR_CANDIDATE_GATE, "T4R1_AM19_P24_CANDIDATE_GATE_REPLACEMENT_CARDINALITY");\n  generated = exactReplaceCount(generated, SOURCE_AUTHORITY_BLOB_SYMBOL, TARGET_AUTHORITY_BLOB_SYMBOL, 2, "T4R1_AM19_P24_AUTHORITY_BLOB_SYMBOL_REPLACEMENT_CARDINALITY");\n  generated = exactReplaceCount(generated, SOURCE_AUTHORITY_REF_SYMBOL, TARGET_AUTHORITY_REF_SYMBOL, 2, "T4R1_AM19_P24_AUTHORITY_REF_SYMBOL_REPLACEMENT_CARDINALITY");\n  assert(!generated.includes(HISTORICAL_PARENT_DB), "T4R1_AM19_P24_HISTORICAL_PARENT_DB_SURVIVED");'''
          if s.count(old_build) != 1:
              raise SystemExit(f'MCFT_CAP09_ADAPTER_BUILD_INSERTION_CARDINALITY:{s.count(old_build)}')
          s = s.replace(old_build, new_build)

          old_assert = '''  assert(!generated.includes(HISTORICAL_CANDIDATE_GATE), "T4R1_AM19_P24_HISTORICAL_CANDIDATE_GATE_SURVIVED");\n  assert(generated.includes(T4R1_PARENT_DB), "T4R1_AM19_P24_T4_PARENT_DB_REQUIRED");'''
          new_assert = '''  assert(!generated.includes(HISTORICAL_CANDIDATE_GATE), "T4R1_AM19_P24_HISTORICAL_CANDIDATE_GATE_SURVIVED");\n  assert(!generated.includes(SOURCE_AUTHORITY_BLOB_SYMBOL), "T4R1_AM19_P24_V3_AUTHORITY_BLOB_SYMBOL_SURVIVED");\n  assert(!generated.includes(SOURCE_AUTHORITY_REF_SYMBOL), "T4R1_AM19_P24_V3_AUTHORITY_REF_SYMBOL_SURVIVED");\n  assert.equal(generated.split(TARGET_AUTHORITY_BLOB_SYMBOL).length - 1, 2, "T4R1_AM19_P24_V4_AUTHORITY_BLOB_SYMBOL_REQUIRED");\n  assert.equal(generated.split(TARGET_AUTHORITY_REF_SYMBOL).length - 1, 2, "T4R1_AM19_P24_V4_AUTHORITY_REF_SYMBOL_REQUIRED");\n  assert(generated.includes(T4R1_PARENT_DB), "T4R1_AM19_P24_T4_PARENT_DB_REQUIRED");'''
          if s.count(old_assert) != 1:
              raise SystemExit(f'MCFT_CAP09_ADAPTER_ASSERT_INSERTION_CARDINALITY:{s.count(old_assert)}')
          s = s.replace(old_assert, new_assert)

          if s.count('replacement_count: 4,') != 1:
              raise SystemExit(f'MCFT_CAP09_ADAPTER_REPLACEMENT_COUNT_CARDINALITY:{s.count("replacement_count: 4,")}')
          s = s.replace('replacement_count: 4,', 'replacement_count: 8,')
          p.write_text(s)
      - name: Require exact one-file adapter diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = 'scripts/runtime_acceptance/EXECUTE_MCFT_CAP_09_T4R1_AMENDMENT_19_PERSISTENT_24T_SUCCESSOR.ts'
          git diff --check
          grep -Fq 'SOURCE_AUTHORITY_BLOB_SYMBOL' scripts/runtime_acceptance/EXECUTE_MCFT_CAP_09_T4R1_AMENDMENT_19_PERSISTENT_24T_SUCCESSOR.ts
          grep -Fq 'TARGET_AUTHORITY_BLOB_SYMBOL' scripts/runtime_acceptance/EXECUTE_MCFT_CAP_09_T4R1_AMENDMENT_19_PERSISTENT_24T_SUCCESSOR.ts
          grep -Fq 'replacement_count: 8' scripts/runtime_acceptance/EXECUTE_MCFT_CAP_09_T4R1_AMENDMENT_19_PERSISTENT_24T_SUCCESSOR.ts
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
          cache: pnpm
      - name: Install exact repository dependencies
        run: pnpm install --frozen-lockfile
      - name: Execute adapter static proof against generated v12 source
        run: pnpm exec tsx scripts/runtime_acceptance/EXECUTE_MCFT_CAP_09_T4R1_AMENDMENT_19_PERSISTENT_24T_SUCCESSOR.ts selftest
      - name: Commit exact script-only adapter migration to PR branch
        shell: bash
        env:
          BRANCH: fix/mcft-cap09-t4r1-v12-formal-v4-successor
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/runtime_acceptance/EXECUTE_MCFT_CAP_09_T4R1_AMENDMENT_19_PERSISTENT_24T_SUCCESSOR.ts
          git commit -m 'fix(mcft-cap09): migrate v12 generated authority symbols to v4'
          git push origin "HEAD:$BRANCH"

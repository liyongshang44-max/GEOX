name: mcft-cap-09-v12-v4-successor-one-shot-edit

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-v12-v4-successor-one-shot-edit.yml'

permissions:
  contents: write

jobs:
  exact-branch-edit:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/mcft-cap09-t4r1-v12-formal-v4-successor' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Require exact PR identity and protected-main base
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.event.pull_request.number }}' = '3285'
          test '${{ github.event.pull_request.base.sha }}' = '274ce26d4f67049b891e253e148ed9be571c4bce'
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
      - name: Migrate shared manifest authority symbols from V3 aliases to explicit V4 bindings
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/runtime_acceptance/mcft_cap09_amendment19_formal_manifest_from_arm_v1.ts')
          s = p.read_text()
          replacements = {
              'MCFT_CAP09_AM19_FRESH_STORE_AUTHORITY_BLOB_V3': 'MCFT_CAP09_AM19_FRESH_STORE_AUTHORITY_BLOB_V4',
              'MCFT_CAP09_AM19_FRESH_STORE_AUTHORITY_REF_V3': 'MCFT_CAP09_AM19_FRESH_STORE_AUTHORITY_REF_V4',
          }
          for old, new in replacements.items():
              if s.count(old) != 2:
                  raise SystemExit(f'MCFT_CAP09_MANIFEST_AUTHORITY_SYMBOL_CARDINALITY_REQUIRED:{old}:{s.count(old)}')
              if s.count(new) != 0:
                  raise SystemExit(f'MCFT_CAP09_MANIFEST_AUTHORITY_V4_PREEXISTING_UNEXPECTED:{new}:{s.count(new)}')
              s = s.replace(old, new)
          p.write_text(s)
          for old, new in replacements.items():
              if old in s or s.count(new) != 2:
                  raise SystemExit(f'MCFT_CAP09_MANIFEST_AUTHORITY_SYMBOL_MIGRATION_FAILED:{old}:{new}')
      - name: Require exact one-file diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = 'scripts/runtime_acceptance/mcft_cap09_amendment19_formal_manifest_from_arm_v1.ts'
          git diff --check
          test "$(git diff --numstat | awk '{print $1":"$2}')" = '4:4'
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
          cache: pnpm
      - name: Install exact repository dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck migrated shared manifest seam
        run: >-
          pnpm exec tsc --noEmit --pretty false --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext --esModuleInterop --types node
          scripts/runtime_acceptance/mcft_cap09_amendment19_formal_manifest_from_arm_v1.ts
      - name: Commit exact script-only migration to PR branch
        shell: bash
        env:
          BRANCH: fix/mcft-cap09-t4r1-v12-formal-v4-successor
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/runtime_acceptance/mcft_cap09_amendment19_formal_manifest_from_arm_v1.ts
          git commit -m 'fix(mcft-cap09): bind shared manifest to v4 authority symbols'
          git push origin "HEAD:$BRANCH"

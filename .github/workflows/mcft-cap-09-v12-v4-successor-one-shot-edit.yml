name: mcft-cap-09-v12-v4-successor-one-shot-edit

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-v12-v4-successor-one-shot-edit.yml'

permissions:
  contents: read

jobs:
  exact-branch-edit:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/mcft-cap09-t4r1-v12-formal-v4-successor' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact PR identity and protected-main base
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.event.pull_request.number }}' = '3285'
          test '${{ github.event.pull_request.base.sha }}' = '274ce26d4f67049b891e253e148ed9be571c4bce'
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
      - name: Apply exact v3-to-v4 operational token edits
        shell: python
        run: |
          from pathlib import Path

          old_db = 'geox_mcft_cap09_s6_formal_t4r1_24h_v3'
          new_db = 'geox_mcft_cap09_s6_formal_t4r1_24h_v4'
          declared = [
              'scripts/governance_acceptance/ASSEMBLE_MCFT_CAP_09_AMENDMENT_19_FORMAL_COMPLETION_V1.cjs',
              'scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_AMENDMENT_19_FORMAL_DOWNSTREAM_ZERO_V1.ts',
              'scripts/runtime_acceptance/READBACK_MCFT_CAP_09_AMENDMENT_19_FORMAL_FINAL_V1.ts',
              '.github/workflows/mcft-cap-09-amendment19-formal-a0-bootstrap.yml',
              '.github/workflows/mcft-cap-09-amendment19-formal-hourly-evidence.yml',
              '.github/workflows/mcft-cap-09-amendment19-formal-live-runner.yml',
              '.github/workflows/mcft-cap-09-amendment19-formal-final-readback.yml',
          ]
          counts = {}
          for name in declared:
              p = Path(name)
              s = p.read_text()
              n = s.count(old_db)
              counts[name] = n
              if n:
                  p.write_text(s.replace(old_db, new_db))
          if not any(counts.values()):
              raise SystemExit('MCFT_CAP09_V12_V4_NO_OPERATIONAL_V3_TOKENS_FOUND')
          Path('/tmp/v12-v4-counts.txt').write_text(repr(counts) + '\n')
          print(counts)
      - name: Require diff is limited to declared operational bindings
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(.github/workflows/mcft-cap-09-amendment19-formal-(a0-bootstrap|hourly-evidence|live-runner|final-readback)\.yml|scripts/governance_acceptance/ASSEMBLE_MCFT_CAP_09_AMENDMENT_19_FORMAL_COMPLETION_V1\.cjs|scripts/runtime_acceptance/(VERIFY_MCFT_CAP_09_AMENDMENT_19_FORMAL_DOWNSTREAM_ZERO_V1\.ts|READBACK_MCFT_CAP_09_AMENDMENT_19_FORMAL_FINAL_V1\.ts))$'
          git diff --name-only | while read -r p; do [[ "$p" =~ $allowed ]] || { echo "MCFT_CAP09_V12_V4_UNDECLARED_EDIT:$p" >&2; exit 1; }; done
          test -n "$(git diff --name-only)"
          git diff --check
          git diff > /tmp/v12-v4-operational-bindings.patch
      - name: Stage verified transformed files for artifact export
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/v12-v4-transformed
          mkdir -p "$out/scripts/governance_acceptance" "$out/scripts/runtime_acceptance" "$out/.github/workflows"
          cp scripts/governance_acceptance/ASSEMBLE_MCFT_CAP_09_AMENDMENT_19_FORMAL_COMPLETION_V1.cjs "$out/scripts/governance_acceptance/"
          cp scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_AMENDMENT_19_FORMAL_DOWNSTREAM_ZERO_V1.ts "$out/scripts/runtime_acceptance/"
          cp .github/workflows/mcft-cap-09-amendment19-formal-a0-bootstrap.yml "$out/.github/workflows/"
          cp .github/workflows/mcft-cap-09-amendment19-formal-hourly-evidence.yml "$out/.github/workflows/"
          cp .github/workflows/mcft-cap-09-amendment19-formal-live-runner.yml "$out/.github/workflows/"
          cp .github/workflows/mcft-cap-09-amendment19-formal-final-readback.yml "$out/.github/workflows/"
      - name: Upload verified replacement artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-v12-v4-verified-operational-files-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: |
            /tmp/v12-v4-operational-bindings.patch
            /tmp/v12-v4-counts.txt
            /tmp/v12-v4-transformed
          if-no-files-found: error
          retention-days: 14

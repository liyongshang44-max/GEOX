name: pfe-14-s4-product-completeness-adjudication-v1

on:
  pull_request:
    paths:
      - 'docs/frontend-productization/PFE-14-S4-PRODUCT-COMPLETENESS-ADJUDICATION-V1.md'
      - 'docs/frontend-productization/PFE-14-S4-PRODUCT-COMPLETENESS-ADJUDICATION-V1.json'
      - 'docs/frontend-productization/PFE-14-CURRENT-AUTHORITY.json'
      - 'scripts/frontend_acceptance/ACCEPTANCE_PFE_14_S4_PRODUCT_COMPLETENESS_ADJUDICATION_V1.cjs'
      - '.github/workflows/pfe-14-s4-product-completeness-adjudication-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  completeness-adjudication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Revalidate current partial readback boundary
        run: node scripts/frontend_acceptance/ACCEPTANCE_PFE_14_S4_SINGLE_SCOPE_OPERATIONAL_READBACK_V1.cjs
      - name: Validate S4 product completeness classification
        run: node scripts/frontend_acceptance/ACCEPTANCE_PFE_14_S4_PRODUCT_COMPLETENESS_ADJUDICATION_V1.cjs

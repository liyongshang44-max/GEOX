name: pfe-14-class-b-operational-projection-qualification-v1

on:
  pull_request:
    paths:
      - 'docs/frontend-productization/PFE-14-CLASS-B-OPERATIONAL-PROJECTION-QUALIFICATION-V1.md'
      - 'docs/frontend-productization/PFE-14-CLASS-B-OPERATIONAL-PROJECTION-QUALIFICATION-V1.json'
      - 'docs/frontend-productization/PFE-14-CURRENT-AUTHORITY.json'
      - 'scripts/frontend_acceptance/ACCEPTANCE_PFE_14_CLASS_B_OPERATIONAL_PROJECTION_QUALIFICATION_V1.cjs'
      - 'scripts/frontend_acceptance/ACCEPTANCE_PFE_14_CLASS_B_OPERATIONAL_PROJECTION_ADJUDICATION_V1.cjs'
      - 'scripts/frontend_acceptance/ACCEPTANCE_PFE_14_EVIDENCE_HEALTH_PRODUCTIZATION_V1.cjs'
      - 'scripts/frontend_acceptance/ACCEPTANCE_PFE_14_EVIDENCE_HEALTH_PRODUCTIZATION_QUALIFICATION_V1.cjs'
      - 'scripts/frontend_acceptance/ACCEPTANCE_PFE_14_STATE_FORECAST_PRODUCTIZATION_V1.cjs'
      - 'scripts/frontend_acceptance/ACCEPTANCE_PFE_14_STATE_FORECAST_PRODUCTIZATION_QUALIFICATION_V1.cjs'
      - 'scripts/frontend_acceptance/ACCEPTANCE_PFE_14_S4_SINGLE_SCOPE_OPERATIONAL_READBACK_V1.cjs'
      - 'scripts/frontend_acceptance/ACCEPTANCE_PFE_14_MCFT09_OPERATIONAL_READ_PROVIDER_QUALIFICATION_V1.cjs'
      - '.github/workflows/pfe-14-class-b-operational-projection-qualification-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-class-b-operational-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
      - name: Revalidate Class-B adjudication exact-head boundary
        run: node scripts/frontend_acceptance/ACCEPTANCE_PFE_14_CLASS_B_OPERATIONAL_PROJECTION_ADJUDICATION_V1.cjs
      - name: Validate Class-B qualification authority
        run: node scripts/frontend_acceptance/ACCEPTANCE_PFE_14_CLASS_B_OPERATIONAL_PROJECTION_QUALIFICATION_V1.cjs
      - name: Revalidate Evidence Health candidate
        run: node scripts/frontend_acceptance/ACCEPTANCE_PFE_14_EVIDENCE_HEALTH_PRODUCTIZATION_V1.cjs
      - name: Revalidate Evidence Health qualification
        run: node scripts/frontend_acceptance/ACCEPTANCE_PFE_14_EVIDENCE_HEALTH_PRODUCTIZATION_QUALIFICATION_V1.cjs
      - name: Revalidate State Forecast candidate
        run: node scripts/frontend_acceptance/ACCEPTANCE_PFE_14_STATE_FORECAST_PRODUCTIZATION_V1.cjs
      - name: Revalidate State Forecast qualification
        run: node scripts/frontend_acceptance/ACCEPTANCE_PFE_14_STATE_FORECAST_PRODUCTIZATION_QUALIFICATION_V1.cjs
      - name: Revalidate historical Scheduler Evidence readback
        run: node scripts/frontend_acceptance/ACCEPTANCE_PFE_14_S4_SINGLE_SCOPE_OPERATIONAL_READBACK_V1.cjs
      - name: Revalidate historical operational provider qualification
        run: node scripts/frontend_acceptance/ACCEPTANCE_PFE_14_MCFT09_OPERATIONAL_READ_PROVIDER_QUALIFICATION_V1.cjs

name: tmp-mcft-cap09-s5-registry-input-export

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-mcft-cap09-s5-registry-input-export.yml'

permissions:
  contents: write

jobs:
  materialize-validator-blobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mcft-cap09-s5-registry-input-export
          fetch-depth: 0
      - name: Expand and verify exact validator blobs
        run: |
          set -euo pipefail
          gzip -dc tmp/ACCEPTANCE_MCFT_CAP_09_S2_REGISTRY_CROSS_LIFECYCLE_REPAIR.cjs.gz > tmp/ACCEPTANCE_MCFT_CAP_09_S2_REGISTRY_CROSS_LIFECYCLE_REPAIR.cjs
          gzip -dc tmp/ACCEPTANCE_MCFT_CAP_09_S5_REGISTRY_REGISTRATION.cjs.gz > tmp/ACCEPTANCE_MCFT_CAP_09_S5_REGISTRY_REGISTRATION.cjs
          test "$(git hash-object tmp/ACCEPTANCE_MCFT_CAP_09_S2_REGISTRY_CROSS_LIFECYCLE_REPAIR.cjs)" = "8a2734ce3adfb82e7e432f2a89485b76c9b5e791"
          test "$(git hash-object tmp/ACCEPTANCE_MCFT_CAP_09_S5_REGISTRY_REGISTRATION.cjs)" = "86cbf1566b936a2d72bf3e6be2135473c9e022e7"
          node --check tmp/ACCEPTANCE_MCFT_CAP_09_S2_REGISTRY_CROSS_LIFECYCLE_REPAIR.cjs
          node --check tmp/ACCEPTANCE_MCFT_CAP_09_S5_REGISTRY_REGISTRATION.cjs
      - name: Commit temporary exact validator carriers
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f \
            tmp/ACCEPTANCE_MCFT_CAP_09_S2_REGISTRY_CROSS_LIFECYCLE_REPAIR.cjs \
            tmp/ACCEPTANCE_MCFT_CAP_09_S5_REGISTRY_REGISTRATION.cjs
          git diff --cached --quiet || git commit -m 'chore(mcft-cap09): materialize exact S5 validator blobs'
          git push origin HEAD:agent/mcft-cap09-s5-registry-input-export

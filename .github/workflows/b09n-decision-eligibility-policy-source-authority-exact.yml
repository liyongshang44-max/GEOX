name: b09n-decision-eligibility-policy-source-authority-exact

on:
  push:
    branches:
      - ci/bline-b09n-decision-eligibility-policy-source-authority-exact-2026-08-28

jobs:
  exact-product-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove literal B-09n product head checkout
        run: |
          git checkout 5f8012f90882e94203a2407e718dcb963ced1375
          test "$(git rev-parse HEAD)" = "5f8012f90882e94203a2407e718dcb963ced1375"
          test "$(git rev-parse HEAD^)" = "dd39f74e4e44de9c0626c063522904f8e255e89c"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace dependencies
        run: |
          pnpm --filter @geox/contracts build
          pnpm --filter @geox/device-skills build
          pnpm --filter @geox/skill-registry build

      - name: B-02 semantic governance
        run: node scripts/governance_acceptance/ACCEPTANCE_B02_SEMANTIC_CONTRACT_LINTER_V1.cjs

      - name: B-09n governance acceptance
        run: node scripts/governance_acceptance/ACCEPTANCE_B09N_DECISION_ELIGIBILITY_POLICY_SOURCE_AUTHORITY_INVENTORY_V1.cjs

      - name: B-09m declaration contract regression
        run: node --import tsx --test apps/server/src/contracts/decision_eligibility_policy_declaration_v1.contract.test.ts

      - name: B-07d evaluator contract regression
        run: node --import tsx --test apps/server/src/domain/decision/decision_eligibility_evaluator_v1.contract.test.ts

      - name: B-07e runtime contract regression
        run: node --import tsx --test apps/server/src/domain/decision/decision_eligibility_runtime_v1.contract.test.ts

      - name: Prove source/runtime surfaces are byte-identical
        run: |
          git diff --exit-code dd39f74e4e44de9c0626c063522904f8e255e89c 5f8012f90882e94203a2407e718dcb963ced1375 --             apps/server/src/contracts/decision_eligibility_policy_declaration_v1.ts             apps/server/src/contracts/decision_eligibility_policy_declaration_v1.contract.test.ts             packages/contracts/src/schema/field_program_v1.ts             apps/server/src/routes/programs_core_v1.ts             apps/server/src/routes/decision_engine_v1.ts             apps/server/src/domain/planner/compiler_v1.ts             apps/server/src/domain/decision/decision_eligibility_evaluator_v1.ts             apps/server/src/domain/decision/decision_eligibility_runtime_v1.ts
          echo "B09N_SOURCE_RUNTIME_SURFACES_UNCHANGED_PASS"

      - name: Product diff remains bounded
        run: |
          git diff --name-only dd39f74e4e44de9c0626c063522904f8e255e89c 5f8012f90882e94203a2407e718dcb963ced1375 > /tmp/b09n-files.txt
          cat /tmp/b09n-files.txt
          test "$(wc -l < /tmp/b09n-files.txt | tr -d ' ')" = "4"
          grep -qx "docs/architecture/semantic_convergence/GEOX-B09N-DECISION-ELIGIBILITY-POLICY-SOURCE-AUTHORITY-INVENTORY-V1.json" /tmp/b09n-files.txt
          grep -qx "docs/architecture/semantic_convergence/GEOX-B09N-DECISION-ELIGIBILITY-POLICY-SOURCE-AUTHORITY-INVENTORY-V1.md" /tmp/b09n-files.txt
          grep -qx "docs/architecture/semantic_convergence/GEOX-SEMANTIC-OWNERSHIP-REGISTER-V1.json" /tmp/b09n-files.txt
          grep -qx "scripts/governance_acceptance/ACCEPTANCE_B09N_DECISION_ELIGIBILITY_POLICY_SOURCE_AUTHORITY_INVENTORY_V1.cjs" /tmp/b09n-files.txt
          git diff --check dd39f74e4e44de9c0626c063522904f8e255e89c 5f8012f90882e94203a2407e718dcb963ced1375
          echo "B09N_BOUNDED_PRODUCT_DIFF_PASS"

      - name: Runtime schema workflow graph Twin MCFT remain untouched
        run: |
          git diff --exit-code dd39f74e4e44de9c0626c063522904f8e255e89c 5f8012f90882e94203a2407e718dcb963ced1375 --             apps/server/src             apps/server/db             packages             .github/workflows             docs/architecture/semantic_convergence/GEOX-PARALLEL-AUTHORITY-GRAPH-V1.json             docs/architecture/semantic_convergence/GEOX-B09-REPLACEMENT-READINESS-V1.json             docs/twin_kernel             docs/digital_twin             docker-compose.commercial_v1.yml
          echo "B09N_RUNTIME_SCHEMA_WORKFLOW_GRAPH_TWIN_MCFT_UNTOUCHED_PASS"

      - name: Server typecheck
        run: pnpm --filter @geox/server typecheck

      - name: Server build
        run: pnpm --filter @geox/server build

      - name: Prove validation did not mutate product
        run: |
          test "$(git rev-parse HEAD)" = "5f8012f90882e94203a2407e718dcb963ced1375"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "B09N_VALIDATION_ONLY_NO_PRODUCT_MUTATION_PASS"

      - name: Marker
        run: |
          echo "B09N_EXACT_HEAD 5f8012f90882e94203a2407e718dcb963ced1375"
          echo "B09N_POLICY_SOURCE_AUTHORITY_INVENTORY_PASS"

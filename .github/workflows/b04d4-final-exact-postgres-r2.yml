name: b04d4-final-exact-postgres-r2

on:
  push:
    branches:
      - ci/bline-b04d4-final-exact-postgres-r2-2026-08-27

jobs:
  exact-head:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: geox
          POSTGRES_PASSWORD: geox
          POSTGRES_DB: geox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geox -d geox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://geox:geox@127.0.0.1:5432/geox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build runtime workspace dependencies
        run: |
          pnpm --filter @geox/contracts build
          pnpm --filter @geox/device-skills build
          pnpm --filter @geox/skill-registry build

      - name: Server typecheck
        run: pnpm --filter @geox/server typecheck

      - name: B-02 machine governance
        run: node scripts/governance_acceptance/ACCEPTANCE_B02_SEMANTIC_CONTRACT_LINTER_V1.cjs

      - name: B-04d4 marker and temporal fixtures
        run: |
          node --import tsx --test apps/server/src/domain/sensing/raw_sample_runtime_availability_marker_v1.test.ts
          node --import tsx --test apps/server/src/evidence/raw_sample_evidence_qualification_projection_v1.test.ts
          node --import tsx --test apps/server/src/domain/sensing/appleii_canonical_evidence_projection_v1.test.ts
          node --import tsx --test apps/server/src/domain/sensing/raw_sample_authority_time_scope_v1.test.ts
          node --import tsx --test apps/server/src/domain/decision/stage1_canonical_evidence_shadow_visibility_v1.test.ts

      - name: Prior B-04 physical-QC regressions
        run: |
          node --import tsx --test apps/server/src/evidence/physical_qc_v1.test.ts
          node --import tsx --test apps/server/src/evidence/ingress_physical_qc_snapshot_v1.test.ts
          node --import tsx --test apps/server/src/evidence/raw_sample_stage1_physical_qc_v1.test.ts
          node --import tsx --test apps/server/src/evidence/stage1_physical_qc_consumption_guard_v1.test.ts
          node --import tsx --test apps/server/src/domain/sensing/appleii_evidence_physical_qc_v1.test.ts
          node --import tsx --test apps/server/src/services/device_observation_stage1_physical_qc_guard_v1.test.ts

      - name: Real PostgreSQL post-COMMIT proof
        shell: bash
        run: |
          cat > .b04d4_postgres_proof.ts <<'TS'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          import { Pool } from "pg";
          import {
            appendRawSampleV1,
            rawSampleRuntimeAvailabilityMarkerIdV1,
          } from "./apps/server/src/domain/sensing/raw_sample_fact_envelope_v1.ts";
          import {
            projectRawSampleEvidenceQualificationV1,
          } from "./apps/server/src/evidence/raw_sample_evidence_qualification_projection_v1.ts";

          async function main() {
            const pool = new Pool({ connectionString: process.env.DATABASE_URL });
            try {
              await pool.query(fs.readFileSync("docker/postgres/init/001_schema.sql", "utf8"));
              await pool.query(fs.readFileSync("apps/server/db/migrations/2026_04_16_bootstrap_alignment.sql", "utf8"));
              await pool.query(fs.readFileSync("apps/server/db/migrations/2026_05_15_fact_envelope_v1.sql", "utf8"));

              const observedMs = Date.parse("2026-08-27T07:00:00Z");
              const item = await appendRawSampleV1(
                pool,
                {
                  sample_id: "rs_b04d4_final_pg_001",
                  sensor_id: "dev_pg_001",
                  field_id: "fieldA",
                  ts_ms: observedMs,
                  metric: "soil_moisture",
                  value: 0.22,
                  unit: "m3/m3",
                  qc_quality: "ok",
                  source: "device",
                  payload: {},
                },
                { tenant_id: "tenantA", project_id: "projectA", group_id: "groupA" },
              );

              const got = await pool.query(
                `SELECT rs.created_at,
                        m.occurred_at AS available_to_runtime_at,
                        m.kind,
                        m.source,
                        m.payload_json
                   FROM raw_samples rs
                   JOIN markers m ON m.marker_id = $2
                  WHERE rs.sample_id = $1`,
                [item.sample_id, rawSampleRuntimeAvailabilityMarkerIdV1(item.sample_id)],
              );
              assert.equal(got.rowCount, 1);
              const row = got.rows[0];
              const createdMs = new Date(row.created_at).getTime();
              const availableMs = new Date(row.available_to_runtime_at).getTime();
              assert.ok(availableMs >= createdMs);
              assert.equal(row.kind, "raw_sample_runtime_available_v1");
              assert.equal(row.source, "system");
              assert.equal(row.payload_json.sample_id, item.sample_id);

              const fact = await pool.query("SELECT fact_id FROM facts WHERE fact_id = $1", [item.fact_id]);
              assert.equal(fact.rowCount, 1);

              const qualification = projectRawSampleEvidenceQualificationV1({
                sample: {
                  sample_id: item.sample_id,
                  sensor_id: item.sensor_id,
                  ts_ms: item.ts_ms,
                  metric: item.metric,
                  source: item.source,
                  payload_json: item.payload_json,
                  created_at: row.created_at,
                  available_to_runtime_at: row.available_to_runtime_at,
                },
                decision_time_ms: availableMs + 1,
                requested_scope: {
                  tenant_id: "tenantA",
                  project_id: "projectA",
                  group_id: "groupA",
                  field_id: "fieldA",
                },
                source_formal_eligible: true,
                quality_decision: {
                  quality_flags: ["OK"],
                  observation_pipeline_eligible: true,
                  reason_code: "RAW_SAMPLE_QC_OK",
                },
                physical_qc_decision: {
                  eligible: true,
                  mode: "QUALIFIED",
                  reason_code: "RAW_SAMPLE_PHYSICAL_QC_PASS",
                },
                conflict_state: "NONE",
              });

              assert.equal(qualification.temporal_eligibility, "ELIGIBLE");
              assert.equal(qualification.evidence_authority, "QUALIFIED");
              assert.equal(qualification.role_eligibility[0]?.eligibility, "ELIGIBLE");

              console.log("B04D4_FINAL_POSTGRES_RAW_FACT_PRESENT", item.fact_id);
              console.log("B04D4_FINAL_POSTGRES_AVAILABLE_TO_RUNTIME_AT", new Date(availableMs).toISOString());
              console.log("B04D4_FINAL_POSTGRES_TEMPORAL_ELIGIBILITY", qualification.temporal_eligibility);
              console.log("B04D4_FINAL_POSTGRES_PROOF_PASS");
            } finally {
              await pool.end();
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          TS
          pnpm -w exec tsx .b04d4_postgres_proof.ts
          rm -f .b04d4_postgres_proof.ts

      - name: Server build
        run: pnpm --filter @geox/server build

      - name: Marker
        run: |
          echo "B04D4_FINAL_PRODUCT_HEAD 730bc7d0fc386aaffad5a83c3548a4c4c849469e"
          echo "B04D4_FINAL_EXACT_POSTGRES_PASS"

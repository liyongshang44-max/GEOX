name: mcft-cap09-da9-signed-v2-governance-readonly-v1
on:
  pull_request:
    paths:
      - ".github/workflows/mcft-cap09-da9-signed-v2-governance-readonly-v1.yml"
      - "scripts/governance_acceptance/REVIEW_MCFT_CAP09_DA9_SIGNED_V2_PHASE3_FROZEN_V13_V1.cjs"
      - "docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP09-DA9-SIGNED-V2-PHASE3-FROZEN-V13-GOVERNANCE-REVIEW-V1.json"
      - "docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP09-DA9-SIGNED-V2-QCP-TECHNICAL-ENROLLMENT-V1.json"
      - "docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP09-DA9-SIGNED-V2-FORMAL-GOVERNANCE-ADMISSION-REQUEST-V1.json"
      - "docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP09-DA9-SIGNED-V2-OWNER-DIRECTED-SOURCE-ADMISSION-V1.json"
      - "scripts/governance_acceptance/VERIFY_MCFT_CAP09_DA9_V2_OWNER_DIRECTED_SOURCE_ADMISSION_V1.cjs"
      - "scripts/governance_acceptance/VERIFY_MCFT_CAP09_DA9_V2_FORMAL_GOVERNANCE_ADMISSION_V1.cjs"
      - "docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-CONTROL-PLANE-V1.json"
      - "scripts/governance_acceptance/VERIFY_MCFT_CAP09_DA9_SIGNED_V2_QCP_TECHNICAL_ENROLLMENT_V1.cjs"
permissions:
  contents: read
concurrency:
  group: cap09-signed-v2-independent-governance-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true
jobs:
  signed-v2-phase3-frozen-review-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout governance review exact PR source (non-authorizing)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js for read-only governance audit
        uses: actions/setup-node@v4
        with:
          node-version: "20.11.1"
      - name: Require isolated governance branch and no inherited execution authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.base.sha }}" = "2162f368899e9a9b5c497d332859e4196f389660"
          test -z "${MCFT_GOVERNED_RETRY_TICKET:-}"
          test -z "${MCFT_GOVERNED_RETRY_STAGE:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${MCFT_CAP09_ADOPTION_REQUEST:-}"
          test -z "${AWS_SECRET_ACCESS_KEY:-}"
          test -z "${GEOX_MCFT_CAP09_FORMAL_V5_DATABASE_URL:-}"
          test -z "${GEOX_MCFT_CAP09_T4R1_S6_DATABASE_URL:-}"
          git cat-file -e '6d8fb108655d9ada4b44cc7e4709a1c2ac5832b0^{commit}'
          git cat-file -e '3d5fd13c8f5babd2edc5107206f43a5e5d12eb4a^{commit}'
      - name: Syntax check independent reviewer
        run: node --check scripts/governance_acceptance/REVIEW_MCFT_CAP09_DA9_SIGNED_V2_PHASE3_FROZEN_V13_V1.cjs
      - name: Audit 94-path PHASE3 source digest and 108-path Frozen V13 delta
        run: node scripts/governance_acceptance/REVIEW_MCFT_CAP09_DA9_SIGNED_V2_PHASE3_FROZEN_V13_V1.cjs
      - name: Verify technical QCP successor registration and 10 negative tests (not formal approval)
        run: |
          node --check scripts/governance_acceptance/VERIFY_MCFT_CAP09_DA9_SIGNED_V2_QCP_TECHNICAL_ENROLLMENT_V1.cjs
          node scripts/governance_acceptance/VERIFY_MCFT_CAP09_DA9_SIGNED_V2_QCP_TECHNICAL_ENROLLMENT_V1.cjs
      - name: Verify formal governance is HOLD without purpose delegation / separate signer (14 negative tests)
        run: |
          node --check scripts/governance_acceptance/VERIFY_MCFT_CAP09_DA9_V2_FORMAL_GOVERNANCE_ADMISSION_V1.cjs
          node scripts/governance_acceptance/VERIFY_MCFT_CAP09_DA9_V2_FORMAL_GOVERNANCE_ADMISSION_V1.cjs
      - name: Prove strict admission rejects missing independent authorization
        shell: bash
        run: |
          set -euo pipefail
          if node scripts/governance_acceptance/VERIFY_MCFT_CAP09_DA9_V2_FORMAL_GOVERNANCE_ADMISSION_V1.cjs --require-approved > admission-strict.log 2>&1; then
            echo "FORMAL_GATE_FAIL_OPEN"; exit 1
          fi
          grep -q 'HOLD_FORMAL_GOVERNANCE_NO_PURPOSE_DELEGATION_NO_SEPARATE_INDEPENDENT_SIGNATURE' admission-strict.log
          echo "PASS_FORMAL_GOVERNANCE_HOLD_FAIL_CLOSED"
      - name: Check owner-directed source approval against authenticated PR event
        run: |
          node --check scripts/governance_acceptance/VERIFY_MCFT_CAP09_DA9_V2_OWNER_DIRECTED_SOURCE_ADMISSION_V1.cjs
          node scripts/governance_acceptance/VERIFY_MCFT_CAP09_DA9_V2_OWNER_DIRECTED_SOURCE_ADMISSION_V1.cjs
      - name: Retain read-only technical difference proof (not approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cap09-da9-v2-phase3-frozen-governance-readonly-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/MCFT_CAP09_DA9_V2_SIGNED_GOVERNANCE_TECHNICAL_AUDIT_V1.json
          if-no-files-found: warn
          retention-days: 90

name: b06b-irrigation-calculation-result-adapters-exact

on:
  push:
    branches:
      - ci/bline-b06b-irrigation-calculation-result-adapters-exact-2026-08-27

jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Build runtime workspace dependencies
        run: |
          pnpm --filter @geox/contracts build
          pnpm --filter @geox/device-skills build
          pnpm --filter @geox/skill-registry build
      - name: Server typecheck
        run: pnpm --filter @geox/server typecheck
      - name: B-02 semantic governance
        run: node scripts/governance_acceptance/ACCEPTANCE_B02_SEMANTIC_CONTRACT_LINTER_V1.cjs
      - name: B-06b irrigation CalculationResult adapters
        run: node --import tsx --test apps/server/src/domain/decision/irrigation_calculation_result_adapter_v1.contract.test.ts
      - name: B-06a CalculationResult and CandidateDecision contract regression
        run: node --import tsx --test apps/server/src/contracts/canonical_decision_v1.contract.test.ts
      - name: B-06b guard register exactness
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const reg = JSON.parse(fs.readFileSync("docs/architecture/semantic_convergence/GEOX-SEMANTIC-OWNERSHIP-REGISTER-V1.json","utf8"));
          const adapter = "apps/server/src/domain/decision/irrigation_calculation_result_adapter_v1.ts";
          const calcGuard = (reg.static_guards || []).find((x) => x.guard_id === "G-B02-14-calculation-result-instantiation");
          const candGuard = (reg.static_guards || []).find((x) => x.guard_id === "G-B02-15-candidate-decision-instantiation");
          if (!calcGuard) throw new Error("B06B_CALC_GUARD_MISSING");
          if (!candGuard) throw new Error("B06B_CAND_GUARD_MISSING");
          const calcPaths = calcGuard.registered_paths || [];
          if (calcPaths.length !== 1 || calcPaths[0] !== adapter) throw new Error("B06B_CALC_GUARD_PATH_SET_INVALID:" + JSON.stringify(calcPaths));
          if ((candGuard.registered_paths || []).length !== 0) throw new Error("B06B_CAND_GUARD_MUST_REMAIN_EMPTY");
          const calc = reg.semantics.find((x) => x.semantic_id === "decision.calculation");
          const producer = (calc?.registered_producers || []).find((x) => x.producer_id === "irrigation-calculation-result-compatibility-adapter");
          if (!producer) throw new Error("B06B_REGISTERED_PRODUCER_MISSING");
          if (producer.connection_class !== "REGISTERED_CAPABILITY_ISLAND") throw new Error("B06B_PRODUCER_NOT_CAPABILITY_ISLAND");
          if (producer.activation !== "MANUAL") throw new Error("B06B_PRODUCER_ACTIVATION_NOT_MANUAL");
          if (producer.runtime_edge !== "INTENTIONAL_NONE") throw new Error("B06B_PRODUCER_RUNTIME_EDGE_NOT_NONE");
          console.log("B06B_GUARD_REGISTER_EXACTNESS_PASS");
          NODE
      - name: B-06b adapter has no production runtime consumer
        shell: bash
        run: |
          A="apps/server/src/domain/decision/irrigation_calculation_result_adapter_v1.ts"
          for S in projectIrrigationRequirementCalculationResultV1 projectIrrigationDeficitCalculationResultV1; do
            HITS="$(grep -R --include='*.ts' --exclude='*.test.ts' --exclude='*.acceptance.test.ts' -n "$S" apps/server/src | grep -v "^$A:" || true)"
            if [ -n "$HITS" ]; then
              echo "$HITS"
              echo "B06B_UNEXPECTED_RUNTIME_CONSUMER:$S"
              exit 1
            fi
          done
          echo "B06B_NO_RUNTIME_CONSUMER_PASS"
      - name: Linter rejects a second unregistered CalculationResult producer
        shell: bash
        run: |
          P="apps/server/src/.b06b_unregistered_calc_probe.ts"
          printf '%s\n' 'calculationResultV1Schema.parse(' > "$P"
          set +e
          node scripts/governance_acceptance/ACCEPTANCE_B02_SEMANTIC_CONTRACT_LINTER_V1.cjs > /tmp/b06b-calc-negative.log 2>&1
          RC=$?
          set -e
          cat /tmp/b06b-calc-negative.log
          rm -f "$P"
          if [ "$RC" -eq 0 ]; then
            echo "B06B_SECOND_CALC_PRODUCER_NOT_REJECTED"
            exit 1
          fi
          grep -q "UNREGISTERED_CALCULATION_RESULT_PRODUCER" /tmp/b06b-calc-negative.log
          echo "B06B_SECOND_CALC_NEGATIVE_GOVERNANCE_PASS"
      - name: Linter still rejects any CandidateDecision producer
        shell: bash
        run: |
          P="apps/server/src/.b06b_unregistered_candidate_probe.ts"
          printf '%s\n' 'candidateDecisionV1Schema.parse(' > "$P"
          set +e
          node scripts/governance_acceptance/ACCEPTANCE_B02_SEMANTIC_CONTRACT_LINTER_V1.cjs > /tmp/b06b-candidate-negative.log 2>&1
          RC=$?
          set -e
          cat /tmp/b06b-candidate-negative.log
          rm -f "$P"
          if [ "$RC" -eq 0 ]; then
            echo "B06B_CANDIDATE_PRODUCER_NOT_REJECTED"
            exit 1
          fi
          grep -q "UNREGISTERED_CANDIDATE_DECISION_PRODUCER" /tmp/b06b-candidate-negative.log
          echo "B06B_CANDIDATE_NEGATIVE_GOVERNANCE_PASS"
      - name: Restored B-02 governance
        run: node scripts/governance_acceptance/ACCEPTANCE_B02_SEMANTIC_CONTRACT_LINTER_V1.cjs
      - name: B-05 overall regression boundary
        run: |
          node --import tsx --test apps/server/src/contracts/canonical_context_v1.contract.test.ts
          node --import tsx --test apps/server/src/context/field_program_context_projection_v1.test.ts
          node --import tsx --test apps/server/src/context/legacy_crop_stage_compatibility_adapter_v1.test.ts
          node --import tsx --test apps/server/src/context/crop_skill_stage_compatibility_adapter_v1.test.ts
      - name: B-03/B-04 regression boundary
        run: |
          node --import tsx --test apps/server/src/contracts/canonical_evidence_v1.contract.test.ts
          node --import tsx --test apps/server/src/evidence/raw_sample_evidence_qualification_projection_v1.test.ts
          node --import tsx --test apps/server/src/domain/judge/evidence_judge_canonical_sufficiency_shadow_v1.test.ts
      - name: Server build
        run: pnpm --filter @geox/server build
      - name: Marker
        run: |
          echo "B06B_EXACT_HEAD 26541ca05a3ba4b3b463fa6e940912d2b76f2cba"
          echo "B06B_IRRIGATION_CALCULATION_RESULT_ADAPTERS_PASS"

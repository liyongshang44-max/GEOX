name: mcft-cap-09-production-owner-provisioning-readiness

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-production-owner-provisioning-readiness.yml'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-PRODUCTION-OWNER-PROVISIONING-AUTHORITY-V1.json'
      - 'scripts/runtime_acceptance/MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_ARM_V1.json'
      - 'scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_V1.cjs'
      - 'scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_OPERATIONAL_SCHEMA_ACL_READINESS_V2.cjs'
      - 'scripts/runtime_acceptance/MCFT_CAP_09_PRODUCTION_OPERATIONAL_SCHEMA_ACL_ARM_V1.json'
      - 'apps/server/src/infra/mcft_cap09_phase5_service_principal_v1.ts'
      - 'apps/server/src/infra/mcft_cap09_phase5_service_principal_bootstrap_v1.ts'
      - 'apps/server/db/migrations/2026_08_27_mcft_cap_09_phase4_twin_runtime_acl.sql'

permissions:
  contents: read

jobs:
  provisioning-readiness:
    if: >-
      github.head_ref == 'feat/mcft-cap09-v13-producer-driven-qualification-v1' &&
      github.event.pull_request.base.sha == '46367333d228a2b90a86ff6a33aebc334f3d73a2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
      SEED_DATABASE_URL: ${{ secrets.GEOX_MCFT_CAP09_T3R1_S6_DATABASE_URL }}
      EVIDENCE_RUNTIME_DATABASE_URL_SECRET: ${{ secrets.GEOX_MCFT_CAP09_EVIDENCE_RUNTIME_DATABASE_URL }}
      EVIDENCE_RUNTIME_PASSWORD_SECRET: ${{ secrets.GEOX_MCFT_CAP09_EVIDENCE_RUNTIME_DATABASE_PASSWORD }}
      TWIN_RUNTIME_DATABASE_URL_SECRET: ${{ secrets.GEOX_MCFT_CAP09_TWIN_RUNTIME_DATABASE_URL }}
      TWIN_RUNTIME_PASSWORD_SECRET: ${{ secrets.GEOX_MCFT_CAP09_TWIN_RUNTIME_DATABASE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate bound schema ACL provisioning contract
        run: node scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_V1.cjs

      - name: Re-prove materialized schema ACL state without mutation
        run: node scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_OPERATIONAL_SCHEMA_ACL_READINESS_V2.cjs

      - name: Emit pre-login provisioning readiness and remaining blockers
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const a=JSON.parse(fs.readFileSync('docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-PRODUCTION-OWNER-PROVISIONING-AUTHORITY-V1.json','utf8'));
          const arm=JSON.parse(fs.readFileSync('scripts/runtime_acceptance/MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_ARM_V1.json','utf8'));
          const schema=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_PRODUCTION_OPERATIONAL_SCHEMA_ACL_READINESS_V2_RESULT.json','utf8'));
          if(schema.status!=='PASS'||schema.stage!=='MATERIALIZED_41_TABLE_ZERO_ROW'||schema.schema_materialized!==true)throw new Error('OWNER_PROVISIONING_MATERIALIZED_SCHEMA_READINESS_REQUIRED');
          if(schema.production_host_table_count!==41||schema.runtime_routine_count!==3||schema.all_table_rows_zero!==true)throw new Error('OWNER_PROVISIONING_MATERIALIZED_SCHEMA_SHAPE_REQUIRED');
          if(schema.service_login_role_count!==0)throw new Error('OWNER_PROVISIONING_UNAUTHORIZED_LOGIN_PRESENT');
          if(schema.provisioning_admin_writer_owner_effective_set_role_count!==0||schema.provisioning_admin_writer_owner_self_grant_residual_count!==0||schema.writer_owner_schema_create_residual_count!==0)throw new Error('OWNER_PROVISIONING_RESIDUAL_PROVISIONING_AUTHORITY');
          if(arm.armed!==false||arm.service_login_bootstrap_authorized!==false||arm.runtime_credential_binding_authorized!==false)throw new Error('OWNER_PROVISIONING_PRE_LOGIN_ARM_MUST_BE_FALSE');
          const secretState={
            evidence_runtime_database_url:Boolean(process.env.EVIDENCE_RUNTIME_DATABASE_URL_SECRET),
            evidence_runtime_password:Boolean(process.env.EVIDENCE_RUNTIME_PASSWORD_SECRET),
            twin_runtime_database_url:Boolean(process.env.TWIN_RUNTIME_DATABASE_URL_SECRET),
            twin_runtime_password:Boolean(process.env.TWIN_RUNTIME_PASSWORD_SECRET)
          };
          if(secretState.evidence_runtime_database_url||secretState.twin_runtime_database_url)throw new Error('OWNER_PROVISIONING_RUNTIME_DATABASE_URL_SECRET_MUST_WAIT_FOR_7F');
          const passwordSecretCount=Number(secretState.evidence_runtime_password)+Number(secretState.twin_runtime_password);
          if(![0,2].includes(passwordSecretCount))throw new Error('OWNER_PROVISIONING_PARTIAL_PASSWORD_SECRET_STATE_FORBIDDEN');
          const remaining=[
            'SERVICE_LOGIN_BOOTSTRAP_NOT_AUTHORIZED',
            'EVIDENCE_RUNTIME_BOOTSTRAP_PASSWORD_SECRET_NOT_BOUND',
            'TWIN_RUNTIME_BOOTSTRAP_PASSWORD_SECRET_NOT_BOUND',
            'EVIDENCE_LOGIN_ROLE_NOT_PRESENT',
            'TWIN_LOGIN_ROLE_NOT_PRESENT',
            'RUNTIME_CREDENTIAL_BINDING_NOT_AUTHORIZED',
            'EVIDENCE_RUNTIME_DATABASE_URL_SECRET_INTENTIONALLY_NOT_BOUND_UNTIL_7F',
            'TWIN_RUNTIME_DATABASE_URL_SECRET_INTENTIONALLY_NOT_BOUND_UNTIL_7F'
          ];
          const p={
            schema_version:'geox_mcft_cap09_production_owner_provisioning_readiness_v2',
            status:'PASS_SERVICE_LOGIN_PRE_ARM_READINESS',
            subject_sha:process.env.SUBJECT_SHA,
            observed_database_name:schema.database_name,
            authority_target_database_name:a.target_database?.database_name??null,
            exact_target_database_bound:a.target_database?.status==='BOUND',
            schema_acl_materialization_evidence_bound:a.schema_acl_materialization_evidence?.status==='IMMUTABLE_SUCCESS',
            post_materialization_readiness_evidence_bound:a.post_materialization_readiness_evidence?.status==='IMMUTABLE_SUCCESS',
            schema_acl_stage:'MATERIALIZED_41_TABLE_ZERO_ROW',
            production_host_table_count:schema.production_host_table_count,
            runtime_routine_count:schema.runtime_routine_count,
            all_table_rows_zero:schema.all_table_rows_zero,
            evidence_privilege_role_present:schema.evidence_privilege_role_safe===true,
            twin_privilege_role_present:schema.twin_privilege_role_safe===true,
            evidence_login_present:false,
            twin_login_present:false,
            credential_secret_state:secretState,
            provisioning_arm:false,
            service_login_bootstrap_authorized:false,
            runtime_credential_binding_authorized:false,
            pre_login_stage_ready:true,
            service_login_pre_arm_ready:true,
            password_secret_authority_ready:passwordSecretCount===2,
            bootstrap_password_secret_count:passwordSecretCount,
            provisioning_ready:passwordSecretCount===2,
            next_stage:passwordSecretCount===2?'SERVICE_LOGIN_BOOTSTRAP_READY_FOR_SEPARATE_ARM':'SERVICE_LOGIN_BOOTSTRAP_REQUIRES_PASSWORD_SECRET_AUTHORITY_AND_SEPARATE_ARM',
            remaining_provisioning_blockers:remaining,
            provisioning_performed:false,
            runtime_process_start:false,
            production_owner_activation:false,
            provider_request_count:0,
            formal_v5_arm:false,
            a0_bootstrap:false,
            o00_started:false
          };
          fs.mkdirSync('acceptance-output',{recursive:true});
          fs.writeFileSync('acceptance-output/MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_READINESS_V2_RESULT.json',JSON.stringify(p,null,2)+'\n');
          console.log(JSON.stringify(p,null,2));

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap09-production-owner-provisioning-readiness-${{ github.event.pull_request.head.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_PREFLIGHT_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_PRODUCTION_OPERATIONAL_SCHEMA_ACL_READINESS_V2_RESULT.json
            acceptance-output/MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_READINESS_V2_RESULT.json
          if-no-files-found: error
          retention-days: 90

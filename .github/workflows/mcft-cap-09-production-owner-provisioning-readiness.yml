name: mcft-cap-09-production-owner-provisioning-readiness

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-production-owner-provisioning-readiness.yml'
      - '.github/workflows/mcft-cap-09-production-non-github-host-binding-readiness.yml'
      - 'scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_V1.cjs'
      - 'scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_NON_GITHUB_HOST_BINDING_READINESS_V1.cjs'
      - 'scripts/runtime_acceptance/MCFT_CAP_09_PRODUCTION_NON_GITHUB_HOST_BINDING_ARM_V1.json'

permissions:
  contents: read

jobs:
  provisioning-readiness:
    if: >-
      github.head_ref == 'work/host-secret-preowner-v1' &&
      github.event.pull_request.base.sha == '7812bbc9f768430c9b034e169013515ed387e30f'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact pre-owner readiness subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Syntax-check residue-aware pre-owner preflight
        run: node --check scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_V1.cjs

      - name: Prove current rematerialization and host-secret-binding authorization
        run: node scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_V1.cjs

      - name: Prove local-host secret-binding contract remains machine-proof gated
        run: node scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_NON_GITHUB_HOST_BINDING_READINESS_V1.cjs

      - name: Emit pre-owner-cutover static readiness frontier
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const pre=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_PREFLIGHT_V1_RESULT.json','utf8'));
          const host=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_PRODUCTION_NON_GITHUB_HOST_BINDING_READINESS_V1_RESULT.json','utf8'));
          const req=(v,c)=>{if(!v)throw new Error(c)};
          req(pre.status==='PASS'&&pre.residue_aware_current_state===true,'PRE_OWNER_RESIDUE_AWARE_PREFLIGHT_REQUIRED');
          req(pre.historical_all_table_zero_readiness_reused===false,'PRE_OWNER_HISTORICAL_ZERO_REUSE_FORBIDDEN');
          req(pre.production_host_secret_binding_authorized===true,'PRE_OWNER_SECRET_BINDING_AUTH_REQUIRED');
          req(host.status==='PASS'&&host.production_host_secret_binding_observed===false,'PRE_OWNER_LOCAL_MACHINE_PROOF_MUST_REMAIN_UNCLAIMED');
          const out={
            schema_version:'geox_mcft_cap09_production_pre_owner_cutover_static_readiness_v1',
            status:'PASS_STATIC_CONTRACT_LOCAL_MACHINE_PROOF_REQUIRED',
            subject_sha:process.env.SUBJECT_SHA,
            canonical_rematerialization_bound:true,
            residue_aware_current_state:true,
            production_host_secret_binding_authorized:true,
            production_host_secret_binding_observed:false,
            pre_owner_cutover_ready:false,
            remaining_blockers:['LOCAL_HOST_SECRET_BINDING_MACHINE_PROOF_REQUIRED'],
            repository_secret_materialized:false,
            github_secret_materialized:false,
            database_write:false,
            provider_request_count:0,
            compose_build:false,
            compose_create:false,
            compose_up:false,
            runtime_process_start:false,
            production_owner_activation:false,
            formal_v5_arm:false,
            a0_bootstrap:false,
            o00_started:false
          };
          fs.writeFileSync('acceptance-output/MCFT_CAP_09_PRODUCTION_PRE_OWNER_CUTOVER_STATIC_READINESS_V1_RESULT.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));

      - name: Upload pre-owner-cutover static readiness proof
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-pre-owner-cutover-static-${{ github.event.pull_request.head.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_PREFLIGHT_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_PRODUCTION_NON_GITHUB_HOST_BINDING_READINESS_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_PRODUCTION_PRE_OWNER_CUTOVER_STATIC_READINESS_V1_RESULT.json
          if-no-files-found: error
          retention-days: 90

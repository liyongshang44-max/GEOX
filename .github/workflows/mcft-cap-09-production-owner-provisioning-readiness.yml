name: mcft-cap-09-production-owner-provisioning-readiness

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-production-owner-provisioning-readiness.yml'
      - '.github/workflows/mcft-cap-09-production-non-github-host-binding-readiness.yml'
      - 'scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_V1.cjs'
      - 'scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_NON_GITHUB_HOST_BINDING_READINESS_V1.cjs'
      - 'scripts/runtime_acceptance/MCFT_CAP_09_PRODUCTION_NON_GITHUB_HOST_BINDING_ARM_V1.json'

permissions:
  contents: read

jobs:
  provisioning-readiness:
    if: >-
      github.head_ref == 'work/host-secret-proof-canonical-v1' &&
      github.event.pull_request.base.sha == '174c7cadb83767d60ee53e866631d6e780304a65'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact canonical host-proof subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Syntax-check residue-aware pre-owner preflight
        run: node --check scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_V1.cjs

      - name: Prove canonical local-host secret binding and pre-owner readiness
        run: node scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_V1.cjs

      - name: Preserve GitHub runner non-production boundary
        run: node scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_NON_GITHUB_HOST_BINDING_READINESS_V1.cjs

      - name: Emit canonical pre-owner-cutover readiness frontier
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const pre=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_PREFLIGHT_V1_RESULT.json','utf8'));
          const host=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_PRODUCTION_NON_GITHUB_HOST_BINDING_READINESS_V1_RESULT.json','utf8'));
          const req=(v,c)=>{if(!v)throw new Error(c)};
          req(pre.status==='PASS'&&pre.stage==='PRODUCTION_HOST_SECRET_BINDING_PROVEN_PRE_OWNER_CUTOVER_READY','PRE_OWNER_CANONICAL_PREFLIGHT_REQUIRED');
          req(pre.residue_aware_current_state===true&&pre.historical_all_table_zero_readiness_reused===false,'PRE_OWNER_RESIDUE_AWARE_REQUIRED');
          req(pre.production_host_secret_binding_authorized===true&&pre.production_host_secret_binding_machine_proof_observed===true,'PRE_OWNER_LOCAL_MACHINE_PROOF_REQUIRED');
          req(pre.production_host_secret_binding_proof_subject_sha==='5be8293a03d7947a09fe8c8dc863c9965d26a74b','PRE_OWNER_LOCAL_PROOF_SUBJECT_REQUIRED');
          req(pre.pre_owner_cutover_ready===true,'PRE_OWNER_READY_REQUIRED');
          req(Array.isArray(pre.remaining_blockers)&&pre.remaining_blockers.length===1&&pre.remaining_blockers[0]==='PRODUCTION_RUNTIME_START_AUTHORITY_NOT_ARMED','PRE_OWNER_EXACT_NEXT_BLOCKER_REQUIRED');
          req(host.status==='PASS'&&host.production_host_secret_binding_observed===false,'PRE_OWNER_GITHUB_MUST_NOT_REEXECUTE_LOCAL_PROOF');
          req(host.provider_request_count===0&&host.database_connection_attempted===false&&host.compose_render_attempted===false,'PRE_OWNER_GITHUB_ZERO_LIVE_EFFECT_REQUIRED');
          const out={
            schema_version:'geox_mcft_cap09_production_pre_owner_cutover_canonical_readiness_v1',
            status:'PASS',
            stage:'PRE_OWNER_CUTOVER_READY_RUNTIME_START_AUTHORITY_NOT_ARMED',
            subject_sha:process.env.SUBJECT_SHA,
            local_machine_proof_subject_sha:pre.production_host_secret_binding_proof_subject_sha,
            canonical_rematerialization_bound:true,
            residue_aware_current_state:true,
            production_host_secret_binding_authorized:true,
            production_host_secret_binding_observed:true,
            pre_owner_cutover_ready:true,
            remaining_blockers:['PRODUCTION_RUNTIME_START_AUTHORITY_NOT_ARMED'],
            repository_secret_materialized:false,
            github_secret_materialized:false,
            github_live_database_readback:false,
            github_live_provider_request:false,
            database_write:false,
            compose_build:false,
            compose_create:false,
            compose_up:false,
            runtime_process_start:false,
            production_owner_activation:false,
            formal_v5_arm:false,
            a0_bootstrap:false,
            o00_started:false
          };
          fs.writeFileSync('acceptance-output/MCFT_CAP_09_PRODUCTION_PRE_OWNER_CUTOVER_CANONICAL_READINESS_V1_RESULT.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));

      - name: Upload canonical pre-owner-cutover readiness proof
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-pre-owner-cutover-canonical-${{ github.event.pull_request.head.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_PREFLIGHT_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_PRODUCTION_NON_GITHUB_HOST_BINDING_READINESS_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_PRODUCTION_PRE_OWNER_CUTOVER_CANONICAL_READINESS_V1_RESULT.json
            scripts/runtime_acceptance/MCFT_CAP_09_PRODUCTION_NON_GITHUB_HOST_BINDING_ARM_V1.json
          if-no-files-found: error
          retention-days: 90

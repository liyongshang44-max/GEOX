name: mcft-cap-09-production-owner-provisioning-readiness

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-production-owner-provisioning-readiness.yml'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-PRODUCTION-OWNER-PROVISIONING-AUTHORITY-V1.json'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-PRODUCTION-NON-GITHUB-HOST-BINDING-AUTHORITY-V1.json'
      - 'scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_PRODUCTION_NON_GITHUB_HOST_BINDING_V1.cjs'
      - 'scripts/runtime_acceptance/MCFT_CAP_09_PRODUCTION_NON_GITHUB_HOST_BINDING_ARM_V1.json'
      - 'scripts/runtime_acceptance/MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_ARM_V1.json'
      - 'scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_V1.cjs'
      - 'scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_OPERATIONAL_SCHEMA_ACL_READINESS_V2.cjs'
      - 'scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_SERVICE_LOGIN_READINESS_V1.cjs'
      - 'scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_RUNTIME_CREDENTIAL_READINESS_V1.cjs'
      - 'scripts/runtime_acceptance/MCFT_CAP_09_PRODUCTION_OPERATIONAL_SCHEMA_ACL_ARM_V1.json'
      - 'apps/server/src/infra/mcft_cap09_phase5_service_principal_v1.ts'
      - 'apps/server/src/infra/mcft_cap09_phase5_service_principal_bootstrap_v1.ts'
      - 'apps/server/db/migrations/2026_08_27_mcft_cap_09_phase4_twin_runtime_acl.sql'

permissions:
  contents: read

jobs:
  provisioning-readiness:
    if: >-
      github.head_ref == 'feat/mcft-cap09-v13-producer-driven-qualification-v1' &&
      github.event.pull_request.base.sha == '46367333d228a2b90a86ff6a33aebc334f3d73a2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
      SEED_DATABASE_URL: ${{ secrets.GEOX_MCFT_CAP09_T3R1_S6_DATABASE_URL }}
      EVIDENCE_RUNTIME_DATABASE_URL_SECRET: ${{ secrets.GEOX_MCFT_CAP09_EVIDENCE_RUNTIME_DATABASE_URL }}
      EVIDENCE_RUNTIME_PASSWORD_SECRET: ${{ secrets.GEOX_MCFT_CAP09_EVIDENCE_RUNTIME_DATABASE_PASSWORD }}
      TWIN_RUNTIME_DATABASE_URL_SECRET: ${{ secrets.GEOX_MCFT_CAP09_TWIN_RUNTIME_DATABASE_URL }}
      TWIN_RUNTIME_PASSWORD_SECRET: ${{ secrets.GEOX_MCFT_CAP09_TWIN_RUNTIME_DATABASE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate bound schema ACL provisioning contract
        run: node scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_V1.cjs

      - name: Re-prove service LOGIN and runtime credential state without runtime start
        run: node scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_RUNTIME_CREDENTIAL_READINESS_V1.cjs

      - name: Validate non-GitHub host binding authority remains zero-effect
        run: node scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_PRODUCTION_NON_GITHUB_HOST_BINDING_V1.cjs

      - name: Emit non-GitHub host binding frontier and remaining blockers
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const a=JSON.parse(fs.readFileSync('docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-PRODUCTION-OWNER-PROVISIONING-AUTHORITY-V1.json','utf8'));
          const host=JSON.parse(fs.readFileSync('docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-PRODUCTION-NON-GITHUB-HOST-BINDING-AUTHORITY-V1.json','utf8'));
          const hostArm=JSON.parse(fs.readFileSync('scripts/runtime_acceptance/MCFT_CAP_09_PRODUCTION_NON_GITHUB_HOST_BINDING_ARM_V1.json','utf8'));
          const arm=JSON.parse(fs.readFileSync('scripts/runtime_acceptance/MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_ARM_V1.json','utf8'));
          const runtime=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_PRODUCTION_RUNTIME_CREDENTIAL_READINESS_V1_RESULT.json','utf8'));
          const req=(v,c)=>{if(!v)throw new Error(c)};
          req(a.status==='RUNTIME_CREDENTIAL_BINDING_COMPLETE_NON_GITHUB_HOST_NOT_BOUND'&&a.current_stage==='RUNTIME_CREDENTIAL_BINDING_COMPLETE_PRE_HOST_BINDING','OWNER_PROVISIONING_RUNTIME_CREDENTIAL_CLOSURE_REQUIRED');
          req(runtime.status==='PASS'&&runtime.stage==='RUNTIME_CREDENTIAL_URLS_BOUND_PRE_ARM','OWNER_PROVISIONING_RUNTIME_CREDENTIAL_READBACK_REQUIRED');
          req(runtime.database_name==='geox_mcft_cap09_production_runtime_v1'&&runtime.service_login_role_count===2&&runtime.runtime_database_url_secret_count===2&&runtime.exact_one_privilege_membership_each===true,'OWNER_PROVISIONING_RUNTIME_CREDENTIAL_IDENTITY_SHAPE_REQUIRED');
          for(const k of ['exact_database_name_match','exact_login_username_match','exact_password_pairing_match','exact_seed_host_port_match','evidence_runtime_url_connectivity_proven','twin_runtime_url_connectivity_proven'])req(runtime[k]===true,'OWNER_PROVISIONING_RUNTIME_CREDENTIAL_READBACK_PROOF_REQUIRED:'+k);
          req(runtime.credential_arm_observed===false,'OWNER_PROVISIONING_RUNTIME_CREDENTIAL_READBACK_MUST_BE_DISARMED');
          req(arm.armed===false&&arm.runtime_process_start_authorized===false&&arm.production_owner_activation_authorized===false&&arm.formal_v5_arm_authorized===false&&arm.a0_authorized===false&&arm.o00_authorized===false,'OWNER_PROVISIONING_OWNER_ARM_MUST_REMAIN_FALSE');
          req(hostArm.runtime_process_start_authorized===false&&hostArm.production_owner_activation_authorized===false,'OWNER_PROVISIONING_HOST_ARM_MUST_REMAIN_PRE_RUNTIME');
          req(host.production_execution_host_class==='NON_GITHUB_LONG_RUNNING_SERVICE'&&host.github_actions?.production_execution_host_allowed===false,'OWNER_PROVISIONING_HOST_AUTHORITY_REQUIRED');
          req(host.platform_evaluation?.selected_candidate?.platform_provider==='LOCAL_OPERATOR_MANAGED_DOCKER','OWNER_PROVISIONING_LOCAL_HOST_SELECTION_REQUIRED');
          const unbound=host.status==='LOCAL_OPERATOR_MANAGED_DOCKER_HOST_AUTHORIZED_IDENTITIES_UNBOUND';
          const bound=host.status==='LOCAL_OPERATOR_MANAGED_DOCKER_HOST_IDENTITIES_BOUND';
          req(unbound||bound,'OWNER_PROVISIONING_LOCAL_HOST_STATE_UNKNOWN');
          req(a.next_stage?.host_binding_authority_status===host.status,'OWNER_PROVISIONING_HOST_STATUS_PROJECTION_REQUIRED');
          req(host.render_candidate_binding_contract?.status==='RETIRED_HTTP_402_PAYMENT_REQUIRED_NO_SERVICE_CREATED'&&host.render_candidate_binding_contract?.external_resource_count===0,'OWNER_PROVISIONING_RENDER_RETIREMENT_REQUIRED');
          const remaining=unbound?[
            'LOCAL_OPERATOR_HOST_ID_NOT_BOUND',
            'LOCAL_EVIDENCE_LONG_RUNNING_SERVICE_IDENTITY_NOT_BOUND',
            'LOCAL_TWIN_LONG_RUNNING_SERVICE_IDENTITY_NOT_BOUND',
            'LOCAL_24H_HOST_PREFLIGHT_NOT_PROVEN',
            'NON_GITHUB_HOST_BINDING_NOT_COMPLETE'
          ]:[
            'EVIDENCE_PRODUCTION_COMPILED_ENTRYPOINT_NOT_PACKAGED',
            'EVIDENCE_PRODUCTION_TARGET_PLANNER_NOT_BOUND',
            'LOCAL_24H_HOST_PREFLIGHT_NOT_PROVEN'
          ];
          const p={
            schema_version:'geox_mcft_cap09_production_owner_provisioning_readiness_v4',
            status:'PASS_NON_GITHUB_HOST_BINDING_FRONTIER',
            subject_sha:process.env.SUBJECT_SHA,
            observed_database_name:runtime.database_name,
            authority_target_database_name:a.target_database?.database_name??null,
            exact_target_database_bound:a.target_database?.status==='BOUND',
            schema_acl_materialization_evidence_bound:a.schema_acl_materialization_evidence?.status==='IMMUTABLE_SUCCESS',
            service_login_materialization_evidence_bound:a.service_login_materialization_evidence?.status==='IMMUTABLE_SUCCESS',
            runtime_credential_binding_evidence_bound:a.runtime_credential_binding_evidence?.status==='IMMUTABLE_SUCCESS',
            runtime_credential_post_readiness_evidence_bound:a.runtime_credential_post_binding_readiness_evidence?.status==='IMMUTABLE_SUCCESS',
            current_stage:a.current_stage,
            production_host_table_count:41,runtime_routine_count:3,all_table_rows_zero:true,
            exact_one_privilege_membership_each:runtime.exact_one_privilege_membership_each,
            runtime_database_url_secret_count:runtime.runtime_database_url_secret_count,
            runtime_credential_binding_complete:true,
            host_binding_authority_defined:true,
            production_execution_host_class:host.production_execution_host_class,
            external_platform_selected:true,
            platform_provider:'LOCAL_OPERATOR_MANAGED_DOCKER',
            location:'OPERATOR_LOCAL_MACHINE',
            local_host_id_bound:bound,
            evidence_host_identity_bound:bound,
            twin_host_identity_bound:bound,
            exact_two_runtime_service_identities_bound:bound,
            non_github_host_identity_bound:bound,
            host_binding_ready_for_local_identity:unbound,
            local_24h_host_preflight_status:host.local_operator_managed_host_contract?.local_24h_host_preflight_status??'NOT_PROVEN',
            provisioning_ready:false,
            next_stage:unbound?'BIND_LOCAL_OPERATOR_HOST_AND_EXACT_TWO_SERVICE_IDENTITIES':'PACKAGE_EVIDENCE_PRODUCTION_ENTRYPOINT_AND_BIND_TARGET_PLANNER',
            remaining_provisioning_blockers:remaining,
            provisioning_performed:true,
            runtime_process_start:false,production_owner_activation:false,provider_request_count:0,formal_v5_arm:false,a0_bootstrap:false,o00_started:false
          };
          fs.mkdirSync('acceptance-output',{recursive:true});
          fs.writeFileSync('acceptance-output/MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_READINESS_V4_RESULT.json',JSON.stringify(p,null,2)+'\n');
          console.log(JSON.stringify(p,null,2));

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap09-production-owner-provisioning-readiness-${{ github.event.pull_request.head.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_PREFLIGHT_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_PRODUCTION_SERVICE_LOGIN_READINESS_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_PRODUCTION_RUNTIME_CREDENTIAL_READINESS_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_PRODUCTION_NON_GITHUB_HOST_BINDING_PREFLIGHT_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_READINESS_V4_RESULT.json
          if-no-files-found: error
          retention-days: 90

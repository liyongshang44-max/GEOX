name: mcft-cap-09-production-owner-provisioning-readiness

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-production-owner-provisioning-readiness.yml'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-PRODUCTION-OWNER-PROVISIONING-AUTHORITY-V1.json'
      - 'scripts/runtime_acceptance/MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_ARM_V1.json'
      - 'scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_V1.cjs'
      - 'scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_OPERATIONAL_SCHEMA_ACL_READINESS_V2.cjs'
      - 'scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_SERVICE_LOGIN_READINESS_V1.cjs'
      - 'scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_RUNTIME_CREDENTIAL_READINESS_V1.cjs'
      - 'scripts/runtime_acceptance/MCFT_CAP_09_PRODUCTION_OPERATIONAL_SCHEMA_ACL_ARM_V1.json'
      - 'apps/server/src/infra/mcft_cap09_phase5_service_principal_v1.ts'
      - 'apps/server/src/infra/mcft_cap09_phase5_service_principal_bootstrap_v1.ts'
      - 'apps/server/db/migrations/2026_08_27_mcft_cap_09_phase4_twin_runtime_acl.sql'

permissions:
  contents: read

jobs:
  provisioning-readiness:
    if: >-
      github.head_ref == 'feat/mcft-cap09-v13-producer-driven-qualification-v1' &&
      github.event.pull_request.base.sha == '46367333d228a2b90a86ff6a33aebc334f3d73a2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
      SEED_DATABASE_URL: ${{ secrets.GEOX_MCFT_CAP09_T3R1_S6_DATABASE_URL }}
      EVIDENCE_RUNTIME_DATABASE_URL_SECRET: ${{ secrets.GEOX_MCFT_CAP09_EVIDENCE_RUNTIME_DATABASE_URL }}
      EVIDENCE_RUNTIME_PASSWORD_SECRET: ${{ secrets.GEOX_MCFT_CAP09_EVIDENCE_RUNTIME_DATABASE_PASSWORD }}
      TWIN_RUNTIME_DATABASE_URL_SECRET: ${{ secrets.GEOX_MCFT_CAP09_TWIN_RUNTIME_DATABASE_URL }}
      TWIN_RUNTIME_PASSWORD_SECRET: ${{ secrets.GEOX_MCFT_CAP09_TWIN_RUNTIME_DATABASE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate bound schema ACL provisioning contract
        run: node scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_V1.cjs

      - name: Re-prove service LOGIN and runtime credential state without runtime start
        run: node scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_RUNTIME_CREDENTIAL_READINESS_V1.cjs

      - name: Emit runtime credential pre-arm readiness and remaining blockers
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const a=JSON.parse(fs.readFileSync('docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-PRODUCTION-OWNER-PROVISIONING-AUTHORITY-V1.json','utf8'));
          const arm=JSON.parse(fs.readFileSync('scripts/runtime_acceptance/MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_ARM_V1.json','utf8'));
          const runtime=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_PRODUCTION_RUNTIME_CREDENTIAL_READINESS_V1_RESULT.json','utf8'));
          if(runtime.status!=='PASS')throw new Error('OWNER_PROVISIONING_RUNTIME_CREDENTIAL_READINESS_REQUIRED');
          if(!['SERVICE_LOGIN_COMPLETE_RUNTIME_URLS_ABSENT','RUNTIME_CREDENTIAL_URLS_BOUND_PRE_ARM'].includes(runtime.stage))throw new Error('OWNER_PROVISIONING_RUNTIME_CREDENTIAL_STAGE_INVALID');
          if(runtime.database_name!=='geox_mcft_cap09_production_runtime_v1'||runtime.service_login_role_count!==2||runtime.bootstrap_password_secret_count!==2||runtime.exact_one_privilege_membership_each!==true)throw new Error('OWNER_PROVISIONING_RUNTIME_CREDENTIAL_IDENTITY_SHAPE_REQUIRED');
          if(arm.armed!==false||arm.service_login_bootstrap_authorized!==false||arm.runtime_credential_binding_authorized!==false)throw new Error('OWNER_PROVISIONING_RUNTIME_CREDENTIAL_ARM_MUST_BE_FALSE');
          const urlCount=runtime.runtime_database_url_secret_count;
          if(![0,2].includes(urlCount))throw new Error('OWNER_PROVISIONING_PARTIAL_RUNTIME_URL_SECRET_STATE_FORBIDDEN');
          const urlReady=urlCount===2;
          if(urlReady){
            for(const key of ['exact_database_name_match','exact_login_username_match','exact_password_pairing_match','exact_seed_host_port_match','evidence_runtime_url_connectivity_proven','twin_runtime_url_connectivity_proven','runtime_credential_pre_arm_ready']){
              if(runtime[key]!==true)throw new Error('OWNER_PROVISIONING_RUNTIME_URL_PROOF_REQUIRED:'+key);
            }
          }else{
            if(runtime.stage!=='SERVICE_LOGIN_COMPLETE_RUNTIME_URLS_ABSENT'||runtime.runtime_credential_pre_arm_ready!==false)throw new Error('OWNER_PROVISIONING_RUNTIME_URL_ZERO_STATE_REQUIRED');
          }
          const remaining=urlReady
            ? ['RUNTIME_CREDENTIAL_BINDING_NOT_AUTHORIZED']
            : ['RUNTIME_CREDENTIAL_BINDING_NOT_AUTHORIZED','EVIDENCE_RUNTIME_DATABASE_URL_SECRET_NOT_BOUND','TWIN_RUNTIME_DATABASE_URL_SECRET_NOT_BOUND'];
          const p={
            schema_version:'geox_mcft_cap09_production_owner_provisioning_readiness_v3',
            status:urlReady?'PASS_RUNTIME_CREDENTIAL_URL_READY_PRE_ARM':'PASS_RUNTIME_CREDENTIAL_PRE_ARM_READINESS',
            subject_sha:process.env.SUBJECT_SHA,
            observed_database_name:runtime.database_name,
            authority_target_database_name:a.target_database?.database_name??null,
            exact_target_database_bound:a.target_database?.status==='BOUND',
            schema_acl_materialization_evidence_bound:a.schema_acl_materialization_evidence?.status==='IMMUTABLE_SUCCESS',
            service_login_materialization_evidence_bound:a.service_login_materialization_evidence?.status==='IMMUTABLE_SUCCESS',
            service_login_post_readiness_evidence_bound:a.service_login_post_materialization_readiness_evidence?.status==='IMMUTABLE_SUCCESS',
            runtime_credential_pre_url_evidence_bound:a.runtime_credential_pre_url_evidence?.status==='IMMUTABLE_READY_UNARMED',
            current_stage:a.current_stage,
            production_host_table_count:41,
            runtime_routine_count:3,
            all_table_rows_zero:true,
            evidence_login_present:true,
            twin_login_present:true,
            exact_one_privilege_membership_each:runtime.exact_one_privilege_membership_each,
            bootstrap_password_secret_count:runtime.bootstrap_password_secret_count,
            runtime_database_url_secret_count:urlCount,
            runtime_url_exact_database_name_match:urlReady?runtime.exact_database_name_match:false,
            runtime_url_exact_login_username_match:urlReady?runtime.exact_login_username_match:false,
            runtime_url_exact_password_pairing_match:urlReady?runtime.exact_password_pairing_match:false,
            runtime_url_exact_seed_host_port_match:urlReady?runtime.exact_seed_host_port_match:false,
            evidence_runtime_url_connectivity_proven:urlReady?runtime.evidence_runtime_url_connectivity_proven:false,
            twin_runtime_url_connectivity_proven:urlReady?runtime.twin_runtime_url_connectivity_proven:false,
            provisioning_arm:false,
            service_login_bootstrap_authorized:false,
            runtime_credential_binding_authorized:false,
            service_login_stage_complete:true,
            runtime_credential_pre_arm_ready:urlReady,
            provisioning_ready:urlReady,
            next_stage:urlReady?'RUNTIME_CREDENTIAL_BINDING_READY_FOR_SEPARATE_ARM':'RUNTIME_CREDENTIAL_BINDING_REQUIRES_TWO_URL_SECRETS_AND_SEPARATE_ARM',
            remaining_provisioning_blockers:remaining,
            provisioning_performed:true,
            runtime_process_start:false,
            production_owner_activation:false,
            provider_request_count:0,
            formal_v5_arm:false,
            a0_bootstrap:false,
            o00_started:false
          };
          fs.mkdirSync('acceptance-output',{recursive:true});
          fs.writeFileSync('acceptance-output/MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_READINESS_V3_RESULT.json',JSON.stringify(p,null,2)+'\n');
          console.log(JSON.stringify(p,null,2));

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap09-production-owner-provisioning-readiness-${{ github.event.pull_request.head.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_PREFLIGHT_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_PRODUCTION_SERVICE_LOGIN_READINESS_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_PRODUCTION_RUNTIME_CREDENTIAL_READINESS_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_READINESS_V3_RESULT.json
          if-no-files-found: error
          retention-days: 90

name: mcft-cap-09-production-owner-provisioning-readiness

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-production-owner-provisioning-readiness.yml'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-PRODUCTION-OWNER-PROVISIONING-AUTHORITY-V1.json'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-PRODUCTION-NON-GITHUB-HOST-BINDING-AUTHORITY-V1.json'
      - 'scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_PRODUCTION_NON_GITHUB_HOST_BINDING_V1.cjs'
      - 'scripts/runtime_acceptance/MCFT_CAP_09_PRODUCTION_NON_GITHUB_HOST_BINDING_ARM_V1.json'
      - 'scripts/runtime_acceptance/MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_ARM_V1.json'
      - 'scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_V1.cjs'
      - 'scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_OPERATIONAL_SCHEMA_ACL_READINESS_V2.cjs'
      - 'scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_SERVICE_LOGIN_READINESS_V1.cjs'
      - 'scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_RUNTIME_CREDENTIAL_READINESS_V1.cjs'
      - 'scripts/runtime_acceptance/MCFT_CAP_09_PRODUCTION_OPERATIONAL_SCHEMA_ACL_ARM_V1.json'
      - 'apps/server/src/infra/mcft_cap09_phase5_service_principal_v1.ts'
      - 'apps/server/src/infra/mcft_cap09_phase5_service_principal_bootstrap_v1.ts'
      - 'apps/server/db/migrations/2026_08_27_mcft_cap_09_phase4_twin_runtime_acl.sql'

permissions:
  contents: read

jobs:
  provisioning-readiness:
    if: >-
      github.head_ref == 'feat/mcft-cap09-v13-producer-driven-qualification-v1' &&
      github.event.pull_request.base.sha == '46367333d228a2b90a86ff6a33aebc334f3d73a2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
      SEED_DATABASE_URL: ${{ secrets.GEOX_MCFT_CAP09_T3R1_S6_DATABASE_URL }}
      EVIDENCE_RUNTIME_DATABASE_URL_SECRET: ${{ secrets.GEOX_MCFT_CAP09_EVIDENCE_RUNTIME_DATABASE_URL }}
      EVIDENCE_RUNTIME_PASSWORD_SECRET: ${{ secrets.GEOX_MCFT_CAP09_EVIDENCE_RUNTIME_DATABASE_PASSWORD }}
      TWIN_RUNTIME_DATABASE_URL_SECRET: ${{ secrets.GEOX_MCFT_CAP09_TWIN_RUNTIME_DATABASE_URL }}
      TWIN_RUNTIME_PASSWORD_SECRET: ${{ secrets.GEOX_MCFT_CAP09_TWIN_RUNTIME_DATABASE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate bound schema ACL provisioning contract
        run: node scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_V1.cjs

      - name: Re-prove service LOGIN and runtime credential state without runtime start
        run: node scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_RUNTIME_CREDENTIAL_READINESS_V1.cjs

      - name: Validate non-GitHub host binding authority remains zero-effect
        run: node scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_PRODUCTION_NON_GITHUB_HOST_BINDING_V1.cjs

      - name: Emit non-GitHub host binding frontier and remaining blockers
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const a=JSON.parse(fs.readFileSync('docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-PRODUCTION-OWNER-PROVISIONING-AUTHORITY-V1.json','utf8'));
          const hostAuth=JSON.parse(fs.readFileSync('docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-PRODUCTION-NON-GITHUB-HOST-BINDING-AUTHORITY-V1.json','utf8'));
          const arm=JSON.parse(fs.readFileSync('scripts/runtime_acceptance/MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_ARM_V1.json','utf8'));
          const runtime=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_PRODUCTION_RUNTIME_CREDENTIAL_READINESS_V1_RESULT.json','utf8'));
          if(a.status!=='RUNTIME_CREDENTIAL_BINDING_COMPLETE_NON_GITHUB_HOST_NOT_BOUND'||a.current_stage!=='RUNTIME_CREDENTIAL_BINDING_COMPLETE_PRE_HOST_BINDING')throw new Error('OWNER_PROVISIONING_RUNTIME_CREDENTIAL_CLOSURE_REQUIRED');
          if(a.runtime_credential_binding_evidence?.status!=='IMMUTABLE_SUCCESS'||a.runtime_credential_binding_evidence?.runtime_credential_binding!==true)throw new Error('OWNER_PROVISIONING_RUNTIME_CREDENTIAL_BINDING_EVIDENCE_REQUIRED');
          if(a.runtime_credential_post_binding_readiness_evidence?.status!=='IMMUTABLE_SUCCESS')throw new Error('OWNER_PROVISIONING_RUNTIME_CREDENTIAL_POST_READINESS_REQUIRED');
          if(runtime.status!=='PASS'||runtime.stage!=='RUNTIME_CREDENTIAL_URLS_BOUND_PRE_ARM')throw new Error('OWNER_PROVISIONING_RUNTIME_CREDENTIAL_READBACK_REQUIRED');
          if(runtime.database_name!=='geox_mcft_cap09_production_runtime_v1'||runtime.service_login_role_count!==2||runtime.bootstrap_password_secret_count!==2||runtime.runtime_database_url_secret_count!==2||runtime.exact_one_privilege_membership_each!==true)throw new Error('OWNER_PROVISIONING_RUNTIME_CREDENTIAL_IDENTITY_SHAPE_REQUIRED');
          for(const key of ['exact_database_name_match','exact_login_username_match','exact_password_pairing_match','exact_seed_host_port_match','evidence_runtime_url_connectivity_proven','twin_runtime_url_connectivity_proven']){
            if(runtime[key]!==true)throw new Error('OWNER_PROVISIONING_RUNTIME_CREDENTIAL_READBACK_PROOF_REQUIRED:'+key);
          }
          if(runtime.credential_arm_observed!==false)throw new Error('OWNER_PROVISIONING_RUNTIME_CREDENTIAL_READBACK_MUST_BE_DISARMED');
          if(arm.armed!==false||arm.exact_target_database_name!==null)throw new Error('OWNER_PROVISIONING_POST_CREDENTIAL_ARM_MUST_BE_FALSE');
          for(const key of ['phase4_twin_acl_materialization_authorized','service_login_bootstrap_authorized','runtime_credential_binding_authorized','runtime_process_start_authorized','production_owner_activation_authorized','formal_v5_arm_authorized','a0_authorized','o00_authorized']){
            if(arm[key]!==false)throw new Error('OWNER_PROVISIONING_POST_CREDENTIAL_AUTHORITY_MUST_BE_FALSE:'+key);
          }
          if(a.next_stage?.stage!=='NON_GITHUB_HOST_BINDING'||a.next_stage?.status!=='NOT_STARTED'||a.next_stage?.non_github_host_identity_status!=='NOT_YET_BOUND')throw new Error('OWNER_PROVISIONING_NON_GITHUB_HOST_FRONTIER_REQUIRED');
          if(a.next_stage?.host_binding_authority_status!=='HOST_IDENTITY_AUTHORITY_DEFINED_UNBOUND')throw new Error('OWNER_PROVISIONING_HOST_BINDING_AUTHORITY_STATUS_REQUIRED');
          if(hostAuth.status!=='HOST_IDENTITY_AUTHORITY_DEFINED_UNBOUND'||hostAuth.production_execution_host_class!=='NON_GITHUB_LONG_RUNNING_SERVICE')throw new Error('OWNER_PROVISIONING_HOST_AUTHORITY_REQUIRED');
          if(hostAuth.github_actions?.production_execution_host_allowed!==false)throw new Error('OWNER_PROVISIONING_GITHUB_EXECUTION_HOST_FORBIDDEN');
          if(hostAuth.binding_state?.platform_selected!==false||hostAuth.binding_state?.evidence_host_identity_bound!==false||hostAuth.binding_state?.twin_host_identity_bound!==false||hostAuth.binding_state?.exact_two_runtime_service_identities_bound!==false||hostAuth.binding_state?.binding_authorized!==false)throw new Error('OWNER_PROVISIONING_HOST_AUTHORITY_MUST_REMAIN_UNBOUND');
          if(hostAuth.platform_evaluation?.status!=='RECOMMENDED_CANDIDATE_NOT_SELECTED'||hostAuth.platform_evaluation?.recommended_candidate?.platform_provider!=='RENDER')throw new Error('OWNER_PROVISIONING_RENDER_PLATFORM_RECOMMENDATION_REQUIRED');
          if(hostAuth.render_candidate_binding_contract?.status!=='CANDIDATE_SCHEMA_DEFINED_NOT_AUTHORIZED'||hostAuth.render_candidate_binding_contract?.workspace_owner_id!==null||hostAuth.render_candidate_binding_contract?.evidence_runtime?.service_id!==null||hostAuth.render_candidate_binding_contract?.twin_runtime?.service_id!==null)throw new Error('OWNER_PROVISIONING_RENDER_CANDIDATE_MUST_REMAIN_UNBOUND');
          const remaining=[
            'RENDER_PLATFORM_SELECTION_NOT_AUTHORIZED',
            'RENDER_WORKSPACE_OWNER_ID_NOT_BOUND',
            'RENDER_EVIDENCE_BACKGROUND_WORKER_SERVICE_ID_NOT_BOUND',
            'RENDER_TWIN_BACKGROUND_WORKER_SERVICE_ID_NOT_BOUND',
            'NON_GITHUB_HOST_BINDING_NOT_AUTHORIZED'
          ];
          const p={
            schema_version:'geox_mcft_cap09_production_owner_provisioning_readiness_v4',
            status:'PASS_NON_GITHUB_HOST_BINDING_FRONTIER',
            subject_sha:process.env.SUBJECT_SHA,
            observed_database_name:runtime.database_name,
            authority_target_database_name:a.target_database?.database_name??null,
            exact_target_database_bound:a.target_database?.status==='BOUND',
            schema_acl_materialization_evidence_bound:a.schema_acl_materialization_evidence?.status==='IMMUTABLE_SUCCESS',
            service_login_materialization_evidence_bound:a.service_login_materialization_evidence?.status==='IMMUTABLE_SUCCESS',
            runtime_credential_binding_evidence_bound:a.runtime_credential_binding_evidence?.status==='IMMUTABLE_SUCCESS',
            runtime_credential_post_readiness_evidence_bound:a.runtime_credential_post_binding_readiness_evidence?.status==='IMMUTABLE_SUCCESS',
            current_stage:a.current_stage,
            production_host_table_count:41,
            runtime_routine_count:3,
            all_table_rows_zero:true,
            evidence_login_present:true,
            twin_login_present:true,
            exact_one_privilege_membership_each:runtime.exact_one_privilege_membership_each,
            bootstrap_password_secret_count:runtime.bootstrap_password_secret_count,
            runtime_database_url_secret_count:runtime.runtime_database_url_secret_count,
            runtime_url_exact_database_name_match:runtime.exact_database_name_match,
            runtime_url_exact_login_username_match:runtime.exact_login_username_match,
            runtime_url_exact_password_pairing_match:runtime.exact_password_pairing_match,
            runtime_url_exact_seed_host_port_match:runtime.exact_seed_host_port_match,
            evidence_runtime_url_connectivity_proven:runtime.evidence_runtime_url_connectivity_proven,
            twin_runtime_url_connectivity_proven:runtime.twin_runtime_url_connectivity_proven,
            runtime_credential_binding_complete:true,
            host_binding_authority_defined:true,
            production_execution_host_class:hostAuth.production_execution_host_class,
            recommended_platform_candidate:'RENDER_BACKGROUND_WORKER',
            recommended_region:'OREGON_USA',
            render_candidate_schema_defined:true,
            render_workspace_owner_id_bound:false,
            render_evidence_service_id_bound:false,
            render_twin_service_id_bound:false,
            external_platform_selected:false,
            evidence_host_identity_bound:false,
            twin_host_identity_bound:false,
            exact_two_runtime_service_identities_bound:false,
            provisioning_arm:false,
            service_login_bootstrap_authorized:false,
            runtime_credential_binding_authorized:false,
            non_github_host_identity_bound:false,
            non_github_host_binding_authorized:false,
            host_binding_ready_for_external_identity:false,
            provisioning_ready:false,
            next_stage:'AUTHORIZE_RENDER_AND_BIND_WORKSPACE_PLUS_EXACT_TWO_BACKGROUND_WORKER_SERVICE_IDS',
            remaining_provisioning_blockers:remaining,
            provisioning_performed:true,
            runtime_process_start:false,
            production_owner_activation:false,
            provider_request_count:0,
            formal_v5_arm:false,
            a0_bootstrap:false,
            o00_started:false
          };
          fs.mkdirSync('acceptance-output',{recursive:true});
          fs.writeFileSync('acceptance-output/MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_READINESS_V4_RESULT.json',JSON.stringify(p,null,2)+'\n');
          console.log(JSON.stringify(p,null,2));

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap09-production-owner-provisioning-readiness-${{ github.event.pull_request.head.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_PREFLIGHT_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_PRODUCTION_SERVICE_LOGIN_READINESS_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_PRODUCTION_RUNTIME_CREDENTIAL_READINESS_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_PRODUCTION_NON_GITHUB_HOST_BINDING_PREFLIGHT_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_READINESS_V4_RESULT.json
          if-no-files-found: error
          retention-days: 90

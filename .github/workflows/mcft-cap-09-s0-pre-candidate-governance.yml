name: mcft-cap-09-s0-pre-candidate-governance

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-s0-pre-candidate-governance.yml'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-TASK.md'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-STAGE-1B-SCOPE-CONTRACT-V1.json'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-PREDECESSOR-LOCK-V1.json'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-CURRENT-AUTHORITY-V1.json'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S0-DELIVERY-STATUS-V1.json'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S0-CHANGED-FILE-BOUNDARY-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_S0_PRE_CANDIDATE_GOVERNANCE.cjs'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: read
  statuses: read

concurrency:
  group: mcft-cap09-s0-pre-candidate-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  pre-candidate-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
      - name: Classify CAP-09 S0 lifecycle
        id: lifecycle
        env:
          MCFT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff --name-only "$MCFT_BASE_SHA"...HEAD | sort)"
          foundation_files="$(printf '%s\n' \
            '.github/workflows/mcft-cap-09-s0-pre-candidate-governance.yml' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-CURRENT-AUTHORITY-V1.json' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-PREDECESSOR-LOCK-V1.json' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S0-CHANGED-FILE-BOUNDARY-V1.json' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S0-DELIVERY-STATUS-V1.json' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-STAGE-1B-SCOPE-CONTRACT-V1.json' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-TASK.md' \
            'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_S0_PRE_CANDIDATE_GOVERNANCE.cjs' | sort)"
          registry_files="$(printf '%s\n' \
            '.github/workflows/mcft-cap-09-trusted-registry-bootstrap.yml' \
            'docs/digital_twin/mcft/MCFT-CANDIDATE-AUTHORITY-REGISTRY-V1.json' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-CURRENT-AUTHORITY-V1.json' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S0-DELIVERY-STATUS-V1.json' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-TRUSTED-REGISTRY-BOOTSTRAP-V1.json' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-TRUSTED-REGISTRY-BOUNDARY-V1.json' \
            'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_TRUSTED_REGISTRY_BOOTSTRAP.cjs' | sort)"
          repair_files="$(printf '%s\n' \
            '.github/workflows/mcft-cap-09-s0-pre-candidate-governance.yml' \
            'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_S0_PRE_CANDIDATE_GOVERNANCE.cjs' | sort)"
          candidate_files="$(printf '%s\n' \
            '.github/workflows/mcft-cap-09-s0-authorization.yml' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-CURRENT-AUTHORITY-V1.json' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S0-AUTHORIZATION-CANDIDATE-BOUNDARY-V1.json' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S0-AUTHORIZATION-CANDIDATE-V1.json' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S0-DELIVERY-STATUS-V1.json' \
            'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_S0_AUTHORIZATION.cjs' | sort)"
          ea0_files="$(printf '%s\n' \
            '.github/workflows/mcft-cap-09-s0-pre-candidate-governance.yml' \
            '.github/workflows/mcft-cap-09-s6-external-evidence-authority-adjudication.yml' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-AMENDMENT-01-EXTERNAL-PUBLIC-EVIDENCE-AUTHORITY.md' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EXTERNAL-EVIDENCE-AUTHORITY-STATUS-V1.json' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-TASK.md' \
            'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_S6_EXTERNAL_EVIDENCE_AUTHORITY_ADJUDICATION.cjs' | sort)"
          if [[ "$files" == "$ea0_files" ]]; then
            mode='s6-ea0-adjudication'
          elif [[ "$files" == "$repair_files" ]]; then
            mode='workflow-repair'
          elif [[ "$files" == "$registry_files" ]]; then
            mode='registry-bootstrap'
          elif [[ "$files" == "$candidate_files" ]]; then
            mode='candidate-signal'
          elif [[ "$files" == "$foundation_files" ]]; then
            mode='s0-foundation'
          else
            mode='unsupported'
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Download CAP-08 exact-SHA/R2 predecessor authority
        if: steps.lifecycle.outputs.mode == 's0-foundation'
        uses: actions/download-artifact@v4
        with:
          run-id: 30908130962
          artifact-ids: 8891897316
          path: acceptance-input/cap08-exact-sha
          repository: liyongshang44-max/GEOX
          github-token: ${{ github.token }}
      - name: Validate CAP-09 S0 routed lifecycle
        env:
          MCFT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          MCFT_CAP08_ARTIFACT_DIR: acceptance-input/cap08-exact-sha
          MCFT_CAP09_S0_MODE: ${{ steps.lifecycle.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          case "$MCFT_CAP09_S0_MODE" in
            s6-ea0-adjudication)
              node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_S6_EXTERNAL_EVIDENCE_AUTHORITY_ADJUDICATION.cjs
              ;;
            workflow-repair)
              node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_S0_PRE_CANDIDATE_GOVERNANCE.cjs --workflow-repair
              ;;
            registry-bootstrap)
              node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_S0_PRE_CANDIDATE_GOVERNANCE.cjs --registry-bootstrap
              ;;
            candidate-signal)
              node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_S0_PRE_CANDIDATE_GOVERNANCE.cjs --candidate-signal
              ;;
            s0-foundation)
              node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_S0_PRE_CANDIDATE_GOVERNANCE.cjs
              ;;
            *)
              echo "unsupported CAP-09 S0 lifecycle: $MCFT_CAP09_S0_MODE" >&2
              exit 1
              ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap-09-s0-pre-candidate-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_S0_PRE_CANDIDATE_GOVERNANCE_RESULT.json
            acceptance-output/MCFT_CAP_09_S6_EXTERNAL_EVIDENCE_AUTHORITY_ADJUDICATION_RESULT.json
          if-no-files-found: error
          retention-days: 90

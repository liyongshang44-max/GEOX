name: tmp-mcft-cap09-am19-p24-static-guard-refresh

on:
  push:
    branches:
      - feat/mcft-cap09-am19-formal-successor-v1
    paths:
      - '.github/workflows/_tmp-mcft-cap09-am19-p24-static-guard-refresh.yml'

permissions:
  contents: write

jobs:
  exact-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mcft-cap09-am19-formal-successor-v1
          fetch-depth: 0
      - name: Patch only PR static guard
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/mcft-cap-09-amendment19-persistent-24t-qualification.yml')
          s=p.read_text(encoding='utf-8')
          old="""      - 'scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_24T_QUALIFICATION_V1.ts'\n      - 'scripts/runtime_acceptance/RUN_MCFT_CAP_09_ROLLING_PREBOUNDARY_REHYDRATION_V1.ts'\n"""
          new="""      - 'scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_24T_QUALIFICATION_V1.ts'\n      - 'scripts/runtime_acceptance/RUN_MCFT_CAP_09_ROLLING_PREBOUNDARY_REHYDRATION_V1.ts'\n      - 'apps/server/src/domain/twin_runtime/external_formal_amendment19_window_manifest_v1.ts'\n"""
          if s.count(old)!=1: raise SystemExit('P24_PATH_MARKER_CARDINALITY')
          s=s.replace(old,new)
          s=s.replace("  EXACT_PREDECESSOR_MAIN: '24a1b5d957e042a0a92543ca2d9742901a22d453'\n",'')
          start=s.index('      - name: Require exact predecessor and one-file environment-binding repair boundary')
          end=s.index('\n\n      - uses: pnpm/action-setup@v4',start)
          replacement="""      - name: Require exact current protected-main base and shared-manifest qualification boundary\n        shell: bash\n        run: |\n          set -euo pipefail\n          test \"$(git rev-parse HEAD)\" = \"$SUBJECT_SHA\"\n          git fetch --no-tags origin main\n          base_sha='${{ github.event.pull_request.base.sha }}'\n          test \"$base_sha\" = \"$(git rev-parse origin/main)\" || { echo 'AM19_P24_PR_BASE_MUST_EQUAL_CURRENT_PROTECTED_MAIN' >&2; exit 1; }\n          changed=$(git diff --name-only \"$base_sha\" \"$SUBJECT_SHA\")\n          grep -Fxq 'scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_24T_QUALIFICATION_V1.ts' <<<\"$changed\" || { echo 'AM19_P24_SUCCESSOR_QUALIFICATION_REFACTOR_REQUIRED' >&2; exit 1; }\n          grep -Fxq 'apps/server/src/domain/twin_runtime/external_formal_amendment19_window_manifest_v1.ts' <<<\"$changed\" || { echo 'AM19_P24_SHARED_MANIFEST_BUILDER_CHANGE_REQUIRED' >&2; exit 1; }\n          grep -Fq 'buildExternalFormalAmendment19WindowManifestV1' scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_24T_QUALIFICATION_V1.ts\n          ! grep -Fq 'MCFT_CAP09_AM19_ACCELERATED_PERSISTENT24_MANIFEST_V1' scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_24T_QUALIFICATION_V1.ts\n"""
          s=s[:start]+replacement+s[end:]
          p.write_text(s,encoding='utf-8')
      - name: Validate workflow diff and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = '.github/workflows/mcft-cap-09-amendment19-persistent-24t-qualification.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/mcft-cap-09-amendment19-persistent-24t-qualification.yml
          git diff --cached --check
          git commit -m 'MCFT-CAP-09: refresh Amendment-19 qualification static guard'
          git push origin HEAD:feat/mcft-cap09-am19-formal-successor-v1

name: mcft-cap-09-formal-v5-final-readback-v1

on:
  pull_request:
    branches:
      - main
      - fix/mcft-cap09-r6-formal-v5-admission-v1
    paths:
      - '.github/workflows/mcft-cap-09-formal-v5-final-readback-v1.yml'
      - 'scripts/runtime_acceptance/READBACK_MCFT_CAP_09_FORMAL_V5_FINAL_V1.ts'
      - 'scripts/runtime_acceptance/READBACK_MCFT_CAP_09_FORMAL_V5_ACTIVE_WATCHDOG_V1.ts'
      - 'scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_FORMAL_V5_DOWNSTREAM_ZERO_V1.ts'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_FORMAL_V5_FINAL_READBACK_SCHEMA_V1.ts'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_FORMAL_V5_FINAL_READBACK_V1.cjs'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-CONTROL-PLANE-V1.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcft-cap09-formal-v5-final-readback-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  final-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: g12
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d g12"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/g12
    steps:
      - name: Checkout exact G12 subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove read-only G12 change boundary
        run: node scripts/governance_acceptance/VERIFY_MCFT_CAP_09_20261010_CROP_ADOPTION_SUCCESSOR_V1.cjs --historic-g12

      - name: Compile and selftest Formal-v5 final readback
        run: pnpm exec tsx scripts/runtime_acceptance/READBACK_MCFT_CAP_09_FORMAL_V5_FINAL_V1.ts --selftest

      - name: Compile and selftest Formal-v5 active watchdog
        run: pnpm exec tsx scripts/runtime_acceptance/READBACK_MCFT_CAP_09_FORMAL_V5_ACTIVE_WATCHDOG_V1.ts --selftest

      - name: Compile and selftest Formal-v5 downstream zero
        run: pnpm exec tsx scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_FORMAL_V5_DOWNSTREAM_ZERO_V1.ts selftest

      - name: Materialize exact 29-table V13 schema in isolated PostgreSQL
        env:
          MCFT_CAP09_V13_HOLISTIC_SCHEMA_DESTRUCTIVE_ACCEPTANCE: '1'
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_V13_HOLISTIC_SCHEMA_POSTGRES.ts

      - name: Prove final readback SQL columns against materialized schema
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_FORMAL_V5_FINAL_READBACK_SCHEMA_V1.ts

      - name: Reprove server typecheck
        run: pnpm run typecheck:server

      - name: Upload G12 qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-formal-v5-final-readback-${{ github.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_FORMAL_V5_FINAL_READBACK_GOVERNANCE_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_FORMAL_V5_FINAL_READBACK_V1.json
            acceptance-output/MCFT_CAP_09_FORMAL_V5_DOWNSTREAM_ZERO_V1.json
            acceptance-output/MCFT_CAP_09_V13_HOLISTIC_SCHEMA_POSTGRES_V1_RESULT.json
          if-no-files-found: warn
          retention-days: 14

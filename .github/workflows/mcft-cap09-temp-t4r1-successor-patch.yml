name: mcft-cap09-temp-t4r1-successor-patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mcft-cap09-temp-t4r1-successor-patch.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-exact-successor-tokens:
    if: github.event.pull_request.head.ref == 'fix/mcft-cap09-t4r1-persistent-v4-successor'
    runs-on: ubuntu-latest
    steps:
      - name: Patch exact persistent successor tokens on PR head
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.payload.pull_request.head.ref;
            const expectedHead = context.payload.pull_request.head.sha;
            const replacementsByPath = {
              'scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_24T_QUALIFICATION_V1.ts': [
                ['MCFT_CAP09_A18_CROP_CONTEXT_MATERIALIZATION_PROFILE_V2', 'MCFT_CAP09_A18_CROP_CONTEXT_MATERIALIZATION_PROFILE_V3'],
                ['materializeExternalFormalA18CropContextV2', 'materializeExternalFormalA18CropContextV3'],
                ['external_formal_a18_crop_context_v2.js', 'external_formal_a18_crop_context_v3.js'],
                ['GEOX-MCFT-CAP-09-S6-FORMAL-CROP-CONTEXT-AUTHORITY-V2.json', 'GEOX-MCFT-CAP-09-S6-FORMAL-CROP-CONTEXT-AUTHORITY-V3.json'],
              ],
              'apps/server/src/domain/twin_runtime/external_formal_prewindow_authority_bundle_v3.ts': [
                ['derived_context_authority: "FORMAL_DERIVED_CROP_WATER_USE_STAGE_CONTEXT_V2"', 'derived_context_authority: "FORMAL_DERIVED_CROP_WATER_USE_STAGE_CONTEXT_V3"'],
              ],
            };
            let parent = expectedHead;
            for (const [path, replacements] of Object.entries(replacementsByPath)) {
              const file = await github.rest.repos.getContent({ owner, repo, path, ref: parent });
              if (Array.isArray(file.data) || file.data.type !== 'file') throw new Error(`PATCH_FILE_REQUIRED:${path}`);
              let text = Buffer.from(file.data.content, file.data.encoding).toString('utf8');
              for (const [from, to] of replacements) {
                const count = text.split(from).length - 1;
                if (count < 1) throw new Error(`PATCH_EXACT_OLD_TOKEN_REQUIRED:${path}:${from}`);
                if (text.includes(to)) throw new Error(`PATCH_NEW_TOKEN_ALREADY_PRESENT:${path}:${to}`);
                text = text.split(from).join(to);
              }
              const updated = await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch,
                message: `fix(mcft-cap09): bind ${path.includes('prewindow') ? 'prewindow hashes' : 'persistent runner'} to T4R1 V3`,
                content: Buffer.from(text, 'utf8').toString('base64'),
                sha: file.data.sha,
              });
              parent = updated.data.commit.sha;
            }
            core.notice(`PATCHED_HEAD=${parent}`);

name: b09ab-action-window-horizon-authority-topology-exact

on:
  pull_request:
    branches:
      - docs/bline-b09ab-action-window-horizon-authority-topology-v1

jobs:
  exact-product-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove literal B-09ab product head
        run: |
          git checkout 88ed1f6139f12b2ca61d1c494d2ec979b1f96500
          test "$(git rev-parse HEAD)" = "88ed1f6139f12b2ca61d1c494d2ec979b1f96500"
          test "$(git rev-parse HEAD^)" = "93b00ec51eca95b6388f236ce73b4fa6d4e10c49"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace dependencies
        run: |
          pnpm --filter @geox/contracts build
          pnpm --filter @geox/device-skills build
          pnpm --filter @geox/skill-registry build

      - name: B-02 semantic governance
        run: node scripts/governance_acceptance/ACCEPTANCE_B02_SEMANTIC_CONTRACT_LINTER_V1.cjs

      - name: B-09ab topology acceptance
        run: node scripts/governance_acceptance/ACCEPTANCE_B09AB_ACTION_WINDOW_HORIZON_AUTHORITY_TOPOLOGY_V1.cjs

      - name: B-09aa predecessor preservation
        run: |
          git diff --exit-code 93b00ec51eca95b6388f236ce73b4fa6d4e10c49 88ed1f6139f12b2ca61d1c494d2ec979b1f96500 -- \
            docs/architecture/semantic_convergence/GEOX-B09AA-ACTION-WINDOW-HORIZON-AUTHORITY-INVENTORY-V1.json \
            docs/architecture/semantic_convergence/GEOX-B09AA-ACTION-WINDOW-HORIZON-AUTHORITY-INVENTORY-V1.md \
            scripts/governance_acceptance/ACCEPTANCE_B09AA_ACTION_WINDOW_HORIZON_AUTHORITY_INVENTORY_V1.cjs
          echo "B09AA_PREDECESSOR_PRESERVED_PASS"

      - name: B-09v selector regression
        run: node --import tsx --test apps/server/src/domain/decision/decision_eligibility_policy_selector_v1.contract.test.ts

      - name: B-09s writer regression
        run: node --import tsx --test apps/server/src/domain/decision/decision_eligibility_policy_declaration_fact_v1.contract.test.ts

      - name: B-07d evaluator regression
        run: node --import tsx --test apps/server/src/domain/decision/decision_eligibility_evaluator_v1.contract.test.ts

      - name: B-07e runtime regression
        run: node --import tsx --test apps/server/src/domain/decision/decision_eligibility_runtime_v1.contract.test.ts

      - name: Product diff remains bounded
        run: |
          git diff --name-only 93b00ec51eca95b6388f236ce73b4fa6d4e10c49 88ed1f6139f12b2ca61d1c494d2ec979b1f96500 > /tmp/b09ab-files.txt
          cat /tmp/b09ab-files.txt
          test "$(wc -l < /tmp/b09ab-files.txt | tr -d ' ')" = "4"
          git diff --check 93b00ec51eca95b6388f236ce73b4fa6d4e10c49 88ed1f6139f12b2ca61d1c494d2ec979b1f96500

      - name: Prove production and MCFT surfaces unchanged
        run: |
          git diff --exit-code 93b00ec51eca95b6388f236ce73b4fa6d4e10c49 88ed1f6139f12b2ca61d1c494d2ec979b1f96500 -- \
            apps/server/src apps/server/db packages config .github/workflows docs/digital_twin docs/twin_kernel scripts/runtime_acceptance
          echo "B09AB_PRODUCTION_MCFT_UNCHANGED_PASS"

      - name: Server typecheck
        run: pnpm --filter @geox/server typecheck

      - name: Server build
        run: pnpm --filter @geox/server build

      - name: Prove validation did not mutate product
        run: |
          test "$(git rev-parse HEAD)" = "88ed1f6139f12b2ca61d1c494d2ec979b1f96500"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "B09AB_VALIDATION_ONLY_NO_PRODUCT_MUTATION_PASS"

      - name: Marker
        run: |
          echo "B09AB_EXACT_HEAD 88ed1f6139f12b2ca61d1c494d2ec979b1f96500"
          echo "B09AB_HORIZON_AUTHORITY_TOPOLOGY_PROPOSAL_PASS"

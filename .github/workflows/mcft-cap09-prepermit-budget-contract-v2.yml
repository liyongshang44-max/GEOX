name: MCFT CAP-09 Pre-Permit Budget V2 (Synthetic Only)
on:
  pull_request:
    paths:
      - "scripts/governance_acceptance/MCFT_CAP09_PREPERMIT_BUDGET_CONTRACT_V2.cjs"
      - "scripts/governance_acceptance/MCFT_CAP09_DA9_SOURCE_TIME_CONTRACT_V3.cjs"
      - "scripts/governance_acceptance/MCFT_CAP09_DA9_PREPERMIT_SOURCE_USE_BUDGET_V3.cjs"
      - "scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP09_DA9_V3_SIGNED_HOST_BRIDGE_V1.cjs"
      - "scripts/governance_acceptance/MCFT_CAP09_ISOLATED_RETRY_ADMISSION_BRIDGE_V1.cjs"
      - "scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP09_PREPERMIT_BUDGET_CONTRACT_V2.cjs"
      - "scripts/cap09_adoption_v1/da9-retry-bundle-v2.cjs"
      - "scripts/runtime_acceptance/MCFT_CAP09_GOVERNED_RETRY_HOST_V1.cjs"
      - "scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP09_GOVERNED_RETRY_HOST_V1.cjs"
      - "scripts/runtime_acceptance/MCFT_CAP09_POSTEXECUTION_TIMING_ADJUDICATION_V2.cjs"
      - "scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP09_POSTEXECUTION_TIMING_ADJUDICATION_V2.cjs"
      - ".github/workflows/mcft-cap09-prepermit-budget-contract-v2.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-no-io:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pre-Permit Source / Window Negative Regression
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP09_PREPERMIT_BUDGET_CONTRACT_V2.cjs
      - name: Post-Execution Receipt Chain Negative Regression
        run: node scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP09_POSTEXECUTION_TIMING_ADJUDICATION_V2.cjs
      - name: Legacy Admission Structural Regression
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP09_ISOLATED_RETRY_ADMISSION_BRIDGE_V1.cjs
      - name: DA9 V3 Source-Time Arithmetic (Strictly Read-Only)
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP09_DA9_SOURCE_TIME_CONTRACT_V3.cjs
      - name: DA9 V3 Synthetic Signed Permit / Host Child Contract
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP09_DA9_V3_SIGNED_HOST_BRIDGE_V1.cjs
      - name: Parent Admission Readback Start-Time Boundary (Strictly No I/O)
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP09_GOVERNED_RETRY_HOST_V1.cjs
      - name: DA9 Signed Review V2 Regression
        run: node scripts/cap09_adoption_v1/test-da9-retry-bundle-v2.cjs

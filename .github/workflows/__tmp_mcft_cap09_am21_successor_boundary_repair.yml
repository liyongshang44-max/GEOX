name: temp-mcft-cap09-am21-successor-boundary-repair

on:
  push:
    branches:
      - qual/mcft-cap09-control-plane-convergence-v1
    paths:
      - '.github/workflows/__tmp_mcft_cap09_am21_successor_boundary_repair.yml'

permissions:
  contents: write

jobs:
  apply-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply narrow Amendment-21 successor-base repair
        shell: python
        run: |
          from pathlib import Path

          target = Path('scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_AMENDMENT_21_FORMAL_V5_EPOCH_STAGE_HANDOFF_V1.cjs')
          text = target.read_text(encoding='utf-8')

          anchor = '''const head=git("rev-parse","HEAD");
          const baseEnv=String(process.env.MCFT_BASE_SHA||"").trim();
          const subjectEnv=String(process.env.MCFT_SUBJECT_SHA||process.env.SUBJECT_SHA||"").trim();
          if(subjectEnv)assert.equal(head,subjectEnv,"AM21_EXACT_SUBJECT_REQUIRED");
          '''
          replacement = '''const head=git("rev-parse","HEAD");
          const baseEnv=String(process.env.MCFT_BASE_SHA||"").trim();
          const subjectEnv=String(process.env.MCFT_SUBJECT_SHA||process.env.SUBJECT_SHA||"").trim();
          if(subjectEnv)assert.equal(head,subjectEnv,"AM21_EXACT_SUBJECT_REQUIRED");

          function currentMainSuccessorBase(){
            const explicit=String(process.env.AM21_SUCCESSOR_BASE_SHA||"").trim();
            if(/^[0-9a-f]{40}$/.test(explicit))return explicit;
            const eventPath=String(process.env.GITHUB_EVENT_PATH||"").trim();
            if(!eventPath||!fs.existsSync(eventPath))return null;
            try{
              const event=JSON.parse(fs.readFileSync(eventPath,"utf8"));
              if(event.pull_request?.base?.ref!=="main")return null;
              const sha=String(event.pull_request?.base?.sha||"").trim();
              return /^[0-9a-f]{40}$/.test(sha)?sha:null;
            }catch{return null;}
          }
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f'AM21 subject anchor match count={text.count(anchor)}')
          text = text.replace(anchor, replacement, 1)

          old = '''  }else if(baseEnv===REARM_PROOF_RETENTION_BASE){
            expectedFiles=REARM_PROOF_RETENTION_EXACT_FILES;
          }else{
            assert.fail("AM21_EXACT_PR_BASE_REQUIRED:"+baseEnv);
          }
          exactPredecessor=baseEnv;
          '''
          new = '''  }else if(baseEnv===REARM_PROOF_RETENTION_BASE){
            expectedFiles=REARM_PROOF_RETENTION_EXACT_FILES;
          }else{
            const successorBase=currentMainSuccessorBase();
            assert.equal(baseEnv,successorBase,"AM21_EXACT_PR_BASE_REQUIRED:"+baseEnv);
            assert.equal(
              git("merge-base",REARM_PROOF_RETENTION_BASE,baseEnv),
              REARM_PROOF_RETENTION_BASE,
              "AM21_CURRENT_MAIN_SUCCESSOR_BASE_MUST_DESCEND_FROM_REARM_PROOF_RETENTION_BASE",
            );
            assert.equal(
              git("merge-base",baseEnv,head),
              baseEnv,
              "AM21_CURRENT_MAIN_SUCCESSOR_BASE_MUST_BE_ANCESTOR_OF_HEAD",
            );
            expectedFiles=null;
          }
          exactPredecessor=baseEnv;
          '''
          if text.count(old) != 1:
              raise SystemExit(f'AM21 base switch match count={text.count(old)}')
          text = text.replace(old, new, 1)
          target.write_text(text, encoding='utf-8')

      - name: Commit candidate repair locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "geox-mcft-qualification-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/__tmp_mcft_cap09_am21_successor_boundary_repair.yml
          git add scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_AMENDMENT_21_FORMAL_V5_EPOCH_STAGE_HANDOFF_V1.cjs
          git diff --cached --check
          git commit -m "fix(mcft-cap09): admit exact current-main Amendment-21 successor"

      - name: Verify Amendment-21 against exact protected-main successor base
        env:
          MCFT_BASE_SHA: 8f63c498bd48978e2dd525ad57b6b8fdb7ada560
          AM21_SUCCESSOR_BASE_SHA: 8f63c498bd48978e2dd525ad57b6b8fdb7ada560
        shell: bash
        run: |
          set -euo pipefail
          export MCFT_SUBJECT_SHA="$(git rev-parse HEAD)"
          test "$(git merge-base "$MCFT_BASE_SHA" HEAD)" = "$MCFT_BASE_SHA"
          node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_AMENDMENT_21_FORMAL_V5_EPOCH_STAGE_HANDOFF_V1.cjs
          git diff --check "$MCFT_BASE_SHA...HEAD"

      - name: Publish verified repair and self-remove carrier
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:${GITHUB_REF_NAME}

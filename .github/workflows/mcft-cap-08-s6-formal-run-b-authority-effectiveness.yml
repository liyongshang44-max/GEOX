name: mcft-cap-08-s6-formal-run-b-authority-effectiveness

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-08-s6-formal-run-b-authority-effectiveness.yml'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-FORMAL-RUN-B-REPLACEMENT-001-EXECUTION-AUTHORITY-EFFECTIVE-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-FORMAL-RUN-B-AUTHORITY-EFFECTIVENESS-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-FORMAL-RUN-B-AUTHORITY-EFFECTIVENESS-BOUNDARY-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_FORMAL_RUN_B_AUTHORITY_EFFECTIVENESS_V1.cjs'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: mcft-cap08-s6-formal-run-b-authority-effectiveness-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  authority-effectiveness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact RUN_B effectiveness head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
      - name: Validate Formal RUN_B authority effectiveness
        env:
          MCFT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_FORMAL_RUN_B_AUTHORITY_EFFECTIVENESS_V1.cjs
      - name: Upload RUN_B effectiveness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap-08-s6-formal-run-b-authority-effectiveness-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: acceptance-output/MCFT_CAP_08_S6_FORMAL_RUN_B_AUTHORITY_EFFECTIVENESS_RESULT.json
          if-no-files-found: error
          retention-days: 90

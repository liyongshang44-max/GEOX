name: mcft-cap-09-final-semantic-active-v3-rewrite

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-final-semantic-active-v3-rewrite.yml'
      - '.github/workflows/mcft-cap-09-amendment19-formal-a0-bootstrap.yml'
      - '.github/workflows/mcft-cap-09-amendment19-formal-hourly-evidence.yml'
      - '.github/workflows/mcft-cap-09-amendment19-formal-live-runner.yml'
      - '.github/workflows/mcft-cap-09-amendment19-formal-final-readback.yml'
      - 'scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_AMENDMENT_19_FORMAL_DOWNSTREAM_ZERO_V1.ts'
      - 'scripts/governance_acceptance/ASSEMBLE_MCFT_CAP_09_AMENDMENT_19_FORMAL_COMPLETION_V1.cjs'

permissions:
  contents: write

concurrency:
  group: mcft-cap09-final-semantic-active-v3-rewrite-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  rewrite:
    if: github.event.pull_request.head.ref == 'fix/mcft-cap09-formal-a0-t4r1-crop-authority'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Rewrite only active Formal v2 bindings to v3
        shell: python
        run: |
          from pathlib import Path
          files = [
              '.github/workflows/mcft-cap-09-amendment19-formal-hourly-evidence.yml',
              '.github/workflows/mcft-cap-09-amendment19-formal-live-runner.yml',
              '.github/workflows/mcft-cap-09-amendment19-formal-final-readback.yml',
              'scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_AMENDMENT_19_FORMAL_DOWNSTREAM_ZERO_V1.ts',
              'scripts/governance_acceptance/ASSEMBLE_MCFT_CAP_09_AMENDMENT_19_FORMAL_COMPLETION_V1.cjs',
          ]
          old = 'geox_mcft_cap09_s6_formal_t4r1_24h_v2'
          new = 'geox_mcft_cap09_s6_formal_t4r1_24h_v3'
          changed = 0
          for name in files:
              p = Path(name)
              text = p.read_text()
              count = text.count(old)
              print(f'{name}: stale-active-v2={count}')
              if count:
                  p.write_text(text.replace(old, new))
                  changed += count
          a0 = Path('.github/workflows/mcft-cap-09-amendment19-formal-a0-bootstrap.yml')
          text = a0.read_text()
          stale_guard = "          ! grep -Fq 'geox_mcft_cap09_s6_formal_t4r1_24h_v2' .github/workflows/mcft-cap-09-amendment19-formal-a0-bootstrap.yml\n"
          if stale_guard in text:
              a0.write_text(text.replace(stale_guard, ''))
              changed += 1
          Path('/tmp/rewrite-count').write_text(str(changed))
      - name: Commit rewrite when needed
        shell: bash
        run: |
          set -euo pipefail
          changed=$(cat /tmp/rewrite-count)
          if [ "$changed" = '0' ]; then
            echo 'ACTIVE_FORMAL_V3_REWRITE_ALREADY_COMPLETE'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/mcft-cap-09-amendment19-formal-a0-bootstrap.yml \
            .github/workflows/mcft-cap-09-amendment19-formal-hourly-evidence.yml \
            .github/workflows/mcft-cap-09-amendment19-formal-live-runner.yml \
            .github/workflows/mcft-cap-09-amendment19-formal-final-readback.yml \
            scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_AMENDMENT_19_FORMAL_DOWNSTREAM_ZERO_V1.ts \
            scripts/governance_acceptance/ASSEMBLE_MCFT_CAP_09_AMENDMENT_19_FORMAL_COMPLETION_V1.cjs
          git diff --cached --check
          git commit -m 'fix(mcft-cap09): remove stale Formal v2 A0 guard token'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

# retriggered after final semantic closure audit wiring was updated

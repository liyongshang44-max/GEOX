name: mcft-cap-09-ea1o-sflux-reconstruction-amendment

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-ea1o-sflux-reconstruction-amendment.yml'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-TASK.md'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-AMENDMENT-03-GFS-SFLUX-EXPANDING-AVERAGE-RECONSTRUCTION-AUTHORITY.md'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA1O-SFLUX-RECONSTRUCTION-AMENDMENT-STATUS-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA1O_SFLUX_RECONSTRUCTION_AMENDMENT.cjs'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: mcft-cap09-ea1o-a3-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  sflux-reconstruction-amendment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1

      - name: Resolve exact Amendment-03 base and subject
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "subject_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "base_sha=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
            echo "subject_sha=${{ github.event.merge_group.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_sha=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
            echo "subject_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Classify Amendment-03 lifecycle applicability
        id: lifecycle
        env:
          MCFT_BASE_SHA: ${{ steps.authority.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff --name-only "$MCFT_BASE_SHA"...HEAD | sort)"
          amendment_files="$(printf '%s\n' \
            '.github/workflows/mcft-cap-09-ea1o-sflux-reconstruction-amendment.yml' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-AMENDMENT-03-GFS-SFLUX-EXPANDING-AVERAGE-RECONSTRUCTION-AUTHORITY.md' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA1O-SFLUX-RECONSTRUCTION-AMENDMENT-STATUS-V1.json' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-TASK.md' \
            'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA1O_SFLUX_RECONSTRUCTION_AMENDMENT.cjs' | sort)"
          workflow_only='.github/workflows/mcft-cap-09-ea1o-sflux-reconstruction-amendment.yml'

          if [[ "$files" == "$amendment_files" ]]; then
            mode='amendment-03-candidate'
          elif [[ "$files" == "$workflow_only" ]]; then
            mode='workflow-lifecycle-repair'
          else
            owned_mutation='false'
            while IFS= read -r file; do
              case "$file" in
                'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-AMENDMENT-03-GFS-SFLUX-EXPANDING-AVERAGE-RECONSTRUCTION-AUTHORITY.md'|\
                'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA1O-SFLUX-RECONSTRUCTION-AMENDMENT-STATUS-V1.json'|\
                'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA1O_SFLUX_RECONSTRUCTION_AMENDMENT.cjs')
                  owned_mutation='true'
                  ;;
              esac
            done <<< "$files"
            if [[ "$owned_mutation" == 'true' ]]; then
              mode='unsupported-owned-mutation'
            else
              mode='successor-taskbook-change'
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Amendment-03 lifecycle mode: $mode"

      - name: Syntax-check Amendment-03 governance acceptance
        if: steps.lifecycle.outputs.mode == 'amendment-03-candidate'
        run: node --check scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA1O_SFLUX_RECONSTRUCTION_AMENDMENT.cjs

      - name: Validate exact Amendment-03 architecture boundary
        if: steps.lifecycle.outputs.mode == 'amendment-03-candidate'
        env:
          MCFT_BASE_SHA: ${{ steps.authority.outputs.base_sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA1O_SFLUX_RECONSTRUCTION_AMENDMENT.cjs

      - name: Validate Amendment-03 workflow lifecycle repair
        if: steps.lifecycle.outputs.mode == 'workflow-lifecycle-repair'
        shell: bash
        run: |
          set -euo pipefail
          echo 'Amendment-03 lifecycle repair recognized: workflow-only mutation.'
          grep -Fq 'successor-taskbook-change' .github/workflows/mcft-cap-09-ea1o-sflux-reconstruction-amendment.yml
          grep -Fq 'unsupported-owned-mutation' .github/workflows/mcft-cap-09-ea1o-sflux-reconstruction-amendment.yml

      - name: Record Amendment-03 not applicable to successor Taskbook change
        if: steps.lifecycle.outputs.mode == 'successor-taskbook-change'
        shell: bash
        run: |
          set -euo pipefail
          echo 'Amendment-03 adjudication is not applicable: no Amendment-03-owned authority file changed.'

      - name: Reject unsupported Amendment-03-owned mutation
        if: steps.lifecycle.outputs.mode == 'unsupported-owned-mutation'
        shell: bash
        run: |
          echo 'unsupported mutation of Amendment-03-owned files outside its exact lifecycle' >&2
          exit 1

      - uses: actions/upload-artifact@v4
        if: always() && steps.lifecycle.outputs.mode == 'amendment-03-candidate'
        with:
          name: mcft-cap-09-ea1o-a3-${{ steps.authority.outputs.subject_sha }}
          path: acceptance-output/MCFT_CAP_09_EA1O_SFLUX_RECONSTRUCTION_AMENDMENT_RESULT.json
          if-no-files-found: error
          retention-days: 90

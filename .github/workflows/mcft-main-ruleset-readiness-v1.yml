name: mcft-main-ruleset-readiness-v1

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcft-main-ruleset-readiness-v1.yml'
      - '.github/workflows/mcft-candidate-declaration-integrity-v2.yml'
      - '.github/workflows/mcft-release-lane-v1.yml'
      - '.github/workflows/mcft-delivery-policy-v2.yml'
      - 'docs/digital_twin/mcft/MCFT-MAIN-RULESET-PROFILE-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_MAIN_RULESET_READINESS_V1.cjs'
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  mcft-main-ruleset-readiness-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
      - name: Validate exact ruleset readiness profile
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_MAIN_RULESET_READINESS_V1.cjs
      - name: TEMP inspect PR 2930 target checks
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const targetPr = 2930;
            const targetSha = 'ca061957cb60e25c3ebcd8bb104db4262bc54f97';
            const checks = await github.paginate(github.rest.checks.listForRef, { owner, repo, ref: targetSha, per_page: 100 });
            core.info('CHECK_RUNS=' + JSON.stringify(checks.map((check) => ({ id: check.id, name: check.name, status: check.status, conclusion: check.conclusion, details_url: check.details_url, started_at: check.started_at, completed_at: check.completed_at })), null, 2));
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, { owner, repo, event: 'pull_request_target', per_page: 100 });
            const matching = runs.filter((run) => (run.pull_requests || []).some((pr) => pr.number === targetPr)).slice(0, 20);
            const output = [];
            for (const run of matching) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { owner, repo, run_id: run.id, per_page: 100 });
              output.push({ id: run.id, name: run.name, status: run.status, conclusion: run.conclusion, head_sha: run.head_sha, created_at: run.created_at, updated_at: run.updated_at, jobs: jobs.map((job) => ({ id: job.id, name: job.name, status: job.status, conclusion: job.conclusion, steps: (job.steps || []).map((step) => ({ name: step.name, status: step.status, conclusion: step.conclusion })) })) });
            }
            core.info('TARGET_RUNS=' + JSON.stringify(output, null, 2));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-main-ruleset-readiness-v1-${{ github.sha }}
          path: acceptance-output/MCFT_MAIN_RULESET_READINESS_V1_RESULT.json
          if-no-files-found: error

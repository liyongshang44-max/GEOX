name: mcft-cap-09-am19-current-rehydration-hash-diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-am19-current-rehydration-hash-diagnostic.yml'

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: '20.11.1'
  PNPM_VERSION: '9.15.4'
  PYTHON_VERSION: '3.12'
  PRODUCER_SHA: '530b857765da471a442727daee9687206059e5c4'
  SOURCE_RUN_ID: '32210446530'
  SOURCE_ARTIFACT_NAME: 'mcft-cap09-rolling-preboundary-20260819t040000z-530b857765da471a442727daee9687206059e5c4'
  EXPECTED_TARGET_T: '2026-08-19T04:00:00.000Z'
  LOCAL_REHYDRATION_DATABASE_URL: 'postgres://postgres:postgres@127.0.0.1:55433/ea5e2_readiness'
  DIAG_CAPTURE_PATH: '/tmp/mcft-cap09-am19-semantic-json-capture.ndjson'
  DIAG_HOOK_PATH: '/tmp/mcft-cap09-am19-semantic-json-hook.cjs'

jobs:
  diagnose-current-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MCFT_CAP09_SUBJECT_SHA: '530b857765da471a442727daee9687206059e5c4'
      MCFT_CAP09_CONSUMER_SUBJECT_SHA: '530b857765da471a442727daee9687206059e5c4'
      MCFT_EA5E2_TRANSIENT_S3_ENDPOINT: ${{ secrets.GEOX_MCFT_CAP09_FORMAL_RAW_S3_ENDPOINT }}
      MCFT_EA5E2_TRANSIENT_S3_BUCKET: ${{ secrets.GEOX_MCFT_CAP09_FORMAL_RAW_S3_BUCKET }}
      MCFT_EA5E2_TRANSIENT_S3_REGION: ${{ secrets.GEOX_MCFT_CAP09_FORMAL_RAW_S3_REGION }}
      MCFT_EA5E2_TRANSIENT_S3_ACCESS_KEY_ID: ${{ secrets.GEOX_MCFT_CAP09_FORMAL_RAW_S3_ACCESS_KEY_ID }}
      MCFT_EA5E2_TRANSIENT_S3_SECRET_ACCESS_KEY: ${{ secrets.GEOX_MCFT_CAP09_FORMAL_RAW_S3_SECRET_ACCESS_KEY }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ea5e2_readiness
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ea5e2_readiness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact diagnostic-only PR boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha }}" = "$PRODUCER_SHA" || { echo 'AM19_REHYDRATION_DIAG_EXACT_BASE_REQUIRED' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          mapfile -t changed < <(git diff --name-only "$PRODUCER_SHA" HEAD | sort)
          test "${#changed[@]}" -eq 1 || { printf 'AM19_REHYDRATION_DIAG_ONE_FILE_REQUIRED\n%s\n' "${changed[*]}" >&2; exit 1; }
          test "${changed[0]}" = '.github/workflows/mcft-cap-09-am19-current-rehydration-hash-diagnostic.yml'
          git checkout --detach "$PRODUCER_SHA"
          test "$(git rev-parse HEAD)" = "$PRODUCER_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Require subject bindings and secrets without disclosure
        shell: bash
        run: |
          set -euo pipefail
          test "$MCFT_CAP09_SUBJECT_SHA" = "$PRODUCER_SHA" || { echo 'AM19_REHYDRATION_DIAG_SUBJECT_BINDING_DRIFT' >&2; exit 1; }
          test "$MCFT_CAP09_CONSUMER_SUBJECT_SHA" = "$PRODUCER_SHA" || { echo 'AM19_REHYDRATION_DIAG_CONSUMER_BINDING_DRIFT' >&2; exit 1; }
          for name in MCFT_EA5E2_TRANSIENT_S3_ENDPOINT MCFT_EA5E2_TRANSIENT_S3_BUCKET MCFT_EA5E2_TRANSIENT_S3_REGION MCFT_EA5E2_TRANSIENT_S3_ACCESS_KEY_ID MCFT_EA5E2_TRANSIENT_S3_SECRET_ACCESS_KEY; do
            test -n "${!name:-}" || { echo "AM19_REHYDRATION_DIAG_SECRET_REQUIRED:${name}" >&2; exit 1; }
          done

      - name: Download frozen failing candidate from exact source run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: rolling-candidate

      - name: Require exact frozen candidate identity
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const path = 'rolling-candidate/MCFT_CAP_09_ROLLING_PREBOUNDARY_CANDIDATE.json';
          const c = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (c.schema_version !== 'geox_mcft_cap09_rolling_preboundary_candidate_v1' || c.status !== 'PASS') throw new Error('AM19_REHYDRATION_DIAG_CANDIDATE_STATUS_REQUIRED');
          if (c.producer_subject_sha !== process.env.PRODUCER_SHA) throw new Error('AM19_REHYDRATION_DIAG_PRODUCER_MISMATCH');
          if (c.target_t !== process.env.EXPECTED_TARGET_T) throw new Error('AM19_REHYDRATION_DIAG_TARGET_MISMATCH');
          const rows = c.rehydration_manifest?.expected_records;
          if (!Array.isArray(rows) || rows.length !== 3) throw new Error('AM19_REHYDRATION_DIAG_THREE_EXPECTED_ROWS_REQUIRED');
          const types = rows.map(r => r.record_type).sort();
          const expected = ['future_et0_assumption_v1','future_weather_assumption_v1','soil_moisture_observation_v1'];
          if (JSON.stringify(types) !== JSON.stringify(expected)) throw new Error('AM19_REHYDRATION_DIAG_EXPECTED_FAMILY_SET_REQUIRED');
          console.log(JSON.stringify({status:'PASS',producer_subject_sha:c.producer_subject_sha,target_t:c.target_t,expected_record_types:types}));

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install exact repository and decoder dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          python -m pip install --disable-pip-version-check \
            eccodes==2.47.0 \
            eccodeslib==2.47.3.23 \
            numpy==1.26.4 \
            refet==0.4.2
          python -m eccodes selfcheck

      - name: Prepare read-only semantic-row hook outside repository
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$DIAG_CAPTURE_PATH" "$DIAG_HOOK_PATH"
          cat > "$DIAG_HOOK_PATH" <<'NODE'
          'use strict';
          const fs = require('node:fs');
          const originalStringify = JSON.stringify;
          const expectedTypes = [
            'future_et0_assumption_v1',
            'future_weather_assumption_v1',
            'soil_moisture_observation_v1',
          ];
          let captureIndex = 0;

          function isSemanticRowSet(value) {
            if (!Array.isArray(value) || value.length !== 3) return false;
            const types = [];
            for (const row of value) {
              if (!row || typeof row !== 'object') return false;
              if (typeof row.record_type !== 'string' || typeof row.source_record_id !== 'string' || typeof row.record_semantic_sha256 !== 'string') return false;
              if (!/^(?:sha256:)?[0-9a-f]{64}$/.test(row.record_semantic_sha256)) return false;
              types.push(row.record_type);
            }
            types.sort();
            return originalStringify(types) === originalStringify(expectedTypes);
          }

          JSON.stringify = function geoxDiagnosticStringify(value, replacer, space) {
            if (isSemanticRowSet(value)) {
              const capturePath = process.env.MCFT_CAP09_DIAG_CAPTURE_PATH;
              if (capturePath) {
                const rows = value.map((row) => ({
                  record_type: row.record_type,
                  source_record_id: row.source_record_id,
                  record_semantic_sha256: row.record_semantic_sha256,
                }));
                fs.appendFileSync(capturePath, originalStringify({ capture_index: ++captureIndex, rows }) + '\n', 'utf8');
              }
            }
            return originalStringify(value, replacer, space);
          };
          NODE
          node --check "$DIAG_HOOK_PATH"
          test "$(git rev-parse HEAD)" = "$PRODUCER_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          runner='scripts/runtime_acceptance/RUN_MCFT_CAP_09_ROLLING_PREBOUNDARY_REHYDRATION_V1.ts'
          test "$(git hash-object "$runner")" = "$(git rev-parse "$PRODUCER_SHA:$runner")" || { echo 'AM19_REHYDRATION_DIAG_RUNNER_BYTES_DRIFT' >&2; exit 1; }

      - name: Rehydrate exact candidate under original exact-main identity
        id: rehydrate
        continue-on-error: true
        env:
          MCFT_CAP09_ROLLING_CANDIDATE_PATH: ${{ github.workspace }}/rolling-candidate/MCFT_CAP_09_ROLLING_PREBOUNDARY_CANDIDATE.json
          MCFT_CAP09_ROLLING_REHYDRATION_ISOLATED_DB_ACK: 'true'
          DATABASE_URL: ${{ env.LOCAL_REHYDRATION_DATABASE_URL }}
          PYTHON: python
          MCFT_CAP09_DIAG_CAPTURE_PATH: ${{ env.DIAG_CAPTURE_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCER_SHA"
          GITHUB_EVENT_NAME=workflow_run \
          GITHUB_REF=refs/heads/main \
          GITHUB_SHA="$PRODUCER_SHA" \
          NODE_OPTIONS="--require=$DIAG_HOOK_PATH" \
          pnpm exec tsx scripts/runtime_acceptance/RUN_MCFT_CAP_09_ROLLING_PREBOUNDARY_REHYDRATION_V1.ts run

      - name: Build and adjudicate hash-only diagnostic
        if: always()
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const outputPath = 'acceptance-output/MCFT_CAP_09_AM19_REHYDRATION_HASH_DIAGNOSTIC.json';
          fs.mkdirSync('acceptance-output', { recursive: true });
          const outcome = '${{ steps.rehydrate.outcome }}';
          const candidate = JSON.parse(fs.readFileSync('rolling-candidate/MCFT_CAP_09_ROLLING_PREBOUNDARY_CANDIDATE.json', 'utf8'));
          const sanitize = (rows) => rows.map((row) => ({
            record_type: row.record_type,
            source_record_id: row.source_record_id,
            record_semantic_sha256: row.record_semantic_sha256,
          }));
          const base = {
            schema_version: 'geox_mcft_cap09_am19_rehydration_hash_diagnostic_v2',
            producer_subject_sha: process.env.PRODUCER_SHA,
            target_t: process.env.EXPECTED_TARGET_T,
            source_run_id: process.env.SOURCE_RUN_ID,
            rehydration_outcome: outcome,
            execution_identity: {
              event_name: 'workflow_run',
              ref: 'refs/heads/main',
              sha: process.env.PRODUCER_SHA,
            },
            runner_file_patched: false,
            raw_values_emitted: false,
            canonical_payload_emitted: false,
          };
          const writeAndFail = (code, extra = {}) => {
            fs.writeFileSync(outputPath, JSON.stringify({ ...base, status: 'FAIL', diagnostic_error: code, ...extra }, null, 2) + '\n');
            throw new Error(code);
          };
          if (!['success','failure'].includes(outcome)) writeAndFail(`AM19_REHYDRATION_DIAG_OUTCOME_INVALID:${outcome}`);
          if (!fs.existsSync(process.env.DIAG_CAPTURE_PATH)) writeAndFail('AM19_REHYDRATION_DIAG_MATCHER_CAPTURE_REQUIRED', { capture_count: 0 });
          const lines = fs.readFileSync(process.env.DIAG_CAPTURE_PATH, 'utf8').trim().split(/\n+/).filter(Boolean).map((line) => JSON.parse(line));
          if (lines.length !== 2) writeAndFail('AM19_REHYDRATION_DIAG_EXACT_TWO_STRINGIFY_CAPTURES_REQUIRED', { capture_count: lines.length });
          const actualRows = sanitize(lines[0].rows);
          const expectedCapturedRows = sanitize(lines[1].rows);
          const expectedRows = sanitize(candidate.rehydration_manifest.expected_records);
          if (JSON.stringify(expectedCapturedRows) !== JSON.stringify(expectedRows)) {
            writeAndFail('AM19_REHYDRATION_DIAG_EXPECTED_CAPTURE_DRIFT', { capture_count: lines.length });
          }
          const actualByType = new Map(actualRows.map((row) => [row.record_type, row]));
          const expectedByType = new Map(expectedRows.map((row) => [row.record_type, row]));
          const types = [...new Set([...actualByType.keys(), ...expectedByType.keys()])].sort();
          const rows = types.map((recordType) => {
            const actualRow = actualByType.get(recordType);
            const expectedRow = expectedByType.get(recordType);
            const sourceRecordIdMatch = Boolean(expectedRow && actualRow && expectedRow.source_record_id === actualRow.source_record_id);
            const semanticHashMatch = Boolean(expectedRow && actualRow && expectedRow.record_semantic_sha256 === actualRow.record_semantic_sha256);
            return {
              record_type: recordType,
              expected_source_record_id: expectedRow?.source_record_id ?? null,
              actual_source_record_id: actualRow?.source_record_id ?? null,
              expected_semantic_sha256: expectedRow?.record_semantic_sha256 ?? null,
              actual_semantic_sha256: actualRow?.record_semantic_sha256 ?? null,
              source_record_id_match: sourceRecordIdMatch,
              semantic_hash_match: semanticHashMatch,
              match: sourceRecordIdMatch && semanticHashMatch,
            };
          });
          const orderMatch = JSON.stringify(actualRows) === JSON.stringify(expectedRows);
          const diagnostic = {
            ...base,
            status: 'PASS',
            capture_count: lines.length,
            rows,
            mismatch_count: rows.filter((row) => !row.match).length,
            order_match: orderMatch,
          };
          fs.writeFileSync(outputPath, JSON.stringify(diagnostic, null, 2) + '\n');
          console.log('MCFT_CAP09_REHYDRATION_HASH_DIAGNOSTIC:' + JSON.stringify(diagnostic));
          if (outcome === 'success' && (!orderMatch || diagnostic.mismatch_count !== 0)) throw new Error('AM19_REHYDRATION_DIAG_SUCCESS_MUST_BE_EXACT_MATCH');
          if (outcome === 'failure' && (orderMatch || diagnostic.mismatch_count < 1)) throw new Error('AM19_REHYDRATION_DIAG_FAILURE_NOT_SEMANTIC_MISMATCH');

      - name: Upload hash-only diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-am19-rehydration-hash-diagnostic-530b8577-20260819t040000z-v2
          path: acceptance-output/MCFT_CAP_09_AM19_REHYDRATION_HASH_DIAGNOSTIC.json
          if-no-files-found: error
          retention-days: 2

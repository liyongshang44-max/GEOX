name: mcft-cap-08-s4-t17-product-implementation-effectiveness

on:
  pull_request:
    paths:
      - ".github/workflows/mcft-cap-08-s4-t17-product-implementation-effectiveness.yml"
      - "docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S4-T17-PRODUCT-IMPLEMENTATION-EFFECTIVENESS-*.json"
      - "scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S4_T17_PRODUCT_IMPLEMENTATION_EFFECTIVENESS_V1.cjs"

permissions:
  contents: read

env:
  PNPM_VERSION: 9.15.4
  NODE_VERSION: 20.11.1

jobs:
  static-effectiveness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
      - name: Validate merged-main implementation effectiveness
        env:
          MCFT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S4_T17_PRODUCT_IMPLEMENTATION_EFFECTIVENESS_V1.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap-08-s4-t17-product-implementation-effectiveness-static-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/
          if-no-files-found: warn
          retention-days: 90

  postgres-effectiveness:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, rollback]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare independent effectiveness database identity
        shell: bash
        run: |
          mode="${{ matrix.mode }}"
          echo "MCFT_CAP08_DB_NAME=geox_mcft_cap08_s4_t17_effect_${{ github.run_id }}_${mode}" >> "$GITHUB_ENV"
          echo "MCFT_CAP08_RUNNER_PASSWORD=cap08-s4-t17-effect-runner-${{ github.run_id }}-${mode}" >> "$GITHUB_ENV"
          echo "MCFT_CAP08_MIGRATOR_PASSWORD=cap08-s4-t17-effect-migrator-${{ github.run_id }}-${mode}" >> "$GITHUB_ENV"
          echo "MCFT_CAP08_LEGACY_RUNTIME_PASSWORD=cap08-s4-t17-effect-legacy-${{ github.run_id }}-${mode}" >> "$GITHUB_ENV"
      - name: Bootstrap fresh PostgreSQL 16 database
        env:
          MCFT_CAP08_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          MCFT_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          export MCFT_CAP08_TARGET_DATABASE_NAME="$MCFT_CAP08_DB_NAME"
          pnpm -w exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_08_PLATFORM_SECURITY_BOOTSTRAP_DB.ts
      - name: Apply merged-main T17 transition migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d "$MCFT_CAP08_DB_NAME" -v ON_ERROR_STOP=1 \
            -f apps/server/db/migrations/2026_08_01_mcft_cap08_s4_t17_transition_persistence.sql
      - name: Replay merged-main product implementation
        env:
          DATABASE_URL: postgres://geox_mcft_cap08_runner_v1:${{ env.MCFT_CAP08_RUNNER_PASSWORD }}@127.0.0.1:5432/${{ env.MCFT_CAP08_DB_NAME }}
          MCFT_CAP08_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/${{ env.MCFT_CAP08_DB_NAME }}
          MCFT_CAP08_T17_ACCEPTANCE_MODE: ${{ matrix.mode }}
          MCFT_CAP08_S2_G3_DESTRUCTIVE_ACCEPTANCE: "1"
        shell: bash
        run: |
          mkdir -p acceptance-output
          set -o pipefail
          pnpm -w exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_08_S4_T17_PRODUCT_IMPLEMENTATION_DB.ts \
            2>&1 | tee "acceptance-output/MCFT_CAP_08_S4_T17_PRODUCT_IMPLEMENTATION_EFFECTIVENESS_${{ matrix.mode }}.log"
          cp acceptance-output/MCFT_CAP_08_S4_T17_PRODUCT_IMPLEMENTATION_DB_RESULT.json \
             "acceptance-output/MCFT_CAP_08_S4_T17_PRODUCT_IMPLEMENTATION_EFFECTIVENESS_DB_RESULT_${{ matrix.mode }}.json"
      - name: Drop and verify disposable effectiveness database absence
        if: always()
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          db="$MCFT_CAP08_DB_NAME"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='${db}' AND pid<>pg_backend_pid();"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS \"${db}\";"
          present="$(psql -h 127.0.0.1 -U postgres -d postgres -At \
            -c "SELECT count(*) FROM pg_database WHERE datname='${db}';")"
          test "$present" = "0"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap-08-s4-t17-product-implementation-effectiveness-${{ matrix.mode }}-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/
          if-no-files-found: warn
          retention-days: 90

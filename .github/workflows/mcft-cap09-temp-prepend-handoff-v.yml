# trigger: normalized V section tail
name: MCFT CAP-09 temporary handoff V prepend

on:
  push:
    branches:
      - docs/mcft-cap09-handoff-2026-08-26-phase2-evidence-module-frontier
    paths:
      - .github/workflows/mcft-cap09-temp-prepend-handoff-v.yml

permissions:
  contents: write

jobs:
  prepend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout handoff branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepend V handoff section exactly
        shell: bash
        run: |
          set -euo pipefail
          handoff="docs/handoff/GEOX-MCFT-CAP-09-HANDOFF-2026-08-27.md"
          root="docs/handoff/.mcft-cap09-v-section"

          git merge-base --is-ancestor bb4466a1504f907eef44d25492a7d3108496e4db HEAD
          git diff --quiet bb4466a1504f907eef44d25492a7d3108496e4db -- "$handoff"

          cat "$root/00.md" "$root/01.md" "$root/02.md" "$root/03.md" "$root/04.md" "$root/05.md" > /tmp/mcft-cap09-v-section.md
          test "$(wc -c < /tmp/mcft-cap09-v-section.md | tr -d ' ')" = "23960"
          test "$(sha256sum /tmp/mcft-cap09-v-section.md | awk '{print $1}')" = "dcb9ef9a39c60346aedd2c1746ff651698e0c64817321ae65a0798432a75c62b"

          python - <<'PY'
          from pathlib import Path
          import hashlib
          handoff = Path("docs/handoff/GEOX-MCFT-CAP-09-HANDOFF-2026-08-27.md")
          section = Path("/tmp/mcft-cap09-v-section.md").read_bytes()
          old = handoff.read_bytes()
          assert old.startswith(b"# GEOX MCFT-CAP-09 Conversation Handoff")
          assert b"# U \xe2\x80\x94 Production Runtime Live" in old[:1000]
          assert b"# V \xe2\x80\x94 Twin V2 Rolling Stage Authority Resolver Seam" not in old[:2000]
          new = section + old
          handoff.write_bytes(new)
          written = handoff.read_bytes()
          assert written[:len(section)] == section
          assert written[len(section):] == old
          print("OLD_SHA256=" + hashlib.sha256(old).hexdigest())
          print("NEW_SHA256=" + hashlib.sha256(written).hexdigest())
          PY

          git diff --check
          python - <<'PY'
          import subprocess
          expected = "docs/handoff/GEOX-MCFT-CAP-09-HANDOFF-2026-08-27.md"
          out = subprocess.check_output(["git","diff","--numstat","--",expected], text=True).strip()
          parts = out.split("\t")
          assert len(parts) == 3 and parts[2] == expected, out
          additions, deletions = int(parts[0]), int(parts[1])
          assert additions > 0, out
          assert deletions == 0, out
          print(f"HANDOFF_NUMSTAT={additions} additions / {deletions} deletions")
          PY

      - name: Commit handoff prepend
        shell: bash
        run: |
          set -euo pipefail
          path="docs/handoff/GEOX-MCFT-CAP-09-HANDOFF-2026-08-27.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$path"
          test "$(git diff --cached --name-only)" = "$path"
          git commit -m "docs(mcft-cap09): hand off Twin V2 rolling-stage resolver settlement frontier"
          git push origin "HEAD:docs/mcft-cap09-handoff-2026-08-26-phase2-evidence-module-frontier"

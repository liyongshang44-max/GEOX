name: mcft-cap-09-production-runtime-credential-bind-one-shot

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-production-runtime-credential-bind-one-shot.yml'
      - 'scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_RUNTIME_CREDENTIAL_READINESS_V1.cjs'
      - 'scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_SERVICE_LOGIN_READINESS_V1.cjs'
      - 'scripts/runtime_acceptance/MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_ARM_V1.json'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-PRODUCTION-OWNER-PROVISIONING-AUTHORITY-V1.json'

permissions:
  contents: read

concurrency:
  group: mcft-cap09-production-runtime-credential-bind-one-shot
  cancel-in-progress: false

jobs:
  bind-runtime-credentials:
    if: >-
      github.head_ref == 'feat/mcft-cap09-v13-producer-driven-qualification-v1' &&
      github.event.pull_request.base.sha == '46367333d228a2b90a86ff6a33aebc334f3d73a2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
      SEED_DATABASE_URL: ${{ secrets.GEOX_MCFT_CAP09_T3R1_S6_DATABASE_URL }}
      EVIDENCE_RUNTIME_DATABASE_URL_SECRET: ${{ secrets.GEOX_MCFT_CAP09_EVIDENCE_RUNTIME_DATABASE_URL }}
      EVIDENCE_RUNTIME_PASSWORD_SECRET: ${{ secrets.GEOX_MCFT_CAP09_EVIDENCE_RUNTIME_DATABASE_PASSWORD }}
      TWIN_RUNTIME_DATABASE_URL_SECRET: ${{ secrets.GEOX_MCFT_CAP09_TWIN_RUNTIME_DATABASE_URL }}
      TWIN_RUNTIME_PASSWORD_SECRET: ${{ secrets.GEOX_MCFT_CAP09_TWIN_RUNTIME_DATABASE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve explicit runtime credential arm without I/O
        id: arm
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const arm=JSON.parse(fs.readFileSync('scripts/runtime_acceptance/MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_ARM_V1.json','utf8'));
          const out='acceptance-output/MCFT_CAP_09_PRODUCTION_RUNTIME_CREDENTIAL_BINDING_V1_RESULT.json';
          const frozen={
            runtime_process_start:false,
            production_owner_activation:false,
            provider_request_count:0,
            formal_v5_arm:false,
            a0_bootstrap:false,
            o00_started:false
          };
          if(arm.armed!==true){
            if(arm.exact_target_database_name!==null)throw new Error('RUNTIME_CREDENTIAL_UNARMED_TARGET_MUST_BE_NULL');
            for(const key of [
              'phase4_twin_acl_materialization_authorized',
              'service_login_bootstrap_authorized',
              'runtime_credential_binding_authorized',
              'runtime_process_start_authorized',
              'production_owner_activation_authorized',
              'formal_v5_arm_authorized',
              'a0_authorized',
              'o00_authorized'
            ]) if(arm[key]!==false)throw new Error('RUNTIME_CREDENTIAL_UNARMED_AUTHORITY_MUST_BE_FALSE:'+key);
            fs.mkdirSync('acceptance-output',{recursive:true});
            fs.writeFileSync(out,JSON.stringify({
              schema_version:'geox_mcft_cap09_production_runtime_credential_binding_v1',
              status:'SKIPPED_NOT_ARMED',
              stage:'RUNTIME_CREDENTIAL_BINDING',
              subject_sha:process.env.SUBJECT_SHA,
              database_name:'geox_mcft_cap09_production_runtime_v1',
              runtime_credential_binding:false,
              ...frozen
            },null,2)+'\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'armed=false\n');
            console.log('RUNTIME_CREDENTIAL_BINDING_SKIPPED_NOT_ARMED');
            process.exit(0);
          }
          if(arm.exact_target_database_name!=='geox_mcft_cap09_production_runtime_v1')throw new Error('RUNTIME_CREDENTIAL_ARM_DATABASE_MISMATCH');
          if(arm.runtime_credential_binding_authorized!==true)throw new Error('RUNTIME_CREDENTIAL_BINDING_AUTHORITY_REQUIRED');
          for(const key of [
            'phase4_twin_acl_materialization_authorized',
            'service_login_bootstrap_authorized',
            'runtime_process_start_authorized',
            'production_owner_activation_authorized',
            'formal_v5_arm_authorized',
            'a0_authorized',
            'o00_authorized'
          ]) if(arm[key]!==false)throw new Error('RUNTIME_CREDENTIAL_LATER_AUTHORITY_FORBIDDEN:'+key);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'armed=true\n');

      - name: Require exact two runtime URL secrets and prove connectivity
        if: steps.arm.outputs.armed == 'true'
        env:
          MCFT_CAP09_REQUIRE_RUNTIME_URLS_BOUND: '1'
        run: node scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_RUNTIME_CREDENTIAL_READINESS_V1.cjs

      - name: Emit credential binding machine proof
        if: steps.arm.outputs.armed == 'true'
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const src=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_PRODUCTION_RUNTIME_CREDENTIAL_READINESS_V1_RESULT.json','utf8'));
          if(src.status!=='PASS'||src.stage!=='RUNTIME_CREDENTIAL_URLS_BOUND_PRE_ARM'||src.runtime_credential_pre_arm_ready!==true)throw new Error('RUNTIME_CREDENTIAL_BOUND_READINESS_REQUIRED');
          const out={
            schema_version:'geox_mcft_cap09_production_runtime_credential_binding_v1',
            status:'PASS',
            stage:'RUNTIME_CREDENTIAL_BINDING_COMPLETE_NON_GITHUB_HOST_NOT_BOUND',
            subject_sha:process.env.SUBJECT_SHA,
            database_name:src.database_name,
            service_login_role_count:src.service_login_role_count,
            bootstrap_password_secret_count:src.bootstrap_password_secret_count,
            runtime_database_url_secret_count:src.runtime_database_url_secret_count,
            exact_database_name_match:src.exact_database_name_match,
            exact_login_username_match:src.exact_login_username_match,
            exact_password_pairing_match:src.exact_password_pairing_match,
            exact_seed_host_port_match:src.exact_seed_host_port_match,
            exact_one_privilege_membership_each:src.exact_one_privilege_membership_each,
            evidence_runtime_url_connectivity_proven:src.evidence_runtime_url_connectivity_proven,
            twin_runtime_url_connectivity_proven:src.twin_runtime_url_connectivity_proven,
            runtime_credential_binding:true,
            runtime_process_start:false,
            production_owner_activation:false,
            provider_request_count:0,
            formal_v5_arm:false,
            a0_bootstrap:false,
            o00_started:false
          };
          fs.writeFileSync('acceptance-output/MCFT_CAP_09_PRODUCTION_RUNTIME_CREDENTIAL_BINDING_V1_RESULT.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap09-production-runtime-credential-bind-${{ github.event.pull_request.head.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_PRODUCTION_RUNTIME_CREDENTIAL_READINESS_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_PRODUCTION_RUNTIME_CREDENTIAL_BINDING_V1_RESULT.json
          if-no-files-found: error
          retention-days: 90

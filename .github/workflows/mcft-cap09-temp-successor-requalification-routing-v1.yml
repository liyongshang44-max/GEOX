name: mcft-cap09-temp-successor-requalification-routing-v1

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap09-temp-successor-requalification-routing-v1.yml'

permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Patch successor requalification routing without rewriting historical modes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const CURRENT_BASE='d67a2b3cce037c1eaad4d7d051d1f6a11eb09fc3';
          function read(p){return fs.readFileSync(p,'utf8');}
          function write(p,t){fs.writeFileSync(p,t);}
          function once(p,before,after){
            let t=read(p);
            if(!t.includes(before)) throw new Error('PATCH_BOUNDARY_MISSING:'+p+':'+before.slice(0,100));
            if(t.split(before).length!==2) throw new Error('PATCH_BOUNDARY_AMBIGUOUS:'+p);
            write(p,t.replace(before,after));
          }
          function insertAfter(p,anchor,extra){
            let t=read(p);
            if(t.includes(extra.trim())) return;
            if(!t.includes(anchor)) throw new Error('INSERT_ANCHOR_MISSING:'+p);
            write(p,t.replace(anchor,anchor+extra));
          }
          function segment(p,start,end,replacement){
            let t=read(p); const i=t.indexOf(start); if(i<0) throw new Error('SEGMENT_START_MISSING:'+p);
            const j=t.indexOf(end,i); if(j<0) throw new Error('SEGMENT_END_MISSING:'+p);
            write(p,t.slice(0,i)+replacement+t.slice(j));
          }

          // Phase2 provider continuity: preserve prior adoption mode and admit the current governed predecessor.
          {
            const wf='.github/workflows/mcft-cap-09-ea5c2b1-live-kbs-soil-ingress-executor.yml';
            insertAfter(wf,"      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5C2B1_PHASE2_SUCCESSOR_REQUALIFICATION_V1.cjs'\n","      - 'scripts/runtime_acceptance/MCFT_CAP_09_EA5E2_RUNTIME_DEPENDENCY_GRAPH_V4_BINDING.cjs'\n");
            insertAfter(wf,'          protected_main_adoption_sha="fa6e260d8cdec4a82403a86f1c7b3d5420e44ef8"\n','          rolling_stage_resolver_sha="'+CURRENT_BASE+'"\n');
            once(wf,'          if [[ "$base_sha" != "$phase1_sha" && "$base_sha" != "$phase2_closure_sha" && "$base_sha" != "$protected_main_adoption_sha" ]]; then','          if [[ "$base_sha" != "$phase1_sha" && "$base_sha" != "$phase2_closure_sha" && "$base_sha" != "$protected_main_adoption_sha" && "$base_sha" != "$rolling_stage_resolver_sha" ]]; then');
            once(wf,'          if [ "$base_sha" = "$protected_main_adoption_sha" ]; then','          if [[ "$base_sha" = "$protected_main_adoption_sha" || "$base_sha" = "$rolling_stage_resolver_sha" ]]; then');

            const gate='scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5C2B1_PHASE2_SUCCESSOR_REQUALIFICATION_V1.cjs';
            insertAfter(gate,'const PROTECTED_MAIN_ADOPTION_BASE = "fa6e260d8cdec4a82403a86f1c7b3d5420e44ef8";\n','const ROLLING_STAGE_RESOLVER_BASE = "'+CURRENT_BASE+'";\n');
            once(gate,'    assert.equal(base, PROTECTED_MAIN_ADOPTION_BASE, "EA5C2B1_PROTECTED_MAIN_ADOPTION_BASE_REQUIRED");','    assert.ok([PROTECTED_MAIN_ADOPTION_BASE, ROLLING_STAGE_RESOLVER_BASE].includes(base), "EA5C2B1_PROTECTED_MAIN_ADOPTION_BASE_REQUIRED");');
            once(gate,'      PROTECTED_MAIN_ADOPTION_BASE,\n      "Execute live KBS source through frozen EA3 and EA5C1 pipeline against CI-only stores",','      PROTECTED_MAIN_ADOPTION_BASE,\n      ROLLING_STAGE_RESOLVER_BASE,\n      "Execute live KBS source through frozen EA3 and EA5C1 pipeline against CI-only stores",');
          }

          // Twin V2 stage authority: keep historical exact boundary; add protected-main successor preservation mode.
          {
            const wf='.github/workflows/mcft-cap-09-twin-composition-v2-stage-authority.yml';
            once(wf,'    branches:\n      - feat/mcft-cap09-twin-stage-authority-mount-v1','    branches:\n      - main\n      - feat/mcft-cap09-twin-stage-authority-mount-v1');
            once(wf,'      MCFT_CAP09_TWIN_V2_STAGE_BASE_SHA: 373e33c54109540a2bdbf1c3a31626b731d5cfc6','      MCFT_CAP09_TWIN_V2_STAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}');
            const gate='scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_TWIN_COMPOSITION_V2_STAGE_AUTHORITY_V1.cjs';
            insertAfter(gate,'const EXPECTED_BASE="373e33c54109540a2bdbf1c3a31626b731d5cfc6";\n','const SUCCESSOR_BASE="'+CURRENT_BASE+'";\n');
            const start='eq(BASE,EXPECTED_BASE,"TWIN_V2_STAGE_EXACT_BASE_REQUIRED");';
            const end='\n\nconst v4=';
            const repl=[
              'const successor=BASE===SUCCESSOR_BASE;',
              'if(successor){',
              '  eq(git("merge-base",SUCCESSOR_BASE,"HEAD"),SUCCESSOR_BASE,"TWIN_V2_STAGE_SUCCESSOR_BASE_NOT_ANCESTOR");',
              '}else{',
              '  eq(BASE,EXPECTED_BASE,"TWIN_V2_STAGE_EXACT_BASE_REQUIRED");',
              '  eq(git("merge-base",EXPECTED_BASE,"HEAD"),EXPECTED_BASE,"TWIN_V2_STAGE_BASE_NOT_ANCESTOR");',
              '}',
              'const diffBase=successor?SUCCESSOR_BASE:EXPECTED_BASE;',
              'const changed=git("diff","--name-only",diffBase+"...HEAD").split(/\\r?\\n/).filter(Boolean).sort();',
              'if(!successor){',
              '  eq(JSON.stringify(changed),JSON.stringify(expected),"TWIN_V2_STAGE_EXACT_TWELVE_FILE_BOUNDARY_REQUIRED");',
              '}else{',
              '  if(!changed.includes("apps/server/src/runtime/twin_runtime/mcft_cap09_twin_runtime_composition_v2.ts")) fail("TWIN_V2_STAGE_SUCCESSOR_COMPOSITION_DELTA_REQUIRED");',
              '  for(const frozen of [',
              '    "apps/server/src/domain/twin_runtime/external_formal_prewindow_authority_bundle_v4.test.ts",',
              '    "apps/server/src/domain/twin_runtime/external_formal_prewindow_authority_bundle_v4.ts",',
              '    "apps/server/src/runtime/twin_runtime/external_formal_a18_crop_context_v4.test.ts",',
              '    "apps/server/src/runtime/twin_runtime/external_formal_a18_crop_context_v4.ts",',
              '    "apps/server/src/runtime/twin_runtime/external_formal_v4_amendment19_runner_v2.ts",',
              '    "apps/server/src/runtime/twin_runtime/mcft_cap09_twin_runtime_host_v1.ts",',
              '    "scripts/runtime_acceptance/COMPOSE_MCFT_CAP_09_T4R1_CURRENT_CROP_AUTHORITY_V1.cjs",',
              '    "scripts/runtime_acceptance/mcft_cap09_amendment19_formal_manifest_from_stage_authority_v2.test.ts",',
              '    "scripts/runtime_acceptance/mcft_cap09_amendment19_formal_manifest_from_stage_authority_v2.ts"',
              '  ]) eq(git("rev-parse","HEAD:"+frozen),git("rev-parse",SUCCESSOR_BASE+":"+frozen),"TWIN_V2_STAGE_SUCCESSOR_FROZEN_AUTHORITY_DRIFT:"+frozen);',
              '}'
            ].join('\n');
            segment(gate,start,end,repl);
            once(gate,'  exact_base_sha:EXPECTED_BASE,','  exact_base_sha:successor?SUCCESSOR_BASE:EXPECTED_BASE,\n  successor_requalification:successor,');
          }

          // Production routing: current composition dependency may change, direct production routing must remain frozen.
          {
            const wf='.github/workflows/mcft-cap-09-production-twin-process-v2-routing.yml';
            once(wf,'    branches:\n      - feat/mcft-cap09-twin-v2-stage-qcp-registration-v1','    branches:\n      - main\n      - feat/mcft-cap09-twin-v2-stage-qcp-registration-v1');
            insertAfter(wf,'      - apps/server/src/runtime/twin_runtime/mcft_cap09_twin_runtime_process_v2.ts\n','      - apps/server/src/runtime/twin_runtime/mcft_cap09_twin_runtime_composition_v2.ts\n');
            once(wf,'      MCFT_CAP09_PRODUCTION_TWIN_V2_ROUTING_BASE_SHA: f605f7e22ad7a4b7605be885ef1328f2b8283b55','      MCFT_CAP09_PRODUCTION_TWIN_V2_ROUTING_BASE_SHA: ${{ github.event.pull_request.base.sha }}');
            const gate='scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_PRODUCTION_TWIN_PROCESS_V2_ROUTING_V1.cjs';
            insertAfter(gate,'const EXPECTED_BASE="f605f7e22ad7a4b7605be885ef1328f2b8283b55";\n','const SUCCESSOR_BASE="'+CURRENT_BASE+'";\n');
            const start='eq(BASE,EXPECTED_BASE,"PRODUCTION_TWIN_V2_ROUTING_EXACT_BASE_REQUIRED");';
            const end='\n\nconst processV2=';
            const repl=[
              'const successor=BASE===SUCCESSOR_BASE;',
              'if(successor){',
              '  eq(git("merge-base",SUCCESSOR_BASE,"HEAD"),SUCCESSOR_BASE,"PRODUCTION_TWIN_V2_ROUTING_SUCCESSOR_BASE_NOT_ANCESTOR");',
              '}else{',
              '  eq(BASE,EXPECTED_BASE,"PRODUCTION_TWIN_V2_ROUTING_EXACT_BASE_REQUIRED");',
              '  eq(git("merge-base",EXPECTED_BASE,"HEAD"),EXPECTED_BASE,"PRODUCTION_TWIN_V2_ROUTING_BASE_NOT_ANCESTOR");',
              '}',
              'const diffBase=successor?SUCCESSOR_BASE:EXPECTED_BASE;',
              'const changed=git("diff","--name-only",diffBase+"...HEAD").split(/\\r?\\n/).filter(Boolean).sort();',
              'if(!successor){',
              '  eq(JSON.stringify(changed),JSON.stringify(expected),"PRODUCTION_TWIN_V2_ROUTING_EXACT_EIGHT_FILE_BOUNDARY_REQUIRED");',
              '}else{',
              '  if(!changed.includes("apps/server/src/runtime/twin_runtime/mcft_cap09_twin_runtime_composition_v2.ts")) fail("PRODUCTION_TWIN_V2_ROUTING_SUCCESSOR_COMPOSITION_DELTA_REQUIRED");',
              '  for(const frozen of [',
              '    ".github/workflows/mcft-cap-09-phase5-production-equivalent-containers.yml",',
              '    "apps/server/scripts/write_dist_entries.cjs",',
              '    "apps/server/src/runtime/twin_runtime/mcft_cap09_twin_runtime_process_v2.ts",',
              '    "docker-compose.mcft-cap09-production.yml",',
              '    "scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PHASE5_PROCESS_BOUNDARY_V1.ts",',
              '    "scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PRODUCTION_LOCAL_TWO_SERVICE_LAUNCHER_V1.ts",',
              '    "scripts/runtime_acceptance/MCFT_CAP_09_PRODUCTION_RUNTIME_START_ARM_V1.json"',
              '  ]) eq(git("rev-parse","HEAD:"+frozen),git("rev-parse",SUCCESSOR_BASE+":"+frozen),"PRODUCTION_TWIN_V2_ROUTING_SUCCESSOR_DIRECT_ROUTE_DRIFT:"+frozen);',
              '}'
            ].join('\n');
            segment(gate,start,end,repl);
            once(gate,'  exact_base_sha:EXPECTED_BASE,','  exact_base_sha:successor?SUCCESSOR_BASE:EXPECTED_BASE,\n  successor_requalification:successor,');
          }

          // Biological-stage graduation: preserve the already-merged authority while requalifying the changed composition dependency.
          {
            const wf='.github/workflows/mcft-cap-09-biological-stage-effectiveness-graduation-v1.yml';
            once(wf,'    branches:\n      - feat/mcft-cap09-production-twin-v2-routing-qcp-registration-v1','    branches:\n      - main\n      - feat/mcft-cap09-production-twin-v2-routing-qcp-registration-v1');
            insertAfter(wf,'      - .github/workflows/mcft-cap-09-biological-stage-effectiveness-graduation-v1.yml\n','      - apps/server/src/runtime/twin_runtime/mcft_cap09_twin_runtime_composition_v2.ts\n');
            once(wf,'      MCFT_CAP09_BIO_STAGE_EFFECT_BASE_SHA: 8d20fe6510377544422fb271c59b8b70e9501884','      MCFT_CAP09_BIO_STAGE_EFFECT_BASE_SHA: ${{ github.event.pull_request.base.sha }}');
            once(wf,'      - name: Prove current protected main cannot issue candidate effectiveness\n        shell: bash','      - name: Prove current protected main cannot issue candidate effectiveness\n        if: ${{ github.event.pull_request.base.sha != \'d67a2b3cce037c1eaad4d7d051d1f6a11eb09fc3\' }}\n        shell: bash');
            const gate='scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_BIOLOGICAL_STAGE_EFFECTIVENESS_GRADUATION_V1.cjs';
            insertAfter(gate,'const EXPECTED_BASE="8d20fe6510377544422fb271c59b8b70e9501884";\n','const SUCCESSOR_BASE="'+CURRENT_BASE+'";\n');
            const start='eq(BASE,EXPECTED_BASE,"BIO_STAGE_EFFECT_EXACT_BASE_REQUIRED");';
            const end='\n\nconst a=';
            const repl=[
              'const successor=BASE===SUCCESSOR_BASE;',
              'if(successor){',
              '  eq(git("merge-base",SUCCESSOR_BASE,"HEAD"),SUCCESSOR_BASE,"BIO_STAGE_EFFECT_SUCCESSOR_BASE_NOT_ANCESTOR");',
              '}else{',
              '  eq(BASE,EXPECTED_BASE,"BIO_STAGE_EFFECT_EXACT_BASE_REQUIRED");',
              '  eq(git("merge-base",EXPECTED_BASE,"HEAD"),EXPECTED_BASE,"BIO_STAGE_EFFECT_BASE_NOT_ANCESTOR");',
              '}',
              'const diffBase=successor?SUCCESSOR_BASE:EXPECTED_BASE;',
              'const changed=git("diff","--name-only",diffBase+"...HEAD").split(/\\r?\\n/).filter(Boolean).sort();',
              'if(!successor){',
              '  eq(JSON.stringify(changed),JSON.stringify(paths),"BIO_STAGE_EFFECT_EXACT_FIVE_FILE_BOUNDARY_REQUIRED");',
              '}else{',
              '  if(!changed.includes("apps/server/src/runtime/twin_runtime/mcft_cap09_twin_runtime_composition_v2.ts")) fail("BIO_STAGE_EFFECT_SUCCESSOR_COMPOSITION_DELTA_REQUIRED");',
              '  for(const frozen of [paths[1],paths[3],paths[4]]) eq(git("rev-parse","HEAD:"+frozen),git("rev-parse",SUCCESSOR_BASE+":"+frozen),"BIO_STAGE_EFFECT_SUCCESSOR_AUTHORITY_DRIFT:"+frozen);',
              '}'
            ].join('\n');
            segment(gate,start,end,repl);
            once(gate,'  status:"PASS",exact_base_sha:EXPECTED_BASE,subject_head_sha:git("rev-parse","HEAD"),','  status:"PASS",exact_base_sha:successor?SUCCESSOR_BASE:EXPECTED_BASE,subject_head_sha:git("rev-parse","HEAD"),\n  successor_requalification:successor,');
          }

          for(const p of [
            'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5C2B1_PHASE2_SUCCESSOR_REQUALIFICATION_V1.cjs',
            'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_TWIN_COMPOSITION_V2_STAGE_AUTHORITY_V1.cjs',
            'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_PRODUCTION_TWIN_PROCESS_V2_ROUTING_V1.cjs',
            'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_BIOLOGICAL_STAGE_EFFECTIVENESS_GRADUATION_V1.cjs'
          ]) require('node:child_process').execFileSync(process.execPath,['--check',p],{stdio:'inherit'});
          NODE

      - name: Validate patch structure
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'ROLLING_STAGE_RESOLVER_BASE = "d67a2b3cce037c1eaad4d7d051d1f6a11eb09fc3"' scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5C2B1_PHASE2_SUCCESSOR_REQUALIFICATION_V1.cjs
          grep -Fq 'const SUCCESSOR_BASE="d67a2b3cce037c1eaad4d7d051d1f6a11eb09fc3";' scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_TWIN_COMPOSITION_V2_STAGE_AUTHORITY_V1.cjs
          grep -Fq 'const SUCCESSOR_BASE="d67a2b3cce037c1eaad4d7d051d1f6a11eb09fc3";' scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_PRODUCTION_TWIN_PROCESS_V2_ROUTING_V1.cjs
          grep -Fq 'const SUCCESSOR_BASE="d67a2b3cce037c1eaad4d7d051d1f6a11eb09fc3";' scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_BIOLOGICAL_STAGE_EFFECTIVENESS_GRADUATION_V1.cjs

      - name: Create settlement commit and attempt push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/mcft-cap-09-ea5c2b1-live-kbs-soil-ingress-executor.yml \
            scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5C2B1_PHASE2_SUCCESSOR_REQUALIFICATION_V1.cjs \
            .github/workflows/mcft-cap-09-twin-composition-v2-stage-authority.yml \
            scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_TWIN_COMPOSITION_V2_STAGE_AUTHORITY_V1.cjs \
            .github/workflows/mcft-cap-09-production-twin-process-v2-routing.yml \
            scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_PRODUCTION_TWIN_PROCESS_V2_ROUTING_V1.cjs \
            .github/workflows/mcft-cap-09-biological-stage-effectiveness-graduation-v1.yml \
            scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_BIOLOGICAL_STAGE_EFFECTIVENESS_GRADUATION_V1.cjs
          git commit -m 'fix(mcft-cap09): route successor dependency requalification'
          echo "SETTLEMENT_COMMIT=$(git rev-parse HEAD)"
          echo "SETTLEMENT_PARENT=$(git rev-parse HEAD^)"
          echo "SETTLEMENT_TREE=$(git rev-parse HEAD^{tree})"
          set +e
          git push origin HEAD:feat/mcft-cap09-rolling-stage-authority-resolver-v1
          code=$?
          set -e
          echo "PUSH_EXIT_CODE=$code"
          exit "$code"

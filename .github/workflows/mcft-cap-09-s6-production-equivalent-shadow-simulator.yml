name: mcft-cap-09-s6-production-equivalent-shadow-simulator

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-s6-production-equivalent-shadow-simulator.yml'
      - 'apps/server/src/runtime/twin_runtime/postgres_evidence_ingress_adapter_v1.ts'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_S6_PRODUCTION_EQUIVALENT_SIMULATOR.ts'
      - 'scripts/runtime_acceptance/RUN_MCFT_CAP_09_S6_PRODUCTION_EQUIVALENT_SIMULATION.ts'
      - 'scripts/runtime_acceptance/mcft_cap09_s6_production_equivalent_simulator_v1.ts'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-SIM-S6-*'
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Isolated simulation operation
        required: true
        type: choice
        options:
          - preflight
          - bootstrap
          - accelerated
          - hourly

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: mcft-cap09-s6-sim-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || vars.GEOX_MCFT_CAP09_S6_SIMULATION_SUBJECT_SHA || github.sha }}-${{ inputs.operation || github.event_name }}
  cancel-in-progress: false

jobs:
  qualify-simulator:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Validate exact simulation qualification boundary
        env:
          MCFT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_S6_PRODUCTION_EQUIVALENT_SIMULATOR.cjs
      - name: Prove deterministic model and permanent simulation markings
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_S6_PRODUCTION_EQUIVALENT_SIMULATOR.ts
      - name: Transpile simulator control plane
        run: |
          node <<'NODE'
          const fs=require('node:fs'),ts=require('typescript');
          const files=[
            'apps/server/src/runtime/twin_runtime/postgres_evidence_ingress_adapter_v1.ts',
            'scripts/runtime_acceptance/mcft_cap09_s6_production_equivalent_simulator_v1.ts',
            'scripts/runtime_acceptance/RUN_MCFT_CAP_09_S6_PRODUCTION_EQUIVALENT_SIMULATION.ts',
            'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_S6_PRODUCTION_EQUIVALENT_SIMULATOR.ts',
          ];
          for(const file of files){const result=ts.transpileModule(fs.readFileSync(file,'utf8'),{fileName:file,reportDiagnostics:true,compilerOptions:{target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.ESNext,moduleResolution:ts.ModuleResolutionKind.Bundler,esModuleInterop:true}});const errors=(result.diagnostics||[]).filter((d)=>d.category===ts.DiagnosticCategory.Error);if(errors.length){for(const error of errors)console.error(ts.flattenDiagnosticMessageText(error.messageText,'\n'));throw new Error('S6_SIM_PROGRAM_TRANSPILE_FAILED:'+file)}}
          console.log(JSON.stringify({status:'PASS',files},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap-09-s6-simulator-qualification-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_S6_PRODUCTION_EQUIVALENT_SIMULATOR_ACCEPTANCE.json
            acceptance-output/MCFT_CAP_09_S6_PRODUCTION_EQUIVALENT_SIMULATOR_GOVERNANCE.json
          if-no-files-found: error
          retention-days: 90

  run-isolated-simulation:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation != 'hourly'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.GEOX_MCFT_CAP09_S6_SIMULATION_SUBJECT_SHA }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
      - run: pnpm install --no-frozen-lockfile
      - name: Run explicit isolated simulation operation
        env:
          DATABASE_URL: ${{ secrets.GEOX_MCFT_CAP09_S6_SIMULATION_DATABASE_URL }}
          MCFT_CAP09_S6_SUBJECT_SHA: ${{ vars.GEOX_MCFT_CAP09_S6_SIMULATION_SUBJECT_SHA }}
          MCFT_CAP09_S6_WINDOW_START_UTC: ${{ vars.GEOX_MCFT_CAP09_S6_SIMULATION_WINDOW_START_UTC }}
          MCFT_CAP09_S6_SCOPE_JSON: ${{ vars.GEOX_MCFT_CAP09_S6_SCOPE_JSON }}
          MCFT_CAP09_S6_SIMULATION_RUN_ID: ${{ vars.GEOX_MCFT_CAP09_S6_SIMULATION_RUN_ID }}
          MCFT_CAP09_S6_SIMULATION_SEED: ${{ vars.GEOX_MCFT_CAP09_S6_SIMULATION_SEED }}
          MCFT_CAP09_S6_SIMULATION_DATABASE_NAME: ${{ vars.GEOX_MCFT_CAP09_S6_SIMULATION_DATABASE_NAME }}
          MCFT_CAP09_S6_SIMULATION_ENVIRONMENT_ID: ${{ vars.GEOX_MCFT_CAP09_S6_SIMULATION_ENVIRONMENT_ID }}
          MCFT_CAP09_S6_SIMULATION_NEON_PROJECT_ID: ${{ vars.GEOX_MCFT_CAP09_S6_SIMULATION_NEON_PROJECT_ID }}
          MCFT_CAP09_S6_SIMULATION_NEON_BRANCH_ID: ${{ vars.GEOX_MCFT_CAP09_S6_SIMULATION_NEON_BRANCH_ID }}
          MCFT_CAP09_S6_SIMULATION_ONLY: '1'
          MCFT_CAP09_S6_SIMULATION_OPERATION: ${{ inputs.operation }}
        run: pnpm exec tsx scripts/runtime_acceptance/RUN_MCFT_CAP_09_S6_PRODUCTION_EQUIVALENT_SIMULATION.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap-09-s6-simulation-${{ inputs.operation }}-${{ github.run_id }}
          path: acceptance-output/MCFT_CAP_09_S6_PRODUCTION_EQUIVALENT_SIMULATION_RESULT.json
          if-no-files-found: error
          retention-days: 90

  wall-clock-hourly-simulation:
    if: ((github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'hourly')) && github.ref == 'refs/heads/main' && vars.GEOX_MCFT_CAP09_S6_SIMULATION_WINDOW_ENABLED == 'true' && vars.GEOX_MCFT_CAP09_S6_FORMAL_WINDOW_ENABLED != 'true' && vars.GEOX_MCFT_CAP09_S6_FORMAL_WINDOW_V2_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.GEOX_MCFT_CAP09_S6_SIMULATION_SUBJECT_SHA }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
      - run: pnpm install --no-frozen-lockfile
      - name: Emit one simulated physical hour and execute one production Runtime slot
        env:
          DATABASE_URL: ${{ secrets.GEOX_MCFT_CAP09_S6_SIMULATION_DATABASE_URL }}
          MCFT_CAP09_S6_SUBJECT_SHA: ${{ vars.GEOX_MCFT_CAP09_S6_SIMULATION_SUBJECT_SHA }}
          MCFT_CAP09_S6_WINDOW_START_UTC: ${{ vars.GEOX_MCFT_CAP09_S6_SIMULATION_WINDOW_START_UTC }}
          MCFT_CAP09_S6_SIMULATION_WALL_CLOCK_START_UTC: ${{ vars.GEOX_MCFT_CAP09_S6_SIMULATION_WALL_CLOCK_START_UTC }}
          MCFT_CAP09_S6_SCOPE_JSON: ${{ vars.GEOX_MCFT_CAP09_S6_SCOPE_JSON }}
          MCFT_CAP09_S6_SIMULATION_RUN_ID: ${{ vars.GEOX_MCFT_CAP09_S6_SIMULATION_RUN_ID }}
          MCFT_CAP09_S6_SIMULATION_SEED: ${{ vars.GEOX_MCFT_CAP09_S6_SIMULATION_SEED }}
          MCFT_CAP09_S6_SIMULATION_DATABASE_NAME: ${{ vars.GEOX_MCFT_CAP09_S6_SIMULATION_DATABASE_NAME }}
          MCFT_CAP09_S6_SIMULATION_ENVIRONMENT_ID: ${{ vars.GEOX_MCFT_CAP09_S6_SIMULATION_ENVIRONMENT_ID }}
          MCFT_CAP09_S6_SIMULATION_NEON_PROJECT_ID: ${{ vars.GEOX_MCFT_CAP09_S6_SIMULATION_NEON_PROJECT_ID }}
          MCFT_CAP09_S6_SIMULATION_NEON_BRANCH_ID: ${{ vars.GEOX_MCFT_CAP09_S6_SIMULATION_NEON_BRANCH_ID }}
          MCFT_CAP09_S6_SIMULATION_ONLY: '1'
          MCFT_CAP09_S6_SIMULATION_OPERATION: hourly
        run: pnpm exec tsx scripts/runtime_acceptance/RUN_MCFT_CAP_09_S6_PRODUCTION_EQUIVALENT_SIMULATION.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap-09-s6-simulation-hourly-${{ vars.GEOX_MCFT_CAP09_S6_SIMULATION_SUBJECT_SHA }}-${{ github.run_id }}
          path: acceptance-output/MCFT_CAP_09_S6_PRODUCTION_EQUIVALENT_SIMULATION_RESULT.json
          if-no-files-found: error
          retention-days: 90

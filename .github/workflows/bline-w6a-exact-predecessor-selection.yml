name: bline-w6a-exact-predecessor-selection

on:
  push:
    branches:
      - 'feat/bline-w6a-exact-predecessor-selection-v1'
  pull_request:
    paths:
      - 'docs/architecture/semantic_convergence/GEOX-BLINE-W6A-EXACT-PREDECESSOR-SELECTION-V1.json'
      - 'apps/server/src/domain/planner/compiler_v1.ts'
      - 'apps/server/src/domain/crop/crop_context_v1.ts'
      - 'apps/server/src/routes/programs_core_v1.ts'
      - 'apps/server/src/routes/field_crop_context_hooks_v1.ts'
      - 'scripts/governance_acceptance/ACCEPTANCE_BLINE_W6A_EXACT_PREDECESSOR_SELECTION_V1.cjs'
      - 'scripts/runtime_acceptance/ACCEPTANCE_BLINE_W6A_EXACT_PREDECESSOR_SELECTION_V1.ts'
      - 'scripts/runtime_acceptance/ACCEPTANCE_BLINE_W6A_COMMERCIAL_EXACT_PREDECESSOR_SELECTION_V1.ts'
      - '.github/workflows/bline-w6a-exact-predecessor-selection.yml'

jobs:
  bounded-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: Build focused server dependencies
        run: pnpm --filter @geox/device-skills... build
      - name: W6-A exact frozen two-blocker inventory and source/caller boundary
        run: node scripts/governance_acceptance/ACCEPTANCE_BLINE_W6A_EXACT_PREDECESSOR_SELECTION_V1.cjs
      - name: W6-A focused exact/ambiguous predecessor proof
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_BLINE_W6A_EXACT_PREDECESSOR_SELECTION_V1.ts
      - name: W1 closed-domain successor preservation
        run: node scripts/governance_acceptance/ACCEPTANCE_BLINE_W1_IDENTITY_FOUNDATION_V1.cjs
      - name: W2 closed-domain successor preservation
        run: node scripts/governance_acceptance/ACCEPTANCE_BLINE_W2_CALLER_READ_WRITE_BOUNDARY_V1.cjs
      - name: W3 closed-domain successor preservation
        run: node scripts/governance_acceptance/ACCEPTANCE_BLINE_W3_DECISION_APPROVAL_AUTHORITY_V1.cjs
      - name: W4 closed-domain successor preservation
        run: node scripts/governance_acceptance/ACCEPTANCE_BLINE_W4_EXECUTION_DEVICE_RECEIPT_PROVENANCE_V1.cjs
      - name: Frozen PR-SEC-1 caller inventory regression
        run: pnpm run ci:governance:bline-production-caller-authority-inventory
      - name: B-Line residual authority audit
        run: pnpm run ci:governance:bline-residual-authority-audit
      - name: B-Line active runtime surface closure
        run: pnpm run ci:governance:bline-active-runtime-surface-closure
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Build
        run: pnpm -r build

  commercial-affected-flow-proof:
    runs-on: ubuntu-latest
    needs: bounded-closure
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: Prepare W6-A Commercial runtime
        run: |
          set -euo pipefail
          TOKENS_JSON="$(node -e "const f=require('./config/auth/security_acceptance_tokens.json'); process.stdout.write(JSON.stringify(f))")"
          cat > .env.w6a <<EOF
          GEOX_RUNTIME_ENV=pilot
          GEOX_TOKENS_JSON='$TOKENS_JSON'
          POSTGRES_USER=landos
          POSTGRES_PASSWORD=w6a-postgres-strong-2026
          POSTGRES_DB=landos
          GEOX_MCFT_MIGRATOR_PASSWORD=w6a-mcft-migrator-strong-2026
          GEOX_RUNTIME_DATABASE_PASSWORD=w6a-runtime-database-strong-2026
          GEOX_DEPLOYMENT_SUBJECT_COMMIT=${GITHUB_SHA}
          GEOX_AO_ACT_TOKEN=tenant_a_admin_token
          GEOX_EXECUTOR_TOKEN=executor_token
          GEOX_EXECUTOR_ID=tok_executor_actor
          GEOX_EXECUTOR_ACTOR_ID=tok_executor_actor
          GEOX_INTERNAL_TASK_ISSUER_TOKEN=tenant_a_admin_token
          GEOX_EVIDENCE_S3_BUCKET=evidence-exports-v1
          MINIO_ROOT_USER=geoxminio
          MINIO_ROOT_PASSWORD=w6a-minio-strong-2026
          MQTT_USERNAME=geoxmqtt
          MQTT_PASSWORD=w6a-mqtt-strong-2026
          CORS_ORIGINS=https://w6a.geox.invalid
          APP_SECRET=w6a-app-secret-strong-2026
          PUBLIC_BASE_URL=https://w6a.geox.invalid
          GEOX_EXECUTION_DEFAULT_DISABLED=1
          GEOX_EXECUTION_ENABLE_EXPLICITLY=0
          GEOX_EXECUTION_ENABLE_REASON=w6a-exact-predecessor-selection
          GEOX_DEVTOOLS_ENABLED=0
          EOF
      - name: Start Commercial runtime
        timeout-minutes: 10
        run: |
          set -euo pipefail
          timeout 180 docker compose --env-file .env.w6a -f docker-compose.commercial_v1.yml up -d minio minio-init
          timeout 420 docker compose --env-file .env.w6a -f docker-compose.commercial_v1.yml up -d postgres mqtt server
      - name: Wait for Commercial server
        run: |
          set -euo pipefail
          if ! timeout 180 bash -lc 'until curl -fsS http://127.0.0.1:3001/api/health >/dev/null; do sleep 2; done'; then
            docker compose --env-file .env.w6a -f docker-compose.commercial_v1.yml ps || true
            docker compose --env-file .env.w6a -f docker-compose.commercial_v1.yml logs server || true
            exit 1
          fi
      - name: W6-A real Commercial affected-flow proof
        env:
          BASE_URL: http://127.0.0.1:3001
          ADMIN_TOKEN: tenant_a_admin_token
          DATABASE_URL: postgres://geox_runtime_v1:w6a-runtime-database-strong-2026@127.0.0.1:5433/landos
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_BLINE_W6A_COMMERCIAL_EXACT_PREDECESSOR_SELECTION_V1.ts
      - name: Runtime hygiene
        if: always()
        run: |
          SERVER_LOG=/tmp/bline-w6a-server.log
          docker compose --env-file .env.w6a -f docker-compose.commercial_v1.yml logs server > "$SERVER_LOG" 2>&1 || true
          ! grep -E 'FST_ERR_REP_ALREADY_SENT|ERR_HTTP_HEADERS_SENT|Reply was already sent|reply already sent' "$SERVER_LOG"
      - name: Stop Commercial runtime
        if: always()
        run: docker compose --env-file .env.w6a -f docker-compose.commercial_v1.yml down -v --remove-orphans || true

name: mcft-cap09-temp-govern-current-crop-continuity-20260906

on:
  push:
    branches:
      - feat/mcft-cap09-current-crop-continuity-refresh-2026-09-06t04z-v1
    paths:
      - .github/workflows/mcft-cap09-temp-govern-current-crop-continuity-20260906.yml

permissions:
  contents: write

jobs:
  govern:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/mcft-cap09-current-crop-continuity-refresh-2026-09-06t04z-v1
          fetch-depth: 0

      - name: Materialize exact ca2a rolling-refresh governance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a74c3192fe4a179c98f3db4a5316dfeabd656f79"
          node <<'NODE'
          const fs = require('node:fs');
          const predecessor = 'ca2a96d131bc1d3b2935e7b7460752bdbf79f9bd';
          const previous = 'f41dde8d44de95e71748e756e048e0166c1916b7';
          const request05 = 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-T4R1-CURRENT-CROP-REFRESH-REQUEST-2026-09-05T04Z-V1.json';
          const authority05 = 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-T4R1-EFFECTIVE-CURRENT-CROP-AUTHORITY-2026-09-05T04Z-V1.json';
          const acceptance05 = 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_T4R1_CURRENT_CROP_REFRESH_2026_09_05T04Z_V1.cjs';
          const request06 = 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-T4R1-CURRENT-CROP-REFRESH-REQUEST-2026-09-06T04Z-V1.json';
          const authority06 = 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-T4R1-EFFECTIVE-CURRENT-CROP-AUTHORITY-2026-09-06T04Z-V1.json';
          const acceptance06 = 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_T4R1_CURRENT_CROP_REFRESH_2026_09_06T04Z_V1.cjs';
          const effectiveness = 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-BIOLOGICAL-STAGE-ARCHITECTURE-EFFECTIVENESS-V1.json';

          const authorityPath = 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-CONTROL-PLANE-V1.json';
          const control = JSON.parse(fs.readFileSync(authorityPath, 'utf8'));
          const governed = control.governed_successor_predecessor_shas;
          if (!Array.isArray(governed) || governed.at(-1) !== previous || governed.includes(predecessor)) throw new Error('QCP_PREDECESSOR_BOUNDARY_DRIFT');
          governed.push(predecessor);
          const rollingResolver = control.dependency_resolvers?.T4R1_CURRENT_CROP_ROLLING_REFRESH;
          if (!rollingResolver || !Array.isArray(rollingResolver.paths)) throw new Error('ROLLING_RESOLVER_MISSING');
          const currentTail = rollingResolver.paths.slice(-3);
          if (JSON.stringify(currentTail) !== JSON.stringify([request05, authority05, acceptance05])) throw new Error(`ROLLING_RESOLVER_TAIL_DRIFT:${JSON.stringify(currentTail)}`);
          for (const p of [request06, authority06, acceptance06]) {
            if (rollingResolver.paths.includes(p)) throw new Error(`ROLLING_RESOLVER_DUPLICATE:${p}`);
            rollingResolver.paths.push(p);
          }
          const rollingCheck = (control.checks || []).find((row) => row.check_id === 'T4R1_CURRENT_CROP_ROLLING_REFRESH');
          if (!rollingCheck) throw new Error('ROLLING_CHECK_MISSING');
          if (JSON.stringify(rollingCheck.authority_refs) !== JSON.stringify([request05, authority05, effectiveness])) throw new Error(`ROLLING_CHECK_AUTHORITY_DRIFT:${JSON.stringify(rollingCheck.authority_refs)}`);
          if (rollingCheck.diagnostic_command !== `node ${acceptance05}`) throw new Error(`ROLLING_CHECK_DIAGNOSTIC_DRIFT:${rollingCheck.diagnostic_command}`);
          rollingCheck.authority_refs = [request06, authority06, effectiveness];
          rollingCheck.diagnostic_command = `node ${acceptance06}`;
          fs.writeFileSync(authorityPath, JSON.stringify(control, null, 2) + '\n');

          const registryPath = 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-EVIDENCE-REGISTRY-V1.json';
          const registry = JSON.parse(fs.readFileSync(registryPath, 'utf8'));
          const registryGoverned = registry.requalification_evidence?.durable_anchors?.rules?.governed_successor_predecessors;
          if (!Array.isArray(registryGoverned) || registryGoverned.at(-1) !== previous || registryGoverned.includes(predecessor)) throw new Error('REGISTRY_PREDECESSOR_BOUNDARY_DRIFT');
          registryGoverned.push(predecessor);
          fs.writeFileSync(registryPath, JSON.stringify(registry, null, 2) + '\n');

          const replaceOnce = (text, oldValue, newValue, code) => {
            if ((text.split(oldValue).length - 1) !== 1) throw new Error(code);
            return text.replace(oldValue, newValue);
          };

          const qcpPath = '.github/workflows/mcft-cap-09-qualification-control-plane-v1.yml';
          let qcp = fs.readFileSync(qcpPath, 'utf8');
          const qcpEnv = "  CURRENT_PROTECTED_MAIN_REFRESH_PREDECESSOR_SHA: 'f41dde8d44de95e71748e756e048e0166c1916b7'\n";
          qcp = replaceOnce(qcp, qcpEnv, qcpEnv + "  CURRENT_CROP_CONTINUITY_REFRESH_MERGE_PREDECESSOR_SHA: 'ca2a96d131bc1d3b2935e7b7460752bdbf79f9bd'\n", 'QCP_ENV_BOUNDARY_DRIFT');
          const qcpGuard = '&& [ "$base" != "$CURRENT_PROTECTED_MAIN_REFRESH_PREDECESSOR_SHA" ]; then';
          qcp = replaceOnce(qcp, qcpGuard, '&& [ "$base" != "$CURRENT_PROTECTED_MAIN_REFRESH_PREDECESSOR_SHA" ] && [ "$base" != "$CURRENT_CROP_CONTINUITY_REFRESH_MERGE_PREDECESSOR_SHA" ]; then', 'QCP_GUARD_BOUNDARY_DRIFT');
          const qcpExpected = 'process.env.OWNER_CUTOVER_REGISTRY_SELECTION_PROTECTED_MAIN_PREDECESSOR_SHA, process.env.CURRENT_PROTECTED_MAIN_REFRESH_PREDECESSOR_SHA];';
          qcp = replaceOnce(qcp, qcpExpected, 'process.env.OWNER_CUTOVER_REGISTRY_SELECTION_PROTECTED_MAIN_PREDECESSOR_SHA, process.env.CURRENT_PROTECTED_MAIN_REFRESH_PREDECESSOR_SHA, process.env.CURRENT_CROP_CONTINUITY_REFRESH_MERGE_PREDECESSOR_SHA];', 'QCP_EXPECTED_PREDECESSOR_BOUNDARY_DRIFT');
          fs.writeFileSync(qcpPath, qcp);

          const postPath = '.github/workflows/mcft-cap-09-post-merge-v13-control-plane-v1.yml';
          let post = fs.readFileSync(postPath, 'utf8');
          const postEnv = "  CURRENT_PROTECTED_MAIN_REFRESH_PREDECESSOR_SHA: 'f41dde8d44de95e71748e756e048e0166c1916b7'\n";
          post = replaceOnce(post, postEnv, postEnv + "  CURRENT_CROP_CONTINUITY_REFRESH_MERGE_PREDECESSOR_SHA: 'ca2a96d131bc1d3b2935e7b7460752bdbf79f9bd'\n", 'POST_ENV_BOUNDARY_DRIFT');
          const postGuard = '&& [ "$base_sha" != "$CURRENT_PROTECTED_MAIN_REFRESH_PREDECESSOR_SHA" ]; then';
          post = replaceOnce(post, postGuard, '&& [ "$base_sha" != "$CURRENT_PROTECTED_MAIN_REFRESH_PREDECESSOR_SHA" ] && [ "$base_sha" != "$CURRENT_CROP_CONTINUITY_REFRESH_MERGE_PREDECESSOR_SHA" ]; then', 'POST_GUARD_BOUNDARY_DRIFT');
          fs.writeFileSync(postPath, post);

          const preflightPath = 'scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_ALL_BLOCKERS_V1.cjs';
          let preflight = fs.readFileSync(preflightPath, 'utf8');
          const preflightDecl = '    const currentProtectedMainRefreshPredecessorBase = String(process.env.CURRENT_PROTECTED_MAIN_REFRESH_PREDECESSOR_SHA || "");\n';
          preflight = replaceOnce(preflight, preflightDecl, preflightDecl + '    const currentCropContinuityRefreshMergeBase = String(process.env.CURRENT_CROP_CONTINUITY_REFRESH_MERGE_PREDECESSOR_SHA || "");\n', 'PREFLIGHT_DECL_BOUNDARY_DRIFT');
          const preflightCond = '        (/^[0-9a-f]{40}$/.test(currentProtectedMainRefreshPredecessorBase) && args.base === currentProtectedMainRefreshPredecessorBase)\n';
          preflight = replaceOnce(preflight, preflightCond, '        (/^[0-9a-f]{40}$/.test(currentProtectedMainRefreshPredecessorBase) && args.base === currentProtectedMainRefreshPredecessorBase) ||\n        (/^[0-9a-f]{40}$/.test(currentCropContinuityRefreshMergeBase) && args.base === currentCropContinuityRefreshMergeBase)\n', 'PREFLIGHT_CONDITION_BOUNDARY_DRIFT');
          fs.writeFileSync(preflightPath, preflight);

          const resolverAcceptancePath = 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_TWIN_V2_ROLLING_STAGE_AUTHORITY_RESOLVER_SEAM_V1.cjs';
          let resolverAcceptance = fs.readFileSync(resolverAcceptancePath, 'utf8');
          const baseConst = 'const QCP_CURRENT_PROTECTED_MAIN_BASE = "f41dde8d44de95e71748e756e048e0166c1916b7";\n';
          resolverAcceptance = replaceOnce(resolverAcceptance, baseConst, baseConst + 'const QCP_CURRENT_CROP_CONTINUITY_REFRESH_MERGE_BASE = "ca2a96d131bc1d3b2935e7b7460752bdbf79f9bd";\n', 'RESOLVER_CONST_BOUNDARY_DRIFT');
          const oldFallback = `const currentHeadSha = git(["rev-parse", "HEAD"]);
const explicitCurrentDeltaBaseSha = String(process.env.GEOX_MCFT_CAP09_CURRENT_DELTA_BASE_SHA || "");
const qcpCurrentDeltaBaseSha = String(process.env.CURRENT_PROTECTED_MAIN_REFRESH_PREDECESSOR_SHA || "");
const qcpFallbackAuthorized =
  !explicitCurrentDeltaBaseSha &&
  qcpCurrentDeltaBaseSha === QCP_CURRENT_PROTECTED_MAIN_BASE;
const currentDeltaBaseSha = explicitCurrentDeltaBaseSha || (qcpFallbackAuthorized ? qcpCurrentDeltaBaseSha : "");
const currentDeltaBaseSource = explicitCurrentDeltaBaseSha
  ? "PULL_REQUEST_BASE_SHA"
  : qcpFallbackAuthorized
    ? "QCP_EXACT_CURRENT_PROTECTED_MAIN_PREDECESSOR_SHA"
    : "UNSET";
`;
          const newFallback = `const currentHeadSha = git(["rev-parse", "HEAD"]);
const explicitCurrentDeltaBaseSha = String(process.env.GEOX_MCFT_CAP09_CURRENT_DELTA_BASE_SHA || "");
const qcpCurrentDeltaBaseSha = String(process.env.CURRENT_PROTECTED_MAIN_REFRESH_PREDECESSOR_SHA || "");
const qcpCurrentCropContinuityRefreshMergeBaseSha = String(process.env.CURRENT_CROP_CONTINUITY_REFRESH_MERGE_PREDECESSOR_SHA || "");
const qcpCurrentCropContinuityFallbackAuthorized =
  !explicitCurrentDeltaBaseSha &&
  qcpCurrentCropContinuityRefreshMergeBaseSha === QCP_CURRENT_CROP_CONTINUITY_REFRESH_MERGE_BASE;
const qcpCurrentProtectedMainFallbackAuthorized =
  !explicitCurrentDeltaBaseSha &&
  !qcpCurrentCropContinuityFallbackAuthorized &&
  qcpCurrentDeltaBaseSha === QCP_CURRENT_PROTECTED_MAIN_BASE;
const currentDeltaBaseSha = explicitCurrentDeltaBaseSha ||
  (qcpCurrentCropContinuityFallbackAuthorized
    ? qcpCurrentCropContinuityRefreshMergeBaseSha
    : qcpCurrentProtectedMainFallbackAuthorized
      ? qcpCurrentDeltaBaseSha
      : "");
const currentDeltaBaseSource = explicitCurrentDeltaBaseSha
  ? "PULL_REQUEST_BASE_SHA"
  : qcpCurrentCropContinuityFallbackAuthorized
    ? "QCP_EXACT_CURRENT_CROP_CONTINUITY_REFRESH_MERGE_PREDECESSOR_SHA"
    : qcpCurrentProtectedMainFallbackAuthorized
      ? "QCP_EXACT_CURRENT_PROTECTED_MAIN_PREDECESSOR_SHA"
      : "UNSET";
`;
          resolverAcceptance = replaceOnce(resolverAcceptance, oldFallback, newFallback, 'RESOLVER_FALLBACK_BOUNDARY_DRIFT');
          fs.writeFileSync(resolverAcceptancePath, resolverAcceptance);
          NODE

          node --check scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_ALL_BLOCKERS_V1.cjs
          node --check scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_TWIN_V2_ROLLING_STAGE_AUTHORITY_RESOLVER_SEAM_V1.cjs
          node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_CHECK_APPLICABILITY_V1.cjs
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 6
          test "${changed[0]}" = ".github/workflows/mcft-cap-09-post-merge-v13-control-plane-v1.yml"
          test "${changed[1]}" = ".github/workflows/mcft-cap-09-qualification-control-plane-v1.yml"
          test "${changed[2]}" = "docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-CONTROL-PLANE-V1.json"
          test "${changed[3]}" = "docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-EVIDENCE-REGISTRY-V1.json"
          test "${changed[4]}" = "scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_TWIN_V2_ROLLING_STAGE_AUTHORITY_RESOLVER_SEAM_V1.cjs"
          test "${changed[5]}" = "scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_ALL_BLOCKERS_V1.cjs"

      - name: Commit exact governance settlement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/mcft-cap-09-post-merge-v13-control-plane-v1.yml \
            .github/workflows/mcft-cap-09-qualification-control-plane-v1.yml \
            docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-CONTROL-PLANE-V1.json \
            docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-EVIDENCE-REGISTRY-V1.json \
            scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_TWIN_V2_ROLLING_STAGE_AUTHORITY_RESOLVER_SEAM_V1.cjs \
            scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_ALL_BLOCKERS_V1.cjs
          git commit -m "fix(mcft-cap09): govern ca2a current-crop continuity refresh"
          git push origin HEAD:feat/mcft-cap09-current-crop-continuity-refresh-2026-09-06t04z-v1

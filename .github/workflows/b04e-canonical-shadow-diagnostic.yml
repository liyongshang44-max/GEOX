name: b04e-canonical-shadow-diagnostic

on:
  push:
    branches:
      - ci/bline-b04e-canonical-shadow-diagnostic-2026-08-27

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: geox
          POSTGRES_PASSWORD: geox
          POSTGRES_DB: geox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geox -d geox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://geox:geox@127.0.0.1:5432/geox
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: |
          pnpm --filter @geox/contracts build
          pnpm --filter @geox/device-skills build
          pnpm --filter @geox/skill-registry build
      - name: Print canonical qualification diagnostics
        shell: bash
        run: |
          cat > .b04e_diag.ts <<'TS'
          import fs from "node:fs";
          import { Pool } from "pg";
          import { appendRawSampleV1 } from "./apps/server/src/domain/sensing/raw_sample_fact_envelope_v1.ts";
          import { buildCanonicalRawSampleEvidenceQualificationProjectionV1 } from "./apps/server/src/domain/sensing/appleii_evidence_sufficiency_v1.ts";
          import { evaluateEvidenceJudgeV2WithCanonicalShadow } from "./apps/server/src/domain/judge/evidence_judge_v2.ts";

          async function main() {
            const pool = new Pool({ connectionString: process.env.DATABASE_URL });
            try {
              await pool.query(fs.readFileSync("docker/postgres/init/001_schema.sql", "utf8"));
              await pool.query(fs.readFileSync("apps/server/db/migrations/2026_04_16_bootstrap_alignment.sql", "utf8"));
              await pool.query(fs.readFileSync("apps/server/db/migrations/2026_05_15_fact_envelope_v1.sql", "utf8"));

              const baseNow = Date.now();
              for (let i = 0; i < 3; i += 1) {
                const item = await appendRawSampleV1(
                  pool,
                  {
                    sample_id: "rs_b04e_diag_" + i,
                    sensor_id: "dev_b04e_diag",
                    field_id: "fieldA",
                    ts_ms: baseNow - (45 - i * 15) * 60_000,
                    metric: "soil_moisture",
                    value: 0.22 + i * 0.01,
                    unit: "m3/m3",
                    qc_quality: "ok",
                    source: "device",
                    payload: {},
                  },
                  { tenant_id: "tenantA", project_id: "projectA", group_id: "groupA" },
                );
                console.log("APPEND", JSON.stringify({
                  sample_id:item.sample_id,
                  payload_json:item.payload_json,
                  fact_id:item.fact_id
                }));
              }

              const nowMs = Date.now() + 1000;
              const projection = await buildCanonicalRawSampleEvidenceQualificationProjectionV1(pool, {
                tenant_id:"tenantA",
                project_id:"projectA",
                group_id:"groupA",
                field_id:"fieldA",
                device_id:"dev_b04e_diag",
                now_ms:nowMs,
              });
              console.log("PROJECTION_COUNTS", JSON.stringify(projection.counts));
              console.log("PROJECTION_LIMITATIONS", JSON.stringify(projection.limitations));
              for (const q of projection.qualifications) {
                console.log("QUAL", JSON.stringify({
                  source_ref:q.source_ref,
                  metric:q.metric,
                  physical_validity:q.physical_validity,
                  temporal_eligibility:q.temporal_eligibility,
                  source_authority:q.source_authority,
                  spatial_authority:q.spatial_authority,
                  conflict_state:q.conflict_state,
                  evidence_authority:q.evidence_authority,
                  role_eligibility:q.role_eligibility,
                  limitations:q.limitations,
                  reason_codes:q.reason_codes,
                }));
              }

              const result = await evaluateEvidenceJudgeV2WithCanonicalShadow(pool, {
                tenant_id:"tenantA",
                project_id:"projectA",
                group_id:"groupA",
                field_id:"fieldA",
                device_id:"dev_b04e_diag",
                soil_moisture:2.0,
                observed_at_ts_ms:nowMs-60000,
                now_ts_ms:nowMs,
                last_heartbeat_ts_ms:nowMs-60000,
              });
              console.log("JUDGE_SHADOW", JSON.stringify(result.outputs?.canonical_evidence_sufficiency_shadow_v1));
            } finally {
              await pool.end();
            }
          }
          main().catch((e)=>{ console.error(e); process.exit(1); });
          TS
          pnpm -w exec tsx .b04e_diag.ts
      - run: echo "B04E_DIAGNOSTIC_HEAD 7b11d8830c643698e4f45cc2ba909bb7ba7fccc0"

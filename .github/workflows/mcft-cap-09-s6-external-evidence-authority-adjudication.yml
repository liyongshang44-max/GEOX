name: mcft-cap-09-s6-external-evidence-authority-adjudication

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-s6-external-evidence-authority-adjudication.yml'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-TASK.md'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-AMENDMENT-01-EXTERNAL-PUBLIC-EVIDENCE-AUTHORITY.md'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S6-EXTERNAL-EVIDENCE-AUTHORITY-STATUS-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_S6_EXTERNAL_EVIDENCE_AUTHORITY_ADJUDICATION.cjs'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: mcft-cap09-s6-external-evidence-authority-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  adjudication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate S6-only external Evidence authority adjudication
        env:
          MCFT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_S6_EXTERNAL_EVIDENCE_AUTHORITY_ADJUDICATION.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap-09-s6-external-evidence-authority-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: acceptance-output/MCFT_CAP_09_S6_EXTERNAL_EVIDENCE_AUTHORITY_ADJUDICATION_RESULT.json
          if-no-files-found: error
          retention-days: 90

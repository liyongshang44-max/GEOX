name: bline-w2-caller-read-write-boundary

on:
  push:
    branches:
      - 'feat/bline-w2-caller-read-write-boundary-v1'
  pull_request:
    paths:
      - 'docs/architecture/semantic_convergence/GEOX-BLINE-W2-CALLER-READ-WRITE-BOUNDARY-V1.json'
      - 'apps/server/src/routes/decision_engine_v1.ts'
      - 'apps/server/src/routes/weather_v1.ts'
      - 'apps/server/src/routes/reports_v1.ts'
      - 'apps/server/src/routes/dashboard_v1.ts'
      - 'apps/server/src/routes/fields_v1.ts'
      - 'apps/server/src/routes/control_ao_act.ts'
      - 'apps/server/src/routes/skills_rules_v1.ts'
      - 'apps/server/src/projections/weather_forecast_v1.ts'
      - 'apps/server/src/projections/field_sensing_overview_v1.ts'
      - 'apps/server/src/projections/field_sensing_summary_stage1_v1.ts'
      - 'apps/server/src/projections/field_fertility_state_v1.ts'
      - 'apps/server/src/projections/manual_execution_quality_v1.ts'
      - 'apps/server/src/projections/skill_registry_read_v1.ts'
      - 'apps/server/src/services/field_read_model_refresh_v1.ts'
      - 'apps/server/src/services/skills/runtime_v1.ts'
      - 'apps/server/src/services/skills/skill_runtime_service.ts'
      - 'apps/server/src/services/skills/skill_registry_service.ts'
      - 'apps/server/src/services/skills/skill_binding_service.ts'
      - 'apps/server/src/domain/controlplane/task_service.ts'
      - 'scripts/governance_acceptance/ACCEPTANCE_BLINE_W2_CALLER_READ_WRITE_BOUNDARY_V1.cjs'
      - 'scripts/runtime_acceptance/ACCEPTANCE_BLINE_W2_CALLER_READ_WRITE_BOUNDARY_V1.ts'
      - 'scripts/runtime_acceptance/ACCEPTANCE_BLINE_W2_COMMERCIAL_READ_ONLY_V1.ts'
      - '.github/workflows/bline-w2-caller-read-write-boundary.yml'
      - '.github/workflows/ci.yml'

jobs:
  bounded-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: Build focused server dependencies
        run: pnpm --filter @geox/device-skills... build
      - name: W2 bounded inventory and source gate
        run: node scripts/governance_acceptance/ACCEPTANCE_BLINE_W2_CALLER_READ_WRITE_BOUNDARY_V1.cjs
      - name: W2 focused positive-negative runtime proof
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_BLINE_W2_CALLER_READ_WRITE_BOUNDARY_V1.ts
      - name: Frozen PR-SEC-1 caller inventory regression
        run: pnpm run ci:governance:bline-production-caller-authority-inventory
      - name: B-Line residual authority audit
        run: pnpm run ci:governance:bline-residual-authority-audit
      - name: B-Line active runtime surface closure
        run: pnpm run ci:governance:bline-active-runtime-surface-closure
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Build
        run: pnpm -r build

  commercial-read-only-proof:
    runs-on: ubuntu-latest
    needs: bounded-closure
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: Prepare W2 Commercial credential and compose environment
        run: |
          set -euo pipefail
          TOKENS_JSON="$(node - <<'NODE'
          const f={version:"ao_act_tokens_v0",tokens:[
            {token:"w2_admin",token_id:"tok_w2_admin",actor_id:"w2_admin",tenant_id:"tenantA",project_id:"projectA",group_id:"groupA",role:"admin",scopes:["ao_act.index.read","fields.read","skill.read","telemetry.read","recommendation.write","recommendation.read"],revoked:false},
            {token:"w2_recommendation_reader",token_id:"tok_w2_reader",actor_id:"w2_reader",tenant_id:"tenantA",project_id:"projectA",group_id:"groupA",role:"client",scopes:["recommendation.read"],revoked:false},
            {token:"w2_recommendation_writer",token_id:"tok_w2_writer",actor_id:"w2_writer",tenant_id:"tenantA",project_id:"projectA",group_id:"groupA",role:"agronomist",scopes:["recommendation.write"],revoked:false}
          ]};
          process.stdout.write(JSON.stringify(f));
          NODE
          )"
          cat > .env.w2 <<EOF
          GEOX_RUNTIME_ENV=pilot
          GEOX_TOKENS_JSON='$TOKENS_JSON'
          POSTGRES_USER=landos
          POSTGRES_PASSWORD=w2-postgres-strong-2026
          POSTGRES_DB=landos
          GEOX_MCFT_MIGRATOR_PASSWORD=w2-mcft-migrator-strong-2026
          GEOX_RUNTIME_DATABASE_PASSWORD=w2-runtime-database-strong-2026
          GEOX_DEPLOYMENT_SUBJECT_COMMIT=${GITHUB_SHA}
          GEOX_INTERNAL_TASK_ISSUER_TOKEN=w2_admin
          GEOX_EVIDENCE_S3_BUCKET=evidence-exports-v1
          MINIO_ROOT_USER=geoxminio
          MINIO_ROOT_PASSWORD=w2-minio-strong-2026
          MQTT_USERNAME=geoxmqtt
          MQTT_PASSWORD=w2-mqtt-strong-2026
          CORS_ORIGINS=https://w2.geox.invalid
          APP_SECRET=w2-app-secret-strong-2026
          PUBLIC_BASE_URL=https://w2.geox.invalid
          GEOX_EXECUTION_DEFAULT_DISABLED=1
          GEOX_EXECUTION_ENABLE_EXPLICITLY=0
          GEOX_EXECUTION_ENABLE_REASON=w2-read-write-boundary-proof
          GEOX_DEVTOOLS_ENABLED=0
          EOF
          printf '%s' "w2_admin" > /tmp/w2_admin
          printf '%s' "w2_recommendation_reader" > /tmp/w2_reader
          printf '%s' "w2_recommendation_writer" > /tmp/w2_writer
      - name: Start Commercial server
        timeout-minutes: 8
        run: |
          set -euo pipefail
          timeout 180 docker compose --env-file .env.w2 -f docker-compose.commercial_v1.yml up -d minio minio-init
          timeout 300 docker compose --env-file .env.w2 -f docker-compose.commercial_v1.yml up -d postgres mqtt server
      - name: Wait for Commercial server
        run: timeout 180 bash -lc 'until curl -fsS http://127.0.0.1:3001/api/health >/dev/null; do sleep 2; done'
      - name: W2 bounded Commercial no-mutation proof
        run: |
          set -euo pipefail
          set -a; source .env.w2; set +a
          export BASE_URL=http://127.0.0.1:3001
          export DATABASE_URL="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5433/${POSTGRES_DB}"
          export GEOX_W2_ADMIN_TOKEN="$(cat /tmp/w2_admin)"
          export GEOX_W2_RECOMMENDATION_READER_TOKEN="$(cat /tmp/w2_reader)"
          export GEOX_W2_RECOMMENDATION_WRITER_TOKEN="$(cat /tmp/w2_writer)"
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_BLINE_W2_COMMERCIAL_READ_ONLY_V1.ts
      - name: Runtime hygiene
        if: always()
        run: |
          LOG=/tmp/bline-w2-runtime.log
          docker compose --env-file .env.w2 -f docker-compose.commercial_v1.yml logs server > "$LOG" 2>&1 || true
          ! grep -E 'FST_ERR_REP_ALREADY_SENT|ERR_HTTP_HEADERS_SENT|Reply was already sent|reply already sent' "$LOG"
      - name: Stop Commercial runtime
        if: always()
        run: docker compose --env-file .env.w2 -f docker-compose.commercial_v1.yml down -v --remove-orphans || true

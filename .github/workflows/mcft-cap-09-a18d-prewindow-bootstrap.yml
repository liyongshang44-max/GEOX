name: mcft-cap-09-a18d-prewindow-bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-a18d-prewindow-bootstrap.yml'
      - 'scripts/runtime_acceptance/EXECUTE_MCFT_CAP_09_A18D_PREWINDOW_BOOTSTRAP_V1.ts'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_A18D_PREWINDOW_BOOTSTRAP_QUALIFICATION.cjs'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-A18D-PREWINDOW-BOOTSTRAP-EXECUTION-AUTHORITY-V1.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcft-cap-09-a18d-prewindow-bootstrap.yml'
      - 'scripts/runtime_acceptance/EXECUTE_MCFT_CAP_09_A18D_PREWINDOW_BOOTSTRAP_V1.ts'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_A18D_PREWINDOW_BOOTSTRAP_QUALIFICATION.cjs'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-A18D-PREWINDOW-BOOTSTRAP-EXECUTION-AUTHORITY-V1.json'
  schedule:
    - cron: '5,20,35,50 19 17 8 *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcft-cap09-a18d-prewindow-bootstrap-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'formal-main' }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20.11.1'
  PNPM_VERSION: '9.15.4'
  EXACT_BASE_SHA: 'f8480f468dbe2dff24629903d20e45daf7dc08e6'
  TARGET_DATABASE_NAME: 'geox_mcft_cap09_s6_formal_t3r1_24h_v2'
  SOURCE_DATABASE_URL: ${{ secrets.GEOX_MCFT_CAP09_T3R1_S6_DATABASE_URL }}
  operational_schedule_is_normative_temporal_authority: 'false'

jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fail closed on exact four-file A18D candidate boundary
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha }}" = "$EXACT_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git fetch --no-tags --depth=1 origin "$EXACT_BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$EXACT_BASE_SHA" "$HEAD_SHA" | sort)
          test "${#changed[@]}" -eq 4
          expected=$(cat <<'EOF'
          .github/workflows/mcft-cap-09-a18d-prewindow-bootstrap.yml
          docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-A18D-PREWINDOW-BOOTSTRAP-EXECUTION-AUTHORITY-V1.json
          scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_A18D_PREWINDOW_BOOTSTRAP_QUALIFICATION.cjs
          scripts/runtime_acceptance/EXECUTE_MCFT_CAP_09_A18D_PREWINDOW_BOOTSTRAP_V1.ts
          EOF
          )
          test "$(printf '%s\n' "${changed[@]}")" = "$expected"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck A18D executor
        run: pnpm exec tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --skipLibCheck --types node scripts/runtime_acceptance/EXECUTE_MCFT_CAP_09_A18D_PREWINDOW_BOOTSTRAP_V1.ts

      - name: Recompute exact A18B A0 plus O00-O23 pins without database access
        run: pnpm exec tsx scripts/runtime_acceptance/EXECUTE_MCFT_CAP_09_A18D_PREWINDOW_BOOTSTRAP_V1.ts selftest

      - name: Prove A18D governance and prewrite fail-closed ordering
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_A18D_PREWINDOW_BOOTSTRAP_QUALIFICATION.cjs

      - name: Derive replacement v2 database URL without exposing secret
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_DATABASE_URL"
          DATABASE_URL=$(node -e 'const u=new URL(process.env.SOURCE_DATABASE_URL); u.pathname="/"+process.env.TARGET_DATABASE_NAME; process.stdout.write(u.toString())')
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
          echo "SOURCE_DATABASE_URL=" >> "$GITHUB_ENV"

      - name: Read-only A18D preflight against replacement Formal store
        if: github.event_name == 'pull_request'
        run: pnpm exec tsx scripts/runtime_acceptance/EXECUTE_MCFT_CAP_09_A18D_PREWINDOW_BOOTSTRAP_V1.ts preflight

      - name: Validate qualification nonclaims
        if: github.event_name == 'pull_request'
        shell: node {0}
        run: |
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_A18D_PREWINDOW_BOOTSTRAP_RESULT.json','utf8'));
          const g=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_A18D_PREWINDOW_BOOTSTRAP_QUALIFICATION_GOVERNANCE.json','utf8'));
          if(p.status!=='PASS'||p.transaction_mode!=='READ_ONLY'||p.exact_config_pin_count!==25) throw new Error('A18D_READ_ONLY_PREFLIGHT_REQUIRED');
          if(p.footprint.twin_facts!==0||p.footprint.runtime_configs!==0||p.footprint.active_lineage!==0||p.footprint.state_latest!==0||p.footprint.checkpoint_latest!==0||p.footprint.scheduler_cursors!==0||p.footprint.scheduler_slots!==0||p.footprint.terminal_ticks!==0) throw new Error('A18D_QUALIFICATION_RUNTIME_ZERO_STATE_REQUIRED');
          if(p.provider_request_count!==0||p.database_write_count!==0||p.scheduler_write_count!==0||p.canonical_runtime_tick_write_count!==0||p.formal_o00_started!==false) throw new Error('A18D_QUALIFICATION_NONCLAIM_REQUIRED');
          if(g.status!=='PASS'||g.a0_evidence_prechecked_before_persistence!==true||g.retry_does_not_rebuild_existing_a0_state!==true||g.qualification_transaction_mode!=='READ_ONLY') throw new Error('A18D_GOVERNANCE_PASS_REQUIRED');

      - name: Upload A18D qualification proof
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-a18d-prewindow-bootstrap-${{ github.event.pull_request.head.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_A18D_PREWINDOW_BOOTSTRAP_RESULT.json
            acceptance-output/MCFT_CAP_09_A18D_PREWINDOW_BOOTSTRAP_QUALIFICATION_GOVERNANCE.json
          if-no-files-found: error
          retention-days: 7

  live-a18d-bootstrap:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: static-contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact protected main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact qualified protected main and pre-O00 authority effectiveness
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'A18D_LIVE_EXACT_MAIN_DRIFT' >&2; exit 1; }
          authority='docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-A18D-PREWINDOW-BOOTSTRAP-EXECUTION-AUTHORITY-V1.json'
          effective_commit=$(git log --first-parent --diff-filter=A -1 --format='%H' -- "$authority")
          test -n "$effective_commit" || { echo 'A18D_EFFECTIVE_COMMIT_REQUIRED' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$effective_commit" || { echo 'A18D_LIVE_MAIN_MOVED_AFTER_QUALIFIED_MERGE' >&2; exit 1; }
          effective_time=$(git show -s --format='%cI' "$effective_commit")
          node -e 'const t=Date.parse(process.argv[1]); const d=Date.parse("2026-08-17T19:00:00.000Z"); if(!Number.isFinite(t)||t>=d) throw new Error(`A18D_AUTHORITY_NOT_EFFECTIVE_BEFORE_EXECUTION_WINDOW:${process.argv[1]}`)' "$effective_time"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install exact repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Require Formal replacement DB binding
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_DATABASE_URL"
          DATABASE_URL=$(node -e 'const u=new URL(process.env.SOURCE_DATABASE_URL); u.pathname="/"+process.env.TARGET_DATABASE_NAME; process.stdout.write(u.toString())')
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
          echo "SOURCE_DATABASE_URL=" >> "$GITHUB_ENV"

      - name: Execute or idempotently complete A18D prewindow bootstrap
        env:
          MCFT_CAP09_SUBJECT_SHA: ${{ github.sha }}
        run: pnpm exec tsx scripts/runtime_acceptance/EXECUTE_MCFT_CAP_09_A18D_PREWINDOW_BOOTSTRAP_V1.ts execute

      - name: Validate post-bootstrap cutover proof and Formal nonstart
        shell: node {0}
        run: |
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_A18D_PREWINDOW_BOOTSTRAP_RESULT.json','utf8'));
          if(p.status!=='PASS'||p.exact_config_pin_count!==25||p.active_runtime_config_ref!=='external_formal_runtime_config_e8c55077ffaf1e867d164b0b'||p.checkpoint_next_tick_logical_time!=='2026-08-17T20:00:00.000Z') throw new Error('A18D_POSTBOOTSTRAP_CONTINUITY_REQUIRED');
          if(p.observed_runtime_config_count!==25||p.observed_active_lineage_count!==1||p.observed_state_latest_count!==1||p.observed_checkpoint_count!==1) throw new Error('A18D_POSTBOOTSTRAP_CORE_COUNTS_REQUIRED');
          if(p.observed_scheduler_cursor_count!==0||p.observed_scheduler_slot_count!==0||p.observed_terminal_tick_count!==0||p.observed_downstream_action_fact_count!==0) throw new Error('A18D_POSTBOOTSTRAP_NONSTART_REQUIRED');
          if(p.provider_request_count!==0||p.scheduler_write_count!==0||p.canonical_runtime_tick_write_count!==0||p.formal_o00_started!==false||p.formal_execution_count!=='0/24') throw new Error('A18D_SIDE_EFFECT_BOUNDARY_REQUIRED');

      - name: Upload metadata-only A18D execution proof
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-a18d-prewindow-bootstrap-${{ github.sha }}-${{ github.run_id }}
          path: acceptance-output/MCFT_CAP_09_A18D_PREWINDOW_BOOTSTRAP_RESULT.json
          if-no-files-found: error
          retention-days: 14

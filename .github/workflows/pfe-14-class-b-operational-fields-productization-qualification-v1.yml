name: pfe-14-class-b-operational-fields-productization-qualification-v1

on:
  pull_request:
    paths:
      - 'docs/frontend-productization/PFE-14-CLASS-B-OPERATIONAL-FIELDS-PRODUCTIZATION-QUALIFICATION-V1.md'
      - 'docs/frontend-productization/PFE-14-CLASS-B-OPERATIONAL-FIELDS-PRODUCTIZATION-QUALIFICATION-V1.json'
      - 'docs/frontend-productization/PFE-14-CURRENT-AUTHORITY.json'
      - 'scripts/frontend_acceptance/ACCEPTANCE_PFE_14_CLASS_B_OPERATIONAL_FIELDS_PRODUCTIZATION_QUALIFICATION_V1.cjs'
      - 'scripts/frontend_acceptance/ACCEPTANCE_PFE_14_CLASS_B_OPERATIONAL_FIELDS_PRODUCTIZATION_V1.cjs'
      - 'scripts/frontend_acceptance/ACCEPTANCE_PFE_14_CLASS_B_NARROW_PROVIDER_QUALIFICATION_V1.cjs'
      - '.github/workflows/pfe-14-class-b-operational-fields-productization-qualification-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-class-b-operational-fields-productization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
      - name: Revalidate exact frontend productization candidate
        run: node scripts/frontend_acceptance/ACCEPTANCE_PFE_14_CLASS_B_OPERATIONAL_FIELDS_PRODUCTIZATION_V1.cjs
      - name: Validate frontend productization qualification
        run: node scripts/frontend_acceptance/ACCEPTANCE_PFE_14_CLASS_B_OPERATIONAL_FIELDS_PRODUCTIZATION_QUALIFICATION_V1.cjs
      - name: Revalidate narrow provider qualification
        run: node scripts/frontend_acceptance/ACCEPTANCE_PFE_14_CLASS_B_NARROW_PROVIDER_QUALIFICATION_V1.cjs

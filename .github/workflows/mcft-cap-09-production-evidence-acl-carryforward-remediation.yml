name: mcft-cap-09-production-evidence-acl-carryforward-remediation

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-production-evidence-acl-carryforward-remediation.yml'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-PRODUCTION-EVIDENCE-ACL-CARRYFORWARD-REMEDIATION-AUTHORITY-V1.json'
      - 'scripts/runtime_acceptance/MCFT_CAP_09_PRODUCTION_EVIDENCE_ACL_CARRYFORWARD_REMEDIATION_ARM_V1.json'
      - 'scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_PRODUCTION_EVIDENCE_ACL_CARRYFORWARD_REMEDIATION_V1.cjs'
      - 'scripts/runtime_acceptance/RUN_MCFT_CAP_09_PRODUCTION_EVIDENCE_ACL_CARRYFORWARD_REMEDIATION_V1.cjs'
      - 'apps/server/db/migrations/2026_09_01_mcft_cap_09_v13_evidence_runtime_phase3_acl_carryforward.sql'
      - 'scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_OPERATIONAL_SCHEMA_ACL_READINESS_V2.cjs'

permissions:
  contents: read

concurrency:
  group: mcft-cap09-production-evidence-acl-carryforward-remediation
  cancel-in-progress: false

jobs:
  preflight-and-remediate:
    if: >-
      github.head_ref == 'feat/mcft-cap09-v13-producer-driven-qualification-v1' &&
      github.event.pull_request.base.sha == '46367333d228a2b90a86ff6a33aebc334f3d73a2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
      SEED_DATABASE_URL: ${{ secrets.GEOX_MCFT_CAP09_T3R1_S6_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read-only exact production Evidence ACL remediation preflight
        run: node scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_PRODUCTION_EVIDENCE_ACL_CARRYFORWARD_REMEDIATION_V1.cjs
      - name: Apply exact ACL-only remediation only when armed
        run: node scripts/runtime_acceptance/RUN_MCFT_CAP_09_PRODUCTION_EVIDENCE_ACL_CARRYFORWARD_REMEDIATION_V1.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap09-production-evidence-acl-carryforward-remediation-${{ github.event.pull_request.head.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_PRODUCTION_EVIDENCE_ACL_CARRYFORWARD_REMEDIATION_PREFLIGHT_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_PRODUCTION_EVIDENCE_ACL_CARRYFORWARD_REMEDIATION_V1_RESULT.json
          if-no-files-found: error
          retention-days: 90

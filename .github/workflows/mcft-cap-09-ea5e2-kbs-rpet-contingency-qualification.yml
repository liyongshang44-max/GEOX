name: mcft-cap-09-ea5e2-kbs-rpet-contingency-qualification

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-ea5e2-kbs-rpet-contingency-qualification.yml'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA5E2-KBS-RPET-CONTINGENCY-QUALIFICATION-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_KBS_RPET_CONTINGENCY_QUALIFICATION.cjs'
      - 'scripts/runtime_acceptance/PROBE_MCFT_CAP_09_EA5E2_KBS_RPET_CONTINGENCY_QUALIFICATION.mjs'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: mcft-cap09-rpet-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  qualify-kbs-rpet-contingency:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Validate exact no-authority boundary
        env:
          MCFT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_KBS_RPET_CONTINGENCY_QUALIFICATION.cjs
      - name: Syntax-check live probe
        run: node --check scripts/runtime_acceptance/PROBE_MCFT_CAP_09_EA5E2_KBS_RPET_CONTINGENCY_QUALIFICATION.mjs
      - name: Run current KBS rPET qualification diagnostic
        env:
          MCFT_SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: node scripts/runtime_acceptance/PROBE_MCFT_CAP_09_EA5E2_KBS_RPET_CONTINGENCY_QUALIFICATION.mjs
      - name: Verify no source or Formal authority was created
        shell: node {0}
        run: |
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_EA5E2_KBS_RPET_CONTINGENCY_QUALIFICATION_RESULT.json','utf8'));
          if(r.status!=='PASS') throw new Error('RPET_PROBE_EXECUTION_PASS_REQUIRED');
          if(!['QUALIFIED_FOR_SOURCE_ARCHITECTURE_ADJUDICATION','REJECTED_OR_INCOMPLETE_FOR_FORMAL_SUBSTITUTION'].includes(r.qualification_status)) throw new Error('RPET_QUALIFICATION_STATUS_REQUIRED');
          if(r.raw_retention?.private_retention_verified!==true || r.raw_body_uploaded!==false) throw new Error('RPET_PRIVATE_RAW_RETENTION_REQUIRED');
          if(r.source_substitution_authorized!==false || r.ea5e2_effectiveness_changed!==false || r.formal_o00_authorized!==false) throw new Error('RPET_PREMATURE_AUTHORITY_FORBIDDEN');
          if(r.database_write_count!==0 || r.formal_evidence_write_count!==0 || r.r2_formal_write_count!==0 || r.public_raw_numeric_value_emission_count!==0) throw new Error('RPET_ZERO_WRITE_PUBLIC_VALUE_BOUNDARY_REQUIRED');
          if(r.asce_short_reference_hourly_equivalence_established!==false) throw new Error('RPET_METHOD_EQUIVALENCE_OVERCLAIM');
          console.log(JSON.stringify({status:'PASS',qualification_status:r.qualification_status,technical_value_bearing_candidate:r.technical_value_bearing_candidate,latest_rpet_age_hours:r.observed_candidate?.latest_rpet_age_hours,violations:r.violations,source_substitution_authorized:false}));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap09-rpet-contingency-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_EA5E2_KBS_RPET_CONTINGENCY_QUALIFICATION_GOVERNANCE_RESULT.json
            acceptance-output/MCFT_CAP_09_EA5E2_KBS_RPET_CONTINGENCY_QUALIFICATION_RESULT.json
          if-no-files-found: error
          retention-days: 90

name: mcft-cap-09-final-semantic-bulk-rewrite

on:
  push:
    branches:
      - fix/mcft-cap09-formal-a0-t4r1-crop-authority
    paths:
      - '.github/workflows/mcft-cap-09-final-semantic-bulk-rewrite.yml'

permissions:
  contents: write

jobs:
  rewrite-and-self-remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mcft-cap09-formal-a0-t4r1-crop-authority
          fetch-depth: 0
      - name: Rewrite all known active Formal v2 bindings to v3
        shell: python
        run: |
          from pathlib import Path
          files = [
              '.github/workflows/mcft-cap-09-amendment19-formal-a0-bootstrap.yml',
              '.github/workflows/mcft-cap-09-amendment19-formal-hourly-evidence.yml',
              '.github/workflows/mcft-cap-09-amendment19-formal-live-runner.yml',
              '.github/workflows/mcft-cap-09-amendment19-formal-final-readback.yml',
              'scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_AMENDMENT_19_FORMAL_DOWNSTREAM_ZERO_V1.ts',
              'scripts/governance_acceptance/ASSEMBLE_MCFT_CAP_09_AMENDMENT_19_FORMAL_COMPLETION_V1.cjs',
          ]
          old = 'geox_mcft_cap09_s6_formal_t4r1_24h_v2'
          new = 'geox_mcft_cap09_s6_formal_t4r1_24h_v3'
          total = 0
          for name in files:
              p = Path(name)
              text = p.read_text()
              count = text.count(old)
              if count:
                  p.write_text(text.replace(old, new))
                  total += count
                  print(f'{name}: {count}')
              else:
                  print(f'{name}: 0')
          if total == 0:
              raise SystemExit('NO_ACTIVE_FORMAL_V2_BINDINGS_REWRITTEN')
          print(f'total={total}')
      - name: Remove one-shot workflow and commit closure rewrite
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/mcft-cap-09-final-semantic-bulk-rewrite.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(mcft-cap09): bind remaining active Formal chain to v3'
          git push origin HEAD:fix/mcft-cap09-formal-a0-t4r1-crop-authority

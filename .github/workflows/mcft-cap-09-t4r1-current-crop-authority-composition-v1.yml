name: MCFT CAP-09 T4R1 Current Crop Authority Composition

on:
  pull_request:
    branches:
      - feat/mcft-cap09-t4r1-thermal-stage-authority-v1
      - qual/mcft-cap09-current-main-requal-cb9-v1
      - main
    paths:
      - .github/workflows/mcft-cap-09-t4r1-current-crop-authority-composition-v1.yml
      - docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-T4R1-CURRENT-CROP-AUTHORITY-COMPOSITION-V1.json
      - scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_T4R1_CURRENT_CROP_AUTHORITY_COMPOSITION_V1.cjs
      - scripts/runtime_acceptance/COMPOSE_MCFT_CAP_09_T4R1_CURRENT_CROP_AUTHORITY_V1.cjs

permissions:
  contents: read

jobs:
  qualification:
    if: >-
      github.base_ref == 'feat/mcft-cap09-t4r1-thermal-stage-authority-v1' ||
      github.base_ref == 'qual/mcft-cap09-current-main-requal-cb9-v1' ||
      (
        github.base_ref == 'main' &&
        github.head_ref == 'fix/mcft-cap09-current-main-requal-pr-carrier-v1' &&
        github.event.pull_request.base.sha == 'a8a5046f38e51fdd7b745c9e211ed61299164b23'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MCFT_CAP09_CURRENT_CROP_COMPOSITION_BASE_SHA: ffc9d03533670d2f47ace71d170602d8768ec1bc
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ ((github.base_ref == 'qual/mcft-cap09-current-main-requal-cb9-v1' && github.head_ref == 'main' && github.event.pull_request.base.sha == 'cb9fea1c7e37c4aea34ae9a7985dd371cd7fe4e4') || (github.base_ref == 'main' && github.head_ref == 'fix/mcft-cap09-current-main-requal-pr-carrier-v1' && github.event.pull_request.base.sha == 'a8a5046f38e51fdd7b745c9e211ed61299164b23')) && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve bounded qualification mode
        shell: bash
        run: |
          set -euo pipefail

          MODE=HISTORICAL

          if [ '${{ github.base_ref }}' = 'qual/mcft-cap09-current-main-requal-cb9-v1' ]; then
            test '${{ github.head_ref }}' = 'main'
            test '${{ github.event.pull_request.base.sha }}' = 'cb9fea1c7e37c4aea34ae9a7985dd371cd7fe4e4'

            SUBJECT='${{ github.event.pull_request.head.sha }}'

            test "$(git rev-parse HEAD)" = "$SUBJECT"

            git fetch --no-tags origin main
            test "$(git rev-parse origin/main)" = "$SUBJECT"

            MODE=CURRENT_MAIN_REQUALIFICATION_PR

          elif [ '${{ github.base_ref }}' = 'main' ] && \
               [ '${{ github.head_ref }}' = 'fix/mcft-cap09-current-main-requal-pr-carrier-v1' ]; then

            test '${{ github.event.pull_request.base.sha }}' = 'a8a5046f38e51fdd7b745c9e211ed61299164b23'
            test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'

            git fetch --no-tags origin main
            test "$(git rev-parse origin/main)" = 'a8a5046f38e51fdd7b745c9e211ed61299164b23'

            MODE=ROUTING_INSTALLATION_PR
          fi

          echo "MCFT_CAP09_REQUAL_MODE=$MODE" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for existing lifecycle probe
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify exact four-file integration boundary
        if: env.MCFT_CAP09_REQUAL_MODE == 'HISTORICAL'
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_T4R1_CURRENT_CROP_AUTHORITY_COMPOSITION_V1.cjs

      - name: Fresh read-only T4R1 lifecycle requalification
        env:
          MCFT_SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/runtime_acceptance/PROBE_MCFT_CAP_09_T4R1_PERSISTENT_LIFECYCLE_QUALIFICATION.mjs

      - name: Fresh read-only thermal stage and Kc requalification
        run: python3 scripts/runtime_acceptance/PROBE_MCFT_CAP_09_T4R1_THERMAL_BIOLOGICAL_STAGE_AUTHORITY_V1.py

      - name: Compose exact current-crop authority
        run: node scripts/runtime_acceptance/COMPOSE_MCFT_CAP_09_T4R1_CURRENT_CROP_AUTHORITY_V1.cjs
      - name: Verify current-main candidate authority ceiling
        if: env.MCFT_CAP09_REQUAL_MODE != 'HISTORICAL'
        shell: node {0}
        run: |
          const fs = require('node:fs');

          const p =
            'acceptance-output/MCFT_CAP09_T4R1_CURRENT_CROP_AUTHORITY_COMPOSITION_RESULT.json';

          const r = JSON.parse(fs.readFileSync(p, 'utf8'));

          const fail = (k,v) => {
            if (v !== false) throw new Error(`${k}:${JSON.stringify(v)}`);
          };

          if (r.status !== 'PASS')
            throw new Error(`CURRENT_CROP_STATUS:${r.status}`);

          if (r.qualification_outcome !==
              'CURRENT_CROP_CONTEXT_AUTHORITY_CANDIDATE_RESOLVED')
            throw new Error(`CURRENT_CROP_OUTCOME:${r.qualification_outcome}`);

          for (const k of [
            'architecture_effective',
            'runtime_consumption_authorized',
            'runtime_config_write_authorized',
            'database_write_authorized',
            'scheduler_write_authorized',
            'formal_evidence_write_authorized',
            'production_runtime_start_authorized',
            'production_owner_activation_authorized',
            'formal_v5_authorized',
            'a0_authorized',
            'o00_o23_authorized',
            'mcft_cap09_completed'
          ]) fail(k,r[k]);

          console.log(JSON.stringify({
            status:'PASS',
            authority_ceiling_preserved:true,
            subject_head_sha:r.subject_head_sha
          }));

      - name: Upload sanitized composition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-t4r1-current-crop-authority
          path: |
            acceptance-output/MCFT_CAP_09_T4R1_PERSISTENT_LIFECYCLE_QUALIFICATION_RESULT.json
            acceptance-output/MCFT_CAP09_T4R1_THERMAL_BIOLOGICAL_STAGE_PROBE_RESULT.json
            acceptance-output/MCFT_CAP09_T4R1_CURRENT_CROP_AUTHORITY_COMPOSITION_RESULT.json
          if-no-files-found: warn
          retention-days: 90

name: tmp-mcft-cap09-isolate-rolling-preboundary-runner

on:
  push:
    branches:
      - agent/mcft-cap09-rolling-soil-deadline-t0
    paths:
      - '.github/workflows/__tmp_mcft_cap09_isolate_rolling_preboundary_runner.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mcft-cap09-rolling-soil-deadline-t0
          fetch-depth: 0
      - name: Wire dedicated rolling runner
        shell: bash
        run: |
          set -euo pipefail
          old='RUN_MCFT_CAP_09_EA5E2_LIVE_PROVIDER_PHASE_PRIVATE_TRANSIENT_R2.ts'
          new='RUN_MCFT_CAP_09_ROLLING_PREBOUNDARY_PROVIDER_PHASE_PRIVATE_TRANSIENT_R2.ts'
          workflow='.github/workflows/mcft-cap-09-rolling-preboundary-capture.yml'
          acceptance='scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_ROLLING_PREBOUNDARY_CAPTURE.cjs'
          test "$(grep -c "$old" "$workflow")" -eq 1
          sed -i "s/$old/$new/g" "$workflow"
          sed -i "/ACCEPTANCE_MCFT_CAP_09_ROLLING_PREBOUNDARY_CAPTURE.cjs'/a\      - 'scripts/runtime_acceptance/$new'" "$workflow"
          sed -i "s/$old/$new/g" "$acceptance"
          node --check "$acceptance"
          node "$acceptance"
          git diff --check
      - name: Commit wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/mcft-cap-09-rolling-preboundary-capture.yml scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_ROLLING_PREBOUNDARY_CAPTURE.cjs
          git commit -m 'MCFT-CAP-09: wire isolated rolling preboundary runner'
          git push origin HEAD:agent/mcft-cap09-rolling-soil-deadline-t0

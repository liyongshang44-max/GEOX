name: mcft-cap-09-production-non-github-host-binding-readiness

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-production-non-github-host-binding-readiness.yml'
      - 'scripts/runtime_acceptance/MCFT_CAP_09_PRODUCTION_NON_GITHUB_HOST_BINDING_ARM_V1.json'
      - 'scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_NON_GITHUB_HOST_BINDING_READINESS_V1.cjs'
      - 'scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_V1.cjs'
      - '.github/workflows/mcft-cap-09-production-owner-provisioning-readiness.yml'

permissions:
  contents: read

jobs:
  non-github-host-binding-readiness:
    if: >-
      github.head_ref == 'work/host-secret-preowner-v1' &&
      github.event.pull_request.base.sha == '7812bbc9f768430c9b034e169013515ed387e30f'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact host-secret-binding subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Syntax-check production-host readiness verifier
        run: node --check scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_NON_GITHUB_HOST_BINDING_READINESS_V1.cjs

      - name: Verify secret-binding authorization and canonical rematerialization without reading secrets
        run: node scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_NON_GITHUB_HOST_BINDING_READINESS_V1.cjs

      - name: Assert GitHub remains non-production and zero-effect
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_PRODUCTION_NON_GITHUB_HOST_BINDING_READINESS_V1_RESULT.json','utf8'));
          const req=(v,c)=>{if(!v)throw new Error(c)};
          req(p.status==='PASS','HOST_SECRET_BINDING_STATIC_PASS_REQUIRED');
          req(p.stage==='HOST_SECRET_BINDING_AUTHORIZED_MACHINE_PROOF_REQUIRED','HOST_SECRET_BINDING_STATIC_STAGE_REQUIRED');
          req(p.production_host_secret_binding_authorized===true,'HOST_SECRET_BINDING_AUTHORITY_REQUIRED');
          req(p.production_host_secret_binding_observed===false,'HOST_SECRET_BINDING_MACHINE_PROOF_MUST_NOT_BE_CLAIMED_IN_GITHUB');
          req(p.local_machine_proof_required===true&&p.pre_owner_cutover_ready===false,'HOST_SECRET_BINDING_LOCAL_PROOF_BOUNDARY_REQUIRED');
          req(Array.isArray(p.remaining_blockers)&&p.remaining_blockers.length===1&&p.remaining_blockers[0]==='LOCAL_HOST_SECRET_BINDING_MACHINE_PROOF_REQUIRED','HOST_SECRET_BINDING_EXACT_BLOCKER_REQUIRED');
          for(const k of ['repository_secret_materialized','github_secret_materialized','runtime_process_start','production_owner_activation','formal_v5_arm','a0_bootstrap','o00_started'])req(p[k]===false,'HOST_SECRET_BINDING_HARD_NON_EFFECT:'+k);
          req(p.provider_request_count===0&&p.database_connection_attempted===false&&p.compose_render_attempted===false,'HOST_SECRET_BINDING_GITHUB_NO_LIVE_READBACK_REQUIRED');
          console.log(JSON.stringify({status:'PASS',subject_sha:p.subject_sha,local_machine_proof_required:true,runtime_process_start:false,production_owner_activation:false,formal_v5_arm:false},null,2));

      - name: Upload static host-secret-binding contract proof
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-production-host-secret-binding-static-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/MCFT_CAP_09_PRODUCTION_NON_GITHUB_HOST_BINDING_READINESS_V1_RESULT.json
          if-no-files-found: error
          retention-days: 90

name: MCFT CAP-09 Runtime-Start Rolling Graduation Successor V1

on:
  pull_request:
    paths:
      - 'scripts/runtime_acceptance/BUILD_MCFT_CAP_09_PRODUCTION_RUNTIME_START_AUTHORITY_V1.cjs'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_RUNTIME_START_ROLLING_GRADUATION_SUCCESSOR_V1.cjs'
      - '.github/workflows/mcft-cap-09-runtime-start-rolling-graduation-successor-v1.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove rolling-refresh runtime-start compatibility
        run: node scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_RUNTIME_START_ROLLING_GRADUATION_SUCCESSOR_V1.cjs

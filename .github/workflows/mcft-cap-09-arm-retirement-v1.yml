name: mcft-cap-09-arm-retirement-v1
on:
  pull_request:
    paths:
      - 'scripts/runtime_acceptance/*ARM*RETIREMENT*'
      - 'scripts/runtime_acceptance/RETIRE_MCFT_CAP09_ARM_HOST_V1.ps1'
      - 'scripts/runtime_acceptance/RUN_MCFT_CAP_09_FORMAL_V5_*_V2.cjs'
      - 'scripts/governance_acceptance/VERIFY_MCFT_CAP_09_ARM_RETIREMENT_ONLY_SUCCESSOR_V1.cjs'
      - '.github/workflows/mcft-cap-09-arm-retirement-v1.yml'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-OLD-ARM-HOST-RETIREMENT-V1.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retirement-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
      - name: Exact revocation-only successor; unchanged Runtime and V1
        run: node scripts/governance_acceptance/VERIFY_MCFT_CAP_09_ARM_RETIREMENT_ONLY_SUCCESSOR_V1.cjs
      - name: Independent retirement and three V2 entrypoint rejection tests
        run: node scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_FORMAL_ARM_RETIREMENT_V1.cjs --entrypoints

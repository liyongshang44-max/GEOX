name: Temporary MCFT CAP-09 QCP 512F Materializer

on:
  push:
    branches:
      - tmp/mcft-cap09-qcp-512f-materializer-v1
    paths:
      - '.github/workflows/tmp-mcft-cap09-qcp-512f-materializer-v1.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert exact clean materializer base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "512fb706040bf609c949aabb641afa300bd4c91b"
          test "$(git rev-parse 512fb706040bf609c949aabb641afa300bd4c91b^{tree})" = "2e211c9cb2af003d5878fc08f84fb01a1b3c649d"

      - name: Materialize rolling single proof-bound admission
        shell: node {0}
        run: |
          const fs = require('fs');
          const path = 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-CONTROL-PLANE-V1.json';
          const oldBase = '7cb7cdc8c00252d3c87a685fbab38d96316afa3e';
          const newBase = '512fb706040bf609c949aabb641afa300bd4c91b';
          const newTree = '2e211c9cb2af003d5878fc08f84fb01a1b3c649d';
          const artifact = 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-CURRENT-MAIN-REANCHOR-512F-V1.json';
          const acceptance = 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_CURRENT_MAIN_REANCHOR_512F_V1.cjs';
          const workflow = '.github/workflows/mcft-cap-09-current-main-reanchor-2144-v1.yml';
          const qcp = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!Array.isArray(qcp.proof_bound_exact_base_admissions) || qcp.proof_bound_exact_base_admissions.length !== 1) throw new Error('QCP_PROOF_BOUND_CARDINALITY_DRIFT');
          const prior = qcp.proof_bound_exact_base_admissions[0];
          if (prior.base_sha !== oldBase) throw new Error(`QCP_EXPECTED_7CB7_ACTIVE_ADMISSION:${prior.base_sha}`);
          if (prior.baseline_qualification_carry_forward_authorized !== false) throw new Error('QCP_BASELINE_CARRY_FORWARD_MUST_REMAIN_FALSE');
          if ((qcp.governed_successor_predecessor_shas || []).includes(newBase)) throw new Error('QCP_512F_LEGACY_ALLOWLIST_FORBIDDEN');
          qcp.proof_bound_exact_base_admissions = [{
            base_sha: newBase,
            mode: 'PROOF_BOUND_EXACT_BASE',
            proof_artifact: artifact,
            proof_acceptance: acceptance,
            proof_workflow: workflow,
            current_protected_main_tree: newTree,
            bare_sha_allowlist_admission_authorized: false,
            admission_requires_exact_lineage_and_overlap_proof: true,
            baseline_qualification_carry_forward_authorized: false
          }];
          const control = qcp.dependency_resolvers?.CONTROL_PLANE_FILES?.paths;
          if (!Array.isArray(control)) throw new Error('QCP_CONTROL_PLANE_PATHS_MISSING');
          for (const rel of [artifact, acceptance]) if (!control.includes(rel)) control.push(rel);
          fs.writeFileSync(path, JSON.stringify(qcp, null, 2) + '\n');

      - name: Commit generated QCP blob on temporary branch only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain -- docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-CONTROL-PLANE-V1.json)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-CONTROL-PLANE-V1.json
          git commit -m 'chore(mcft-cap09): materialize 512f qcp blob on temporary branch'
          git push origin HEAD:tmp/mcft-cap09-qcp-512f-materializer-v1

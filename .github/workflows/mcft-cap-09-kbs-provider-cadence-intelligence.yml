name: mcft-cap-09-kbs-provider-cadence-intelligence

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-kbs-provider-cadence-intelligence.yml'
      - 'scripts/runtime_acceptance/MCFT_CAP_09_KBS_PROVIDER_CADENCE_INTELLIGENCE_V1.cjs'
      - 'scripts/runtime_acceptance/OBSERVE_MCFT_CAP_09_KBS_CURRENT_FRESHNESS_METADATA.py'
      - 'scripts/runtime_acceptance/OBSERVE_MCFT_CAP_09_KBS_PUBLICATION_CADENCE.py'
      - 'scripts/runtime_acceptance/PREFLIGHT_MCFT_CAP_09_KBS_PROVIDER_CADENCE_INTELLIGENCE.cjs'
      - 'scripts/runtime_acceptance/VALIDATE_MCFT_CAP_09_KBS_ENGINEERING_WINDOW.py'
      - 'scripts/runtime_acceptance/EXECUTE_MCFT_CAP_09_KBS_ENGINEERING_VALUE_PATH.py'
      - 'scripts/runtime_acceptance/RESTORE_MCFT_CAP_09_KBS_PUBLICATION_CADENCE_STATE.py'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-KBS-PROVIDER-CADENCE-INTELLIGENCE-DESIGN-V1.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  cadence-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove deterministic cadence decision semantics
        run: node scripts/runtime_acceptance/MCFT_CAP_09_KBS_PROVIDER_CADENCE_INTELLIGENCE_V1.cjs

      - name: Restore latest successful protected-main cadence state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/runtime_acceptance/RESTORE_MCFT_CAP_09_KBS_PUBLICATION_CADENCE_STATE.py \
            --output acceptance-output/PREVIOUS_KBS_PUBLICATION_CADENCE_STATE.json

      - name: Observe current KBS Raw Hourly freshness metadata only
        run: |
          mkdir -p acceptance-output
          python scripts/runtime_acceptance/OBSERVE_MCFT_CAP_09_KBS_CURRENT_FRESHNESS_METADATA.py \
            > acceptance-output/KBS_CURRENT_FRESHNESS_METADATA.json

      - name: Evaluate RUN WAIT_NEXT_BATCH DEFER FAIL without changing authority
        run: node scripts/runtime_acceptance/PREFLIGHT_MCFT_CAP_09_KBS_PROVIDER_CADENCE_INTELLIGENCE.cjs

      - name: Exercise non-authoritative KBS engineering window when age is within 24h
        id: engineering_window
        shell: bash
        run: |
          set -euo pipefail
          age="$(python -c 'import json; print(json.load(open("acceptance-output/KBS_CURRENT_FRESHNESS_METADATA.json"))["latest_age_hours"])')"
          if python -c 'import sys; sys.exit(0 if float(sys.argv[1]) <= 24 else 1)' "$age"; then
            python scripts/runtime_acceptance/VALIDATE_MCFT_CAP_09_KBS_ENGINEERING_WINDOW.py \
              > acceptance-output/KBS_ENGINEERING_WINDOW.json
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            python - <<'PY'
          import json
          proof = {
            "schema_version": "geox_mcft_cap09_kbs_engineering_window_v1",
            "status": "NOT_AVAILABLE",
            "qualification_mode": "ENGINEERING_VALIDATION",
            "engineering_max_age_hours": 24,
            "engineering_window_pass": False,
            "authority_effect": False,
            "formal_effect": False,
            "ea5e3_authorized": False,
            "formal_window_started": False,
            "database_write_count": 0,
            "canonical_write_count": 0,
          }
          open("acceptance-output/KBS_ENGINEERING_WINDOW.json", "w").write(json.dumps(proof, sort_keys=True) + "\n")
          PY
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install exact engineering ET0 oracle only when 24h window is available
        if: steps.engineering_window.outputs.available == 'true'
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 refet==0.4.2

      - name: Execute non-authoritative KBS rainfall and historical ET0 value path
        if: steps.engineering_window.outputs.available == 'true'
        run: |
          python scripts/runtime_acceptance/EXECUTE_MCFT_CAP_09_KBS_ENGINEERING_VALUE_PATH.py \
            > acceptance-output/KBS_ENGINEERING_VALUE_PATH.json

      - name: Upload metadata-only cadence intelligence proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-kbs-provider-cadence-intelligence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            acceptance-output/KBS_CURRENT_FRESHNESS_METADATA.json
            acceptance-output/KBS_PROVIDER_CADENCE_INTELLIGENCE.json
            acceptance-output/KBS_ENGINEERING_WINDOW.json
            acceptance-output/KBS_ENGINEERING_VALUE_PATH.json
          if-no-files-found: warn
          retention-days: 30

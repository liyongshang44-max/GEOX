name: mcft-cap-09-ea5e2-operational-activation-runner-qualification

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-ea5e2-live-provider-two-phase-readiness.yml'
      - '.github/workflows/mcft-cap-09-ea5e2-operational-activation-runner-qualification.yml'
      - 'scripts/runtime_acceptance/RUN_MCFT_CAP_09_EA5E2_OPERATIONAL_ACTIVATION_OBSERVER.ts'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_OPERATIONAL_ACTIVATION_RUNNER_QUALIFICATION.cjs'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA5E2-OPERATIONAL-ACTIVATION-RUNNER-QUALIFICATION-V1.json'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: mcft-cap09-ea5e2-oa-runner-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  EA5E2_OA_RUNNER_QUALIFICATION_CREATION_BASE: 4e41858478bdca5989fb3388c3660105f7350559

jobs:
  operational-activation-runner-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm

      - name: Resolve exact runner-qualification base
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_sha=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install exact repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Re-prove server typecheck
        run: pnpm --filter @geox/server run typecheck

      - name: Typecheck operational activation observer as a standalone NodeNext entrypoint
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tsc \
            --noEmit \
            --pretty false \
            --skipLibCheck \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --esModuleInterop \
            --types node \
            scripts/runtime_acceptance/RUN_MCFT_CAP_09_EA5E2_OPERATIONAL_ACTIVATION_OBSERVER.ts

      - name: Re-prove fixed-lag scheduler seam
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_FIXED_LAG_SCHEDULER_SEAM.ts

      - name: Re-prove exact-hour late-cutoff seam
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_EXACT_INTERVAL_LATE_CUTOFF_SEAM.ts

      - name: Re-prove DB-only source to External CAP04 compatibility
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_DATABASE_SOURCE_TO_EXTERNAL_CAP04.ts

      - name: Syntax-check operational activation runner governance gate
        run: node --check scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_OPERATIONAL_ACTIVATION_RUNNER_QUALIFICATION.cjs

      - name: Validate historical creation qualification or post-qualification preservation
        env:
          MCFT_BASE_SHA: ${{ steps.authority.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MCFT_BASE_SHA" = "$EA5E2_OA_RUNNER_QUALIFICATION_CREATION_BASE" ]; then
            node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_OPERATIONAL_ACTIVATION_RUNNER_QUALIFICATION.cjs
            exit 0
          fi

          # The exact-five-file gate is a creation-time proof. On later bases, preserve it
          # byte-for-byte and prove that this PR is not rewriting its authority or observer.
          node <<'NODE'
          const fs=require('fs');
          const cp=require('child_process');
          const path=require('path');
          const base=process.env.MCFT_BASE_SHA;
          const creation=process.env.EA5E2_OA_RUNNER_QUALIFICATION_CREATION_BASE;
          const files={
            authority:'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA5E2-OPERATIONAL-ACTIVATION-RUNNER-QUALIFICATION-V1.json',
            gate:'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_OPERATIONAL_ACTIVATION_RUNNER_QUALIFICATION.cjs',
            observer:'scripts/runtime_acceptance/RUN_MCFT_CAP_09_EA5E2_OPERATIONAL_ACTIVATION_OBSERVER.ts'
          };
          const expected={
            authority:'4f0df5f9fe896bf26eda3d673e3153941f59c2e7',
            gate:'5293801a6480521a23fd91748ea6f6c73be3b4f8',
            observer:'ec18b215f10bedd66fa2a6a1efef0e41cf57ce38'
          };
          const git=(...args)=>cp.execFileSync('git',args,{encoding:'utf8'}).trim();
          for(const [key,file] of Object.entries(files)){
            const baseBlob=git('rev-parse',`${base}:${file}`);
            const headBlob=git('rev-parse',`HEAD:${file}`);
            if(baseBlob!==expected[key]||headBlob!==expected[key]) throw new Error(`EA5E2_OA_HISTORICAL_${key.toUpperCase()}_MUTATED`);
          }
          const authority=JSON.parse(fs.readFileSync(files.authority,'utf8'));
          if(authority.effect_if_exact_head_runner_qualification_passes_and_candidate_merges?.ea5e2_operational_activation_runner_qualified!==true) throw new Error('EA5E2_OA_HISTORICAL_RUNNER_QUALIFIED_EFFECT_REQUIRED');
          if(authority.effect_if_exact_head_runner_qualification_passes_and_candidate_merges?.ea5e2_operational_activation_qualified!==false) throw new Error('EA5E2_OA_HISTORICAL_OPERATIONAL_ACTIVATION_MUST_REMAIN_FALSE');
          const out='acceptance-output/MCFT_CAP_09_EA5E2_OPERATIONAL_ACTIVATION_RUNNER_QUALIFICATION_GOVERNANCE_RESULT.json';
          fs.mkdirSync(path.dirname(out),{recursive:true});
          const proof={
            status:'PASS',
            applicability:'POST_QUALIFICATION_HISTORICAL_PRESERVATION_ONLY',
            subject_sha:git('rev-parse','HEAD'),
            pr_base_sha:base,
            creation_base_sha:creation,
            qualification_reexecuted:false,
            historical_authority_preserved:true,
            historical_gate_preserved:true,
            historical_observer_preserved:true,
            live_workflow_successor_hardening_must_be_proved_separately:true,
            ea5e2_operational_activation_qualified:false,
            formal_effectiveness:false
          };
          fs.writeFileSync(out,JSON.stringify(proof,null,2)+'\n');
          console.log(JSON.stringify(proof));
          NODE

      - name: Upload immutable runner qualification or preservation proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-ea5e2-operational-activation-runner-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_EA5E2_OPERATIONAL_ACTIVATION_RUNNER_QUALIFICATION_GOVERNANCE_RESULT.json
            docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA5E2-OPERATIONAL-ACTIVATION-RUNNER-QUALIFICATION-V1.json
          if-no-files-found: error
          retention-days: 90

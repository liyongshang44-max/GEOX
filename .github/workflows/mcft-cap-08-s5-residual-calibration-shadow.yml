name: mcft-cap-08-s5-residual-calibration-shadow

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-08-s5-pre-candidate-governance.yml'
      - '.github/workflows/mcft-cap-08-s5-residual-calibration-shadow.yml'
      - '.github/workflows/mcft-cap-08-s5-exact-sha-attestation.yml'
      - 'apps/server/src/domain/calibration/cap08_s5_**'
      - 'apps/server/src/domain/twin_runtime/cap08_s5_**'
      - 'apps/server/src/infra/mcft_cap08_database_platform_bootstrap_v1.ts'
      - 'apps/server/src/persistence/twin_runtime/postgres_cap08_s5_**'
      - 'apps/server/src/runtime/twin_runtime/cap08_s5_**'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S5-CANDIDATE-CHANGED-FILE-BOUNDARY-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S5-IMPLEMENTATION-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S5-DELIVERY-STATUS-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S5-PREDECESSOR-CONSUMPTION-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S5-WORKFLOW-DECLARATION-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S5_FORMAL_CANDIDATE_BOUNDARY.cjs'
      - 'scripts/governance_acceptance/mcft_cap08_s5_artifact_finalize.cjs'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_08_S5_V2_FORMAL_PREFLIGHT_DB.ts'
      - 'scripts/runtime_acceptance/mcft_cap08_s5_v2_formal_acceptance_support_v1.ts'

permissions:
  contents: read

concurrency:
  group: mcft-cap08-s5-formal-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  residual-calibration-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 30
    steps:
      - name: Checkout exact formal candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 20.11.1, cache: pnpm }
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile
      - name: Validate exact formal candidate boundary
        env:
          MCFT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S5_FORMAL_CANDIDATE_BOUNDARY.cjs
      - name: Typecheck bounded S5 implementation
        run: pnpm --filter @geox/server typecheck
      - name: Bootstrap fresh formal candidate database
        env:
          MCFT_CAP08_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          MCFT_CAP08_TARGET_DATABASE_NAME: geox_mcft_cap08_s5_formal_candidate
          MCFT_CAP08_RUNNER_PASSWORD: cap08-s5-formal-candidate-runner
          MCFT_CAP08_MIGRATOR_PASSWORD: cap08-s5-formal-candidate-migrator
          MCFT_CAP08_LEGACY_RUNTIME_PASSWORD: cap08-s5-formal-candidate-legacy
          MCFT_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm -w exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_08_PLATFORM_SECURITY_BOOTSTRAP_DB.ts
      - name: Execute fresh PostgreSQL S5 proof
        shell: bash
        env:
          DATABASE_URL: postgres://geox_mcft_cap08_runner_v1:cap08-s5-formal-candidate-runner@127.0.0.1:5432/geox_mcft_cap08_s5_formal_candidate
          MCFT_CAP08_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/geox_mcft_cap08_s5_formal_candidate
          MCFT_CAP08_S2_G3_DESTRUCTIVE_ACCEPTANCE: '1'
          MCFT_CAP08_S4_DESTRUCTIVE_ACCEPTANCE: '1'
          MCFT_CAP08_S5_V2_FORMAL_PREFLIGHT_DESTRUCTIVE: '1'
        run: |
          set -o pipefail
          pnpm -w exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_08_S5_V2_FORMAL_PREFLIGHT_DB.ts 2>&1 \
            | tee acceptance-output/MCFT_CAP_08_S5_FORMAL_CANDIDATE_RUN.log
      - name: Finalize candidate authority artifact
        env:
          MCFT_ARTIFACT_STAGE: CANDIDATE_HEAD
          MCFT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MCFT_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/governance_acceptance/mcft_cap08_s5_artifact_finalize.cjs
      - name: Cleanup formal candidate database
        if: always()
        env: { PGPASSWORD: postgres }
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=-c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='geox_mcft_cap08_s5_formal_candidate' AND pid<>pg_backend_pid();"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS geox_mcft_cap08_s5_formal_candidate;"
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap-08-s5-formal-candidate-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/
          if-no-files-found: error
          retention-days: 90

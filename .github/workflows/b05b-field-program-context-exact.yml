name: b05b-field-program-context-exact

on:
  push:
    branches:
      - ci/bline-b05b-field-program-context-exact-2026-08-27

jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Build runtime workspace dependencies
        run: |
          pnpm --filter @geox/contracts build
          pnpm --filter @geox/device-skills build
          pnpm --filter @geox/skill-registry build
      - name: Server typecheck
        run: pnpm --filter @geox/server typecheck
      - name: B-02 semantic governance
        run: node scripts/governance_acceptance/ACCEPTANCE_B02_SEMANTIC_CONTRACT_LINTER_V1.cjs
      - name: B-05a canonical context/stage contracts
        run: node --import tsx --test apps/server/src/contracts/canonical_context_v1.contract.test.ts
      - name: B-05b typed FieldProgram context projection
        run: node --import tsx --test apps/server/src/context/field_program_context_projection_v1.test.ts
      - name: B-05b capability-island no-consumer audit
        shell: bash
        run: |
          mapfile -t FILES < <(
            grep -R -l --include='*.ts' --exclude='*.test.ts' --exclude='*.acceptance.test.ts'               'projectFieldProgramDeclaredContextV1' apps/server/src || true
          )
          printf '%s\n' "${FILES[@]}"
          if [ "${#FILES[@]}" -ne 1 ] || [ "${FILES[0]}" != "apps/server/src/context/field_program_context_projection_v1.ts" ]; then
            echo "B05B_UNEXPECTED_RUNTIME_CONSUMER"
            exit 1
          fi
          echo "B05B_CAPABILITY_ISLAND_NO_CONSUMER_PASS"
      - name: B-05b no qualified-stage production producer
        shell: bash
        run: |
          if grep -R --include='*.ts' --exclude='*.test.ts' --exclude='*.acceptance.test.ts' -n             'qualifiedCropStageStateV1Schema.parse(' apps/server/src; then
            echo "B05B_QUALIFIED_STAGE_RUNTIME_PRODUCER_FOUND"
            exit 1
          fi
          echo "B05B_ZERO_QUALIFIED_STAGE_PRODUCERS_PASS"
      - name: B-03/B-04 regression boundary
        run: |
          node --import tsx --test apps/server/src/contracts/canonical_evidence_v1.contract.test.ts
          node --import tsx --test apps/server/src/evidence/raw_sample_evidence_qualification_projection_v1.test.ts
          node --import tsx --test apps/server/src/domain/judge/evidence_judge_canonical_sufficiency_shadow_v1.test.ts
      - name: Server build
        run: pnpm --filter @geox/server build
      - name: Marker
        run: |
          echo "B05B_EXACT_HEAD 669805d13b0dc22de0698299fdbb600cbf9cf8dc"
          echo "B05B_FIELD_PROGRAM_CONTEXT_PASS"

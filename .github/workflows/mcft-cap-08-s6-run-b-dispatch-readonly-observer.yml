name: mcft-cap-08-s6-run-b-dispatch-readonly-observer

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-08-s6-run-b-dispatch-readonly-observer.yml'

permissions:
  contents: read
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve one-shot broker and Formal RUN_B
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AUTHORITY_MAIN_SHA: a5039a07455e8b325db23880dd8e8c460fc6aa0d
          BROKER_WORKFLOW: mcft-cap-08-s6-run-b-replacement-001-one-shot-dispatch-broker.yml
          FORMAL_WORKFLOW: mcft-cap-08-s6-single-run-database-execution.yml
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance-output
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          headers={
            'Accept':'application/vnd.github+json',
            'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
            'X-GitHub-Api-Version':'2022-11-28',
            'User-Agent':'mcft-cap08-readonly-observer',
          }
          def get(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r:
              return json.load(r)
          repo=os.environ['REPO']; sha=os.environ['AUTHORITY_MAIN_SHA']
          def runs(workflow,event):
            w=urllib.parse.quote(workflow,safe='')
            return get(f'https://api.github.com/repos/{repo}/actions/workflows/{w}/runs?event={event}&branch=main&per_page=30').get('workflow_runs',[])
          broker=[]; formal=[]
          for _ in range(60):
            broker=[x for x in runs(os.environ['BROKER_WORKFLOW'],'push') if x.get('head_sha')==sha]
            formal=[x for x in runs(os.environ['FORMAL_WORKFLOW'],'workflow_dispatch') if x.get('head_sha')==sha]
            if broker and formal:
              break
            time.sleep(2)
          broker.sort(key=lambda x:x['created_at']); formal.sort(key=lambda x:x['created_at'])
          result={
            'schema_version':'geox_mcft_cap08_s6_run_b_dispatch_readonly_observer_v1',
            'authority_main_sha':sha,
            'broker_run_count':len(broker),
            'broker_runs':[{'id':x['id'],'run_number':x['run_number'],'run_attempt':x['run_attempt'],'status':x['status'],'conclusion':x['conclusion'],'created_at':x['created_at']} for x in broker],
            'formal_run_count':len(formal),
            'formal_runs':[{'id':x['id'],'run_number':x['run_number'],'run_attempt':x['run_attempt'],'status':x['status'],'conclusion':x['conclusion'],'created_at':x['created_at']} for x in formal],
          }
          if len(broker)!=1: raise SystemExit(f'BROKER_RUN_COUNT_{len(broker)}')
          if len(formal)!=1: raise SystemExit(f'FORMAL_RUN_COUNT_{len(formal)}')
          if broker[0]['run_attempt']!=1: raise SystemExit('BROKER_ATTEMPT_NOT_1')
          if formal[0]['run_attempt']!=1: raise SystemExit('FORMAL_ATTEMPT_NOT_1')
          with open('acceptance-output/MCFT_CAP_08_S6_RUN_B_DISPATCH_READONLY_OBSERVER.json','w') as f:
            json.dump(result,f,indent=2); f.write('\n')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap-08-s6-run-b-dispatch-readonly-observer-${{ github.run_id }}
          path: acceptance-output/
          if-no-files-found: error
          retention-days: 7

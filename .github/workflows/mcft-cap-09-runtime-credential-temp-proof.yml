name: mcft-cap-09-runtime-credential-temp-proof

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-runtime-credential-temp-proof.yml'
      - 'scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_RUNTIME_CREDENTIAL_READINESS_V1.cjs'

permissions:
  contents: read

jobs:
  verifier-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact head and base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.base.ref }}" = "main"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${{ github.event.pull_request.base.sha }}"

      - name: Syntax-check verifier
        run: node --check scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_RUNTIME_CREDENTIAL_READINESS_V1.cjs

      - name: Prove residue-aware and compatibility contract
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const p='scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_RUNTIME_CREDENTIAL_READINESS_V1.cjs';
          const s=fs.readFileSync(p,'utf8');
          const required=[
            'RESIDUE_AWARE_CURRENT_STATE_PRE_ROTATION_V1',
            'external_evidence_producer_lease_v1',
            'twin_runtime_lease_v1',
            'RUNTIME_CREDENTIAL_NON_LEASE_PRODUCTION_STATE_MUST_BE_ZERO',
            'RUNTIME_CREDENTIAL_LIVE_LEASE_OWNER_FORBIDDEN',
            'RUNTIME_CREDENTIAL_NON_EXPIRED_LEASE_RESIDUE_FORBIDDEN',
            'historical_zero_row_provisioning_verifier_reused: false',
            'credential_rematerialization_pre_rotation_ready: true',
            'a3278aec6c2134356d6a5de39da32760dbd43a71',
            'sha256:45a7109537ba10011f7dfb9a72bfc6c2b2064ae3ff6e7bf4d62e4e12fea59f69',
            'RUNTIME_CREDENTIAL_URL_READY_SUBJECT_MISMATCH',
            'RUNTIME_CREDENTIAL_URL_READY_DIGEST_MISMATCH',
            'bootstrap_password_secret_count: 2',
            'evidence_runtime_url_connectivity_proven: urlCount === 2',
            'twin_runtime_url_connectivity_proven: urlCount === 2',
            'runtime_process_start: false',
            'production_owner_activation: false',
            'formal_v5_arm: false',
            'a0_bootstrap: false',
            'o00_started: false'
          ];
          for(const m of required) if(!s.includes(m)) throw new Error('MCFT_CAP09_VERIFIER_MARKER_REQUIRED:'+m);
          for(const m of ['VERIFY_MCFT_CAP_09_PRODUCTION_SERVICE_LOGIN_READINESS_V1.cjs','MCFT_CAP_09_PRODUCTION_SERVICE_LOGIN_READINESS_V1_RESULT.json']) {
            if(s.includes(m)) throw new Error('MCFT_CAP09_HISTORICAL_ZERO_VERIFIER_REUSE_FORBIDDEN:'+m);
          }
          const proof={
            schema_version:'geox_mcft_cap09_runtime_credential_temp_proof_v1',
            status:'PASS',
            subject_sha:process.env.GITHUB_SHA,
            verifier_blob_sha1:crypto.createHash('sha1').update(Buffer.from(`blob ${Buffer.byteLength(s)}\0${s}`)).digest('hex'),
            verifier_sha256:'sha256:'+crypto.createHash('sha256').update(s).digest('hex'),
            residue_aware_current_state:true,
            immutable_ready_evidence_pins_preserved:true,
            legacy_output_compatibility_preserved:true,
            historical_zero_row_verifier_reused:false,
            runtime_mutation:false,
            credential_mutation:false,
            production_owner_activation:false,
            formal_v5_arm:false
          };
          fs.mkdirSync('acceptance-output',{recursive:true});
          fs.writeFileSync('acceptance-output/MCFT_CAP_09_RUNTIME_CREDENTIAL_TEMP_PROOF_V1.json',JSON.stringify(proof,null,2)+'\n');
          console.log(JSON.stringify(proof,null,2));

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-runtime-credential-temp-proof-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/MCFT_CAP_09_RUNTIME_CREDENTIAL_TEMP_PROOF_V1.json
          if-no-files-found: error
          retention-days: 90

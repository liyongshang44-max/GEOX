## W23 — Pitfalls / mistakes already encountered; do not repeat

### W23.1 — Do not confuse "resolver is injectable" with "production rolling authority is enabled"

#3506 only exposes the injection seam in Process V2.

The zero-argument production entrypoint still selects static mounted authority.

### W23.2 — Do not let scheduled candidate artifacts bypass graduation

Candidate production and effective authority are separate states.

Only graduated runtime-consumable authority may be indexed by the registry-backed resolver.

### W23.3 — Do not solve exact-routing failures by widening the file count

A real failure was caused by the owner-cutover workflow filename typo.

The correct fix was the exact path correction, not `expected_files += 1`.

### W23.4 — Do not treat intermediate carrier heads as qualification subjects

Several temporary heads existed while QCP predecessor governance, workflow file permissions, routing path correction, and evidence registration were being settled.

Only the final clean head `b7c6ebf...` may be used for the current qualification claim.

### W23.5 — Do not trust an Actions local commit if push failed

A local runner commit / blob / tree is not equivalent to branch state.

Always re-read the remote PR head after a workflow claims it created a commit.

### W23.6 — GitHub workflow-write permission is a transport constraint, not an architecture defect

Actions integration was unable to push commits that changed workflow files in some settlement attempts.

The correct response was to separate content generation from top-level Git ref update / finalization, not to loosen production or QCP governance.

### W23.7 — Fresh evidence must be registered only after exact workflow success

The Production Routing evidence was registered only after a real successful exact-head routing run and planner-derived dependency digest were verified.

Never fabricate or carry forward stale evidence to make QCP green.

### W23.8 — Keep B-Line independent

MCFT main advancement does not automatically rebase, qualify, or authorize B-Line W6 work.

No B-Line implementation delta exists in #3506.

### W23.9 — Do not reopen Phase6-retired manual dispatch

The correct architecture remains `manual=false` for the retired production trigger.

Do not add a production-capable `workflow_dispatch` merely to satisfy historical acceptance text.

### W23.10 — Do not start Formal-v5 / A0 / O00–O23 just because #3506 is qualified

This successor is bounded wiring/adoption qualification only.

Those later fronts require their own explicit authority and prerequisite checks.


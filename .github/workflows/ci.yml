name: mcft-cap09-handoff-prepend-w-section

on:
  push:
    branches:
      - docs/mcft-cap09-handoff-2026-08-26-phase2-evidence-module-frontier

permissions:
  contents: write

jobs:
  prepend-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout handoff branch
        uses: actions/checkout@v4
        with:
          ref: docs/mcft-cap09-handoff-2026-08-26-phase2-evidence-module-frontier
          fetch-depth: 0

      - name: Prepend W-section without rewriting historical sections
        run: |
          python - <<'PY'
          from pathlib import Path
          handoff = Path('docs/handoff/GEOX-MCFT-CAP-09-HANDOFF-2026-08-27.md')
          payload = Path('docs/handoff/.MCFT-CAP-09-W-SECTION-TEMP.md')
          old = handoff.read_text(encoding='utf-8')
          section = payload.read_text(encoding='utf-8').rstrip()
          marker = '# W — Twin V2 Runtime Selection Adoption / Registry-Backed Resolver Wiring Qualification Frontier'
          if marker not in old:
              handoff.write_text(section + '\n\n' + old, encoding='utf-8')
              print('prepended W-section')
          else:
              print('W-section already present; no-op')
          PY

      - name: Validate handoff-only working-tree change
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo 'nothing to commit'
            exit 0
          fi
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only)" = "docs/handoff/GEOX-MCFT-CAP-09-HANDOFF-2026-08-27.md"
          grep -Fq '# W — Twin V2 Runtime Selection Adoption / Registry-Backed Resolver Wiring Qualification Frontier' docs/handoff/GEOX-MCFT-CAP-09-HANDOFF-2026-08-27.md
          grep -Fq '# V — Twin V2 Rolling Stage Authority Resolver Seam / Protected-Main Governance / EA5E2 Rebind Settlement Frontier' docs/handoff/GEOX-MCFT-CAP-09-HANDOFF-2026-08-27.md

      - name: Commit and push handoff prepend only
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/handoff/GEOX-MCFT-CAP-09-HANDOFF-2026-08-27.md
          git commit -m 'docs(mcft-cap09): hand off Twin V2 runtime selection adoption frontier'
          git push origin HEAD:docs/mcft-cap09-handoff-2026-08-26-phase2-evidence-module-frontier

name: mcft-cap-09-t3r1-persisted-a0-authority

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-t3r1-persisted-a0-authority.yml'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-T3R1-PERSISTED-A0-AUTHORITY-V1.json'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA5E2-T3R1-FRESH-BOOTSTRAP-EFFECTIVENESS-V1.json'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S6-FORMAL-CROP-CONTEXT-AUTHORITY-V2.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_T3R1_PERSISTED_A0_AUTHORITY.cjs'
      - 'scripts/runtime_acceptance/PREFLIGHT_MCFT_CAP_09_EA5E2_FORMAL_SNAPSHOT_READINESS.ts'
      - 'scripts/runtime_acceptance/RUN_MCFT_CAP_09_EA5E2_OPERATIONAL_ACTIVATION_OBSERVER.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcft-cap-09-t3r1-persisted-a0-authority.yml'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-T3R1-PERSISTED-A0-AUTHORITY-V1.json'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA5E2-T3R1-FRESH-BOOTSTRAP-EFFECTIVENESS-V1.json'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S6-FORMAL-CROP-CONTEXT-AUTHORITY-V2.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_T3R1_PERSISTED_A0_AUTHORITY.cjs'
      - 'scripts/runtime_acceptance/PREFLIGHT_MCFT_CAP_09_EA5E2_FORMAL_SNAPSHOT_READINESS.ts'
      - 'scripts/runtime_acceptance/RUN_MCFT_CAP_09_EA5E2_OPERATIONAL_ACTIVATION_OBSERVER.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcft-cap09-t3r1-persisted-a0-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  persisted-a0-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact persisted T3R1 A0 authority
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_T3R1_PERSISTED_A0_AUTHORITY.cjs

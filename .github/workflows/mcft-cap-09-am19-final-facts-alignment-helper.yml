name: MCFT-CAP-09 AM19 final facts alignment helper

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mcft-cap-09-am19-final-facts-alignment-helper.yml'

permissions:
  contents: write

jobs:
  apply-and-remove-helper:
    if: github.event.pull_request.head.ref == 'agent/mcft-cap09-am19-persistent-facts-schema-alignment'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mcft-cap09-am19-persistent-facts-schema-alignment
          fetch-depth: 0
          persist-credentials: true

      - name: Require exact base and bounded branch state
        shell: bash
        run: |
          set -euo pipefail
          BASE='530b857765da471a442727daee9687206059e5c4'
          TARGET='scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_24T_QUALIFICATION_V1.ts'
          HELPER='.github/workflows/mcft-cap-09-am19-final-facts-alignment-helper.yml'
          mapfile -t changed < <(git diff --name-only "$BASE" HEAD | sort)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx "$TARGET"
          printf '%s\n' "${changed[@]}" | grep -Fx "$HELPER"

      - name: Align fixture inserts with production facts contract
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_24T_QUALIFICATION_V1.ts')
          text = path.read_text(encoding='utf-8')
          old = '''    `INSERT INTO facts (fact_id,occurred_at,source,record_json,ingested_at)
     VALUES ($1,$2::timestamptz,$3,$4::jsonb,$5::timestamptz)
     ON CONFLICT (fact_id) DO NOTHING`,
    [factId, eventTime(record), EVIDENCE_SOURCE, JSON.stringify({ type: record.record_type, payload: record }), String(record.role_time?.ingested_at)],'''
          new = '''    `INSERT INTO facts (fact_id,occurred_at,source,record_json)
     VALUES ($1,$2::timestamptz,$3,$4::jsonb)
     ON CONFLICT (fact_id) DO NOTHING`,
    [factId, eventTime(record), EVIDENCE_SOURCE, JSON.stringify({ type: record.record_type, payload: record })],'''
          if text.count(old) != 1:
              raise SystemExit(f'AM19_FIXTURE_EXACT_OLD_SNIPPET_REQUIRED:{text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')

      - name: Remove helper and verify final one-file boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE='530b857765da471a442727daee9687206059e5c4'
          TARGET='scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_24T_QUALIFICATION_V1.ts'
          HELPER='.github/workflows/mcft-cap-09-am19-final-facts-alignment-helper.yml'
          git rm "$HELPER"
          git diff --check
          mapfile -t changed < <(git diff --name-only "$BASE" | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$TARGET"
          git diff -- "$TARGET"

      - name: Commit final focused repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'MCFT-CAP-09: align AM19 fixture facts with production schema'
          git push origin HEAD:agent/mcft-cap09-am19-persistent-facts-schema-alignment

name: mcft-cap-08-s6-formal-run-a-bootstrap-freshness-correction

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-08-s6-formal-run-a-bootstrap-freshness-correction.yml'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-FORMAL-RUN-A-REPLACEMENT-003-BOOTSTRAP-FRESHNESS-FAILURE-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-FORMAL-RUN-A-BOOTSTRAP-FRESHNESS-CORRECTION-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-FORMAL-RUN-A-BOOTSTRAP-FRESHNESS-CORRECTION-BOUNDARY-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-LOADER-CORRECTED-FORMAL-RUN-A-EXECUTION-AUTHORITY-EFFECTIVE-V1.json'
      - 'scripts/runtime_acceptance/mcft_cap08_s6_single_run_ports/fresh_database_v1.cjs'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_FORMAL_RUN_A_BOOTSTRAP_FRESHNESS_CORRECTION_V1.cjs'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: mcft-cap08-s6-formal-run-a-bootstrap-freshness-correction-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  bootstrap-freshness-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact correction head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
      - name: Validate bootstrap-aware formal freshness predicate and consumed authority retirement
        env:
          MCFT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_FORMAL_RUN_A_BOOTSTRAP_FRESHNESS_CORRECTION_V1.cjs
      - name: Upload correction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap-08-s6-formal-run-a-bootstrap-freshness-correction-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: acceptance-output/MCFT_CAP_08_S6_FORMAL_RUN_A_BOOTSTRAP_FRESHNESS_CORRECTION_RESULT.json
          if-no-files-found: error
          retention-days: 90

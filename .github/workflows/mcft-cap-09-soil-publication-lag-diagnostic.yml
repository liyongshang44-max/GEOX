name: mcft-cap-09-soil-publication-lag-diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-soil-publication-lag-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe-endpoint25:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare production and no-cache endpoint 25 metadata
        shell: node {0}
        run: |
          const crypto=require('node:crypto');
          const fs=require('node:fs');
          (async()=>{
            const endpoint='https://lter.kbs.msu.edu/weather/variates/25';
            async function sample(label,extraHeaders={}) {
              const requestedAt=new Date();
              const response=await fetch(endpoint,{method:'GET',redirect:'follow',headers:{Accept:'application/json,*/*;q=0.5','User-Agent':'GEOX-MCFT-CAP09-EA5C2B1/1',...extraHeaders},signal:AbortSignal.timeout(30000)});
              const bytes=Buffer.from(await response.arrayBuffer());
              const retrievedAt=new Date();
              if(!response.ok) throw new Error(`KBS_SOIL_DIAGNOSTIC_HTTP:${label}:${response.status}`);
              const parsed=JSON.parse(bytes.toString('utf8'));
              if(!Array.isArray(parsed)) throw new Error('KBS_SOIL_DIAGNOSTIC_ARRAY_REQUIRED');
              const timestamps=[...new Set(parsed.map(v=>v&&typeof v==='object'&&typeof v.time==='string'&&Number.isFinite(Date.parse(v.time))?new Date(Date.parse(v.time)).toISOString():null).filter(Boolean))].sort();
              if(!timestamps.length) throw new Error('KBS_SOIL_DIAGNOSTIC_TIMESTAMP_REQUIRED');
              const latest=timestamps.at(-1);
              return {label,requested_at:requestedAt.toISOString(),retrieved_at:retrievedAt.toISOString(),latest_timestamp:latest,latest_age_minutes:Number(((retrievedAt-Date.parse(latest))/60000).toFixed(3)),timestamp_tail:timestamps.slice(-8),timestamp_tail_gaps_minutes:timestamps.slice(-8).slice(1).map((v,i)=>(Date.parse(v)-Date.parse(timestamps.slice(-8)[i]))/60000),timestamp_chain_sha256:`sha256:${crypto.createHash('sha256').update(timestamps.join('\n')).digest('hex')}`,response_sha256:`sha256:${crypto.createHash('sha256').update(bytes).digest('hex')}`,response_bytes:bytes.length,response_date_header:response.headers.get('date'),cache_control:response.headers.get('cache-control'),age_header:response.headers.get('age'),etag:response.headers.get('etag'),last_modified:response.headers.get('last-modified'),expires:response.headers.get('expires'),raw_values_emitted:false};
            }
            const production=await sample('PRODUCTION_HEADERS');
            const noCache=await sample('NO_CACHE_HEADERS',{'Cache-Control':'no-cache',Pragma:'no-cache'});
            const proof={schema_version:'geox_mcft_cap09_soil_cache_semantics_diagnostic_v1',status:'PASS',endpoint_id:25,production,no_cache:noCache,same_latest_timestamp:production.latest_timestamp===noCache.latest_timestamp,same_timestamp_chain:production.timestamp_chain_sha256===noCache.timestamp_chain_sha256,same_response_body:production.response_sha256===noCache.response_sha256,public_value_artifact_count:0,raw_values_emitted:false};
            fs.mkdirSync('acceptance-output',{recursive:true});
            fs.writeFileSync('acceptance-output/MCFT_CAP_09_SOIL_PUBLICATION_LAG_DIAGNOSTIC.json',JSON.stringify(proof,null,2)+'\n');
            console.log(JSON.stringify(proof));
          })().catch(e=>{console.error(e instanceof Error?`${e.name}:${e.message}`:String(e));process.exitCode=1});
      - name: Upload metadata-only diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-soil-publication-lag-diagnostic
          path: acceptance-output/MCFT_CAP_09_SOIL_PUBLICATION_LAG_DIAGNOSTIC.json
          if-no-files-found: warn
          retention-days: 1

name: mcft-cap-08-s6-ha-mapping-governance

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-08-s6-ha-mapping-governance.yml'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-CLOSURE-CONTRACT-WITNESS-MAPPING-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-CLOSURE-MEMBER-MANIFEST-CONTRACT-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-HA-MAPPING-BOUNDARY-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-HA-MAPPING-RULES-00-08-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-HA-MAPPING-RULES-09-16-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-HA-MAPPING-RULES-17-23-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-HA-PROOF-CONTRACTS-00-08-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-HA-PROOF-CONTRACTS-09-16-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-HA-PROOF-CONTRACTS-17-23-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-HA-WITNESS-MAPPING-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-WITNESS-LIFECYCLE-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_LEDGER_COVERAGE.cjs'
      - 'scripts/governance_acceptance/mcft_cap08_s6_ha_mapping_validation.cjs'
      - 'scripts/governance_acceptance/mcft_cap08_s6_materialize_ha_mapping_review.cjs'
      - 'scripts/governance_acceptance/mcft_cap08_s6_witness_contract_validation.cjs'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: mcft-cap08-s6-ha-mapping-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  s6-ha-mapping-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
      - name: Validate Ledger-derived mapping and lifecycle
        env:
          MCFT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_LEDGER_COVERAGE.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap-08-s6-ha-mapping-governance-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: |
            acceptance-output/MCFT_CAP_08_S6_LEDGER_COVERAGE_RESULT.json
            acceptance-output/MCFT_CAP_08_S6_HA_MAPPING_REVIEW.json
            acceptance-output/MCFT_CAP_08_S6_HA_MAPPING_REVIEW.md
          if-no-files-found: error
          retention-days: 90

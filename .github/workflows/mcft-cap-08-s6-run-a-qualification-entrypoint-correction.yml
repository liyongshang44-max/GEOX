name: mcft-cap-08-s6-run-a-qualification-entrypoint-correction

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-08-s6-run-a-qualification-entrypoint-correction.yml'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-RUN-A-QUALIFICATION-ENTRYPOINT-CORRECTION-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-RUN-A-QUALIFICATION-ENTRYPOINT-CORRECTION-BOUNDARY-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-RUN-A-QUALIFICATION-FAILED-ATTEMPT-001-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_RUN_A_QUALIFICATION_ENTRYPOINT_CORRECTION.cjs'
      - 'scripts/runtime_acceptance/mcft_cap08_s6_single_run_workflow/qualification_workflow_entrypoint_v1.ts'

permissions:
  contents: read

jobs:
  qualification-entrypoint-correction-static-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate failed attempt record and CJS-safe entrypoint correction
        env:
          MCFT_BASE_SHA: 6a892f4876a61a0522599d839a5dca971ab22b91
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_RUN_A_QUALIFICATION_ENTRYPOINT_CORRECTION.cjs
      - name: Upload entrypoint correction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap-08-s6-run-a-qualification-entrypoint-correction-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/MCFT_CAP_08_S6_RUN_A_QUALIFICATION_ENTRYPOINT_CORRECTION_RESULT.json
          if-no-files-found: error
          retention-days: 90

name: pfe-14-mcft09-read-dependency-readjudication-v1

on:
  pull_request:
    paths:
      - 'docs/frontend-productization/PFE-14-MCFT09-READ-DEPENDENCY-READJUDICATION-V1.md'
      - 'docs/frontend-productization/PFE-14-MCFT09-READ-DEPENDENCY-READJUDICATION-V1.json'
      - 'docs/frontend-productization/PFE-14-CURRENT-AUTHORITY.json'
      - 'docs/frontend-productization/PFE-14-MCFT-09-DEPENDENCY-MAP.json'
      - 'scripts/frontend_acceptance/ACCEPTANCE_PFE_14_MCFT09_READ_DEPENDENCY_READJUDICATION_V1.cjs'
      - '.github/workflows/pfe-14-mcft09-read-dependency-readjudication-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-readjudication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify read dependency re-adjudication
        run: node scripts/frontend_acceptance/ACCEPTANCE_PFE_14_MCFT09_READ_DEPENDENCY_READJUDICATION_V1.cjs

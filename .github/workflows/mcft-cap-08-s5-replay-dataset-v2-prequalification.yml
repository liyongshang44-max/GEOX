name: mcft-cap-08-s5-replay-dataset-v2-prequalification

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-08-s5-replay-dataset-v2-prequalification.yml'
      - '.github/workflows/mcft-cap-08-s5-architecture-deviation-adjudication.yml'
      - '.github/workflows/mcft-cap-08-s5-replay-dataset-v2-exact-sha-attestation.yml'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S5-ARCHITECTURE-DEVIATION-STATUS-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S5-REPLAY-DATASET-V2-WORKFLOW-DECLARATION-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S5_REPLAY_DATASET_V2_PREQUALIFICATION_BOUNDARY.cjs'
      - 'scripts/governance_acceptance/mcft_cap08_s5_replay_dataset_v2_artifact_finalize.cjs'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_08_S5_REPLAY_DATASET_V2_PREQUALIFICATION_DB.ts'
      - 'scripts/runtime_acceptance/mcft_cap08_s5_prequalification_compute_v1.ts'
      - 'scripts/runtime_acceptance/mcft_cap08_s5_replay_dataset_v2_prequalification_support_v1.ts'

permissions:
  contents: read

concurrency:
  group: mcft-cap08-s5-v2-pq-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  prequalification:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with: { ref: '${{ github.event.pull_request.head.sha || github.sha }}', fetch-depth: 0, persist-credentials: false }
      - name: Classify S5 prequalification lifecycle
        id: lifecycle
        env:
          MCFT_BASE_SHA: '${{ github.event.pull_request.base.sha }}'
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff --name-only "$MCFT_BASE_SHA"...HEAD | sort)"
          lifecycle_files="$(printf '%s\n' \
            '.github/workflows/mcft-cap-08-current-frontier-reconciliation.yml' \
            '.github/workflows/mcft-cap-08-s5-effectiveness-settlement.yml' \
            '.github/workflows/mcft-cap-08-s5-replay-dataset-v2-prequalification.yml' \
            'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_CURRENT_FRONTIER_RECONCILIATION.cjs' | sort)"
          if [[ "$files" == "$lifecycle_files" ]]; then
            mode='lifecycle-repair'
          elif grep -Fxq 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S5-EFFECTIVENESS-AUTHORITY-V1.json' <<<"$files"; then
            mode='exact-settlement'
          elif grep -Eq 'S5_REPLAY_DATASET_V2_PREQUALIFICATION|mcft_cap08_s5_prequalification|replay-dataset-v2|mcft-cap-08-s5-architecture-deviation-adjudication' <<<"$files"; then
            mode='exact-prequalification'
          else
            mode='successor-inactive'
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Validate lifecycle route
        env:
          MCFT_BASE_SHA: '${{ github.event.pull_request.base.sha }}'
          MCFT_MODE: '${{ steps.lifecycle.outputs.mode }}'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance-output
          case "$MCFT_MODE" in
            lifecycle-repair)
              node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_CURRENT_FRONTIER_RECONCILIATION.cjs --lifecycle-repair
              ;;
            exact-settlement)
              node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S5_EFFECTIVENESS_SETTLEMENT.cjs
              cp acceptance-output/MCFT_CAP_08_S5_EFFECTIVENESS_SETTLEMENT_RESULT.json acceptance-output/MCFT_CAP_08_CURRENT_FRONTIER_RECONCILIATION_RESULT.json
              ;;
            exact-prequalification)
              node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S5_REPLAY_DATASET_V2_PREQUALIFICATION_BOUNDARY.cjs | tee acceptance-output/MCFT_CAP_08_CURRENT_FRONTIER_RECONCILIATION_RESULT.json
              ;;
            successor-inactive)
              printf '%s\n' '{"status":"PASS","mode":"SUCCESSOR_INACTIVE","database_reexecution":false}' > acceptance-output/MCFT_CAP_08_CURRENT_FRONTIER_RECONCILIATION_RESULT.json
              ;;
            *) exit 1 ;;
          esac
      - if: steps.lifecycle.outputs.mode == 'exact-prequalification'
        uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - if: steps.lifecycle.outputs.mode == 'exact-prequalification'
        uses: actions/setup-node@v4
        with: { node-version: 20.11.1, cache: pnpm }
      - name: Install locked workspace
        if: steps.lifecycle.outputs.mode == 'exact-prequalification'
        run: pnpm install --frozen-lockfile
      - name: Typecheck server and acceptance source
        if: steps.lifecycle.outputs.mode == 'exact-prequalification'
        run: pnpm --filter @geox/server typecheck
      - name: Bootstrap fresh prequalification database
        if: steps.lifecycle.outputs.mode == 'exact-prequalification'
        env:
          MCFT_CAAP08_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          MCFT_CAP08_TARGET_DATABASE_NAME: geox_mcft_cap08_s5_v2_pq
          MCFT_CAP08_RUNNER_PASSWORD: cap08-s5-v2-pq-runner-password
          MCFT_CAP08_MIGRATOR_PASSWORD: cap08-s5-v2-pq-migrator-password
          MCFT_CAP08_LEGACY_RUNTIME_PASSWORD: cap08-s5-v2-pq-legacy-password
          MCFT_CANDIDATE_SHA: '${{ github.event.pull_request.head.sha || github.sha }}'
        run: pnpm -w exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_08_PLATFORM_SECURITY_BOOTSTRAP_DB.ts
      - name: Reexecute v2 S1-S4 and qualify 24 Residual roots
        if: steps.lifecycle.outputs.mode == 'exact-prequalification'
        env:
          DATABASE_URL: postgres://geox_mcft_cap08_runner_v1:cap08-s5-v2-pq-runner-password@127.0.0.1:5432/geox_mcft_cap08_s5_v2_pq
          MCFT_CAP08_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/geox_mcft_cap08_s5_v2_pq
          MCFT_CAP08_S2_G3_DESTRUCTIVE_ACCEPTANCE: '1'
          MCFT_CAP08_S4_DESTRUCTIVE_ACCEPTANCE: '1'
          MCFT_CAP08_S5_V2_PREQUALIFICATION_DESTRUCTIVE: '1'
        run: pnpm -w exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_08_S5_REPLAY_DATASET_V2_PREQUALIFICATION_DB.ts
      - name: Cleanup database
        if: ${{ always() && steps.lifecycle.outputs.mode == 'exact-prequalification' }}
        env: { PGPASSWORD: postgres }
        run: |
          if psql -h 127.0.0.1 -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='geox_mcft_cap08_s5_v2_pq'" | grep -qx 1; then
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='geox_mcft_cap08_s5_v2_pq' AND pid<>pg_backend_pid();"
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE geox_mcft_cap08_s5_v2_pq;"
          fi
      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap-08-s5-v2-pq-${{ github.event.pull_request.head.sha || github.sha }}
          path: acceptance-output/
          if-no-files-found: error
          retention-days: 90

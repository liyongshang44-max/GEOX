name: mcft-cap-08-s6-run-a-qualification-composite-range-correction-effectiveness

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-08-s6-run-a-qualification-composite-range-correction-effectiveness.yml'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-RUN-A-QUALIFICATION-COMPOSITE-RANGE-CORRECTION-EFFECTIVENESS-AUTHORITY-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-RUN-A-QUALIFICATION-COMPOSITE-RANGE-CORRECTION-EFFECTIVENESS-BOUNDARY-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-RUN-A-QUALIFICATION-COMPOSITE-RANGE-REPLACEMENT-AUTHORITY-ISSUANCE-GATE-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_RUN_A_QUALIFICATION_COMPOSITE_RANGE_CORRECTION_EFFECTIVENESS.cjs'

permissions:
  contents: read

jobs:
  composite-range-correction-effectiveness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
      - name: Validate merged composite range correction effectiveness
        env:
          MCFT_BASE_SHA: 32cc521510dcbfb655c9820715f79de764c45e48
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_RUN_A_QUALIFICATION_COMPOSITE_RANGE_CORRECTION_EFFECTIVENESS.cjs
      - name: Upload composite range correction effectiveness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap-08-s6-composite-range-correction-effectiveness-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/MCFT_CAP_08_S6_RUN_A_QUALIFICATION_COMPOSITE_RANGE_CORRECTION_EFFECTIVENESS_RESULT.json
          if-no-files-found: error
          retention-days: 90

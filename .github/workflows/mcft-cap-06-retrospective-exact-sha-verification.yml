name: temp-mcft-cap09-handoff-x-materializer

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-06-retrospective-exact-sha-verification.yml'

permissions:
  contents: read

jobs:
  materialize-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Materialize exact X-section pure prepend
        env:
          X_BZ2_B64: ''
        run: |
          python - <<'PY'
          import base64,bz2,hashlib,json,os,pathlib,subprocess
          p=pathlib.Path('docs/handoff/GEOX-MCFT-CAP-09-HANDOFF-2026-08-27.md')
          old=p.read_bytes(); old_blob=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          assert old_blob=='1b01cdc6ff14b6d865e683268f0965d8c0b368a5', old_blob
          x=bz2.decompress(base64.b64decode(os.environ['X_BZ2_B64']))
          assert hashlib.sha256(x).hexdigest()=='6c72c78968c674bcb42e653a010cd5b28d94333cb5bc2f54418d2fab65d85393'
          new=x+old; assert new[len(x):]==old
          p.write_bytes(new)
          out={'status':'PASS','old_handoff_blob_sha':old_blob,'new_handoff_blob_sha':subprocess.check_output(['git','hash-object',str(p)],text=True).strip(),'old_bytes':len(old),'prepend_bytes':len(x),'new_bytes':len(new),'prepend_sha256':hashlib.sha256(x).hexdigest(),'pure_prepend':True,'historical_w_and_earlier_preserved_byte_for_byte':True,'repository_ref_updated':False}
          pathlib.Path('acceptance-output').mkdir(exist_ok=True); pathlib.Path('acceptance-output/MCFT_CAP_09_HANDOFF_X_MATERIALIZER.json').write_text(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-handoff-x-materializer-${{ github.event.pull_request.head.sha }}
          path: |
            docs/handoff/GEOX-MCFT-CAP-09-HANDOFF-2026-08-27.md
            acceptance-output/MCFT_CAP_09_HANDOFF_X_MATERIALIZER.json
          if-no-files-found: error
          retention-days: 30

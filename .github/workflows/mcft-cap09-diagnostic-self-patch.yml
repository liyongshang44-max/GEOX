name: mcft-cap09-diagnostic-self-patch

on:
  push:
    branches:
      - diag/mcft-cap09-failure-discovery-gate-v1
    paths:
      - '.github/workflows/mcft-cap09-diagnostic-self-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/mcft-cap09-failure-discovery-gate-v1
          fetch-depth: 0

      - name: Apply exact process-boundary classifier adapter
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PHASE5_PROCESS_BOUNDARY_V1.ts')
          text = path.read_text()
          old = '''    failure_classifier: new McftCap09ProductionEvidenceFailureClassifierV1(),'''
          new = '''    failure_classifier: {
              classify(error) {
                const classification = new McftCap09ProductionEvidenceFailureClassifierV1().classify(error);
                return classification === "RETRYABLE" ? "RETRYABLE" : "FATAL";
              },
            },'''
          if text.count(old) != 1:
              raise SystemExit('PROCESS_BOUNDARY_EVIDENCE_POOL_CLASSIFIER_SOURCE_MISMATCH')
          path.write_text(text.replace(old, new))

      - name: Commit exact source patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name 'GEOX CI Diagnostic Patch'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PHASE5_PROCESS_BOUNDARY_V1.ts
          git diff --cached --exit-code && { echo 'NO_PATCH_REQUIRED'; exit 0; } || true
          git commit -m 'fix(runtime): adapt pool classifier boundary'
          git push origin HEAD:diag/mcft-cap09-failure-discovery-gate-v1

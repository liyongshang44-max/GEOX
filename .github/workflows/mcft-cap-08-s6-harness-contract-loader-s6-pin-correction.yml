name: mcft-cap-08-s6-harness-contract-loader-s6-pin-correction

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-08-s6-harness-contract-loader-s6-pin-correction.yml'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-HARNESS-CONTRACT-LOADER-S6-PIN-CORRECTION-BOUNDARY-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-HARNESS-CONTRACT-LOADER-S6-PIN-CORRECTION-ADJUDICATION-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_HARNESS_CONTRACT_LOADER_S6_PIN_CORRECTION_V1.cjs'
      - 'scripts/runtime_acceptance/mcft_cap08_s6_single_run_db/contract_loader_v1.cjs'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: mcft-cap08-s6-harness-contract-loader-s6-pin-correction-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  contract-loader-pin-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact correction head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
      - name: Validate exact S6 pin advancement and no-database harness reachability
        env:
          MCFT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_HARNESS_CONTRACT_LOADER_S6_PIN_CORRECTION_V1.cjs
      - name: Upload correction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap-08-s6-harness-contract-loader-s6-pin-correction-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: acceptance-output/MCFT_CAP_08_S6_HARNESS_CONTRACT_LOADER_S6_PIN_CORRECTION_RESULT.json
          if-no-files-found: error
          retention-days: 90

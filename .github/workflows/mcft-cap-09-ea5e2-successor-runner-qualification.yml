name: mcft-cap-09-ea5e2-successor-runner-qualification

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-ea5e2-**'
      - '.github/workflows/mcft-cap-09-rolling-**'
      - 'scripts/runtime_acceptance/*MCFT_CAP_09_EA5E2*'
      - 'scripts/runtime_acceptance/*MCFT_CAP_09_KBS*'
      - 'scripts/runtime_acceptance/*MCFT_CAP_09_GFS*'
      - 'scripts/runtime_acceptance/*MCFT_CAP_09_ROLLING*'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2*'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_ROLLING*'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA5E2*'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-T3R1-PERSISTED-A0-AUTHORITY-V1.json'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S6-FORMAL-CROP-CONTEXT-AUTHORITY-V2.json'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-AMENDMENT-11-PROVIDER-AVAILABILITY-WATERMARK-AUTHORITY.md'
      - 'docs/digital_twin/mcft/GEOX-MCFT-00-CONFIGURATION-BINDING-MATRIX.json'
      - 'apps/server/src/domain/twin_runtime/**'
      - 'apps/server/src/runtime/twin_runtime/**'
      - 'apps/server/src/persistence/twin_runtime/**'
      - 'apps/server/src/external_evidence/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'apps/server/package.json'
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mcft-cap09-ea5e2-successor-runner-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  exact-head-successor-runner-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact repository dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned KBS/GFS decoder stack and prove product GFS core
        run: |
          python -m pip install --disable-pip-version-check \
            'eccodes==2.47.0' \
            'eccodeslib==2.47.3.23' \
            'numpy==1.26.4' \
            'refet==0.4.2'
          python -m eccodes selfcheck
          python apps/server/src/external_evidence/provider/python/mcft_cap09_gfs_scientific_core_v1.py selftest
          python apps/server/src/external_evidence/provider/python/mcft_cap09_gfs_raw_bundle_decoder_v1.py selftest
          python scripts/runtime_acceptance/MCFT_CAP_09_EA5E2_LIVE_PROVIDER_TWO_PHASE.py selftest-gfs-selection
          python scripts/runtime_acceptance/MCFT_CAP_09_EA5E2_LIVE_PROVIDER_TWO_PHASE.py selftest-et0-decimal-normalization
      - name: Prove GFS product and successor qualification identity boundary
        shell: python
        run: |
          import ast
          import json
          import pathlib
          import re
          import subprocess

          root = pathlib.Path.cwd()
          historical = "scripts/runtime_acceptance/PROBE_MCFT_CAP_09_EA4_LIVE_SOURCE_EXACT_HEAD_QUALIFICATION.py"
          successor = "scripts/runtime_acceptance/MCFT_CAP_09_EA5E2_LIVE_PROVIDER_TWO_PHASE.py"
          core = "apps/server/src/external_evidence/provider/python/mcft_cap09_gfs_scientific_core_v1.py"
          bundle_decoder = "apps/server/src/external_evidence/provider/python/mcft_cap09_gfs_raw_bundle_decoder_v1.py"
          ts_decoder = "apps/server/src/external_evidence/provider/gfs_raw_bundle_evidence_decoder_v1.ts"
          graph = "scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_RUNTIME_DEPENDENCY_GRAPH_V4.cjs"
          pinned_historical_blob = "ff2ad210387402a74731968e14746210fd2440dd"

          actual_historical_blob = subprocess.check_output(
              ["git", "rev-parse", f"HEAD:{historical}"], text=True
          ).strip()
          if actual_historical_blob != pinned_historical_blob:
              raise SystemExit(f"GFS_PRODUCT_IDENTITY_HISTORICAL_EA4_DRIFT:{actual_historical_blob}")

          successor_text = (root / successor).read_text(encoding="utf-8")
          core_text = (root / core).read_text(encoding="utf-8")
          bundle_decoder_text = (root / bundle_decoder).read_text(encoding="utf-8")
          ts_decoder_text = (root / ts_decoder).read_text(encoding="utf-8")
          graph_text = (root / graph).read_text(encoding="utf-8")
          decode_start = successor_text.index("def command_decode_gfs")
          decode_end = successor_text.index("def command_decode_kbs_late", decode_start)
          decode_text = successor_text[decode_start:decode_end]

          successor_required = [
              "mcft_cap09_gfs_raw_bundle_decoder_v1.py",
              "gfs_bundle_decoder.decode_bundle_v1",
              "product_gfs_raw_bundle_decoder_used",
              "product_gfs_scientific_core_used",
          ]
          for marker in successor_required:
              if marker not in successor_text:
                  raise SystemExit(f"GFS_PRODUCT_IDENTITY_SUCCESSOR_DELEGATION_MISSING:{marker}")

          product_decoder_required = [
              "core.decode_pgrb2_v1",
              "core.decode_sflux_v1",
              "core.assemble_72h_scientific_series_v1",
              "build_drafts_v1",
          ]
          for marker in product_decoder_required:
              if marker not in bundle_decoder_text:
                  raise SystemExit(f"GFS_PRODUCT_IDENTITY_PRODUCT_DECODER_MARKER_MISSING:{marker}")

          if "mcft_cap09_gfs_raw_bundle_decoder_v1.py" not in ts_decoder_text:
              raise SystemExit("GFS_PRODUCT_IDENTITY_TS_DECODER_DRIVER_BINDING_MISSING")

          for forbidden in [
              "ea4.decode_pgrb2(",
              "ea4.decode_sflux(",
              "ea4.apcp(",
              "ea4.block_start(",
              "ea4.scalar_eto(",
          ]:
              if forbidden in decode_text:
                  raise SystemExit(f"GFS_PRODUCT_IDENTITY_SECOND_SCIENTIFIC_PATH:{forbidden}")

          imported_modules = []
          for source_name, source_text in ((core, core_text), (bundle_decoder, bundle_decoder_text)):
              tree = ast.parse(source_text, filename=source_name)
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      imported_modules.extend(alias.name for alias in node.names)
                  elif isinstance(node, ast.ImportFrom):
                      imported_modules.append(node.module or "")

          forbidden_import_prefixes = (
              "scripts.runtime_acceptance",
              "urllib",
              "requests",
              "httpx",
              "psycopg",
              "psycopg2",
              "sqlalchemy",
          )
          for module in imported_modules:
              if any(module == prefix or module.startswith(prefix + ".") for prefix in forbidden_import_prefixes):
                  raise SystemExit(f"GFS_PRODUCT_CORE_FORBIDDEN_IMPORT:{module}")
              if "twin_runtime" in module.split("."):
                  raise SystemExit(f"GFS_PRODUCT_CORE_RUNTIME_IMPORT_FORBIDDEN:{module}")

          precise_forbidden_patterns = [
              ("DIRECT_SQL", re.compile(r"\bINSERT\s+INTO\b", re.IGNORECASE)),
              ("RUNTIME_TICK_CURSOR", re.compile(r"\bRuntimeTickCursor\b")),
              ("OS_ENVIRON", re.compile(r"\bos\.environ\b")),
              ("ACCEPTANCE_PATH", re.compile(r"scripts/runtime_acceptance")),
          ]
          for label, pattern in precise_forbidden_patterns:
              if pattern.search(core_text) or pattern.search(bundle_decoder_text):
                  raise SystemExit(f"GFS_PRODUCT_CORE_FORBIDDEN_DEPENDENCY:{label}")

          for required_path in (core, bundle_decoder, ts_decoder):
              if required_path not in graph_text:
                  raise SystemExit(f"GFS_PRODUCT_PATH_NOT_IN_EA5E2_GRAPH:{required_path}")

          result = {
              "schema_version": "geox_mcft_cap09_gfs_product_scientific_core_identity_v1",
              "status": "PASS",
              "historical_ea4_probe_blob": actual_historical_blob,
              "historical_ea4_probe_preserved": True,
              "successor_delegates_product_gfs_bundle_decoder": True,
              "same_cycle_inventory_uses_product_core": True,
              "pgrb2_decode_uses_product_decoder_core": True,
              "sflux_decode_uses_product_decoder_core": True,
              "apcp_and_72h_assembly_uses_product_decoder_core": True,
              "solar_interval_and_et0_uses_product_decoder_core": True,
              "second_gfs_scientific_path_in_successor_decode": False,
              "product_core_import_modules": sorted(imported_modules),
              "product_core_acceptance_dependency": False,
              "product_core_network_dependency": False,
              "product_core_database_dependency": False,
              "product_core_runtime_mutation_dependency": False,
              "provider_request_count": 0,
              "database_write_count": 0,
              "formal_effect": False,
          }
          out = root / "acceptance-output/MCFT_CAP_09_GFS_PRODUCT_SCIENTIFIC_CORE_IDENTITY_V1.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(result, sort_keys=True))
      - name: Prove product GFS acquisition provider boundary
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_GFS_PRODUCT_ACQUISITION_PROVIDER_V1.ts
      - name: Re-prove server and rolling T3R1 observer types
        run: |
          pnpm --filter @geox/server run typecheck
          pnpm exec tsc --noEmit --pretty false --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext --esModuleInterop --types node \
            scripts/runtime_acceptance/FETCH_MCFT_CAP_09_GFS_PRODUCT_RAW_BUNDLE_V1.ts \
            scripts/runtime_acceptance/RUN_MCFT_CAP_09_EA5E2_ROLLING_OPERATIONAL_ACTIVATION_OBSERVER_V1.ts \
            scripts/runtime_acceptance/RUN_MCFT_CAP_09_ROLLING_PREBOUNDARY_PROVIDER_PHASE_PRIVATE_TRANSIENT_R2.ts \
            scripts/runtime_acceptance/RUN_MCFT_CAP_09_ROLLING_PREBOUNDARY_REHYDRATION_V1.ts \
            scripts/runtime_acceptance/RUN_MCFT_CAP_09_KBS_EXTERNAL_FIVE_FAMILY_DATA_PATH_V1.ts \
            scripts/runtime_acceptance/PREFLIGHT_MCFT_CAP_09_EA5E2_FORMAL_SNAPSHOT_READINESS.ts
      - name: Re-prove Amendment-11 diagnostic and rolling deterministic seams
        run: |
          node scripts/runtime_acceptance/MCFT_CAP_09_KBS_PROVIDER_CADENCE_INTELLIGENCE_V1.cjs
          node scripts/runtime_acceptance/BUILD_MCFT_CAP_09_ROLLING_CROP_LEGALITY_V1.cjs selftest
          python scripts/runtime_acceptance/SELECT_MCFT_CAP_09_ROLLING_KBS_INTERSECTION_V1.py selftest
          python -m py_compile \
            scripts/runtime_acceptance/SELECT_MCFT_CAP_09_ROLLING_KBS_INTERSECTION_V1.py \
            scripts/runtime_acceptance/POLL_MCFT_CAP_09_EA5E2_KBS_EXACT_T_AVAILABILITY.py
      - name: Preserve frozen exact-main Timing Evidence V2 as historical engineering evidence
        run: node scripts/runtime_acceptance/MCFT_CAP_09_EA5E2_TIMING_BUDGET_EVIDENCE_V2.cjs
      - name: Prove rolling pre-boundary capture authority boundary
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_ROLLING_PREBOUNDARY_CAPTURE.cjs
      - name: Prove crop-legal actual-batch intersection authority boundary
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_ROLLING_KBS_INTERSECTION.cjs
      - name: Prove rolling operational activation boundary
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_ROLLING_OPERATIONAL_ACTIVATION.cjs
      - name: Re-prove rolling T3R1 runtime dependency graph V4
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_RUNTIME_DEPENDENCY_GRAPH_V4.cjs
      - name: Reexecute exact-head rolling successor runner qualification V3
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_SUCCESSOR_RUNNER_QUALIFICATION_V3.cjs
      - name: Upload exact-head rolling successor V3 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-ea5e2-rolling-successor-v3-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_GFS_PRODUCT_SCIENTIFIC_CORE_IDENTITY_V1.json
            acceptance-output/MCFT_CAP_09_GFS_PRODUCT_ACQUISITION_PROVIDER_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_EA5E2_RUNTIME_DEPENDENCY_GRAPH_V4.json
            acceptance-output/MCFT_CAP_09_EA5E2_SUCCESSOR_RUNNER_QUALIFICATION_V3.json
          if-no-files-found: warn
          retention-days: 90
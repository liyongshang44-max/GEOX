name: mcft-cap-08-s6-stage-1a-closure-freeze

on:
  pull_request:
    paths:
      - ".github/workflows/mcft-cap-08-s6-stage-1a-closure-freeze.yml"
      - "docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-STAGE-1A-CLOSURE-FREEZE-BOUNDARY-V1.json"
      - "docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-STAGE-1A-END-TO-END-CLOSURE-NOT-ESTABLISHED-V1.json"
      - "scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_STAGE_1A_CLOSURE_FREEZE_V1.cjs"

permissions:
  contents: read

jobs:
  verify-stage-1a-closure-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
      - name: Verify append-forward Stage 1A closure freeze
        env:
          MCFT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_STAGE_1A_CLOSURE_FREEZE_V1.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: mcft-cap-08-s6-stage-1a-closure-freeze-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/MCFT_CAP_08_S6_STAGE_1A_CLOSURE_FREEZE_RESULT.json
          if-no-files-found: error
          retention-days: 90

name: CAP-09 Adoption V2 Attempt-3 engineering gate (non-authorizing)
on:
  pull_request:
    paths:
      - "scripts/governance_acceptance/MCFT_CAP09_ADOPTION_V2_ATTEMPT3_ENGINEERING_GATE_V1.cjs"
      - "scripts/governance_acceptance/MCFT_CAP09_ADOPTION_V2_ATTEMPT3_ENGINEERING_GATE_V1.test.cjs"
      - "scripts/governance_acceptance/MCFT_CAP09_ATTEMPT3_RESOURCE_OWNER_V1.cjs"
      - "scripts/governance_acceptance/MCFT_CAP09_ATTEMPT3_RESOURCE_OWNER_V1.test.cjs"
      - "scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_ALL_BLOCKERS_V1.cjs"
      - "scripts/governance_acceptance/VERIFY_MCFT_CAP09_3747_INHERITED_SCOPE_V1.cjs"
      - "scripts/cap09_adoption_v1/installed-material.cjs"
      - "scripts/cap09_adoption_v1/MCFT_CAP09_ADOPTION_V2_EVIDENCE_CONSUMER.cjs"
      - "scripts/cap09_adoption_v1/MCFT_CAP09_ADOPTION_V2_EVIDENCE_CONSUMER.test.cjs"
      - "scripts/cap09_adoption_v1/MCFT_CAP09_ADOPTION_V2_POSTMERGE_SOURCE_V1.cjs"
      - "scripts/cap09_adoption_v1/MCFT_CAP09_ADOPTION_V2_NEW_MAIN_SUCCESSOR_V1.cjs"
      - "scripts/cap09_adoption_v1/MCFT_CAP09_ADOPTION_V2_NEW_MAIN_SUCCESSOR_V1.test.cjs"
      - "scripts/cap09_adoption_v1/SIGN_MCFT_CAP09_ADOPTION_V2_OFFLINE.cjs"
      - "scripts/runtime_acceptance/MCFT_CAP09_ATTEMPT3_PERMIT_V2_ATOMIC.cjs"
      - "scripts/runtime_acceptance/MCFT_CAP09_ATTEMPT3_PERMIT_V2_ATOMIC.test.cjs"
      - "scripts/runtime_acceptance/MCFT_CAP09_STAGE_CAPABILITY_V2.cjs"
      - "scripts/runtime_acceptance/MCFT_CAP09_STAGE_CAPABILITY_V2.test.cjs"
      - "scripts/runtime_acceptance/MCFT_CAP09_ATTEMPT3_CHILD_STAGE_V2.cjs"
      - "scripts/runtime_acceptance/MCFT_CAP09_ATTEMPT3_CHILD_STAGE_V2.test.cjs"
      - "scripts/runtime_acceptance/MCFT_CAP09_ATTEMPT3_HOST_V2.cjs"
      - "scripts/runtime_acceptance/MCFT_CAP09_ATTEMPT3_HOST_V2.test.cjs"
      - "scripts/runtime_acceptance/RUN_MCFT_CAP09_ATTEMPT3_HOST_V2_WINDOWS.cjs"
      - "scripts/runtime_acceptance/RUN_MCFT_CAP09_ATTEMPT3_HOST_V2_WINDOWS.test.cjs"
      - "scripts/runtime_acceptance/MCFT_CAP09_ATTEMPT3_WINDOWS_READONLY_INSPECTION_V1.ps1"
      - "scripts/runtime_acceptance/MCFT_CAP09_ATTEMPT3_REAL_LEDGER_READBACK_V1.cjs"
      - "scripts/runtime_acceptance/MCFT_CAP09_ATTEMPT3_REAL_LEDGER_READBACK_V1.test.cjs"
      - "scripts/runtime_acceptance/MCFT_CAP_09_CURRENT_BASELINE_EXECUTION_V1.cjs"
      - "scripts/runtime_acceptance/RUN_MCFT_CAP_09_V13_PRODUCER_DRIVEN_LIVE_QUALIFICATION_V2.ts"
      - "scripts/runtime_acceptance/AGGREGATE_MCFT_CAP_09_V13_EXACT_HEAD_TIMING_MEASUREMENT_V2.ts"
      - "scripts/runtime_acceptance/MCFT_CAP09_REAL_CONTROLLED_DELAY_V1.cjs"
      - "scripts/runtime_acceptance/MCFT_CAP09_PARENT_STAGE_DISPATCH_V2.cjs"
      - "scripts/runtime_acceptance/MCFT_CAP09_STAGE_RECEIPTS_V1.cjs"
      - "scripts/runtime_acceptance/MCFT_CAP09_ATTEMPT3_PERMIT_V2_READONLY.cjs"
      - "scripts/runtime_acceptance/MCFT_CAP09_ATTEMPT3_PERMIT_V2_READONLY.test.cjs"
      - "docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-CONTROL-PLANE-V1.json"
      - ".github/workflows/mcft-cap09-adoption-v2-attempt3-engineering-v1.yml"
      - "docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP09-ADOPTION-V2-ATTEMPT3-ENGINEERING-BOUNDARY-V1.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engineering-only-negative-proof:
    name: Engineering only — no Adoption, Permit or Host
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Offline negative and domain-separation tests
        env:
          CI: "true"
        run: |
          # Legacy #3747 assertions are exact-20-path and cannot be
          # rerun on successor #3748. The original native #3747 QCP is
          # preserved; run legacy tests only at their immutable Git subject.
          HISTORIC=61820645059360ba2c8c44cc2453925a0e68f83e
          HIST_ROOT="$RUNNER_TEMP/cap09_3747_historical_source"
          git worktree add --detach "$HIST_ROOT" "$HISTORIC"
          test "$(git -C "$HIST_ROOT" rev-parse HEAD)" = "$HISTORIC"
          (cd "$HIST_ROOT" && GITHUB_ACTIONS=false GITHUB_EVENT_NAME=historical_source_only node --test scripts/governance_acceptance/MCFT_CAP09_ADOPTION_V2_ATTEMPT3_ENGINEERING_GATE_V1.test.cjs)
          node --test scripts/runtime_acceptance/MCFT_CAP09_ATTEMPT3_PERMIT_V2_READONLY.test.cjs
          node --test scripts/governance_acceptance/MCFT_CAP09_ATTEMPT3_RESOURCE_OWNER_V1.test.cjs
          node --test scripts/cap09_adoption_v1/MCFT_CAP09_ADOPTION_V2_EVIDENCE_CONSUMER.test.cjs
          node --test scripts/cap09_adoption_v1/MCFT_CAP09_ADOPTION_V2_NEW_MAIN_SUCCESSOR_V1.test.cjs
          node --test scripts/runtime_acceptance/MCFT_CAP09_ATTEMPT3_PERMIT_V2_ATOMIC.test.cjs
          node --test scripts/runtime_acceptance/MCFT_CAP09_STAGE_CAPABILITY_V2.test.cjs
          node --test scripts/runtime_acceptance/MCFT_CAP09_ATTEMPT3_CHILD_STAGE_V2.test.cjs
          # #3751 only changes R4285 native Adoption; the #3749/#3750
          # exact-delta Host test is pinned to the accepted #3750 source.
          # The current source is still separately checked by QCP67.
          if [ "${{ github.event.pull_request.number }}" = "3751" ]; then
            HIST_3749='6210cbfe692aa4d0efd06649ab02c45597158fbc'
            HOST_TEST='scripts/runtime_acceptance/MCFT_CAP09_ATTEMPT3_HOST_V2.test.cjs'
            test "$(git rev-parse "HEAD:$HOST_TEST")" = "$(git rev-parse "$HIST_3749:$HOST_TEST")" || { echo 'HOLD_HISTORIC_3749_HOST_TEST_BYTES_CHANGED'; exit 1; }
            HIST_3749_ROOT="$RUNNER_TEMP/cap09_3749_historical_host_source"
            git worktree add --detach "$HIST_3749_ROOT" "$HIST_3749"
            (cd "$HIST_3749_ROOT" && test "$(git rev-parse HEAD)" = "$HIST_3749" && node --test "$HOST_TEST")
          else
            node --test scripts/runtime_acceptance/MCFT_CAP09_ATTEMPT3_HOST_V2.test.cjs
          fi
          node --test scripts/runtime_acceptance/RUN_MCFT_CAP09_ATTEMPT3_HOST_V2_WINDOWS.test.cjs
          node --test scripts/runtime_acceptance/MCFT_CAP09_ATTEMPT3_REAL_LEDGER_READBACK_V1.test.cjs
      - name: Verify original 3747 scope at its frozen source; reject inherited current approval
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          HIST_ROOT="$RUNNER_TEMP/cap09_3747_historical_source"
          test "$(git -C "$HIST_ROOT" rev-parse HEAD)" = "61820645059360ba2c8c44cc2453925a0e68f83e"
          (cd "$HIST_ROOT" && node scripts/governance_acceptance/VERIFY_MCFT_CAP09_3747_INHERITED_SCOPE_V1.cjs --technical)
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          mkdir -p acceptance-output
          node -e 'const fs=require("node:fs");const cp=require("node:child_process");const old="61820645059360ba2c8c44cc2453925a0e68f83e",current=cp.execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim();if(current===old)throw Error("SUCCESSOR_HEAD_NOT_DISTINCT");fs.writeFileSync("acceptance-output/CAP09_3748_HISTORIC_3747_SOURCE_ISOLATION_V1.json",JSON.stringify({schema:"CAP09_3748_HISTORIC_3747_SOURCE_ISOLATION_V1",old_exact_subject:old,current_successor_subject:current,original_scope_replayed_only_at_own_git_head:true,current_source_qualification_approved:false,adoption_v2_signed:false,host_v2:false,permit_v2:false,original_six_stages_executed:0,production:false})+"\n")'
      - name: Upload nonauthorizing historical/source-separation receipt
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-3748-historic-source-isolation-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/CAP09_3748_HISTORIC_3747_SOURCE_ISOLATION_V1.json
          if-no-files-found: error
          retention-days: 30

  windows-readonly-inspection-contract:
    name: Windows PS5.1 no-effect inspection (NOT the operator host)
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify PowerShell 5.1 local inspector without real input
        shell: powershell
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts\runtime_acceptance\MCFT_CAP09_ATTEMPT3_WINDOWS_READONLY_INSPECTION_V1.ps1'
          $json = & $script -Repo $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw 'READONLY_INSPECTOR_PROCESS_FAILED' }
          $fact = ($json | Out-String | ConvertFrom-Json)
          if ($fact.status -ne 'READONLY_LOCAL_INSPECTION_NOT_SIGNED_PREFLIGHT') { throw 'INSPECTOR_STATUS_CHANGED' }
          if ($fact.permit_consumed -ne $false -or $fact.original_six_stages_executed -ne 0) { throw 'FAKE_PHYSICAL_PASS' }
          if ($fact.signed_material_verified -ne $false -or $fact.production_authorized -ne $false) { throw 'FAKE_ADMISSION' }
          if ($fact.blockers -notcontains 'SIGNED_ADOPTION_PERMIT_WINDOWS_INPUT_NOT_PROVIDED') { throw 'MISSING_EXPECTED_HOLD' }
          if ($fact.required_source_files.Count -lt 11) { throw 'STAGE_SOURCE_INVENTORY_INCOMPLETE' }
          Write-Output ('PASS_WINDOWS_READONLY_INSPECTOR_CONTRACT_NOT_OPERATOR_ATTESTATION files=' + $fact.required_source_files.Count)

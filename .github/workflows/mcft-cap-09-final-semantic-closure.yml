name: mcft-cap-09-final-semantic-closure

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-final-semantic-closure.yml'
      - '.github/workflows/mcft-cap-09-t4r1-formal-store-provision.yml'
      - '.github/workflows/mcft-cap-09-t4r1-amendment19-persistent-24t-qualification.yml'
      - '.github/workflows/mcft-cap-09-t4r1-rolling-hourly-scheduler.yml'
      - '.github/workflows/mcft-cap-09-t4r1-rolling-preboundary-capture.yml'
      - '.github/workflows/mcft-cap-09-amendment19-formal-arm.yml'
      - '.github/workflows/mcft-cap-09-amendment19-formal-a0-bootstrap.yml'
      - '.github/workflows/mcft-cap-09-amendment19-formal-hourly-evidence.yml'
      - '.github/workflows/mcft-cap-09-amendment19-formal-live-runner.yml'
      - '.github/workflows/mcft-cap-09-amendment19-formal-final-readback.yml'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-T4R1-ACTUAL-FORMAL-STORE-AUTHORITY-V1.json'
      - 'scripts/runtime_acceptance/EXECUTE_MCFT_CAP_09_T4R1_AMENDMENT_19_PERSISTENT_24T_SUCCESSOR.ts'
      - 'scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_FORMAL_A0_BOOTSTRAP_V1.ts'
      - 'scripts/runtime_acceptance/mcft_cap09_amendment19_formal_manifest_from_arm_v1.ts'
      - 'scripts/runtime_acceptance/READBACK_MCFT_CAP_09_AMENDMENT_19_FORMAL_FINAL_V1.ts'
      - 'scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_AMENDMENT_19_FORMAL_DOWNSTREAM_ZERO_V1.ts'
      - 'scripts/governance_acceptance/ASSEMBLE_MCFT_CAP_09_AMENDMENT_19_FORMAL_COMPLETION_V1.cjs'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_FINAL_SEMANTIC_CLOSURE_V1.cjs'
      - 'scripts/governance_acceptance/REHEARSE_MCFT_CAP_09_FORMAL_24H_ORCHESTRATION_V1.cjs'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-PHASE6-GITHUB-PRODUCTION-EXECUTION-RETIREMENT-AUTHORITY-V1.json'
      - 'scripts/governance_acceptance/AUDIT_MCFT_CAP_09_PHASE6_GITHUB_PRODUCTION_OWNERS_V1.cjs'
      - '.github/workflows/mcft-cap-09-phase6-retire-github-production-execution.yml'

permissions:
  contents: read
  actions: read

jobs:
  reverse-terminal-static-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
      - name: Route Phase6 retirement successor
        id: phase6
        shell: bash
        run: |
          set -euo pipefail
          if test -f 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-PHASE6-GITHUB-PRODUCTION-EXECUTION-RETIREMENT-AUTHORITY-V1.json'; then
            status="$(node -e "const a=require('./docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-PHASE6-GITHUB-PRODUCTION-EXECUTION-RETIREMENT-AUTHORITY-V1.json');process.stdout.write(String(a.status||''))")"
            if [[ "$status" == PHASE6_* ]]; then
              git merge-base --is-ancestor '75d4961279bd64dc1c9dd7d68aac189c72c98846' HEAD
              node scripts/governance_acceptance/AUDIT_MCFT_CAP_09_PHASE6_GITHUB_PRODUCTION_OWNERS_V1.cjs enforce >/tmp/mcft-cap09-phase6-owner-audit.json
              echo 'active=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'active=false' >> "$GITHUB_OUTPUT"
      - name: Prove final semantic closure from terminal readback back to qualification
        if: steps.phase6.outputs.active != 'true'
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_FINAL_SEMANTIC_CLOSURE_V1.cjs

  deterministic-24h-orchestration-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
      - name: Rehearse A0 through O23 without provider or Formal DB access
        run: node scripts/governance_acceptance/REHEARSE_MCFT_CAP_09_FORMAL_24H_ORCHESTRATION_V1.cjs
      - name: Require rehearsal is simulation-only
        shell: bash
        run: |
          set -euo pipefail
          test -z "${DATABASE_URL:-}"
          test -z "${MCFT_EA5E2_TRANSIENT_S3_ENDPOINT:-}"
          test -z "${MCFT_CAP09_PARENT_DATABASE_URL:-}"


  phase7-fresh-formal-v5-preparation:
    if: github.event.pull_request.base.sha == '48ceafe7c6e7d3d57a1dc17411fb4bf673486333'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcft_cap09_phase7_preparation
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mcft_cap09_phase7_preparation"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      EXACT_PHASE6_HEAD: '48ceafe7c6e7d3d57a1dc17411fb4bf673486333'
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
      NODE_VERSION: '20.11.1'
      PNPM_VERSION: '9.15.4'
      DATABASE_URL: 'postgres://postgres:postgres@127.0.0.1:5432/mcft_cap09_phase7_preparation'
      V13_COLUMN_FP: 'c61154d4439a82efc256bed461386781'
      V13_CONSTRAINT_FP: '67a588bc5b8c3d213b03aa1dbfa4ff2b'
      V13_INDEX_FP: '306e26a56d419c4e08fac0912ccfdda8'
    steps:
      - name: Checkout exact Phase7 preparation subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact Phase6 base and one governed changed path
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha }}" = "$EXACT_PHASE6_HEAD"
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          changed="$(git diff --name-only "$EXACT_PHASE6_HEAD" HEAD)"
          test "$changed" = '.github/workflows/mcft-cap-09-final-semantic-closure.yml'
          test "$(git rev-parse HEAD:docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-T4R1-ACTUAL-FORMAL-STORE-AUTHORITY-V3.json)" = '34fd3e92e0e628cf0db16e10df3633337fe81a1a'
          test "$(git rev-parse HEAD:scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_V13_HOLISTIC_SCHEMA_POSTGRES.ts)" = '0c1db81f09b78addfc9c411500a44b4f960216af'
          test "$(git rev-parse HEAD:apps/server/db/migrations/2026_08_25_mcft_cap_09_v13_forcing_base_continuity.sql)" = '0e7e4877789930fc7fc0cd82051f51641ae72129'
          test "$(git rev-parse HEAD:apps/server/db/migrations/2026_08_25_mcft_cap_09_v13_forcing_controller_admission.sql)" = 'a6a2cf712d2170765784df4969b83979ae319f25'
          test "$(git rev-parse HEAD:apps/server/db/migrations/2026_08_25_mcft_cap_09_v13_forcing_controller_lifecycle.sql)" = '6aed8c287306c5e32eb09d4a8ab3e61127cd7309'

      - name: Require frozen fresh-v5 store plan and hard non-effects
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const a=JSON.parse(fs.readFileSync('docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-T4R1-ACTUAL-FORMAL-STORE-AUTHORITY-V3.json','utf8'));
          if(a.status!=='CANDIDATE')throw new Error('PHASE7_PREP_V3_CANDIDATE_REQUIRED');
          if(a.database_identity?.database_name!=='geox_mcft_cap09_s6_formal_t4r1_24h_v5')throw new Error('PHASE7_PREP_V5_DB_IDENTITY');
          if(a.database_identity?.failed_predecessor_database!=='geox_mcft_cap09_s6_formal_t4r1_24h_v4'||a.database_identity?.failed_predecessor_reuse_forbidden!==true||a.database_identity?.data_clone_from_failed_v4_forbidden!==true||a.database_identity?.fresh_zero_state_required!==true)throw new Error('PHASE7_PREP_FAILED_V4_BOUNDARY');
          if(a.qualification_generation?.qualification_database!=='geox_mcft_cap09_s6_accel24t_am19_v13'||a.qualification_generation?.blocked_database!=='geox_mcft_cap09_s6_accel24t_am19_blocked_v13'||a.qualification_generation?.previous_generation_reuse_forbidden!==true)throw new Error('PHASE7_PREP_V13_STORE_PLAN');
          if(a.schema_contract?.predecessor_required_public_table_count!==26||a.schema_contract?.v13_required_public_table_count!==29||a.schema_contract?.canonical_facts_schema_mutation_required!==false||a.schema_contract?.all_governed_relations_zero_state_before_arm_required!==true)throw new Error('PHASE7_PREP_SCHEMA_CONTRACT');
          const sequence=a.activation_sequence||[];
          if(sequence[0]!=='MERGE_EXACT_V13_SUCCESSOR_SUBJECT'||sequence[1]!=='CAPACITY_PREFLIGHT_AND_SAFE_SUPERSEDED_GENERATION_CLEANUP_IF_REQUIRED'||sequence[2]!=='PROVISION_ZERO_STATE_V13_BLOCKED_V13_AND_FORMAL_V5_STORES')throw new Error('PHASE7_PREP_ACTIVATION_SEQUENCE');
          for(const key of ['v13_stores_provisioned_by_this_document','formal_v5_store_provisioned_by_this_document','timing_budget_qualified','v13_qualification_executed','new_graduation_gate_open','formal_v5_epoch_selected','formal_v5_a0_bootstrapped','formal_v5_o00_started','failed_v4_repaired','failed_v4_continued','mcft_cap09_completed'])if(a.nonclaims?.[key]!==false)throw new Error('PHASE7_PREP_NONCLAIM:'+key);

      - name: Verify immutable Phase6 closure and v13 schema artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const expected=[
              {run:33146391000,artifact:9676455831,digest:'sha256:9a3a22b8b844fc1538d4a6986a9d3477b895208b1e88cdf13106f0f0dbf463d7',head:process.env.EXACT_PHASE6_HEAD},
              {run:33146390858,artifact:9675928222,digest:'sha256:c84c06eeb04db9aa228c3415db320e8cd6eaef3502407fbc192dc80f8833497d',head:process.env.EXACT_PHASE6_HEAD},
              {run:33146390954,artifact:9676026935,digest:'sha256:8af3b905af82e84b7ff9b200b715ae622dbd2c4551b7c4fe27c0d842e421af17',head:process.env.EXACT_PHASE6_HEAD},
              {run:32881283336,artifact:9575878791,digest:'sha256:04630f1f869ba99e9be40d55e24967e6e26671e80d3459fb9b28ce0694aaeb40',head:'3bbf096ee5cb73e8e0e0251dc400733d6cab501f'}
            ];
            const {owner,repo}=context.repo;
            for(const e of expected){
              const run=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:e.run})).data;
              if(run.conclusion!=='success'||run.head_sha!==e.head)throw new Error('PHASE7_PREP_REQUIRED_RUN_INVALID:'+e.run);
              const art=(await github.rest.actions.getArtifact({owner,repo,artifact_id:e.artifact})).data;
              if(art.expired||art.digest!==e.digest)throw new Error('PHASE7_PREP_REQUIRED_ARTIFACT_INVALID:'+e.artifact);
            }

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install locked workspace
        run: pnpm install --frozen-lockfile

      - name: Reconstruct exact v13 29-table schema in ephemeral PostgreSQL
        env:
          MCFT_CAP09_V13_HOLISTIC_SCHEMA_DESTRUCTIVE_ACCEPTANCE: '1'
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_V13_HOLISTIC_SCHEMA_POSTGRES.ts

      - name: Require immutable v13 fingerprints and assemble zero-effect preparation proof
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const s=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_V13_HOLISTIC_SCHEMA_POSTGRES_RESULT.json','utf8'));
          if(s.status!=='PASS'||s.predecessor_public_table_count!==26||s.v13_required_public_table_count!==29||s.operational_table_delta!==3)throw new Error('PHASE7_PREP_V13_SCHEMA_CARDINALITY');
          if(s.v13_column_fingerprint_md5!==process.env.V13_COLUMN_FP||s.v13_constraint_fingerprint_md5!==process.env.V13_CONSTRAINT_FP||s.v13_index_fingerprint_md5!==process.env.V13_INDEX_FP)throw new Error('PHASE7_PREP_V13_FINGERPRINT_DRIFT');
          if(s.canonical_facts_schema_unchanged!==true||s.all_new_relations_zero_state!==true||s.production_workflow_effect!==false||s.formal_v4_mutation_performed!==false||s.mcft_cap09_completed!==false)throw new Error('PHASE7_PREP_V13_NONCLAIM_REGRESSION');
          const out={
            schema_version:'geox_mcft_cap09_phase7_fresh_formal_v5_preparation_proof_v1',
            status:'PASS',
            subject_sha:process.env.SUBJECT_SHA,
            phase6_predecessor_sha:process.env.EXACT_PHASE6_HEAD,
            phase6_accepted:true,
            exact_head_phase6_workflows:'24/24_SUCCESS',
            v13_schema_anchor_reproduced:true,
            v13_public_table_count:29,
            v13_column_fingerprint_md5:s.v13_column_fingerprint_md5,
            v13_constraint_fingerprint_md5:s.v13_constraint_fingerprint_md5,
            v13_index_fingerprint_md5:s.v13_index_fingerprint_md5,
            planned_fresh_stores:[
              'geox_mcft_cap09_s6_accel24t_am19_v13',
              'geox_mcft_cap09_s6_accel24t_am19_blocked_v13',
              'geox_mcft_cap09_s6_formal_t4r1_24h_v5'
            ],
            failed_v4_reuse:false,
            failed_v4_data_clone:false,
            remote_database_provision_count:0,
            provider_request_count:0,
            runtime_database_write_count:0,
            formal_v5_epoch_selected:false,
            formal_v5_arm:false,
            formal_v5_a0_bootstrapped:false,
            formal_v5_o00_started:false,
            production_effect:false,
            mcft_cap09_completed:false
          };
          fs.writeFileSync('acceptance-output/MCFT_CAP_09_PHASE7_FRESH_FORMAL_V5_PREPARATION_PROOF.json',JSON.stringify(out,null,2)+'\n');

      - name: Upload immutable Phase7 preparation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-phase7-fresh-formal-v5-preparation-${{ env.SUBJECT_SHA }}
          path: |
            acceptance-output/MCFT_CAP_09_V13_HOLISTIC_SCHEMA_POSTGRES_RESULT.json
            acceptance-output/MCFT_CAP_09_PHASE7_FRESH_FORMAL_V5_PREPARATION_PROOF.json
          if-no-files-found: error
          retention-days: 90


  phase7-v13-runtime-readiness:
    if: github.event.pull_request.base.sha == '48ceafe7c6e7d3d57a1dc17411fb4bf673486333'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcft_cap09_phase7_v13_readiness
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mcft_cap09_phase7_v13_readiness"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      EXACT_PHASE6_HEAD: '48ceafe7c6e7d3d57a1dc17411fb4bf673486333'
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
      NODE_VERSION: '20.11.1'
      PNPM_VERSION: '9.15.4'
      DATABASE_URL: 'postgres://postgres:postgres@127.0.0.1:5432/mcft_cap09_phase7_v13_readiness'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact Phase6 base and single governed changed path
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha }}" = "$EXACT_PHASE6_HEAD"
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git diff --name-only "$EXACT_PHASE6_HEAD" HEAD)" = '.github/workflows/mcft-cap-09-final-semantic-closure.yml'

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install locked workspace
        run: pnpm install --frozen-lockfile

      - name: Prove cursor-driven exact-base capture adapter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance-output
          node scripts/runtime_acceptance/RUN_MCFT_CAP_09_V13_EXACT_BASE_PREBOUNDARY_CAPTURE.cjs selftest > acceptance-output/MCFT_CAP_09_PHASE7_V13_CAPTURE_READINESS.json

      - name: Prove atomic admission and autonomous controller graph
        shell: bash
        run: |
          set -euo pipefail
          MCFT_CAP09_V13_ADMISSION_DESTRUCTIVE_ACCEPTANCE=1 pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_V13_FORCING_SUPPLY_ADMISSION_POSTGRES.ts
          MCFT_CAP09_V13_AUTONOMOUS_SERVICE_DESTRUCTIVE_ACCEPTANCE=1 pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_V13_AUTONOMOUS_CONTROLLER_SERVICE_POSTGRES.ts

      - name: Prove v5 next-tick viability graph
        env:
          MCFT_CAP09_V13_VIABILITY_DESTRUCTIVE_ACCEPTANCE: '1'
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_V13_NEXT_TICK_VIABILITY_POSTGRES.ts

      - name: Validate readiness and preserve unqualified timing boundary
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const capture=read('acceptance-output/MCFT_CAP_09_PHASE7_V13_CAPTURE_READINESS.json');
          const admission=read('acceptance-output/MCFT_CAP_09_V13_FORCING_SUPPLY_ADMISSION_POSTGRES_RESULT.json');
          const controller=read('acceptance-output/MCFT_CAP_09_V13_AUTONOMOUS_CONTROLLER_SERVICE_POSTGRES_RESULT.json');
          const viability=read('acceptance-output/MCFT_CAP_09_V13_NEXT_TICK_VIABILITY_POSTGRES_RESULT.json');
          const authority=read('docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-T4R1-ACTUAL-FORMAL-STORE-AUTHORITY-V3.json');
          for(const [name,p] of Object.entries({capture,admission,controller,viability}))if(p.status!=='PASS')throw new Error('PHASE7_V13_READINESS_NOT_PASS:'+name);
          if(capture.target_source!=='DURABLE_FORCING_CURSOR_NEXT_MISSING_REQUIRED_BASE'||capture.wall_clock_target_planner_used!==false||capture.production_workflow_effect!==false)throw new Error('PHASE7_CAPTURE_AUTHORITY_DRIFT');
          if(admission.hardcoded_35_minute_budget_authorized!==false||admission.production_workflow_effect!==false)throw new Error('PHASE7_ADMISSION_AUTHORITY_DRIFT');
          if(controller.wall_clock_target_planner_used!==false||controller.production_workflow_effect!==false)throw new Error('PHASE7_CONTROLLER_AUTHORITY_DRIFT');
          if(viability.canonical_tick_core_changed!==false||viability.production_workflow_effect!==false)throw new Error('PHASE7_VIABILITY_AUTHORITY_DRIFT');
          const t=authority.timing_authority||{};
          if(t.authority_id!=='FORMAL_FORCING_ACQUISITION_BUDGET_V1'||t.status!=='UNQUALIFIED_UNTIL_EXACT_HEAD_TIMING_QUALIFICATION'||t.minimum_real_timing_sample_count!==3||t.controlled_delay_matrix_required!==true||t.fixed_35_minute_lead_authorized_for_v5!==false||t.hardcoded_replacement_budget_minutes!==null)throw new Error('PHASE7_TIMING_AUTHORITY_DRIFT');
          const out={
            schema_version:'geox_mcft_cap09_phase7_v13_runtime_readiness_v1',
            status:'PASS',
            subject_sha:process.env.SUBJECT_SHA,
            phase6_predecessor_sha:process.env.EXACT_PHASE6_HEAD,
            cursor_driven_capture_ready:true,
            atomic_supply_admission_ready:true,
            autonomous_controller_graph_ready:true,
            v5_next_tick_viability_ready:true,
            producer_driven_control_graph_ready:true,
            preinsert_all_24_forcing_pairs_used:false,
            timing_authority:'FORMAL_FORCING_ACQUISITION_BUDGET_V1',
            required_real_timing_sample_count:3,
            real_timing_sample_count:0,
            controlled_delay_matrix_executed:false,
            post_merge_v13_qualification_executed:false,
            timing_budget_qualified:false,
            remote_database_provision_count:0,
            provider_request_count:0,
            formal_v5_arm:false,
            formal_v5_o00_started:false,
            production_effect:false,
            mcft_cap09_completed:false
          };
          fs.writeFileSync('acceptance-output/MCFT_CAP_09_PHASE7_V13_RUNTIME_READINESS.json',JSON.stringify(out,null,2)+'\n');

      - name: Upload immutable v13 runtime-readiness proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-phase7-v13-runtime-readiness-${{ env.SUBJECT_SHA }}
          path: |
            acceptance-output/MCFT_CAP_09_PHASE7_V13_CAPTURE_READINESS.json
            acceptance-output/MCFT_CAP_09_V13_FORCING_SUPPLY_ADMISSION_POSTGRES_RESULT.json
            acceptance-output/MCFT_CAP_09_V13_AUTONOMOUS_CONTROLLER_SERVICE_POSTGRES_RESULT.json
            acceptance-output/MCFT_CAP_09_V13_NEXT_TICK_VIABILITY_POSTGRES_RESULT.json
            acceptance-output/MCFT_CAP_09_PHASE7_V13_RUNTIME_READINESS.json
          if-no-files-found: error
          retention-days: 90

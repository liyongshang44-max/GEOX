              const run=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:e.run})).data;
              if(run.conclusion!=='success'||run.head_sha!==e.head)throw new Error('PHASE7_PREP_REQUIRED_RUN_INVALID:'+e.run);
              const art=(await github.rest.actions.getArtifact({owner,repo,artifact_id:e.artifact})).data;
              if(art.expired||art.digest!==e.digest)throw new Error('PHASE7_PREP_REQUIRED_ARTIFACT_INVALID:'+e.artifact);
            }

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install locked workspace
        run: pnpm install --frozen-lockfile

      - name: Reconstruct exact v13 29-table schema in ephemeral PostgreSQL
        env:
          MCFT_CAP09_V13_HOLISTIC_SCHEMA_DESTRUCTIVE_ACCEPTANCE: '1'
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_V13_HOLISTIC_SCHEMA_POSTGRES.ts

      - name: Require immutable v13 fingerprints and assemble zero-effect preparation proof
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const s=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_V13_HOLISTIC_SCHEMA_POSTGRES_RESULT.json','utf8'));
          if(s.status!=='PASS'||s.predecessor_public_table_count!==26||s.v13_required_public_table_count!==29||s.operational_table_delta!==3)throw new Error('PHASE7_PREP_V13_SCHEMA_CARDINALITY');
          if(s.v13_column_fingerprint_md5!==process.env.V13_COLUMN_FP||s.v13_constraint_fingerprint_md5!==process.env.V13_CONSTRAINT_FP||s.v13_index_fingerprint_md5!==process.env.V13_INDEX_FP)throw new Error('PHASE7_PREP_V13_FINGERPRINT_DRIFT');
          if(s.canonical_facts_schema_unchanged!==true||s.all_new_relations_zero_state!==true||s.production_workflow_effect!==false||s.formal_v4_mutation_performed!==false||s.mcft_cap09_completed!==false)throw new Error('PHASE7_PREP_V13_NONCLAIM_REGRESSION');
          const out={
            schema_version:'geox_mcft_cap09_phase7_fresh_formal_v5_preparation_proof_v1',
            status:'PASS',
            subject_sha:process.env.SUBJECT_SHA,
            phase6_predecessor_sha:process.env.EXACT_PHASE6_HEAD,
            phase6_accepted:true,
            exact_head_phase6_workflows:'24/24_SUCCESS',
            v13_schema_anchor_reproduced:true,
            v13_public_table_count:29,
            v13_column_fingerprint_md5:s.v13_column_fingerprint_md5,
            v13_constraint_fingerprint_md5:s.v13_constraint_fingerprint_md5,
            v13_index_fingerprint_md5:s.v13_index_fingerprint_md5,
            planned_fresh_stores:[
              'geox_mcft_cap09_s6_accel24t_am19_v13',
              'geox_mcft_cap09_s6_accel24t_am19_blocked_v13',
              'geox_mcft_cap09_s6_formal_t4r1_24h_v5'
            ],
            failed_v4_reuse:false,
            failed_v4_data_clone:false,
            remote_database_provision_count:0,
            provider_request_count:0,
            runtime_database_write_count:0,
            formal_v5_epoch_selected:false,
            formal_v5_arm:false,
            formal_v5_a0_bootstrapped:false,
            formal_v5_o00_started:false,
            production_effect:false,
            mcft_cap09_completed:false
          };
          fs.writeFileSync('acceptance-output/MCFT_CAP_09_PHASE7_FRESH_FORMAL_V5_PREPARATION_PROOF.json',JSON.stringify(out,null,2)+'\n');

      - name: Upload immutable Phase7 preparation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-phase7-fresh-formal-v5-preparation-${{ env.SUBJECT_SHA }}
          path: |
            acceptance-output/MCFT_CAP_09_V13_HOLISTIC_SCHEMA_POSTGRES_RESULT.json
            acceptance-output/MCFT_CAP_09_PHASE7_FRESH_FORMAL_V5_PREPARATION_PROOF.json
          if-no-files-found: error
          retention-days: 90



  phase7-v13-production-gap-audit:
    if: github.event.pull_request.base.sha == '48ceafe7c6e7d3d57a1dc17411fb4bf673486333'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXACT_PHASE6_HEAD: '48ceafe7c6e7d3d57a1dc17411fb4bf673486333'
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact Phase6 base and single governed changed path
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha }}" = "$EXACT_PHASE6_HEAD"
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git diff --name-only "$EXACT_PHASE6_HEAD" HEAD)" = '.github/workflows/mcft-cap-09-final-semantic-closure.yml'

      - name: Audit Phase7 production forcing integration gaps
        shell: node {0}
        run: |
          const fs=require('node:fs'),cp=require('node:child_process');
          const read=p=>fs.readFileSync(p,'utf8');
          const blob=p=>cp.execFileSync('git',['rev-parse','HEAD:'+p],{encoding:'utf8'}).trim();
          const shim=read('scripts/runtime_acceptance/RUN_MCFT_CAP_09_V13_EXACT_BASE_PREBOUNDARY_CAPTURE.cjs');
          const runnerPath='scripts/runtime_acceptance/RUN_MCFT_CAP_09_ROLLING_PREBOUNDARY_PROVIDER_PHASE_PRIVATE_TRANSIENT_R2.ts';
          const route=read('docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-PRODUCTION-HOSTING-ARCHITECTURE-AND-DEVELOPMENT-ROUTE-V1.md');
          const evidenceAcl=read('apps/server/db/migrations/2026_08_27_mcft_cap_09_phase3_evidence_runtime_acl.sql');
          const twinAcl=read('apps/server/db/migrations/2026_08_27_mcft_cap_09_phase4_twin_runtime_acl.sql');
          const evidenceComposition=read('apps/server/src/external_evidence/mcft_cap09_evidence_runtime_composition_v1.ts');
          const controller=read('apps/server/src/runtime/twin_runtime/external_formal_forcing_autonomous_controller_service_v1.ts');
          const currentRunnerBlob=blob(runnerPath);
          const old=/const RUNNER_BLOB = "([0-9a-f]{40})"/.exec(shim)?.[1]||'';
          if(currentRunnerBlob!=='b3a0d7a08388ea4b935f29b8d9a5cc5ad0f8fdc9')throw new Error('PHASE7_GAP_AUDIT_PROVIDER_RUNNER_BLOB_UNEXPECTED:'+currentRunnerBlob);
          if(old!=='26dd21c5a0b7a60fca06e5e4c2ec92289a102a47'||old===currentRunnerBlob)throw new Error('PHASE7_GAP_AUDIT_LEGACY_SHIM_DRIFT_NOT_ESTABLISHED');
          for(const marker of ['acceptance-script source rewriting','qualification plumbing, not the final production provider implementation','Live Evidence Plane','Twin Runtime Plane'])if(!route.includes(marker))throw new Error('PHASE7_GAP_AUDIT_ROUTE_MARKER_MISSING:'+marker);
          if(!evidenceComposition.includes('ProductionEvidenceWorkItemFactoryV1')||!evidenceComposition.includes('PostgresEvidenceRuntimeGovernedIngressV1')||!evidenceComposition.includes('PostgresExternalFormalEvidenceVisibilityV1'))throw new Error('PHASE7_GAP_AUDIT_PRODUCT_EVIDENCE_GRAPH_MISSING');
          if(!controller.includes('ExternalFormalExactBaseCapturePortV1')||!controller.includes('captureExactBase'))throw new Error('PHASE7_GAP_AUDIT_V13_CAPTURE_PORT_MISSING');
          const forcingTables=['twin_external_formal_forcing_base_cursor_v1','twin_external_formal_forcing_base_target_v1','twin_external_formal_forcing_controller_lease_v1'];
          for(const table of forcingTables){
            if(!twinAcl.includes(table))throw new Error('PHASE7_GAP_AUDIT_TWIN_DENIAL_MISSING:'+table);
            if(evidenceAcl.includes(table))throw new Error('PHASE7_GAP_AUDIT_EXPECTED_EVIDENCE_ACL_GAP_NOT_PRESENT:'+table);
          }
          const result={
            schema_version:'geox_mcft_cap09_phase7_v13_production_gap_audit_v1',
            status:'PASS',
            subject_sha:process.env.SUBJECT_SHA,
            phase6_predecessor_sha:process.env.EXACT_PHASE6_HEAD,
            legacy_exact_base_shim_source_blob:old,
            current_productized_provider_runner_blob:currentRunnerBlob,
            legacy_shim_adoption_authorized:false,
            product_evidence_graph_present:true,
            v13_exact_base_capture_port_present:true,
            twin_runtime_v13_forcing_table_access_denied:true,
            evidence_runtime_v13_forcing_table_access_granted:false,
            production_durable_candidate_store_present:false,
            production_exact_base_capture_composition_present:false,
            blockers:[
              'LEGACY_V13_EXACT_BASE_CAPTURE_SHIM_NOT_PRODUCTION_ADOPTABLE',
              'V13_FORCING_TABLES_NOT_GRANTED_TO_EVIDENCE_RUNTIME',
              'PRODUCTION_DURABLE_CANDIDATE_STORE_NOT_IMPLEMENTED',
              'PRODUCTION_EXACT_BASE_CAPTURE_COMPOSITION_NOT_IMPLEMENTED'
            ],
            post_merge_v13_qualification_executed:false,
            timing_budget_qualified:false,
            formal_v5_arm:false,
            formal_v5_o00_started:false,
            production_effect:false,
            mcft_cap09_completed:false
          };
          fs.mkdirSync('acceptance-output',{recursive:true});
          fs.writeFileSync('acceptance-output/MCFT_CAP_09_PHASE7_V13_PRODUCTION_GAP_AUDIT.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result));

      - name: Upload Phase7 production-gap audit
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-phase7-v13-production-gap-audit-${{ env.SUBJECT_SHA }}
          path: acceptance-output/MCFT_CAP_09_PHASE7_V13_PRODUCTION_GAP_AUDIT.json
          if-no-files-found: error
          retention-days: 90

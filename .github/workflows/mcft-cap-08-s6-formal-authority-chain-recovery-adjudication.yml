name: mcft-cap-08-s6-formal-authority-chain-recovery-adjudication

on:
  pull_request:
    paths:
      - ".github/workflows/mcft-cap-08-s6-formal-authority-chain-recovery-adjudication.yml"
      - "docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-FORMAL-AUTHORITY-CHAIN-RECOVERY-ADJUDICATION-*.json"
      - "scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_FORMAL_AUTHORITY_CHAIN_RECOVERY_ADJUDICATION_V1.cjs"

permissions:
  contents: read

jobs:
  verify-formal-authority-chain-recovery-adjudication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
      - name: Verify independent formal authority chain recovery adjudication
        env:
          MCFT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_FORMAL_AUTHORITY_CHAIN_RECOVERY_ADJUDICATION_V1.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap-08-s6-formal-authority-chain-recovery-adjudication-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/MCFT_CAP_08_S6_FORMAL_AUTHORITY_CHAIN_RECOVERY_ADJUDICATION_RESULT.json
          if-no-files-found: error
          retention-days: 90

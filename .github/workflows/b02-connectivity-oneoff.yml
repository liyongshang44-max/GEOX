name: b03-contracts-oneoff
on:
  push:
    branches:
      - docs/bline-b02-semantic-ownership-register-v1-test
permissions:
  contents: read
jobs:
  exact-head-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact B-03 target head
        uses: actions/checkout@v4
        with:
          ref: 7174d143803ed3db8b956a2b076d3b747ee25a85
          fetch-depth: 0
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Server typecheck
        run: pnpm --filter @geox/server run typecheck
      - name: B-03 contract fixtures
        run: pnpm --filter @geox/server exec node --import tsx --test src/contracts/canonical_evidence_v1.contract.test.ts
      - name: Exact-head marker
        run: |
          echo "B03_EXACT_HEAD $(git rev-parse HEAD)"
          echo "B03_CANONICAL_EVIDENCE_CONTRACTS_PASS"

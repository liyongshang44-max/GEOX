name: mcft-cap-09-v13-next-tick-viability-postgres

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-v13-next-tick-viability-postgres.yml'
      - 'apps/server/src/runtime/twin_runtime/postgres_external_formal_next_tick_viability_v1.ts'
      - 'apps/server/src/runtime/twin_runtime/external_formal_v5_viability_gated_scheduler_v1.ts'
      - 'apps/server/src/runtime/twin_runtime/external_formal_v5_amendment19_runner_v1.ts'
      - 'apps/server/src/runtime/twin_runtime/external_formal_v3_amendment19_runner_v1.ts'
      - 'apps/server/src/runtime/twin_runtime/postgres_external_formal_forcing_base_continuity_repository_v1.ts'
      - 'apps/server/db/migrations/2026_08_25_mcft_cap_09_v13_forcing_base_continuity.sql'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_V13_NEXT_TICK_VIABILITY_POSTGRES.ts'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_V13_POST_COMMIT_ADJUDICATION_BOUNDARY.ts'
      - 'apps/server/src/external_evidence/mcft_cap09_phase7_private_candidate_capture_promotion_v1.ts'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

env:
  NODE_VERSION: '20.11.1'
  PNPM_VERSION: '9.15.4'
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mcft_cap09_v13_viability_acceptance
  EXACT_PREDECESSOR_SHA: '26c1383f7f45abb76c99e28ec3d06714e85d1b2c'
  SUCCESSOR_REQUALIFICATION_BASE_SHA: '46c9c7b6b59c113848fc69daff88fb183fccc954'

concurrency:
  group: mcft-cap09-v13-next-tick-viability-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: false

jobs:
  next-tick-viability:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcft_cap09_v13_viability_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mcft_cap09_v13_viability_acceptance"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile
      - name: Require exact predecessor and development-only surface
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            if [ "$base" != "$EXACT_PREDECESSOR_SHA" ] && [ "$base" != "$SUCCESSOR_REQUALIFICATION_BASE_SHA" ]; then
              echo "V13_NEXT_TICK_UNGOVERNED_BASE:${base}" >&2
              exit 1
            fi
          fi
          test -z "${GEOX_MCFT_CAP09_T4R1_S6_DATABASE_URL:-}"
      - name: Typecheck v5 viability-gated runner surface
        run: >-
          pnpm exec tsc --noEmit --pretty false --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext --esModuleInterop --types node
          apps/server/src/runtime/twin_runtime/postgres_external_formal_next_tick_viability_v1.ts
          apps/server/src/runtime/twin_runtime/external_formal_v5_viability_gated_scheduler_v1.ts
          apps/server/src/runtime/twin_runtime/external_formal_v5_amendment19_runner_v1.ts
          scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_V13_NEXT_TICK_VIABILITY_POSTGRES.ts
          scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_V13_POST_COMMIT_ADJUDICATION_BOUNDARY.ts
      - name: Run real PostgreSQL next-tick viability acceptance
        env:
          MCFT_CAP09_V13_VIABILITY_DESTRUCTIVE_ACCEPTANCE: '1'
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_V13_NEXT_TICK_VIABILITY_POSTGRES.ts
      - name: Prove post-COMMIT adjudication failure cannot re-terminalize predecessor
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_V13_POST_COMMIT_ADJUDICATION_BOUNDARY.ts
      - name: Typecheck full server Runtime surface
        run: pnpm --filter @geox/server typecheck
      - name: Validate viability machine proof
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_V13_NEXT_TICK_VIABILITY_POSTGRES_RESULT.json','utf8'));
          for(const key of ['o00_a0_warm_start_exception_verified','runtime_cursor_exact_preclaim_boundary_verified','o01_requires_o00_forcing_base_attestation','exact_predecessor_forcing_base_required','physical_attestation_before_base_required','a2_blocked_does_not_imply_successor_viable','o08_claim_prevented_when_o07_forcing_base_terminal','successor_claim_forbidden_when_next_tick_viable_false'])if(p[key]!==true)throw new Error(`V13_VIABILITY_MACHINE_PROOF_MISSING:${key}`);
          if(p.status!=='PASS'||p.viability_failure_underlying_scheduler_claim_count!==0||p.canonical_tick_core_changed!==false||p.production_workflow_effect!==false||p.mcft_cap09_completed!==false)throw new Error('V13_VIABILITY_NONCLAIM_REGRESSION');
      - name: Validate post-COMMIT adjudication boundary proof
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_V13_POST_COMMIT_ADJUDICATION_BOUNDARY_RESULT.json','utf8'));
          if(p.status!=='PASS'||p.predecessor_terminal_commit_count!==1||p.successor_adjudication_attempt_count!==1||p.post_commit_adjudication_failure_propagated_from_v5!==true||p.post_commit_adjudication_failure_does_not_reterminalize_current_slot!==true||p.frozen_v3_runner_modified!==false||p.canonical_tick_core_changed!==false||p.production_workflow_effect!==false||p.mcft_cap09_completed!==false)throw new Error('V13_POST_COMMIT_ADJUDICATION_BOUNDARY_REGRESSION');
      - name: Upload immutable viability proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-v13-next-tick-viability-${{ github.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_V13_NEXT_TICK_VIABILITY_POSTGRES_RESULT.json
            acceptance-output/MCFT_CAP_09_V13_POST_COMMIT_ADJUDICATION_BOUNDARY_RESULT.json
          if-no-files-found: error
          retention-days: 90

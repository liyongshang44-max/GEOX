name: mcft-cap-09-ea1b-bcse-g1r1-live-source-probe

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-ea1b-bcse-g1r1-live-source-probe.yml'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA1B-BCSE-G1R1-LIVE-SOURCE-PROBE-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA1B_BCSE_G1R1_LIVE_SOURCE_PROBE.cjs'
      - 'scripts/governance_acceptance/PROBE_MCFT_CAP_09_EA1B_BCSE_G1R1_SOURCES.mjs'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: mcft-cap09-ea1b-bcse-g1r1-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  live-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
      - name: Validate exact EA1B no-write governance boundary
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          MCFT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA1B_BCSE_G1R1_LIVE_SOURCE_PROBE.cjs
      - name: Syntax-check live probe
        run: node --check scripts/governance_acceptance/PROBE_MCFT_CAP_09_EA1B_BCSE_G1R1_SOURCES.mjs
      - name: Probe BCSE G1R1 public authorities and current machine feeds
        run: node scripts/governance_acceptance/PROBE_MCFT_CAP_09_EA1B_BCSE_G1R1_SOURCES.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap-09-ea1b-bcse-g1r1-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_EA1B_BCSE_G1R1_GOVERNANCE_RESULT.json
            acceptance-output/MCFT_CAP_09_EA1B_BCSE_G1R1_LIVE_SOURCE_PROBE_RESULT.json
          if-no-files-found: error
          retention-days: 90

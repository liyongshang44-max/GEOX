name: tmp-mcft-cap09-evidence-snapshot-callsite-migration

on:
  push:
    branches:
      - agent/mcft-cap09-evidence-snapshot-callsite-migration
    paths:
      - '.github/workflows/_tmp-mcft-cap09-evidence-snapshot-callsite-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mcft-cap09-evidence-snapshot-callsite-migration
          fetch-depth: 0
          persist-credentials: true

      - name: Apply Amendment-11 callsite migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          alias = 'exact_interval_availability_cutoff_time'
          canonical = 'evidence_snapshot_time'
          db_path = Path('apps/server/src/runtime/twin_runtime/postgres_external_formal_evidence_source_v1.ts')
          db = db_path.read_text(encoding='utf-8')

          replacements = [
            (
              '  evidence_snapshot_time: string;\n  /** @deprecated Amendment-11: transport compatibility only; value equals evidence_snapshot_time. */\n  exact_interval_availability_cutoff_time: string;\n',
              '  evidence_snapshot_time: string;\n',
            ),
            (
              '    evidence_snapshot_time?: string;\n    /** @deprecated Amendment-11: accepted only as a transport alias for evidence_snapshot_time. */\n    exact_interval_availability_cutoff_time?: string;\n',
              '    evidence_snapshot_time: string;\n',
            ),
            (
              '    const snapshotInput = input.evidence_snapshot_time ?? input.exact_interval_availability_cutoff_time;\n    const evidenceSnapshotTime = canonicalIsoV1(snapshotInput, "EA5E2_EXTERNAL_DB_EVIDENCE_SNAPSHOT_TIME_REQUIRED");\n    if (input.evidence_snapshot_time !== undefined && input.exact_interval_availability_cutoff_time !== undefined) {\n      const legacy = canonicalIsoV1(input.exact_interval_availability_cutoff_time, "EA5E2_EXTERNAL_DB_LEGACY_CUTOFF_INVALID");\n      if (legacy !== evidenceSnapshotTime) throw new Error("EA5E2_EXTERNAL_DB_EVIDENCE_SNAPSHOT_ALIAS_MISMATCH");\n    }\n',
              '    const evidenceSnapshotTime = canonicalIsoV1(input.evidence_snapshot_time, "EA5E2_EXTERNAL_DB_EVIDENCE_SNAPSHOT_TIME_REQUIRED");\n',
            ),
            (
              '      evidence_snapshot_time: evidenceSnapshotTime,\n      exact_interval_availability_cutoff_time: evidenceSnapshotTime,\n',
              '      evidence_snapshot_time: evidenceSnapshotTime,\n',
            ),
          ]
          for old, new in replacements:
            if old not in db:
              raise SystemExit(f'DB_EXPECTED_SNIPPET_MISSING: {old[:80]!r}')
            db = db.replace(old, new, 1)
          if alias in db:
            raise SystemExit('DB_ALIAS_REMAINS_AFTER_MIGRATION')
          db_path.write_text(db, encoding='utf-8')

          # The successor preflight must recognize the end-state public seam: snapshot is required,
          # while the legacy alias remains a readiness blocker if it ever reappears.
          preflight_path = Path('scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_AMENDMENT_11_SUCCESSOR_PREFLIGHT.cjs')
          preflight = preflight_path.read_text(encoding='utf-8')
          old_marker = '    "evidence_snapshot_time?: string",\n'
          new_marker = '    "evidence_snapshot_time: string",\n'
          if old_marker not in preflight:
            raise SystemExit('PREFLIGHT_OPTIONAL_SNAPSHOT_MARKER_MISSING')
          preflight = preflight.replace(old_marker, new_marker, 1)
          preflight_path.write_text(preflight, encoding='utf-8')

          preserve = {
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-AMENDMENT-07-EXTERNAL-FORMAL-FIXED-LAG-CAUSALITY-AUTHORITY.md',
            'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_AMENDMENT_07_EXTERNAL_FORMAL_FIXED_LAG_CAUSALITY.cjs',
            'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_AMENDMENT_11_SUCCESSOR_PREFLIGHT.cjs',
          }
          changed = []
          for path in Path('.').rglob('*'):
            if not path.is_file() or '.git' in path.parts:
              continue
            rel = path.as_posix()
            if rel in preserve or rel == db_path.as_posix():
              continue
            try:
              text = path.read_text(encoding='utf-8')
            except UnicodeDecodeError:
              continue
            if alias not in text:
              continue
            text = text.replace(alias, canonical)
            path.write_text(text, encoding='utf-8')
            changed.append(rel)

          print('migrated files:')
          for rel in changed:
            print(rel)
          PY

          echo 'Remaining non-historical alias occurrences:'
          git grep -n 'exact_interval_availability_cutoff_time' -- . \
            ':(exclude)docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-AMENDMENT-07-EXTERNAL-FORMAL-FIXED-LAG-CAUSALITY-AUTHORITY.md' \
            ':(exclude)scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_AMENDMENT_07_EXTERNAL_FORMAL_FIXED_LAG_CAUSALITY.cjs' \
            ':(exclude)scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_AMENDMENT_11_SUCCESSOR_PREFLIGHT.cjs' \
            && exit 1 || true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck server and focused External Formal paths
        run: |
          pnpm --filter @geox/server run typecheck
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_EXTERNAL_FORMAL_DATABASE_EVIDENCE_SOURCE.ts
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_DATABASE_SOURCE_TO_EXTERNAL_CAP04.ts
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_AMENDMENT_11_DATABASE_SOURCE_TO_EXTERNAL_CAP04.ts

      - name: Prove Amendment-11 successor readiness blocker reduction
        shell: bash
        run: |
          set -euo pipefail
          node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_AMENDMENT_11_SUCCESSOR_PREFLIGHT.cjs
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_EA5E2_AMENDMENT_11_SUCCESSOR_PREFLIGHT.json','utf8'));
          if (p.status !== 'PASS') throw new Error(`STATIC_PREFLIGHT_NOT_PASS:${p.status}`);
          const codes = p.readiness_blockers.map(x => x.code).sort();
          const expected = ['CURRENT_CROP_AUTHORITY_HAS_NO_FUTURE_LEGAL_TARGET'];
          if (JSON.stringify(codes) !== JSON.stringify(expected)) {
            throw new Error(`READINESS_BLOCKER_SET_NOT_REDUCED:${JSON.stringify(codes)}`);
          }
          console.log(JSON.stringify({status:'PASS', readiness_blocker_count:codes.length, readiness_blockers:codes}));
          NODE

      - name: Commit successful migration and self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_tmp-mcft-cap09-evidence-snapshot-callsite-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'fix(mcft-cap09): complete evidence snapshot callsite migration'
          git push origin HEAD:agent/mcft-cap09-evidence-snapshot-callsite-migration

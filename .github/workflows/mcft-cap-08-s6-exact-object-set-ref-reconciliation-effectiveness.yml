name: mcft-cap-08-s6-exact-object-set-ref-reconciliation-effectiveness

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-08-s6-exact-object-set-ref-reconciliation-effectiveness.yml'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-EXACT-OBJECT-SET-REF-RECONCILIATION-EFFECTIVENESS-AUTHORITY-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-EXACT-DATABASE-PORT-BUNDLE-POST-RECONCILIATION-AUTHORITY-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-EXACT-OBJECT-SET-REF-RECONCILIATION-EFFECTIVENESS-BOUNDARY-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_EXACT_OBJECT_SET_REF_RECONCILIATION_EFFECTIVENESS.cjs'

permissions:
  contents: read

jobs:
  exact-ref-effectiveness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate exact-ref reconciliation effectiveness and port-bundle continuation authority
        env:
          MCFT_BASE_SHA: 96f6032b43338a923cb830aca6e1f1d714604bce
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_EXACT_OBJECT_SET_REF_RECONCILIATION_EFFECTIVENESS.cjs
      - name: Upload exact-ref effectiveness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap-08-s6-exact-ref-effectiveness-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/MCFT_CAP_08_S6_EXACT_OBJECT_SET_REF_RECONCILIATION_EFFECTIVENESS_RESULT.json
          if-no-files-found: error
          retention-days: 90

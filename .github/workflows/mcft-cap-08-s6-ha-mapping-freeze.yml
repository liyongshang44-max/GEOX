name: mcft-cap-08-s6-ha-mapping-freeze

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-08-s6-ha-mapping-freeze.yml'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-HA-MAPPING-FREEZE-AUTHORITY-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-WITNESS-IMPLEMENTATION-AUTHORITY-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-HA-MAPPING-FREEZE-BOUNDARY-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_HA_MAPPING_FREEZE.cjs'

permissions:
  contents: read
  pull-requests: read

jobs:
  s6-ha-mapping-freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch exact owner disposition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/2695/reviews/4793622250"             > /tmp/mcft-cap08-s6-owner-review.json

      - name: Validate exact mapping freeze transition
        env:
          MCFT_BASE_SHA: 7e75bf2093f7e60ca087a0cd20c33803adef6891
          MCFT_OWNER_REVIEW_JSON: /tmp/mcft-cap08-s6-owner-review.json
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_HA_MAPPING_FREEZE.cjs

      - name: Upload freeze evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap-08-s6-ha-mapping-freeze-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/MCFT_CAP_08_S6_HA_MAPPING_FREEZE_RESULT.json
          if-no-files-found: error
          retention-days: 90

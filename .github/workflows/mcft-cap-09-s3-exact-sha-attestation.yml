name: temporary-mcft-cap-09-s3-r2-metadata-upload-only

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-s3-exact-sha-attestation.yml'

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: temporary-cap09-s3-r2-metadata-upload-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  temporary-r2-metadata-upload:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
      - name: Materialize corrected S3 R2 metadata
        env:
          SOURCE_COMMIT: d86f0c979f69a89807e4cd88faa51928be587993
          SOURCE_WORKFLOW_BLOB: e70eded76878000b40bc02b7bc0b3ae7432c4fa7
          SOURCE_VALIDATOR_BLOB: 3bbf9eb5f3c23e244f619bcd1d3ddddd94f99630
          WORKFLOW_PATH: .github/workflows/mcft-cap-09-s3-exact-sha-attestation.yml
          VALIDATOR_PATH: scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_S3_EXACT_SHA_ATTESTATION_V1.cjs
        run: |
          set -euo pipefail
          test "$(git rev-parse "${SOURCE_COMMIT}:${WORKFLOW_PATH}")" = "${SOURCE_WORKFLOW_BLOB}"
          test "$(git rev-parse "${SOURCE_COMMIT}:${VALIDATOR_PATH}")" = "${SOURCE_VALIDATOR_BLOB}"
          git show "${SOURCE_COMMIT}:${WORKFLOW_PATH}" > /tmp/materialized-workflow.yml
          git show "${SOURCE_COMMIT}:${VALIDATOR_PATH}" > /tmp/materialized-validator.cjs
          node - <<'NODE'
          const fs = require('node:fs');
          function replaceOnce(source, from, to, code) {
            if (source.split(from).length !== 2) throw new Error(`${code}_CARDINALITY`);
            return source.replace(from, to);
          }
          let workflow = fs.readFileSync('/tmp/materialized-workflow.yml', 'utf8');
          let validator = fs.readFileSync('/tmp/materialized-validator.cjs', 'utf8');
          workflow = replaceOnce(workflow,
            'MCFT_CONTROL_PLANE_GENERATION: S3_EXACT_SHA_R2_REPAIR_V2',
            'MCFT_CONTROL_PLANE_GENERATION: S3_EXACT_SHA_R2_REPAIR_V3',
            'WORKFLOW_GENERATION');
          workflow = replaceOnce(workflow,
            'MCFT_FAILED_CONTROL_PLANE_SHA: 41d763c7b1b1c9f35efc702b965ab0cea4632447',
            'MCFT_FAILED_CONTROL_PLANE_SHA: d86f0c979f69a89807e4cd88faa51928be587993',
            'WORKFLOW_FAILED_CONTROL');
          validator = replaceOnce(validator,
            "const FOCUSED_DIGEST = 'sha256:bac8fa6b0cde49aafa84eeaf0a2d505841883888ee9d1bcb926549114aaaf793';",
            "const FOCUSED_DIGEST = 'sha256:bac8fa6b54d56815b1717c8cba2e8aaaec86c2f6658095fcbce323997657b2cf';",
            'FOCUSED_DIGEST');
          validator = replaceOnce(validator,
            "const FAILED_CONTROL_MERGE = '41d763c7b1b1c9f35efc702b965ab0cea4632447';",
            "const FAILED_CONTROL_MERGE = 'd86f0c979f69a89807e4cd88faa51928be587993';",
            'FAILED_CONTROL_MERGE');
          validator = replaceOnce(validator,
            "const FAILED_CONTROL_HEAD = '83deb238efb372dc4f573ab71cf49088004b7ac8';",
            "const FAILED_CONTROL_HEAD = 'c38419fb6ebc2e33012c47d4815597a6fa8b7ab5';",
            'FAILED_CONTROL_HEAD');
          validator = replaceOnce(validator,
            "const FAILED_CONTROL_TREE = 'f04dbb31e5824fb3fcb99cc9ecd99b3303507c6a';",
            "const FAILED_CONTROL_TREE = 'a6d8262bcb23511c06a6f518dd1a91555be51d7e';",
            'FAILED_CONTROL_TREE');
          validator = replaceOnce(validator,
            'const FAILED_RUN = 31068800943;',
            'const FAILED_RUN = 31072140910;',
            'FAILED_RUN');
          validator = replaceOnce(validator,
            "'b185b1e40f6b6a2c64445548bcb549fa5fa36121',\n'9d50947fa0ae77dac91fd6a8a4bceaa2fb20eb8d',",
            "'e70eded76878000b40bc02b7bc0b3ae7432c4fa7',\n'3bbf9eb5f3c23e244f619bcd1d3ddddd94f99630',",
            'FAILED_CONTROL_BLOBS');
          for (const token of [
            'S3_EXACT_SHA_R2_REPAIR_V3',
            'd86f0c979f69a89807e4cd88faa51928be587993',
          ]) if (!workflow.includes(token)) throw new Error(`WORKFLOW_TOKEN:${token}`);
          for (const token of [
            'sha256:bac8fa6b54d56815b1717c8cba2e8aaaec86c2f6658095fcbce323997657b2cf',
            'd86f0c979f69a89807e4cd88faa51928be587993',
            'c38419fb6ebc2e33012c47d4815597a6fa8b7ab5',
            'a6d8262bcb23511c06a6f518dd1a91555be51d7e',
            '31072140910',
            'e70eded76878000b40bc02b7bc0b3ae7432c4fa7',
            '3bbf9eb5f3c23e244f619bcd1d3ddddd94f99630',
            'candidate_to_merge_tree_delta',
            's3_persistent_sequential_scheduler_effective',
            'MCFT_CAP_09_S4_REGISTRY_REGISTRATION',
          ]) if (!validator.includes(token)) throw new Error(`VALIDATOR_TOKEN:${token}`);
          fs.writeFileSync('/tmp/materialized-workflow.yml', workflow);
          fs.writeFileSync('/tmp/materialized-validator.cjs', validator);
          NODE
          node --check /tmp/materialized-validator.cjs
          git diff --no-index --check /dev/null /tmp/materialized-workflow.yml || test "$?" = 1
          git diff --no-index --check /dev/null /tmp/materialized-validator.cjs || test "$?" = 1
          sha256sum /tmp/materialized-workflow.yml /tmp/materialized-validator.cjs > /tmp/materialized-sha256.txt
      - name: Upload materialized two-file result
        uses: actions/upload-artifact@v4
        with:
          name: temporary-cap09-s3-r2-metadata-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/materialized-workflow.yml
            /tmp/materialized-validator.cjs
            /tmp/materialized-sha256.txt
          if-no-files-found: error
          retention-days: 1

name: temporary-mcft-cap-09-s3-validator-materializer

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-s3-exact-sha-attestation.yml'

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: temporary-cap09-s3-validator-materializer-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  temporary-validator-materializer:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout temporary materializer head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
      - name: Materialize validator from exact repository Blob
        env:
          SOURCE_COMMIT: 8277763afc3bf8f251e1aa3c76c4972ab9be468a
          SOURCE_BLOB: a1c23f2183fffa79348fbb970aaff03d690911f6
          TARGET_BRANCH: agent/tmp-mcft-cap09-s3-validator-materialized-r4
          VALIDATOR_PATH: scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_S3_EXACT_SHA_ATTESTATION_V1.cjs
        run: |
          set -euo pipefail
          test "$(git rev-parse "${SOURCE_COMMIT}:${VALIDATOR_PATH}")" = "${SOURCE_BLOB}"
          git show "${SOURCE_COMMIT}:${VALIDATOR_PATH}" > /tmp/source-validator.cjs
          node - <<'NODE'
          const fs = require('node:fs');
          const sourcePath = '/tmp/source-validator.cjs';
          const targetPath = '/tmp/materialized-validator.cjs';
          let source = fs.readFileSync(sourcePath, 'utf8');
          const oldBlock = [
            'must(',
            '!validator.includes("focusedRun.name===\'mcft-cap-09-s3-persistent-sequential-scheduler\'"),',
            "'BRITTLE_NAME_CHECK_FORBIDDEN',",
            ');',
          ].join('\n');
          const replacement = [
            'const brittleFocusedWorkflowNameExpression = [',
            "'focusedRun',",
            "'.name===',",
            "JSON.stringify(['mcft','cap','09','s3','persistent','sequential','scheduler'].join('-')),",
            "].join('');",
            'must(',
            '!validator.includes(brittleFocusedWorkflowNameExpression),',
            "'BRITTLE_NAME_CHECK_FORBIDDEN',",
            ');',
          ].join('\n');
          if (source.split(oldBlock).length !== 2) throw new Error('EXACT_REPLACEMENT_CARDINALITY_REQUIRED');
          source = source.replace(oldBlock, replacement);
          const declarationMarker = ['MCFT','CANDIDATE','DECLARATION','V2'].join('_');
          const brittle = "focusedRun.name==='mcft-cap-09-s3-persistent-sequential-scheduler'";
          if (source.includes(declarationMarker)) throw new Error('DECLARATION_LITERAL_REMAINS');
          if (source.includes(brittle)) throw new Error('BRITTLE_EXPRESSION_REMAINS');
          for (const token of [
            '15cdb24667d43cf7c21294d22b68160c6668cf73',
            'candidate_to_merge_tree_delta',
            's3_persistent_sequential_scheduler_effective',
            'MCFT_CAP_09_S4_REGISTRY_REGISTRATION',
            'semantic_artifact_digest',
            '31066566600',
            '8954037604',
            '31066566555',
            '31068800943',
          ]) {
            if (!source.includes(token)) throw new Error(`REQUIRED_TOKEN_MISSING:${token}`);
          }
          fs.writeFileSync(targetPath, source);
          NODE
          node --check /tmp/materialized-validator.cjs
          git fetch origin "${TARGET_BRANCH}:${TARGET_BRANCH}"
          git checkout "${TARGET_BRANCH}"
          cp /tmp/materialized-validator.cjs "${VALIDATOR_PATH}"
          git config user.name 'geox-governance-materializer'
          git config user.email 'actions@users.noreply.github.com'
          git add "${VALIDATOR_PATH}"
          git diff --cached --quiet && { echo 'NO_MATERIALIZED_DELTA' >&2; exit 1; }
          git commit -m 'materialize MCFT-CAP-09 S3 exact-SHA validator repair'
          git push origin "HEAD:${TARGET_BRANCH}"
      - name: Upload materialized validator proof
        uses: actions/upload-artifact@v4
        with:
          name: temporary-cap09-s3-validator-${{ github.event.pull_request.head.sha }}
          path: /tmp/materialized-validator.cjs
          if-no-files-found: error
          retention-days: 1

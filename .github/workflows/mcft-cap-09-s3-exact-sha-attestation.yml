name: tmp-mcft-cap-09-s4-git-blob-loader

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-s3-exact-sha-attestation.yml'

permissions:
  actions: read
  contents: write

jobs:
  load-s4-git-blobs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download validated S4 materialization artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 31081870857
          artifact-ids: 8959782727
          path: transport
          repository: liyongshang44-max/GEOX
          github-token: ${{ github.token }}
      - name: Restore complete materialization including hidden workflow paths
        run: |
          set -euo pipefail
          mkdir -p transport-unpacked
          tar -xzf transport/mcft-cap-09-s4-registry-materialized/materialized-s4-registry.tar.gz -C transport-unpacked
          test -f transport-unpacked/materialized/.github/workflows/mcft-cap-09-s2-registry-registration.yml
          test -f transport-unpacked/materialized/MATERIALIZATION-MANIFEST.json
      - name: Verify bytes and create unreferenced Git blobs
        id: load
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const crypto = require('node:crypto');
            const fs = require('node:fs');
            const path = require('node:path');
            const root = path.join(process.cwd(), 'transport-unpacked', 'materialized');
            const manifestPath = path.join(root, 'MATERIALIZATION-MANIFEST.json');
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            if (manifest.base_sha !== 'd158e1277b4a9a9ba25b02e57f9b3d8294f89e9d') {
              throw new Error(`BASE_SHA_MISMATCH:${manifest.base_sha}`);
            }
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const results = {};
            for (const [relative, expected] of Object.entries(manifest.files)) {
              const bytes = fs.readFileSync(path.join(root, relative));
              const sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
              const gitBlob = crypto.createHash('sha1')
                .update(Buffer.concat([Buffer.from(`blob ${bytes.length}\0`), bytes]))
                .digest('hex');
              if (bytes.length !== expected.bytes) throw new Error(`BYTE_COUNT:${relative}`);
              if (sha256 !== expected.sha256) throw new Error(`SHA256:${relative}`);
              if (gitBlob !== expected.git_blob_sha) throw new Error(`LOCAL_GIT_BLOB:${relative}`);
              const response = await github.rest.git.createBlob({
                owner,
                repo,
                content: bytes.toString('base64'),
                encoding: 'base64',
              });
              if (response.data.sha !== expected.git_blob_sha) {
                throw new Error(`REMOTE_GIT_BLOB:${relative}:${response.data.sha}`);
              }
              results[relative] = response.data.sha;
            }
            fs.writeFileSync('S4-GIT-BLOB-LOAD-RESULT.json', JSON.stringify({
              base_sha: manifest.base_sha,
              status: 'PASS',
              files: results,
            }, null, 2) + '\n');
            core.setOutput('count', String(Object.keys(results).length));
      - name: Require exact ten-object load
        run: test '${{ steps.load.outputs.count }}' = '10'
      - uses: actions/upload-artifact@v4
        with:
          name: mcft-cap-09-s4-git-blob-load-result
          path: S4-GIT-BLOB-LOAD-RESULT.json
          if-no-files-found: error
          retention-days: 1

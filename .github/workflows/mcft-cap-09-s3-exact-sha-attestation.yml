name: tmp-mcft-cap-09-s4-registry-materializer

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-s3-exact-sha-attestation.yml'

permissions:
  contents: read

jobs:
  materialize-s4-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
      - name: Materialize exact S4 Registry files
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > /tmp/materializer.cjs
          test "$(sha256sum /tmp/materializer.cjs | awk '{print $1}')" = "c4a0f58dce73a303b60a8baeced683917f65a4c0a10a2501977d7b26f27c1233"
          node --check /tmp/materializer.cjs
          node /tmp/materializer.cjs
          ruby -e "require 'yaml'; YAML.load_file('materialized/.github/workflows/mcft-cap-09-s4-registry-registration.yml'); YAML.load_file('materialized/.github/workflows/mcft-cap-09-s2-registry-registration.yml')"
          tar -czf materialized-s4-registry.tar.gz materialized
      - uses: actions/upload-artifact@v4
        with:
          name: mcft-cap-09-s4-registry-materialized
          path: |
            materialized/
            materialized-s4-registry.tar.gz
          if-no-files-found: error
          retention-days: 1

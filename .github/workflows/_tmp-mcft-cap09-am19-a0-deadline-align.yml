name: tmp-mcft-cap09-am19-a0-deadline-align

on:
  pull_request:
    paths:
      - '.github/workflows/_tmp-mcft-cap09-am19-a0-deadline-align.yml'

permissions:
  contents: write

jobs:
  align:
    if: github.event.pull_request.head.ref == 'feat/mcft-cap09-am19-formal-successor-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mcft-cap09-am19-formal-successor-v1
          fetch-depth: 0
      - name: Apply exact frozen-deadline alignment
        shell: python
        run: |
          from pathlib import Path

          arm=Path('scripts/governance_acceptance/ASSEMBLE_MCFT_CAP_09_AMENDMENT_19_FORMAL_ARM_V1.cjs')
          s=arm.read_text(encoding='utf-8')
          old='  need(Date.parse(evaluatedAt) < Date.parse(a0), "AM19_FORMAL_ARM_A0_MUST_BE_FUTURE");\n'
          if s.count(old)!=1: raise SystemExit('ARM_FUTURE_A0_MARKER_CARDINALITY')
          s=s.replace(old,'')
          old='  const pass = assemble(gate, candidate, metadata);\n  need(pass.status === "PASS" && pass.a0 === candidate.target_t && pass.formal_o00_started === false && pass.formal_database_write_count === 0, "AM19_FORMAL_ARM_SELFTEST_PASS_FAILED");\n'
          new='  const pass = assemble(gate, candidate, metadata);\n  need(pass.status === "PASS" && pass.a0 === candidate.target_t && pass.formal_o00_started === false && pass.formal_database_write_count === 0, "AM19_FORMAL_ARM_SELFTEST_PASS_FAILED");\n  const postA0Pass = assemble(gate, candidate, { ...metadata, arm_evaluated_at: "2026-08-20T07:10:00.000Z" });\n  need(postA0Pass.status === "PASS" && postA0Pass.arm_to_o00_lead_minutes === 50, "AM19_FORMAL_ARM_SELFTEST_POST_A0_O00_LEAD_REQUIRED");\n'
          if s.count(old)!=1: raise SystemExit('ARM_SELFTEST_PASS_MARKER_CARDINALITY')
          s=s.replace(old,new)
          old='    ["nonfuture_a0", gate, candidate, { ...metadata, arm_evaluated_at: "2026-08-20T07:00:00.000Z" }, "AM19_FORMAL_ARM_A0_MUST_BE_FUTURE"],\n'
          new='    ["late_o00_lead", gate, candidate, { ...metadata, arm_evaluated_at: "2026-08-20T07:30:00.000Z" }, "AM19_FORMAL_ARM_INSUFFICIENT_O00_LEAD:30.000"],\n'
          if s.count(old)!=1: raise SystemExit('ARM_NEGATIVE_MARKER_CARDINALITY')
          s=s.replace(old,new)
          old='    future_a0_required: true,\n'
          new='    post_a0_arm_allowed_when_o00_lead_sufficient: true,\n    arm_deadline_authority: "O00_MINUS_35M_OPERATIONAL_RULE",\n'
          if s.count(old)!=1: raise SystemExit('ARM_OUTPUT_MARKER_CARDINALITY')
          s=s.replace(old,new)
          arm.write_text(s,encoding='utf-8')

          a0=Path('scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_FORMAL_A0_EVIDENCE_PROMOTION_V1.ts')
          s=a0.read_text(encoding='utf-8')
          old='  if (Date.now() >= Date.parse(arm.a0)) throw new Error("AM19_FORMAL_A0_PROMOTION_MUST_COMPLETE_BEFORE_A0");\n\n'
          if s.count(old)!=1: raise SystemExit('A0_OLD_DEADLINE_MARKER_CARDINALITY')
          s=s.replace(old,'')
          old='  try {\n    await assertFormalDatabaseZero(formalPool, formalUrl);\n'
          new='  try {\n    const databasePreflightAt = new Date((await formalPool.query("SELECT transaction_timestamp() AS database_now")).rows[0]?.database_now).toISOString();\n    if (Date.parse(databasePreflightAt) >= Date.parse(arm.o00)) throw new Error(`AM19_FORMAL_A0_PROMOTION_O00_DEADLINE_MISSED:${databasePreflightAt}:${arm.o00}`);\n    await assertFormalDatabaseZero(formalPool, formalUrl);\n'
          if s.count(old)!=1: raise SystemExit('A0_TRY_MARKER_CARDINALITY')
          s=s.replace(old,new)
          old='    writePhaseStarted = true;\n    for (const result of built.results) writeCount += (await ingress.appendCanonicalizedExternalEvidence(result)).canonical_fact_write_count;\n    if (writeCount !== 3) throw new Error(`AM19_FORMAL_A0_PROMOTION_EXACT_THREE_WRITES_REQUIRED:${writeCount}`);\n    const factCount = Number((await formalPool.query("SELECT count(*)::int AS n FROM facts")).rows[0]?.n ?? -1);\n    if (factCount !== 3) throw new Error(`AM19_FORMAL_A0_PROMOTION_FORMAL_FACT_COUNT_REQUIRED:${factCount}`);\n\n    writeOutput({\n'
          new='    writePhaseStarted = true;\n    for (const result of built.results) {\n      const beforeWriteAt = new Date((await formalPool.query("SELECT transaction_timestamp() AS database_now")).rows[0]?.database_now).toISOString();\n      if (Date.parse(beforeWriteAt) >= Date.parse(arm.o00)) throw new Error(`AM19_FORMAL_A0_PROMOTION_DEADLINE_CROSSED_DURING_WRITE:${beforeWriteAt}:${arm.o00}`);\n      writeCount += (await ingress.appendCanonicalizedExternalEvidence(result)).canonical_fact_write_count;\n    }\n    if (writeCount !== 3) throw new Error(`AM19_FORMAL_A0_PROMOTION_EXACT_THREE_WRITES_REQUIRED:${writeCount}`);\n    const factCount = Number((await formalPool.query("SELECT count(*)::int AS n FROM facts")).rows[0]?.n ?? -1);\n    if (factCount !== 3) throw new Error(`AM19_FORMAL_A0_PROMOTION_FORMAL_FACT_COUNT_REQUIRED:${factCount}`);\n    const promotionCompletedAt = new Date((await formalPool.query("SELECT transaction_timestamp() AS database_now")).rows[0]?.database_now).toISOString();\n    if (Date.parse(promotionCompletedAt) >= Date.parse(arm.o00)) throw new Error(`AM19_FORMAL_A0_PROMOTION_COMPLETED_AFTER_O00_FORBIDDEN:${promotionCompletedAt}:${arm.o00}`);\n\n    writeOutput({\n'
          if s.count(old)!=1: raise SystemExit('A0_WRITE_BLOCK_MARKER_CARDINALITY')
          s=s.replace(old,new)
          old='      a0: arm.a0,\n      record_types: built.results.map((x) => x.record.record_type),\n'
          new='      a0: arm.a0,\n      supported_slot_t: arm.o00,\n      database_preflight_at: databasePreflightAt,\n      promotion_completed_at: promotionCompletedAt,\n      promotion_completed_before_o00: true,\n      record_types: built.results.map((x) => x.record.record_type),\n'
          if s.count(old)!=1: raise SystemExit('A0_OUTPUT_MARKER_CARDINALITY')
          s=s.replace(old,new)
          old='    console.log(JSON.stringify({ schema_version: "geox_mcft_cap09_amendment19_formal_a0_evidence_promotion_selftest_v1", status: "PASS", raw_before_decoder: true, same_decoder_identity_required: true, transient_ref_forbidden_in_formal_fact: true, provider_refetch_count: 0, formal_effect: false }));\n'
          new='    console.log(JSON.stringify({ schema_version: "geox_mcft_cap09_amendment19_formal_a0_evidence_promotion_selftest_v1", status: "PASS", raw_before_decoder: true, same_decoder_identity_required: true, transient_ref_forbidden_in_formal_fact: true, a0_base_supports_o00: true, physical_promotion_deadline: "O00", provider_refetch_count: 0, formal_effect: false }));\n'
          if s.count(old)!=1: raise SystemExit('A0_SELFTEST_OUTPUT_MARKER_CARDINALITY')
          s=s.replace(old,new)
          a0.write_text(s,encoding='utf-8')

          final=Path('scripts/governance_acceptance/ASSEMBLE_MCFT_CAP_09_AMENDMENT_19_FORMAL_COMPLETION_V1.cjs')
          s=final.read_text(encoding='utf-8')
          old='  need(a0Promotion.canonical_fact_write_count===3&&a0Promotion.formal_fact_count===3,"AM19_FORMAL_COMPLETION_A0_EXACT_THREE_FACTS_REQUIRED");\n'
          new='  need(a0Promotion.canonical_fact_write_count===3&&a0Promotion.formal_fact_count===3,"AM19_FORMAL_COMPLETION_A0_EXACT_THREE_FACTS_REQUIRED");\n  const a0PromotionCompletedAt=iso(a0Promotion.promotion_completed_at,"AM19_FORMAL_COMPLETION_A0_PROMOTION_COMPLETED_AT_REQUIRED");\n  need(a0Promotion.supported_slot_t===o00&&a0Promotion.promotion_completed_before_o00===true&&Date.parse(a0PromotionCompletedAt)<Date.parse(o00),"AM19_FORMAL_COMPLETION_A0_PROMOTION_BEFORE_O00_REQUIRED");\n'
          if s.count(old)!=1: raise SystemExit('FINAL_A0_MARKER_CARDINALITY')
          s=s.replace(old,new)
          old='  const a0p={schema_version:"geox_mcft_cap09_amendment19_formal_a0_evidence_promotion_result_v1",status:"PASS",subject_sha:subject,arm_identity_hash:armId,epoch_id:"epoch",formal_database_name:FORMAL_DATABASE,a0,canonical_fact_write_count:3,formal_fact_count:3,producer_bound_transient_raw_reverification:true,'
          new='  const a0p={schema_version:"geox_mcft_cap09_amendment19_formal_a0_evidence_promotion_result_v1",status:"PASS",subject_sha:subject,arm_identity_hash:armId,epoch_id:"epoch",formal_database_name:FORMAL_DATABASE,a0,supported_slot_t:o00,promotion_completed_at:new Date(Date.parse(o00)-60000).toISOString(),promotion_completed_before_o00:true,canonical_fact_write_count:3,formal_fact_count:3,producer_bound_transient_raw_reverification:true,'
          if s.count(old)!=1: raise SystemExit('FINAL_SELFTEST_A0_MARKER_CARDINALITY')
          s=s.replace(old,new)
          final.write_text(s,encoding='utf-8')
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
          cache: pnpm
      - name: Validate exact non-workflow refactor before push
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 3
          expected=$(printf '%s\n' scripts/governance_acceptance/ASSEMBLE_MCFT_CAP_09_AMENDMENT_19_FORMAL_ARM_V1.cjs scripts/governance_acceptance/ASSEMBLE_MCFT_CAP_09_AMENDMENT_19_FORMAL_COMPLETION_V1.cjs scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_FORMAL_A0_EVIDENCE_PROMOTION_V1.ts | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$expected"
          pnpm install --frozen-lockfile
          node scripts/governance_acceptance/ASSEMBLE_MCFT_CAP_09_AMENDMENT_19_FORMAL_ARM_V1.cjs --selftest
          pnpm exec tsc --noEmit --pretty false --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext --esModuleInterop --types node scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_FORMAL_A0_EVIDENCE_PROMOTION_V1.ts
          pnpm exec tsx scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_FORMAL_A0_EVIDENCE_PROMOTION_V1.ts selftest
          node scripts/governance_acceptance/ASSEMBLE_MCFT_CAP_09_AMENDMENT_19_FORMAL_COMPLETION_V1.cjs selftest
      - name: Commit and push only the aligned scripts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/governance_acceptance/ASSEMBLE_MCFT_CAP_09_AMENDMENT_19_FORMAL_ARM_V1.cjs scripts/governance_acceptance/ASSEMBLE_MCFT_CAP_09_AMENDMENT_19_FORMAL_COMPLETION_V1.cjs scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_FORMAL_A0_EVIDENCE_PROMOTION_V1.ts
          git diff --cached --check
          git commit -m 'MCFT-CAP-09: align A0 promotion deadline to O00'
          git push origin HEAD:feat/mcft-cap09-am19-formal-successor-v1

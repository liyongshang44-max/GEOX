name: mcft-cap-09-t3r1-fast-path-requalification

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-t3r1-fast-path-requalification.yml'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-T3R1-FAST-PATH-REQUALIFICATION-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_T3R1_FAST_PATH_REQUALIFICATION.cjs'
      - 'scripts/runtime_acceptance/PROBE_MCFT_CAP_09_T3R1_FAST_PATH_REQUALIFICATION.mjs'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: mcft-cap09-t3r1-fast-path-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  t3r1-fast-path-requalification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm

      - name: Resolve exact T3R1 fast-path base and subject
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "subject_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_sha=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
            echo "subject_sha=${{ github.event.merge_group.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install exact repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for KBS live requalification
        run: pnpm exec playwright install --with-deps chromium

      - name: Syntax-check T3R1 proof code
        run: |
          node --check scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_T3R1_FAST_PATH_REQUALIFICATION.cjs
          node --check scripts/runtime_acceptance/PROBE_MCFT_CAP_09_T3R1_FAST_PATH_REQUALIFICATION.mjs

      - name: Validate exact T3R1 governance boundary
        env:
          MCFT_BASE_SHA: ${{ steps.authority.outputs.base_sha }}
          MCFT_SUBJECT_SHA: ${{ steps.authority.outputs.subject_sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_T3R1_FAST_PATH_REQUALIFICATION.cjs

      - name: Execute live T3R1 fast-path requalification
        env:
          MCFT_SUBJECT_SHA: ${{ steps.authority.outputs.subject_sha }}
        run: node scripts/runtime_acceptance/PROBE_MCFT_CAP_09_T3R1_FAST_PATH_REQUALIFICATION.mjs

      - name: Verify fail-closed T3R1 result contract
        shell: node {0}
        run: |
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_T3R1_FAST_PATH_REQUALIFICATION_RESULT.json','utf8'));
          const subject = '${{ steps.authority.outputs.subject_sha }}';
          if (result.status !== 'PASS') throw new Error('T3R1_FAST_PATH_LIVE_PASS_REQUIRED');
          if (result.subject_sha !== subject) throw new Error('T3R1_FAST_PATH_EXACT_HEAD_RESULT_REQUIRED');
          if (result.planting_crop_hybrid_authority_candidate?.status !== 'RESOLVED_CANDIDATE') throw new Error('T3R1_FAST_PATH_PLANTING_IDENTITY_REQUIRED');
          if (!['ACTIVE','TERMINATED','UNRESOLVED'].includes(result.current_season_lifecycle_authority?.status)) throw new Error('T3R1_FAST_PATH_LIFECYCLE_STATUS_INVALID');
          if (result.current_season_lifecycle_authority?.active_established !== false) throw new Error('T3R1_FAST_PATH_PREMATURE_ACTIVE_AUTHORITY');
          if (result.current_season_lifecycle_authority?.absence_of_termination_used_to_prove_active !== false) throw new Error('T3R1_FAST_PATH_ACTIVE_FROM_SILENCE_FORBIDDEN');
          if (result.current_season_lifecycle_authority?.provider_retrieval_time_used_as_coverage_watermark !== false) throw new Error('T3R1_FAST_PATH_RETRIEVAL_WATERMARK_FORBIDDEN');
          if (!['RESOLVED','UNRESOLVED'].includes(result.derived_crop_water_use_stage_authority_candidate?.status)) throw new Error('T3R1_FAST_PATH_STAGE_STATUS_INVALID');
          if (result.derived_crop_water_use_stage_authority_candidate?.single_fao_variant_selected !== false) throw new Error('T3R1_FAST_PATH_SINGLE_FAO_VARIANT_FORBIDDEN');
          if (!['RESOLVED','UNRESOLVED'].includes(result.crop_model_parameter_authority_candidate?.status)) throw new Error('T3R1_FAST_PATH_KC_STATUS_INVALID');
          if (result.crop_model_parameter_authority_candidate?.invented !== false) throw new Error('T3R1_FAST_PATH_KC_INVENTION_FORBIDDEN');
          if (result.t3r1_crop_only_geometry_authority_candidate?.whole_t3r1_polygon_assumed_crop_only !== false) throw new Error('T3R1_FAST_PATH_WHOLE_PLOT_CROP_ONLY_FORBIDDEN');
          if (result.t3r1_crop_only_geometry_authority_candidate?.prairie_strip_relabelled_corn !== false) throw new Error('T3R1_FAST_PATH_STRIP_RELABELLING_FORBIDDEN');
          if (result.fast_path_readiness?.t1r1_formal_binding_mutated !== false || result.fast_path_readiness?.formal_rebind_authorized !== false || result.fast_path_readiness?.ea5e2_operational_activation_authorized !== false) throw new Error('T3R1_FAST_PATH_PREMATURE_FORMAL_EFFECT');
          for (const field of ['database_write_count','formal_evidence_write_count','raw_object_write_count','runtime_config_write_count','scheduler_write_count','canonical_runtime_write_count']) {
            if (result[field] !== 0) throw new Error(`T3R1_FAST_PATH_ZERO_WRITE_REQUIRED:${field}`);
          }
          if (result.formal_window_started !== false || result.formal_execution_count !== '0/24') throw new Error('T3R1_FAST_PATH_FORMAL_NONCLAIM_REQUIRED');
          console.log(JSON.stringify({
            status:'PASS',
            planting_observation_id:result.planting_crop_hybrid_authority_candidate.provider_observation_id,
            lifecycle:result.current_season_lifecycle_authority.status,
            stage:result.derived_crop_water_use_stage_authority_candidate.stage,
            kc:result.crop_model_parameter_authority_candidate.kc,
            legal_target_hours:result.derived_crop_water_use_stage_authority_candidate.contiguous_legal_target_hours,
            geometry:result.t3r1_crop_only_geometry_authority_candidate.status,
            readiness:result.fast_path_readiness.status,
            blockers:result.fast_path_readiness.blockers,
            next_frontier:result.next_frontier
          }));

      - name: Upload immutable T3R1 requalification proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-t3r1-fast-path-${{ steps.authority.outputs.subject_sha }}
          path: |
            acceptance-output/MCFT_CAP_09_T3R1_FAST_PATH_REQUALIFICATION_GOVERNANCE_RESULT.json
            acceptance-output/MCFT_CAP_09_T3R1_FAST_PATH_REQUALIFICATION_RESULT.json
            docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-T3R1-FAST-PATH-REQUALIFICATION-V1.json
          if-no-files-found: error
          retention-days: 90

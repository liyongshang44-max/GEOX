name: ADR — GEOX PostgreSQL Transaction-Guarded Shadow Observer

on:
  push:
    branches:
      - main
      - feat/adr-geox-postgres-transaction-guarded-shadow-v1
    paths:
      - 'apps/server/src/integrations/adr/**'
      - 'apps/server/src/services/derived_sensing_state_v1.ts'
      - 'apps/server/src/services/derived_sensing_state_service_v1.ts'
      - 'scripts/adr_adoption/real_geox_postgres_transaction_guarded_shadow_v1.mjs'
      - '.github/workflows/adr-geox-postgres-transaction-guarded-shadow.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/server/src/integrations/adr/**'
      - 'apps/server/src/services/derived_sensing_state_v1.ts'
      - 'apps/server/src/services/derived_sensing_state_service_v1.ts'
      - 'scripts/adr_adoption/real_geox_postgres_transaction_guarded_shadow_v1.mjs'
      - '.github/workflows/adr-geox-postgres-transaction-guarded-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '20.11.1'
  PNPM_VERSION: '9.15.4'
  GEOX_ADR_TRANSACTION_GUARD_QUALIFICATION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  DATABASE_URL: 'postgres://postgres:postgres@127.0.0.1:5432/geox_adr_transaction_guard'

jobs:
  transaction_guarded_shadow:
    name: Node 20 production-owned PostgreSQL transaction guard proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: geox_adr_transaction_guard
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d geox_adr_transaction_guard"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout exact GEOX candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GEOX_ADR_TRANSACTION_GUARD_QUALIFICATION_HEAD }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Prove exact checkout and isolated database boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GEOX_ADR_TRANSACTION_GUARD_QUALIFICATION_HEAD"
          node --version | grep '^v20\.11\.1$'
          pnpm --version | grep '^9\.15\.4$'
          test -z "${GEOX_MCFT_CAP09_T3R1_S6_DATABASE_URL:-}"
          test -z "${GEOX_MCFT_CAP09_T4R1_S6_DATABASE_URL:-}"
          test -z "${GEOX_RUNTIME_DATABASE_URL:-}"
          test -z "${GEOX_ADR_SHADOW_DATABASE_URL:-}"

      - name: Install exact GEOX workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile GEOX production ADR integration
        run: pnpm -w exec tsc -p apps/server/tsconfig.json

      - name: Run production-owned transaction guard qualification
        env:
          ADR_POSTGRES_TRANSACTION_GUARD_ISOLATED_ACCEPTANCE: '1'
        run: node scripts/adr_adoption/real_geox_postgres_transaction_guarded_shadow_v1.mjs

      - name: Validate transaction guard machine proof
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const path = 'acceptance-output/ADR_REAL_GEOX_POSTGRES_TRANSACTION_GUARDED_SHADOW_V1.json';
          const proof = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (proof.status !== 'PASS') throw new Error('ADR_P4_TRANSACTION_GUARD_NOT_PASS');
          if (proof.geoxSourceCommit !== process.env.GEOX_ADR_TRANSACTION_GUARD_QUALIFICATION_HEAD) throw new Error('ADR_P4_HEAD_MISMATCH');
          if (proof.p3MergedPredecessor !== '0267c224d5c0c0524997b724b89cbe03d4e8b299') throw new Error('ADR_P4_P3_PREDECESSOR_MISMATCH');
          if (!String(proof.postgresVersion).startsWith('16.')) throw new Error('ADR_P4_POSTGRES_VERSION_MISMATCH');
          for (const key of [
            'isolatedPostgresEndpoint',
            'productionTransactionGuardOwnedByIntegration',
            'provenancePreserved',
            'fixtureRowsUnchanged',
            'readOnlyOffFailsClosedBeforeContextRead',
            'wrongIsolationFailsClosedBeforeContextRead'
          ]) if (proof[key] !== true) throw new Error(`ADR_P4_PROOF_MISSING:${key}`);
          if (proof.transactionContractVersion !== 'geox.adr-postgres-read-only-shadow-transaction.v1') throw new Error('ADR_P4_CONTRACT_VERSION_MISMATCH');
          if (proof.transactionMode !== 'REPEATABLE_READ_READ_ONLY' || proof.transactionReadOnly !== 'on' || proof.transactionIsolation !== 'repeatable read') throw new Error('ADR_P4_TRANSACTION_MODE_MISMATCH');
          if (proof.observerConnectionCount !== 1 || proof.observerConnectionReleaseCount !== 1) throw new Error('ADR_P4_CONNECTION_LIFECYCLE_WRONG');
          if (proof.transactionStatementCount !== 5 || proof.productionReadModelSelectCount !== 1 || proof.productionWriteCount !== 0) throw new Error('ADR_P4_STATEMENT_BOUNDARY_WRONG');
          if (proof.realityRowCount !== 2 || proof.fixtureRowCountBefore !== 2 || proof.fixtureRowCountAfter !== 2) throw new Error('ADR_P4_FIXTURE_CARDINALITY_WRONG');
          for (const key of [
            'liveProductionReadModelObserved',
            'productionDatabaseEndpointUsed',
            'productionDatabaseCredentialProvisioned',
            'productionRuntimeActivated',
            'mcftRemoteDatabaseSecretUsed',
            'bLineDatabaseSecretUsed',
            'geoxFieldEqualsAdrTarget',
            'correspondenceOrEqualityEstablished',
            'recommendationWriteAuthorized',
            'approvalAuthorized',
            'operationPlanOrTaskCreationAuthorized',
            'dispatchAuthorized',
            'machineExecutionAuthorized',
            'newArchitectureDecisionRequired'
          ]) if (proof[key] !== false) throw new Error(`ADR_P4_NONCLAIM_REGRESSION:${key}`);

      - name: Upload transaction guard proof only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geox-adr-transaction-guard-${{ env.GEOX_ADR_TRANSACTION_GUARD_QUALIFICATION_HEAD }}
          path: acceptance-output/ADR_REAL_GEOX_POSTGRES_TRANSACTION_GUARDED_SHADOW_V1.json
          if-no-files-found: error
          retention-days: 30

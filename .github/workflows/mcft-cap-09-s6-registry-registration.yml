name: mcft-cap-09-s6-registry-registration

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-s6-registry-registration.yml'
      - '.github/workflows/mcft-cap-09-s2-registry-registration.yml'
      - '.github/workflows/mcft-cap-09-s3-registry-registration.yml'
      - '.github/workflows/mcft-cap-09-s4-registry-registration.yml'
      - 'docs/digital_twin/mcft/MCFT-CANDIDATE-AUTHORITY-REGISTRY-V1.json'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S6-*'
      - 'scripts/governance_acceptance/mcft_cap_09_registry_lifecycle_classifier_v1.cjs'
      - 'scripts/governance_acceptance/mcft_cap_09_registry_lifecycle_router_v1.cjs'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_S2_REGISTRY_CROSS_LIFECYCLE_REPAIR.cjs'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_S6_REGISTRY_REGISTRATION.cjs'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: mcft-cap09-s6-registry-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  s6-registry-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROTECTED_MAIN_ADOPTION_BASE_SHA: 'fa6e260d8cdec4a82403a86f1c7b3d5420e44ef8'
      CANONICAL_IMPLEMENTATION_SHA: 'd82c5caccce8169c19ce7ec2230e774a68a9f636'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify S6 Registry workflow applicability
        id: applicability
        env:
          MCFT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff --name-only "$MCFT_BASE_SHA"...HEAD | sort)"
          ea2_successor_files="$(printf '%s\n' \
            '.github/workflows/mcft-cap-09-ea2-formal-authority-freeze.yml' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S6-FORMAL-CROP-CONTEXT-AUTHORITY-V1.json' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S6-FORMAL-EXTERNAL-EVIDENCE-PACKAGE-V1.json' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S6-FORMAL-REALITY-BINDING-V1.json' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S6-FORMAL-SITE-AUTHORITY-V1.json' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S6-FORMAL-SOURCE-BINDING-MATRIX-V1.json' \
            'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA2_FORMAL_AUTHORITY_FREEZE.cjs' | sort)"
          t3r1_successor_files="$(printf '%s\n' \
            '.github/workflows/mcft-cap-09-t3r1-formal-successor-authority.yml' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-AMENDMENT-17-T3R1-FORMAL-SUCCESSOR-SCOPE-AUTHORITY.md' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S6-FORMAL-CROP-CONTEXT-AUTHORITY-V2.json' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S6-FORMAL-REALITY-BINDING-V2.json' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S6-FORMAL-SITE-AUTHORITY-V2.json' \
            'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_T3R1_FORMAL_SUCCESSOR_AUTHORITY.cjs' \
            'scripts/runtime_acceptance/PROBE_MCFT_CAP_09_T3R1_FORMAL_SUCCESSOR_AUTHORITY.mjs' | sort)"
          t4r1_successor_files="$(printf '%s\n' \
            '.github/workflows/mcft-cap-09-t4r1-formal-successor-authority.yml' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-AMENDMENT-20-T4R1-FORMAL-SUCCESSOR-SCOPE-AUTHORITY.md' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S6-FORMAL-CROP-CONTEXT-AUTHORITY-V3.json' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S6-FORMAL-REALITY-BINDING-V3.json' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S6-FORMAL-SITE-AUTHORITY-V3.json' \
            'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_T4R1_FORMAL_SUCCESSOR_AUTHORITY.cjs' \
            'scripts/runtime_acceptance/PROBE_MCFT_CAP_09_T4R1_FORMAL_SUCCESSOR_AUTHORITY.mjs' | sort)"
          routing_repair_files="$(printf '%s\n' \
            '.github/workflows/mcft-cap-09-s6-formal-24-hour-stage-1b-closure.yml' \
            '.github/workflows/mcft-cap-09-s6-registry-registration.yml' | sort)"
          if [[ "$MCFT_BASE_SHA" == "$PROTECTED_MAIN_ADOPTION_BASE_SHA" ]] && git merge-base --is-ancestor "$CANONICAL_IMPLEMENTATION_SHA" HEAD; then
            mode='protected-main-adoption-successor'
          elif [[ "$files" == "$ea2_successor_files" ]]; then
            mode='not-applicable-ea2-successor-authority'
          elif [[ "$files" == "$t3r1_successor_files" ]]; then
            mode='not-applicable-t3r1-formal-successor-authority'
          elif [[ "$files" == "$t4r1_successor_files" ]]; then
            mode='not-applicable-t4r1-formal-successor-authority'
          elif [[ "$files" == "$routing_repair_files" ]]; then
            mode='successor-authority-routing-repair'
          else
            mode='historical-registry-routing'
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          printf '%s\n' "mode=$mode" "files:" "$files"

      - name: Record protected-main adoption S6 Registry continuity
        if: steps.applicability.outputs.mode == 'protected-main-adoption-successor'
        shell: node {0}
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          const fs=require('node:fs');
          fs.mkdirSync('acceptance-output',{recursive:true});
          const proof={
            status:'PASS',
            schema_version:'geox_mcft_cap09_s6_registry_protected_main_adoption_v1',
            classification:'PROTECTED_MAIN_ADOPTION_SUCCESSOR',
            registry_lane:'s6-registry-registration',
            subject_sha:process.env.SUBJECT_SHA,
            canonical_implementation_sha:'d82c5caccce8169c19ce7ec2230e774a68a9f636',
            historical_registry_lifecycle_reclassified:false,
            registry_mutation:false,
            runtime_mutation:false,
            production_effect:false,
            graduation_effect:false,
            mcft_cap09_completed:false
          };
          fs.writeFileSync('acceptance-output/MCFT_CAP_09_S6_REGISTRY_REGISTRATION_RESULT.json',JSON.stringify(proof,null,2)+'\n');
          console.log(JSON.stringify(proof));

      - name: Record S6 Registry not applicable to EA2 successor authority freeze
        if: steps.applicability.outputs.mode == 'not-applicable-ea2-successor-authority'
        shell: bash
        run: |
          set -euo pipefail
          echo 'S6 Registry lifecycle is not applicable: exact EA2 successor authority boundary changed with no Registry-owned mutation.'

      - name: Record S6 Registry not applicable to T3R1 Formal successor authority
        if: steps.applicability.outputs.mode == 'not-applicable-t3r1-formal-successor-authority'
        shell: bash
        run: |
          set -euo pipefail
          echo 'S6 Registry lifecycle is not applicable: exact T3R1 Formal successor authority boundary changes no Registry-owned state and does not reopen historical registration authority.'

      - name: Record S6 Registry not applicable to T4R1 Formal successor authority
        if: steps.applicability.outputs.mode == 'not-applicable-t4r1-formal-successor-authority'
        shell: bash
        run: |
          set -euo pipefail
          echo 'S6 Registry lifecycle is not applicable: exact T4R1 Formal successor authority boundary changes no Registry-owned state and does not reopen historical registration authority.'

      - name: Validate successor authority routing repair
        if: steps.applicability.outputs.mode == 'successor-authority-routing-repair'
        shell: bash
        run: |
          set -euo pipefail
          echo 'Exact two-workflow successor authority/database routing repair recognized; historical S6 Registry authority is not reopened.'

      - uses: actions/setup-node@v4
        if: steps.applicability.outputs.mode == 'historical-registry-routing'
        with:
          node-version: 20.11.1

      - name: Classify CAP-09 S6 Registry lifecycle
        if: steps.applicability.outputs.mode == 'historical-registry-routing'
        id: lifecycle
        env:
          MCFT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          MCFT_REGISTRY_LANE: s6-registry-registration
        run: node scripts/governance_acceptance/mcft_cap_09_registry_lifecycle_classifier_v1.cjs

      - name: Download effective S5 exact-SHA R2 authority
        if: steps.applicability.outputs.mode == 'historical-registry-routing' && steps.lifecycle.outputs.mode == 's6-registry-registration'
        uses: actions/download-artifact@v4
        with:
          run-id: 31165105531
          artifact-ids: 8988635083
          path: acceptance-input/cap09-s5-effective
          repository: liyongshang44-max/GEOX
          github-token: ${{ github.token }}

      - name: Validate CAP-09 S6 Registry lifecycle
        if: steps.applicability.outputs.mode == 'historical-registry-routing'
        env:
          MCFT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          MCFT_CAP09_S5_EFFECTIVE_ARTIFACT_DIR: acceptance-input/cap09-s5-effective
          MCFT_EVENT_NAME: ${{ github.event_name }}
          MCFT_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
          MCFT_REGISTRY_LANE: s6-registry-registration
          MCFT_REGISTRY_MODE: ${{ steps.lifecycle.outputs.mode }}
        run: node scripts/governance_acceptance/mcft_cap_09_registry_lifecycle_router_v1.cjs

      - uses: actions/upload-artifact@v4
        if: always() && steps.applicability.outputs.mode == 'protected-main-adoption-successor'
        with:
          name: mcft-cap-09-s6-registry-adoption-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: acceptance-output/MCFT_CAP_09_S6_REGISTRY_REGISTRATION_RESULT.json
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v4
        if: always() && steps.applicability.outputs.mode == 'historical-registry-routing'
        with:
          name: mcft-cap-09-s6-registry-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_S6_REGISTRY_REGISTRATION_RESULT.json
            acceptance-output/MCFT_CAP_09_S2_REGISTRY_CROSS_LIFECYCLE_REPAIR_RESULT.json
            acceptance-output/MCFT_CAP_09_S6_REGISTRY_LIFECYCLE_ROUTE_RESULT.json
          if-no-files-found: error
          retention-days: 90

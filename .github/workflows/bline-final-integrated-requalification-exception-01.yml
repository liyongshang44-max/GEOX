          export AO_ACT_TOKEN="$GEOX_AO_ACT_TOKEN"
          export STRICT_RELEASE_GATE=1
          run_recorded "commercial-01-syntax" "$BLINE_WORKFLOW_STEP" 'pnpm acceptance:commercial:mvp0:syntax'
          run_recorded "commercial-02-release-gate" "$BLINE_WORKFLOW_STEP" 'pnpm acceptance:commercial:mvp0:release-gate'

      - name: Runtime hygiene
        if: always()
        run: |
          set -euo pipefail
          source "$BLINE_COMMAND_RECORDER"
          enable_step_failure_trap "Runtime hygiene"
          if [ ! -f .env.ci ]; then
            echo "runtime not started"
            exit 0
          fi
          LOG="$RUNNER_TEMP/bline-final-requal-server.log"
          docker compose --env-file .env.ci -f docker-compose.commercial_v1.yml logs --no-color --tail=5000 server > "$LOG" 2>&1 || true
          run_recorded "runtime-hygiene-01-double-reply" "$BLINE_WORKFLOW_STEP" '! grep -E "FST_ERR_REP_ALREADY_SENT|ERR_HTTP_HEADERS_SENT|Reply was already sent|reply already sent" "$LOG"'

      - name: Stop integrated acceptance runtime
        if: always()
        run: |
          if [ -f .env.ci ]; then
            docker compose --env-file .env.ci -f docker-compose.commercial_v1.yml down -v --remove-orphans || true
          fi

      - name: Finalize retained command evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bline-final-closure-evidence/command-records"
          EVIDENCE_DIR="$RUNNER_TEMP/bline-final-closure-evidence"
          RECORDS_DIR="$EVIDENCE_DIR/command-records"
          INDEX="$EVIDENCE_DIR/command-execution-index.json"
          mapfile -t RECORD_FILES < <(find "$RECORDS_DIR" -maxdepth 1 -type f -name '*.json' -print | sort)
          if [ "${#RECORD_FILES[@]}" -gt 0 ]; then
            jq -s '{schema:"BLINE-FINAL-CLOSURE-COMMAND-EXECUTION-INDEX-V1",records:.}' "${RECORD_FILES[@]}" > "$INDEX"
          else
            jq -n '{schema:"BLINE-FINAL-CLOSURE-COMMAND-EXECUTION-INDEX-V1",records:[]}' > "$INDEX"
          fi
          sha256sum "$INDEX" > "${INDEX}.sha256"
          if [ -f "$EVIDENCE_DIR/first-failure.json" ]; then
            sha256sum "$EVIDENCE_DIR/first-failure.json" > "$EVIDENCE_DIR/first-failure.json.sha256"
          fi
          if [ -f "$EVIDENCE_DIR/BLINE-FINAL-INTEGRATED-QUALIFICATION-EXECUTION-SUBJECT.json" ]; then
            sha256sum "$EVIDENCE_DIR/BLINE-FINAL-INTEGRATED-QUALIFICATION-EXECUTION-SUBJECT.json" > "$EVIDENCE_DIR/BLINE-FINAL-INTEGRATED-QUALIFICATION-EXECUTION-SUBJECT.json.sha256"
          fi

      - name: Upload retained qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLINE-FINAL-CLOSURE-RETAINED-EVIDENCE
          path: ${{ runner.temp }}/bline-final-closure-evidence
          if-no-files-found: error
          overwrite: false
          retention-days: 90

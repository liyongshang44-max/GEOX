          run_recorded "full-review-04-verify-api" "$BLINE_WORKFLOW_STEP" 'node scripts/demo_seed/SEED_CONTROLLED_PILOT_FULL_REVIEW_V1.cjs --verify-api --tenant tenantA --base-url http://127.0.0.1:3001'
          run_recorded "full-review-05-c8-formal" "$BLINE_WORKFLOW_STEP" 'node scripts/governance_acceptance/ACCEPTANCE_C8_FORMAL_CHAIN_BACKEND_P0_V1.cjs --base-url http://127.0.0.1:3001 --tenant tenantA'

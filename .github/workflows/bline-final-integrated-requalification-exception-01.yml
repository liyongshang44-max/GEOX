      - name: Historical W5/W6 exact-head replay
        run: |
          set -euo pipefail
          source "$BLINE_COMMAND_RECORDER"
          enable_step_failure_trap "Historical W5/W6 exact-head replay"
          replay_gate() {
            ref="$1"
            gate="$2"
            command_id="$3"
            dir="$(mktemp -d)"
            git worktree add --detach "$dir" "$ref" >/dev/null
            set +e
            (cd "$dir" && run_recorded "$command_id" "$BLINE_WORKFLOW_STEP" "node \"$gate\"")
            rc=$?
            set -e
            git worktree remove --force "$dir" >/dev/null 2>&1 || true
            rm -rf "$dir" || true
            test "$rc" -eq 0
          }
          replay_gate "$W5_ACCEPTED_SHA" "scripts/governance_acceptance/ACCEPTANCE_BLINE_W5_LEGACY_RUNTIME_CONTAINMENT_V1.cjs" "historical-01-w5"
          replay_gate "$W6A_ACCEPTED_SHA" "scripts/governance_acceptance/ACCEPTANCE_BLINE_W6A_EXACT_PREDECESSOR_SELECTION_V1.cjs" "historical-02-w6a"
          replay_gate "$W6B1_QUALIFIED_SHA" "scripts/governance_acceptance/ACCEPTANCE_BLINE_W6B1_INTERNAL_TASK_ISSUER_PRINCIPAL_V1.cjs" "historical-03-w6b1"
          replay_gate "$ACCEPTED_BLINE_SEMANTIC_REFERENCE" "scripts/governance_acceptance/ACCEPTANCE_BLINE_W6B2_COMMERCIAL_PRINCIPAL_ISOLATION_V1.cjs" "historical-04-w6b2"


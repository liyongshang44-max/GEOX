          run_recorded "bsec120-commercial-01" "$BLINE_WORKFLOW_STEP" 'pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_BLINE_PR_SEC_2_EVIDENCE_EXPORT_COMMERCIAL_RUNTIME_V1.ts'


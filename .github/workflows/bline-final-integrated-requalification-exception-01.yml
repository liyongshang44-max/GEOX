name: bline-final-integrated-qualification-closure-01

on:
  push:
    branches:
      - qual-control/bline-final-closure-zero-live-01
      - qual/bline-final-qualification-closure-02

permissions:
  contents: read
  actions: read

jobs:
  zero_live:
    name: BLINE final closure zero-live proof
    if: github.ref == 'refs/heads/qual-control/bline-final-closure-zero-live-01'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BLINE_PR_NUMBER: "3525"
      EXPECTED_MAIN_SHA: d19913c88b81b618507ff6da6fc4f3699123cdd6
      EXPECTED_CANDIDATE_SHA: 740805ad552d0dd7b6b2d929442a26f5fba447a0
      EXPECTED_CANDIDATE_BRANCH: feat/bline-w4-gov-recon-03-ca2a96d
      EXPECTED_SYNTHETIC_SHA: f38c383085eadd7c1b5014cafd5efde16274e0ce
      EXPECTED_SYNTHETIC_TREE: 7c13b3326291982f529d4a8718d5b7048b6640c0
      FINAL_LIVE_REF: refs/heads/qual/bline-final-qualification-closure-02
      WORKFLOW_PATH: .github/workflows/bline-final-integrated-requalification-exception-01.yml

    steps:
      - name: Checkout authoritative synthetic subject
        uses: actions/checkout@v4
        with:
          ref: f38c383085eadd7c1b5014cafd5efde16274e0ce
          fetch-depth: 0

      - name: 14-point zero-live proof
        id: zero_live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ACTUAL_HEAD="$(git rev-parse HEAD)"
          ACTUAL_TREE="$(git rev-parse 'HEAD^{tree}')"
          ACTUAL_PARENT1="$(git rev-parse HEAD^1)"
          ACTUAL_PARENT2="$(git rev-parse HEAD^2)"
          STATUS="$(git status --porcelain=v1 --untracked-files=all)"

          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          REMOTE_CANDIDATE="$(git ls-remote origin "refs/heads/${EXPECTED_CANDIDATE_BRANCH}" | awk '{print $1}')"
          REMOTE_PR_HEAD="$(git ls-remote origin "refs/pull/${BLINE_PR_NUMBER}/head" | awk '{print $1}')"
          REMOTE_PR_MERGE="$(git ls-remote origin "refs/pull/${BLINE_PR_NUMBER}/merge" | awk '{print $1}')"
          FINAL_LIVE_SHA="$(git ls-remote origin "$FINAL_LIVE_REF" | awk '{print $1}')"

          PR_JSON="$RUNNER_TEMP/bline-pr.json"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${BLINE_PR_NUMBER}" \
            > "$PR_JSON"
          PR_STATE="$(jq -r '.state' "$PR_JSON")"
          PR_DRAFT="$(jq -r '.draft' "$PR_JSON")"
          PR_MERGED="$(jq -r '.merged' "$PR_JSON")"
          PR_BASE_REF="$(jq -r '.base.ref' "$PR_JSON")"
          PR_HEAD_SHA="$(jq -r '.head.sha' "$PR_JSON")"

          GIT_VERSION_FILE="$RUNNER_TEMP/git-version.txt"
          git version > "$GIT_VERSION_FILE"
          GIT_VERSION="$(cat "$GIT_VERSION_FILE")"

          MERGE_TREE_OUT="$RUNNER_TEMP/merge-tree.out"
          MERGE_TREE_ERR="$RUNNER_TEMP/merge-tree.err"
          set +e
          git merge-tree --write-tree "$EXPECTED_MAIN_SHA" "$EXPECTED_CANDIDATE_SHA" > "$MERGE_TREE_OUT" 2> "$MERGE_TREE_ERR"
          MERGE_TREE_RC=$?
          set -e
          if [ "$MERGE_TREE_RC" -ne 0 ]; then
            cat "$MERGE_TREE_ERR" >&2 || true
            echo "merge-tree --write-tree unavailable or failed; zero-live hard stop" >&2
            exit "$MERGE_TREE_RC"
          fi
          COMPUTED_MERGE_TREE="$(sed -n '1p' "$MERGE_TREE_OUT" | tr -d '\r')"

          test "$REMOTE_MAIN" = "$EXPECTED_MAIN_SHA"
          test "$REMOTE_CANDIDATE" = "$EXPECTED_CANDIDATE_SHA"
          test "$REMOTE_PR_HEAD" = "$EXPECTED_CANDIDATE_SHA"
          test "$PR_HEAD_SHA" = "$EXPECTED_CANDIDATE_SHA"
          test "$PR_STATE" = "open"
          test "$PR_DRAFT" = "true"
          test "$PR_MERGED" = "false"
          test "$PR_BASE_REF" = "main"
          test "$ACTUAL_HEAD" = "$EXPECTED_SYNTHETIC_SHA"
          test "$ACTUAL_PARENT1" = "$EXPECTED_MAIN_SHA"
          test "$ACTUAL_PARENT2" = "$EXPECTED_CANDIDATE_SHA"
          test "$ACTUAL_TREE" = "$EXPECTED_SYNTHETIC_TREE"
          test "$COMPUTED_MERGE_TREE" = "$EXPECTED_SYNTHETIC_TREE"
          test "$COMPUTED_MERGE_TREE" = "$ACTUAL_TREE"
          test -z "$STATUS"
          test -z "$FINAL_LIVE_SHA"

          git fetch --no-tags origin "$GITHUB_SHA" >/dev/null
          CONTROL_PARENT="$(git rev-parse "$GITHUB_SHA^1")"
          CONTROL_DELTA="$RUNNER_TEMP/control-plane-delta.txt"
          git diff --name-only "$CONTROL_PARENT" "$GITHUB_SHA" > "$CONTROL_DELTA"
          test "$(wc -l < "$CONTROL_DELTA" | tr -d ' ')" = "1"
          test "$(cat "$CONTROL_DELTA")" = "$WORKFLOW_PATH"

          PRIOR_WORKFLOW="$RUNNER_TEMP/prior-workflow.yml"
          CURRENT_WORKFLOW="$RUNNER_TEMP/current-workflow.yml"
          git show "$CONTROL_PARENT:$WORKFLOW_PATH" > "$PRIOR_WORKFLOW"
          git show "$GITHUB_SHA:$WORKFLOW_PATH" > "$CURRENT_WORKFLOW"
          grep -F "ref: $EXPECTED_SYNTHETIC_SHA" "$CURRENT_WORKFLOW" >/dev/null

          QUAL_SEQUENCE="$RUNNER_TEMP/qualification-sequence.txt"
          cat > "$QUAL_SEQUENCE" <<'EOF'
          pnpm install --no-frozen-lockfile
          replay_gate "$W5_ACCEPTED_SHA" "scripts/governance_acceptance/ACCEPTANCE_BLINE_W5_LEGACY_RUNTIME_CONTAINMENT_V1.cjs"
          replay_gate "$W6A_ACCEPTED_SHA" "scripts/governance_acceptance/ACCEPTANCE_BLINE_W6A_EXACT_PREDECESSOR_SELECTION_V1.cjs"
          replay_gate "$W6B1_QUALIFIED_SHA" "scripts/governance_acceptance/ACCEPTANCE_BLINE_W6B1_INTERNAL_TASK_ISSUER_PRINCIPAL_V1.cjs"
          replay_gate "$ACCEPTED_BLINE_SEMANTIC_REFERENCE" "scripts/governance_acceptance/ACCEPTANCE_BLINE_W6B2_COMMERCIAL_PRINCIPAL_ISOLATION_V1.cjs"
          pnpm run ci:route-dependency-guard
          node scripts/governance_acceptance/ACCEPTANCE_BLINE_W1_IDENTITY_FOUNDATION_V1.cjs
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_BLINE_W1_IDENTITY_FOUNDATION_V1.ts
          node scripts/governance_acceptance/ACCEPTANCE_BLINE_W2_CALLER_READ_WRITE_BOUNDARY_V1.cjs
          pnpm --filter @geox/device-skills... build
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_BLINE_W2_CALLER_READ_WRITE_BOUNDARY_V1.ts
          node scripts/governance_acceptance/ACCEPTANCE_BLINE_W3_DECISION_APPROVAL_AUTHORITY_V1.cjs
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_BLINE_W3_DECISION_APPROVAL_AUTHORITY_V1.ts
          node scripts/governance_acceptance/ACCEPTANCE_BLINE_W4_EXECUTION_DEVICE_RECEIPT_PROVENANCE_V1.cjs
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_BLINE_W4_EXECUTION_DEVICE_RECEIPT_PROVENANCE_V1.ts
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_BLINE_W6A_EXACT_PREDECESSOR_SELECTION_V1.ts
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_BLINE_W6B1_INTERNAL_TASK_ISSUER_PRINCIPAL_V1.ts
          pnpm run ci:governance:bline-production-caller-authority-inventory
          pnpm run ci:governance:bline-residual-authority-audit
          pnpm run ci:governance:bline-active-runtime-surface-closure
          pnpm run ci:governance:bline-operation-state-read-only
          pnpm run ci:governance:bline-execution-plan-task-lifecycle
          pnpm run ci:governance:bline-p0-res007-evidence-export-boundary
          pnpm run ci:governance:bline-operator-dispatch-intent
          pnpm run ci:governance:bline-acceptance-no-formal-memory-side-effect
          pnpm run ci:governance:bline-formal-memory-reviewed-promotion-proof
          pnpm run ci:governance:bline-legacy-twin-no-direct-formal-memory
          pnpm run ci:governance:bline-formal-memory-scope-provenance
          pnpm run ci:governance:bline-sampling-exact-source-binding
          pnpm run ci:governance:bline-fertilization-execution-provenance
          pnpm run ci:governance:bline-agronomy-agent-fail-closed
          node scripts/governance_acceptance/ACCEPTANCE_BLINE_PR_SEC_2_IMMEDIATE_CALLER_CONTAINMENT_V1.cjs
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_BLINE_PR_SEC_2_OPERATOR_TWIN_AUTH_NEGATIVE_V1.ts
          node scripts/governance_acceptance/ACCEPTANCE_BLINE_PR_SEC_2_WEATHER_INGEST_FAIL_CLOSED_V1.cjs
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_BLINE_PR_SEC_2_WEATHER_INGEST_FAIL_CLOSED_V1.ts
          node scripts/governance_acceptance/ACCEPTANCE_BLINE_PR_SEC_2_LEGACY_TWIN_BASE_FAIL_CLOSED_V1.cjs
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_BLINE_PR_SEC_2_LEGACY_TWIN_BASE_FAIL_CLOSED_V1.ts
          node scripts/governance_acceptance/ACCEPTANCE_BLINE_PR_SEC_2_ADMIN_IMPORT_FAIL_CLOSED_V1.cjs
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_BLINE_PR_SEC_2_ADMIN_IMPORT_FAIL_CLOSED_V1.ts
          node scripts/governance_acceptance/ACCEPTANCE_BLINE_PR_SEC_2_WEAK_INTERNAL_FAIL_CLOSED_V1.cjs
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_BLINE_PR_SEC_2_WEAK_INTERNAL_FAIL_CLOSED_V1.ts
          node scripts/governance_acceptance/ACCEPTANCE_BLINE_PR_SEC_2_INTERNAL_AUTO_FALLBACK_FAIL_CLOSED_V1.cjs
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_BLINE_PR_SEC_2_INTERNAL_AUTO_FALLBACK_FAIL_CLOSED_V1.ts
          node scripts/governance_acceptance/ACCEPTANCE_BLINE_PR_SEC_2_LEGACY_CANOPY_UPLOAD_FAIL_CLOSED_V1.cjs
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_BLINE_PR_SEC_2_LEGACY_CANOPY_UPLOAD_FAIL_CLOSED_V1.ts
          node scripts/governance_acceptance/ACCEPTANCE_BLINE_PR_SEC_2_EVIDENCE_EXPORT_WRITE_CAPABILITY_V1.cjs
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_BLINE_PR_SEC_2_EVIDENCE_EXPORT_WRITE_CAPABILITY_V1.ts
          pnpm -r typecheck
          pnpm -r build
          pnpm --filter @geox/server test:p1:selfcheck
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_BLINE_PR_SEC_2_EVIDENCE_EXPORT_COMMERCIAL_RUNTIME_V1.ts
          pnpm run ci:root-zone-scenario-submit-recommendation
          pnpm run ci:runtime:bline-operator-dispatch-intent
          pnpm run ci:scenario:sampling
          node scripts/agronomy_acceptance/ACCEPTANCE_FERTILIZATION_API_LIVE_V1.cjs
          pnpm run ci:scenario:fertilization
          pnpm run ci:runtime:bline-agronomy-agent-fail-closed
          pnpm run ci:controlled-pilot
          node scripts/demo_seed/SEED_CONTROLLED_PILOT_FULL_REVIEW_V1.cjs --cleanup --apply --tenant tenantA
          node scripts/demo_seed/SEED_CONTROLLED_PILOT_FULL_REVIEW_V1.cjs --apply --tenant tenantA --base-url http://127.0.0.1:3001
          node scripts/demo_seed/SEED_CONTROLLED_PILOT_FULL_REVIEW_V1.cjs --verify --tenant tenantA
          node scripts/demo_seed/SEED_CONTROLLED_PILOT_FULL_REVIEW_V1.cjs --verify-api --tenant tenantA --base-url http://127.0.0.1:3001
          node scripts/governance_acceptance/ACCEPTANCE_C8_FORMAL_CHAIN_BACKEND_P0_V1.cjs --base-url http://127.0.0.1:3001 --tenant tenantA
          pnpm run ci:controlled-pilot
          pnpm exec playwright install chromium
          pnpm run ci:frontend:runtime-page-audit
          pnpm run ci:stage1-fixture:raw-sample-contract
          pnpm run ci:p1-smoke:preflight-idempotent
          pnpm run ci:customer-report-boundary-suite-wiring
          pnpm run ci:customer-report-boundary-suite
          pnpm run test:acceptance
          pnpm acceptance:commercial:mvp0:syntax
          pnpm acceptance:commercial:mvp0:release-gate
          EOF
          sed -i 's/^          //' "$QUAL_SEQUENCE"

          python - "$PRIOR_WORKFLOW" "$CURRENT_WORKFLOW" "$QUAL_SEQUENCE" <<'PY'
          import sys
          prior, current, seq_path = sys.argv[1:]
          sequence = [line.rstrip('\n') for line in open(seq_path, encoding='utf-8') if line.strip()]
          for path in (prior, current):
              text = open(path, encoding='utf-8').read()
              pos = -1
              for command in sequence:
                  nxt = text.find(command, pos + 1)
                  if nxt < 0:
                      raise SystemExit(f'missing or reordered qualification command in {path}: {command}')
                  pos = nxt
          PY

          PROOF="$RUNNER_TEMP/BLINE-FINAL-CLOSURE-ZERO-LIVE-PROOF.json"
          jq -n \
            --arg protected_main "$REMOTE_MAIN" \
            --arg pr_head "$PR_HEAD_SHA" \
            --arg remote_pr_head "$REMOTE_PR_HEAD" \
            --arg candidate_branch "$REMOTE_CANDIDATE" \
            --arg pr_state "$PR_STATE" \
            --arg pr_draft "$PR_DRAFT" \
            --arg pr_merged "$PR_MERGED" \
            --arg pr_base_ref "$PR_BASE_REF" \
            --arg synthetic_parent1 "$ACTUAL_PARENT1" \
            --arg synthetic_parent2 "$ACTUAL_PARENT2" \
            --arg synthetic_tree "$ACTUAL_TREE" \
            --arg computed_merge_tree "$COMPUTED_MERGE_TREE" \
            --arg checkout "$ACTUAL_HEAD" \
            --arg git_version "$GIT_VERSION" \
            --arg merge_tree_invocation 'git merge-tree --write-tree "$EXPECTED_MAIN_SHA" "$EXPECTED_CANDIDATE_SHA"' \
            --argjson merge_tree_exit_status "$MERGE_TREE_RC" \
            --arg remote_pr_merge_sha "$REMOTE_PR_MERGE" \
            --arg final_live_ref "$FINAL_LIVE_REF" \
            --arg control_parent "$CONTROL_PARENT" \
            --arg control_head "$GITHUB_SHA" \
            '{
              schema:"BLINE-FINAL-CLOSURE-ZERO-LIVE-PROOF-V1",
              result:"PASS",
              score:"14/14",
              predicates:{
                "01_protected_main_exact":true,
                "02_pr_head_exact":true,
                "03_remote_pr_head_exact":true,
                "04_candidate_branch_exact":true,
                "05_pr_open_draft_unmerged_base_main":true,
                "06_synthetic_parent1_exact":true,
                "07_synthetic_parent2_exact":true,
                "08_synthetic_tree_exact":true,
                "09_independent_merge_tree_exact":true,
                "10_workflow_checkout_authoritative_synthetic":true,
                "11_qualification_command_set_order_unchanged":true,
                "12_semantic_delta_zero":true,
                "13_working_tree_clean":true,
                "14_final_live_ref_absent":true
              },
              exact_state:{
                protected_main_sha:$protected_main,
                pr_head_sha:$pr_head,
                remote_pr_head_sha:$remote_pr_head,
                candidate_branch_sha:$candidate_branch,
                pr:{state:$pr_state,draft:($pr_draft=="true"),merged:($pr_merged=="true"),base_ref:$pr_base_ref},
                synthetic:{parent1:$synthetic_parent1,parent2:$synthetic_parent2,tree:$synthetic_tree,checkout_sha:$checkout},
                merge_tree:{git_version:$git_version,invocation:$merge_tree_invocation,exit_status:$merge_tree_exit_status,computed_tree:$computed_merge_tree},
                remote_pr_merge_sha:$remote_pr_merge_sha,
                remote_pr_merge_matches_authoritative_subject:($remote_pr_merge_sha==$checkout),
                control_plane:{parent:$control_parent,head:$control_head,changed_files:1,semantic_delta:{bline:0,mcft:0,adr:0}},
                final_live_ref:$final_live_ref
              }
            }' > "$PROOF"
          sha256sum "$PROOF" > "${PROOF}.sha256"
          echo "proof=$PROOF" >> "$GITHUB_OUTPUT"
          echo "proof_sha256=${PROOF}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload zero-live proof
        uses: actions/upload-artifact@v4
        with:
          name: BLINE-FINAL-CLOSURE-ZERO-LIVE-PROOF
          path: |
            ${{ steps.zero_live.outputs.proof }}
            ${{ steps.zero_live.outputs.proof_sha256 }}
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  requalify:
    name: BLINE final integrated qualification closure
    if: github.ref == 'refs/heads/qual/bline-final-qualification-closure-02'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BLINE_PR_NUMBER: "3525"
      EXPECTED_MAIN_SHA: d19913c88b81b618507ff6da6fc4f3699123cdd6
      EXPECTED_CANDIDATE_SHA: 740805ad552d0dd7b6b2d929442a26f5fba447a0
      EXPECTED_CANDIDATE_BRANCH: feat/bline-w4-gov-recon-03-ca2a96d
      EXPECTED_SYNTHETIC_SHA: f38c383085eadd7c1b5014cafd5efde16274e0ce
      EXPECTED_SYNTHETIC_TREE: 7c13b3326291982f529d4a8718d5b7048b6640c0
      ACCEPTED_BLINE_SEMANTIC_REFERENCE: 413386acc04fa2d3404f09d2d1fa8702472e83f1
      W5_ACCEPTED_SHA: a6d39df6af46ecfbf8e4ae99e48f400e00685875
      W6A_ACCEPTED_SHA: bcc78fb00e73292362f237a95db3441e07389f6f
      W6B1_QUALIFIED_SHA: 612d650244310cd60795c9e66883bd12d9981226
      JOB_DISPLAY_NAME: BLINE final integrated qualification closure

    steps:
      - name: Checkout authoritative synthetic integration subject
        uses: actions/checkout@v4
        with:
          ref: f38c383085eadd7c1b5014cafd5efde16274e0ce
          fetch-depth: 0

      - name: Initialize retained command evidence
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/bline-final-closure-evidence"
          RECORDS_DIR="$EVIDENCE_DIR/command-records"
          HELPER="$RUNNER_TEMP/bline-command-recorder.sh"
          mkdir -p "$RECORDS_DIR"
          cat > "$HELPER" <<'BLINE_RECORDER'
          _bline_slug() {
            printf '%s' "$1" | tr '[:upper:] ' '[:lower:]-' | tr -cd 'a-z0-9._-'
          }

          _bline_write_failure_once() {
            local command_id="$1" workflow_step="$2" invocation="$3" exit_code="$4" timestamp="$5"
            local first="$BLINE_EVIDENCE_DIR/first-failure.json"
            if [ ! -e "$first" ]; then
              jq -n \
                --arg first_failed_command_id "$command_id" \
                --arg workflow_step "$workflow_step" \
                --arg exact_invocation "$invocation" \
                --argjson exit_code "$exit_code" \
                --arg timestamp "$timestamp" \
                '{first_failed_command_id:$first_failed_command_id,workflow_step:$workflow_step,"exact invocation":$exact_invocation,exit_code:$exit_code,timestamp:$timestamp}' \
                > "$first"
            fi
          }

          _bline_record_result() {
            local command_id="$1" workflow_step="$2" invocation="$3" started_at="$4" completed_at="$5" exit_code="$6"
            local result="PASS"
            [ "$exit_code" -eq 0 ] || result="FAIL"
            jq -n \
              --arg command_id "$command_id" \
              --arg workflow_step "$workflow_step" \
              --arg exact_invocation "$invocation" \
              --arg started_at "$started_at" \
              --arg completed_at "$completed_at" \
              --argjson exit_code "$exit_code" \
              --arg result "$result" \
              '{command_id:$command_id,workflow_step:$workflow_step,"exact invocation":$exact_invocation,started_at:$started_at,completed_at:$completed_at,exit_code:$exit_code,result:$result}' \
              > "$BLINE_RECORDS_DIR/${command_id}.json"
            if [ "$exit_code" -ne 0 ]; then
              _bline_write_failure_once "$command_id" "$workflow_step" "$invocation" "$exit_code" "$completed_at"
            fi
          }

          run_recorded() {
            local command_id="$1" workflow_step="$2" invocation="$3"
            local started_at completed_at rc
            started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            set +e
            eval "$invocation"
            rc=$?
            set -e
            completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            _bline_record_result "$command_id" "$workflow_step" "$invocation" "$started_at" "$completed_at" "$rc"
            return "$rc"
          }

          run_recorded_capture_stdout() {
            local command_id="$1" workflow_step="$2" invocation="$3" stdout_file="$4"
            local started_at completed_at rc
            started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            set +e
            eval "$invocation" > "$stdout_file"
            rc=$?
            set -e
            completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            _bline_record_result "$command_id" "$workflow_step" "$invocation" "$started_at" "$completed_at" "$rc"
            return "$rc"
          }

          _bline_err_fallback() {
            local rc="$1" invocation="$2" timestamp slug command_id
            [ "$rc" -ne 0 ] || return 0
            timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            slug="$(_bline_slug "${BLINE_WORKFLOW_STEP:-unknown}")"
            command_id="${slug}-unwrapped-failure"
            _bline_write_failure_once "$command_id" "${BLINE_WORKFLOW_STEP:-unknown}" "$invocation" "$rc" "$timestamp"
            return 0
          }

          enable_step_failure_trap() {
            export BLINE_WORKFLOW_STEP="$1"
            set -E
            trap '_bline_err_fallback "$?" "$BASH_COMMAND"' ERR
          }
          BLINE_RECORDER
          chmod 700 "$HELPER"
          echo "BLINE_EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"
          echo "BLINE_RECORDS_DIR=$RECORDS_DIR" >> "$GITHUB_ENV"
          echo "BLINE_COMMAND_RECORDER=$HELPER" >> "$GITHUB_ENV"

      - name: Provenance preflight - authoritative synthetic subject
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source "$BLINE_COMMAND_RECORDER"
          enable_step_failure_trap "Provenance preflight - authoritative synthetic subject"

          ACTUAL_HEAD="$(git rev-parse HEAD)"
          ACTUAL_TREE="$(git rev-parse 'HEAD^{tree}')"
          ACTUAL_PARENT1="$(git rev-parse HEAD^1)"
          ACTUAL_PARENT2="$(git rev-parse HEAD^2)"
          STATUS="$(git status --porcelain=v1 --untracked-files=all)"

          run_recorded "prov-01-pr-number" "$BLINE_WORKFLOW_STEP" 'test "$BLINE_PR_NUMBER" = "3525"'
          run_recorded "prov-02-head" "$BLINE_WORKFLOW_STEP" 'test "$ACTUAL_HEAD" = "$EXPECTED_SYNTHETIC_SHA"'
          run_recorded "prov-03-tree" "$BLINE_WORKFLOW_STEP" 'test "$ACTUAL_TREE" = "$EXPECTED_SYNTHETIC_TREE"'
          run_recorded "prov-04-parent1" "$BLINE_WORKFLOW_STEP" 'test "$ACTUAL_PARENT1" = "$EXPECTED_MAIN_SHA"'
          run_recorded "prov-05-parent2" "$BLINE_WORKFLOW_STEP" 'test "$ACTUAL_PARENT2" = "$EXPECTED_CANDIDATE_SHA"'
          run_recorded "prov-06-clean" "$BLINE_WORKFLOW_STEP" 'test -z "$STATUS"'

          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          REMOTE_CANDIDATE="$(git ls-remote origin "refs/heads/${EXPECTED_CANDIDATE_BRANCH}" | awk '{print $1}')"
          REMOTE_PR_HEAD="$(git ls-remote origin "refs/pull/${BLINE_PR_NUMBER}/head" | awk '{print $1}')"
          REMOTE_PR_MERGE="$(git ls-remote origin "refs/pull/${BLINE_PR_NUMBER}/merge" | awk '{print $1}')"
          run_recorded "prov-07-remote-main" "$BLINE_WORKFLOW_STEP" 'test "$REMOTE_MAIN" = "$EXPECTED_MAIN_SHA"'
          run_recorded "prov-08-remote-candidate" "$BLINE_WORKFLOW_STEP" 'test "$REMOTE_CANDIDATE" = "$EXPECTED_CANDIDATE_SHA"'
          run_recorded "prov-09-remote-pr-head" "$BLINE_WORKFLOW_STEP" 'test "$REMOTE_PR_HEAD" = "$EXPECTED_CANDIDATE_SHA"'

          PR_JSON="$RUNNER_TEMP/requal-pr.json"
          run_recorded "prov-10-fetch-pr" "$BLINE_WORKFLOW_STEP" 'curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${BLINE_PR_NUMBER}" > "$PR_JSON"'
          PR_STATE="$(jq -r '.state' "$PR_JSON")"
          PR_DRAFT="$(jq -r '.draft' "$PR_JSON")"
          PR_MERGED="$(jq -r '.merged' "$PR_JSON")"
          PR_BASE_REF="$(jq -r '.base.ref' "$PR_JSON")"
          PR_HEAD_SHA="$(jq -r '.head.sha' "$PR_JSON")"
          run_recorded "prov-11-pr-head" "$BLINE_WORKFLOW_STEP" 'test "$PR_HEAD_SHA" = "$EXPECTED_CANDIDATE_SHA"'
          run_recorded "prov-12-pr-state" "$BLINE_WORKFLOW_STEP" 'test "$PR_STATE" = "open"'
          run_recorded "prov-13-pr-draft" "$BLINE_WORKFLOW_STEP" 'test "$PR_DRAFT" = "true"'
          run_recorded "prov-14-pr-unmerged" "$BLINE_WORKFLOW_STEP" 'test "$PR_MERGED" = "false"'
          run_recorded "prov-15-pr-base-ref" "$BLINE_WORKFLOW_STEP" 'test "$PR_BASE_REF" = "main"'

          GIT_VERSION_FILE="$RUNNER_TEMP/git-version.txt"
          run_recorded_capture_stdout "prov-16-git-version" "$BLINE_WORKFLOW_STEP" 'git version' "$GIT_VERSION_FILE"
          GIT_VERSION="$(cat "$GIT_VERSION_FILE")"
          MERGE_TREE_OUT="$RUNNER_TEMP/merge-tree.out"
          run_recorded_capture_stdout "prov-17-merge-tree" "$BLINE_WORKFLOW_STEP" 'git merge-tree --write-tree "$EXPECTED_MAIN_SHA" "$EXPECTED_CANDIDATE_SHA"' "$MERGE_TREE_OUT"
          MERGE_TREE_RC=0
          COMPUTED_MERGE_TREE="$(sed -n '1p' "$MERGE_TREE_OUT" | tr -d '\r')"
          run_recorded "prov-18-merge-tree-expected" "$BLINE_WORKFLOW_STEP" 'test "$COMPUTED_MERGE_TREE" = "$EXPECTED_SYNTHETIC_TREE"'
          run_recorded "prov-19-merge-tree-local" "$BLINE_WORKFLOW_STEP" 'test "$COMPUTED_MERGE_TREE" = "$ACTUAL_TREE"'

          JOBS_JSON="$RUNNER_TEMP/requal-run-jobs.json"
          JOB_ID=""
          for _ in $(seq 1 15); do
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
              > "$JOBS_JSON"
            JOB_ID="$(jq -r --arg n "$JOB_DISPLAY_NAME" '[.jobs[] | select(.name==$n and .status=="in_progress") | .id] | if length==1 then .[0] else empty end' "$JOBS_JSON")"
            [ -n "$JOB_ID" ] && break
            sleep 2
          done
          run_recorded "prov-20-job-id" "$BLINE_WORKFLOW_STEP" 'test -n "$JOB_ID"'

          MANIFEST="$BLINE_EVIDENCE_DIR/BLINE-FINAL-INTEGRATED-QUALIFICATION-EXECUTION-SUBJECT.json"
          TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          DETACHED_HEAD="$(git symbolic-ref -q --short HEAD || printf '%s' DETACHED)"
          jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg job_id "$JOB_ID" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg event_ref "$GITHUB_REF" \
            --arg event_sha "$GITHUB_SHA" \
            --arg pr_number "$BLINE_PR_NUMBER" \
            --arg protected_main_sha "$EXPECTED_MAIN_SHA" \
            --arg candidate_head_sha "$EXPECTED_CANDIDATE_SHA" \
            --arg candidate_branch "$EXPECTED_CANDIDATE_BRANCH" \
            --arg synthetic_merge_sha "$EXPECTED_SYNTHETIC_SHA" \
            --arg expected_synthetic_tree "$EXPECTED_SYNTHETIC_TREE" \
            --arg actual_head "$ACTUAL_HEAD" \
            --arg actual_tree "$ACTUAL_TREE" \
            --arg actual_parent1 "$ACTUAL_PARENT1" \
            --arg actual_parent2 "$ACTUAL_PARENT2" \
            --arg remote_main "$REMOTE_MAIN" \
            --arg remote_candidate "$REMOTE_CANDIDATE" \
            --arg remote_pr_head "$REMOTE_PR_HEAD" \
            --arg remote_pr_merge "$REMOTE_PR_MERGE" \
            --arg pr_state "$PR_STATE" \
            --arg pr_draft "$PR_DRAFT" \
            --arg pr_merged "$PR_MERGED" \
            --arg pr_base_ref "$PR_BASE_REF" \
            --arg git_version "$GIT_VERSION" \
            --arg merge_tree_invocation 'git merge-tree --write-tree "$EXPECTED_MAIN_SHA" "$EXPECTED_CANDIDATE_SHA"' \
            --argjson merge_tree_exit_status "$MERGE_TREE_RC" \
            --arg computed_merge_tree "$COMPUTED_MERGE_TREE" \
            --arg checkout_ref "$EXPECTED_SYNTHETIC_SHA" \
            --arg checkout_mode "$DETACHED_HEAD" \
            --arg working_tree_status "$STATUS" \
            --arg timestamp "$TIMESTAMP" \
            '{
              schema:"BLINE-FINAL-INTEGRATED-QUALIFICATION-EXECUTION-SUBJECT-V2",
              run_id:$run_id,
              job_id:$job_id,
              workflow_ref:$workflow_ref,
              workflow_sha:$workflow_sha,
              event:{name:$event_name,ref:$event_ref,sha:$event_sha},
              expected:{
                pr_number:$pr_number,
                protected_main_sha:$protected_main_sha,
                candidate_head_sha:$candidate_head_sha,
                candidate_branch:$candidate_branch,
                synthetic_merge_sha:$synthetic_merge_sha,
                synthetic_tree_sha:$expected_synthetic_tree
              },
              pr:{state:$pr_state,draft:($pr_draft=="true"),merged:($pr_merged=="true"),base_ref:$pr_base_ref},
              actual_workspace:{
                head_sha:$actual_head,
                tree_sha:$actual_tree,
                parent1_sha:$actual_parent1,
                parent2_sha:$actual_parent2,
                checkout_ref:$checkout_ref,
                checkout_mode:$checkout_mode,
                working_tree_clean:($working_tree_status==""),
                working_tree_status:$working_tree_status
              },
              fresh_remote_lock:{
                protected_main_sha:$remote_main,
                candidate_head_sha:$remote_candidate,
                pr_head_sha:$remote_pr_head,
                remote_pr_merge_sha:$remote_pr_merge,
                remote_pr_merge_matches_authoritative_subject:($remote_pr_merge==$synthetic_merge_sha)
              },
              independent_merge_tree:{
                git_version:$git_version,
                invocation:$merge_tree_invocation,
                exit_status:$merge_tree_exit_status,
                computed_merge_tree:$computed_merge_tree
              },
              execution_timestamp:$timestamp,
              unique_execution_subject:true
            }' > "$MANIFEST"

          jq -e '
            .run_id != "" and
            .job_id != "" and
            .workflow_ref != "" and
            .workflow_sha != "" and
            .expected.pr_number == "3525" and
            .pr.state == "open" and
            .pr.draft == true and
            .pr.merged == false and
            .pr.base_ref == "main" and
            .actual_workspace.head_sha == .expected.synthetic_merge_sha and
            .actual_workspace.tree_sha == .expected.synthetic_tree_sha and
            .actual_workspace.parent1_sha == .expected.protected_main_sha and
            .actual_workspace.parent2_sha == .expected.candidate_head_sha and
            .fresh_remote_lock.protected_main_sha == .expected.protected_main_sha and
            .fresh_remote_lock.candidate_head_sha == .expected.candidate_head_sha and
            .fresh_remote_lock.pr_head_sha == .expected.candidate_head_sha and
            .independent_merge_tree.exit_status == 0 and
            .independent_merge_tree.computed_merge_tree == .expected.synthetic_tree_sha and
            .independent_merge_tree.computed_merge_tree == .actual_workspace.tree_sha and
            .actual_workspace.working_tree_clean == true and
            .unique_execution_subject == true
          ' "$MANIFEST" >/dev/null
          sha256sum "$MANIFEST" > "${MANIFEST}.sha256"
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256_file=${MANIFEST}.sha256" >> "$GITHUB_OUTPUT"
          echo "execution_sha=$ACTUAL_HEAD" >> "$GITHUB_OUTPUT"
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "BLINE_REQUAL_EXECUTION_SHA=$ACTUAL_HEAD" >> "$GITHUB_ENV"

      - name: Upload immutable execution-subject provenance artifact
        id: provenance_upload
        uses: actions/upload-artifact@v4
        with:
          name: BLINE-FINAL-INTEGRATED-QUALIFICATION-EXECUTION-SUBJECT
          path: |
            ${{ steps.provenance.outputs.manifest }}
            ${{ steps.provenance.outputs.manifest_sha256_file }}
          if-no-files-found: error
          overwrite: false
          retention-days: 90

      - name: Provenance artifact receipt - product qualification boundary
        run: |
          set -euo pipefail
          source "$BLINE_COMMAND_RECORDER"
          enable_step_failure_trap "Provenance artifact receipt - product qualification boundary"
          run_recorded "receipt-01-artifact-id" "$BLINE_WORKFLOW_STEP" 'test -n "${{ steps.provenance_upload.outputs.artifact-id }}"'
          run_recorded "receipt-02-artifact-digest" "$BLINE_WORKFLOW_STEP" 'test -n "${{ steps.provenance_upload.outputs.artifact-digest }}"'
          run_recorded "receipt-03-execution-sha" "$BLINE_WORKFLOW_STEP" 'test "${{ steps.provenance.outputs.execution_sha }}" = "$EXPECTED_SYNTHETIC_SHA"'
          {
            echo "PROVENANCE_PREFLIGHT=PASS"
            echo "run_id=$GITHUB_RUN_ID"
            echo "job_id=${{ steps.provenance.outputs.job_id }}"
            echo "workflow_ref=$GITHUB_WORKFLOW_REF"
            echo "workflow_sha=$GITHUB_WORKFLOW_SHA"
            echo "artifact_id=${{ steps.provenance_upload.outputs.artifact-id }}"
            echo "artifact_digest=${{ steps.provenance_upload.outputs.artifact-digest }}"
            echo "execution_subject=$BLINE_REQUAL_EXECUTION_SHA"
          } >> "$GITHUB_STEP_SUMMARY"


          run_recorded "runtime-start-01-minio" "$BLINE_WORKFLOW_STEP" 'timeout 180 docker compose --env-file .env.ci -f docker-compose.commercial_v1.yml up -d minio minio-init'
          run_recorded "runtime-start-02-services" "$BLINE_WORKFLOW_STEP" 'timeout 420 docker compose --env-file .env.ci -f docker-compose.commercial_v1.yml up -d postgres mqtt server jobs executor'
          run_recorded "runtime-start-03-health" "$BLINE_WORKFLOW_STEP" "timeout 180 bash -lc 'until curl -fsS http://127.0.0.1:3001/api/health >/dev/null; do sleep 2; done'"

      - name: BSEC-120 Commercial capability proof
        timeout-minutes: 10

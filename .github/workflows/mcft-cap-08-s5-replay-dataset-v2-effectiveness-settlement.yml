name: mcft-cap-08-s5-replay-dataset-v2-effectiveness-settlement

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-08-s5-replay-dataset-v2-effectiveness-settlement.yml'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S5-REPLAY-DATASET-V2-EFFECTIVENESS-AUTHORITY-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S5_REPLAY_DATASET_V2_EFFECTIVENESS_SETTLEMENT.cjs'

permissions:
  contents: read

jobs:
  effectiveness-settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 20.11.1 }
      - name: Validate owned lifecycle
        env:
          MCFT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff --name-only "$MCFT_BASE_SHA"...HEAD)"
          if grep -Eq 'S5-EFFECTIVENESS-AUTHORITY|s5-effectiveness-settlement|S5_EFFECTIVENESS_SETTLEMENT' <<<"$files"; then
            node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S5_EFFECTIVENESS_SETTLEMENT.cjs
          else
            node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S5_REPLAY_DATASET_V2_EFFECTIVENESS_SETTLEMENT.cjs
          fi

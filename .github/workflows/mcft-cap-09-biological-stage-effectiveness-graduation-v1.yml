name: MCFT CAP-09 Biological Stage Effectiveness Graduation

on:
  pull_request:
    branches:
      - main
      - feat/mcft-cap09-production-twin-v2-routing-qcp-registration-v1
      - qual/mcft-cap09-current-main-requal-cb9-v1
    paths:
      - .github/workflows/mcft-cap-09-biological-stage-effectiveness-graduation-v1.yml
      - apps/server/src/runtime/twin_runtime/mcft_cap09_twin_runtime_composition_v2.ts
      - docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-BIOLOGICAL-STAGE-EFFECTIVENESS-GRADUATION-V1.json
      - scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_BIOLOGICAL_STAGE_EFFECTIVENESS_GRADUATION_V1.cjs
      - scripts/runtime_acceptance/BUILD_MCFT_CAP_09_BIOLOGICAL_STAGE_ARCHITECTURE_EFFECTIVENESS_V1.cjs
      - scripts/runtime_acceptance/BUILD_MCFT_CAP_09_EFFECTIVE_CURRENT_CROP_AUTHORITY_V1.cjs

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MCFT_CAP09_BIO_STAGE_EFFECT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ ((github.base_ref == 'qual/mcft-cap09-current-main-requal-cb9-v1' && github.head_ref == 'main' && github.event.pull_request.base.sha == 'cb9fea1c7e37c4aea34ae9a7985dd371cd7fe4e4') || (github.base_ref == 'main' && github.head_ref == 'fix/mcft-cap09-current-main-requal-pr-carrier-v1' && github.event.pull_request.base.sha == 'a8a5046f38e51fdd7b745c9e211ed61299164b23')) && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve bounded qualification mode
        shell: bash
        run: |
          set -euo pipefail

          MODE=HISTORICAL

          if [ '${{ github.base_ref }}' = 'qual/mcft-cap09-current-main-requal-cb9-v1' ]; then
            test '${{ github.head_ref }}' = 'main'
            test '${{ github.event.pull_request.base.sha }}' = 'cb9fea1c7e37c4aea34ae9a7985dd371cd7fe4e4'

            SUBJECT='${{ github.event.pull_request.head.sha }}'

            test "$(git rev-parse HEAD)" = "$SUBJECT"

            git fetch --no-tags origin main
            test "$(git rev-parse origin/main)" = "$SUBJECT"

            MODE=CURRENT_MAIN_REQUALIFICATION_PR

          elif [ '${{ github.base_ref }}' = 'main' ] && \
               [ '${{ github.head_ref }}' = 'fix/mcft-cap09-current-main-requal-pr-carrier-v1' ]; then

            test '${{ github.event.pull_request.base.sha }}' = 'a8a5046f38e51fdd7b745c9e211ed61299164b23'
            test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'

            git fetch --no-tags origin main
            test "$(git rev-parse origin/main)" = 'a8a5046f38e51fdd7b745c9e211ed61299164b23'

            MODE=ROUTING_INSTALLATION_PR
          fi

          echo "MCFT_CAP09_REQUAL_MODE=$MODE" >> "$GITHUB_ENV"

      - name: Exact five-file graduation governance
        if: env.MCFT_CAP09_REQUAL_MODE == 'HISTORICAL'
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_BIOLOGICAL_STAGE_EFFECTIVENESS_GRADUATION_V1.cjs

      - name: Architecture effectiveness builder selftest
        run: node scripts/runtime_acceptance/BUILD_MCFT_CAP_09_BIOLOGICAL_STAGE_ARCHITECTURE_EFFECTIVENESS_V1.cjs --selftest

      - name: Effective current-crop builder selftest
        run: node scripts/runtime_acceptance/BUILD_MCFT_CAP_09_EFFECTIVE_CURRENT_CROP_AUTHORITY_V1.cjs --selftest

      - name: Fetch current protected main
        run: git fetch origin main

      - name: Prove current protected main cannot issue candidate effectiveness
        if: ${{ env.MCFT_CAP09_REQUAL_MODE == 'HISTORICAL' && github.event.pull_request.base.sha != 'd67a2b3cce037c1eaad4d7d051d1f6a11eb09fc3' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance-output
          OUT=acceptance-output/SHOULD_NOT_EXIST_BIOLOGICAL_STAGE_EFFECTIVENESS.json
          rm -f "$OUT"
          set +e
          node scripts/runtime_acceptance/BUILD_MCFT_CAP_09_BIOLOGICAL_STAGE_ARCHITECTURE_EFFECTIVENESS_V1.cjs             --protected-main-sha "$(git rev-parse origin/main)"             --issued-at "2026-09-03T07:15:00.000Z"             --out "$OUT"             >acceptance-output/bio-stage-effectiveness-negative.stdout             2>acceptance-output/bio-stage-effectiveness-negative.stderr
          RC=$?
          set -e
          test "$RC" -ne 0
          test ! -e "$OUT"
          grep -Eq 'GRADUATION_AUTHORITY_NOT_PRESENT_ON_PROTECTED_MAIN|AMENDMENT03_NOT_PRESENT_ON_PROTECTED_MAIN'             acceptance-output/bio-stage-effectiveness-negative.stderr
      - name: Prove current protected-main effectiveness read-only
        if: env.MCFT_CAP09_REQUAL_MODE == 'CURRENT_MAIN_REQUALIFICATION_PR'
        shell: bash
        run: |
          set -euo pipefail

          SUBJECT='${{ github.event.pull_request.head.sha }}'
          OUT=acceptance-output/MCFT_CAP09_BIOLOGICAL_STAGE_EFFECTIVENESS_CURRENT_MAIN_RESULT.json

          mkdir -p acceptance-output
          rm -f "$OUT"

          ISSUED_AT="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"

          node scripts/runtime_acceptance/BUILD_MCFT_CAP_09_BIOLOGICAL_STAGE_ARCHITECTURE_EFFECTIVENESS_V1.cjs \
            --protected-main-sha "$SUBJECT" \
            --issued-at "$ISSUED_AT" \
            --out "$OUT"

          node - "$OUT" "$SUBJECT" <<'NODE'
          const fs = require('node:fs');
          const [p,subject] = process.argv.slice(2);
          const r = JSON.parse(fs.readFileSync(p,'utf8'));

          if (r.status !== 'EFFECTIVE' || r.effective !== true)
            throw new Error('BIO_STAGE_EFFECT_CURRENT_MAIN_NOT_EFFECTIVE');

          if (r.protected_main_sha !== subject)
            throw new Error('BIO_STAGE_EFFECT_SUBJECT_MISMATCH');

          if (r.authority_ceiling !==
              'DT02_BIOLOGICAL_STAGE_ARCHITECTURE_EFFECTIVENESS_ONLY')
            throw new Error('BIO_STAGE_EFFECT_AUTHORITY_CEILING_MISMATCH');

          for (const k of [
            'runtime_start_authorized',
            'production_owner_activation_authorized',
            'formal_v5_authorized',
            'a0_authorized',
            'o00_o23_authorized'
          ]) {
            if (r[k] !== false)
              throw new Error(`BIO_STAGE_EFFECT_PREMATURE:${k}`);
          }

          console.log(JSON.stringify({
            status:'PASS',
            protected_main_sha:subject,
            authority_ceiling_preserved:true
          }));
          NODE

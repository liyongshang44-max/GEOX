name: mcft-cap-09-amendment11-cap04-evidence-snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-amendment11-cap04-evidence-snapshot.yml'
      - 'apps/server/src/runtime/twin_runtime/external_formal_cap04_candidate_execution_service_v1.ts'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_AMENDMENT_11_DATABASE_SOURCE_TO_EXTERNAL_CAP04.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcft-cap-09-amendment11-cap04-evidence-snapshot.yml'
      - 'apps/server/src/runtime/twin_runtime/external_formal_cap04_candidate_execution_service_v1.ts'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_AMENDMENT_11_DATABASE_SOURCE_TO_EXTERNAL_CAP04.ts'

permissions:
  contents: read

jobs:
  amendment11-cap04-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
          cache: pnpm
      - name: Install exact repository dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck server
        run: pnpm --filter @geox/server typecheck
      - name: Prove Amendment-11 evidence snapshot through External CAP04
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_AMENDMENT_11_DATABASE_SOURCE_TO_EXTERNAL_CAP04.ts

name: mcft-cap-09-v13-producer-driven-live-qualification

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-v13-producer-driven-live-qualification.yml'
      - 'scripts/runtime_acceptance/RUN_MCFT_CAP_09_V13_PRODUCER_DRIVEN_LIVE_QUALIFICATION_V1.ts'
      - 'scripts/runtime_acceptance/MCFT_CAP_09_V13_PRODUCER_DRIVEN_LIVE_QUALIFICATION_ARM.json'
      - 'apps/server/src/external_evidence/mcft_cap09_v13_forcing_production_composition_v1.ts'
      - 'apps/server/db/migrations/2026_08_28_mcft_cap_09_v13_evidence_runtime_fenced_promotion_acl.sql'

permissions:
  contents: read

concurrency:
  group: mcft-cap09-v13-producer-driven-live-qualification
  cancel-in-progress: false

env:
  IMPLEMENTATION_BASE_SHA: '46367333d228a2b90a86ff6a33aebc334f3d73a2'
  PROTECTED_MAIN_SHA: 'fa6e260d8cdec4a82403a86f1c7b3d5420e44ef8'
  V13_DB: geox_mcft_cap09_s6_accel24t_am19_v13
  BLOCKED_V13_DB: geox_mcft_cap09_s6_accel24t_am19_blocked_v13
  FORMAL_V5_DB: geox_mcft_cap09_s6_formal_t4r1_24h_v5
  EVIDENCE_ROLE: geox_mcft_cap09_evidence_runtime_v1
  EVIDENCE_LOGIN_ROLE: geox_mcft_cap09_evidence_runtime_login_v1
  SEED_DATABASE_URL: ${{ secrets.GEOX_MCFT_CAP09_T3R1_S6_DATABASE_URL }}
  S3_ENDPOINT: ${{ secrets.GEOX_MCFT_CAP09_FORMAL_RAW_S3_ENDPOINT }}
  S3_BUCKET: ${{ secrets.GEOX_MCFT_CAP09_FORMAL_RAW_S3_BUCKET }}
  S3_REGION: ${{ secrets.GEOX_MCFT_CAP09_FORMAL_RAW_S3_REGION }}
  S3_ACCESS_KEY_ID: ${{ secrets.GEOX_MCFT_CAP09_FORMAL_RAW_S3_ACCESS_KEY_ID }}
  S3_SECRET_ACCESS_KEY: ${{ secrets.GEOX_MCFT_CAP09_FORMAL_RAW_S3_SECRET_ACCESS_KEY }}

jobs:
  live-qualification:
    if: >-
      github.head_ref == 'feat/mcft-cap09-v13-producer-driven-qualification-v1' &&
      github.event.pull_request.base.sha == '46367333d228a2b90a86ff6a33aebc334f3d73a2'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact qualification subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve explicit live arm
        id: arm
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const p='scripts/runtime_acceptance/MCFT_CAP_09_V13_PRODUCER_DRIVEN_LIVE_QUALIFICATION_ARM.json';
          if(!fs.existsSync(p)){
            console.log('LIVE_QUALIFICATION_NOT_ARMED');
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'armed=false\n');
            process.exit(0);
          }
          const a=JSON.parse(fs.readFileSync(p,'utf8'));
          if(a.armed!==true){
            console.log('LIVE_QUALIFICATION_ARM_FILE_PRESENT_BUT_DISABLED');
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'armed=false\n');
            process.exit(0);
          }
          if(a.activation_step!=='RUN_PRODUCER_DRIVEN_V13_QUALIFICATION')throw new Error('V13_LIVE_ARM_STEP_MISMATCH');
          if(a.implementation_base_sha!==process.env.IMPLEMENTATION_BASE_SHA)throw new Error('V13_LIVE_ARM_BASE_MISMATCH');
          if(a.exact_branch!=='feat/mcft-cap09-v13-producer-driven-qualification-v1')throw new Error('V13_LIVE_ARM_BRANCH_MISMATCH');
          if(a.formal_v5_arm_authorized!==false||a.production_owner_activation_authorized!==false||a.a0_authorized!==false||a.o00_authorized!==false)throw new Error('V13_LIVE_ARM_LATER_STAGE_EFFECT_FORBIDDEN');
          if(typeof a.qualification_first_base!=='string'||!/:00:00\.000Z$/.test(a.qualification_first_base)||new Date(a.qualification_first_base).toISOString()!==a.qualification_first_base)throw new Error('V13_LIVE_ARM_FIRST_BASE_CANONICAL_HOUR_REQUIRED');
          if(Date.parse(a.qualification_first_base)<=Date.now()+6*60*60*1000)throw new Error('V13_LIVE_ARM_FIRST_BASE_MUST_LEAD_BY_MORE_THAN_6H');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'armed=true\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'qualification_first_base='+a.qualification_first_base+'\n');

      - name: Require exact frozen subject and authority
        if: steps.arm.outputs.armed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha }}" = "$IMPLEMENTATION_BASE_SHA"
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$PROTECTED_MAIN_SHA"
          node - <<'NODE'
          const fs=require('node:fs');
          const a=JSON.parse(fs.readFileSync('docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-T4R1-ACTUAL-FORMAL-STORE-AUTHORITY-V3.json','utf8'));
          if(a.activation_sequence?.[3]!=='RUN_PRODUCER_DRIVEN_V13_QUALIFICATION')throw new Error('V13_LIVE_SEQUENCE_MISMATCH');
          if(a.qualification_generation?.qualification_database!==process.env.V13_DB)throw new Error('V13_LIVE_V13_DB_MISMATCH');
          if(a.qualification_generation?.blocked_database!==process.env.BLOCKED_V13_DB)throw new Error('V13_LIVE_BLOCKED_DB_MISMATCH');
          if(a.database_identity?.database_name!==process.env.FORMAL_V5_DB)throw new Error('V13_LIVE_FORMAL_V5_DB_MISMATCH');
          if(a.qualification_generation?.producer_supply_graph_must_be_exercised!==true)throw new Error('V13_LIVE_PRODUCER_GRAPH_REQUIRED');
          if(a.qualification_generation?.preinsert_all_24_hourly_forcing_pairs_forbidden!==true)throw new Error('V13_LIVE_PREINSERT_FORBIDDEN');
          if(a.qualification_generation?.production_canonical_core_must_be_identical!==true)throw new Error('V13_LIVE_PRODUCTION_CORE_IDENTITY_REQUIRED');
          if(a.timing_authority?.status!=='UNQUALIFIED_UNTIL_EXACT_HEAD_TIMING_QUALIFICATION')throw new Error('V13_LIVE_TIMING_MUST_REMAIN_UNQUALIFIED');
          NODE

      - uses: pnpm/action-setup@v4
        if: steps.arm.outputs.armed == 'true'
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        if: steps.arm.outputs.armed == 'true'
        with:
          node-version: 20.11.1
          cache: pnpm
      - uses: actions/setup-python@v5
        if: steps.arm.outputs.armed == 'true'
        with:
          python-version: '3.12'

      - name: Install exact repository and scientific dependencies
        if: steps.arm.outputs.armed == 'true'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          python -m pip install --disable-pip-version-check \
            'eccodes==2.47.0' 'eccodeslib==2.47.3.23' 'numpy==1.26.4' 'refet==0.4.2'
          python -m eccodes selfcheck
          python apps/server/src/external_evidence/provider/python/mcft_cap09_gfs_scientific_core_v1.py selftest
          python apps/server/src/external_evidence/provider/python/mcft_cap09_gfs_raw_bundle_decoder_v1.py selftest

      - name: Normalize governed database URLs
        if: steps.arm.outputs.armed == 'true'
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const raw=String(process.env.SEED_DATABASE_URL||'').trim();
          if(!raw)throw new Error('V13_LIVE_DATABASE_SECRET_REQUIRED');
          const seed=new URL(raw);
          if(!['postgres:','postgresql:'].includes(seed.protocol))throw new Error('V13_LIVE_POSTGRES_URL_REQUIRED');
          function target(name,asEvidence=false){
            const u=new URL(raw);
            u.pathname='/'+name;
            let v=u.toString();
            if(asEvidence){
              const separator=u.search?'&':'?';
              v+=separator+'options='+encodeURIComponent('-c role='+process.env.EVIDENCE_ROLE);
            }
            console.log('::add-mask::'+v);
            return v;
          }
          const lines=[
            'V13_ADMIN_URL='+target(process.env.V13_DB),
            'BLOCKED_ADMIN_URL='+target(process.env.BLOCKED_V13_DB),
            'FORMAL_V5_URL='+target(process.env.FORMAL_V5_DB),
            'V13_EVIDENCE_URL='+target(process.env.V13_DB,true),
            'BLOCKED_EVIDENCE_URL='+target(process.env.BLOCKED_V13_DB,true),
          ];
          fs.appendFileSync(process.env.GITHUB_ENV,lines.join('\n')+'\n');

      - name: Require Formal-v5 untouched and qualification stores uninitialized-or-exact-v13
        if: steps.arm.outputs.armed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          formal_counts="$(psql "$FORMAL_V5_URL" -AtF '|' -v ON_ERROR_STOP=1 -c "
            SELECT
              (SELECT count(*)::int FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'),
              (SELECT count(*)::int FROM pg_catalog.pg_proc p JOIN pg_catalog.pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public')")"
          test "$formal_counts" = "0|0" || { echo "V13_LIVE_FORMAL_V5_NOT_ZERO_STATE:$formal_counts" >&2; exit 1; }
          for url in "$V13_ADMIN_URL" "$BLOCKED_ADMIN_URL"; do
            n="$(psql "$url" -At -v ON_ERROR_STOP=1 -c "SELECT count(*)::int FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")"
            test "$n" = "0" || test "$n" = "29" || { echo "V13_LIVE_STORE_SCHEMA_CARDINALITY_UNSAFE:$n" >&2; exit 1; }
          done

      - name: Establish qualification-only NOLOGIN Evidence privilege role
        if: steps.arm.outputs.armed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SEED_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $role$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname='geox_mcft_cap09_evidence_runtime_v1') THEN
              CREATE ROLE geox_mcft_cap09_evidence_runtime_v1
                NOLOGIN INHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname='geox_mcft_cap09_forcing_writer_owner_v1') THEN
              CREATE ROLE geox_mcft_cap09_forcing_writer_owner_v1
                NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
            END IF;
          END
          $role$;
          SQL

          evidence_state="$(psql "$SEED_DATABASE_URL" -AtF '|' -v ON_ERROR_STOP=1 -c "
            SELECT rolcanlogin::text,rolinherit::text,rolsuper::text,rolcreatedb::text,rolcreaterole::text,rolreplication::text,rolbypassrls::text
              FROM pg_catalog.pg_roles WHERE rolname='$EVIDENCE_ROLE'")"
          test "$evidence_state" = "false|true|false|false|false|false|false" || {
            echo "V13_LIVE_EVIDENCE_PRIVILEGE_ROLE_UNSAFE:$evidence_state" >&2; exit 1;
          }
          writer_state="$(psql "$SEED_DATABASE_URL" -AtF '|' -v ON_ERROR_STOP=1 -c "
            SELECT rolcanlogin::text,rolinherit::text,rolsuper::text,rolcreatedb::text,rolcreaterole::text,rolreplication::text,rolbypassrls::text
              FROM pg_catalog.pg_roles WHERE rolname='geox_mcft_cap09_forcing_writer_owner_v1'")"
          test "$writer_state" = "false|false|false|false|false|false|false" || {
            echo "V13_LIVE_FORCING_WRITER_OWNER_ROLE_UNSAFE:$writer_state" >&2; exit 1;
          }

          for role in "$EVIDENCE_ROLE" geox_mcft_cap09_forcing_writer_owner_v1; do
            can_admin="$(psql "$SEED_DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "
              SELECT EXISTS (
                SELECT 1
                  FROM pg_catalog.pg_auth_members m
                  JOIN pg_catalog.pg_roles granted ON granted.oid=m.roleid
                  JOIN pg_catalog.pg_roles member ON member.oid=m.member
                 WHERE granted.rolname='$role' AND member.rolname=current_user AND m.admin_option
              )::text")"
            can_set_before="$(psql "$SEED_DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "SELECT pg_catalog.pg_has_role(current_user,'$role','SET')::text")"
            test "$can_admin" = "true" || test "$can_set_before" = "true" || {
              echo "V13_LIVE_TEMP_MEMBERSHIP_CANNOT_BE_ESTABLISHED:$role" >&2; exit 1;
            }
            psql "$SEED_DATABASE_URL" -v ON_ERROR_STOP=1 -c "GRANT $role TO CURRENT_USER"
            can_set_after="$(psql "$SEED_DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "SELECT pg_catalog.pg_has_role(current_user,'$role','SET')::text")"
            test "$can_set_after" = "true" || { echo "V13_LIVE_TEMP_MEMBERSHIP_NOT_EFFECTIVE:$role" >&2; exit 1; }
          done

          login_count="$(psql "$SEED_DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "SELECT count(*)::int FROM pg_catalog.pg_roles WHERE rolname='$EVIDENCE_LOGIN_ROLE'")"
          test "$login_count" = "0" || { echo "V13_LIVE_PRODUCTION_LOGIN_MUST_NOT_EXIST:$login_count" >&2; exit 1; }

      - name: Initialize exact 29-table v13 qualification schemas and ACL
        if: steps.arm.outputs.armed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          initialize_store() {
            url="$1"
            n="$(psql "$url" -At -v ON_ERROR_STOP=1 -c "SELECT count(*)::int FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")"
            if [ "$n" = "0" ]; then
              psql "$url" -v ON_ERROR_STOP=1 -f docker/postgres/init/001_schema.sql
              psql "$url" -v ON_ERROR_STOP=1 -f apps/server/db/migrations/2026_07_09_mcft_cap_01_a0_persistence.sql
              psql "$url" -v ON_ERROR_STOP=1 -f apps/server/db/migrations/2026_07_10_mcft_cap_01_closure_remediation.sql
              psql "$url" -v ON_ERROR_STOP=1 -f apps/server/db/migrations/2026_08_25_mcft_cap_09_v13_forcing_base_continuity.sql
              psql "$url" -v ON_ERROR_STOP=1 -f apps/server/db/migrations/2026_08_25_mcft_cap_09_v13_forcing_controller_admission.sql
              psql "$url" -v ON_ERROR_STOP=1 -f apps/server/db/migrations/2026_08_25_mcft_cap_09_v13_forcing_controller_lifecycle.sql
            fi
            # Always apply the idempotent ACL migration so a safe 29-table partial qualification state can resume.
            psql "$url" -v ON_ERROR_STOP=1 -f apps/server/db/migrations/2026_08_28_mcft_cap_09_v13_evidence_runtime_fenced_promotion_acl.sql
            final="$(psql "$url" -At -v ON_ERROR_STOP=1 -c "SELECT count(*)::int FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")"
            test "$final" = "29" || { echo "V13_LIVE_29_TABLE_SCHEMA_REQUIRED:$final" >&2; exit 1; }
            delta="$(psql "$url" -At -v ON_ERROR_STOP=1 -c "
              SELECT string_agg(table_name,',' ORDER BY table_name)
                FROM information_schema.tables
               WHERE table_schema='public'
                 AND table_name LIKE 'twin_external_formal_forcing_%_v1'")"
            test "$delta" = "twin_external_formal_forcing_base_cursor_v1,twin_external_formal_forcing_base_target_v1,twin_external_formal_forcing_controller_lease_v1" || {
              echo "V13_LIVE_FORCING_RELATION_SET_MISMATCH:$delta" >&2; exit 1;
            }
          }
          initialize_store "$V13_ADMIN_URL"
          initialize_store "$BLOCKED_ADMIN_URL"

      - name: Prove Evidence ACL before provider execution
        if: steps.arm.outputs.armed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for url in "$V13_EVIDENCE_URL" "$BLOCKED_EVIDENCE_URL"; do
            role="$(psql "$url" -At -v ON_ERROR_STOP=1 -c "SELECT current_user")"
            test "$role" = "$EVIDENCE_ROLE"
            schema_usage="$(psql "$url" -At -v ON_ERROR_STOP=1 -c "SELECT has_schema_privilege(current_user,'public','USAGE')::text")"
            test "$schema_usage" = "true"
            schema_create="$(psql "$url" -At -v ON_ERROR_STOP=1 -c "SELECT has_schema_privilege(current_user,'public','CREATE')::text")"
            test "$schema_create" = "false"
            insert_fact="$(psql "$url" -At -v ON_ERROR_STOP=1 -c "SELECT has_table_privilege(current_user,'public.facts','INSERT')::text")"
            test "$insert_fact" = "false"
            execute_writer="$(psql "$url" -At -v ON_ERROR_STOP=1 -c "SELECT has_function_privilege(current_user,'public.mcft_cap09_v13_evidence_runtime_append_exact_base_facts_v1(text,text,text,text,text,text,text,text,timestamptz,text,bigint,text,bigint,text,jsonb)','EXECUTE')::text")"
            test "$execute_writer" = "true"
          done
          for url in "$V13_ADMIN_URL" "$BLOCKED_ADMIN_URL"; do
            writer_schema_create="$(psql "$url" -At -v ON_ERROR_STOP=1 -c "SELECT has_schema_privilege('geox_mcft_cap09_forcing_writer_owner_v1','public','CREATE')::text")"
            test "$writer_schema_create" = "false" || { echo "V13_LIVE_WRITER_OWNER_SCHEMA_CREATE_LEAK:$writer_schema_create" >&2; exit 1; }
          done

      - name: Run producer-driven live v13 qualification
        if: steps.arm.outputs.armed == 'true'
        env:
          MCFT_CAP09_V13_PRODUCER_DRIVEN_LIVE_QUALIFICATION: '1'
          MCFT_SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
          MCFT_QUALIFICATION_FIRST_BASE: ${{ steps.arm.outputs.qualification_first_base }}
          DATABASE_URL: ${{ env.V13_EVIDENCE_URL }}
          BLOCKED_DATABASE_URL: ${{ env.BLOCKED_EVIDENCE_URL }}
          MCFT_CAP09_FORMAL_RAW_ENDPOINT: ${{ env.S3_ENDPOINT }}
          MCFT_CAP09_FORMAL_RAW_BUCKET: ${{ env.S3_BUCKET }}
          MCFT_CAP09_FORMAL_RAW_REGION: ${{ env.S3_REGION }}
          MCFT_CAP09_FORMAL_RAW_ACCESS_KEY_ID: ${{ env.S3_ACCESS_KEY_ID }}
          MCFT_CAP09_FORMAL_RAW_SECRET_ACCESS_KEY: ${{ env.S3_SECRET_ACCESS_KEY }}
        run: pnpm exec tsx scripts/runtime_acceptance/RUN_MCFT_CAP_09_V13_PRODUCER_DRIVEN_LIVE_QUALIFICATION_V1.ts

      - name: Validate machine proof and frozen non-effects
        if: steps.arm.outputs.armed == 'true'
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_V13_PRODUCER_DRIVEN_LIVE_QUALIFICATION_V1_RESULT.json','utf8'));
          if(p.status!=='PASS'||p.activation_step!=='RUN_PRODUCER_DRIVEN_V13_QUALIFICATION')throw new Error('V13_LIVE_QUALIFICATION_PASS_REQUIRED');
          if(p.subject_sha!=='${{ github.event.pull_request.head.sha }}')throw new Error('V13_LIVE_EXACT_HEAD_REQUIRED');
          if(p.processed_base_count!==3||p.real_producer_graph_timing_observation_count!==3)throw new Error('V13_LIVE_EXACT_THREE_REAL_SAMPLES_REQUIRED');
          for(const k of ['production_canonical_core_identical','provider_supply_graph_exercised','private_raw_retention_exercised','private_candidate_manifest_exercised','candidate_rehydration_exercised','fenced_evidence_writer_exercised','post_commit_physical_readback_exercised','controller_fencing_exercised','producer_fencing_exercised'])if(p[k]!==true)throw new Error('V13_LIVE_PRODUCER_GRAPH_PROOF_MISSING:'+k);
          if(p.preinsert_all_24_hourly_forcing_pairs!==false||p.direct_facts_insert_privilege!==false)throw new Error('V13_LIVE_FORBIDDEN_SHORTCUT');
          if(p.production_admission_exercised!==false||p.qualification_only_prebudget_admission_boundary!==true)throw new Error('V13_LIVE_PREBUDGET_BOUNDARY_REQUIRED');
          if(p.timing_budget_qualified!==false||p.timing_budget_frozen!==false||p.controlled_delay_matrix_executed!==false)throw new Error('V13_LIVE_STEP5_MUST_REMAIN_UNEXECUTED');
          if(p.blocked_negative?.status!=='PASS'||p.blocked_negative?.provider_request_count!==0||p.blocked_negative?.fail_closed_before_provider!==true)throw new Error('V13_LIVE_BLOCKED_NEGATIVE_REQUIRED');
          for(const k of ['production_owner_activation','formal_v5_arm','a0_bootstrap','o00_started','mcft_cap09_completed'])if(p[k]!==false)throw new Error('V13_LIVE_LATER_STAGE_EFFECT:'+k);

      - name: Reprove Formal-v5 untouched
        if: steps.arm.outputs.armed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          counts="$(psql "$FORMAL_V5_URL" -AtF '|' -v ON_ERROR_STOP=1 -c "
            SELECT
              (SELECT count(*)::int FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'),
              (SELECT count(*)::int FROM pg_catalog.pg_proc p JOIN pg_catalog.pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public')")"
          test "$counts" = "0|0" || { echo "V13_LIVE_FORMAL_V5_MUTATION_FORBIDDEN:$counts" >&2; exit 1; }

      - name: Upload immutable producer qualification proof
        if: steps.arm.outputs.armed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-v13-producer-driven-live-qualification-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/MCFT_CAP_09_V13_PRODUCER_DRIVEN_LIVE_QUALIFICATION_V1_RESULT.json
          if-no-files-found: error
          retention-days: 90

      - name: Revoke temporary qualification role memberships
        if: always() && steps.arm.outputs.armed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for url in "$V13_ADMIN_URL" "$BLOCKED_ADMIN_URL"; do
            psql "$url" -v ON_ERROR_STOP=1 -c "REVOKE CREATE ON SCHEMA public FROM geox_mcft_cap09_forcing_writer_owner_v1"
            writer_schema_create="$(psql "$url" -At -v ON_ERROR_STOP=1 -c "SELECT has_schema_privilege('geox_mcft_cap09_forcing_writer_owner_v1','public','CREATE')::text")"
            test "$writer_schema_create" = "false" || { echo "V13_LIVE_WRITER_OWNER_SCHEMA_CREATE_CLEANUP_FAILED:$writer_schema_create" >&2; exit 1; }
          done
          for role in "$EVIDENCE_ROLE" geox_mcft_cap09_forcing_writer_owner_v1; do
            present="$(psql "$SEED_DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "SELECT EXISTS(SELECT 1 FROM pg_catalog.pg_roles WHERE rolname='$role')::text")"
            if [ "$present" = "true" ]; then
              psql "$SEED_DATABASE_URL" -v ON_ERROR_STOP=1 -c "REVOKE $role FROM CURRENT_USER"
              can_set="$(psql "$SEED_DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "SELECT pg_catalog.pg_has_role(current_user,'$role','SET')::text")"
              test "$can_set" = "false" || { echo "V13_LIVE_TEMP_SET_MEMBERSHIP_LEAK:$role:$can_set" >&2; exit 1; }
              self_grants="$(psql "$SEED_DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "
                SELECT count(*)::int
                  FROM pg_catalog.pg_auth_members m
                  JOIN pg_catalog.pg_roles granted ON granted.oid=m.roleid
                  JOIN pg_catalog.pg_roles member ON member.oid=m.member
                  JOIN pg_catalog.pg_roles grantor ON grantor.oid=m.grantor
                 WHERE granted.rolname='$role' AND member.rolname=current_user AND grantor.rolname=current_user")"
              test "$self_grants" = "0" || { echo "V13_LIVE_TEMP_SELF_GRANT_LEAK:$role:$self_grants" >&2; exit 1; }
            fi
          done

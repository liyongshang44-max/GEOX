name: tmp-mcft-cap09-s5-candidate-validation

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-mcft-cap09-s5-candidate-validation.yml'
      - 'tmp/mcft_s5/**'

permissions:
  contents: read

concurrency:
  group: tmp-mcft-cap09-s5-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  validate-s5-candidate-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: geox_mcft_cap09_s5_acceptance
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d geox_mcft_cap09_s5_acceptance"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Materialize exact S5 draft sources
        run: |
          set -euo pipefail
          mkdir -p apps/server/src/runtime/twin_runtime scripts/runtime_acceptance acceptance-output
          gzip -dc tmp/mcft_s5/postgres_frozen_shadow_online_evidence_source_v1.ts.gz > apps/server/src/runtime/twin_runtime/postgres_frozen_shadow_online_evidence_source_v1.ts
          gzip -dc tmp/mcft_s5/postgres_cap04_shadow_online_canonical_tick_adapter_v1.ts.gz > apps/server/src/runtime/twin_runtime/postgres_cap04_shadow_online_canonical_tick_adapter_v1.ts
          gzip -dc tmp/mcft_s5/shadow_online_canonical_integration_service_v1.ts.gz > apps/server/src/runtime/twin_runtime/shadow_online_canonical_integration_service_v1.ts
          gzip -dc tmp/mcft_s5/ACCEPTANCE_MCFT_CAP_09_S5_SHADOW_ONLINE_CANONICAL_INTEGRATION_DB.ts.gz > scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_S5_SHADOW_ONLINE_CANONICAL_INTEGRATION_DB.ts
          test "$(git hash-object apps/server/src/runtime/twin_runtime/postgres_frozen_shadow_online_evidence_source_v1.ts)" = '39a097a2343bd95dcc6b7621a4acc0e31772c563'
          test "$(git hash-object apps/server/src/runtime/twin_runtime/postgres_cap04_shadow_online_canonical_tick_adapter_v1.ts)" = '3a6ea45c8775526e37e0a52f6fc69f98bee89db3'
          test "$(git hash-object apps/server/src/runtime/twin_runtime/shadow_online_canonical_integration_service_v1.ts)" = 'df3de78aba2931b1237555035564a0a2500e7ec9'
          test "$(git hash-object scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_S5_SHADOW_ONLINE_CANONICAL_INTEGRATION_DB.ts)" = 'e8ecf12eb238c34b25770d9d8f841d63ae6345f7'
      - name: Extract canonical CAP-04 DB fixture support
        run: |
          set -euo pipefail
          awk '/^async function deleteCap04GuardsV1\(/{exit} {print}' \
            scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_04_SINGLE_TICK_INTEGRATION_DB.ts \
            > scripts/runtime_acceptance/mcft_cap09_s5_canonical_integration_support_v1.ts
          perl -0pi -e 's/const pool =/export const pool =/' scripts/runtime_acceptance/mcft_cap09_s5_canonical_integration_support_v1.ts
          perl -0pi -e 's/function persistenceAdapterV1/export function persistenceAdapterV1/' scripts/runtime_acceptance/mcft_cap09_s5_canonical_integration_support_v1.ts
          perl -0pi -e 's/async function resetSchemaV1/export async function resetSchemaV1/' scripts/runtime_acceptance/mcft_cap09_s5_canonical_integration_support_v1.ts
          perl -0pi -e 's/async function buildControlledAuthorityV1/export async function buildControlledAuthorityV1/' scripts/runtime_acceptance/mcft_cap09_s5_canonical_integration_support_v1.ts
          perl -0pi -e 's/async function seedControlledAuthorityV1/export async function seedControlledAuthorityV1/' scripts/runtime_acceptance/mcft_cap09_s5_canonical_integration_support_v1.ts
          grep -q 'export async function seedControlledAuthorityV1' scripts/runtime_acceptance/mcft_cap09_s5_canonical_integration_support_v1.ts
      - name: Typecheck server and focused acceptance
        run: |
          set +e
          pnpm --filter @geox/server run typecheck > acceptance-output/MCFT_CAP_09_S5_SERVER_TYPECHECK.log 2>&1
          server_status=$?
          pnpm exec tsc --noEmit --module ESNext --moduleResolution Bundler --target ES2022 --skipLibCheck \
            scripts/runtime_acceptance/mcft_cap09_s5_canonical_integration_support_v1.ts \
            scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_S5_SHADOW_ONLINE_CANONICAL_INTEGRATION_DB.ts \
            > acceptance-output/MCFT_CAP_09_S5_ACCEPTANCE_TSC.log 2>&1
          acceptance_status=$?
          cat acceptance-output/MCFT_CAP_09_S5_SERVER_TYPECHECK.log
          cat acceptance-output/MCFT_CAP_09_S5_ACCEPTANCE_TSC.log
          printf 'server_status=%s\nacceptance_status=%s\n' "$server_status" "$acceptance_status" > acceptance-output/MCFT_CAP_09_S5_TYPECHECK_STATUS.txt
          test "$server_status" -eq 0
          test "$acceptance_status" -eq 0
      - name: Run S5 adapter PostgreSQL integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/geox_mcft_cap09_s5_acceptance
          MCFT_CAP09_S5_DESTRUCTIVE_ACCEPTANCE: '1'
          MCFT_CAP_04_SINGLE_TICK_DESTRUCTIVE_ACCEPTANCE: '1'
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_S5_SHADOW_ONLINE_CANONICAL_INTEGRATION_DB.ts
      - name: Prove production PostgreSQL H and C ports
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/geox_mcft_cap09_s5_positive_c_acceptance
          MCFT_CAP_05_S8_DESTRUCTIVE_ACCEPTANCE: '1'
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE geox_mcft_cap09_s5_positive_c_acceptance'
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_05_FORECAST_RESIDUAL_OUTCOME_TICK_DB.ts | tee acceptance-output/MCFT_CAP_09_S5_POSITIVE_C_POSTGRESQL.log
          grep -q '8 PASS / 0 FAIL' acceptance-output/MCFT_CAP_09_S5_POSITIVE_C_POSTGRESQL.log
          grep -q 'proves source-posterior H consumption' acceptance-output/MCFT_CAP_09_S5_POSITIVE_C_POSTGRESQL.log
          h_count=$(psql -h 127.0.0.1 -U postgres -d geox_mcft_cap09_s5_positive_c_acceptance -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM facts WHERE record_json->>'type'='twin_action_feedback_v1'")
          c_count=$(psql -h 127.0.0.1 -U postgres -d geox_mcft_cap09_s5_positive_c_acceptance -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM facts WHERE record_json->>'type'='twin_forecast_residual_v1'")
          forbidden_count=$(psql -h 127.0.0.1 -U postgres -d geox_mcft_cap09_s5_positive_c_acceptance -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM facts WHERE lower(record_json->>'type') ~ '(recommendation|decision_candidate|decision_record|approval|operation_plan|ao_act|dispatch|model_activation)'")
          test "$h_count" = '1'
          test "$c_count" = '1'
          test "$forbidden_count" = '0'
          H_COUNT="$h_count" C_COUNT="$c_count" FORBIDDEN_COUNT="$forbidden_count" node - <<'NODE'
          const fs=require('node:fs');
          fs.writeFileSync('acceptance-output/MCFT_CAP_09_S5_POSITIVE_C_POSTGRESQL_RESULT.json',JSON.stringify({
            schema_version:'geox_mcft_cap09_s5_positive_c_postgresql_result_v1',status:'PASS',
            canonical_service:'Cap05ForecastResidualOutcomeTickServiceV1',historical_source:'PostgresForecastResidualSourceV1',persistence:'PostgresFeedbackPersistenceRepositoryV1',
            preexisting_h_fixture_count:Number(process.env.H_COUNT),h_read_only_consumption_proven:true,s5_h_write_count:0,
            c_forecast_residual_count:Number(process.env.C_COUNT),c_forecast_residual_commit_proven:true,replay_idempotency_proven:true,rebuild_from_facts_proven:true,
            g_write_count:0,action_creation_count:0,forbidden_authority_fact_count:Number(process.env.FORBIDDEN_COUNT)
          },null,2)+'\n');
          NODE
      - name: Verify structured proof
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const integration=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_S5_SHADOW_ONLINE_CANONICAL_INTEGRATION_DB_RESULT.json','utf8'));
          const positiveC=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_S5_POSITIVE_C_POSTGRESQL_RESULT.json','utf8'));
          if(integration.status!=='PASS'||positiveC.status!=='PASS')throw new Error('S5_DRAFT_NOT_PASS');
          for(const key of ['completed','blocked','cap05_no_residual','cap05_positive_residual']){
            const row=integration[key];
            if(!row||row.exact_frozen_evidence_reused!==true||row.shared_scheduler_canonical_fence!==true||row.forbidden_fact_count!==0||row.g_write_count!==0||row.action_creation_count!==0)throw new Error(`S5_PROOF_REQUIRED:${key}`);
          }
          if(integration.cap05_no_residual.c_residual_attempted!==true||integration.cap05_no_residual.c_residual_count!==0||integration.cap05_no_residual.c_residual_disposition!=='NO_ELIGIBLE_HISTORICAL_FORECAST')throw new Error('S5_C_NO_MATCH_PROOF_REQUIRED');
          const composed=integration.cap05_positive_residual;
          if(composed.h_read_only_consumed!==true||composed.c_residual_attempted!==true||composed.c_residual_count!==1||composed.c_residual_disposition!=='COMMITTED'||composed.s5_adapter_positive_c_composition_proven!==true||composed.residual_port_override_pair_guard_proven!==true||!composed.canonical_transaction_families.includes('C'))throw new Error('S5_ADAPTER_POSITIVE_C_COMPOSITION_REQUIRED');
          if(positiveC.h_read_only_consumption_proven!==true||positiveC.preexisting_h_fixture_count!==1||positiveC.s5_h_write_count!==0||positiveC.c_forecast_residual_commit_proven!==true||positiveC.c_forecast_residual_count!==1||positiveC.g_write_count!==0||positiveC.action_creation_count!==0||positiveC.forbidden_authority_fact_count!==0)throw new Error('S5_POSITIVE_C_PORT_PROOF_REQUIRED');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmp-mcft-cap09-s5-candidate-validation-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/
          if-no-files-found: warn
          retention-days: 7

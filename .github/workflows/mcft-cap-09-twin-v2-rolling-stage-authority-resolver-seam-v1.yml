name: mcft-cap-09-twin-v2-rolling-stage-authority-resolver-seam-v1

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-twin-v2-rolling-stage-authority-resolver-seam-v1.yml'

permissions:
  contents: write

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact governance carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Commit bounded non-workflow 5050 governance
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const predecessor = '5050f1c08d2528048c56d56add4cbb068b956925';
          const b37 = 'b37b6cee4aadb50a8303cdfeffd0b4ab8a89451f';
          const qcpAuthority = 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-CONTROL-PLANE-V1.json';
          const evidenceRegistry = 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-EVIDENCE-REGISTRY-V1.json';
          const preflight = 'scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_ALL_BLOCKERS_V1.cjs';
          const routing = 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_PRODUCTION_TWIN_PROCESS_V2_ROUTING_V1.cjs';
          const paths = [qcpAuthority, evidenceRegistry, preflight, routing];
          function replaceOnce(text, before, after, code) {
            const count = text.split(before).length - 1;
            if (count !== 1) throw new Error(`${code}:COUNT=${count}`);
            return text.replace(before, after);
          }

          let authority = fs.readFileSync(qcpAuthority, 'utf8');
          const authorityAnchor = `    "${b37}"\n  ],`;
          authority = replaceOnce(authority, authorityAnchor, `    "${b37}",\n    "${predecessor}"\n  ],`, 'QCP_AUTHORITY_PREDECESSOR_SET');
          JSON.parse(authority);
          fs.writeFileSync(qcpAuthority, authority);

          let evidence = fs.readFileSync(evidenceRegistry, 'utf8');
          const evidenceAnchor = `          "${b37}"\n        ],\n        "dependency_digest_must_match_current": true,`;
          evidence = replaceOnce(evidence, evidenceAnchor, `          "${b37}",\n          "${predecessor}"\n        ],\n        "dependency_digest_must_match_current": true,`, 'EVIDENCE_GOVERNED_PREDECESSOR_SET');
          JSON.parse(evidence);
          fs.writeFileSync(evidenceRegistry, evidence);

          let pre = fs.readFileSync(preflight, 'utf8');
          const preEnv = '    const effectiveCurrentCropRegistryResolverProtectedMainBase = String(process.env.EFFECTIVE_CURRENT_CROP_REGISTRY_RESOLVER_PROTECTED_MAIN_PREDECESSOR_SHA || "");\n';
          pre = replaceOnce(pre, preEnv, preEnv + '    const twinV2RuntimeSelectionAdoptionProtectedMainBase = String(process.env.TWIN_V2_RUNTIME_SELECTION_ADOPTION_PROTECTED_MAIN_PREDECESSOR_SHA || "");\n', 'PREFLIGHT_ENV_ANCHOR');
          const preBase = '        (/^[0-9a-f]{40}$/.test(effectiveCurrentCropRegistryResolverProtectedMainBase) && args.base === effectiveCurrentCropRegistryResolverProtectedMainBase)\n';
          pre = replaceOnce(pre, preBase, '        (/^[0-9a-f]{40}$/.test(effectiveCurrentCropRegistryResolverProtectedMainBase) && args.base === effectiveCurrentCropRegistryResolverProtectedMainBase) ||\n        (/^[0-9a-f]{40}$/.test(twinV2RuntimeSelectionAdoptionProtectedMainBase) && args.base === twinV2RuntimeSelectionAdoptionProtectedMainBase)\n', 'PREFLIGHT_DURABLE_BASE_ANCHOR');
          fs.writeFileSync(preflight, pre);

          let route = fs.readFileSync(routing, 'utf8');
          const routeAnchor = '  "scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_TWIN_V2_ROLLING_STAGE_AUTHORITY_RESOLVER_SEAM_V1.cjs"\n].sort();';
          const routeReplacement = '  "scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_TWIN_V2_ROLLING_STAGE_AUTHORITY_RESOLVER_SEAM_V1.cjs",\n  ".github/workflows/mcft-cap-09-qualification-control-plane-v1.yml",\n  ".github/workflows/mcft-cap-09-post-merge-v13-control-plane-v1.yml",\n  "docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-CONTROL-PLANE-V1.json",\n  "docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-EVIDENCE-REGISTRY-V1.json",\n  "scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_ALL_BLOCKERS_V1.cjs"\n].sort();';
          route = replaceOnce(route, routeAnchor, routeReplacement, 'ROUTING_ADOPTION_EXPECTED_SET');
          route = replaceOnce(route, 'PRODUCTION_TWIN_V2_ROUTING_ADOPTION_EXACT_FIVE_FILE_BOUNDARY_REQUIRED', 'PRODUCTION_TWIN_V2_ROUTING_ADOPTION_EXACT_TEN_FILE_BOUNDARY_REQUIRED', 'ROUTING_BOUNDARY_CODE');
          fs.writeFileSync(routing, route);

          const changed = cp.execFileSync('git', ['diff', '--name-only'], {encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean).sort();
          const expected = [...paths].sort();
          if (JSON.stringify(changed) !== JSON.stringify(expected)) throw new Error(`UNEXPECTED_NONWORKFLOW_PATCH_SET:${JSON.stringify(changed)}`);
          cp.execFileSync('git', ['diff', '--check'], {stdio:'inherit'});
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-CONTROL-PLANE-V1.json \
            docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-EVIDENCE-REGISTRY-V1.json \
            scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_PRODUCTION_TWIN_PROCESS_V2_ROUTING_V1.cjs \
            scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_ALL_BLOCKERS_V1.cjs
          git commit -m 'test(mcft-cap09): register 5050 non-workflow qualification lineage'
          git push origin "HEAD:${HEAD_BRANCH}"

name: mcft-cap-09-twin-v2-rolling-stage-authority-resolver-seam-v1

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-twin-v2-rolling-stage-authority-resolver-seam-v1.yml'

permissions:
  contents: write

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact governance finalizer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create final bounded adoption commit object without moving ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');

          const predecessor = '5050f1c08d2528048c56d56add4cbb068b956925';
          const b37 = 'b37b6cee4aadb50a8303cdfeffd0b4ab8a89451f';
          const finalResolverSource = '6ef7d0d05204c3877cb31762e90083941bdb405b';
          const qcp = '.github/workflows/mcft-cap-09-qualification-control-plane-v1.yml';
          const resolver = '.github/workflows/mcft-cap-09-twin-v2-rolling-stage-authority-resolver-seam-v1.yml';

          function replaceOnce(text, before, after, code) {
            const count = text.split(before).length - 1;
            if (count !== 1) throw new Error(`${code}:COUNT=${count}`);
            return text.replace(before, after);
          }

          let qcpText = fs.readFileSync(qcp, 'utf8');
          const pathAnchor = "      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EFFECTIVE-CURRENT-CROP-AUTHORITY-REGISTRY-V1.json'\n";
          const adoptionTriggerPaths = [
            ".github/workflows/mcft-cap-09-twin-v2-rolling-stage-authority-resolver-seam-v1.yml",
            "apps/server/src/runtime/twin_runtime/mcft_cap09_current_crop_authority_resolver_v1.test.ts",
            "apps/server/src/runtime/twin_runtime/mcft_cap09_twin_runtime_process_v2.ts",
            "scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_PRODUCTION_TWIN_PROCESS_V2_ROUTING_V1.cjs",
            "scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_TWIN_V2_ROLLING_STAGE_AUTHORITY_RESOLVER_SEAM_V1.cjs",
          ];
          for (const p of adoptionTriggerPaths) {
            if (qcpText.includes(`      - '${p}'`)) throw new Error(`QCP_TRIGGER_PATH_ALREADY_PRESENT:${p}`);
          }
          qcpText = replaceOnce(
            qcpText,
            pathAnchor,
            pathAnchor + adoptionTriggerPaths.map(p => `      - '${p}'\n`).join(''),
            'QCP_PATH_ANCHOR',
          );
          const qcpEnv = `  EFFECTIVE_CURRENT_CROP_REGISTRY_RESOLVER_PROTECTED_MAIN_PREDECESSOR_SHA: '${b37}'\n`;
          qcpText = replaceOnce(
            qcpText,
            qcpEnv,
            qcpEnv + `  TWIN_V2_RUNTIME_SELECTION_ADOPTION_PROTECTED_MAIN_PREDECESSOR_SHA: '${predecessor}'\n`,
            'QCP_ENV_ANCHOR',
          );
          const qcpGuard = '[ "$base" != "$EFFECTIVE_CURRENT_CROP_REGISTRY_RESOLVER_PROTECTED_MAIN_PREDECESSOR_SHA" ]; then';
          qcpText = replaceOnce(
            qcpText,
            qcpGuard,
            '[ "$base" != "$EFFECTIVE_CURRENT_CROP_REGISTRY_RESOLVER_PROTECTED_MAIN_PREDECESSOR_SHA" ] && [ "$base" != "$TWIN_V2_RUNTIME_SELECTION_ADOPTION_PROTECTED_MAIN_PREDECESSOR_SHA" ]; then',
            'QCP_BASE_GUARD',
          );
          const qcpExpected = 'process.env.EFFECTIVE_CURRENT_CROP_REGISTRY_RESOLVER_PROTECTED_MAIN_PREDECESSOR_SHA];';
          qcpText = replaceOnce(
            qcpText,
            qcpExpected,
            'process.env.EFFECTIVE_CURRENT_CROP_REGISTRY_RESOLVER_PROTECTED_MAIN_PREDECESSOR_SHA, process.env.TWIN_V2_RUNTIME_SELECTION_ADOPTION_PROTECTED_MAIN_PREDECESSOR_SHA];',
            'QCP_EXPECTED_PREDECESSOR_SET',
          );
          fs.writeFileSync(qcp, qcpText);

          const finalResolverText = cp.execFileSync(
            'git',
            ['show', `${finalResolverSource}:${resolver}`],
            {encoding:'utf8'},
          );
          if (!finalResolverText.includes('permissions:\n  contents: read')) throw new Error('FINAL_RESOLVER_NOT_READ_ONLY');
          if (!finalResolverText.includes('persist-credentials: false')) throw new Error('FINAL_RESOLVER_CREDENTIAL_PERSISTENCE_NOT_DISABLED');
          if (!finalResolverText.includes('mcft_cap09_twin_runtime_process_v2.ts')) throw new Error('FINAL_RESOLVER_PROCESS_TRIGGER_MISSING');
          fs.writeFileSync(resolver, finalResolverText);

          const changed = cp.execFileSync('git', ['diff', '--name-only'], {encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean).sort();
          const expected = [qcp, resolver].sort();
          if (JSON.stringify(changed) !== JSON.stringify(expected)) throw new Error(`FINALIZER_UNEXPECTED_DIFF:${JSON.stringify(changed)}`);
          cp.execFileSync('git', ['diff', '--check'], {stdio:'inherit'});

          const repo = process.env.GITHUB_REPOSITORY;
          const token = process.env.GH_TOKEN;
          const head = cp.execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim();
          const baseTree = cp.execFileSync('git', ['rev-parse', 'HEAD^{tree}'], {encoding:'utf8'}).trim();

          async function api(method, endpoint, body) {
            const response = await fetch(`https://api.github.com/repos/${repo}${endpoint}`, {
              method,
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
                'Content-Type': 'application/json',
              },
              body: body === undefined ? undefined : JSON.stringify(body),
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`GITHUB_API_${method}_${endpoint}:${response.status}:${text}`);
            return JSON.parse(text);
          }

          async function createBlob(file) {
            const result = await api('POST', '/git/blobs', {
              content: fs.readFileSync(file, 'utf8'),
              encoding: 'utf-8',
            });
            if (!/^[0-9a-f]{40}$/.test(result.sha || '')) throw new Error(`INVALID_BLOB_SHA:${file}`);
            return result.sha;
          }

          (async () => {
            const qcpBlob = await createBlob(qcp);
            const resolverBlob = await createBlob(resolver);
            const tree = await api('POST', '/git/trees', {
              base_tree: baseTree,
              tree: [
                {path:qcp, mode:'100644', type:'blob', sha:qcpBlob},
                {path:resolver, mode:'100644', type:'blob', sha:resolverBlob},
              ],
            });
            if (!/^[0-9a-f]{40}$/.test(tree.sha || '')) throw new Error('INVALID_FINAL_TREE_SHA');
            const commit = await api('POST', '/git/commits', {
              message: 'test(mcft-cap09): finalize 5050 adoption qualification routing',
              tree: tree.sha,
              parents: [head],
            });
            if (!/^[0-9a-f]{40}$/.test(commit.sha || '')) throw new Error('INVALID_FINAL_COMMIT_SHA');
            console.log(`FINAL_PARENT_SHA=${head}`);
            console.log(`FINAL_TREE_SHA=${tree.sha}`);
            console.log(`FINAL_COMMIT_SHA=${commit.sha}`);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

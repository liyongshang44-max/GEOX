name: mcft-cap-09-twin-v2-rolling-stage-authority-resolver-seam-v1

on:
  pull_request:
    paths:
      - 'apps/server/src/runtime/twin_runtime/mcft_cap09_current_crop_authority_resolver_v1.ts'
      - 'apps/server/src/runtime/twin_runtime/mcft_cap09_current_crop_authority_resolver_v1.test.ts'
      - 'apps/server/src/runtime/twin_runtime/mcft_cap09_twin_runtime_composition_v2.ts'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_TWIN_V2_ROLLING_STAGE_AUTHORITY_RESOLVER_SEAM_V1.cjs'
      - '.github/workflows/mcft-cap-09-twin-v2-rolling-stage-authority-resolver-seam-v1.yml'

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact successor subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm

      - name: Install exact repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused rolling authority resolver tests
        run: >-
          node --import tsx --test
          apps/server/src/runtime/twin_runtime/mcft_cap09_current_crop_authority_resolver_v1.test.ts

      - name: Prove governance and production non-effects
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_TWIN_V2_ROLLING_STAGE_AUTHORITY_RESOLVER_SEAM_V1.cjs

      - name: Upload resolver seam proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-twin-v2-rolling-stage-authority-resolver-seam-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/MCFT_CAP_09_TWIN_V2_ROLLING_STAGE_AUTHORITY_RESOLVER_SEAM_V1.json
          if-no-files-found: warn
          retention-days: 90

  temporary-register-fresh-requalification-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      pull-requests: read
    env:
      EVIDENCE_SUBJECT_SHA: '8f2900156df36e6a5b6ff86114c51db73fdca3f4'
      GOVERNED_BASE_SHA: 'd67a2b3cce037c1eaad4d7d051d1f6a11eb09fc3'
      CURRENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout exact registrar subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Register verified rolling-stage successor evidence
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const crypto = require('node:crypto');
          const registryPath = 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-EVIDENCE-REGISTRY-V1.json';
          const planPath = '/tmp/mcft-cap09-rolling-stage-plan.json';
          const subject = process.env.EVIDENCE_SUBJECT_SHA;
          const base = process.env.GOVERNED_BASE_SHA;
          const head = process.env.CURRENT_HEAD_SHA;
          const repo = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          if (!/^[0-9a-f]{40}$/.test(subject) || !/^[0-9a-f]{40}$/.test(base) || !/^[0-9a-f]{40}$/.test(head)) throw new Error('INVALID_SHA_CONTEXT');
          if (!token || !repo) throw new Error('GITHUB_CONTEXT_REQUIRED');
          cp.execFileSync(process.execPath, [
            'scripts/governance_acceptance/PLAN_MCFT_CAP_09_CHECK_APPLICABILITY_V1.cjs',
            '--base', base, '--head', head, '--generation', 'v13', '--stage', 'SUCCESSOR_SUBJECT_PRE_MERGE', '--out', planPath,
          ], { stdio:'inherit' });
          const plan = JSON.parse(fs.readFileSync(planPath,'utf8'));
          const registry = JSON.parse(fs.readFileSync(registryPath,'utf8'));
          const section = registry.requalification_evidence;
          if (!section || section.binding_strategy !== 'MCFT_CAP09_REQUALIFICATION_RUN_BINDING_V1') throw new Error('REQUALIFICATION_SECTION_INVALID');
          if (!Array.isArray(section.entries) || !Array.isArray(section.durable_anchors?.entries)) throw new Error('REQUALIFICATION_ARRAYS_INVALID');
          const governed = section.durable_anchors?.rules?.governed_successor_predecessors || [];
          if (!governed.includes(base)) throw new Error('CURRENT_PROTECTED_MAIN_NOT_GOVERNED');
          const specs = [
            {
              check_id:'PHASE2_EVIDENCE_PROVIDER_MODULES',
              evidence_id:'PHASE2_EVIDENCE_PROVIDER_MODULES_REQUAL_8F290015_ROLLING_STAGE_V1',
              generation:'rolling-stage-resolver-successor-requalification-phase2-provider-continuity',
              run_id:33899553277,
              workflow_name:'mcft-cap-09-ea5c2b1-live-kbs-soil-ingress-executor',
              workflow_path:'.github/workflows/mcft-cap-09-ea5c2b1-live-kbs-soil-ingress-executor.yml',
              expected_digest:'sha256:5456d16652223bc6c15305078471c91526ed62d5a5891307a0f2e4aa20facf97',
            },
            {
              check_id:'TWIN_V2_STAGE_AUTHORITY_SUCCESSOR',
              evidence_id:'TWIN_V2_STAGE_AUTHORITY_SUCCESSOR_REQUAL_8F290015_ROLLING_STAGE_V1',
              generation:'rolling-stage-resolver-successor-requalification-twin-v2-stage-authority',
              run_id:33899553414,
              workflow_name:'MCFT CAP-09 Twin Composition V2 Stage Authority',
              workflow_path:'.github/workflows/mcft-cap-09-twin-composition-v2-stage-authority.yml',
              expected_digest:'sha256:a7bd3d729ddc879d135db4459d3b8309c4e4c9990e1285eddab141e32e1f1219',
            },
            {
              check_id:'PRODUCTION_TWIN_PROCESS_V2_ROUTING',
              evidence_id:'PRODUCTION_TWIN_PROCESS_V2_ROUTING_REQUAL_8F290015_ROLLING_STAGE_V1',
              generation:'rolling-stage-resolver-successor-requalification-production-twin-v2-routing',
              run_id:33899553628,
              workflow_name:'MCFT CAP-09 Production Twin Process V2 Routing',
              workflow_path:'.github/workflows/mcft-cap-09-production-twin-process-v2-routing.yml',
              expected_digest:'sha256:8700ffe9997f9726579d443e02238ca309161a62bbd8b57cabf3dcfc81706ff4',
            },
            {
              check_id:'BIOLOGICAL_STAGE_EFFECTIVENESS_GRADUATION',
              evidence_id:'BIOLOGICAL_STAGE_EFFECTIVENESS_GRADUATION_REQUAL_8F290015_ROLLING_STAGE_V1',
              generation:'rolling-stage-resolver-successor-requalification-biological-stage-effectiveness',
              run_id:33899553670,
              workflow_name:'MCFT CAP-09 Biological Stage Effectiveness Graduation',
              workflow_path:'.github/workflows/mcft-cap-09-biological-stage-effectiveness-graduation-v1.yml',
              expected_digest:'sha256:0a3acef65dd01c9377e4bb607e47f2b9b3a7669340d35be945177ffe3ee8bde7',
            },
          ];
          const bindingFields = [
            'evidence_id','check_id','evidence_class','generation','stage','subject_sha',
            'workflow_name','workflow_path','run_id','run_conclusion','artifact_id','artifact_digest',
            'dependency_subject_sha','dependency_digest_strategy','dependency_digest',
            'artifact_absence_reason','immutable',
          ];
          const sha256 = value => crypto.createHash('sha256').update(value).digest('hex');
          const binding = entry => sha256(JSON.stringify(bindingFields.map(k => entry?.[k] ?? null)));
          async function getRun(id) {
            const response = await fetch(`https://api.github.com/repos/${repo}/actions/runs/${id}`, {
              headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},
            });
            if (!response.ok) throw new Error(`RUN_FETCH_FAILED:${id}:${response.status}`);
            return response.json();
          }
          async function main() {
            const existingEntries = new Set(section.entries.map(x=>x.evidence_id));
            const existingAnchors = new Set(section.durable_anchors.entries.map(x=>x.evidence_id));
            for (const spec of specs) {
              if (existingEntries.has(spec.evidence_id) || existingAnchors.has(spec.evidence_id)) throw new Error(`EVIDENCE_ID_ALREADY_PRESENT:${spec.evidence_id}`);
              const decision = plan.decisions.find(x=>x.check_id===spec.check_id);
              if (!decision || decision.status!=='REQUALIFY' || decision.execution_workflow!==spec.workflow_path) throw new Error(`PLAN_DECISION_INVALID:${spec.check_id}`);
              if (decision.dependency_digest!==spec.expected_digest) throw new Error(`DEPENDENCY_DIGEST_DRIFT:${spec.check_id}:${decision.dependency_digest}`);
              const run = await getRun(spec.run_id);
              const liveBase = run.pull_requests?.find(pr=>pr?.base?.sha)?.base?.sha ?? null;
              if (run.status!=='completed' || run.conclusion!=='success') throw new Error(`RUN_NOT_SUCCESS:${spec.check_id}`);
              if (run.head_sha!==subject) throw new Error(`RUN_HEAD_MISMATCH:${spec.check_id}:${run.head_sha}`);
              if (liveBase!==base) throw new Error(`RUN_BASE_MISMATCH:${spec.check_id}:${liveBase}`);
              if (run.event!=='pull_request' || run.name!==spec.workflow_name || run.path!==spec.workflow_path) throw new Error(`RUN_IDENTITY_MISMATCH:${spec.check_id}`);
              const entry = {
                evidence_id:spec.evidence_id,
                check_id:spec.check_id,
                evidence_class:'IMMUTABLE_WORKFLOW_RUN',
                generation:spec.generation,
                stage:'SUCCESSOR_SUBJECT_PRE_MERGE',
                subject_sha:subject,
                workflow_name:spec.workflow_name,
                workflow_path:spec.workflow_path,
                run_id:spec.run_id,
                run_conclusion:'success',
                artifact_id:null,
                artifact_digest:null,
                dependency_subject_sha:subject,
                dependency_digest_strategy:registry.dependency_digest_strategy,
                dependency_digest:spec.expected_digest,
                artifact_absence_reason:'RUN_LEVEL_EXACT_SUBJECT_ROLLING_STAGE_RESOLVER_REQUALIFICATION_EVIDENCE_ONLY',
                immutable:true,
              };
              entry.immutable_binding_sha256 = binding(entry);
              const anchor = {
                evidence_id:spec.evidence_id,
                run_id:spec.run_id,
                run_snapshot:{
                  event:run.event,
                  run_number:run.run_number,
                  workflow_path:run.path,
                  workflow_name:run.name,
                  head_sha:run.head_sha,
                  base_sha:liveBase,
                  created_at:run.created_at,
                  updated_at:run.updated_at,
                },
              };
              section.entries.push(entry);
              section.durable_anchors.entries.push(anchor);
              process.stdout.write(JSON.stringify({check_id:spec.check_id,evidence_id:spec.evidence_id,run_id:spec.run_id,dependency_digest:spec.expected_digest,binding:entry.immutable_binding_sha256})+'\n');
            }
            fs.writeFileSync(registryPath,JSON.stringify(registry,null,2)+'\n');
          }
          main().catch(error=>{console.error(error);process.exitCode=1;});

      - name: Validate registry settlement
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('node:fs').readFileSync('docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-EVIDENCE-REGISTRY-V1.json','utf8'))"
          git diff --check -- docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-EVIDENCE-REGISTRY-V1.json
          grep -Fq 'PHASE2_EVIDENCE_PROVIDER_MODULES_REQUAL_8F290015_ROLLING_STAGE_V1' docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-EVIDENCE-REGISTRY-V1.json
          grep -Fq 'TWIN_V2_STAGE_AUTHORITY_SUCCESSOR_REQUAL_8F290015_ROLLING_STAGE_V1' docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-EVIDENCE-REGISTRY-V1.json
          grep -Fq 'PRODUCTION_TWIN_PROCESS_V2_ROUTING_REQUAL_8F290015_ROLLING_STAGE_V1' docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-EVIDENCE-REGISTRY-V1.json
          grep -Fq 'BIOLOGICAL_STAGE_EFFECTIVENESS_GRADUATION_REQUAL_8F290015_ROLLING_STAGE_V1' docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-EVIDENCE-REGISTRY-V1.json

      - name: Create durable evidence settlement commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-EVIDENCE-REGISTRY-V1.json
          git diff --cached --check
          git commit -m 'test(mcft-cap09): register rolling-stage fresh qualification evidence'
          echo "EVIDENCE_SETTLEMENT_COMMIT=$(git rev-parse HEAD)"
          echo "EVIDENCE_SETTLEMENT_PARENT=$(git rev-parse HEAD^)"
          echo "EVIDENCE_SETTLEMENT_TREE=$(git rev-parse HEAD^{tree})"
          git push origin "HEAD:refs/heads/${{ github.event.pull_request.head.ref }}"

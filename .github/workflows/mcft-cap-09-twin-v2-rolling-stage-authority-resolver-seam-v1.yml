name: mcft-cap-09-twin-v2-rolling-stage-authority-resolver-seam-v1

on:
  pull_request:
    paths:
      - 'apps/server/src/runtime/twin_runtime/mcft_cap09_current_crop_authority_resolver_v1.ts'
      - 'apps/server/src/runtime/twin_runtime/mcft_cap09_current_crop_authority_resolver_v1.test.ts'
      - 'apps/server/src/runtime/twin_runtime/mcft_cap09_twin_runtime_composition_v2.ts'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EFFECTIVE-CURRENT-CROP-AUTHORITY-REGISTRY-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_TWIN_V2_ROLLING_STAGE_AUTHORITY_RESOLVER_SEAM_V1.cjs'
      - '.github/workflows/mcft-cap-09-twin-v2-rolling-stage-authority-resolver-seam-v1.yml'

permissions:
  contents: write
  actions: read

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact successor subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Patch QCP trigger for effective authority registry
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const workflowPath = '.github/workflows/mcft-cap-09-qualification-control-plane-v1.yml';
          const registryLine = "      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EFFECTIVE-CURRENT-CROP-AUTHORITY-REGISTRY-V1.json'";
          const anchor = "      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-CONTROL-PLANE-V1.json'";
          let text = fs.readFileSync(workflowPath, 'utf8');
          if (!text.includes(registryLine)) {
            if (!text.includes(anchor)) throw new Error('QCP_TRIGGER_ANCHOR_MISSING');
            text = text.replace(anchor, `${anchor}\n${registryLine}`);
            fs.writeFileSync(workflowPath, text);
          }
          NODE
          changed="$(git diff --name-only)"
          test "$changed" = '.github/workflows/mcft-cap-09-qualification-control-plane-v1.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/mcft-cap-09-qualification-control-plane-v1.yml
          git commit -m 'test(mcft-cap09): trigger QCP for effective authority registry'
          echo "QCP_TRIGGER_COMMIT=$(git rev-parse HEAD)"
          set +e
          git push origin "HEAD:${HEAD_BRANCH}"
          rc=$?
          set -e
          echo "QCP_TRIGGER_PUSH_RC=$rc"
          exit 0

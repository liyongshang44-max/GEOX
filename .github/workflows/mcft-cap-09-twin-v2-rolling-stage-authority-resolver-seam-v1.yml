name: mcft-cap-09-twin-v2-rolling-stage-authority-resolver-seam-v1

on:
  pull_request:
    paths:
      - 'apps/server/src/runtime/twin_runtime/mcft_cap09_current_crop_authority_resolver_v1.ts'
      - 'apps/server/src/runtime/twin_runtime/mcft_cap09_current_crop_authority_resolver_v1.test.ts'
      - 'apps/server/src/runtime/twin_runtime/mcft_cap09_twin_runtime_composition_v2.ts'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EFFECTIVE-CURRENT-CROP-AUTHORITY-REGISTRY-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_TWIN_V2_ROLLING_STAGE_AUTHORITY_RESOLVER_SEAM_V1.cjs'
      - '.github/workflows/mcft-cap-09-twin-v2-rolling-stage-authority-resolver-seam-v1.yml'

permissions:
  contents: write

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact qualification carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize governed predecessor blobs without branch writes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const predecessor = 'b37b6cee4aadb50a8303cdfeffd0b4ab8a89451f';
          const d67 = 'd67a2b3cce037c1eaad4d7d051d1f6a11eb09fc3';
          const qcpWorkflow = '.github/workflows/mcft-cap-09-qualification-control-plane-v1.yml';
          const qcpAuthority = 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-CONTROL-PLANE-V1.json';
          const postMergeWorkflow = '.github/workflows/mcft-cap-09-post-merge-v13-control-plane-v1.yml';
          const replaceExactlyOnce = (text, before, after, code) => {
            const count = text.split(before).length - 1;
            if (count !== 1) throw new Error(`${code}:COUNT=${count}`);
            return text.replace(before, after);
          };

          let qcp = fs.readFileSync(qcpWorkflow, 'utf8');
          const qcpEnv = `  ROLLING_STAGE_RESOLVER_PROTECTED_MAIN_PREDECESSOR_SHA: '${d67}'\n`;
          qcp = replaceExactlyOnce(qcp, qcpEnv, qcpEnv + `  EFFECTIVE_CURRENT_CROP_REGISTRY_RESOLVER_PROTECTED_MAIN_PREDECESSOR_SHA: '${predecessor}'\n`, 'QCP_ENV_ANCHOR');
          const qcpGuard = '[ "$base" != "$ROLLING_STAGE_RESOLVER_PROTECTED_MAIN_PREDECESSOR_SHA" ]; then';
          qcp = replaceExactlyOnce(qcp, qcpGuard, '[ "$base" != "$ROLLING_STAGE_RESOLVER_PROTECTED_MAIN_PREDECESSOR_SHA" ] && [ "$base" != "$EFFECTIVE_CURRENT_CROP_REGISTRY_RESOLVER_PROTECTED_MAIN_PREDECESSOR_SHA" ]; then', 'QCP_BASE_GUARD');
          const qcpExpected = 'process.env.ROLLING_STAGE_RESOLVER_PROTECTED_MAIN_PREDECESSOR_SHA];';
          qcp = replaceExactlyOnce(qcp, qcpExpected, 'process.env.ROLLING_STAGE_RESOLVER_PROTECTED_MAIN_PREDECESSOR_SHA, process.env.EFFECTIVE_CURRENT_CROP_REGISTRY_RESOLVER_PROTECTED_MAIN_PREDECESSOR_SHA];', 'QCP_EXPECTED_PREDECESSOR_SET');
          fs.writeFileSync(qcpWorkflow, qcp);

          let authority = fs.readFileSync(qcpAuthority, 'utf8');
          const authorityAnchor = `    "${d67}"\n  ],`;
          authority = replaceExactlyOnce(authority, authorityAnchor, `    "${d67}",\n    "${predecessor}"\n  ],`, 'QCP_AUTHORITY_PREDECESSOR_SET');
          fs.writeFileSync(qcpAuthority, authority);

          let post = fs.readFileSync(postMergeWorkflow, 'utf8');
          const postEnv = `  ROLLING_STAGE_RESOLVER_PROTECTED_MAIN_PREDECESSOR_SHA: '${d67}'\n`;
          post = replaceExactlyOnce(post, postEnv, postEnv + `  EFFECTIVE_CURRENT_CROP_REGISTRY_RESOLVER_PROTECTED_MAIN_PREDECESSOR_SHA: '${predecessor}'\n`, 'POSTMERGE_ENV_ANCHOR');
          const postGuard = '[ "$base_sha" != "$ROLLING_STAGE_RESOLVER_PROTECTED_MAIN_PREDECESSOR_SHA" ]; then';
          post = replaceExactlyOnce(post, postGuard, '[ "$base_sha" != "$ROLLING_STAGE_RESOLVER_PROTECTED_MAIN_PREDECESSOR_SHA" ] && [ "$base_sha" != "$EFFECTIVE_CURRENT_CROP_REGISTRY_RESOLVER_PROTECTED_MAIN_PREDECESSOR_SHA" ]; then', 'POSTMERGE_BASE_GUARD');
          fs.writeFileSync(postMergeWorkflow, post);

          const changed = require('node:child_process').execFileSync('git', ['diff', '--name-only'], {encoding:'utf8'}).trim().split('\n').filter(Boolean).sort();
          const expected = [qcpWorkflow, qcpAuthority, postMergeWorkflow].sort();
          if (JSON.stringify(changed) !== JSON.stringify(expected)) throw new Error(`UNEXPECTED_PATCH_SET:${JSON.stringify(changed)}`);

          async function createBlob(label, path) {
            const content = fs.readFileSync(path, 'utf8');
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({content, encoding: 'utf-8'})
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`CREATE_BLOB_${label}_FAILED:${response.status}:${body}`);
            const parsed = JSON.parse(body);
            if (!/^[0-9a-f]{40}$/.test(parsed.sha || '')) throw new Error(`CREATE_BLOB_${label}_INVALID_SHA`);
            console.log(`BLOB_${label}=${parsed.sha}`);
          }
          Promise.all([
            createBlob('QCP_WORKFLOW', qcpWorkflow),
            createBlob('QCP_AUTHORITY', qcpAuthority),
            createBlob('POSTMERGE_WORKFLOW', postMergeWorkflow)
          ]).catch(error => { console.error(error); process.exit(1); });
          NODE

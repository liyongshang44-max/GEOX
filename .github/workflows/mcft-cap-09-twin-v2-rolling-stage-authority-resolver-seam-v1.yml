name: mcft-cap-09-twin-v2-rolling-stage-authority-resolver-seam-v1

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-twin-v2-rolling-stage-authority-resolver-seam-v1.yml'

permissions:
  contents: write

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact qualification carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Correct owner-cutover qualification path only
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_PRODUCTION_TWIN_PROCESS_V2_ROUTING_V1.cjs';
          const oldValue = '.github/workflows/mcft-cap-09-production-runtime-owner-cutover.yml';
          const newValue = '.github/workflows/mcft-cap-09-production-runtime-owner-cutover-v1.yml';
          let text = fs.readFileSync(path, 'utf8');
          const count = text.split(oldValue).length - 1;
          if (count !== 1) throw new Error(`OWNER_CUTOVER_OLD_PATH_COUNT=${count}`);
          if (text.includes(newValue)) throw new Error('OWNER_CUTOVER_V1_PATH_ALREADY_PRESENT');
          text = text.replace(oldValue, newValue);
          fs.writeFileSync(path, text);
          NODE
          changed="$(git diff --name-only)"
          test "$changed" = 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_PRODUCTION_TWIN_PROCESS_V2_ROUTING_V1.cjs'
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_PRODUCTION_TWIN_PROCESS_V2_ROUTING_V1.cjs
          git commit -m 'fix(mcft-cap09): correct owner-cutover qualification path'
          git push origin "HEAD:${HEAD_BRANCH}"

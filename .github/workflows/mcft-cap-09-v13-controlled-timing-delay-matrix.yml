name: mcft-cap-09-v13-controlled-timing-delay-matrix

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-v13-controlled-timing-delay-matrix.yml'
      - 'scripts/runtime_acceptance/RUN_MCFT_CAP_09_V13_CONTROLLED_TIMING_DELAY_MATRIX_V1.ts'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_V13_AUTONOMOUS_CONTROLLER_SERVICE_POSTGRES.ts'
      - 'apps/server/src/domain/twin_runtime/external_formal_forcing_acquisition_budget_v1.ts'
      - 'apps/server/src/runtime/twin_runtime/external_formal_forcing_autonomous_controller_service_v1.ts'
      - 'apps/server/src/runtime/twin_runtime/postgres_external_formal_forcing_base_continuity_repository_v1.ts'
      - 'apps/server/src/runtime/twin_runtime/postgres_external_formal_forcing_controller_lifecycle_v1.ts'
      - 'apps/server/src/runtime/twin_runtime/postgres_external_formal_forcing_supply_admission_v1.ts'
      - 'apps/server/db/migrations/2026_08_25_mcft_cap_09_v13_forcing_base_continuity.sql'
      - 'apps/server/db/migrations/2026_08_25_mcft_cap_09_v13_forcing_controller_admission.sql'
      - 'apps/server/db/migrations/2026_08_25_mcft_cap_09_v13_forcing_controller_lifecycle.sql'

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: '20.11.1'
  PNPM_VERSION: '9.15.4'
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mcft_cap09_v13_controlled_timing_delay_matrix
  MEASUREMENT_RUN_ID: '33357328641'
  MEASUREMENT_ARTIFACT_NAME: 'mcft-cap09-v13-exact-head-timing-measurement-c12e40b9a2c1d48abf4861331d7301c362f58bfc'
  MEASUREMENT_SUBJECT_SHA: 'c12e40b9a2c1d48abf4861331d7301c362f58bfc'

jobs:
  controlled-delay-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcft_cap09_v13_controlled_timing_delay_matrix
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mcft_cap09_v13_controlled_timing_delay_matrix"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout exact controlled-delay subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require no production bindings and real-measurement ancestor
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GEOX_MCFT_CAP09_T4R1_S6_DATABASE_URL:-}"
          test -z "${FORMAL_RAW_S3_ACCESS_KEY_ID:-}"
          git merge-base --is-ancestor "$MEASUREMENT_SUBJECT_SHA" "${{ github.event.pull_request.head.sha }}"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install locked workspace
        run: pnpm install --frozen-lockfile

      - name: Download immutable real timing measurement
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.MEASUREMENT_ARTIFACT_NAME }}
          path: timing-measurement
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.MEASUREMENT_RUN_ID }}

      - name: Run ephemeral PostgreSQL autonomous controller acceptance
        env:
          MCFT_CAP09_V13_AUTONOMOUS_SERVICE_DESTRUCTIVE_ACCEPTANCE: '1'
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_V13_AUTONOMOUS_CONTROLLER_SERVICE_POSTGRES.ts

      - name: Execute controlled timing delay matrix
        env:
          MCFT_SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
          MCFT_TIMING_MEASUREMENT_PROOF: timing-measurement/MCFT_CAP_09_V13_EXACT_HEAD_TIMING_MEASUREMENT_V1_RESULT.json
          MCFT_CONTROLLER_PROOF: acceptance-output/MCFT_CAP_09_V13_AUTONOMOUS_CONTROLLER_SERVICE_POSTGRES_RESULT.json
        run: pnpm exec tsx scripts/runtime_acceptance/RUN_MCFT_CAP_09_V13_CONTROLLED_TIMING_DELAY_MATRIX_V1.ts

      - name: Validate controlled timing delay proof
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_V13_CONTROLLED_TIMING_DELAY_MATRIX_V1_RESULT.json','utf8'));
          if(p.status!=='PASS'||p.controlled_delay_matrix_executed!==true||p.controlled_delay_case_count!==6)throw new Error('CONTROLLED_DELAY_MATRIX_PASS_REQUIRED');
          if(p.execution_mode!=='CONTROLLED_ENGINEERING_FIXTURE_SCALED_DELAY_INJECTION_V1'||p.production_provider_request_count!==0||p.production_database_binding!==false)throw new Error('CONTROLLED_DELAY_MATRIX_BOUNDARY_INVALID');
          if(p.full_scale_budget_adjudication?.status!=='PASS'||p.full_scale_budget_adjudication?.real_sample_count!==3||p.full_scale_budget_adjudication?.controlled_delay_case_count!==6)throw new Error('CONTROLLED_DELAY_MATRIX_BUDGET_REPLAY_REQUIRED');
          for(const k of ['production_owner_activation','formal_v5_arm','formal_v5_mutation','a0_bootstrap','o00_started','mcft_cap09_completed'])if(p[k]!==false)throw new Error('CONTROLLED_DELAY_MATRIX_LATER_STAGE_EFFECT:'+k);

      - name: Upload immutable controlled timing delay proof
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-v13-controlled-timing-delay-matrix-${{ github.event.pull_request.head.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_V13_CONTROLLED_TIMING_DELAY_MATRIX_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_V13_AUTONOMOUS_CONTROLLER_SERVICE_POSTGRES_RESULT.json
          if-no-files-found: error
          retention-days: 90

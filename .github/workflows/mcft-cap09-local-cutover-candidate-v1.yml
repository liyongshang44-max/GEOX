name: MCFT CAP-09 local cutover candidate checks
on:
  pull_request:
    paths:
      - 'scripts/governance_acceptance/*MCFT_CAP09*'
      - 'scripts/runtime_acceptance/*MCFT_CAP09*'
      - 'scripts/runtime_acceptance/RUN_MCFT_CAP_09_CURRENT_BASELINE_QUALIFICATION_V1.cjs'
      - 'scripts/runtime_acceptance/MCFT_CAP_09_CURRENT_BASELINE_EXECUTION_V1.cjs'
      - 'scripts/runtime_acceptance/*WINDOWS_LOCAL_QUALIFICATION_ENTRY*'
      - 'docs/digital_twin/mcft/cap_09/*LOCAL-EXECUTION-CUTOVER*'
      - 'docs/digital_twin/mcft/cap_09/evidence/retry-history-20261011/**'
      - '.github/workflows/mcft-cap09-local-cutover-candidate-v1.yml'
permissions:
  contents: read
jobs:
  isolated-clock-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
      - name: Source tree digest for exact-main reparent review
        run: |
          echo "MCFT_CUTOVER_HEAD_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "MCFT_CUTOVER_HEAD=$(git rev-parse HEAD)"
      - name: Classify historical cutover-candidate applicability
        id: candidate-scope
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs'), cp = require('node:child_process');
          const manifest = require('./docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP09-LOCAL-CUTOVER-EXACT-SCOPE-CANDIDATE-20261011-V1.json');
          const changed = cp.execFileSync('git', ['diff','--name-only',process.env.PR_BASE+'...'+process.env.PR_HEAD], {encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          // This workflow's routing edit is not a modification of the historical candidate itself.
          const routingFile = '.github/workflows/mcft-cap09-local-cutover-candidate-v1.yml';
          const owned = changed.filter(p => p!==routingFile && manifest.paths.includes(p));
          const required = owned.length > 0;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'required='+required+'\n');
          console.log(JSON.stringify({status:required?'HISTORICAL_CANDIDATE_SCOPE_REQUIRED':'HISTORICAL_CANDIDATE_SCOPE_NOT_APPLICABLE',candidate_owned_changes:owned,pr_changed_paths:changed,production_authorized:false}));
          NODE
      - name: Exact local cutover candidate diff scope (not adoption)
        if: steps.candidate-scope.outputs.required == 'true'
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP09_LOCAL_CUTOVER_EXACT_SCOPE_V1.cjs
      - name: Historical candidate scope excluded from unrelated scientific repair
        if: steps.candidate-scope.outputs.required == 'false'
        run: echo HISTORICAL_CANDIDATE_NOT_APPLICABLE_NO_AUTHORITY_EFFECT
      - name: Pure evidence-driven readiness tests (cannot authorize execute)
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP09_ISOLATED_EVIDENCE_DRIVEN_CLOCK_V1.cjs
      - name: Pure retry admission and immutable evidence-negative gates
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP09_ISOLATED_RETRY_ADMISSION_BRIDGE_V1.cjs
      - name: Synthetic single-use attempt and immutable receipt negative tests
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP09_WINDOWS_IMMUTABLE_ATTEMPT_JOURNAL_V1.cjs
      - name: Retry dispatch guard cannot fall through legacy authorization
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP09_GOVERNED_RETRY_DISPATCH_GUARD_V1.cjs

  permit-and-process-evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
      - name: No destructive SQL or retained database in controlled delay proposals
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP09_NONDESTRUCTIVE_REAL_DELAY_BOUNDARY_V1.cjs
      - name: Actual runner and child retry dispatch reject unadopted trust
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP09_GOVERNED_RETRY_HOST_V1.cjs
      - name: Original Windows evidence bytes and missing-adjudication boundaries
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP09_RETRY_HISTORICAL_EVIDENCE_V1.cjs
      - name: Synthetic issuer and concurrent nonce consumption tests
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP09_RETRY_PERMIT_V1.cjs
      - name: Synthetic subprocess exit, timeout and immutable receipt tests
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP09_STAGE_RECEIPTS_V1.cjs
      - name: Atomic parent permit and exactly-once child stage capability tests
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP09_STAGE_CAPABILITY_V1.cjs
      - name: Real synthetic child subprocesses, artifact hashes and fail-stop chain
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP09_PARENT_STAGE_DISPATCH_V1.cjs
      - name: Six subprocess stages with actual monotonic scratch-delay and tamper fail-stop E2E
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP09_SIX_STAGE_E2E_V1.cjs
      - name: Real loopback HTTP response latency, byte preservation and tamper negatives
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP09_REAL_PROVIDER_RESPONSE_DELAY_V1.cjs
      - name: Promotion and post-commit physical readback delay contract, ordering, tamper and budget negatives
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP09_REAL_PIPELINE_DELAY_V1.cjs
      - name: Fresh real Timing stage launch timestamps without stale prebuilt-plan bias
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP09_STAGE_START_CLOCK_V1.cjs

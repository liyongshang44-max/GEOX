name: mcft-cap-09-ea5e3-v2-provider-watermark-wiring

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-ea5e3-v2-provider-watermark-wiring.yml'
      - 'scripts/runtime_acceptance/RUN_MCFT_CAP_09_EA5E3_FORMAL_V2_PROVIDER_WATERMARK_COLLECTOR.ts'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E3_FORMAL_V2_PROVIDER_WATERMARK_WIRING.cjs'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA5E3-FORMAL-AUTHORITY-V3.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcft-cap-09-ea5e3-v2-provider-watermark-wiring.yml'
      - 'scripts/runtime_acceptance/RUN_MCFT_CAP_09_EA5E3_FORMAL_V2_PROVIDER_WATERMARK_COLLECTOR.ts'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E3_FORMAL_V2_PROVIDER_WATERMARK_WIRING.cjs'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA5E3-FORMAL-AUTHORITY-V3.json'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcft-cap09-ea5e3-v2-provider-watermark-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'formal-main' }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20.11.1'
  PNPM_VERSION: '9.15.4'
  PYTHON_VERSION: '3.12'
  EXACT_BASE_SHA: 'de280185c09312213f59624164171919517ad26b'
  TARGET_DATABASE_NAME: 'geox_mcft_cap09_s6_formal_t3r1_24h_v2'
  SOURCE_DATABASE_URL: ${{ secrets.GEOX_MCFT_CAP09_T3R1_S6_DATABASE_URL }}
  MCFT_CAP09_FORMAL_S3_ENDPOINT: ${{ secrets.GEOX_MCFT_CAP09_FORMAL_RAW_S3_ENDPOINT }}
  MCFT_CAP09_FORMAL_S3_BUCKET: ${{ secrets.GEOX_MCFT_CAP09_FORMAL_RAW_S3_BUCKET }}
  MCFT_CAP09_FORMAL_S3_REGION: ${{ secrets.GEOX_MCFT_CAP09_FORMAL_RAW_S3_REGION }}
  MCFT_CAP09_FORMAL_S3_ACCESS_KEY_ID: ${{ secrets.GEOX_MCFT_CAP09_FORMAL_RAW_S3_ACCESS_KEY_ID }}
  MCFT_CAP09_FORMAL_S3_SECRET_ACCESS_KEY: ${{ secrets.GEOX_MCFT_CAP09_FORMAL_RAW_S3_SECRET_ACCESS_KEY }}

jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fail closed on exact candidate boundary for PR
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha }}" = "$EXACT_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git fetch --no-tags --depth=1 origin "$EXACT_BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$EXACT_BASE_SHA" "$HEAD_SHA" | sort)
          test "${#changed[@]}" -eq 4
          expected=$(cat <<'EOF'
          .github/workflows/mcft-cap-09-ea5e3-v2-provider-watermark-wiring.yml
          docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA5E3-FORMAL-AUTHORITY-V3.json
          scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E3_FORMAL_V2_PROVIDER_WATERMARK_WIRING.cjs
          scripts/runtime_acceptance/RUN_MCFT_CAP_09_EA5E3_FORMAL_V2_PROVIDER_WATERMARK_COLLECTOR.ts
          EOF
          )
          test "$(printf '%s\n' "${changed[@]}")" = "$expected"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install repository and exact provider-decoder dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          python -m pip install --disable-pip-version-check \
            eccodes==2.47.0 \
            eccodeslib==2.47.3.23 \
            numpy==1.26.4 \
            refet==0.4.2

      - name: Typecheck production collector entrypoint
        run: pnpm exec tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --skipLibCheck --types node scripts/runtime_acceptance/RUN_MCFT_CAP_09_EA5E3_FORMAL_V2_PROVIDER_WATERMARK_COLLECTOR.ts

      - name: Prove Amendment-11 authoritative-late decoder has no freshness admission gate
        run: python scripts/runtime_acceptance/MCFT_CAP_09_KBS_AUTHORITATIVE_LATE_DECODER_V1.py selftest

      - name: Prove selected-epoch collector planner without provider or database access
        run: pnpm exec tsx scripts/runtime_acceptance/RUN_MCFT_CAP_09_EA5E3_FORMAL_V2_PROVIDER_WATERMARK_COLLECTOR.ts selftest

      - name: Prove EA5E3 authority and wiring governance
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E3_FORMAL_V2_PROVIDER_WATERMARK_WIRING.cjs

      - name: Derive replacement v2 database URL without exposing secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_DATABASE_URL"
          DATABASE_URL=$(node -e 'const u=new URL(process.env.SOURCE_DATABASE_URL); u.pathname="/"+process.env.TARGET_DATABASE_NAME; process.stdout.write(u.toString())')
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
          echo "SOURCE_DATABASE_URL=" >> "$GITHUB_ENV"

      - name: Re-prove replacement Formal store is still zero-state READ ONLY during qualification
        if: github.event_name == 'pull_request'
        env:
          MCFT_SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec tsx scripts/runtime_acceptance/PREFLIGHT_MCFT_CAP_09_A18A_ZERO_STATE_FORMAL_STORE.ts

      - name: Validate qualification nonclaims
        if: github.event_name == 'pull_request'
        shell: node {0}
        run: |
          const fs=require('fs');
          const z=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_A18A_ZERO_STATE_FORMAL_STORE_PREFLIGHT_RESULT.json','utf8'));
          const g=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_EA5E3_FORMAL_V2_PROVIDER_WATERMARK_WIRING_GOVERNANCE.json','utf8'));
          if(z.status!=='PASS'||z.transaction_mode!=='READ_ONLY') throw new Error('EA5E3_ZERO_STATE_READ_ONLY_REQUIRED');
          for(const value of Object.values(z.zero_state_counts)) if(value!==0) throw new Error('EA5E3_QUALIFICATION_LIVE_WRITE_FORBIDDEN');
          if(g.status!=='PASS'||g.blocker_count!==0||g.provider_availability_watermark!=='PROVIDER_AVAILABILITY_WATERMARK_V1') throw new Error('EA5E3_GOVERNANCE_PASS_REQUIRED');
          if(g.fixed_lag_authority_used!==false||g.qualification_database_write_count!==0||g.scheduler_write_count!==0||g.canonical_runtime_write_count!==0) throw new Error('EA5E3_NONCLAIM_REQUIRED');

      - name: Upload focused qualification proof
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-ea5e3-v2-provider-watermark-wiring-${{ github.event.pull_request.head.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_EA5E3_FORMAL_V2_PROVIDER_WATERMARK_WIRING_GOVERNANCE.json
            acceptance-output/MCFT_CAP_09_A18A_ZERO_STATE_FORMAL_STORE_PREFLIGHT_RESULT.json
          if-no-files-found: error
          retention-days: 7

  live-formal-evidence-collector:
    if: github.event_name != 'pull_request'
    needs: static-contract
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Checkout exact protected main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact protected main and on-time EA5E3 effectiveness
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'EA5E3_LIVE_EXACT_MAIN_DRIFT' >&2; exit 1; }
          authority='docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA5E3-FORMAL-AUTHORITY-V3.json'
          effective_commit=$(git log --first-parent --diff-filter=A -1 --format='%H' -- "$authority")
          test -n "$effective_commit" || { echo 'EA5E3_EFFECTIVE_FIRST_PARENT_COMMIT_REQUIRED' >&2; exit 1; }
          effective_time=$(git show -s --format='%cI' "$effective_commit")
          node -e 'const t=Date.parse(process.argv[1]); const d=Date.parse("2026-08-17T08:00:00.000Z"); if(!Number.isFinite(t)||t>d) throw new Error(`EA5E3_EFFECTIVENESS_DEADLINE_MISSED:${process.argv[1]}`)' "$effective_time"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install exact repository and provider decoder dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          python -m pip install --disable-pip-version-check \
            eccodes==2.47.0 \
            eccodeslib==2.47.3.23 \
            numpy==1.26.4 \
            refet==0.4.2

      - name: Require Formal DB and private raw bindings
        shell: bash
        run: |
          set -euo pipefail
          for name in SOURCE_DATABASE_URL MCFT_CAP09_FORMAL_S3_ENDPOINT MCFT_CAP09_FORMAL_S3_BUCKET MCFT_CAP09_FORMAL_S3_REGION MCFT_CAP09_FORMAL_S3_ACCESS_KEY_ID MCFT_CAP09_FORMAL_S3_SECRET_ACCESS_KEY; do
            test -n "${!name:-}" || { echo "EA5E3_LIVE_SECRET_REQUIRED:${name}" >&2; exit 1; }
          done
          test "$MCFT_CAP09_FORMAL_S3_BUCKET" = 'geox-mcft-cap09-formal-raw-v1'
          DATABASE_URL=$(node -e 'const u=new URL(process.env.SOURCE_DATABASE_URL); u.pathname="/"+process.env.TARGET_DATABASE_NAME; process.stdout.write(u.toString())')
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
          echo "SOURCE_DATABASE_URL=" >> "$GITHUB_ENV"

      - name: Execute one Amendment-11 Formal evidence collector cycle
        env:
          MCFT_CAP09_SUBJECT_SHA: ${{ github.sha }}
          PYTHON: python
        run: pnpm exec tsx scripts/runtime_acceptance/RUN_MCFT_CAP_09_EA5E3_FORMAL_V2_PROVIDER_WATERMARK_COLLECTOR.ts cycle

      - name: Validate metadata-only collector result
        shell: node {0}
        run: |
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_EA5E3_FORMAL_V2_PROVIDER_WATERMARK_COLLECTOR_RESULT.json','utf8'));
          if(p.status!=='PASS'||p.temporal_authority!=='PROVIDER_AVAILABILITY_WATERMARK_V1'||p.freshness_is_late_authoritative_admission_gate!==false) throw new Error('EA5E3_LIVE_PROVIDER_WATERMARK_REQUIRED');
          if(p.fixed_lag_7h_normative_authority!==false||p.fixed_t_plus_432_normative_cutoff!==false||p.fixed_t_plus_437_normative_observer!==false||p.cron_minute_is_normative_temporal_authority!==false) throw new Error('EA5E3_LIVE_FIXED_LAG_REVIVAL_FORBIDDEN');
          if(p.formal_database_name!=='geox_mcft_cap09_s6_formal_t3r1_24h_v2'||p.formal_raw_prefix!=='mcft-cap09-formal-raw-v1/sha256') throw new Error('EA5E3_LIVE_FORMAL_BINDING_REQUIRED');
          if(p.runtime_provider_request_count!==0||p.scheduler_write_count!==0||p.canonical_runtime_write_count!==0||p.raw_values_emitted!==false) throw new Error('EA5E3_LIVE_SIDE_EFFECT_BOUNDARY_REQUIRED');

      - name: Upload metadata-only Formal evidence collector proof
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-ea5e3-formal-v2-collector-${{ github.sha }}-${{ github.run_id }}
          path: acceptance-output/MCFT_CAP_09_EA5E3_FORMAL_V2_PROVIDER_WATERMARK_COLLECTOR_RESULT.json
          if-no-files-found: error
          retention-days: 7

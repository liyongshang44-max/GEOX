name: mcft-cap-08-s6-run-a-qualification-replacement-execution-authority-v7

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-08-s6-run-a-qualification-replacement-execution-authority-v7.yml'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-RUN-A-QUALIFICATION-REPLACEMENT-EXECUTION-AUTHORITY-V7.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-RUN-A-QUALIFICATION-REPLACEMENT-EXECUTION-AUTHORITY-BOUNDARY-V7.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_RUN_A_QUALIFICATION_REPLACEMENT_EXECUTION_AUTHORITY_V7.cjs'

permissions:
  contents: read

jobs:
  run-a-qualification-replacement-execution-authority-v7:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
      - name: Validate replacement RUN_A qualification execution authority V7
        env:
          MCFT_BASE_SHA: 7ac62b87f84d6bf80eb3478bc3aa79287602fd2b
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_RUN_A_QUALIFICATION_REPLACEMENT_EXECUTION_AUTHORITY_V7.cjs
      - name: Upload replacement execution authority V7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap-08-s6-run-a-qualification-replacement-execution-authority-v7-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/MCFT_CAP_08_S6_RUN_A_QUALIFICATION_REPLACEMENT_EXECUTION_AUTHORITY_V7_RESULT.json
          if-no-files-found: error
          retention-days: 90

name: mcft-cap-09-s1-registry-builder
on:
  push:
    branches: [agent/staging-mcft-cap09-s1-registry]
    paths:
      - '.github/workflows/mcft-cap-09-s1-registry-builder.yml'
permissions:
  contents: write
jobs:
  build-registry-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/staging-mcft-cap09-s1-registry
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
      - name: Generate deterministic S1 Registry registration tree
        run: node scripts/governance_acceptance/mcft_cap09_s1_registry_builder.cjs
      - name: Commit generated tree and self-remove builder
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'MCFT-CAP-09: generate S1 Registry registration'
          git push origin HEAD:agent/staging-mcft-cap09-s1-registry

  successor-candidate-promotion-composition:
    env:
      NODE_VERSION: '20.11.1'
      PNPM_VERSION: '9.15.4'
      EXACT_PREDECESSOR_SHA: '46c9c7b6b59c113848fc69daff88fb183fccc954'
      CURRENT_SUCCESSOR_BASE_SHA: 'd054b334b3e74f3356b5d02498da9ba845eccdfb'
      POSTMERGE_V13_QUALIFICATION_PREDECESSOR_SHA: '46367333d228a2b90a86ff6a33aebc334f3d73a2'
      PROTECTED_MAIN_ADOPTION_PREDECESSOR_SHA: 'fa6e260d8cdec4a82403a86f1c7b3d5420e44ef8'
      DATABASE_URL: 'postgres://postgres:postgres@127.0.0.1:5432/mcft_cap09_phase7_composition'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcft_cap09_phase7_composition
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mcft_cap09_phase7_composition"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install exact repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Require exact stacked predecessor and zero production activation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags origin main
            current_protected_main="$(git rev-parse origin/main)"
            if [[ "$base" != "$EXACT_PREDECESSOR_SHA" \
              && "$base" != "$POSTMERGE_V13_QUALIFICATION_PREDECESSOR_SHA" \
              && "$base" != "$PROTECTED_MAIN_ADOPTION_PREDECESSOR_SHA" \
              && "$base" != "$CURRENT_SUCCESSOR_BASE_SHA" \
              && "$base" != "$current_protected_main" ]]; then
              echo "PHASE7_COMPOSITION_UNGOVERNED_BASE:$base" >&2
              exit 1
            fi
          fi
          test -z "${GEOX_MCFT_CAP09_T4R1_S6_DATABASE_URL:-}"
          test -z "${GEOX_MCFT_CAP09_FORMAL_V5_DATABASE_URL:-}"
          test -z "${GEOX_MCFT_CAP09_FORMAL_V5_EPOCH_ID:-}"

      - name: Typecheck candidate/promotion composition graph
        run: |
          pnpm --filter @geox/server run typecheck
          pnpm exec tsc --noEmit --pretty false --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext --esModuleInterop --types node \
            apps/server/src/external_evidence/mcft_cap09_phase7_private_candidate_capture_promotion_v1.ts \
            apps/server/src/external_evidence/verified_retained_raw_replay_v1.ts \
            scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_VERIFIED_RETAINED_RAW_REPLAY_V1.ts \
            scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PHASE7_CANDIDATE_PROMOTION_COMPOSITION_V1.ts

      - name: Prove reusable verified retained-raw replay primitive
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_VERIFIED_RETAINED_RAW_REPLAY_V1.ts

      - name: Start isolated private formal raw/candidate store
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f mcft-cap09-phase7-composition-minio >/dev/null 2>&1 || true
          docker run -d --name mcft-cap09-phase7-composition-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=phase7composition \
            -e MINIO_ROOT_PASSWORD=phase7-composition-secret-key-001 \
            ghcr.io/l33tlamer/minio-backup@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e server /data
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null
          docker run --rm --network host --entrypoint /bin/sh \
            docker.io/apecloud/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727 -ceu '
              mc alias set phase7 http://127.0.0.1:9000 phase7composition phase7-composition-secret-key-001
              mc mb --ignore-existing phase7/geox-mcft-cap09-formal-raw-v1
              mc anonymous set private phase7/geox-mcft-cap09-formal-raw-v1
            '

      - name: Run real private candidate to PostgreSQL fenced promotion qualification
        env:
          MCFT_CAP09_PHASE7_COMPOSITION_DESTRUCTIVE_ACCEPTANCE: '1'

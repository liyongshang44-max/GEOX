      - name: Upload immutable viability proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-v13-next-tick-viability-${{ github.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_V13_NEXT_TICK_VIABILITY_POSTGRES_RESULT.json
            acceptance-output/MCFT_CAP_09_V13_POST_COMMIT_ADJUDICATION_BOUNDARY_RESULT.json

name: mcft-cap09-stage3-composer-six-native-successor-v2
# Independently rerun original six native job bodies under new exact PR HEAD.
# This action never issues a permit, signs a receipt, or inherits historic six signatures.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/mcft-cap09-stage3-composer-six-native-successor-v2.yml'
      - 'scripts/governance_acceptance/MCFT_CAP09_STAGE3_COMPOSER_SIX_NATIVE_SOURCE_RECEIPT_V2.cjs'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP09-STAGE3-PYTHON-COMPOSER-SIX-CHECK-SUCCESSOR-V2.json'
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: stage3-six-native-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  six-successor-contract-and-phase3-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
      - name: Preserve original DA9 contract; verify six successors have no execution authority
        run: node scripts/governance_acceptance/MCFT_CAP09_STAGE3_COMPOSER_SIX_NATIVE_SOURCE_RECEIPT_V2.cjs --selftest
      - name: Selftest offline six-check Ed25519 signer without using operator key
        run: |
          node --check scripts/governance_acceptance/SIGN_MCFT_CAP09_STAGE3_COMPOSER_SIX_OFFLINE_V2.cjs
          node scripts/governance_acceptance/SIGN_MCFT_CAP09_STAGE3_COMPOSER_SIX_OFFLINE_V2.cjs --selftest
      - name: Independently classify PHASE3 historical dependency digest mismatch
        run: node scripts/governance_acceptance/MCFT_CAP09_STAGE3_COMPOSER_SIX_NATIVE_SOURCE_RECEIPT_V2.cjs --phase3 --out=acceptance-output/MCFT_CAP09_STAGE3_PHASE3_HISTORICAL_DIGEST_DISPOSITION_V2.json
      - name: Publish nonauthorizing PHASE3 digest difference report
        uses: actions/upload-artifact@v4
        with:
          name: cap09-stage3-phase3-digest-hold-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/MCFT_CAP09_STAGE3_PHASE3_HISTORICAL_DIGEST_DISPOSITION_V2.json
          if-no-files-found: error
          retention-days: 90

  successor-v13-autonomous-forcing-foundation:
    env:
      NODE_VERSION: '20.11.1'
      PNPM_VERSION: '9.15.4'
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mcft_cap09_v13_forcing_acceptance
      EXACT_PREDECESSOR_SHA: '26c1383f7f45abb76c99e28ec3d06714e85d1b2c'
      CURRENT_SUCCESSOR_BASE_SHA: 'd054b334b3e74f3356b5d02498da9ba845eccdfb'
      SUCCESSOR_REQUALIFICATION_BASE_SHA: '46c9c7b6b59c113848fc69daff88fb183fccc954'
      POST_MERGE_V13_BASE_SHA: 'fa6e260d8cdec4a82403a86f1c7b3d5420e44ef8'
      PRODUCER_QUALIFICATION_BASE_SHA: '46367333d228a2b90a86ff6a33aebc334f3d73a2'
      SCHEMA_QUALIFICATION_CONSISTENCY_REPAIR_BASE_SHA: '252c9ebf5bfe43a31a405ee1b854b25e50d1ad72'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcft_cap09_v13_forcing_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mcft_cap09_v13_forcing_acceptance"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install locked workspace
        run: pnpm install --frozen-lockfile

      - name: Require exact predecessor and no production effect
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            if [ "$base" != "$EXACT_PREDECESSOR_SHA" ] && [ "$base" != "$SUCCESSOR_REQUALIFICATION_BASE_SHA" ] && [ "$base" != "$POST_MERGE_V13_BASE_SHA" ] && [ "$base" != "$PRODUCER_QUALIFICATION_BASE_SHA" ] && [ "$base" != "$SCHEMA_QUALIFICATION_CONSISTENCY_REPAIR_BASE_SHA"  && [ "$base" != "$CURRENT_SUCCESSOR_BASE_SHA" ]]; then
              echo "V13_FOUNDATION_UNGOVERNED_BASE:${base}" >&2
              exit 1
            fi
          fi
          test -z "${GEOX_MCFT_CAP09_T4R1_S6_DATABASE_URL:-}"
          ! grep -Eq '^  schedule:' .github/workflows/mcft-cap-09-v13-autonomous-forcing-foundation.yml

      - name: Validate v13 foundation governance
        env:
          MCFT_BASE_SHA: ${{ env.EXACT_PREDECESSOR_SHA }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_V13_AUTONOMOUS_FORCING_FOUNDATION.cjs

      - name: Typecheck v13 foundation surfaces
        run: >-
          pnpm exec tsc --noEmit --pretty false --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --esModuleInterop --types node
          apps/server/src/domain/twin_runtime/external_formal_forcing_acquisition_budget_v1.ts
          apps/server/src/runtime/twin_runtime/postgres_external_formal_forcing_base_continuity_repository_v1.ts
          scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_V13_AUTONOMOUS_FORCING_FOUNDATION.ts
          scripts/runtime_acceptance/RUN_MCFT_CAP_09_V13_PRODUCER_DRIVEN_LIVE_QUALIFICATION_V1.ts

      - name: Run real PostgreSQL v13 foundation acceptance
        env:
          MCFT_CAP09_V13_FOUNDATION_DESTRUCTIVE_ACCEPTANCE: '1'
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_V13_AUTONOMOUS_FORCING_FOUNDATION.ts

      - name: Typecheck full server Runtime surface
        run: pnpm --filter @geox/server typecheck

      - name: Validate machine proof
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const governance=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_V13_AUTONOMOUS_FORCING_FOUNDATION_GOVERNANCE.json','utf8'));
          const runtime=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_V13_AUTONOMOUS_FORCING_FOUNDATION_RESULT.json','utf8'));
          const exactRelations=['twin_external_formal_forcing_base_cursor_v1','twin_external_formal_forcing_base_target_v1','twin_external_formal_forcing_controller_lease_v1'];
          const predecessor=[
            'facts','twin_action_feedback_cycle_projection_v1','twin_action_feedback_evidence_index_v1','twin_action_feedback_projection_v1',
            'twin_active_lineage_index_v1','twin_approved_plan_binding_projection_v1','twin_decision_record_projection_v1',
            'twin_forecast_point_projection_v1','twin_forecast_residual_projection_v1','twin_forecast_result_latest_index_v1',
            'twin_forecast_run_projection_v1','twin_forecast_success_latest_index_v1','twin_object_idempotency_index_v1',
            'twin_runtime_authority_snapshot_v1','twin_runtime_checkpoint_latest_index_v1','twin_runtime_health_latest_index_v1',
            'twin_runtime_lease_v1','twin_scenario_latest_index_v1','twin_scenario_point_projection_v1','twin_scenario_set_projection_v1',
            'twin_scenario_set_uniqueness_v1','twin_shadow_online_scheduler_cursor_v1','twin_shadow_online_scheduler_slot_v1',
            'twin_state_history_projection_v1','twin_state_latest_index_v1','twin_terminal_tick_uniqueness_v1'
          ].sort();
          const final=[...predecessor,...exactRelations].sort();
          if(governance.status!=='PASS'||governance.operational_table_delta!==3||JSON.stringify(governance.exact_new_operational_relations)!==JSON.stringify(exactRelations)||JSON.stringify([...governance.exact_predecessor_relations].sort())!==JSON.stringify(predecessor)||JSON.stringify([...governance.exact_v13_relations].sort())!==JSON.stringify(final)||governance.canonical_facts_schema_mutation!==false||governance.hardcoded_35_minute_budget_authorized!==false||governance.physical_visibility_uses_post_commit_db_readback!==true||governance.production_effect!==false)throw new Error('V13_FOUNDATION_GOVERNANCE_PASS_REQUIRED');
          if(runtime.status!=='PASS'||runtime.acceptance_mode!=='REAL_POSTGRESQL_V13_AUTONOMOUS_FORCING_FOUNDATION')throw new Error('V13_FOUNDATION_RUNTIME_PASS_REQUIRED');
          for(const key of ['producer_cursor_continuity_verified','producer_cursor_leads_runtime_consumption_by_required_base','exact_predecessor_base_continuity_verified','forcing_base_claim_lease_fencing_verified','duplicate_wake_idempotency_verified','stale_fencing_token_rejected','missed_causal_deadline_terminalized_before_runtime_claim','post_commit_fresh_transaction_fact_readback_verified','db_clock_post_commit_visibility_attested_before_base','payload_time_travel_rejected_by_physical_visibility','end_to_end_budget_requires_controlled_delay_matrix'])if(runtime[key]!==true)throw new Error(`V13_FOUNDATION_MACHINE_PROOF_MISSING:${key}`);
          if(runtime.hardcoded_35_minute_budget_authorized!==false||runtime.production_workflow_wiring_changed!==false||runtime.formal_v4_mutation_performed!==false||runtime.mcft_cap09_completed!==false)throw new Error('V13_FOUNDATION_NONCLAIM_REGRESSION');

      - name: Upload immutable foundation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-v13-autonomous-forcing-foundation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_V13_AUTONOMOUS_FORCING_FOUNDATION_GOVERNANCE.json
            acceptance-output/MCFT_CAP_09_V13_AUTONOMOUS_FORCING_FOUNDATION_RESULT.json
          if-no-files-found: error
          retention-days: 90

      - name: Seal unsigned exact-source ${{ github.event.pull_request.head.sha }} receipt for V13_AUTONOMOUS_FORCING_FOUNDATION
        if: success()
        env:
          MCFT_CAP09_EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
          MCFT_CAP09_EXACT_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/governance_acceptance/MCFT_CAP09_STAGE3_COMPOSER_SIX_NATIVE_SOURCE_RECEIPT_V2.cjs --check-id=V13_AUTONOMOUS_FORCING_FOUNDATION --out=acceptance-output/MCFT_CAP09_STAGE3_SIX_NATIVE_V13_AUTONOMOUS_FORCING_FOUNDATION_RECEIPT_V2.json
      - name: Upload unsigned exact-source V13_AUTONOMOUS_FORCING_FOUNDATION evidence only after original job success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cap09-stage3-six-V13_AUTONOMOUS_FORCING_FOUNDATION-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/MCFT_CAP09_STAGE3_SIX_NATIVE_V13_AUTONOMOUS_FORCING_FOUNDATION_RECEIPT_V2.json
          if-no-files-found: error
          retention-days: 90


  successor-holistic-v13-schema:
    env:
      NODE_VERSION: '20.11.1'
      PNPM_VERSION: '9.15.4'
      EXACT_PREDECESSOR_SHA: '26c1383f7f45abb76c99e28ec3d06714e85d1b2c'
      CURRENT_SUCCESSOR_BASE_SHA: 'd054b334b3e74f3356b5d02498da9ba845eccdfb'
      SUCCESSOR_REQUALIFICATION_BASE_SHA: '46c9c7b6b59c113848fc69daff88fb183fccc954'
      POST_MERGE_V13_BASE_SHA: 'fa6e260d8cdec4a82403a86f1c7b3d5420e44ef8'
      PRODUCER_QUALIFICATION_BASE_SHA: '46367333d228a2b90a86ff6a33aebc334f3d73a2'
      SCHEMA_QUALIFICATION_CONSISTENCY_REPAIR_BASE_SHA: '252c9ebf5bfe43a31a405ee1b854b25e50d1ad72'
      DATABASE_URL: 'postgres://postgres:postgres@127.0.0.1:5432/mcft_cap09_v13_holistic_schema'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcft_cap09_v13_holistic_schema
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mcft_cap09_v13_holistic_schema"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Require exact predecessor and zero production wake
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            if [ "$base" != "$EXACT_PREDECESSOR_SHA" ] && [ "$base" != "$SUCCESSOR_REQUALIFICATION_BASE_SHA" ] && [ "$base" != "$POST_MERGE_V13_BASE_SHA" ] && [ "$base" != "$PRODUCER_QUALIFICATION_BASE_SHA" ] && [ "$base" != "$SCHEMA_QUALIFICATION_CONSISTENCY_REPAIR_BASE_SHA"  && [ "$base" != "$CURRENT_SUCCESSOR_BASE_SHA" ]]; then
              echo "V13_HOLISTIC_SCHEMA_UNGOVERNED_BASE:${base}" >&2
              exit 1
            fi
          fi
          trigger_block="$(awk '/^on:/{capture=1} /^permissions:/{capture=0} capture{print}' .github/workflows/mcft-cap-09-v13-holistic-schema-postgres.yml)"
          ! grep -Eq '^  schedule:|^  workflow_dispatch:' <<<"$trigger_block"
          test -z "${GEOX_MCFT_CAP09_T4R1_S6_DATABASE_URL:-}"

      - name: Typecheck holistic schema acceptance
        run: >-
          pnpm exec tsc --noEmit --pretty false --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext --esModuleInterop --types node
          scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_V13_HOLISTIC_SCHEMA_POSTGRES.ts

      - name: Run real PostgreSQL holistic v13 schema acceptance
        env:
          MCFT_CAP09_V13_HOLISTIC_SCHEMA_DESTRUCTIVE_ACCEPTANCE: '1'
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_V13_HOLISTIC_SCHEMA_POSTGRES.ts

      - name: Validate holistic schema machine proof
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_V13_HOLISTIC_SCHEMA_POSTGRES_RESULT.json','utf8'));
          if(p.status!=='PASS')throw new Error('V13_HOLISTIC_SCHEMA_NOT_PASS');
          if(p.predecessor_public_table_count!==26||p.v13_required_public_table_count!==29||p.operational_table_delta!==3)throw new Error('V13_HOLISTIC_SCHEMA_CARDINALITY_WRONG');
          const expected=['twin_external_formal_forcing_base_cursor_v1','twin_external_formal_forcing_base_target_v1','twin_external_formal_forcing_controller_lease_v1'].sort();
          if(JSON.stringify([...p.exact_new_operational_relations].sort())!==JSON.stringify(expected))throw new Error('V13_HOLISTIC_SCHEMA_RELATION_SET_WRONG');
          const predecessor=[
            'facts','twin_action_feedback_cycle_projection_v1','twin_action_feedback_evidence_index_v1','twin_action_feedback_projection_v1',
            'twin_active_lineage_index_v1','twin_approved_plan_binding_projection_v1','twin_decision_record_projection_v1',
            'twin_forecast_point_projection_v1','twin_forecast_residual_projection_v1','twin_forecast_result_latest_index_v1',
            'twin_forecast_run_projection_v1','twin_forecast_success_latest_index_v1','twin_object_idempotency_index_v1',
            'twin_runtime_authority_snapshot_v1','twin_runtime_checkpoint_latest_index_v1','twin_runtime_health_latest_index_v1',
            'twin_runtime_lease_v1','twin_scenario_latest_index_v1','twin_scenario_point_projection_v1','twin_scenario_set_projection_v1',
            'twin_scenario_set_uniqueness_v1','twin_shadow_online_scheduler_cursor_v1','twin_shadow_online_scheduler_slot_v1',
            'twin_state_history_projection_v1','twin_state_latest_index_v1','twin_terminal_tick_uniqueness_v1'
          ].sort();
          const final=[...predecessor,...expected].sort();
          if(JSON.stringify([...p.predecessor_public_tables].sort())!==JSON.stringify(predecessor))throw new Error('V13_HOLISTIC_SCHEMA_EXACT_PREDECESSOR_SET_WRONG');
          if(JSON.stringify([...p.v13_public_tables].sort())!==JSON.stringify(final))throw new Error('V13_HOLISTIC_SCHEMA_EXACT_FINAL_SET_WRONG');
          for(const key of ['canonical_facts_schema_unchanged','all_new_relations_zero_state','columns_observed_from_pg_catalog','constraints_observed_from_pg_catalog','indexes_observed_from_pg_indexes','exact_head_fingerprint_candidate_generated'])if(p[key]!==true)throw new Error(`V13_HOLISTIC_SCHEMA_PROOF_MISSING:${key}`);
          for(const key of ['v13_column_fingerprint_md5','v13_constraint_fingerprint_md5','v13_index_fingerprint_md5'])if(!/^[0-9a-f]{32}$/.test(String(p[key]||'')))throw new Error(`V13_HOLISTIC_SCHEMA_FINGERPRINT_INVALID:${key}`);
          if(p.production_workflow_effect!==false||p.formal_v4_mutation_performed!==false||p.mcft_cap09_completed!==false)throw new Error('V13_HOLISTIC_SCHEMA_NONCLAIM_REGRESSION');

      - name: Upload holistic schema proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-v13-holistic-schema-${{ github.event.pull_request.head.sha || github.sha }}
          path: acceptance-output/MCFT_CAP_09_V13_HOLISTIC_SCHEMA_POSTGRES_RESULT.json
          if-no-files-found: error
          retention-days: 90

      - name: Seal unsigned exact-source ${{ github.event.pull_request.head.sha }} receipt for V13_HOLISTIC_SCHEMA
        if: success()
        env:
          MCFT_CAP09_EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
          MCFT_CAP09_EXACT_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/governance_acceptance/MCFT_CAP09_STAGE3_COMPOSER_SIX_NATIVE_SOURCE_RECEIPT_V2.cjs --check-id=V13_HOLISTIC_SCHEMA --out=acceptance-output/MCFT_CAP09_STAGE3_SIX_NATIVE_V13_HOLISTIC_SCHEMA_RECEIPT_V2.json
      - name: Upload unsigned exact-source V13_HOLISTIC_SCHEMA evidence only after original job success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cap09-stage3-six-V13_HOLISTIC_SCHEMA-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/MCFT_CAP09_STAGE3_SIX_NATIVE_V13_HOLISTIC_SCHEMA_RECEIPT_V2.json
          if-no-files-found: error
          retention-days: 90



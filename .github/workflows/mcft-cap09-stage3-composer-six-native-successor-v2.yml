        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PHASE7_CANDIDATE_PROMOTION_COMPOSITION_V1.ts

      - name: Validate composition machine proof
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_PHASE7_CANDIDATE_PROMOTION_COMPOSITION_V1_RESULT.json','utf8'));
          if(p.status!=='PASS')throw new Error('PHASE7_CANDIDATE_PROMOTION_COMPOSITION_NOT_PASS');
          if(p.subject_sha!=='${{ github.event.pull_request.head.sha || github.sha }}')throw new Error('PHASE7_COMPOSITION_SUBJECT_MISMATCH');
          for(const key of [
            'candidate_manifest_private_readback',
            'replay_authority_fields_complete',
            'rehydration_semantic_manifest_exact_match',
            'real_postgres_fenced_promotion',
            'exact_three_facts_single_fenced_transaction',
            'promotion_did_not_advance_cursor',
            'controller_attestation_after_promotion',
            'cursor_advanced_only_after_attestation',
            'pre_mutation_failure_fails_closed'
          ]) if(p[key]!==true)throw new Error('PHASE7_COMPOSITION_PROOF_MISSING:'+key);
          if(
            p.capture_raw_object_count!==2
            ||p.candidate_semantic_record_count!==3
            ||p.promotion_provider_refetch_count!==0
            ||p.promotion_github_artifact_rehydration_count!==0
            ||p.promotion_raw_store_write_count!==0
            ||p.real_postgres_formal_fact_present_count!==3
            ||p.capture_formal_database_write_count!==0
          )throw new Error('PHASE7_COMPOSITION_COUNT_OR_BOUNDARY_REGRESSION');
          if(
            p.production_process_graph_wiring!==false
            ||p.production_owner_activation!==false
            ||p.formal_v5_store_provisioned!==false
            ||p.formal_v5_epoch_selected!==false
            ||p.formal_v5_armed!==false
            ||p.o00_started!==false
            ||p.protected_main_mutated!==false
            ||p.mcft_cap09_completed!==false
          )throw new Error('PHASE7_COMPOSITION_NONCLAIM_REGRESSION');

      - name: Stop isolated private object store
        if: always()
        run: docker rm -f mcft-cap09-phase7-composition-minio >/dev/null 2>&1 || true

      - name: Upload Phase7 candidate/promotion composition proof

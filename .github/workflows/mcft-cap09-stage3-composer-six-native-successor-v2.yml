  successor-ea5c1-durable-raw-restricted-ingress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ea5c1
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ea5c1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Exact PR subject and no external execution authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.base.sha }}" = "$(node -p "require('./docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP09-STAGE3-PYTHON-COMPOSER-SIX-CHECK-SUCCESSOR-V2.json').main_at_contract_draft")"
          test -z "${MCFT_GOVERNED_RETRY_TICKET:-}"
          test -z "${MCFT_GOVERNED_RETRY_STAGE:-}"
          test -z "${MCFT_CAP09_ADOPTION_REQUEST:-}"
          test -z "${GEOX_MCFT_CAP09_FORMAL_V5_DATABASE_URL:-}"
          test -z "${GEOX_MCFT_CAP09_T4R1_S6_DATABASE_URL:-}"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1 # Lockfile native better-sqlite3 ABI; Windows Node 24 host rehearsal is a separate later gate
          cache: pnpm

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.2'
          cache: false

      - name: Resolve exact EA5C1 base
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_sha=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install exact repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax-check EA5C1 governance gate
        run: node --check scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5C1_DURABLE_RAW_RESTRICTED_INGRESS.cjs

      - name: Independently pin unchanged EA5C1 source under NEW Composer successor; refuse old signed evidence
        run: node scripts/governance_acceptance/MCFT_CAP09_STAGE3_COMPOSER_SIX_NATIVE_SOURCE_RECEIPT_V2.cjs --ea5c1-scope --out=acceptance-output/MCFT_CAP09_STAGE3_EA5C1_SOURCE_SCOPE_V2.json

      - name: Re-prove CAP08 G3 frozen-core successor compatibility
        # Successor G3 mode compares every frozen-core blob directly to the accepted G3 merge.
        # Bind BASE to the exact subject so unrelated stacked-diff whitespace cannot mask that check.
        env:
          MCFT_BASE_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S2_G3_BOUNDARY.cjs

      - name: Start private S3-compatible raw store
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/ea5c1-minio-bin"
          data="$RUNNER_TEMP/ea5c1-minio-data"
          mkdir -p "$bin" "$data"

          GOBIN="$bin" go install github.com/minio/minio@RELEASE.2025-09-07T16-13-09Z
          GOBIN="$bin" go install github.com/minio/mc@RELEASE.2025-08-13T08-35-41Z

          MINIO_ROOT_USER=minioadmin \
          MINIO_ROOT_PASSWORD=minioadmin123 \
            "$bin/minio" server "$data" >"$RUNNER_TEMP/ea5c1-minio.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/ea5c1-minio.pid"

          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then break; fi
            if [ "$attempt" = 90 ]; then
              cat "$RUNNER_TEMP/ea5c1-minio.log"
              exit 1
            fi
            sleep 1
          done

          "$bin/mc" alias set local http://127.0.0.1:9000 minioadmin minioadmin123
          "$bin/mc" mb --ignore-existing local/geox-mcft-cap09-formal-raw-v1
          "$bin/mc" anonymous set private local/geox-mcft-cap09-formal-raw-v1
          "$bin/mc" stat local/geox-mcft-cap09-formal-raw-v1

      - name: Typecheck server
        shell: bash
        run: |
          set -o pipefail
          mkdir -p acceptance-output
          pnpm --filter @geox/server run typecheck 2>&1 | tee acceptance-output/EA5C1_SERVER_TYPECHECK.log

      - name: Prove durable raw retention and restricted canonical Evidence ingress
        shell: bash
        env:
          EA5C1_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/ea5c1
          EA5C1_S3_ENDPOINT: http://127.0.0.1:9000
          EA5C1_S3_BUCKET: geox-mcft-cap09-formal-raw-v1
          EA5C1_S3_ACCESS_KEY: minioadmin
          EA5C1_S3_SECRET_KEY: minioadmin123
          EA5C1_EXACT_HISTORICAL_BASE: b9e212f98dd1d0c1e8fff5e9f93f369167e6f065
          EA5C1_CURRENT_BASE: ${{ steps.authority.outputs.base_sha }}
        run: |
          set -euo pipefail
          if [ "$EA5C1_CURRENT_BASE" = "$EA5C1_EXACT_HISTORICAL_BASE" ]; then
            pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5C1_DURABLE_RAW_RESTRICTED_INGRESS.ts \
              2>&1 | tee acceptance-output/EA5C1_FOCUSED_ACCEPTANCE.log
          else
            pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5C1_SUCCESSOR_REPLAY_COMPLETE_INGRESS_V1.ts \
              2>&1 | tee acceptance-output/EA5C1_FOCUSED_ACCEPTANCE.log
            pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5C1_DURABLE_RAW_RESTRICTED_INGRESS.ts \
              2>&1 | tee acceptance-output/EA5C1_REAL_CLOCK_P0_RETENTION_REUSE.log
          fi

      - name: Re-prove EA3 retention-before-decode collector boundary
        env:
          MCFT_SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA3_EXTERNAL_COLLECTOR_CANONICALIZER.ts

      - name: Re-prove EA5B5C persistence-free production orchestration
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5B5C_EXTERNAL_CAP04_ORCHESTRATION.ts

      - name: Verify raw bucket stays private
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/ea5c1-anon-body -w '%{http_code}' http://127.0.0.1:9000/geox-mcft-cap09-formal-raw-v1/ || true)"
          test "$status" = "403"

      - name: Stop private S3-compatible raw store
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/ea5c1-minio.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/ea5c1-minio.pid")" || true
          fi

      - name: Verify EA5C1 remains implementation qualification only
        shell: node {0}
        run: |
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP09_STAGE3_EA5C1_SOURCE_SCOPE_V2.json','utf8'));
          if (r.status !== 'PASS_NEW_COMPOSER_EA5C1_ADOPTED_SOURCE_SCOPE_ONLY') throw new Error('EA5C1_SUCCESSOR_SCOPE_PASS_REQUIRED');
          if (r.current_ea5c1_source_preserved_against_adopted_main !== true || r.historical_ea5c1_predecessor_only_gate_purposely_not_promoted !== true) throw new Error('EA5C1_SEMANTIC_SUCCESSOR_SCOPE_NOT_PROVEN');
          if (r.historical_authority_requalified !== false || r.production_authorized !== false || r.permit_signed !== false || r.permit_consumed !== false) throw new Error('EA5C1_PREMATURE_SUCCESSOR_EFFECT');
          if (r.production_write_performed !== false || r.provider_calls !== 0 || r.third_attempt_authorized !== false) throw new Error('EA5C1_NONCLAIM_REQUIRED');
          if (r.legacy_old_composer_contract_reused !== false || r.old_six_signatures_reused !== false || r.permit !== false) throw new Error('EA5C1_OLD_SOURCE_OR_PERMIT_REUSE');
          console.log(JSON.stringify({status:'PASS_NEW_COMPOSER_SCOPE_WITH_NATIVE_EA5C1_PG_S3_JOB_ONLY',ea5c1:true,old_signatures_valid:false,formal_neon_write:false,permit:false,cap09:false}));

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap-09-ea5c1-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: |
            acceptance-output/MCFT_CAP09_STAGE3_EA5C1_SOURCE_SCOPE_V2.json
            acceptance-output/MCFT_CAP_08_S2_G3_BOUNDARY_RESULT.json
            acceptance-output/EA5C1_SERVER_TYPECHECK.log
            acceptance-output/EA5C1_FOCUSED_ACCEPTANCE.log
            acceptance-output/EA5C1_REAL_CLOCK_P0_RETENTION_REUSE.log
          if-no-files-found: warn
          retention-days: 90

      - name: Seal unsigned exact-source ${{ github.event.pull_request.head.sha }} receipt for EA5C1_DURABLE_RAW_RESTRICTED_INGRESS
        if: success()
        env:
          MCFT_CAP09_EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
          MCFT_CAP09_EXACT_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/governance_acceptance/MCFT_CAP09_STAGE3_COMPOSER_SIX_NATIVE_SOURCE_RECEIPT_V2.cjs --check-id=EA5C1_DURABLE_RAW_RESTRICTED_INGRESS --out=acceptance-output/MCFT_CAP09_STAGE3_SIX_NATIVE_EA5C1_DURABLE_RAW_RESTRICTED_INGRESS_RECEIPT_V2.json
      - name: Upload unsigned exact-source EA5C1_DURABLE_RAW_RESTRICTED_INGRESS evidence only after original job success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cap09-stage3-six-EA5C1_DURABLE_RAW_RESTRICTED_INGRESS-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/MCFT_CAP09_STAGE3_SIX_NATIVE_EA5C1_DURABLE_RAW_RESTRICTED_INGRESS_RECEIPT_V2.json
          if-no-files-found: error
          retention-days: 90



name: tmp-mcft-cap09-et0-determinism-patch

on:
  push:
    branches: ['fix/mcft-cap09-et0-deterministic-canonicalization']
    paths:
      - '.github/workflows/_tmp-mcft-cap09-et0-determinism-patch.yml'
      - 'scripts/runtime_acceptance/_tmp_patch_mcft_cap09_et0_determinism.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mcft-cap09-et0-deterministic-canonicalization
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
          cache: pnpm
      - name: Apply exact patch
        run: python scripts/runtime_acceptance/_tmp_patch_mcft_cap09_et0_determinism.py
      - name: Install and validate focused patch
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @geox/server run typecheck
          pnpm exec tsc --noEmit --pretty false --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext --esModuleInterop --types node \
            apps/server/src/external_evidence/mcft_cap09_external_collector_canonicalizer_v1.ts \
            scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_ET0_CANONICAL_NUMERIC_STABILITY_V1.ts
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_ET0_CANONICAL_NUMERIC_STABILITY_V1.ts
          pnpm exec tsx scripts/runtime_acceptance/RUN_MCFT_CAP_09_ROLLING_PREBOUNDARY_REHYDRATION_V1.ts selftest
          git diff --check
      - name: Commit only validated production changes
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')" = 3
          grep -Fxq 'apps/server/src/external_evidence/mcft_cap09_external_collector_canonicalizer_v1.ts' <<<"$changed"
          grep -Fxq '.github/workflows/mcft-cap-09-rolling-preboundary-capture.yml' <<<"$changed"
          grep -Fxq '.github/workflows/mcft-cap-09-amendment19-persistent-24t-qualification.yml' <<<"$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/server/src/external_evidence/mcft_cap09_external_collector_canonicalizer_v1.ts \
            .github/workflows/mcft-cap-09-rolling-preboundary-capture.yml \
            .github/workflows/mcft-cap-09-amendment19-persistent-24t-qualification.yml
          git commit -m 'fix(mcft-cap09): stabilize ET0 canonical numeric identity'
          git push origin HEAD:fix/mcft-cap09-et0-deterministic-canonicalization

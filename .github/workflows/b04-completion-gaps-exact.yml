name: b04-completion-gaps-exact

on:
  push:
    branches:
      - ci/bline-b04-completion-gaps-exact-2026-08-27

jobs:
  exact-head:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: geox
          POSTGRES_PASSWORD: geox
          POSTGRES_DB: geox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geox -d geox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://geox:geox@127.0.0.1:5432/geox
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Build runtime workspace dependencies
        run: |
          pnpm --filter @geox/contracts build
          pnpm --filter @geox/device-skills build
          pnpm --filter @geox/skill-registry build
      - name: Server typecheck
        run: pnpm --filter @geox/server typecheck
      - name: B-02 semantic governance
        run: node scripts/governance_acceptance/ACCEPTANCE_B02_SEMANTIC_CONTRACT_LINTER_V1.cjs
      - name: B-03 missing stale spatial contract fixtures
        run: node --import tsx --test apps/server/src/contracts/canonical_evidence_v1.contract.test.ts
      - name: B-04 physical mandatory fixtures
        run: node --import tsx --test apps/server/src/evidence/physical_qc_v1.test.ts
      - name: B-04 canonical temporal source spatial fixtures
        run: node --import tsx --test apps/server/src/evidence/raw_sample_evidence_qualification_projection_v1.test.ts
      - name: B-04 sensing consumption guard
        run: node --import tsx --test apps/server/src/evidence/stage1_physical_qc_consumption_guard_v1.test.ts
      - name: B-04 Apple-II canonical regressions
        run: |
          node --import tsx --test apps/server/src/domain/sensing/raw_sample_authority_time_scope_v1.test.ts
          node --import tsx --test apps/server/src/domain/sensing/appleii_canonical_evidence_projection_v1.test.ts
          node --import tsx --test apps/server/src/domain/sensing/appleii_evidence_physical_qc_v1.test.ts
          node --import tsx --test apps/server/src/domain/decision/stage1_canonical_evidence_shadow_visibility_v1.test.ts
      - name: B-04e missing and one-invalid-does-not-block fixtures
        run: node --import tsx --test apps/server/src/domain/judge/evidence_judge_canonical_sufficiency_shadow_v1.test.ts
      - name: Real PostgreSQL stale spatial missing proof
        shell: bash
        run: |
          cat > .b04_completion_pg.ts <<'TS'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          import { Pool } from "pg";
          import { appendRawSampleV1 } from "./apps/server/src/domain/sensing/raw_sample_fact_envelope_v1.ts";
          import { buildCanonicalRawSampleEvidenceQualificationProjectionV1 } from "./apps/server/src/domain/sensing/appleii_evidence_sufficiency_v1.ts";
          import { evaluateEvidenceJudgeCanonicalSufficiencyShadowV1 } from "./apps/server/src/domain/judge/evidence_judge_v2.ts";

          async function main() {
            const pool = new Pool({ connectionString: process.env.DATABASE_URL });
            try {
              await pool.query(fs.readFileSync("docker/postgres/init/001_schema.sql", "utf8"));
              await pool.query(fs.readFileSync("apps/server/db/migrations/2026_04_16_bootstrap_alignment.sql", "utf8"));
              await pool.query(fs.readFileSync("apps/server/db/migrations/2026_05_15_fact_envelope_v1.sql", "utf8"));

              const baseNow = Date.now();
              await appendRawSampleV1(
                pool,
                {
                  sample_id: "rs_b04_fresh",
                  sensor_id: "dev_b04_completion",
                  field_id: "fieldA",
                  ts_ms: baseNow - 30 * 60_000,
                  metric: "soil_moisture",
                  value: 22,
                  unit: "%VWC",
                  qc_quality: "ok",
                  source: "device",
                  payload: {},
                },
                { tenant_id: "tenantA", project_id: "projectA", group_id: "groupA" },
              );
              await appendRawSampleV1(
                pool,
                {
                  sample_id: "rs_b04_stale",
                  sensor_id: "dev_b04_completion",
                  field_id: "fieldA",
                  ts_ms: baseNow - 2 * 60 * 60_000,
                  metric: "soil_moisture",
                  value: 23,
                  unit: "%VWC",
                  qc_quality: "ok",
                  source: "device",
                  payload: {},
                },
                { tenant_id: "tenantA", project_id: "projectA", group_id: "groupA" },
              );

              const nowMs = Date.now() + 1_000;
              const exact = await buildCanonicalRawSampleEvidenceQualificationProjectionV1(pool, {
                tenant_id: "tenantA",
                project_id: "projectA",
                group_id: "groupA",
                field_id: "fieldA",
                device_id: "dev_b04_completion",
                now_ms: nowMs,
                freshness_max_age_ms: 60 * 60_000,
              });
              const byRef = new Map(exact.qualifications.map((q) => [q.source_ref, q]));
              const fresh = byRef.get("raw_sample:rs_b04_fresh");
              const stale = byRef.get("raw_sample:rs_b04_stale");

              assert.equal(fresh?.temporal_eligibility, "ELIGIBLE");
              assert.equal(fresh?.evidence_authority, "QUALIFIED");
              assert.equal(stale?.temporal_eligibility, "STALE");
              assert.equal(stale?.evidence_authority, "INELIGIBLE");
              assert.equal(stale?.role_eligibility?.[0]?.eligibility, "INELIGIBLE");

              const spatial = await buildCanonicalRawSampleEvidenceQualificationProjectionV1(pool, {
                tenant_id: "tenantA",
                project_id: null,
                group_id: "groupA",
                field_id: "fieldA",
                device_id: "dev_b04_completion",
                now_ms: nowMs,
                freshness_max_age_ms: 60 * 60_000,
              });
              const spatialFresh = spatial.qualifications.find((q) => q.source_ref === "raw_sample:rs_b04_fresh");
              assert.equal(spatialFresh?.spatial_authority, "LIMITED");
              assert.equal(spatialFresh?.evidence_authority, "LIMITED");
              assert.equal(spatialFresh?.role_eligibility?.[0]?.eligibility, "LIMITED");

              const missingBatch = await buildCanonicalRawSampleEvidenceQualificationProjectionV1(pool, {
                tenant_id: "tenantA",
                project_id: "projectA",
                group_id: "groupA",
                field_id: "fieldA",
                device_id: "dev_missing_b04",
                now_ms: nowMs,
                freshness_max_age_ms: 60 * 60_000,
              });
              assert.equal(missingBatch.qualifications.length, 0);
              const missing = evaluateEvidenceJudgeCanonicalSufficiencyShadowV1(missingBatch);
              assert.equal(missing.status, "NEEDS_EVIDENCE");
              assert.deepEqual(missing.reason_codes, ["NO_CANONICAL_EVIDENCE_QUALIFICATIONS"]);

              console.log("B04_PG_FRESH_TEMPORAL", fresh?.temporal_eligibility);
              console.log("B04_PG_STALE_TEMPORAL", stale?.temporal_eligibility);
              console.log("B04_PG_SPATIAL", spatialFresh?.spatial_authority);
              console.log("B04_PG_MISSING_STATUS", missing.status);
              console.log("B04_PG_COMPLETION_GAPS_PASS");
            } finally {
              await pool.end();
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          TS
          pnpm -w exec tsx .b04_completion_pg.ts
          rm -f .b04_completion_pg.ts
      - name: Server build
        run: pnpm --filter @geox/server build
      - name: Marker
        run: |
          echo "B04_COMPLETION_EXACT_HEAD 140e8f106cb9274f8c8f3150b9fbff2defb5fcf1"
          echo "B04_COMPLETION_GAPS_EXACT_PASS"

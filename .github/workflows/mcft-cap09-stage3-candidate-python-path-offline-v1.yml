name: mcft-cap09-stage3-candidate-python-path-offline-v1
on:
  pull_request:
    paths:
      - 'scripts/runtime_acceptance/MCFT_CAP_09_V13_ISOLATED_PRODUCER_COMPOSITION_V1.ts'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP09_STAGE3_CANDIDATE_PYTHON_PATH_OFFLINE_V1.ts'
      - '.github/workflows/mcft-cap09-stage3-candidate-python-path-offline-v1.yml'
      - 'scripts/runtime_acceptance/MCFT_CAP09_STAGE3_PRESERVED_CANDIDATE_REHYDRATION_OFFLINE_V1.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-candidate-python-path-no-io:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate without persistent credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: pnpm
      - name: Strict offline execution boundary
        run: |
          set -eu
          test -z "${DATABASE_URL:-}"
          test -z "${PHASE7_PRIVATE_S3_ENDPOINT:-}"
          test -z "${MCFT_GOVERNED_RETRY_TICKET:-}"
          test -z "${MCFT_CAP09_ADOPTION_REQUEST:-}"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compile offline candidate replay source and exact composition
        run: |
          pnpm exec tsc --noEmit --pretty false --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext --esModuleInterop --types node \
            scripts/runtime_acceptance/MCFT_CAP09_STAGE3_PRESERVED_CANDIDATE_REHYDRATION_OFFLINE_V1.ts \
            scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP09_STAGE3_CANDIDATE_PYTHON_PATH_OFFLINE_V1.ts
      - name: Real isolated Composition GFS capture versus Candidate replay path
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP09_STAGE3_CANDIDATE_PYTHON_PATH_OFFLINE_V1.ts

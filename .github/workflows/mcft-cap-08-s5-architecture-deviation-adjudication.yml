name: mcft-cap-08-s5-architecture-deviation-adjudication

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-08-s5-architecture-deviation-adjudication.yml'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S5-ARCHITECTURE-DEVIATION-ADJUDICATION-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S5-ARCHITECTURE-DEVIATION-STATUS-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S5_ARCHITECTURE_DEVIATION_ADJUDICATION.cjs'

permissions:
  contents: read

jobs:
  adjudication:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate owned lifecycle
        env:
          MCFT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff --name-only "$MCFT_BASE_SHA"...HEAD)"
          if grep -Eq 'S5-EFFECTIVENESS-AUTHORITY|s5-effectiveness-settlement|S5_EFFECTIVENESS_SETTLEMENT' <<<"$files"; then
            node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S5_EFFECTIVENESS_SETTLEMENT.cjs
          else
            node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S5_ARCHITECTURE_DEVIATION_ADJUDICATION.cjs
          fi
      - name: Confirm no candidate Runtime Registry or status mutation
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          test -z "$(git diff --name-only "$base"...HEAD -- apps db migrations docs/digital_twin/mcft/MCFT-CANDIDATE-AUTHORITY-REGISTRY-V1.json docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S5-DELIVERY-STATUS-V1.json docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-DELIVERY-STATUS-V1.json)"

name: mcft-cap-08-s5-architecture-deviation-adjudication

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-08-current-frontier-reconciliation.yml'
      - '.github/workflows/mcft-cap-08-s5-architecture-deviation-adjudication.yml'
      - 'docs/digital_twin/GEOX-DT-02-MCFT-IMPLEMENTATION-MAP-V2.md'
      - 'docs/digital_twin/GEOX-MCFT-VERTICAL-CAPABILITY-LINE-MATRIX-V2.json'
      - 'docs/digital_twin/mcft/GEOX-MCFT-SSOT-CURRENT-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-CURRENT-FRONTIER-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S5-ARCHITECTURE-DEVIATION-ADJUDICATION-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S5-ARCHITECTURE-DEVIATION-STATUS-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S5-REPLAY-DATASET-V2-PREQUALIFICATION-CONTRACT-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S5-REPLAY-DATASET-V2-WORKFLOW-DECLARATION-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S5_ARCHITECTURE_DEVIATION_ADJUDICATION.cjs'

permissions:
  contents: read

concurrency:
  group: mcft-cap08-s5-architecture-deviation-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  adjudication:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate frozen eleven-file governance boundary
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S5_ARCHITECTURE_DEVIATION_ADJUDICATION.cjs
      - name: Confirm no Candidate Declaration Runtime or Registry mutation
        shell: bash
        run: |
          set -euo pipefail
          base=6838bf07a96022640bea6ddb20e461f748a5114c
          test -z "$(git diff --name-only "$base"...HEAD -- apps db migrations docs/governance/DELIVERY-CANDIDATE-REGISTRY-V1.json docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S5-DELIVERY-STATUS-V1.json docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-DELIVERY-STATUS-V1.json)"
          ! git diff --name-only "$base"...HEAD | grep -q 'CANDIDATE-DECLARATION'

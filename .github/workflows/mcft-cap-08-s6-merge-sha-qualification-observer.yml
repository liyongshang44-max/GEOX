          const authority = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log(`MCFT_CAP08_DEVELOPMENT_AUTHORITY_PATH=${process.argv[2]}`);
          console.log(`MCFT_CAP08_RUN_LABEL=${authority.authorized_run_label}`);
          console.log(`MCFT_CAP08_REHEARSAL_RUN_LABEL=${authority.rehearsal_run_label}`);
          console.log(`MCFT_CAP08_OPERATIONAL_RUN_INSTANCE_ID=${authority.operational_run_instance_id}`);
          console.log('MCFT_CAP08_NORMALIZED_EXECUTION_AUTHORITY=acceptance-output/run-dev-b/NORMALIZED_DEVELOPMENT_AUTHORITY.json');
          NODE
      - name: Gate non-formal development authority
        env:
          MCFT_CAP08_EXACT_SUBJECT_SHA: ${{ needs.prepare-development-authorities.outputs.exact_subject_sha }}
        run: node scripts/runtime_acceptance/mcft_cap08_s6_single_run_workflow/development_rehearsal_authority_gate_v1.cjs
      - name: Prepare exact disposable database identity and role credentials
        env:
          MCFT_CAP08_EXACT_SUBJECT_SHA: ${{ needs.prepare-development-authorities.outputs.exact_subject_sha }}
        shell: bash
        run: |
          node scripts/runtime_acceptance/mcft_cap08_s6_single_run_workflow/database_identity_v1.cjs
          echo "MCFT_CAP08_RUNNER_PASSWORD=cap08-s6-merge-sha-b-runner-${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "MCFT_CAP08_MIGRATOR_PASSWORD=cap08-s6-merge-sha-b-migrator-${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "MCFT_CAP08_LEGACY_RUNTIME_PASSWORD=cap08-s6-merge-sha-b-legacy-${{ github.run_id }}" >> "$GITHUB_ENV"
      - name: Bootstrap fresh PostgreSQL B with exact migrations, roles, ACL and seed facts
        env:

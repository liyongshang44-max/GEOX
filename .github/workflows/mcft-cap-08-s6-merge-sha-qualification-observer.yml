          name: mcft-cap-08-s6-development-rehearsal-comparator-${{ needs.prepare-development-authorities.outputs.exact_subject_sha }}
          path: acceptance-output/comparator-artifact
      - name: Independently qualify complete double-run rehearsal evidence
        env:
          MCFT_CAP08_RUN_DEV_A_QUALIFICATION: acceptance-output/run-dev-a-artifact/run-dev-a/RUN_QUALIFICATION_RESULT.json
          MCFT_CAP08_RUN_DEV_B_QUALIFICATION: acceptance-output/run-dev-b-artifact/run-dev-b/RUN_QUALIFICATION_RESULT.json
          MCFT_CAP08_RUN_DEV_A_RESTART: acceptance-output/run-dev-a-artifact/run-dev-a/RESTART_READBACK_RESULT.json
          MCFT_CAP08_RUN_DEV_B_RESTART: acceptance-output/run-dev-b-artifact/run-dev-b/RESTART_READBACK_RESULT.json
          MCFT_CAP08_RUN_DEV_A_DROP: acceptance-output/run-dev-a-artifact/run-dev-a/DROP_RESULT.json
          MCFT_CAP08_RUN_DEV_B_DROP: acceptance-output/run-dev-b-artifact/run-dev-b/DROP_RESULT.json
          MCFT_CAP08_DEVELOPMENT_COMPARATOR: acceptance-output/comparator-artifact/SEMANTIC_COMPARATOR_RESULT.json
          MCFT_CAP08_INTEGRATION_QUALIFICATION_OUTPUT: acceptance-output/integration-owner/INTEGRATION_QUALIFICATION_RESULT.json
        run: node scripts/runtime_acceptance/mcft_cap08_s6_single_run_workflow/integration_qualification_v1.cjs
      - name: Upload integration qualification owner artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap-08-s6-integration-qualification-${{ needs.prepare-development-authorities.outputs.exact_subject_sha }}
          path: acceptance-output/integration-owner/
          if-no-files-found: error
          retention-days: 180

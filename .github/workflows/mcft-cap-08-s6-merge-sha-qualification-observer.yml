          MCFT_CAP08_EXACT_SUBJECT_SHA: ${{ needs.prepare-development-authorities.outputs.exact_subject_sha }}
        shell: bash
        run: |
          export DATABASE_URL="postgres://geox_mcft_cap08_runner_v1:${MCFT_CAP08_RUNNER_PASSWORD}@127.0.0.1:5432/${MCFT_CAP08_DB_NAME}"
          export MCFT_CAP08_ADMIN_DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/${MCFT_CAP08_DB_NAME}"
          pnpm -w exec tsx scripts/runtime_acceptance/mcft_cap08_s6_single_run_workflow/workflow_entrypoint_v1.ts
      - name: Restart process and perform exact readback B
        env:
          MCFT_CAP08_EXACT_SUBJECT_SHA: ${{ needs.prepare-development-authorities.outputs.exact_subject_sha }}
          MCFT_CAP08_REHEARSAL_BUNDLE: acceptance-output/MCFT_CAP_08_S6_RUN_B_DEVELOPMENT_REHEARSAL_BUNDLE.json
          MCFT_CAP08_RESTART_READBACK_OUTPUT: acceptance-output/run-dev-b/RESTART_READBACK_RESULT.json
        shell: bash
        run: |
          export DATABASE_URL="postgres://geox_mcft_cap08_runner_v1:${MCFT_CAP08_RUNNER_PASSWORD}@127.0.0.1:5432/${MCFT_CAP08_DB_NAME}"
          export MCFT_CAP08_ADMIN_DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/${MCFT_CAP08_DB_NAME}"

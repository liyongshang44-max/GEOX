  integration-qualification-owner:
    name: integration-qualification-owner
    needs: [prepare-development-authorities, run-dev-a, run-dev-b, semantic-comparator-a-b]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact merged-main subject
        uses: actions/checkout@v4
        with:

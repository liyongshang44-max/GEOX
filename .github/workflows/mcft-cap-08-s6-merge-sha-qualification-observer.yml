    steps:
      - name: Checkout exact merged-main subject
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-development-authorities.outputs.exact_subject_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download RUN_DEV_B authority
        uses: actions/download-artifact@v4
        with:
          name: mcft-cap-08-s6-development-rehearsal-authorities-${{ needs.prepare-development-authorities.outputs.exact_subject_sha }}
          path: acceptance-output/authority-source
      - name: Bind RUN_DEV_B authority arguments
        shell: bash
        run: |

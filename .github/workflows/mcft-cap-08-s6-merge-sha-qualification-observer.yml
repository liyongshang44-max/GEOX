  semantic-comparator-a-b:
    name: semantic-comparator-a-b
    needs: [prepare-development-authorities, run-dev-a, run-dev-b]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact merged-main subject
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-development-authorities.outputs.exact_subject_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
      - name: Download RUN_DEV_A evidence
        uses: actions/download-artifact@v4
        with:
          name: mcft-cap-08-s6-run-dev-a-${{ needs.prepare-development-authorities.outputs.exact_subject_sha }}
          path: acceptance-output/run-dev-a-artifact
      - name: Download RUN_DEV_B evidence
        uses: actions/download-artifact@v4
        with:
          name: mcft-cap-08-s6-run-dev-b-${{ needs.prepare-development-authorities.outputs.exact_subject_sha }}
          path: acceptance-output/run-dev-b-artifact
      - name: Compare independent database semantics A/B
        env:
          MCFT_CAP08_RUN_DEV_A_BUNDLE: acceptance-output/run-dev-a-artifact/MCFT_CAP_08_S6_RUN_A_DEVELOPMENT_REHEARSAL_BUNDLE.json
          MCFT_CAP08_RUN_DEV_B_BUNDLE: acceptance-output/run-dev-b-artifact/MCFT_CAP_08_S6_RUN_B_DEVELOPMENT_REHEARSAL_BUNDLE.json

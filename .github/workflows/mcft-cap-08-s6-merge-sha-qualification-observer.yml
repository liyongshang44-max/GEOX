      - name: Qualify unified RUN_DEV_B regression matrix
        env:
          MCFT_CAP08_REHEARSAL_BUNDLE: acceptance-output/MCFT_CAP_08_S6_RUN_B_DEVELOPMENT_REHEARSAL_BUNDLE.json
          MCFT_CAP08_RESTART_READBACK_RESULT: acceptance-output/run-dev-b/RESTART_READBACK_RESULT.json

name: mcft-cap-08-s6-replacement-011-dispatch-observer

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-08-s6-replacement-011-dispatch-observer.yml'

permissions:
  contents: read
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_MAIN_SHA: 191e363e1fd9fa4c77c8b5135fb9673c3a9286d1
      BROKER_WORKFLOW: mcft-cap-08-s6-replacement-011-one-shot-dispatch-broker.yml
      FORMAL_WORKFLOW: mcft-cap-08-s6-single-run-database-execution.yml
    steps:
      - name: Observe broker and Formal RUN_A without dispatch permission
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance-output
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          target = os.environ['TARGET_MAIN_SHA']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'mcft-cap08-s6-dispatch-observer',
          }

          def recent(workflow, event):
              wf = urllib.parse.quote(workflow, safe='')
              url = f'https://api.github.com/repos/{repo}/actions/workflows/{wf}/runs?event={event}&per_page=20'
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  data = json.load(response)
              return [
                  {
                      'id': item['id'],
                      'name': item['name'],
                      'event': item['event'],
                      'status': item['status'],
                      'conclusion': item.get('conclusion'),
                      'head_sha': item['head_sha'],
                      'head_branch': item.get('head_branch'),
                      'run_number': item['run_number'],
                      'run_attempt': item['run_attempt'],
                      'created_at': item['created_at'],
                      'updated_at': item['updated_at'],
                      'html_url': item['html_url'],
                  }
                  for item in data.get('workflow_runs', [])
                  if item.get('head_sha') == target
              ]

          broker = []
          formal = []
          for _ in range(45):
              broker = recent(os.environ['BROKER_WORKFLOW'], 'push')
              formal = recent(os.environ['FORMAL_WORKFLOW'], 'workflow_dispatch')
              broker_terminal = broker and broker[0]['status'] == 'completed'
              if formal or broker_terminal:
                  break
              time.sleep(2)

          result = {
              'schema_version': 'geox_mcft_cap08_s6_replacement_011_dispatch_observer_v1',
              'target_main_sha': target,
              'broker_runs': broker,
              'formal_runs': formal,
              'formal_run_count': len(formal),
              'duplicate_formal_run_detected': len(formal) > 1,
              'observer_has_dispatch_permission': False,
          }
          with open('acceptance-output/MCFT_CAP_08_S6_REPLACEMENT_011_DISPATCH_OBSERVER.json', 'w', encoding='utf-8') as handle:
              json.dump(result, handle, indent=2)
              handle.write('\n')
          print(json.dumps(result, indent=2))
          PY

      - name: Upload dispatch observer evidence
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap-08-s6-replacement-011-dispatch-observer-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/MCFT_CAP_08_S6_REPLACEMENT_011_DISPATCH_OBSERVER.json
          if-no-files-found: error
          retention-days: 30

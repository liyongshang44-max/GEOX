name: ADR — GEOX Explicit One-Shot Shadow Observer

on:
  push:
    branches:
      - main
      - feat/adr-geox-one-shot-shadow-observer-v1
    paths:
      - 'apps/server/src/integrations/adr/**'
      - 'apps/server/src/services/derived_sensing_state_v1.ts'
      - 'apps/server/src/services/derived_sensing_state_service_v1.ts'
      - 'scripts/adr_adoption/geox_adr_one_shot_shadow_observer_v1.mjs'
      - 'scripts/adr_adoption/qualify_geox_adr_one_shot_shadow_observer_v1.mjs'
      - '.github/workflows/adr-geox-one-shot-shadow-observer.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/server/src/integrations/adr/**'
      - 'apps/server/src/services/derived_sensing_state_v1.ts'
      - 'apps/server/src/services/derived_sensing_state_service_v1.ts'
      - 'scripts/adr_adoption/geox_adr_one_shot_shadow_observer_v1.mjs'
      - 'scripts/adr_adoption/qualify_geox_adr_one_shot_shadow_observer_v1.mjs'
      - '.github/workflows/adr-geox-one-shot-shadow-observer.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '20.11.1'
  PNPM_VERSION: '9.15.4'
  GEOX_ADR_P5_QUALIFICATION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  GEOX_ADR_P5_ACCEPTANCE_DATABASE_URL: 'postgres://postgres:postgres@127.0.0.1:5432/geox_adr_one_shot_shadow'

jobs:
  one_shot_shadow_observer:
    name: Node 20 explicit one-shot operational shadow proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: geox_adr_one_shot_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d geox_adr_one_shot_shadow"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout exact GEOX candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GEOX_ADR_P5_QUALIFICATION_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Prove exact checkout, P4 lineage, and secret isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GEOX_ADR_P5_QUALIFICATION_HEAD"
          git merge-base --is-ancestor bf5bd1dda29d8fef2ddc21dc758c2126077bf98b HEAD
          node --version | grep '^v20\.11\.1$'
          pnpm --version | grep '^9\.15\.4$'
          test -z "${DATABASE_URL:-}"
          test -z "${GEOX_RUNTIME_DATABASE_URL:-}"
          test -z "${GEOX_MCFT_CAP09_T3R1_S6_DATABASE_URL:-}"
          test -z "${GEOX_MCFT_CAP09_T4R1_S6_DATABASE_URL:-}"
          test -z "${GEOX_ADR_SHADOW_DATABASE_URL:-}"

      - name: Prove operational entrypoint remains one-shot only
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const path = 'scripts/adr_adoption/geox_adr_one_shot_shadow_observer_v1.mjs';
          const source = fs.readFileSync(path, 'utf8');
          for (const forbidden of [
            'setInterval(',
            'setTimeout(',
            '.listen(',
            'node-cron',
            'cron.schedule',
            'writeFileSync(',
            'appendFileSync('
          ]) {
            if (source.includes(forbidden)) throw new Error(`ADR_P5_PERSISTENT_OR_DAEMON_SURFACE:${forbidden}`);
          }
          for (const required of [
            'GEOX_ADR_SHADOW_OBSERVATION_MODE',
            'EXPLICIT_ONE_SHOT_READ_ONLY',
            'GEOX_ADR_SHADOW_DATABASE_URL',
            'ADR_SHADOW_DATABASE_ALIAS_FORBIDDEN',
            'exportGeoxAdrPostgresTransactionGuardedReadOnlyShadowContextV1',
            'createGeoxAdrReadOnlyShadowObservationV1'
          ]) {
            if (!source.includes(required)) throw new Error(`ADR_P5_REQUIRED_SURFACE_MISSING:${required}`);
          }

      - name: Install exact GEOX workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile GEOX production ADR integration
        run: pnpm -w exec tsc -p apps/server/tsconfig.json

      - name: Run isolated one-shot operational qualification
        env:
          ADR_P5_ISOLATED_ACCEPTANCE: '1'
        run: node scripts/adr_adoption/qualify_geox_adr_one_shot_shadow_observer_v1.mjs

      - name: Validate one-shot machine proof
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const path = 'acceptance-output/ADR_GEOX_ONE_SHOT_SHADOW_OBSERVER_V1.json';
          const proof = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (proof.status !== 'PASS') throw new Error('ADR_P5_NOT_PASS');
          if (proof.geoxSourceCommit !== process.env.GEOX_ADR_P5_QUALIFICATION_HEAD) throw new Error('ADR_P5_HEAD_MISMATCH');
          if (proof.p4MergedPredecessor !== 'bf5bd1dda29d8fef2ddc21dc758c2126077bf98b') throw new Error('ADR_P5_P4_PREDECESSOR_MISMATCH');
          if (!String(proof.postgresVersion).startsWith('16.')) throw new Error('ADR_P5_POSTGRES_VERSION_MISMATCH');
          for (const key of [
            'isolatedPostgresEndpoint',
            'operationalEntrypointQualified',
            'explicitOneShotModeRequired',
            'dedicatedDatabaseUrlRequired',
            'genericDatabaseFallbackRejected',
            'genericDatabaseAliasRejected',
            'mcftDatabaseAliasRejected',
            'invalidModeRejected',
            'projectionActionabilityPromotionRejected',
            'fixtureRowsUnchanged',
            'provenancePreserved'
          ]) if (proof[key] !== true) throw new Error(`ADR_P5_PROOF_MISSING:${key}`);
          if (proof.transactionReadOnly !== 'on' || proof.transactionIsolation !== 'repeatable read') throw new Error('ADR_P5_TRANSACTION_BOUNDARY_WRONG');
          if (proof.realityRowCount !== 2 || proof.fixtureRowCountBefore !== 2 || proof.fixtureRowCountAfter !== 2) throw new Error('ADR_P5_FIXTURE_CARDINALITY_WRONG');
          for (const key of [
            'liveProductionReadModelObserved',
            'productionDatabaseEndpointUsed',
            'productionDatabaseCredentialProvisioned',
            'productionRuntimeActivated',
            'daemonOrSchedulerStarted',
            'persistentWriteCreated',
            'mcftRemoteDatabaseSecretUsed',
            'bLineDatabaseSecretUsed',
            'geoxFieldEqualsAdrTarget',
            'correspondenceOrEqualityEstablished',
            'recommendationWriteAuthorized',
            'approvalAuthorized',
            'operationPlanOrTaskCreationAuthorized',
            'dispatchAuthorized',
            'machineExecutionAuthorized',
            'newArchitectureDecisionRequired'
          ]) if (proof[key] !== false) throw new Error(`ADR_P5_NONCLAIM_REGRESSION:${key}`);

      - name: Upload P5 qualification proof only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geox-adr-one-shot-shadow-${{ env.GEOX_ADR_P5_QUALIFICATION_HEAD }}
          path: acceptance-output/ADR_GEOX_ONE_SHOT_SHADOW_OBSERVER_V1.json
          if-no-files-found: error
          retention-days: 30

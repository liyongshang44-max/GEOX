name: mcft-cap09-temp-govern-production-live-base

on:
  push:
    branches:
      - 'feat/mcft-cap09-postcutover-stage-refresh-v1'
    paths:
      - '.github/workflows/mcft-cap09-temp-govern-production-live-base.yml'

permissions:
  contents: write

jobs:
  finalize-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize exact protected-main predecessor governance
        shell: python
        run: |
          import json
          from pathlib import Path

          predecessor = 'ef9f7d45114c98c16ad57ce69226323935f685db'

          def replace_once(text, old, new, code):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{code}:{count}')
              return text.replace(old, new, 1)

          registry = Path('docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-EVIDENCE-REGISTRY-V1.json')
          registry_text = registry.read_text(encoding='utf-8')
          registry_old = '''          "ddfdbc0ee88e7845e03eaf4b14e6077dbf645a23",\n          "0630bb63b82c9ba108854f5aa26b096f9221f031"\n        ],\n        "dependency_digest_must_match_current": true,'''
          registry_new = f'''          "ddfdbc0ee88e7845e03eaf4b14e6077dbf645a23",\n          "0630bb63b82c9ba108854f5aa26b096f9221f031",\n          "{predecessor}"\n        ],\n        "dependency_digest_must_match_current": true,'''
          registry_text = replace_once(registry_text, registry_old, registry_new, 'EXPECTED_EXACT_REGISTRY_TARGET_ONCE')
          json.loads(registry_text)
          registry.write_text(registry_text, encoding='utf-8')

          workflow = Path('.github/workflows/mcft-cap-09-qualification-control-plane-v1.yml')
          workflow_text = workflow.read_text(encoding='utf-8')
          env_old = "  POST_EFFECTIVENESS_RUNTIME_CUTOVER_PREDECESSOR_SHA: '0630bb63b82c9ba108854f5aa26b096f9221f031'\n"
          env_new = env_old + f"  POST_RUNTIME_CUTOVER_PRODUCTION_LIVE_PREDECESSOR_SHA: '{predecessor}'\n"
          workflow_text = replace_once(workflow_text, env_old, env_new, 'EXPECTED_QUALIFICATION_ENV_TARGET_ONCE')

          gate_old = '&& [ "$base" != "$POST_EFFECTIVENESS_RUNTIME_CUTOVER_PREDECESSOR_SHA" ]; then'
          gate_new = '&& [ "$base" != "$POST_EFFECTIVENESS_RUNTIME_CUTOVER_PREDECESSOR_SHA" ] && [ "$base" != "$POST_RUNTIME_CUTOVER_PRODUCTION_LIVE_PREDECESSOR_SHA" ]; then'
          workflow_text = replace_once(workflow_text, gate_old, gate_new, 'EXPECTED_QUALIFICATION_BASE_GATE_TARGET_ONCE')

          expected_old = 'process.env.POST_EFFECTIVENESS_RUNTIME_CUTOVER_PREDECESSOR_SHA];'
          expected_new = 'process.env.POST_EFFECTIVENESS_RUNTIME_CUTOVER_PREDECESSOR_SHA, process.env.POST_RUNTIME_CUTOVER_PRODUCTION_LIVE_PREDECESSOR_SHA];'
          workflow_text = replace_once(workflow_text, expected_old, expected_new, 'EXPECTED_QUALIFICATION_PREDECESSOR_SET_TARGET_ONCE')
          workflow.write_text(workflow_text, encoding='utf-8')

          Path('.github/workflows/mcft-cap09-temp-govern-production-live-base.yml').unlink()

      - name: Verify and commit final governance closure
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "3"
          git diff --name-only | grep -Fx '.github/workflows/mcft-cap-09-qualification-control-plane-v1.yml'
          git diff --name-only | grep -Fx '.github/workflows/mcft-cap09-temp-govern-production-live-base.yml'
          git diff --name-only | grep -Fx 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-EVIDENCE-REGISTRY-V1.json'
          git diff --diff-filter=D --name-only | grep -Fx '.github/workflows/mcft-cap09-temp-govern-production-live-base.yml'
          git diff --numstat | grep -Fx $'2\t1\tdocs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-EVIDENCE-REGISTRY-V1.json'
          grep -Fx "  POST_RUNTIME_CUTOVER_PRODUCTION_LIVE_PREDECESSOR_SHA: 'ef9f7d45114c98c16ad57ce69226323935f685db'" .github/workflows/mcft-cap-09-qualification-control-plane-v1.yml
          grep -F 'POST_RUNTIME_CUTOVER_PRODUCTION_LIVE_PREDECESSOR_SHA' .github/workflows/mcft-cap-09-qualification-control-plane-v1.yml >/dev/null
          node -e "JSON.parse(require('fs').readFileSync('docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-EVIDENCE-REGISTRY-V1.json','utf8'))"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'gov(mcft-cap09): complete production-live predecessor governance'
          git push origin HEAD:${GITHUB_REF_NAME}

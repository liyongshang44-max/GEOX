name: mcft-cap09-temp-govern-production-live-base

on:
  push:
    branches:
      - 'feat/mcft-cap09-postcutover-stage-refresh-v1'
    paths:
      - '.github/workflows/mcft-cap09-temp-govern-production-live-base.yml'

permissions:
  contents: write

jobs:
  prepare-qualification-workflow-blob:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build exact qualification workflow target
        shell: python
        run: |
          from pathlib import Path

          predecessor = 'ef9f7d45114c98c16ad57ce69226323935f685db'
          workflow = Path('.github/workflows/mcft-cap-09-qualification-control-plane-v1.yml')
          text = workflow.read_text(encoding='utf-8')

          def replace_once(text, old, new, code):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{code}:{count}')
              return text.replace(old, new, 1)

          env_old = "  POST_EFFECTIVENESS_RUNTIME_CUTOVER_PREDECESSOR_SHA: '0630bb63b82c9ba108854f5aa26b096f9221f031'\n"
          env_new = env_old + f"  POST_RUNTIME_CUTOVER_PRODUCTION_LIVE_PREDECESSOR_SHA: '{predecessor}'\n"
          text = replace_once(text, env_old, env_new, 'EXPECTED_QUALIFICATION_ENV_TARGET_ONCE')

          gate_old = '&& [ "$base" != "$POST_EFFECTIVENESS_RUNTIME_CUTOVER_PREDECESSOR_SHA" ]; then'
          gate_new = '&& [ "$base" != "$POST_EFFECTIVENESS_RUNTIME_CUTOVER_PREDECESSOR_SHA" ] && [ "$base" != "$POST_RUNTIME_CUTOVER_PRODUCTION_LIVE_PREDECESSOR_SHA" ]; then'
          text = replace_once(text, gate_old, gate_new, 'EXPECTED_QUALIFICATION_BASE_GATE_TARGET_ONCE')

          expected_old = 'process.env.POST_EFFECTIVENESS_RUNTIME_CUTOVER_PREDECESSOR_SHA];'
          expected_new = 'process.env.POST_EFFECTIVENESS_RUNTIME_CUTOVER_PREDECESSOR_SHA, process.env.POST_RUNTIME_CUTOVER_PRODUCTION_LIVE_PREDECESSOR_SHA];'
          text = replace_once(text, expected_old, expected_new, 'EXPECTED_QUALIFICATION_PREDECESSOR_SET_TARGET_ONCE')
          workflow.write_text(text, encoding='utf-8')

      - name: Validate target and upload Git blob only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='.github/workflows/mcft-cap-09-qualification-control-plane-v1.yml'
          git diff --check -- "$path"
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1"
          git diff --name-only | grep -Fx "$path"
          grep -Fx "  POST_RUNTIME_CUTOVER_PRODUCTION_LIVE_PREDECESSOR_SHA: 'ef9f7d45114c98c16ad57ce69226323935f685db'" "$path"
          test "$(grep -c 'POST_RUNTIME_CUTOVER_PRODUCTION_LIVE_PREDECESSOR_SHA' "$path")" = "3"
          payload="$(jq -Rs '{content:.,encoding:"utf-8"}' < "$path")"
          response="$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
            --data-binary "$payload")"
          sha="$(printf '%s' "$response" | jq -r '.sha // empty')"
          test "$(printf '%s' "$sha" | grep -Ec '^[0-9a-f]{40}$')" = "1"
          echo "QUALIFICATION_BLOB_SHA=$sha"
          echo "QUALIFICATION_TARGET_NUMSTAT=$(git diff --numstat -- "$path")"

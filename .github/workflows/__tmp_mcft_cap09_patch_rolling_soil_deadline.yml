name: tmp-mcft-cap09-patch-rolling-soil-deadline

on:
  push:
    branches:
      - agent/mcft-cap09-rolling-soil-deadline-t0
    paths:
      - '.github/workflows/__tmp_mcft_cap09_patch_rolling_soil_deadline.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mcft-cap09-rolling-soil-deadline-t0
          fetch-depth: 0

      - name: Apply narrow Amendment-11 rolling deadline correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runner_path = Path('scripts/runtime_acceptance/RUN_MCFT_CAP_09_EA5E2_LIVE_PROVIDER_PHASE_PRIVATE_TRANSIENT_R2.ts')
          runner = runner_path.read_text()
          old = 'const MIN_INGRESS_MARGIN_MINUTES = 5;'
          new = 'const MIN_INGRESS_MARGIN_MINUTES = process.env.GITHUB_WORKFLOW === "mcft-cap-09-rolling-preboundary-capture" ? 0 : 5;'
          if runner.count(old) != 1:
              raise SystemExit(f'runner seam count drift: {runner.count(old)}')
          runner = runner.replace(old, new, 1)
          runner_path.write_text(runner)

          acceptance_path = Path('scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_ROLLING_PREBOUNDARY_CAPTURE.cjs')
          acceptance = acceptance_path.read_text()
          old_block = '''requireAll(providerRunner, [
            "PRE_BOUNDARY_CAUSAL",
            "soil_observation_inside_t_minus_15_to_t: true",
            "gfs_same_cycle_pair: true",
            "rehydration_manifest",
            "formal_database_write_count: 0",
            "formal_r2_write_count: 0",
          ], "MCFT_CAP09_ROLLING_PREBOUNDARY_EXISTING_RUNNER_CAPABILITY_REQUIRED");
          '''
          new_block = '''requireAll(providerRunner, [
            "PRE_BOUNDARY_CAUSAL",
            "process.env.GITHUB_WORKFLOW === \\"mcft-cap-09-rolling-preboundary-capture\\" ? 0 : 5",
            "const latestIngressStartMs = Date.parse(addMinutes(target, -MIN_INGRESS_MARGIN_MINUTES));",
            "if (Date.parse(canonicalizedAt) > latestIngressStartMs) throw new Error(\\"EA5E2_PREBOUNDARY_MINIMUM_INGRESS_MARGIN_LOST\\")",
            "soil_observation_inside_t_minus_15_to_t: true",
            "gfs_same_cycle_pair: true",
            "rehydration_manifest",
            "formal_database_write_count: 0",
            "formal_r2_write_count: 0",
          ], "MCFT_CAP09_ROLLING_PREBOUNDARY_EXISTING_RUNNER_CAPABILITY_REQUIRED");

          if (providerRunner.includes("const MIN_INGRESS_MARGIN_MINUTES = 5;")) {
            throw new Error("MCFT_CAP09_ROLLING_PREBOUNDARY_T_MINUS_5_DEADLINE_FORBIDDEN");
          }
          '''
          if acceptance.count(old_block) != 1:
              raise SystemExit(f'acceptance block seam count drift: {acceptance.count(old_block)}')
          acceptance = acceptance.replace(old_block, new_block, 1)
          acceptance = acceptance.replace('schema_version: "geox_mcft_cap09_rolling_preboundary_capture_acceptance_v1",', 'schema_version: "geox_mcft_cap09_rolling_preboundary_capture_acceptance_v2",', 1)
          acceptance = acceptance.replace('candidate_retention_hours: 36,', 'candidate_retention_hours: 36,\n  rolling_preboundary_ingress_deadline: "T",\n  historical_nonrolling_ingress_margin_minutes: 5,\n  causal_upper_bound: "available_to_runtime_at<=T && ingested_at<=T",', 1)
          acceptance_path.write_text(acceptance)
          PY

          node --check scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_ROLLING_PREBOUNDARY_CAPTURE.cjs
          grep -F 'mcft-cap-09-rolling-preboundary-capture" ? 0 : 5' scripts/runtime_acceptance/RUN_MCFT_CAP_09_EA5E2_LIVE_PROVIDER_PHASE_PRIVATE_TRANSIENT_R2.ts
          git diff --check

      - name: Commit patch to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/runtime_acceptance/RUN_MCFT_CAP_09_EA5E2_LIVE_PROVIDER_PHASE_PRIVATE_TRANSIENT_R2.ts scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_ROLLING_PREBOUNDARY_CAPTURE.cjs
          git commit -m 'MCFT-CAP-09: allow rolling preboundary capture through T'
          git push origin HEAD:agent/mcft-cap09-rolling-soil-deadline-t0

name: Commercial Evidence Demo v1

on:
  pull_request:
    paths:
      - 'tools/commercial-evidence-demo/**'
      - 'scripts/commercial_evidence/**'
      - 'docs/commercial/**'
      - '.github/workflows/commercial-evidence-demo-v1.yml'

permissions:
  contents: read

concurrency:
  group: commercial-evidence-demo-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Commercial Evidence Demo acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm

      - name: Install locked workspace
        run: pnpm install --frozen-lockfile

      - name: Execute canonical selector and six-part demo acceptance
        run: node scripts/commercial_evidence/ACCEPTANCE_COMMERCIAL_EVIDENCE_DEMO_V1.cjs

      - name: Prove demo workflow has no privileged runtime trigger
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/commercial-evidence-demo-v1.yml
          ! grep -Eq '^  (push|schedule|workflow_dispatch|workflow_run):' "$workflow"
          secret_ref='se''crets.'
          database_ref='DATABASE''_URL'
          r2_ref='R2''_'
          ! grep -Fq "$secret_ref" "$workflow"
          ! grep -Fq "$database_ref" "$workflow"
          ! grep -Fq "$r2_ref" "$workflow"

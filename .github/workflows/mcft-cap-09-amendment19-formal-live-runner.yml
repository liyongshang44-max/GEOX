name: mcft-cap-09-amendment19-formal-live-runner

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-amendment19-formal-live-runner.yml'
      - 'scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_FORMAL_V3_PRODUCTION_RUNNER_V1.ts'
      - 'scripts/runtime_acceptance/mcft_cap09_amendment19_formal_manifest_from_arm_v1.ts'
      - 'apps/server/src/domain/twin_runtime/external_formal_amendment19_window_manifest_v1.ts'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mcft-cap09-am19-formal-live-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20.11.1'
  PNPM_VERSION: '9.15.4'

jobs:
  static-proof:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install exact repository dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck real Formal runner path
        run: >-
          pnpm exec tsc --noEmit --pretty false --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext --esModuleInterop --types node
          apps/server/src/domain/twin_runtime/external_formal_amendment19_window_manifest_v1.ts
          scripts/runtime_acceptance/mcft_cap09_amendment19_formal_manifest_from_arm_v1.ts
          scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_FORMAL_V3_PRODUCTION_RUNNER_V1.ts
      - name: Prove real Formal runner composition without side effects
        run: pnpm exec tsx scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_FORMAL_V3_PRODUCTION_RUNNER_V1.ts selftest
      - name: Require live supervisor is T4-bound, has no provider/R2 credentials, and propagates irreversible NO-GO
        shell: bash
        run: |
          set -euo pipefail
          live_section=$(sed -n '/^  live-cycle:/,$p' .github/workflows/mcft-cap-09-amendment19-formal-live-runner.yml)
          ! grep -q 'FORMAL_RAW_S3_SECRET_ACCESS_KEY' <<<"$live_section"
          ! grep -q 'TRANSIENT_S3_SECRET_ACCESS_KEY' <<<"$live_section"
          ! grep -q 'rolling-preboundary-capture' <<<"$live_section"
          grep -Fq 'GEOX_MCFT_CAP09_T4R1_S6_DATABASE_URL' <<<"$live_section"
          grep -Fq 'geox_mcft_cap09_s6_formal_t4r1_24h_v4' <<<"$live_section"
          ! grep -Fq 'GEOX_MCFT_CAP09_T3R1_S6_DATABASE_URL' <<<"$live_section"
          grep -Fq 'github.paginate.iterator(github.rest.actions.listWorkflowRuns' <<<"$live_section"
          grep -Fq 'mcft-cap09-am19-formal-hourly-${subject}-NO-GO-' <<<"$live_section"
          grep -Fq 'RUNNER_RESULT_MISSING' <<<"$live_section"
          grep -Fq 'formal_epoch_no_go:true' <<<"$live_section"
          grep -Fq 'if-no-files-found: error' <<<"$live_section"
          grep -Fq "steps.cycle.outcome != 'skipped'" <<<"$live_section"
          for workflow in \
            .github/workflows/mcft-cap-09-amendment19-formal-arm.yml \
            .github/workflows/mcft-cap-09-amendment19-formal-hourly-evidence.yml \
            .github/workflows/mcft-cap-09-amendment19-formal-live-runner.yml \
            .github/workflows/mcft-cap-09-amendment19-formal-final-readback.yml; do
            ! grep -Fq 'response.data.workflow_runs' "$workflow"
          done
      - name: Prove Octokit workflow-run pagination returns normalized item arrays
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let observed = false;
            for await (const response of github.paginate.iterator(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id: '.github/workflows/mcft-cap-09-amendment19-formal-live-runner.yml',
                status: 'completed',
                per_page: 1,
              }
            )) {
              if (!Array.isArray(response.data)) {
                throw new Error(`AM19_FORMAL_WORKFLOW_RUN_PAGINATION_ARRAY_REQUIRED:${typeof response.data}`);
              }
              observed = true;
              break;
            }
            if (!observed) throw new Error('AM19_FORMAL_WORKFLOW_RUN_PAGINATION_PAGE_REQUIRED');

  live-cycle:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MCFT_CAP09_PARENT_DATABASE_URL: ${{ secrets.GEOX_MCFT_CAP09_T4R1_S6_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Freeze exact current protected-main subject
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          subject=$(git rev-parse origin/main)
          test "$(git rev-parse HEAD)" = "$subject" || { echo 'AM19_FORMAL_LIVE_CHECKOUT_MAIN_DRIFT' >&2; exit 1; }
          echo "sha=$subject" >> "$GITHUB_OUTPUT"
          echo "MCFT_CAP09_SUBJECT_SHA=$subject" >> "$GITHUB_ENV"

      - name: Resolve unique active arm, A0 proof, and irreversible prior NO-GO marker
        id: resolve
        uses: actions/github-script@v7
        env:
          SUBJECT_SHA: ${{ steps.subject.outputs.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const subject = process.env.SUBJECT_SHA;
            const digestOk = value => /^sha256:[0-9a-f]{64}$/.test(String(value || ''));
            async function artifacts(workflowPath, prefix) {
              const found = [];
              for await (const response of github.paginate.iterator(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id: workflowPath, branch: 'main', per_page: 100,
              })) {
                for (const run of response.data.filter(r => r.head_sha === subject)) {
                  const artifactResponse = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: run.id, per_page: 100 });
                  for (const artifact of artifactResponse.data.artifacts) if (!artifact.expired && artifact.name.startsWith(prefix)) found.push({ run, artifact });
                }
              }
              return found;
            }

            const runnerNoGo = await artifacts('.github/workflows/mcft-cap-09-amendment19-formal-live-runner.yml', `mcft-cap09-am19-formal-cycle-NO-GO-${subject}-`);
            const hourlyNoGo = await artifacts('.github/workflows/mcft-cap-09-amendment19-formal-hourly-evidence.yml', `mcft-cap09-am19-formal-hourly-${subject}-NO-GO-`);
            const noGo = [...runnerNoGo, ...hourlyNoGo];
            if (noGo.length > 0) {
              if (noGo.length > 1) core.warning(`multiple retained NO-GO proofs: ${noGo.length}`);
              noGo.sort((left, right) => left.run.id - right.run.id || left.artifact.id - right.artifact.id);
              core.setOutput('active', 'false');
              core.setOutput('reason', 'IRREVERSIBLE_FORMAL_EPOCH_NO_GO_ALREADY_RECORDED');
              core.setOutput('prior_no_go_artifact_id', String(noGo[0].artifact.id));
              return;
            }

            const arms = await artifacts('.github/workflows/mcft-cap-09-amendment19-formal-arm.yml', `mcft-cap09-am19-formal-arm-${subject}-`);
            if (arms.length === 0) { core.setOutput('active', 'false'); core.setOutput('reason', 'NO_ACTIVE_FORMAL_ARM'); return; }
            if (arms.length !== 1) throw new Error(`AM19_FORMAL_LIVE_EXACT_ONE_ARM_REQUIRED:${arms.length}`);
            if (!digestOk(arms[0].artifact.digest)) throw new Error('AM19_FORMAL_LIVE_ARM_DIGEST_REQUIRED');
            core.setOutput('arm_run_id', String(arms[0].run.id));
            core.setOutput('arm_artifact_name', arms[0].artifact.name);
            core.setOutput('arm_artifact_digest', arms[0].artifact.digest);

            const a0s = await artifacts('.github/workflows/mcft-cap-09-amendment19-formal-a0-bootstrap.yml', `mcft-cap09-am19-formal-a0-${subject}-`);
            if (a0s.length === 0) { core.setOutput('active', 'false'); core.setOutput('reason', 'A0_BOOTSTRAP_NOT_TERMINAL_PASS'); return; }
            if (a0s.length !== 1) throw new Error(`AM19_FORMAL_LIVE_EXACT_ONE_A0_PROOF_REQUIRED:${a0s.length}`);
            if (!digestOk(a0s[0].artifact.digest)) throw new Error('AM19_FORMAL_LIVE_A0_DIGEST_REQUIRED');
            core.setOutput('a0_run_id', String(a0s[0].run.id));
            core.setOutput('a0_artifact_name', a0s[0].artifact.name);
            core.setOutput('a0_artifact_digest', a0s[0].artifact.digest);
            core.setOutput('active', 'true');

      - name: Exit cleanly without Formal mutation when no active epoch is runnable
        if: steps.resolve.outputs.active != 'true'
        env:
          REASON: ${{ steps.resolve.outputs.reason }}
        run: echo "AM19_FORMAL_LIVE_NOT_ACTIVE:${REASON}"

      - name: Download immutable active arm
        if: steps.resolve.outputs.active == 'true'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve.outputs.arm_run_id }}
          name: ${{ steps.resolve.outputs.arm_artifact_name }}
          path: arm-evidence

      - name: Download A0 bootstrap proof
        if: steps.resolve.outputs.active == 'true'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve.outputs.a0_run_id }}
          name: ${{ steps.resolve.outputs.a0_artifact_name }}
          path: a0-evidence

      - name: Resolve exact arm/A0 files and live cycle window
        if: steps.resolve.outputs.active == 'true'
        id: evidence
        shell: node {0}
        run: |
          const fs=require('node:fs'),path=require('node:path');
          function files(root,name){const out=[];for(const e of fs.readdirSync(root,{withFileTypes:true})){const p=path.join(root,e.name);if(e.isDirectory())out.push(...files(p,name));else if(e.name===name)out.push(p);}return out;}
          const arms=files('arm-evidence','MCFT_CAP_09_AMENDMENT_19_FORMAL_ARM_V1.json');
          const boots=files('a0-evidence','MCFT_CAP_09_AMENDMENT_19_FORMAL_A0_BOOTSTRAP_RESULT_V1.json');
          if(arms.length!==1||boots.length!==1)throw new Error(`AM19_FORMAL_LIVE_FILE_CARDINALITY:${arms.length}:${boots.length}`);
          const arm=JSON.parse(fs.readFileSync(arms[0],'utf8')),boot=JSON.parse(fs.readFileSync(boots[0],'utf8'));
          if(arm.status!=='PASS'||arm.subject_sha!==process.env.MCFT_CAP09_SUBJECT_SHA||arm.formal_database_name!=='geox_mcft_cap09_s6_formal_t4r1_24h_v4'||boot.status!=='PASS'||boot.subject_sha!==process.env.MCFT_CAP09_SUBJECT_SHA||boot.formal_database_name!==arm.formal_database_name||boot.arm_identity_hash!==arm.arm_identity_hash||boot.epoch_id!==arm.epoch_id||boot.manifest_hash==null||boot.formal_a0_bootstrapped!==true||boot.formal_o00_started!==false)throw new Error('AM19_FORMAL_LIVE_ARM_A0_IDENTITY_REQUIRED');
          const now=Date.now(),o00=Date.parse(arm.o00),o23=Date.parse(arm.o23);
          let runnable=true,reason='';
          if(now<o00){runnable=false;reason='BEFORE_O00';}
          else if(now>=o23+2*3600000){runnable=false;reason='AFTER_FORMAL_RUNNER_GRACE_WINDOW';}
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`arm_path=${path.resolve(arms[0])}\nrunnable=${runnable?'true':'false'}\nreason=${reason}\no00=${arm.o00}\no23=${arm.o23}\n`);

      - name: Exit cleanly outside active execution window
        if: steps.resolve.outputs.active == 'true' && steps.evidence.outputs.runnable != 'true'
        run: echo "AM19_FORMAL_LIVE_WINDOW_NOT_RUNNABLE:${{ steps.evidence.outputs.reason }}"

      - name: Require private Formal DB binding without disclosure
        if: steps.evidence.outputs.runnable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MCFT_CAP09_PARENT_DATABASE_URL:-}" || { echo 'AM19_FORMAL_LIVE_DATABASE_SECRET_REQUIRED' >&2; exit 1; }

      - name: Normalize stable T4R1 credential seed to exact actual Formal v2
        if: steps.evidence.outputs.runnable == 'true'
        shell: node {0}
        run: |
          const fs=require('node:fs');const u=new URL(process.env.MCFT_CAP09_PARENT_DATABASE_URL);if(!['postgres:','postgresql:'].includes(u.protocol)||['localhost','127.0.0.1','::1'].includes(u.hostname))throw new Error('AM19_FORMAL_LIVE_REMOTE_POSTGRES_REQUIRED');const seed=decodeURIComponent(u.pathname.replace(/^\//,''));if(!new Set(['geox_mcft_cap09_s6_formal_t4r1_24h','geox_mcft_cap09_s6_formal_t4r1_24h_v4']).has(seed))throw new Error(`AM19_FORMAL_LIVE_T4R1_SEED_FORBIDDEN:${seed}`);u.pathname='/geox_mcft_cap09_s6_formal_t4r1_24h_v4';const target=u.toString();console.log(`::add-mask::${target}`);fs.appendFileSync(process.env.GITHUB_ENV,`DATABASE_URL=${target}\n`);

      - uses: pnpm/action-setup@v4
        if: steps.evidence.outputs.runnable == 'true'
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        if: steps.evidence.outputs.runnable == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install exact repository dependencies
        if: steps.evidence.outputs.runnable == 'true'
        run: pnpm install --frozen-lockfile

      - name: Execute exactly one oldest-due production slot on real database clock
        if: steps.evidence.outputs.runnable == 'true'
        id: cycle
        continue-on-error: true
        env:
          MCFT_CAP09_AM19_FORMAL_ARM_PATH: ${{ steps.evidence.outputs.arm_path }}
        run: pnpm exec tsx scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_FORMAL_V3_PRODUCTION_RUNNER_V1.ts cycle

      - name: Classify terminal cycle result and freeze irreversible NO-GO state
        if: steps.evidence.outputs.runnable == 'true' && always() && steps.cycle.outcome != 'skipped'
        id: classify
        env:
          ARM_PATH: ${{ steps.evidence.outputs.arm_path }}
          CYCLE_OUTCOME: ${{ steps.cycle.outcome }}
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const file='acceptance-output/MCFT_CAP_09_AMENDMENT_19_FORMAL_V3_PRODUCTION_RUNNER_RESULT_V1.json';
          const arm=JSON.parse(fs.readFileSync(process.env.ARM_PATH,'utf8'));
          function freezeMetadataNoGo(failureClass,detail){
            fs.mkdirSync('acceptance-output',{recursive:true});
            fs.writeFileSync(file,JSON.stringify({
              schema_version:'geox_mcft_cap09_amendment19_formal_v3_production_runner_result_v1',
              status:'FAIL',subject_sha:process.env.MCFT_CAP09_SUBJECT_SHA,
              arm_identity_hash:arm.arm_identity_hash,epoch_id:arm.epoch_id,
              formal_database_name:arm.formal_database_name,cycle_started_at:new Date().toISOString(),
              failure_class:failureClass,reason:detail,formal_epoch_no_go:true,
              runner_result_missing_or_untrustworthy:true,database_mutation_state:'UNKNOWN_FAIL_CLOSED',
              synthetic_scheduler_tick_written:false,store_reuse_authorized:false,late_evidence_can_repair_tick:false,
              final_actual_24h_still_required:true,mcft_cap09_completed:false
            },null,2)+'\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT,`classification=NO-GO\nreason=${failureClass}\n`);
          }
          if(!fs.existsSync(file)){freezeMetadataNoGo('RUNNER_RESULT_MISSING','runner step produced no result file');process.exit(0);}
          let p;
          try{p=JSON.parse(fs.readFileSync(file,'utf8'));}catch(error){freezeMetadataNoGo('RUNNER_RESULT_INVALID_JSON',String(error));process.exit(0);}
          const declaredNoGo=p.status==='FAIL'||p.formal_epoch_no_go===true;
          if(process.env.CYCLE_OUTCOME!=='success'&&!declaredNoGo){freezeMetadataNoGo('RUNNER_STEP_FAILED_WITH_NON_NOGO_RESULT',`cycle_outcome=${process.env.CYCLE_OUTCOME};result_status=${String(p.status)}`);process.exit(0);}
          const inner=p.result?.status||p.failure_class||'UNKNOWN';
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`classification=${declaredNoGo?'NO-GO':'PASS'}\nreason=${inner}\n`);

      - name: Upload immutable cycle proof
        if: steps.evidence.outputs.runnable == 'true' && always() && steps.cycle.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-am19-formal-cycle-${{ steps.classify.outputs.classification }}-${{ env.MCFT_CAP09_SUBJECT_SHA }}-${{ github.run_id }}
          path: acceptance-output/MCFT_CAP_09_AMENDMENT_19_FORMAL_V3_PRODUCTION_RUNNER_RESULT_V1.json
          if-no-files-found: error
          retention-days: 90

      - name: Preserve runner failure as workflow failure after proof upload
        if: steps.evidence.outputs.runnable == 'true' && steps.cycle.outcome != 'success' && steps.cycle.outcome != 'skipped'
        run: |
          echo "AM19_FORMAL_LIVE_CYCLE_FAILED:${{ steps.classify.outputs.reason }}" >&2
          exit 1

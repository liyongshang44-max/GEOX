name: mcft-cap-08-s6-run-b-replacement-001-one-shot-dispatch-broker
run-name: REPLACEMENT-001 one-shot Formal RUN_B dispatch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcft-cap-08-s6-run-b-replacement-001-one-shot-dispatch-broker.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: mcft-cap08-s6-run-b-replacement-001-one-shot-dispatch
  cancel-in-progress: false

jobs:
  dispatch-once:
    if: github.run_attempt == 1 && github.event.before == 'c8a2805d4ad148f31ad09ca56a9d75d39836c05c'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTHORITY_MAIN_SHA: ${{ github.sha }}
      EXACT_SUBJECT_SHA: ce9d6b4df8c708c0d4a99bb24846e1bc44b3cf59
      RUN_LABEL: RUN_B
      OPERATIONAL_RUN_INSTANCE_ID: MCFT-CAP-08-S6-FORMAL-RUN-B-20260804-REPLACEMENT-001
      EXECUTION_AUTHORITY_PATH: docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-FORMAL-RUN-B-REPLACEMENT-001-EXECUTION-AUTHORITY-EFFECTIVE-V1.json
      EXPECTED_AUTHORITY_BLOB: eba4c307795b3b86bd108c547119d817d28fe47e
      EXPECTED_WORKFLOW_BLOB: 2371b3797999f61f55c58551b85c59279eb2f0a2
      TARGET_WORKFLOW: mcft-cap-08-s6-single-run-database-execution.yml
    steps:
      - name: Checkout authority-bearing exact main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORITY_MAIN_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify frozen authority, workflow and production gate
        shell: bash
        env:
          MCFT_CAP08_EXECUTION_AUTHORITY_PATH: ${{ env.EXECUTION_AUTHORITY_PATH }}
          MCFT_CAP08_EXACT_SUBJECT_SHA: ${{ env.EXACT_SUBJECT_SHA }}
          MCFT_CAP08_RUN_LABEL: ${{ env.RUN_LABEL }}
          MCFT_CAP08_OPERATIONAL_RUN_INSTANCE_ID: ${{ env.OPERATIONAL_RUN_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORITY_MAIN_SHA"
          test "$(git rev-parse HEAD:$EXECUTION_AUTHORITY_PATH)" = "$EXPECTED_AUTHORITY_BLOB"
          test "$(git rev-parse HEAD:.github/workflows/mcft-cap-08-s6-single-run-database-execution.yml)" = "$EXPECTED_WORKFLOW_BLOB"
          node scripts/runtime_acceptance/mcft_cap08_s6_single_run_workflow/execution_authority_gate_v1.cjs

      - name: Dispatch Formal RUN_B exactly once
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p acceptance-output
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python - <<'PY'
          import json, os
          receipt = {
              'schema_version': 'geox_mcft_cap08_s6_run_b_replacement_001_dispatch_broker_receipt_v1',
              'status': 'DISPATCH_ATTEMPT_STARTED',
              'broker_run_id': int(os.environ['GITHUB_RUN_ID']),
              'broker_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'authority_main_sha': os.environ['AUTHORITY_MAIN_SHA'],
              'exact_subject_sha': os.environ['EXACT_SUBJECT_SHA'],
              'run_label': os.environ['RUN_LABEL'],
              'operational_run_instance_id': os.environ['OPERATIONAL_RUN_INSTANCE_ID'],
              'execution_authority_path': os.environ['EXECUTION_AUTHORITY_PATH'],
              'target_workflow_run_id': None,
              'target_workflow_run_attempt': None,
              'rerun_authorized': False,
              'cross_run_comparator_authorized': False,
          }
          with open('acceptance-output/MCFT_CAP_08_S6_RUN_B_REPLACEMENT_001_DISPATCH_BROKER_RECEIPT.json', 'w', encoding='utf-8') as handle:
              json.dump(receipt, handle, indent=2)
              handle.write('\n')
          PY
          payload="$(python - <<'PY'
          import json, os
          print(json.dumps({
              'ref': 'main',
              'inputs': {
                  'exact_subject_sha': os.environ['EXACT_SUBJECT_SHA'],
                  'run_label': os.environ['RUN_LABEL'],
                  'operational_run_instance_id': os.environ['OPERATIONAL_RUN_INSTANCE_ID'],
                  'execution_authority_path': os.environ['EXECUTION_AUTHORITY_PATH'],
              },
          }, separators=(',', ':')))
          PY
          )"
          http_code="$(curl --silent --show-error --output acceptance-output/dispatch-response.txt --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/dispatches" \
            --data "$payload")"
          echo "$http_code" > acceptance-output/dispatch-http-status.txt
          test "$http_code" = '204'
          echo "dispatched_at=$dispatched_at" >> "$GITHUB_OUTPUT"

      - name: Resolve dispatched Formal RUN_B workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHED_AT: ${{ steps.dispatch.outputs.dispatched_at }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          workflow = os.environ['TARGET_WORKFLOW']
          dispatched_at = dt.datetime.fromisoformat(os.environ['DISPATCHED_AT'].replace('Z', '+00:00'))
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'mcft-cap08-s6-run-b-dispatch-broker',
          }
          workflow_id = urllib.parse.quote(workflow, safe='')
          url = f'https://api.github.com/repos/{repo}/actions/workflows/{workflow_id}/runs?event=workflow_dispatch&branch=main&per_page=20'
          run = None
          for _ in range(45):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  data = json.load(response)
              candidates = []
              for item in data.get('workflow_runs', []):
                  created = dt.datetime.fromisoformat(item['created_at'].replace('Z', '+00:00'))
                  if created >= dispatched_at - dt.timedelta(seconds=5) and item.get('head_sha') == os.environ['AUTHORITY_MAIN_SHA'] and item.get('run_attempt') == 1:
                      candidates.append(item)
              if candidates:
                  candidates.sort(key=lambda item: item['created_at'], reverse=True)
                  run = candidates[0]
                  break
              time.sleep(2)
          if run is None:
              raise SystemExit('DISPATCHED_FORMAL_RUN_B_WORKFLOW_NOT_RESOLVED')

          receipt = {
              'schema_version': 'geox_mcft_cap08_s6_run_b_replacement_001_dispatch_broker_receipt_v1',
              'status': 'DISPATCH_ACCEPTED_HTTP_204_AND_TARGET_RESOLVED',
              'broker_run_id': int(os.environ['GITHUB_RUN_ID']),
              'broker_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'authority_main_sha': os.environ['AUTHORITY_MAIN_SHA'],
              'exact_subject_sha': os.environ['EXACT_SUBJECT_SHA'],
              'run_label': os.environ['RUN_LABEL'],
              'operational_run_instance_id': os.environ['OPERATIONAL_RUN_INSTANCE_ID'],
              'execution_authority_path': os.environ['EXECUTION_AUTHORITY_PATH'],
              'target_workflow_run_id': run['id'],
              'target_workflow_run_number': run['run_number'],
              'target_workflow_run_attempt': run['run_attempt'],
              'target_head_sha': run['head_sha'],
              'target_status': run['status'],
              'target_created_at': run['created_at'],
              'database_execution_performed_at_receipt_time': False,
              'rerun_authorized': False,
              'cross_run_comparator_authorized': False,
          }
          with open('acceptance-output/MCFT_CAP_08_S6_RUN_B_REPLACEMENT_001_DISPATCH_BROKER_RECEIPT.json', 'w', encoding='utf-8') as handle:
              json.dump(receipt, handle, indent=2)
              handle.write('\n')
          print(json.dumps(receipt, indent=2))
          PY

      - name: Upload one-shot dispatch broker receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap-08-s6-run-b-replacement-001-dispatch-broker-${{ github.run_id }}
          path: acceptance-output/
          if-no-files-found: error
          retention-days: 365

name: b05d-crop-skill-stage-exact

on:
  push:
    branches:
      - ci/bline-b05d-crop-skill-stage-exact-2026-08-27

jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Build runtime workspace dependencies
        run: |
          pnpm --filter @geox/contracts build
          pnpm --filter @geox/device-skills build
          pnpm --filter @geox/skill-registry build
      - name: Server typecheck
        run: pnpm --filter @geox/server typecheck
      - name: B-02 semantic governance
        run: node scripts/governance_acceptance/ACCEPTANCE_B02_SEMANTIC_CONTRACT_LINTER_V1.cjs
      - name: B-05a through B-05d compatibility fixtures
        run: |
          node --import tsx --test apps/server/src/contracts/canonical_context_v1.contract.test.ts
          node --import tsx --test apps/server/src/context/field_program_context_projection_v1.test.ts
          node --import tsx --test apps/server/src/context/legacy_crop_stage_compatibility_adapter_v1.test.ts
          node --import tsx --test apps/server/src/context/crop_skill_stage_compatibility_adapter_v1.test.ts
      - name: B-05d exact QualifiedCropStage producer set
        shell: bash
        run: |
          mapfile -t FILES < <(
            grep -R -l --include='*.ts' --exclude='*.test.ts' --exclude='*.acceptance.test.ts'               'qualifiedCropStageStateV1Schema.parse(' apps/server/src | sort || true
          )
          printf '%s\n' "${FILES[@]}"
          EXPECTED=(
            "apps/server/src/context/crop_skill_stage_compatibility_adapter_v1.ts"
            "apps/server/src/context/legacy_crop_stage_compatibility_adapter_v1.ts"
          )
          if [ "${#FILES[@]}" -ne 2 ] || [ "${FILES[0]}" != "${EXPECTED[0]}" ] || [ "${FILES[1]}" != "${EXPECTED[1]}" ]; then
            echo "B05D_QUALIFIED_STAGE_PRODUCER_SET_INVALID"
            exit 1
          fi
          echo "B05D_EXACT_QUALIFIED_STAGE_PRODUCER_SET_PASS"
      - name: B-05c and B-05d capability-island no-consumer audit
        shell: bash
        run: |
          for SYMBOL in projectLegacyCropStageCompatibilityV1 projectCropSkillStageCompatibilityV1; do
            mapfile -t FILES < <(
              grep -R -l --include='*.ts' --exclude='*.test.ts' --exclude='*.acceptance.test.ts'                 "$SYMBOL" apps/server/src || true
            )
            printf '%s %s\n' "$SYMBOL" "${FILES[*]}"
            if [ "${#FILES[@]}" -ne 1 ]; then
              echo "B05D_UNEXPECTED_RUNTIME_CONSUMER:$SYMBOL"
              exit 1
            fi
          done
          echo "B05D_CAPABILITY_ISLAND_NO_CONSUMER_PASS"
      - name: B-05d crop-skill touchpoint guard exactness
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const p = "docs/architecture/semantic_convergence/GEOX-SEMANTIC-OWNERSHIP-REGISTER-V1.json";
          const reg = JSON.parse(fs.readFileSync(p, "utf8"));
          const g13 = (reg.static_guards || []).find((x) => x.guard_id === "G-B02-13-crop-skill-stage-touchpoints");
          if (!g13) throw new Error("B05D_G13_MISSING");
          const actual = [...g13.registered_paths].sort();
          const expected = [
            "apps/server/src/context/crop_skill_stage_compatibility_adapter_v1.ts",
            "apps/server/src/domain/agronomy/rule_engine.ts",
          ].sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error("B05D_G13_PATH_SET_INVALID");
          const stage = reg.semantics.find((x) => x.semantic_id === "context.crop_stage");
          const producer = (stage.registered_producers || []).find((x) => x.producer_id === "crop-skill-stage-compatibility-adapter");
          if (!producer) throw new Error("B05D_ADAPTER_NOT_REGISTERED");
          if (producer.runtime_edge !== "INTENTIONAL_NONE") throw new Error("B05D_RUNTIME_EDGE_INVALID");
          if (producer.new_runtime_consumer_creation !== "FORBIDDEN") throw new Error("B05D_NEW_CONSUMER_RULE_INVALID");
          console.log("B05D_CROP_SKILL_GOVERNANCE_EXACTNESS_PASS");
          NODE
      - name: B-05d no Twin authority in adapter outputs
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const p = "apps/server/src/context/crop_skill_stage_compatibility_adapter_v1.ts";
          const src = fs.readFileSync(p, "utf8");
          const executable = src.replace(/\/\*[\s\S]*?\*\//g, "").replace(/\/\/.*$/gm, "");
          if (executable.includes('"TWIN_QUALIFIED"')) throw new Error("B05D_TWIN_QUALIFIED_LITERAL_FOUND");
          if (executable.includes('"TWIN_DERIVED_STATE"')) throw new Error("B05D_TWIN_DERIVED_LITERAL_FOUND");
          console.log("B05D_NO_TWIN_AUTHORITY_OUTPUT_PASS");
          NODE
      - name: B-03/B-04 regression boundary
        run: |
          node --import tsx --test apps/server/src/contracts/canonical_evidence_v1.contract.test.ts
          node --import tsx --test apps/server/src/evidence/raw_sample_evidence_qualification_projection_v1.test.ts
          node --import tsx --test apps/server/src/domain/judge/evidence_judge_canonical_sufficiency_shadow_v1.test.ts
      - name: Server build
        run: pnpm --filter @geox/server build
      - name: Marker
        run: |
          echo "B05D_EXACT_HEAD 1588ee403e905011d184888e7b79c3be4196c37e"
          echo "B05D_CROP_SKILL_STAGE_COMPATIBILITY_PASS"

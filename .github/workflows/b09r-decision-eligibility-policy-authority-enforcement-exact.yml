name: b09r-decision-eligibility-policy-authority-enforcement-exact

on:
  push:
    branches:
      - ci/bline-b09r-decision-eligibility-policy-authority-enforcement-exact-2026-08-30

jobs:
  exact-product-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove literal B-09r product head checkout
        run: |
          git checkout fe8b81350448dcdb6fb6ca423ecad81d2a6a4bef
          test "$(git rev-parse HEAD)" = "fe8b81350448dcdb6fb6ca423ecad81d2a6a4bef"
          test "$(git rev-parse HEAD^)" = "8526be4611290484ccaa8550969a013b408ff557"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace dependencies
        run: |
          pnpm --filter @geox/contracts build
          pnpm --filter @geox/device-skills build
          pnpm --filter @geox/skill-registry build

      - name: B-02 semantic governance
        run: node scripts/governance_acceptance/ACCEPTANCE_B02_SEMANTIC_CONTRACT_LINTER_V1.cjs

      - name: B-09r governance acceptance
        run: node scripts/governance_acceptance/ACCEPTANCE_B09R_DECISION_ELIGIBILITY_POLICY_AUTHORITY_ENFORCEMENT_V1.cjs

      - name: B-09r authz contract
        run: node --import tsx --test apps/server/src/auth/decision_eligibility_policy_declaration_authz_v1.contract.test.ts

      - name: Roles regression
        run: node --import tsx --test apps/server/src/domain/auth/roles.test.ts

      - name: B-09m declaration contract regression
        run: node --import tsx --test apps/server/src/contracts/decision_eligibility_policy_declaration_v1.contract.test.ts

      - name: B-07d evaluator regression
        run: node --import tsx --test apps/server/src/domain/decision/decision_eligibility_evaluator_v1.contract.test.ts

      - name: B-07e runtime regression
        run: node --import tsx --test apps/server/src/domain/decision/decision_eligibility_runtime_v1.contract.test.ts

      - name: Product diff remains bounded
        run: |
          git diff --name-only 8526be4611290484ccaa8550969a013b408ff557 fe8b81350448dcdb6fb6ca423ecad81d2a6a4bef > /tmp/b09r-files.txt
          cat /tmp/b09r-files.txt
          test "$(wc -l < /tmp/b09r-files.txt | tr -d ' ')" = "7"
          git diff --check 8526be4611290484ccaa8550969a013b408ff557 fe8b81350448dcdb6fb6ca423ecad81d2a6a4bef
          echo "B09R_BOUNDED_PRODUCT_DIFF_PASS"

      - name: Prove route writer token schema workflow graph Twin MCFT untouched
        run: |
          git diff --exit-code 8526be4611290484ccaa8550969a013b408ff557 fe8b81350448dcdb6fb6ca423ecad81d2a6a4bef --             apps/server/db             apps/server/src/routes             apps/server/src/persistence             apps/server/src/runtime             apps/server/src/external_evidence             packages             config/auth             .github/workflows             docs/architecture/semantic_convergence/GEOX-PARALLEL-AUTHORITY-GRAPH-V1.json             docs/architecture/semantic_convergence/GEOX-B09-REPLACEMENT-READINESS-V1.json             docs/twin_kernel             docs/digital_twin             docker-compose.commercial_v1.yml
          echo "B09R_ROUTE_WRITER_TOKEN_SCHEMA_WORKFLOW_GRAPH_TWIN_MCFT_UNTOUCHED_PASS"

      - name: Server typecheck
        run: pnpm --filter @geox/server typecheck

      - name: Server build
        run: pnpm --filter @geox/server build

      - name: Prove validation did not mutate product
        run: |
          test "$(git rev-parse HEAD)" = "fe8b81350448dcdb6fb6ca423ecad81d2a6a4bef"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "B09R_VALIDATION_ONLY_NO_PRODUCT_MUTATION_PASS"

      - name: Marker
        run: |
          echo "B09R_EXACT_HEAD fe8b81350448dcdb6fb6ca423ecad81d2a6a4bef"
          echo "B09R_POLICY_AUTHORITY_ENFORCEMENT_PASS"

name: mcft-cap-09-production-owner-provisioning-bundle-postgres

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-production-owner-provisioning-bundle-postgres.yml'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_BUNDLE_POSTGRES_V1.ts'
      - 'apps/server/src/infra/mcft_cap09_phase5_service_principal_v1.ts'
      - 'docker/postgres/init/001_schema.sql'
      - 'apps/server/db/migrations/2026_07_09_mcft_cap_01_a0_persistence.sql'
      - 'apps/server/db/migrations/2026_07_10_mcft_cap_01_closure_remediation.sql'
      - 'apps/server/db/migrations/2026_08_25_mcft_cap_09_v13_forcing_base_continuity.sql'
      - 'apps/server/db/migrations/2026_08_25_mcft_cap_09_v13_forcing_controller_admission.sql'
      - 'apps/server/db/migrations/2026_08_25_mcft_cap_09_v13_forcing_controller_lifecycle.sql'
      - 'apps/server/db/migrations/2026_08_27_mcft_cap_09_phase3_evidence_runtime_acl.sql'
      - 'apps/server/db/migrations/2026_08_27_mcft_cap_09_phase4_twin_runtime_acl.sql'
      - 'apps/server/db/migrations/2026_08_27_mcft_cap_09_phase5_twin_fact_writer_acl.sql'
      - 'apps/server/db/migrations/2026_08_28_mcft_cap_09_v13_evidence_runtime_fenced_promotion_acl.sql'

permissions:
  contents: read

jobs:
  provisioning-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcft_cap09_owner_provisioning_bundle
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mcft_cap09_owner_provisioning_bundle"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mcft_cap09_owner_provisioning_bundle
      MCFT_CAP09_OWNER_PROVISIONING_BUNDLE_DESTRUCTIVE_ACCEPTANCE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prove exact provisioning bundle on isolated PostgreSQL
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_BUNDLE_POSTGRES_V1.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap09-production-owner-provisioning-bundle-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/MCFT_CAP_09_PRODUCTION_OWNER_PROVISIONING_BUNDLE_POSTGRES_V1_RESULT.json
          if-no-files-found: error
          retention-days: 90

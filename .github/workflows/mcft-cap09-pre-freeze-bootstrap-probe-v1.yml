name: mcft-cap09-pre-freeze-bootstrap-probe-v1

# PRE-FREEZE diagnostic only.
# This workflow does not produce qualification evidence and must not be used for
# Formal-v5 arm, A0/O00 authorization, production cutover, or CAP-09 closure.
# Its sole purpose is to isolate the object-store/PostgreSQL bootstrap blocker
# before the accelerated Runtime hardening lane is allowed to continue.

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap09-pre-freeze-bootstrap-probe-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Probe current Quay MinIO server exact ref
        id: quay_server_exact
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          docker pull quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e

      - name: Probe current Quay MinIO client exact ref
        id: quay_client_exact
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          docker pull quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727

      - name: Probe Docker Hub MinIO server exact ref
        id: dockerhub_server_exact
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          docker pull docker.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e

      - name: Probe Docker Hub MinIO client exact ref
        id: dockerhub_client_exact
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          docker pull docker.io/minio/mc@sha256:eb4ea9884b77704230e2423e9004d2fa738dc272876b9cc41a297d29443b8780

      - name: Probe Docker Hub MinIO server floating hardening ref
        id: dockerhub_server_latest
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          docker pull docker.io/minio/minio:latest
          docker image inspect docker.io/minio/minio:latest --format '{{json .RepoDigests}}'

      - name: Probe Docker Hub MinIO client floating hardening ref
        id: dockerhub_client_latest
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          docker pull docker.io/minio/mc:latest
          docker image inspect docker.io/minio/mc:latest --format '{{json .RepoDigests}}'

      - name: Prove known-working GHCR source-built MinIO path
        id: ghcr_source
        shell: bash
        run: |
          set -euo pipefail
          image='ghcr.io/golithus/minio:RELEASE.2025-10-15T17-29-55Z'
          docker pull "$image"
          docker image inspect "$image" --format '{{json .RepoDigests}}'
          docker rm -f mcft-cap09-pre-freeze-minio >/dev/null 2>&1 || true
          docker run -d --name mcft-cap09-pre-freeze-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=probeadmin \
            -e MINIO_ROOT_PASSWORD=probeadmin-secret-001 \
            "$image" server /data
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs mcft-cap09-pre-freeze-minio
          exit 1

      - name: Prove S3 bucket administration without MinIO client image
        id: s3_admin
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: probeadmin
          AWS_SECRET_ACCESS_KEY: probeadmin-secret-001
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          aws --version
          aws --endpoint-url http://127.0.0.1:9000 s3api create-bucket \
            --bucket mcft-cap09-pre-freeze-probe
          aws --endpoint-url http://127.0.0.1:9000 s3api head-bucket \
            --bucket mcft-cap09-pre-freeze-probe

      - name: Prove isolated PostgreSQL 16 bootstrap
        id: postgres16
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f mcft-cap09-pre-freeze-postgres >/dev/null 2>&1 || true
          docker run -d --name mcft-cap09-pre-freeze-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=phase5-postgres-24t \
            -e POSTGRES_DB=geox_mcft_cap09_phase5_24t \
            postgres:16
          for attempt in $(seq 1 30); do
            if docker exec mcft-cap09-pre-freeze-postgres \
              pg_isready -U postgres -d geox_mcft_cap09_phase5_24t >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs mcft-cap09-pre-freeze-postgres
          exit 1

      - name: Emit bootstrap frontier summary
        if: always()
        shell: bash
        env:
          QUAY_SERVER_EXACT: ${{ steps.quay_server_exact.outcome }}
          QUAY_CLIENT_EXACT: ${{ steps.quay_client_exact.outcome }}
          DOCKERHUB_SERVER_EXACT: ${{ steps.dockerhub_server_exact.outcome }}
          DOCKERHUB_CLIENT_EXACT: ${{ steps.dockerhub_client_exact.outcome }}
          DOCKERHUB_SERVER_LATEST: ${{ steps.dockerhub_server_latest.outcome }}
          DOCKERHUB_CLIENT_LATEST: ${{ steps.dockerhub_client_latest.outcome }}
          GHCR_SOURCE: ${{ steps.ghcr_source.outcome }}
          S3_ADMIN: ${{ steps.s3_admin.outcome }}
          POSTGRES16: ${{ steps.postgres16.outcome }}
        run: |
          cat <<EOF
          MCFT_CAP09_PRE_FREEZE_BOOTSTRAP_PROBE_V1
          quay_server_exact=$QUAY_SERVER_EXACT
          quay_client_exact=$QUAY_CLIENT_EXACT
          dockerhub_server_exact=$DOCKERHUB_SERVER_EXACT
          dockerhub_client_exact=$DOCKERHUB_CLIENT_EXACT
          dockerhub_server_latest=$DOCKERHUB_SERVER_LATEST
          dockerhub_client_latest=$DOCKERHUB_CLIENT_LATEST
          ghcr_source=$GHCR_SOURCE
          s3_admin=$S3_ADMIN
          postgres16=$POSTGRES16
          EOF

      - name: Cleanup isolated probe containers
        if: always()
        shell: bash
        run: |
          docker rm -f mcft-cap09-pre-freeze-minio >/dev/null 2>&1 || true
          docker rm -f mcft-cap09-pre-freeze-postgres >/dev/null 2>&1 || true

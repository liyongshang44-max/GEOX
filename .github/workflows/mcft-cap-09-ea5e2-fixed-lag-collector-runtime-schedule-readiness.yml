name: mcft-cap-09-ea5e2-fixed-lag-collector-runtime-schedule-readiness

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-ea5e2-fixed-lag-collector-runtime-schedule-readiness.yml'
      - 'apps/server/src/runtime/twin_runtime/assimilated_continuation_evidence_window_v2.ts'
      - 'apps/server/src/runtime/twin_runtime/continuation_evidence_window_service_v1.ts'
      - 'apps/server/src/runtime/twin_runtime/external_formal_cap04_candidate_execution_service_v1.ts'
      - 'apps/server/src/runtime/twin_runtime/fixed_lag_scheduler_adapter_v1.ts'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_EXACT_INTERVAL_LATE_CUTOFF_SEAM.ts'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_FIXED_LAG_SCHEDULER_SEAM.ts'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_FIXED_LAG_COLLECTOR_RUNTIME_SCHEDULE_READINESS.cjs'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA5E2-FIXED-LAG-COLLECTOR-RUNTIME-SCHEDULE-V1.json'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA5E2-COLLECTOR-RUNTIME-SCHEDULE-READINESS-V1.json'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: mcft-cap09-ea5e2-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  ea5e2-fixed-lag-collector-runtime-schedule-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve exact EA5E2 base and subject
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "subject_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_sha=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
            echo "subject_sha=${{ github.event.merge_group.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify EA5E2 remains pre-window and pre-deadline
        shell: node {0}
        run: |
          const deadline=Date.parse('2026-08-11T05:00:00.000Z');
          const o00=Date.parse('2026-08-11T17:00:00.000Z');
          if(Date.now()>=deadline) throw new Error('EA5E2_READINESS_DEADLINE_ALREADY_PASSED');
          if(Date.now()>=o00) throw new Error('EA5E2_O00_ALREADY_PASSED');
          console.log(JSON.stringify({status:'PASS',deadline:'2026-08-11T05:00:00.000Z',o00:'2026-08-11T17:00:00.000Z'}));

      - name: Install exact repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck server after additive fixed-lag seams
        shell: bash
        run: |
          set -o pipefail
          mkdir -p acceptance-output
          pnpm --filter @geox/server run typecheck 2>&1 | tee acceptance-output/EA5E2_SERVER_TYPECHECK.log

      - name: Prove default-zero and External-7h scheduler eligibility
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_FIXED_LAG_SCHEDULER_SEAM.ts 2>&1 | tee acceptance-output/EA5E2_FIXED_LAG_SCHEDULER_SEAM.log

      - name: Prove rain ET0 late cutoff without weakening pre-T evidence
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_EXACT_INTERVAL_LATE_CUTOFF_SEAM.ts 2>&1 | tee acceptance-output/EA5E2_EXACT_INTERVAL_LATE_CUTOFF_SEAM.log

      - name: Re-prove historical CAP02 Evidence Window defaults
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_02_EVIDENCE_WINDOW.ts

      - name: Re-prove External CAP04 orchestration compatibility
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5B5C_EXTERNAL_CAP04_ORCHESTRATION.ts

      - name: Install pinned live-source decoder stack
        run: |
          python -m pip install --disable-pip-version-check \
            'eccodes==2.47.0' \
            'eccodeslib==2.47.3.23' \
            'numpy==1.26.4' \
            'refet==0.4.2'
          python -m eccodes selfcheck

      - name: Syntax-check live provider probe and EA5E2 gate
        run: |
          python -m py_compile scripts/runtime_acceptance/PROBE_MCFT_CAP_09_EA4_LIVE_SOURCE_EXACT_HEAD_QUALIFICATION.py
          node --check scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_FIXED_LAG_COLLECTOR_RUNTIME_SCHEDULE_READINESS.cjs

      - name: Exact-head live KBS and GFS readiness reproof
        env:
          MCFT_SUBJECT_SHA: ${{ steps.authority.outputs.subject_sha }}
        run: python scripts/runtime_acceptance/PROBE_MCFT_CAP_09_EA4_LIVE_SOURCE_EXACT_HEAD_QUALIFICATION.py

      - name: Validate EA5E2 fixed-lag schedule and implementation readiness
        env:
          MCFT_BASE_SHA: ${{ steps.authority.outputs.base_sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_FIXED_LAG_COLLECTOR_RUNTIME_SCHEDULE_READINESS.cjs

      - name: Upload immutable EA5E2 readiness proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-ea5e2-fixed-lag-readiness-${{ steps.authority.outputs.subject_sha }}
          path: |
            acceptance-output/EA5E2_SERVER_TYPECHECK.log
            acceptance-output/EA5E2_FIXED_LAG_SCHEDULER_SEAM.log
            acceptance-output/EA5E2_EXACT_INTERVAL_LATE_CUTOFF_SEAM.log
            acceptance-output/MCFT_CAP_09_EA4_LIVE_SOURCE_EXACT_HEAD_QUALIFICATION_RESULT.json
            acceptance-output/MCFT_CAP_09_EA5E2_FIXED_LAG_COLLECTOR_RUNTIME_SCHEDULE_READINESS_GOVERNANCE_RESULT.json
            docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA5E2-FIXED-LAG-COLLECTOR-RUNTIME-SCHEDULE-V1.json
            docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA5E2-COLLECTOR-RUNTIME-SCHEDULE-READINESS-V1.json
          if-no-files-found: warn
          retention-days: 90

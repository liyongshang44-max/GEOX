name: mcft-cap-08-s6-formal-cross-run-comparator-replacement-002-authority-effectiveness

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-08-s6-formal-cross-run-comparator-replacement-002-authority-effectiveness.yml'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-FORMAL-CROSS-RUN-COMPARATOR-REPLACEMENT-002-EXECUTION-AUTHORITY-EFFECTIVE-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-FORMAL-CROSS-RUN-COMPARATOR-REPLACEMENT-002-AUTHORITY-EFFECTIVENESS-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-FORMAL-CROSS-RUN-COMPARATOR-REPLACEMENT-002-AUTHORITY-EFFECTIVENESS-BOUNDARY-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_FORMAL_CROSS_RUN_COMPARATOR_REPLACEMENT_002_AUTHORITY_EFFECTIVENESS_V1.cjs'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: read

concurrency:
  group: mcft-cap08-s6-formal-comparator-replacement-002-effectiveness-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  authority-effectiveness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Replacement-002 effectiveness head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 20.11.1
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.1

      - name: Audit exact Replacement-002 candidate qualification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance-input
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'mcft-cap08-comparator-replacement-002-effectiveness',
          }

          def get(path):
              request = urllib.request.Request(f'https://api.github.com/repos/{repo}{path}', headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          run = get('/actions/runs/30897919642')
          artifacts = get('/actions/runs/30897919642/artifacts?per_page=100').get('artifacts', [])
          artifact = next((item for item in artifacts if item.get('id') == 8887810823), None)
          if artifact is None:
              raise SystemExit('REPLACEMENT_002_CANDIDATE_ARTIFACT_NOT_FOUND')
          result = {
              'schema_version': 'geox_mcft_cap08_s6_formal_comparator_replacement_002_effectiveness_input_audit_v1',
              'status': 'PASS',
              'candidate_qualification': {
                  'workflow_run_id': run.get('id'),
                  'workflow_run_attempt': run.get('run_attempt'),
                  'event': run.get('event'),
                  'conclusion': run.get('conclusion'),
                  'head_sha': run.get('head_sha'),
                  'artifact_id': artifact.get('id'),
                  'artifact_digest': artifact.get('digest'),
              },
          }
          with open('acceptance-input/FORMAL_COMPARATOR_REPLACEMENT_002_EFFECTIVENESS_INPUT_AUDIT.json', 'w', encoding='utf-8') as handle:
              json.dump(result, handle, indent=2)
              handle.write('\n')
          print(json.dumps(result, indent=2))
          PY

      - name: Validate Replacement-002 formal comparator authority effectiveness
        env:
          MCFT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          MCFT_COMPARATOR_REPLACEMENT_EFFECTIVENESS_AUDIT: acceptance-input/FORMAL_COMPARATOR_REPLACEMENT_002_EFFECTIVENESS_INPUT_AUDIT.json
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_FORMAL_CROSS_RUN_COMPARATOR_REPLACEMENT_002_AUTHORITY_EFFECTIVENESS_V1.cjs

      - name: Upload Replacement-002 comparator effectiveness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap-08-s6-formal-comparator-replacement-002-authority-effectiveness-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: |
            acceptance-output/MCFT_CAP_08_S6_FORMAL_COMPARATOR_REPLACEMENT_002_AUTHORITY_EFFECTIVENESS_RESULT.json
            acceptance-input/FORMAL_COMPARATOR_REPLACEMENT_002_EFFECTIVENESS_INPUT_AUDIT.json
          if-no-files-found: error
          retention-days: 365

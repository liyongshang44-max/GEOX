name: MCFT CAP-09 T4R1 Current-Crop Refresh

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mcft-cap-09-t4r1-current-crop-refresh-v1.yml'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-T4R1-CURRENT-CROP-REFRESH-REQUEST-2026-09-04T04Z-V1.json'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-T4R1-EFFECTIVE-CURRENT-CROP-AUTHORITY-2026-09-04T04Z-V1.json'
      - 'scripts/runtime_acceptance/BUILD_MCFT_CAP_09_EFFECTIVE_CURRENT_CROP_AUTHORITY_REFRESH_V1.cjs'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_T4R1_CURRENT_CROP_REFRESH_V1.cjs'

permissions:
  contents: read

concurrency:
  group: mcft-cap09-t4r1-current-crop-refresh-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QUALIFIED_SUBJECT_SHA: 811101cc958ce6b83efce610bde11b3266ae8326
      REQUEST: docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-T4R1-CURRENT-CROP-REFRESH-REQUEST-2026-09-04T04Z-V1.json
      PREVIOUS: docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-T4R1-EFFECTIVE-CURRENT-CROP-AUTHORITY-V1.json
      CERT: docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-BIOLOGICAL-STAGE-ARCHITECTURE-EFFECTIVENESS-V1.json
      PERSISTED: docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-T4R1-EFFECTIVE-CURRENT-CROP-AUTHORITY-2026-09-04T04Z-V1.json
    steps:
      - name: Checkout exact successor subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.1

      - name: Fetch current protected main
        run: git fetch --no-tags origin main

      - name: Preserve exact protected-main qualification base
        shell: node {0}
        run: |
          const fs=require('fs');
          const cp=require('child_process');
          const req=JSON.parse(fs.readFileSync(process.env.REQUEST,'utf8'));
          const main=cp.execFileSync('git',['rev-parse','origin/main'],{encoding:'utf8'}).trim();
          if(req.protected_main_base_sha!==main) throw new Error(`REFRESH_BASE_DRIFT:${req.protected_main_base_sha}!=${main}`);
          cp.execFileSync('git',['merge-base','--is-ancestor',process.env.QUALIFIED_SUBJECT_SHA,'HEAD']);
          if(req.status!=='QUALIFICATION_ONLY_REQUESTED') throw new Error('REFRESH_REQUEST_STATUS_INVALID');
          if(req.qualification_policy?.production_runtime_host_may_be_github_actions!==false) throw new Error('REFRESH_GITHUB_PRODUCTION_HOST_FORBIDDEN_REQUIRED');
          for(const [key,value] of Object.entries(req.non_effects||{})) if(value!==false) throw new Error('REFRESH_NON_EFFECT_DRIFT:'+key);
          console.log(JSON.stringify({status:'PASS',main,qualified_subject_sha:process.env.QUALIFIED_SUBJECT_SHA,successor_preservation:true}));

      - name: Prove running V1 mount inputs remain byte-identical to protected main
        run: git diff --exit-code origin/main -- "$PREVIOUS" "$CERT"

      - name: Syntax-check rolling refresh builder
        run: node --check scripts/runtime_acceptance/BUILD_MCFT_CAP_09_EFFECTIVE_CURRENT_CROP_AUTHORITY_REFRESH_V1.cjs

      - name: Validate persisted rolling current-crop authority
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_T4R1_CURRENT_CROP_REFRESH_V1.cjs

      - name: Validate qualification-only authority ceiling and zero production effects
        shell: node {0}
        run: |
          const fs=require('fs');
          const current=JSON.parse(fs.readFileSync(process.env.PERSISTED,'utf8'));
          for(const key of [
            'runtime_config_write_authorized',
            'database_write_authorized',
            'scheduler_write_authorized',
            'formal_evidence_write_authorized',
            'production_runtime_start_authorized',
            'production_owner_activation_authorized',
            'formal_v5_authorized',
            'a0_authorized',
            'o00_o23_authorized',
            'mcft_cap09_completed'
          ]) if(current[key]!==false) throw new Error('REFRESH_AUTHORITY_CEILING_DRIFT:'+key);
          if(current.refresh?.running_preformal_mount_replaced!==false) throw new Error('REFRESH_RUNNING_MOUNT_REPLACEMENT_FORBIDDEN');
          if(current.refresh?.production_runtime_restarted!==false) throw new Error('REFRESH_PRODUCTION_RESTART_FORBIDDEN');
          console.log(JSON.stringify({status:'PASS',qualification_only:true,production_runtime_restarted:false,running_mount_replaced:false}));

      - name: Upload immutable preservation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-t4r1-current-crop-refresh-preservation-${{ github.event.pull_request.head.sha }}
          path: |
            docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-T4R1-CURRENT-CROP-REFRESH-REQUEST-2026-09-04T04Z-V1.json
            docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-T4R1-EFFECTIVE-CURRENT-CROP-AUTHORITY-2026-09-04T04Z-V1.json
          if-no-files-found: error
          retention-days: 90

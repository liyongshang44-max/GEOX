name: mcft-cap-09-ea1n-gfs-value-extraction-authority

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-ea1n-gfs-value-extraction-authority.yml'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA1N-GFS-VALUE-EXTRACTION-AUTHORITY-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA1N_GFS_VALUE_EXTRACTION_AUTHORITY.cjs'
      - 'scripts/runtime_acceptance/PROBE_MCFT_CAP_09_EA1N_GFS_VALUE_EXTRACTION_AUTHORITY.py'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: mcft-cap09-ea1n-gfs-values-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  gfs-value-extraction-authority-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned ecCodes decoder supply chain
        run: |
          python -m pip install --upgrade 'pip<26'
          python -m pip install 'eccodes==2.47.0' 'eccodeslib==2.47.3.23'
          python -m pip freeze | grep -E '^(eccodes|eccodeslib)=='
      - name: Self-check ecCodes binary binding
        run: python -m eccodes selfcheck
      - name: Resolve exact probe base and subject
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "subject_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "base_sha=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
            echo "subject_sha=${{ github.event.merge_group.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_sha=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
            echo "subject_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate exact EA1N no-write governance boundary
        env:
          MCFT_BASE_SHA: ${{ steps.authority.outputs.base_sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA1N_GFS_VALUE_EXTRACTION_AUTHORITY.cjs
      - name: Syntax-check pinned decoder probe
        run: python -m py_compile scripts/runtime_acceptance/PROBE_MCFT_CAP_09_EA1N_GFS_VALUE_EXTRACTION_AUTHORITY.py
      - name: Diagnose DSWRF statistical family without forecast values
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import math
          from datetime import datetime, timezone

          path = 'scripts/runtime_acceptance/PROBE_MCFT_CAP_09_EA1N_GFS_VALUE_EXTRACTION_AUTHORITY.py'
          spec = importlib.util.spec_from_file_location('ea1n_probe', path)
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)

          def magnitude_bucket(value):
              x = abs(float(value))
              if x < 1e-6: return 'LT_1E_6_WM2'
              if x < 1e-4: return 'LT_1E_4_WM2'
              if x < 1e-2: return 'LT_1E_2_WM2'
              if x < 1e-1: return 'LT_1E_1_WM2'
              if x < 1: return 'LT_1_WM2'
              if x < 10: return 'LT_10_WM2'
              if x < 100: return 'LT_100_WM2'
              return 'GE_100_WM2'

          tick = m.floor_utc_hour(datetime.now(timezone.utc))
          selected = m.select_complete_cycle(tick)
          cache = {}

          def records_for(lead):
              if lead not in cache:
                  status, _headers, body, final_url = m.request_bytes(m.filter_url(selected['cycle'], lead), timeout=90, attempts=3)
                  if status != 200:
                      raise RuntimeError(f'DIAG_FILTER_HTTP_{status}:F{lead:03d}')
                  records, _extras = m.decode_subset(body, selected['cycle'], lead)
                  cache[lead] = records
              return cache[lead]

          diagnostic = {
              'schema_version': 'geox_mcft_cap09_ea1n_dswrf_no_value_diagnostic_v1',
              'tick_utc': m.iso(tick),
              'selected_cycle': m.iso(selected['cycle']),
              'lead_start': selected['lead_start'],
              'lead_end': selected['lead_end'],
              'forecast_values_emitted': False,
              'normalized_values_emitted': False,
              'first_failure': None,
          }

          for lead in range(selected['lead_start'], selected['lead_end'] + 1):
              records = records_for(lead)
              candidates = [r for r in records if r['role'] == 'DOWNWARD_SHORTWAVE_SURFACE']
              ds = m.find_dswrf_average(records, lead)
              start = m.rolling_start(lead)
              length = lead - start
              if length == 1:
                  hourly = ds['value']
                  prev = None
              else:
                  prev_records = records_for(lead - 1)
                  prev = m.find_dswrf_average(prev_records, lead - 1)
                  hourly = length * ds['value'] - (length - 1) * prev['value']
              if (not math.isfinite(hourly)) or not (0 <= hourly <= 1600):
                  diagnostic['first_failure'] = {
                      'lead': lead,
                      'block_start': start,
                      'window_length_hours': length,
                      'derived_sign': 'NEGATIVE' if hourly < 0 else ('ABOVE_MAX' if hourly > 1600 else 'NONFINITE'),
                      'derived_magnitude_bucket': magnitude_bucket(hourly) if math.isfinite(hourly) else 'NONFINITE',
                      'current_average_is_zero': bool(ds['value'] == 0),
                      'previous_average_is_zero': None if prev is None else bool(prev['value'] == 0),
                      'current_vs_previous_average': None if prev is None else ('GT' if ds['value'] > prev['value'] else ('LT' if ds['value'] < prev['value'] else 'EQ')),
                      'candidate_count': len(candidates),
                      'candidate_metadata': [
                          {
                              'step_type': r['step_type'],
                              'start_step': r['start_step'],
                              'end_step': r['end_step'],
                              'units': r['units'],
                              'section4_sha256': r['section4_sha256'],
                              'section4_bytes': r['section4_bytes'],
                          }
                          for r in candidates
                      ],
                      'instant_candidate_count': sum(1 for r in candidates if r['step_type'] == 'instant'),
                      'average_candidate_count': sum(1 for r in candidates if r['step_type'] == 'avg'),
                      'previous_section4_sha256': None if prev is None else prev['section4_sha256'],
                  }
                  break

          print('EA1N_DSWRF_DIAGNOSTIC=' + json.dumps(diagnostic, sort_keys=True, separators=(',', ':')))
          PY
      - name: Decode and normalize exact 72h GFS input bundle
        env:
          MCFT_SUBJECT_SHA: ${{ steps.authority.outputs.subject_sha }}
        run: python scripts/runtime_acceptance/PROBE_MCFT_CAP_09_EA1N_GFS_VALUE_EXTRACTION_AUTHORITY.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap-09-ea1n-gfs-values-${{ steps.authority.outputs.subject_sha }}
          path: |
            acceptance-output/MCFT_CAP_09_EA1N_GFS_VALUE_EXTRACTION_AUTHORITY_GOVERNANCE_RESULT.json
            acceptance-output/MCFT_CAP_09_EA1N_GFS_VALUE_EXTRACTION_AUTHORITY_RESULT.json
          if-no-files-found: error
          retention-days: 90

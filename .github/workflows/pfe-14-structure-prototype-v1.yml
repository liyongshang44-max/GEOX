name: pfe-14-structure-prototype-v1

on:
  pull_request:
    paths:
      - 'docs/frontend-productization/prototypes/PFE-14-STRUCTURE-PROTOTYPE-V1.html'
      - 'docs/frontend-productization/PFE-14-STRUCTURE-PROTOTYPE-V1.md'
      - 'docs/frontend-productization/PFE-14-STRUCTURE-PROTOTYPE-V1.json'
      - 'scripts/frontend_acceptance/ACCEPTANCE_PFE_14_STRUCTURE_PROTOTYPE_V1.cjs'
      - '.github/workflows/pfe-14-structure-prototype-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure-prototype:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Revalidate prototype truth policy
        run: node scripts/frontend_acceptance/ACCEPTANCE_PFE_14_PROTOTYPE_TRUTH_MATRIX_V1.cjs

      - name: Validate structure prototype
        run: node scripts/frontend_acceptance/ACCEPTANCE_PFE_14_STRUCTURE_PROTOTYPE_V1.cjs

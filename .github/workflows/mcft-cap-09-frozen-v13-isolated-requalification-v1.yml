name: MCFT CAP-09 Frozen V13 isolated requalification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-frozen-v13-isolated-requalification-v1.yml'
      - 'docs/digital_twin/mcft/cap_09/*FROZEN-V13*'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-*.json'
      - 'scripts/governance_acceptance/*FROZEN_V13*'
      - 'scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_ALL_BLOCKERS_V1.cjs'
permissions:
  contents: read
  actions: read
jobs:
  qualification-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
      - name: Verify registered qualification runs and artifact identities
        shell: node {0}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const registry=JSON.parse(fs.readFileSync('docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-EVIDENCE-REGISTRY-V1.json'));
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'};
          const cache=new Map();
          async function get(p){if(!cache.has(p))cache.set(p,fetch('https://api.github.com/repos/'+process.env.REPO+p,{headers}).then(async r=>{assert(r.ok,'QUALIFICATION_GITHUB_QUERY_FAILED:'+r.status);return r.json();}));return cache.get(p);}
          async function verify(e){
            const s=e.run_snapshot,run=await get('/actions/runs/'+s.run_id),job=await get('/actions/jobs/'+s.job_id),artifact=await get('/actions/artifacts/'+s.artifact_id);
            assert.equal(run.conclusion,'success');assert.equal(run.head_sha,e.subject_sha);assert.equal(run.event,'pull_request');assert.equal(run.path,s.workflow_path);
            assert.equal(job.run_id,s.run_id);assert.equal(job.name,e.check_id);assert.equal(job.status,'completed');assert.equal(job.conclusion,'success');
            assert.equal(artifact.expired,false);assert.equal(artifact.name,s.artifact_name);assert.equal(artifact.digest,s.artifact_digest);assert.equal(artifact.workflow_run.id,s.run_id);assert.equal(artifact.workflow_run.head_sha,e.subject_sha);
          }
          Promise.all(registry.frozen_v13_requalification_v1.entries.map(verify)).then(()=>console.log('REGISTERED_ISOLATED_RUN_AND_ARTIFACT_IDENTITIES_VERIFIED')).catch(e=>{console.error(e);process.exitCode=1;});
      - name: Execute unchanged Frozen V13 acceptance in its original qualified source
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ] && { [ "${{ github.event.pull_request.number }}" = "3746" ] || [ "${{ github.event.pull_request.number }}" = "3747" ] || [ "${{ github.event.pull_request.number }}" = "3748" ] || [ "${{ github.event.pull_request.number }}" = "3749" ] || [ "${{ github.event.pull_request.number }}" = "3750" ] || [ "${{ github.event.pull_request.number }}" = "3751" ] || [ "${{ github.event.pull_request.number }}" = "3752" ] || [ "${{ github.event.pull_request.number }}" = "3753" ] || [ "${{ github.event.pull_request.number }}" = "3754" ]; }; then
            # This frozen zero-drift assertion is historical, not an assertion
            # that today's successor Runtime still has zero changed blobs.
            # #3748 and #3749 run this original acceptance ONLY in its pinned historical
            # checkout; current changed runtime remains subject to fresh
            # EA5E2 and the separate isolated matrix below.
            HISTORIC='3a803d703320c5dfb416c6b022767fd1fa1fccba'
            SCRIPT='scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_FROZEN_V13_REQUALIFICATION_V1.cjs'
            expected="$(git rev-parse "$HISTORIC:$SCRIPT")"
            actual="$(git rev-parse "HEAD:$SCRIPT")"
            test "$actual" = "$expected" || { echo "HOLD_FROZEN_V13_HISTORIC_ACCEPTANCE_SOURCE_CHANGED"; exit 1; }
            test "$expected" = '19659f3f7745a2fb4bb528c6552fb79041e3206f'
            root="$(mktemp -d)"
            historic="$root/historic"
            cleanup() {
              git worktree remove --force "$historic" >/dev/null 2>&1 || true
              rm -rf "$root"
            }
            trap cleanup EXIT
            git worktree add --detach "$historic" "$HISTORIC"
            (cd "$historic" && test "$(git rev-parse HEAD)" = "$HISTORIC" && node "$SCRIPT")
            echo "FROZEN_V13_ORIGINAL_ASSERTIONS_EXECUTED_ON_PINNED_HISTORIC_SUBJECT"
            echo "FROZEN_V13_CURRENT_ZERO_DRIFT_CLAIM=false"
          else
            node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_FROZEN_V13_REQUALIFICATION_V1.cjs
          fi
      - run: node scripts/governance_acceptance/VERIFY_MCFT_CAP_09_20261010_CROP_ADOPTION_SUCCESSOR_V1.cjs --historic-frozen
  isolated:
    name: ${{ matrix.check }}
    # Legacy frozen-identity matrix keeps original behavior outside the precise
    # successor integration; #3746 has separate native proof and #3747\n    # has independent exact-current-HEAD central QCP source-qualification proof.\n    # Do not replay destructive predecessor matrix as formal new-HEAD admission.
    if: github.event_name != 'pull_request' || (github.event.pull_request.number != 3746 && github.event.pull_request.number != 3747 && github.event.pull_request.number != 3749 && github.event.pull_request.number != 3750 && github.event.pull_request.number != 3751 && github.event.pull_request.number != 3752 && github.event.pull_request.number != 3753 && github.event.pull_request.number != 3754)
    needs: qualification-contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        check:
          - V13_AUTONOMOUS_FORCING_FOUNDATION
          - V13_HOLISTIC_SCHEMA
          - V13_NEXT_TICK_VIABILITY
          - EA5C1_DURABLE_RAW_RESTRICTED_INGRESS
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcft_cap09_isolated_qualification
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mcft_cap09_isolated_qualification"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mcft_cap09_isolated_qualification
      EA5C1_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mcft_cap09_isolated_qualification
      EA5C1_S3_ENDPOINT: http://127.0.0.1:9000
      EA5C1_S3_BUCKET: geox-mcft-cap09-formal-raw-v1
      EA5C1_S3_ACCESS_KEY: minioadmin
      EA5C1_S3_SECRET_KEY: minioadmin123
      CHECK_ID: ${{ matrix.check }}
      MCFT_CAP09_V13_FOUNDATION_DESTRUCTIVE_ACCEPTANCE: '1'
      MCFT_CAP09_V13_HOLISTIC_SCHEMA_DESTRUCTIVE_ACCEPTANCE: '1'
      MCFT_CAP09_V13_VIABILITY_DESTRUCTIVE_ACCEPTANCE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
          cache: pnpm
      - name: Reject production credentials and non-local test stores
        shell: node {0}
        run: |
          const assert=require('node:assert/strict');
          for(const [name,value] of Object.entries(process.env))
            if(/^GEOX_MCFTCAP09_|^GEOX_MCFT_CAP09_/.test(name)) assert(!value,'PRODUCTION_ENVIRONMENT_FORBIDDEN:'+name);
          for(const name of ['DATABASE_URL','EA5C1_DATABASE_URL']) {
            const u=new URL(process.env[name]);
            assert.equal(u.hostname,'127.0.0.1');
            assert.equal(u.pathname,'/mcft_cap09_isolated_qualification');
            assert.equal(u.username,'postgres');
          }
          assert.equal(process.env.EA5C1_S3_ENDPOINT,'http://127.0.0.1:9000');
      - run: pnpm install --frozen-lockfile
      - name: Start private isolated object store
        if: matrix.check == 'EA5C1_DURABLE_RAW_RESTRICTED_INGRESS'
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name frozen-v13-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin123 \
            ghcr.io/datalens-tech/minio:25.09@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e server /data
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null
          docker run --rm --network host --entrypoint /bin/sh \
            docker.io/apecloud/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727 \
            -c 'mc alias set isolated http://127.0.0.1:9000 minioadmin minioadmin123 && mc mb isolated/geox-mcft-cap09-formal-raw-v1 && mc anonymous set private isolated/geox-mcft-cap09-formal-raw-v1'
      - name: Run unchanged real PostgreSQL and private-store acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance-output
          case "$CHECK_ID" in
            V13_AUTONOMOUS_FORCING_FOUNDATION)
              pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_V13_AUTONOMOUS_FORCING_FOUNDATION.ts ;;
            V13_HOLISTIC_SCHEMA)
              pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_V13_HOLISTIC_SCHEMA_POSTGRES.ts ;;
            V13_NEXT_TICK_VIABILITY)
              pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_V13_NEXT_TICK_VIABILITY_POSTGRES.ts
              pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_V13_POST_COMMIT_ADJUDICATION_BOUNDARY.ts ;;
            EA5C1_DURABLE_RAW_RESTRICTED_INGRESS)
              pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5C1_SUCCESSOR_REPLAY_COMPLETE_INGRESS_V1.ts | tee acceptance-output/FROZEN_EA5C1_SUCCESSOR.log
              pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5C1_DURABLE_RAW_RESTRICTED_INGRESS.ts | tee acceptance-output/FROZEN_EA5C1_RETENTION.log
              test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/geox-mcft-cap09-formal-raw-v1/)" = 403 ;;
            *) exit 1 ;;
          esac
      - name: Record original Frozen V13 proof only in original compatible scope
        if: github.event_name != 'pull_request' || github.event.pull_request.number != 3748
        run: node scripts/governance_acceptance/RECORD_MCFT_CAP_09_FROZEN_V13_ISOLATED_EVIDENCE_V1.cjs "$CHECK_ID"
      - name: Record exact #3748 successor matrix result without false Frozen zero-drift claim
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 3748
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          "use strict";
          const assert=require("node:assert/strict"),fs=require("node:fs"),cp=require("node:child_process");
          const checks=["V13_AUTONOMOUS_FORCING_FOUNDATION","V13_HOLISTIC_SCHEMA","V13_NEXT_TICK_VIABILITY","EA5C1_DURABLE_RAW_RESTRICTED_INGRESS"];
          const check=process.env.CHECK_ID;
          assert(checks.includes(check),"HOLD_SUCCESSOR_MATRIX_CHECK_NOT_FROZEN_ID");
          assert.equal(process.env.PR_BASE_SHA,"d38a5b07a92a63c67fbe2fcc3982ff9b9491e5ac","HOLD_3748_BASE_CHANGED");
          const head=cp.execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim();
          assert.equal(head,process.env.PR_HEAD_SHA,"HOLD_3748_EXACT_HEAD_CHANGED");
          assert.equal(process.env.GITHUB_EVENT_NAME,"pull_request");
          assert.equal(process.env.MCFT_CAP09_V13_FOUNDATION_DESTRUCTIVE_ACCEPTANCE,"1");
          // The preceding physical PostgreSQL/private-store CI test step must
          // succeed for this record step to be reached. This receipt is NOT
          // historical Frozen V13 source requalification or formal physical proof.
          const fact={schema_version:"MCFT_CAP09_3748_SUCCESSOR_ISOLATED_REGRESSION_V1",
            check_id:check,source_head_sha:head,base_sha:process.env.PR_BASE_SHA,
            result:"PASS_CURRENT_SUCCESSOR_ISOLATED_TEST_ONLY",
            actual_isolated_test_step_completed:true,
            historical_frozen_v13_runtime_zero_drift_claim:false,
            historical_frozen_qualifications_reissued:false,
            formal_adoption_v2_authorized:false,permit_issued:false,
            permit_consumed:false,production_authorized:false,
            original_six_physical_stages_executed:0};
          fs.mkdirSync("acceptance-output",{recursive:true});
          fs.writeFileSync("acceptance-output/CAP09_3748_"+check+"_SUCCESSOR_MATRIX.json",JSON.stringify(fact)+"\n",{flag:"wx"});
          console.log(JSON.stringify({check_id:check,status:fact.result,historical_frozen_zero_drift:false}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-v13-${{ matrix.check }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: acceptance-output/
          if-no-files-found: error
      - name: Remove isolated object store
        if: always() && matrix.check == 'EA5C1_DURABLE_RAW_RESTRICTED_INGRESS'
        run: docker rm -f frozen-v13-minio || true

  current-successor-native:
    # Current-runtime qualification is distinct from Frozen V13 zero drift.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 3746 && github.head_ref == 'qualification/cap09-owner-frozen108-da9-composite-20261027'
    needs: qualification-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Authenticate current exact HEAD and original signed source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          node scripts/governance_acceptance/VERIFY_MCFT_CAP09_3746_CURRENT_COMPOSER_OWNER_REQUAL_V1.cjs --selftest
          node scripts/governance_acceptance/VERIFY_MCFT_CAP09_3746_CURRENT_PHASE3_OWNER_REQUAL_V1.cjs --selftest
          echo "CURRENT_RUNTIME_SUCCESSOR_NATIVE_SOURCE_VALID_HISTORICAL_FROZEN_V13_NOT_PROMOTED"

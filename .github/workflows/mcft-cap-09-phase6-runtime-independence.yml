            test "$(jq -r .terminal_slot_count "$GEOX_PHASE5_CONTROL_ROOT/twin-duplicate-proof.json")" = "4"
            test "$(jq -r .status "$GEOX_PHASE5_CONTROL_ROOT/twin-restart-proof.json")" = "PASS"
            test "$(jq -r .terminal_slot_count "$GEOX_PHASE5_CONTROL_ROOT/twin-restart-proof.json")" = "8"
            test "$(jq -r .durable_cursor_restart_recovery "$GEOX_PHASE5_CONTROL_ROOT/twin-restart-proof.json")" = "true"
            current_full_live=false
            twin_ticks=8
            twin_input_class="CONTROLLED_ENGINEERING_FIXTURE_NOT_FORMAL_EXTERNAL_EVIDENCE"
          fi

          provider_requests="$(jq -r .gfs_network_request_count "$GEOX_PHASE5_FIXTURE_ROOT/capture-proof.json")"
          jq -n \
            --arg subject "$GEOX_DEPLOYMENT_SUBJECT_COMMIT" \
            --arg phase5 "75d4961279bd64dc1c9dd7d68aac189c72c98846" \
            --arg mode "$mode" \
            --arg twin_input_class "$twin_input_class" \
            --argjson provider_requests "$provider_requests" \
            --argjson current_full_live "$current_full_live" \
            --argjson twin_ticks "$twin_ticks" \
            '{schema_version:"geox_mcft_cap09_phase6_runtime_independence_v1",status:"PASS",
              subject_sha:$subject,phase5_closure_head:$phase5,
              runtime_independence_execution_mode:$mode,
              same_phase5_production_process_graph_reused:true,
              phase5_exact_24t_predecessor_carried_forward:true,
              phase6_current_head_full_live_24t_claimed:$current_full_live,
              protected_semantic_surface_unchanged:true,
              github_control_plane_network_blackout_from_runtime_containers:true,
              github_runtime_credential_count:0,github_artifact_rehydration_count:0,
              live_provider_network_request_count:$provider_requests,
              current_head_live_evidence_ingress_fresh:true,
              evidence_ingress_progressed_during_github_blackout:true,
              evidence_restart_from_durable_authority:true,
              evidence_restart_authority:"EVIDENCE_SUPPLY_CURSOR",
              twin_runtime_progressed_during_github_blackout:true,
              twin_blackout_qualification_tick_count:$twin_ticks,
              twin_qualification_input_class:$twin_input_class,
              twin_restart_from_durable_authority:true,
              twin_restart_authority:"RUNTIME_TICK_CURSOR_AND_CANONICAL_CHECKPOINT",
              github_provider_request_count_during_formal:0,
              github_formal_twin_db_mutation_count:0,
              github_production_tick_execution_count:0,
              github_hourly_wake_dependency_count:0,
              runtime_provider_fallback:false,evidence_to_twin_mutation_crossing:false,
              production_container_activation:false,formal_v5_armed:false,mcft_cap09_completed:false}' \
            > "$GEOX_PHASE5_CONTROL_ROOT/phase6-runtime-independence-proof.json"

      - name: Upload Phase6 non-raw runtime-independence proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-phase6-runtime-independence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ env.GEOX_PHASE5_FIXTURE_ROOT }}/capture-proof.json
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/phase5-manifest.json
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/prepare-proof.json
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/verify-proof.json
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/workflow-proof.json
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/phase6-runtime-independence-proof.json
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/phase6-fixture-capture-github-blackout.json
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/phase6-evidence-runtime-github-blackout.json
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/phase6-twin-runtime-github-blackout.json
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/phase6-owner-audit.json
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/phase6-semantic-carry-forward-proof.json
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/evidence-resilience-proof.json
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/evidence-runtime-leader-restarted.log
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/evidence-runtime-standby-takeover.log
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/prepare.log
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/twin-duplicate-proof.json
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/twin-restart-proof.json
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/twin-focused-o00-o03-1.log
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/twin-focused-o00-o03-2.log
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/twin-focused-o04-o07.log
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/twin-o00-o07-1.log
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/twin-o00-o07-2.log
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/twin-o08-o23.log
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/verify.log
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/temporal-viability-proof.json
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/twin-fencing-seed-proof.json
            ${{ env.GEOX_PHASE5_CONTROL_ROOT }}/twin-fencing-seed.log
          if-no-files-found: warn
          retention-days: 90

      - name: Destroy qualification state and raw fixture
        if: always()
        shell: bash
        run: |
          set +e
          docker compose -f "$COMPOSE_FILE" -f "$PHASE6_OVERRIDE_FILE" --profile qualification-runtime --profile qualification-orchestration             down -v --remove-orphans
          sudo rm -rf "${GEOX_PHASE5_FIXTURE_ROOT:-}" "${GEOX_PHASE5_CONTROL_ROOT:-}"


  accepted-phase6-successor-sentinel:
    if: github.event.pull_request.base.sha != '75d4961279bd64dc1c9dd7d68aac189c72c98846'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PHASE6_ACCEPTED_HEAD: '48ceafe7c6e7d3d57a1dc17411fb4bf673486333'
      PHASE6_RUNTIME_RUN_ID: '33146391000'
      PHASE6_RUNTIME_ARTIFACT_ID: '9676455831'
      PHASE6_RUNTIME_ARTIFACT_DIGEST: 'sha256:9a3a22b8b844fc1538d4a6986a9d3477b895208b1e88cdf13106f0f0dbf463d7'
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact Phase6 successor subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require accepted Phase6 ancestry and no protected runtime drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          git merge-base --is-ancestor "$PHASE6_ACCEPTED_HEAD" "$SUBJECT_SHA"
          runtime_delta="$(git diff --name-only "$PHASE6_ACCEPTED_HEAD"..HEAD -- \
            apps/server/src \
            apps/server/scripts \
            apps/server/package.json \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            docker \
            docker-compose.mcft-cap09-phase5-qualification.yml \
            docker-compose.mcft-cap09-phase6-github-blackout.override.yml \
            scripts/runtime_acceptance/ADJUDICATE_MCFT_CAP_09_PHASE5_TEMPORAL_SETTLEMENT_V1.cjs \
            scripts/runtime_acceptance/SEED_MCFT_CAP_09_PHASE5_TWIN_FENCING_FIXTURE_V1.ts)"
          if [ -n "$runtime_delta" ]; then
            echo "PHASE6_SUCCESSOR_RUNTIME_REQUALIFICATION_REQUIRED" >&2
            printf '%s\n' "$runtime_delta" >&2
            exit 1
          fi

          mapfile -t db_delta < <(git diff --name-only "$PHASE6_ACCEPTED_HEAD"..HEAD -- apps/server/db/migrations | sort)
          allowed_acl='apps/server/db/migrations/2026_08_27_mcft_cap_09_phase3_evidence_runtime_acl.sql'
          if [ "${#db_delta[@]}" -gt 1 ] || { [ "${#db_delta[@]}" -eq 1 ] && [ "${db_delta[0]}" != "$allowed_acl" ]; }; then
            echo "PHASE6_SUCCESSOR_DATABASE_REQUALIFICATION_REQUIRED" >&2
            printf '%s\n' "${db_delta[@]}" >&2
            exit 1
          fi
          if [ "${#db_delta[@]}" -eq 1 ]; then
            acl="$(cat "$allowed_acl")"
            for table in \
              twin_external_formal_forcing_base_cursor_v1 \
              twin_external_formal_forcing_base_target_v1 \
              twin_external_formal_forcing_controller_lease_v1; do
              grep -Fq "$table" <<<"$acl"
            done
            grep -Fq 'TO geox_mcft_cap09_evidence_runtime_v1' <<<"$acl"
            test -z "$(git diff --name-only "$PHASE6_ACCEPTED_HEAD"..HEAD -- apps/server/db/migrations/2026_08_27_mcft_cap_09_phase4_twin_runtime_acl.sql)"
          fi

      - name: Verify immutable accepted Phase6 runtime artifact
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const runId=Number(process.env.PHASE6_RUNTIME_RUN_ID);
            const artifactId=Number(process.env.PHASE6_RUNTIME_ARTIFACT_ID);
            const run=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:runId})).data;
            if(run.conclusion!=='success'||run.head_sha!==process.env.PHASE6_ACCEPTED_HEAD)throw new Error('PHASE6_SUCCESSOR_ACCEPTED_RUN_INVALID');
            const artifact=(await github.rest.actions.getArtifact({owner,repo,artifact_id:artifactId})).data;
            if(artifact.expired||artifact.digest!==process.env.PHASE6_RUNTIME_ARTIFACT_DIGEST)throw new Error('PHASE6_SUCCESSOR_ACCEPTED_ARTIFACT_INVALID');

      - name: Require retired owner audit still passes
        run: node scripts/governance_acceptance/AUDIT_MCFT_CAP_09_PHASE6_GITHUB_PRODUCTION_OWNERS_V1.cjs enforce

      - name: Emit zero-effect Phase6 successor carry-forward proof
        shell: node {0}
        run: |
          const fs=require('node:fs'),cp=require('node:child_process');
          fs.mkdirSync('acceptance-output',{recursive:true});
          const dbDelta=cp.execFileSync('git',['diff','--name-only',process.env.PHASE6_ACCEPTED_HEAD+'..HEAD','--','apps/server/db/migrations'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const out={
            schema_version:'geox_mcft_cap09_phase6_successor_carry_forward_v1',
            status:'PASS',
            subject_sha:process.env.SUBJECT_SHA,
            accepted_phase6_head:process.env.PHASE6_ACCEPTED_HEAD,
            accepted_runtime_run_id:Number(process.env.PHASE6_RUNTIME_RUN_ID),
            accepted_runtime_artifact_id:Number(process.env.PHASE6_RUNTIME_ARTIFACT_ID),
            protected_runtime_delta_count:0,
            allowed_evidence_acl_delta_count:dbDelta.length,
            phase3_phase5_acl_requalification_required_on_acl_delta:true,
            phase6_runtime_reexecuted:false,
            immutable_phase6_evidence_verified:true,
            retired_owner_audit_passed:true,
            formal_v5_armed:false,
            production_effect:false,
            mcft_cap09_completed:false
          };
          fs.writeFileSync('acceptance-output/MCFT_CAP_09_PHASE6_SUCCESSOR_CARRY_FORWARD.json',JSON.stringify(out,null,2)+'\n');

      - name: Upload Phase6 successor carry-forward proof
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-phase6-successor-carry-forward-${{ env.SUBJECT_SHA }}
          path: acceptance-output/MCFT_CAP_09_PHASE6_SUCCESSOR_CARRY_FORWARD.json
          if-no-files-found: error
          retention-days: 90

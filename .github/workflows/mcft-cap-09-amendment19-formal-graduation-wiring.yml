name: mcft-cap-09-amendment19-formal-graduation-wiring

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-amendment19-formal-graduation-wiring.yml'
      - 'scripts/governance_acceptance/CLASSIFY_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_GRADUATION_TRIGGER_V1.cjs'
      - 'scripts/governance_acceptance/ASSEMBLE_MCFT_CAP_09_AMENDMENT_19_FORMAL_GRADUATION_INPUT_V1.cjs'
      - 'scripts/governance_acceptance/ASSEMBLE_MCFT_CAP_09_AMENDMENT_19_FORMAL_GRADUATION_ENVELOPE_V1.cjs'
  workflow_run:
    workflows: ['mcft-cap-09-t4r1-amendment19-persistent-24t-qualification']
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: mcft-cap09-am19-formal-graduation-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'live-main' }}
  cancel-in-progress: false

jobs:
  static-proof:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact PR checkout without historical two-file assumptions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "${{ github.event.pull_request.base.ref }}" = 'main'

      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'

      - name: Fail-closed graduation input assembler selftest
        run: node scripts/governance_acceptance/ASSEMBLE_MCFT_CAP_09_AMENDMENT_19_FORMAL_GRADUATION_INPUT_V1.cjs --selftest

      - name: Fresh versus idempotent read-only trigger classifier selftest
        run: node scripts/governance_acceptance/CLASSIFY_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_GRADUATION_TRIGGER_V1.cjs --selftest

      - name: Immutable cross-run graduation envelope selftest
        run: node scripts/governance_acceptance/ASSEMBLE_MCFT_CAP_09_AMENDMENT_19_FORMAL_GRADUATION_ENVELOPE_V1.cjs --selftest

      - name: Existing Formal epoch machine gate selftest
        run: node scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_FORMAL_EPOCH_GRADUATION_GATE_V1.cjs --selftest

      - name: Reprove exact-subject production cutover and shared canonical core
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_AMENDMENT19_PERSISTENT_PRODUCTION_CUTOVER.cjs

      - name: Require static proof remains non-Formal
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_AMENDMENT19_PERSISTENT_PRODUCTION_CUTOVER_RESULT.json','utf8'));
          if(p.status!=='PASS'||p.shared_canonical_core_bound!==true||p.provider_wait_authorized!==false||p.persistent_24t_claimed!==false||p.future_formal_epoch_selected!==false||p.formal_effect!==false) throw new Error('AM19_GRADUATION_WIRING_CUTOVER_PROOF_REQUIRED');

      - name: Require T4R1 trigger and idempotent read-only qualification boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "workflows: ['mcft-cap-09-t4r1-amendment19-persistent-24t-qualification']" .github/workflows/mcft-cap-09-amendment19-formal-graduation-wiring.yml
          grep -Fq 'mcft-cap09-t4r1-am19-persistent24-' .github/workflows/mcft-cap-09-amendment19-formal-graduation-wiring.yml
          grep -Fq "CLASSIFY_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_GRADUATION_TRIGGER_V1.cjs" .github/workflows/mcft-cap-09-amendment19-formal-graduation-wiring.yml
          grep -Fq "formal-graduation-readonly-" .github/workflows/mcft-cap-09-amendment19-formal-graduation-wiring.yml

  live-formal-gate-preflight:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUBJECT_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout exact persistent qualification subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require triggering subject is still exact protected main
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.workflow_run.id }}" -gt 0
          test "${{ github.event.workflow_run.head_branch }}" = 'main'
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA" || { echo 'AM19_GRADUATION_WIRING_CHECKOUT_SUBJECT_DRIFT' >&2; exit 1; }
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$SUBJECT_SHA" || { echo 'AM19_GRADUATION_WIRING_PROTECTED_MAIN_DRIFT' >&2; exit 1; }

      - name: Resolve exactly one triggering persistent artifact identity
        id: source-artifact
        uses: actions/github-script@v7
        with:
          script: |
            const runId = Number(context.payload.workflow_run.id);
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: runId, per_page: 100 });
            const prefix = `mcft-cap09-t4r1-am19-persistent24-${process.env.SUBJECT_SHA}-`;
            const matches = response.data.artifacts.filter(a => !a.expired && a.name.startsWith(prefix));
            if (matches.length !== 1) throw new Error(`AM19_GRADUATION_EXACT_ONE_SOURCE_ARTIFACT_REQUIRED:${matches.length}`);
            const artifact = matches[0];
            if (!/^sha256:[0-9a-f]{64}$/.test(String(artifact.digest || ''))) throw new Error('AM19_GRADUATION_SOURCE_ARTIFACT_DIGEST_REQUIRED');
            core.setOutput('artifact_id', String(artifact.id));
            core.setOutput('artifact_name', artifact.name);
            core.setOutput('artifact_digest', artifact.digest);

      - name: Download only triggering persistent-run exact-subject evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          name: ${{ steps.source-artifact.outputs.artifact_name }}
          path: persistent-evidence

      - name: Require exact evidence file set from triggering run
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          persistent=$(find persistent-evidence -type f -name 'MCFT_CAP_09_AMENDMENT_19_PERSISTENT_24T_QUALIFICATION_RESULT.json' -print)
          engineering=$(find persistent-evidence -type f -name 'MCFT_CAP_09_AMENDMENT_19_PERSISTENCE_FREE_24T_RESULT.json' -print)
          rehydration=$(find persistent-evidence -type f -name 'MCFT_CAP_09_ROLLING_PREBOUNDARY_REHYDRATION.json' -print)
          test "$(printf '%s\n' "$persistent" | sed '/^$/d' | wc -l)" -eq 1 || { echo 'AM19_GRADUATION_WIRING_EXACT_ONE_PERSISTENT_RESULT_REQUIRED' >&2; exit 1; }
          test "$(printf '%s\n' "$engineering" | sed '/^$/d' | wc -l)" -eq 1 || { echo 'AM19_GRADUATION_WIRING_EXACT_ONE_ENGINEERING_RESULT_REQUIRED' >&2; exit 1; }
          test "$(printf '%s\n' "$rehydration" | sed '/^$/d' | wc -l)" -eq 1 || { echo 'AM19_GRADUATION_WIRING_EXACT_ONE_REHYDRATION_RESULT_REQUIRED' >&2; exit 1; }
          echo "persistent=$persistent" >> "$GITHUB_OUTPUT"
          echo "engineering=$engineering" >> "$GITHUB_OUTPUT"
          echo "rehydration=$rehydration" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'

      - name: Classify fresh qualification versus idempotent read-only replay
        id: qualification
        env:
          PERSISTENT_RESULT: ${{ steps.evidence.outputs.persistent }}
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const {spawnSync}=require('node:child_process');
          const output='acceptance-output/MCFT_CAP_09_AMENDMENT_19_PERSISTENT_GRADUATION_TRIGGER_CLASSIFICATION_V1.json';
          const run=spawnSync(process.execPath,[
            'scripts/governance_acceptance/CLASSIFY_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_GRADUATION_TRIGGER_V1.cjs',
            process.env.PERSISTENT_RESULT,process.env.SUBJECT_SHA,output
          ],{stdio:'inherit'});
          if(run.status!==0)process.exit(run.status||1);
          const result=JSON.parse(fs.readFileSync(output,'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`fresh_pass=${result.fresh_pass?'true':'false'}\nread_only=${result.read_only?'true':'false'}\n`);

      - name: Reprove production cutover on exact persistent subject
        if: steps.qualification.outputs.fresh_pass == 'true'
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_AMENDMENT19_PERSISTENT_PRODUCTION_CUTOVER.cjs

      - name: Assemble evidence-faithful Formal graduation input
        if: steps.qualification.outputs.fresh_pass == 'true'
        run: >-
          node scripts/governance_acceptance/ASSEMBLE_MCFT_CAP_09_AMENDMENT_19_FORMAL_GRADUATION_INPUT_V1.cjs
          "${{ steps.evidence.outputs.persistent }}"
          "${{ steps.evidence.outputs.engineering }}"
          "${{ steps.evidence.outputs.rehydration }}"
          acceptance-output/MCFT_CAP_09_AMENDMENT19_PERSISTENT_PRODUCTION_CUTOVER_RESULT.json
          "$SUBJECT_SHA"
          acceptance-output/MCFT_CAP_09_AMENDMENT_19_FORMAL_GRADUATION_INPUT_V1.json

      - name: Open existing machine-only Formal epoch gate
        if: steps.qualification.outputs.fresh_pass == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_FORMAL_EPOCH_GRADUATION_GATE_V1.cjs \
            acceptance-output/MCFT_CAP_09_AMENDMENT_19_FORMAL_GRADUATION_INPUT_V1.json \
            > acceptance-output/MCFT_CAP_09_AMENDMENT_19_FORMAL_EPOCH_GRADUATION_GATE_RESULT_V1.json

      - name: Require gate-open result has no Formal side effect
        if: steps.qualification.outputs.fresh_pass == 'true'
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const input=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_AMENDMENT_19_FORMAL_GRADUATION_INPUT_V1.json','utf8'));
          const gate=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_AMENDMENT_19_FORMAL_EPOCH_GRADUATION_GATE_RESULT_V1.json','utf8'));
          if(input.status!=='PASS'||input.subject_sha!==process.env.SUBJECT_SHA||input.static_blocker_count!==0) throw new Error('AM19_GRADUATION_WIRING_INPUT_NOT_PASS');
          if(input.same_canonical_core_engineering_and_production!==true||input.persistent_lane_uses_production_scheduler!==true||input.persistent_lane_uses_production_repositories!==true||input.persistent_lane_uses_production_lease_fencing!==true||input.persistent_lane_uses_production_runner!==true) throw new Error('AM19_GRADUATION_WIRING_EQUIVALENCE_PROOF_REQUIRED');
          if(input.future_formal_epoch_selected!==false||input.formal_o00_started!==false||input.mcft_cap09_completed!==false||input.final_actual_24h_still_required!==true) throw new Error('AM19_GRADUATION_WIRING_PREMATURE_FORMAL_EFFECT');
          if(gate.status!=='PASS'||gate.formal_epoch_creation_gate!=='OPEN'||gate.required_status_count!==13||gate.static_blocker_count!==0||gate.human_override_used!==false) throw new Error('AM19_GRADUATION_WIRING_GATE_NOT_OPEN');

      - name: Freeze source-run identity and machine gate-open time
        if: steps.qualification.outputs.fresh_pass == 'true'
        env:
          SOURCE_ARTIFACT_ID: ${{ steps.source-artifact.outputs.artifact_id }}
          SOURCE_ARTIFACT_NAME: ${{ steps.source-artifact.outputs.artifact_name }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.source-artifact.outputs.artifact_digest }}
          SOURCE_PERSISTENT_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: node {0}
        run: |
          const fs=require('node:fs');
          fs.mkdirSync('acceptance-output',{recursive:true});
          const metadata={
            source_persistent_workflow_run_id:Number(process.env.SOURCE_PERSISTENT_RUN_ID),
            source_persistent_artifact_id:Number(process.env.SOURCE_ARTIFACT_ID),
            source_persistent_artifact_name:process.env.SOURCE_ARTIFACT_NAME,
            source_persistent_artifact_digest:process.env.SOURCE_ARTIFACT_DIGEST,
            graduation_workflow_run_id:Number(process.env.GITHUB_RUN_ID),
            opened_at:new Date().toISOString(),
          };
          fs.writeFileSync('acceptance-output/MCFT_CAP_09_AMENDMENT_19_FORMAL_GRADUATION_METADATA_V1.json',JSON.stringify(metadata,null,2)+'\n');

      - name: Assemble immutable cross-run Formal graduation envelope
        if: steps.qualification.outputs.fresh_pass == 'true'
        run: >-
          node scripts/governance_acceptance/ASSEMBLE_MCFT_CAP_09_AMENDMENT_19_FORMAL_GRADUATION_ENVELOPE_V1.cjs
          "${{ steps.evidence.outputs.persistent }}"
          "${{ steps.evidence.outputs.engineering }}"
          "${{ steps.evidence.outputs.rehydration }}"
          acceptance-output/MCFT_CAP_09_AMENDMENT19_PERSISTENT_PRODUCTION_CUTOVER_RESULT.json
          acceptance-output/MCFT_CAP_09_AMENDMENT_19_FORMAL_GRADUATION_INPUT_V1.json
          acceptance-output/MCFT_CAP_09_AMENDMENT_19_FORMAL_EPOCH_GRADUATION_GATE_RESULT_V1.json
          "$SUBJECT_SHA"
          acceptance-output/MCFT_CAP_09_AMENDMENT_19_FORMAL_GRADUATION_METADATA_V1.json
          acceptance-output/MCFT_CAP_09_AMENDMENT_19_FORMAL_GRADUATION_ENVELOPE_V1.json

      - name: Require envelope remains machine-only and side-effect free
        if: steps.qualification.outputs.fresh_pass == 'true'
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_AMENDMENT_19_FORMAL_GRADUATION_ENVELOPE_V1.json','utf8'));
          if(p.status!=='PASS'||p.formal_epoch_creation_gate!=='OPEN'||p.subject_sha!==process.env.SUBJECT_SHA||p.machine_status_count!==13||p.static_blocker_count!==0||p.future_formal_epoch_selected!==false||p.formal_o00_started!==false||p.formal_database_write_count!==0||p.human_override_used!==false||p.mcft_cap09_completed!==false) throw new Error('AM19_GRADUATION_ENVELOPE_BOUNDARY_DRIFT');

      - name: Upload immutable machine-only graduation proof
        if: steps.qualification.outputs.fresh_pass == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-am19-formal-graduation-${{ env.SUBJECT_SHA }}-${{ github.run_id }}
          path: |
            acceptance-output/MCFT_CAP_09_AMENDMENT19_PERSISTENT_PRODUCTION_CUTOVER_RESULT.json
            acceptance-output/MCFT_CAP_09_AMENDMENT_19_FORMAL_GRADUATION_INPUT_V1.json
            acceptance-output/MCFT_CAP_09_AMENDMENT_19_FORMAL_EPOCH_GRADUATION_GATE_RESULT_V1.json
            acceptance-output/MCFT_CAP_09_AMENDMENT_19_FORMAL_GRADUATION_METADATA_V1.json
            acceptance-output/MCFT_CAP_09_AMENDMENT_19_FORMAL_GRADUATION_ENVELOPE_V1.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload idempotent read-only qualification proof
        if: steps.qualification.outputs.read_only == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-am19-formal-graduation-readonly-${{ env.SUBJECT_SHA }}-${{ github.run_id }}
          path: acceptance-output/MCFT_CAP_09_AMENDMENT_19_PERSISTENT_GRADUATION_TRIGGER_CLASSIFICATION_V1.json
          if-no-files-found: error
          retention-days: 90

name: mcft-cap-09-amendment19-persistent-24t-qualification

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-amendment19-persistent-24t-qualification.yml'
      - 'scripts/runtime_acceptance/MCFT_CAP_09_EA5E2_LIVE_PROVIDER_TWO_PHASE.py'
      - 'scripts/runtime_acceptance/MCFT_CAP_09_EA5E2_RUNTIME_DEPENDENCY_GRAPH_V4_BINDING.cjs'
      - 'scripts/runtime_acceptance/PREFLIGHT_MCFT_CAP_09_AMENDMENT_19_CROP_WINDOW_V1.cjs'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_AMENDMENT_19_CROP_WINDOW_PREFLIGHT_V1.cjs'
      - 'scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_24T_QUALIFICATION_V1.ts'
      - 'scripts/runtime_acceptance/RUN_MCFT_CAP_09_ROLLING_PREBOUNDARY_REHYDRATION_V1.ts'
      - 'scripts/runtime_acceptance/EXECUTE_MCFT_CAP_09_AM19_PHASE2_AUTHORITY_SYMBOL_COMPATIBILITY_V1.ts'
      - 'apps/server/src/domain/twin_runtime/external_formal_amendment19_window_manifest_v1.ts'
  workflow_run:
    workflows: ['mcft-cap-09-rolling-preboundary-capture']
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: mcft-cap09-am19-persistent24-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'live-main' }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20.11.1'
  PNPM_VERSION: '9.15.4'
  PYTHON_VERSION: '3.12'
  LOCAL_REHYDRATION_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55433/ea5e2_readiness

jobs:
  static-proof:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require governed qualification base and routing boundary
        id: routing
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          git fetch --no-tags origin main
          base_sha='${{ github.event.pull_request.base.sha }}'
          protected_main_sha="$(git rev-parse origin/main)"
          frozen_successor_sha='3bbf096ee5cb73e8e0e0251dc400733d6cab501f'
          phase1_successor_sha='8943c752a354cb916cc7f144681203aa9a19f70b'
          phase2_closure_sha='c3346768a44b16b127378cb690ada1d8cfec1049'
          phase3_closure_sha='0e874b254c695b32fd94c7dc7034fd71b8aa3bc3'
          phase4_closure_sha='16ff7160473c0a25dc059db6b2b6b7ba07f54dd1'
          phase2_compatibility_path='scripts/runtime_acceptance/EXECUTE_MCFT_CAP_09_AM19_PHASE2_AUTHORITY_SYMBOL_COMPATIBILITY_V1.ts'
          frozen_historical_runner='scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_24T_QUALIFICATION_V1.ts'
          frozen_historical_runner_blob='ae3e47593ef35cba08946427304a0d3271bb86e9'
          if [[ "$base_sha" != "$protected_main_sha" && "$base_sha" != "$frozen_successor_sha" && "$base_sha" != "$phase1_successor_sha" && "$base_sha" != "$phase2_closure_sha" && "$base_sha" != "$phase3_closure_sha" && "$base_sha" != "$phase4_closure_sha" ]]; then
            echo "AM19_P24_PR_BASE_NOT_GOVERNED:${base_sha}" >&2
            exit 1
          fi
          changed=$(git diff --name-only "$base_sha" "$SUBJECT_SHA" | sort)
          t4_runtime_rebind_files="$(printf '%s\n' \
            '.github/workflows/mcft-cap-09-ea5e2-rolling-operational-activation-live.yml' \
            '.github/workflows/mcft-cap-09-rolling-kbs-intersection.yml' \
            'apps/server/src/domain/twin_runtime/external_formal_bootstrap_authority_bundle_v1.ts' \
            'apps/server/src/domain/twin_runtime/external_formal_runtime_config_v1.ts' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA5A-FRESH-FORMAL-DATABASE-PREFLIGHT-V3.json' \
            'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_FULL_CHAIN_PREFLIGHT_V1.cjs' \
            'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_RUNTIME_DEPENDENCY_GRAPH_V2.cjs' \
            'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_RUNTIME_DEPENDENCY_GRAPH_V4.cjs' \
            'scripts/runtime_acceptance/ASSERT_MCFT_CAP_09_EA5E2_ACTIVATION_BOUNDARY_CURRENT_MAIN.cjs' \
            'scripts/runtime_acceptance/BUILD_MCFT_CAP_09_ROLLING_CROP_LEGALITY_V1.cjs' \
            'scripts/runtime_acceptance/MCFT_CAP_09_EA5E2_RUNTIME_DEPENDENCY_GRAPH_V4_BINDING.cjs' \
            'scripts/runtime_acceptance/PREFLIGHT_MCFT_CAP_09_EA5E2_LIVE_WINDOW_VIABILITY.cjs' \
            'scripts/runtime_acceptance/PREFLIGHT_MCFT_CAP_09_EA5E2_TARGET_CROP_CONSENSUS.cjs' | sort)"
          routing_repair_files="$(printf '%s\n' \
            '.github/workflows/mcft-cap-09-amendment19-persistent-24t-qualification.yml' \
            '.github/workflows/mcft-cap-09-ea5b3-external-runtime-config-resolver.yml' \
            '.github/workflows/mcft-cap-09-ea5d1-external-bootstrap-persistence-qualification.yml' | sort)"
          qualification_control_plane_files="$(printf '%s\n' \
            '.github/workflows/mcft-cap-09-amendment19-persistent-24t-qualification.yml' \
            '.github/workflows/mcft-cap-09-ea5e2-runtime-dependency-graph.yml' \
            '.github/workflows/mcft-cap-09-qualification-control-plane-v1.yml' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-CONTROL-PLANE-V1.json' \
            'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-EVIDENCE-REGISTRY-V1.json' \
            'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_CHECK_APPLICABILITY_V1.cjs' \
            'scripts/governance_acceptance/PLAN_MCFT_CAP_09_CHECK_APPLICABILITY_V1.cjs' \
            'scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_ALL_BLOCKERS_V1.cjs' \
            'scripts/runtime_acceptance/MCFT_CAP_09_EA5E2_RUNTIME_DEPENDENCY_GRAPH_V4_BINDING.cjs' | sort)"
          historical_sensitive_regex='^(scripts/runtime_acceptance/MCFT_CAP_09_EA5E2_LIVE_PROVIDER_TWO_PHASE.py|scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_24T_QUALIFICATION_V1.ts|scripts/runtime_acceptance/RUN_MCFT_CAP_09_ROLLING_PREBOUNDARY_REHYDRATION_V1.ts|apps/server/src/domain/twin_runtime/external_formal_amendment19_window_manifest_v1.ts)$'
          phase2_frozen_authority_regex='^(scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_24T_QUALIFICATION_V1.ts|apps/server/src/domain/twin_runtime/external_formal_amendment19_window_manifest_v1.ts)$'
          v13_marker_regex='(^\.github/workflows/mcft-cap-09-v13-|^apps/server/db/migrations/2026_08_25_mcft_cap_09_v13_|external_formal_v5_|external_formal_forcing_|external_formal_exact_base_|postgres_external_formal_forcing_|postgres_external_formal_next_tick_|postgres_external_formal_fenced_exact_base_|/ACCEPTANCE_MCFT_CAP_09_V13_|/VALIDATE_MCFT_CAP_09_V13_|GEOX-MCFT-CAP-09-T4R1-ACTUAL-FORMAL-STORE-AUTHORITY-V3\.json$)'
          historical_sensitive_changed=false
          phase2_frozen_authority_changed=false
          v13_marker_changed=false
          phase2_compatibility_changed=false
          if grep -Eq "$historical_sensitive_regex" <<<"$changed"; then historical_sensitive_changed=true; fi
          if grep -Eq "$phase2_frozen_authority_regex" <<<"$changed"; then phase2_frozen_authority_changed=true; fi
          if grep -Eq "$v13_marker_regex" <<<"$changed"; then v13_marker_changed=true; fi
          if grep -Fxq "$phase2_compatibility_path" <<<"$changed"; then phase2_compatibility_changed=true; fi
          mode='historical-am19'
          if [[ ( "$base_sha" == "$phase3_closure_sha" || "$base_sha" == "$phase4_closure_sha" ) && "$historical_sensitive_changed" == 'false' ]]; then
            mode='production-hosting-successor'
          elif [[ "$base_sha" == "$phase2_closure_sha" && "$phase2_frozen_authority_changed" == 'false' ]]; then
            test "$(git rev-parse "HEAD:${frozen_historical_runner}")" = "$frozen_historical_runner_blob" || { echo 'AM19_PHASE3_HISTORICAL_RUNNER_BLOB_DRIFT' >&2; exit 1; }
            mode='phase3-provider-maintenance-successor'
          elif [[ "$base_sha" == "$phase1_successor_sha" && "$phase2_compatibility_changed" == 'true' && "$phase2_frozen_authority_changed" == 'false' ]]; then
            test "$(git rev-parse "HEAD:${frozen_historical_runner}")" = "$frozen_historical_runner_blob" || { echo 'AM19_PHASE2_HISTORICAL_RUNNER_BLOB_DRIFT' >&2; exit 1; }
            mode='phase2-authority-symbol-compatibility'
          elif [[ "$changed" == "$qualification_control_plane_files" && "$historical_sensitive_changed" == 'false' ]]; then
            mode='qualification-control-plane-successor'
          elif [[ "$v13_marker_changed" == 'true' && "$historical_sensitive_changed" == 'false' ]]; then
            mode='v13-maintenance-successor'
          elif [[ "$changed" == "$t4_runtime_rebind_files" ]]; then
            mode='t4-runtime-rebind-successor'
          elif [[ "$changed" == "$routing_repair_files" ]]; then
            mode='runtime-rebind-routing-repair'
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "mode=$mode"
          if grep -Eq '^scripts/runtime_acceptance/(MCFT_CAP_09_EA5E2_LIVE_PROVIDER_TWO_PHASE.py|RUN_MCFT_CAP_09_ROLLING_PREBOUNDARY_REHYDRATION_V1.ts)$' <<<"$changed"; then
            grep -Fxq 'scripts/runtime_acceptance/MCFT_CAP_09_EA5E2_LIVE_PROVIDER_TWO_PHASE.py' <<<"$changed" || { echo 'AM19_P24_DECODER_IMPLEMENTATION_CHANGE_REQUIRED' >&2; exit 1; }
            grep -Fxq 'scripts/runtime_acceptance/RUN_MCFT_CAP_09_ROLLING_PREBOUNDARY_REHYDRATION_V1.ts' <<<"$changed" || { echo 'AM19_P24_REHYDRATION_DECODER_IDENTITY_CHANGE_REQUIRED' >&2; exit 1; }
            grep -Fq 'GfsRawBundleEvidenceDecoderV1' scripts/runtime_acceptance/RUN_MCFT_CAP_09_ROLLING_PREBOUNDARY_REHYDRATION_V1.ts
            grep -Fq 'PRODUCT_GFS_BUNDLE_DECODER_RELATIVE' scripts/runtime_acceptance/RUN_MCFT_CAP_09_ROLLING_PREBOUNDARY_REHYDRATION_V1.ts
            grep -Fq 'assertProductGfsScientificCoreBinding' scripts/runtime_acceptance/RUN_MCFT_CAP_09_ROLLING_PREBOUNDARY_REHYDRATION_V1.ts
            grep -Fq 'gfs_bundle_decoder.decode_bundle_v1' scripts/runtime_acceptance/MCFT_CAP_09_EA5E2_LIVE_PROVIDER_TWO_PHASE.py
            grep -Fq 'product_gfs_raw_bundle_decoder_used' scripts/runtime_acceptance/MCFT_CAP_09_EA5E2_LIVE_PROVIDER_TWO_PHASE.py
          elif grep -Fxq 'scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_24T_QUALIFICATION_V1.ts' <<<"$changed"; then
            grep -Fxq 'scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_24T_QUALIFICATION_V1.ts' <<<"$changed" || { echo 'AM19_P24_SUCCESSOR_QUALIFICATION_REFACTOR_REQUIRED' >&2; exit 1; }
            grep -Fq 'buildExternalFormalAmendment19WindowManifestV1' scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_24T_QUALIFICATION_V1.ts
            ! grep -Fq 'MCFT_CAP09_AM19_ACCELERATED_PERSISTENT24_MANIFEST_V1' scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_24T_QUALIFICATION_V1.ts
            if ! grep -Fxq 'apps/server/src/domain/twin_runtime/external_formal_amendment19_window_manifest_v1.ts' <<<"$changed"; then
              grep -Fxq 'scripts/governance_acceptance/CLASSIFY_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_GRADUATION_TRIGGER_V1.cjs' <<<"$changed" || { echo 'AM19_P24_QUALIFICATION_SUBJECT_CLASSIFIER_CHANGE_REQUIRED' >&2; exit 1; }
              grep -Fq 'geox_mcft_cap09_s6_accel24t_am19_v4' scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_24T_QUALIFICATION_V1.ts
              grep -Fq 'geox_mcft_cap09_s6_accel24t_am19_blocked_v4' scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_24T_QUALIFICATION_V1.ts
              grep -Fq 'mcft_cap09_amendment19_qualification_subject_v1' scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_24T_QUALIFICATION_V1.ts
              grep -Fq 'qualified_subject_sha' scripts/governance_acceptance/CLASSIFY_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_GRADUATION_TRIGGER_V1.cjs
            fi
          fi

      - name: Record frozen AM19 compatibility route for production-hosting successor
        if: steps.routing.outputs.mode == 'production-hosting-successor'
        run: |
          echo 'PASS: Phase3/Phase4 machine-closed production-hosting bases are governed successors; historical AM19 typecheck, selftests, and persistence-free semantics below remain mandatory. No durable live evidence is rebound.'

      - name: Record Amendment-19 T3 orchestration identity selftests not applicable to exact T4 runtime rebind
        if: steps.routing.outputs.mode == 't4-runtime-rebind-successor'
        run: |
          echo 'PASS: exact T4 runtime rebind remains zero-write and does not reuse the T3R1 persistent orchestration identity.'

      - name: Record frozen historical persistent-24T source not applicable to v13 maintenance
        if: steps.routing.outputs.mode == 'v13-maintenance-successor'
        run: |
          echo 'PASS: v13 maintenance leaves the frozen historical persistent-24T source, rehydration, decoder, and window manifest unchanged.'

      - name: Requalify CP-5 routing while preserving frozen historical source identity
        if: steps.routing.outputs.mode == 'qualification-control-plane-successor'
        shell: bash
        run: |
          set -euo pipefail
          frozen='3bbf096ee5cb73e8e0e0251dc400733d6cab501f'
          for file in \
            scripts/runtime_acceptance/MCFT_CAP_09_EA5E2_LIVE_PROVIDER_TWO_PHASE.py \
            scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_24T_QUALIFICATION_V1.ts \
            scripts/runtime_acceptance/RUN_MCFT_CAP_09_ROLLING_PREBOUNDARY_REHYDRATION_V1.ts \
            apps/server/src/domain/twin_runtime/external_formal_amendment19_window_manifest_v1.ts; do
            current_blob="$(git rev-parse "HEAD:${file}")"
            frozen_blob="$(git rev-parse "${frozen}:${file}")"
            test "$current_blob" = "$frozen_blob" || { echo "AM19_P24_CP5_FROZEN_HISTORICAL_SOURCE_DRIFT:${file}:${frozen_blob}:${current_blob}" >&2; exit 1; }
          done
          echo 'PASS: CP-5 requalifies successor routing while frozen T3 orchestration inputs remain byte-identical to the qualified predecessor.'

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install exact repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck server
        run: |
          set -euo pipefail
          pnpm --filter @geox/server run typecheck

      - name: Prove successor AM19 compatibility against byte-frozen historical runner
        if: steps.routing.outputs.mode == 'phase2-authority-symbol-compatibility' || steps.routing.outputs.mode == 'phase3-provider-maintenance-successor' || steps.routing.outputs.mode == 'production-hosting-successor'
        run: pnpm exec tsx scripts/runtime_acceptance/EXECUTE_MCFT_CAP_09_AM19_PHASE2_AUTHORITY_SYMBOL_COMPATIBILITY_V1.ts selftest

      - name: Typecheck historical qualification orchestration
        if: steps.routing.outputs.mode != 'v13-maintenance-successor' && steps.routing.outputs.mode != 'qualification-control-plane-successor' && steps.routing.outputs.mode != 'phase2-authority-symbol-compatibility' && steps.routing.outputs.mode != 'phase3-provider-maintenance-successor' && steps.routing.outputs.mode != 'production-hosting-successor'
        run: |
          set -euo pipefail
          pnpm exec tsc --noEmit --pretty false --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext --esModuleInterop --types node \
            apps/server/src/domain/twin_runtime/external_formal_amendment19_window_manifest_v1.ts \
            scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_24T_QUALIFICATION_V1.ts \
            scripts/runtime_acceptance/RUN_MCFT_CAP_09_ROLLING_PREBOUNDARY_REHYDRATION_V1.ts

      - name: Prove stable T3R1 credential seed normalization fail-closed
        if: steps.routing.outputs.mode != 'v13-maintenance-successor' && steps.routing.outputs.mode != 'qualification-control-plane-successor' && steps.routing.outputs.mode != 'phase2-authority-symbol-compatibility' && steps.routing.outputs.mode != 'phase3-provider-maintenance-successor'
        shell: node {0}
        run: |
          function normalize(raw) {
            const u = new URL(raw);
            if (!['postgres:','postgresql:'].includes(u.protocol)) throw new Error('AM19_P24_POSTGRES_URL_REQUIRED');
            if (['localhost','127.0.0.1','::1'].includes(u.hostname)) throw new Error('AM19_P24_REMOTE_DATABASE_REQUIRED');
            const seed = decodeURIComponent(u.pathname.replace(/^\//,''));
            const allowed = new Set(['geox_mcft_cap09_s6_formal_t3r1_24h','geox_mcft_cap09_s6_formal_t3r1_24h_v3']);
            if (!allowed.has(seed)) throw new Error(`AM19_P24_T3R1_CREDENTIAL_SEED_DATABASE_FORBIDDEN:${seed}`);
            u.pathname = '/geox_mcft_cap09_s6_formal_t3r1_24h_v3';
            return {seed, target: u.toString()};
          }
          const oldSeed = normalize('postgresql://u:p@example.invalid/geox_mcft_cap09_s6_formal_t3r1_24h?channel_binding=require&sslmode=require');
          if(oldSeed.seed!=='geox_mcft_cap09_s6_formal_t3r1_24h'||!oldSeed.target.includes('/geox_mcft_cap09_s6_formal_t3r1_24h_v3?')||!oldSeed.target.includes('channel_binding=require')||!oldSeed.target.includes('sslmode=require')) throw new Error('AM19_P24_OLD_T3R1_SEED_NORMALIZATION_REQUIRED');
          const v3Seed = normalize('postgresql://u:p@example.invalid/geox_mcft_cap09_s6_formal_t3r1_24h_v3?sslmode=require');
          if(v3Seed.seed!=='geox_mcft_cap09_s6_formal_t3r1_24h_v3'||!v3Seed.target.includes('/geox_mcft_cap09_s6_formal_t3r1_24h_v3?')) throw new Error('AM19_P24_V3_SEED_IDEMPOTENCY_REQUIRED');
          let rogueRejected=false;
          try { normalize('postgresql://u:p@example.invalid/neondb?sslmode=require'); } catch(e) { rogueRejected=String(e.message).startsWith('AM19_P24_T3R1_CREDENTIAL_SEED_DATABASE_FORBIDDEN:'); }
          if(!rogueRejected) throw new Error('AM19_P24_ROGUE_SEED_FAIL_CLOSED_REQUIRED');
          console.log(JSON.stringify({status:'PASS',stable_t3r1_seed_supported:true,v3_seed_supported:true,rogue_seed_rejected:true,target_database:'geox_mcft_cap09_s6_formal_t3r1_24h_v3'}));

      - name: Rebind governed EA5E2 dependency graph
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_RUNTIME_DEPENDENCY_GRAPH_V4.cjs

      - name: Prove crop-window preflight ordering and zero-side-effect boundary
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_AMENDMENT_19_CROP_WINDOW_PREFLIGHT_V1.cjs

      - name: Run pure orchestration selftests
        if: steps.routing.outputs.mode != 't4-runtime-rebind-successor' && steps.routing.outputs.mode != 'v13-maintenance-successor' && steps.routing.outputs.mode != 'qualification-control-plane-successor' && steps.routing.outputs.mode != 'phase2-authority-symbol-compatibility' && steps.routing.outputs.mode != 'phase3-provider-maintenance-successor'
        run: |
          set -euo pipefail
          node scripts/runtime_acceptance/PREFLIGHT_MCFT_CAP_09_AMENDMENT_19_CROP_WINDOW_V1.cjs selftest
          pnpm exec tsx scripts/runtime_acceptance/RUN_MCFT_CAP_09_ROLLING_PREBOUNDARY_REHYDRATION_V1.ts selftest
          if [[ "${{ steps.routing.outputs.mode }}" != "production-hosting-successor" ]]; then
            pnpm exec tsx scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_24T_QUALIFICATION_V1.ts selftest
          fi

      - name: Reprove persistence-free canonical semantics
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_AMENDMENT_19_PERSISTENCE_FREE_24T.ts

      - name: Require no premature Formal effect
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_AMENDMENT_19_PERSISTENCE_FREE_24T_RESULT.json','utf8'));
          if(p.status!=='PASS'||p.machine_statuses?.PERSISTENCE_FREE_24T!=='PASS'||p.canonical_tick_count!==24||p.provider_wait_count!==0||p.database_write_count!==0||p.formal_epoch_selected!==undefined&&p.formal_epoch_selected!==false) throw new Error('AM19_P24_PERSISTENCE_FREE_PROOF_REQUIRED');

  persistent-live:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUBJECT_SHA: ${{ github.event.workflow_run.head_sha }}
      MCFT_CAP09_SUBJECT_SHA: ${{ github.event.workflow_run.head_sha }}
      MCFT_CAP09_CONSUMER_SUBJECT_SHA: ${{ github.event.workflow_run.head_sha }}
      MCFT_CAP09_PARENT_DATABASE_URL: ${{ secrets.GEOX_MCFT_CAP09_T3R1_S6_DATABASE_URL }}
      MCFT_EA5E2_TRANSIENT_S3_ENDPOINT: ${{ secrets.GEOX_MCFT_CAP09_FORMAL_RAW_S3_ENDPOINT }}
      MCFT_EA5E2_TRANSIENT_S3_BUCKET: ${{ secrets.GEOX_MCFT_CAP09_FORMAL_RAW_S3_BUCKET }}
      MCFT_EA5E2_TRANSIENT_S3_REGION: ${{ secrets.GEOX_MCFT_CAP09_FORMAL_RAW_S3_REGION }}
      MCFT_EA5E2_TRANSIENT_S3_ACCESS_KEY_ID: ${{ secrets.GEOX_MCFT_CAP09_FORMAL_RAW_S3_ACCESS_KEY_ID }}
      MCFT_EA5E2_TRANSIENT_S3_SECRET_ACCESS_KEY: ${{ secrets.GEOX_MCFT_CAP09_FORMAL_RAW_S3_SECRET_ACCESS_KEY }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ea5e2_readiness
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ea5e2_readiness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require triggering subject is exact current protected main
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.workflow_run.id }}" -gt 0
          test "${{ github.event.workflow_run.head_branch }}" = "main"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA" || { echo 'AM19_P24_CHECKOUT_SUBJECT_DRIFT' >&2; exit 1; }
          test "$(git rev-parse origin/main)" = "$SUBJECT_SHA" || { echo 'AM19_P24_PROTECTED_MAIN_DRIFT' >&2; exit 1; }

      - name: Require secret bindings without disclosure
        shell: bash
        run: |
          set -euo pipefail
          for name in MCFT_CAP09_PARENT_DATABASE_URL MCFT_EA5E2_TRANSIENT_S3_ENDPOINT MCFT_EA5E2_TRANSIENT_S3_BUCKET MCFT_EA5E2_TRANSIENT_S3_REGION MCFT_EA5E2_TRANSIENT_S3_ACCESS_KEY_ID MCFT_EA5E2_TRANSIENT_S3_SECRET_ACCESS_KEY; do
            test -n "${!name:-}" || { echo "AM19_P24_SECRET_REQUIRED:${name}" >&2; exit 1; }
          done

      - name: Normalize stable T3R1 credential seed to Formal v3 target
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const raw=process.env.MCFT_CAP09_PARENT_DATABASE_URL;
          const u=new URL(raw);
          if(!['postgres:','postgresql:'].includes(u.protocol)) throw new Error('AM19_P24_POSTGRES_URL_REQUIRED');
          if(['localhost','127.0.0.1','::1'].includes(u.hostname)) throw new Error('AM19_P24_REMOTE_DATABASE_REQUIRED');
          const seed=decodeURIComponent(u.pathname.replace(/^\//,''));
          const allowed=new Set(['geox_mcft_cap09_s6_formal_t3r1_24h','geox_mcft_cap09_s6_formal_t3r1_24h_v3']);
          if(!allowed.has(seed)) throw new Error(`AM19_P24_T3R1_CREDENTIAL_SEED_DATABASE_FORBIDDEN:${seed}`);
          u.pathname='/geox_mcft_cap09_s6_formal_t3r1_24h_v3';
          const target=u.toString();
          console.log(`::add-mask::${target}`);
          fs.appendFileSync(process.env.GITHUB_ENV,`MCFT_CAP09_PARENT_DATABASE_URL=${target}\n`);
          console.log(JSON.stringify({status:'PASS',seed_database:seed,target_database:'geox_mcft_cap09_s6_formal_t3r1_24h_v3',credential_fields_preserved:true}));

      - name: Download only triggering-run exact-head rolling candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: mcft-cap09-rolling-preboundary-*-${{ github.event.workflow_run.head_sha }}
          merge-multiple: true
          path: rolling-candidate

      - name: Require exactly one candidate file from triggering run
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find rolling-candidate -type f -name 'MCFT_CAP_09_ROLLING_PREBOUNDARY_CANDIDATE.json' -print | sort)
          test "${#files[@]}" -eq 1 || { echo "AM19_P24_EXACT_ONE_TRIGGER_CANDIDATE_REQUIRED:${#files[@]}" >&2; exit 1; }
          mkdir -p rolling-candidate
          canonical="$PWD/rolling-candidate/MCFT_CAP_09_ROLLING_PREBOUNDARY_CANDIDATE.json"
          source_path=$(realpath "${files[0]}")
          if test "$source_path" != "$canonical"; then cp "$source_path" "$canonical"; fi
          echo "path=$canonical" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Fail closed before rehydration and v4 writes when the exact 24T crop window is unavailable
        env:
          MCFT_CAP09_ROLLING_CANDIDATE_PATH: ${{ steps.candidate.outputs.path }}
        run: node scripts/runtime_acceptance/PREFLIGHT_MCFT_CAP_09_AMENDMENT_19_CROP_WINDOW_V1.cjs run

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install exact repository and decoder dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          python -m pip install --disable-pip-version-check \
            eccodes==2.47.0 \
            eccodeslib==2.47.3.23 \
            numpy==1.26.4 \
            refet==0.4.2
          python -m eccodes selfcheck
          python scripts/runtime_acceptance/MCFT_CAP_09_EA5E2_LIVE_PROVIDER_TWO_PHASE.py selftest-et0-decimal-normalization

      - name: Reprove persistence-free canonical semantics on exact subject
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_AMENDMENT_19_PERSISTENCE_FREE_24T.ts

      - name: Governed producer-bound R2 rehydration into isolated local DB
        env:
          MCFT_CAP09_ROLLING_CANDIDATE_PATH: ${{ steps.candidate.outputs.path }}
          MCFT_CAP09_ROLLING_REHYDRATION_ISOLATED_DB_ACK: 'true'
          DATABASE_URL: ${{ env.LOCAL_REHYDRATION_DATABASE_URL }}
          PYTHON: python
        run: pnpm exec tsx scripts/runtime_acceptance/RUN_MCFT_CAP_09_ROLLING_PREBOUNDARY_REHYDRATION_V1.ts run

      - name: Execute production-graph persistent 24T qualification
        env:
          MCFT_CAP09_ROLLING_CANDIDATE_PATH: ${{ steps.candidate.outputs.path }}
        run: pnpm exec tsx scripts/runtime_acceptance/RUN_MCFT_CAP_09_AMENDMENT_19_PERSISTENT_24T_QUALIFICATION_V1.ts run

      - name: Validate machine graduation result
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_AMENDMENT_19_PERSISTENT_24T_QUALIFICATION_RESULT.json','utf8'));
          if(p.subject_sha!==process.env.SUBJECT_SHA||p.qualified_subject_sha!==process.env.SUBJECT_SHA||p.main_database_name!=='geox_mcft_cap09_s6_accel24t_am19_v4'||p.blocked_database_name!=='geox_mcft_cap09_s6_accel24t_am19_blocked_v4') throw new Error('AM19_P24_EXACT_SUBJECT_STORE_BINDING_REQUIRED');
          if(p.status==='ALREADY_QUALIFIED_READ_ONLY') {
            if(p.database_write_count!==0||p.runtime_write_count!==0||p.scheduler_write_count!==0||p.provider_request_count!==0||p.r2_request_count!==0||p.new_machine_gate_claim!==false||p.existing_success_evidence_unchanged!==true) throw new Error('AM19_P24_READ_ONLY_REVERIFY_DRIFT');
          } else {
            const keys=['PERSISTENCE_FREE_24T','PERSISTENT_24T','O00_WARM_START','MODE_A','MODE_B','PARTIAL_PAIR','LATE_EXACT_NO_REWRITE','RESTART','MISSED_SLOT_BACKFILL','IDEMPOTENCY','ZERO_PROVIDER_WAIT','SCHEMA_ENV_PREFLIGHT','FULL_CHAIN_READBACK'];
            if(p.status!=='PASS'||p.static_blocker_count!==0||keys.some(k=>p.machine_statuses?.[k]!=='PASS')) throw new Error('AM19_P24_MACHINE_GATE_NOT_PASS');
            if(p.production_scheduler_reused!==true||p.production_lease_fencing_reused!==true||p.production_runner_reused!==true||p.production_persistent_tick_service_reused!==true||p.production_persistence_repositories_reused!==true) throw new Error('AM19_P24_PRODUCTION_GRAPH_REUSE_REQUIRED');
            if(p.bootstrap_lease_real_expiry_required!==true||p.lease_and_fencing_clock_substitution!==false||p.accelerated_clock_scope!=='REPLACE_WAIT_UNTIL_NEXT_PT1H_BOUNDARY_ONLY') throw new Error('AM19_P24_CLOCK_SUBSTITUTION_BOUNDARY_DRIFT');
            if(p.final_actual_24h_still_required!==true||p.final_actual_24h_substituted_by_this_run!==false||p.future_formal_epoch_selected!==false||p.formal_o00_started!==false||p.mcft_cap09_completed!==false) throw new Error('AM19_P24_PREMATURE_FORMAL_CLAIM');
          }

      - name: Upload safe qualification proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-am19-persistent24-${{ env.SUBJECT_SHA }}-${{ github.run_id }}
          path: |
            acceptance-output/MCFT_CAP_09_AMENDMENT_19_PERSISTENCE_FREE_24T_RESULT.json
            acceptance-output/MCFT_CAP_09_AMENDMENT_19_CROP_WINDOW_PREFLIGHT_V1.json
            acceptance-output/MCFT_CAP_09_ROLLING_PREBOUNDARY_REHYDRATION.json
            acceptance-output/MCFT_CAP_09_AMENDMENT_19_PERSISTENT_24T_QUALIFICATION_RESULT.json
          if-no-files-found: warn
          retention-days: 90
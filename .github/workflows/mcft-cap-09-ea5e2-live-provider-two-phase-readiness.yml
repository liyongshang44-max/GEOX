name: mcft-cap-09-ea5e2-live-provider-two-phase-readiness

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-ea5e2-live-provider-two-phase-readiness.yml'
      - 'apps/server/src/external_evidence/mcft_cap09_external_collector_canonicalizer_v1.ts'
      - 'apps/server/src/external_evidence/mcft_cap09_external_formal_collector_phase_orchestrator_v1.ts'
      - 'apps/server/src/external_evidence/formal_live_kbs_soil_ingress_executor_v1.ts'
      - 'apps/server/src/external_evidence/s3_compatible_raw_evidence_retention_adapter_v1.ts'
      - 'apps/server/src/persistence/twin_runtime/postgres_external_formal_evidence_ingress_v1.ts'
      - 'apps/server/src/runtime/twin_runtime/postgres_external_formal_evidence_source_v1.ts'
      - 'scripts/runtime_acceptance/MCFT_CAP_09_EA5E2_LIVE_PROVIDER_TWO_PHASE.py'
      - 'scripts/runtime_acceptance/RUN_MCFT_CAP_09_EA5E2_LIVE_PROVIDER_PHASE_LOCAL_DB.ts'
      - 'scripts/runtime_acceptance/PROBE_MCFT_CAP_09_EA4_LIVE_SOURCE_EXACT_HEAD_QUALIFICATION.py'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA5E2-COLLECTOR-RUNTIME-SCHEDULE-READINESS-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_FIXED_LAG_COLLECTOR_RUNTIME_SCHEDULE_READINESS.cjs'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: mcft-cap09-ea5e2-live-provider-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20.11.1'
  PNPM_VERSION: '9.15.4'
  PYTHON_VERSION: '3.12'
  READINESS_DB_URL: postgres://postgres:postgres@127.0.0.1:55433/ea5e2_readiness
  READINESS_S3_ENDPOINT: http://127.0.0.1:9100
  READINESS_S3_BUCKET: geox-mcft-cap09-ea5e2-readiness
  READINESS_S3_REGION: us-east-1
  READINESS_S3_ACCESS_KEY: minioadmin
  READINESS_S3_SECRET_KEY: minioadmin123
  EA5E3_HARD_DEADLINE_UTC: '2026-08-11T05:00:00.000Z'

jobs:
  pre-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      target_t: ${{ steps.target.outputs.target_t }}
      subject_sha: ${{ steps.target.outputs.subject_sha }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ea5e2_readiness
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ea5e2_readiness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install exact repository and decoder dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          python -m pip install --disable-pip-version-check \
            eccodes==2.47.0 \
            eccodeslib==2.47.3.23 \
            numpy==1.26.4 \
            refet==0.4.2

      - name: Fail fast unless KBS Raw Hourly is currently within unchanged authority
        run: python scripts/runtime_acceptance/MCFT_CAP_09_EA5E2_LIVE_PROVIDER_TWO_PHASE.py precheck-kbs

      - name: Select one real future target T with EA5E3 completion margin
        id: target
        shell: node {0}
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          const fs=require('fs');
          const now=new Date();
          const base=Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate(),now.getUTCHours()+1,0,0,0);
          const target=new Date(base + (now.getUTCMinutes()>20 ? 3600000 : 0));
          const observer=new Date(target.getTime()+437*60000);
          const deadline=new Date(process.env.EA5E3_HARD_DEADLINE_UTC);
          const requiredProofFinish=new Date(deadline.getTime()-60*60000);
          if(observer>requiredProofFinish) throw new Error(`EA5E2_LIVE_PROOF_CANNOT_COMPLETE_WITH_EA5E3_MARGIN:${observer.toISOString()}`);
          const subject=process.env.SUBJECT_SHA;
          if(!/^[0-9a-f]{40}$/.test(subject)) throw new Error('EA5E2_EXACT_SUBJECT_SHA_REQUIRED');
          fs.mkdirSync('acceptance-output',{recursive:true});
          fs.writeFileSync('acceptance-output/MCFT_CAP_09_EA5E2_LIVE_TARGET.json',JSON.stringify({schema_version:'geox_mcft_cap09_ea5e2_live_target_v1',subject_sha:subject,selected_at:now.toISOString(),target_t:target.toISOString(),expected_observer_time:observer.toISOString(),ea5e3_deadline:deadline.toISOString(),minimum_post_proof_ea5e3_margin_minutes:60,formal_effectiveness:false},null,2)+'\n');
          console.log(`target_t=${target.toISOString()}`);
          console.log(`subject_sha=${subject}`);
          require('fs').appendFileSync(process.env.GITHUB_OUTPUT,`target_t=${target.toISOString()}\nsubject_sha=${subject}\n`);

      - name: Start isolated private MinIO readiness store
        run: |
          set -euo pipefail
          docker run -d --name ea5e2-readiness-minio \
            -p 9100:9000 \
            -e MINIO_ROOT_USER="$READINESS_S3_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$READINESS_S3_SECRET_KEY" \
            minio/minio:latest server /data
          for attempt in $(seq 1 60); do
            if curl -fsS "$READINESS_S3_ENDPOINT/minio/health/live" >/dev/null; then break; fi
            if [ "$attempt" = 60 ]; then docker logs ea5e2-readiness-minio; exit 1; fi
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh minio/mc:latest -ceu "
            mc alias set local $READINESS_S3_ENDPOINT $READINESS_S3_ACCESS_KEY $READINESS_S3_SECRET_KEY
            mc mb --ignore-existing local/$READINESS_S3_BUCKET
            mc anonymous set private local/$READINESS_S3_BUCKET
            mc stat local/$READINESS_S3_BUCKET
          "

      - name: Execute real pre-boundary provider phase against isolated readiness stores
        env:
          MCFT_EA5E2_ISOLATED_READINESS_ACK: 'true'
          MCFT_EA5E2_LIVE_PHASE: PRE_BOUNDARY_CAUSAL
          MCFT_EA5E2_TARGET_T: ${{ steps.target.outputs.target_t }}
          DATABASE_URL: ${{ env.READINESS_DB_URL }}
          MCFT_EA5E2_S3_ENDPOINT: ${{ env.READINESS_S3_ENDPOINT }}
          MCFT_EA5E2_S3_BUCKET: ${{ env.READINESS_S3_BUCKET }}
          MCFT_EA5E2_S3_REGION: ${{ env.READINESS_S3_REGION }}
          MCFT_EA5E2_S3_ACCESS_KEY: ${{ env.READINESS_S3_ACCESS_KEY }}
          MCFT_EA5E2_S3_SECRET_KEY: ${{ env.READINESS_S3_SECRET_KEY }}
          PYTHON: python
        run: pnpm exec tsx scripts/runtime_acceptance/RUN_MCFT_CAP_09_EA5E2_LIVE_PROVIDER_PHASE_LOCAL_DB.ts

      - name: Verify pre-boundary private/raw and three-family safe proof
        shell: node {0}
        run: |
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_EA5E2_LIVE_PROVIDER_PREBOUNDARY_SAFE_PROOF.json','utf8'));
          if(p.status!=='PASS'||p.canonical_fact_write_count!==3) throw new Error('EA5E2_PREBOUNDARY_THREE_FACTS_REQUIRED');
          if(p.soil_observation_inside_t_minus_15_to_t!==true||p.gfs_same_cycle_pair!==true) throw new Error('EA5E2_PREBOUNDARY_CAUSAL_FAMILY_PROOF_REQUIRED');
          if(p.raw_values_emitted!==false||p.formal_database_write_count!==0||p.formal_r2_write_count!==0||p.formal_window_started!==false) throw new Error('EA5E2_PREBOUNDARY_NONCLAIM_REQUIRED');

      - name: Verify readiness raw bucket remains private
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/ea5e2-anon -w '%{http_code}' "$READINESS_S3_ENDPOINT/$READINESS_S3_BUCKET/" || true)"
          test "$status" = "403"

      - name: Snapshot isolated canonical readiness database only
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            postgres:18 \
            pg_dump -h127.0.0.1 -p55433 -Upostgres -d ea5e2_readiness -Fc \
            > acceptance-output/ea5e2-readiness.dump
          test -s acceptance-output/ea5e2-readiness.dump
          test ! -e acceptance-output/gfs-raw-bundle.tar
          test ! -e acceptance-output/kbs-raw-hourly.csv

      - name: Upload one-day inter-phase canonical state only
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-ea5e2-interphase-${{ steps.target.outputs.subject_sha }}
          path: |
            acceptance-output/MCFT_CAP_09_EA5E2_LIVE_TARGET.json
            acceptance-output/MCFT_CAP_09_EA5E2_LIVE_PROVIDER_PREBOUNDARY_SAFE_PROOF.json
            acceptance-output/ea5e2-readiness.dump
          if-no-files-found: error
          retention-days: 1

  wait-one:
    needs: pre-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - name: Wait only until T plus 2h45m
        shell: node {0}
        env:
          TARGET_T: ${{ needs.pre-boundary.outputs.target_t }}
        run: |
          const target=Date.parse(process.env.TARGET_T)+165*60000;
          if(!Number.isFinite(target)) throw new Error('EA5E2_WAIT_ONE_TARGET_INVALID');
          const remaining=Math.max(0,target-Date.now());
          if(remaining>185*60000) throw new Error(`EA5E2_WAIT_ONE_TOO_LONG:${remaining}`);
          console.log(JSON.stringify({wait_until:new Date(target).toISOString(),remaining_minutes:remaining/60000}));
          await new Promise(r=>setTimeout(r,remaining));

  wait-two:
    needs: [pre-boundary, wait-one]
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - name: Wait only until T plus 5h30m
        shell: node {0}
        env:
          TARGET_T: ${{ needs.pre-boundary.outputs.target_t }}
        run: |
          const target=Date.parse(process.env.TARGET_T)+330*60000;
          if(!Number.isFinite(target)) throw new Error('EA5E2_WAIT_TWO_TARGET_INVALID');
          const remaining=Math.max(0,target-Date.now());
          if(remaining>185*60000) throw new Error(`EA5E2_WAIT_TWO_TOO_LONG:${remaining}`);
          console.log(JSON.stringify({wait_until:new Date(target).toISOString(),remaining_minutes:remaining/60000}));
          await new Promise(r=>setTimeout(r,remaining));

  late-exact-hour:
    needs: [pre-boundary, wait-two]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ea5e2_readiness
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ea5e2_readiness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.pre-boundary.outputs.subject_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install exact repository and decoder dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          python -m pip install --disable-pip-version-check \
            eccodes==2.47.0 \
            eccodeslib==2.47.3.23 \
            numpy==1.26.4 \
            refet==0.4.2

      - name: Download exact inter-phase canonical state
        uses: actions/download-artifact@v4
        with:
          name: mcft-cap09-ea5e2-interphase-${{ needs.pre-boundary.outputs.subject_sha }}
          path: acceptance-output

      - name: Restore isolated canonical readiness database
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -v "$PWD/acceptance-output:/work:ro" \
            postgres:18 \
            pg_restore -h127.0.0.1 -p55433 -Upostgres -d ea5e2_readiness \
              --no-owner --no-privileges /work/ea5e2-readiness.dump
          count="$(docker run --rm --network host -e PGPASSWORD=postgres postgres:18 \
            psql -h127.0.0.1 -p55433 -Upostgres -d ea5e2_readiness -Atc 'select count(*) from facts')"
          test "$count" = "3"

      - name: Start isolated private MinIO readiness store
        run: |
          set -euo pipefail
          docker run -d --name ea5e2-readiness-minio-late \
            -p 9100:9000 \
            -e MINIO_ROOT_USER="$READINESS_S3_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$READINESS_S3_SECRET_KEY" \
            minio/minio:latest server /data
          for attempt in $(seq 1 60); do
            if curl -fsS "$READINESS_S3_ENDPOINT/minio/health/live" >/dev/null; then break; fi
            if [ "$attempt" = 60 ]; then docker logs ea5e2-readiness-minio-late; exit 1; fi
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh minio/mc:latest -ceu "
            mc alias set local $READINESS_S3_ENDPOINT $READINESS_S3_ACCESS_KEY $READINESS_S3_SECRET_KEY
            mc mb --ignore-existing local/$READINESS_S3_BUCKET
            mc anonymous set private local/$READINESS_S3_BUCKET
            mc stat local/$READINESS_S3_BUCKET
          "

      - name: Execute real delayed exact-hour phase and DB-only handoff
        env:
          MCFT_EA5E2_ISOLATED_READINESS_ACK: 'true'
          MCFT_EA5E2_LIVE_PHASE: LATE_EXACT_HOUR
          MCFT_EA5E2_TARGET_T: ${{ needs.pre-boundary.outputs.target_t }}
          DATABASE_URL: ${{ env.READINESS_DB_URL }}
          MCFT_EA5E2_S3_ENDPOINT: ${{ env.READINESS_S3_ENDPOINT }}
          MCFT_EA5E2_S3_BUCKET: ${{ env.READINESS_S3_BUCKET }}
          MCFT_EA5E2_S3_REGION: ${{ env.READINESS_S3_REGION }}
          MCFT_EA5E2_S3_ACCESS_KEY: ${{ env.READINESS_S3_ACCESS_KEY }}
          MCFT_EA5E2_S3_SECRET_KEY: ${{ env.READINESS_S3_SECRET_KEY }}
          PYTHON: python
        run: pnpm exec tsx scripts/runtime_acceptance/RUN_MCFT_CAP_09_EA5E2_LIVE_PROVIDER_PHASE_LOCAL_DB.ts

      - name: Verify complete same-T two-phase readiness proof
        shell: node {0}
        env:
          SUBJECT_SHA: ${{ needs.pre-boundary.outputs.subject_sha }}
          TARGET_T: ${{ needs.pre-boundary.outputs.target_t }}
        run: |
          const fs=require('fs');
          const target=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_EA5E2_LIVE_TARGET.json','utf8'));
          const pre=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_EA5E2_LIVE_PROVIDER_PREBOUNDARY_SAFE_PROOF.json','utf8'));
          const late=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_EA5E2_LIVE_PROVIDER_TWO_PHASE_SAFE_PROOF.json','utf8'));
          if(target.subject_sha!==process.env.SUBJECT_SHA||target.target_t!==process.env.TARGET_T) throw new Error('EA5E2_LIVE_TARGET_IDENTITY_MISMATCH');
          if(pre.status!=='PASS'||late.status!=='PASS'||pre.target_logical_time!==late.target_logical_time||late.target_logical_time!==process.env.TARGET_T) throw new Error('EA5E2_LIVE_SAME_TARGET_TWO_PHASE_REQUIRED');
          if(pre.canonical_fact_write_count!==3||late.late_canonical_fact_write_count!==2||late.database_exact_fact_count!==5||late.db_only_selected_record_count!==5) throw new Error('EA5E2_LIVE_EXACT_FIVE_FAMILY_DB_REQUIRED');
          if(pre.gfs_same_cycle_pair!==true||late.same_gfs_cycle_future_weather_et0!==true||late.exact_rain_et0_interval_t_minus_1_to_t!==true||late.post_t_future_forcing_excluded!==true) throw new Error('EA5E2_LIVE_CAUSALITY_PROOF_REQUIRED');
          if(pre.raw_values_emitted!==false||late.raw_values_emitted!==false) throw new Error('EA5E2_LIVE_RAW_VALUE_PUBLICATION_FORBIDDEN');
          for(const value of [pre.formal_database_write_count,pre.formal_r2_write_count,late.formal_database_write_count,late.formal_r2_write_count,late.scheduler_write_count,late.canonical_runtime_write_count]) if(value!==0) throw new Error('EA5E2_LIVE_FORMAL_SIDE_EFFECT_FORBIDDEN');
          if(pre.formal_window_started!==false||late.formal_window_started!==false) throw new Error('EA5E2_LIVE_FORMAL_WINDOW_START_FORBIDDEN');
          console.log(JSON.stringify({status:'PASS',subject_sha:process.env.SUBJECT_SHA,target_t:process.env.TARGET_T,real_provider_get:true,private_retention_before_decode:true,pre_boundary_fact_count:3,late_fact_count:2,db_only_selected_count:5,same_gfs_cycle:true,exact_late_interval:true,formal_writes:0}));

      - name: Verify late readiness raw bucket remains private
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/ea5e2-anon-late -w '%{http_code}' "$READINESS_S3_ENDPOINT/$READINESS_S3_BUCKET/" || true)"
          test "$status" = "403"

      - name: Upload immutable safe final provider readiness proof
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-ea5e2-live-provider-${{ needs.pre-boundary.outputs.subject_sha }}
          path: |
            acceptance-output/MCFT_CAP_09_EA5E2_LIVE_TARGET.json
            acceptance-output/MCFT_CAP_09_EA5E2_LIVE_PROVIDER_PREBOUNDARY_SAFE_PROOF.json
            acceptance-output/MCFT_CAP_09_EA5E2_LIVE_PROVIDER_TWO_PHASE_SAFE_PROOF.json
          if-no-files-found: error
          retention-days: 90

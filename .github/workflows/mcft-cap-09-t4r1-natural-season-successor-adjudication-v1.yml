name: mcft-cap-09-t4r1-natural-season-successor-adjudication-v1

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-t4r1-natural-season-successor-adjudication-v1.yml'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-T4R1-NATURAL-SEASON-SUCCESSOR-ADJUDICATION-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_T4R1_NATURAL_SEASON_SUCCESSOR_ADJUDICATION_V1.cjs'
      - 'scripts/runtime_acceptance/PROBE_MCFT_CAP_09_T4R1_NATURAL_SEASON_SUCCESSOR_ADJUDICATION_V1.mjs'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: mcft-cap09-t4r1-natural-season-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  t4r1-natural-season-successor-adjudication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm

      - name: Resolve exact natural-season subject
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "subject_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "subject_sha=${{ github.event.merge_group.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install exact repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for KBS AgLog natural-season adjudication
        run: pnpm exec playwright install --with-deps chromium

      - name: Syntax-check T4R1 natural-season proof code
        run: |
          node --check scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_T4R1_NATURAL_SEASON_SUCCESSOR_ADJUDICATION_V1.cjs
          node --check scripts/runtime_acceptance/PROBE_MCFT_CAP_09_T4R1_NATURAL_SEASON_SUCCESSOR_ADJUDICATION_V1.mjs

      - name: Validate exact T4R1 natural-season governance boundary
        env:
          MCFT_BASE_SHA: 60e4fd93c9dff017fd0d62967fad17a49383f12e
          MCFT_SUBJECT_SHA: ${{ steps.authority.outputs.subject_sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_T4R1_NATURAL_SEASON_SUCCESSOR_ADJUDICATION_V1.cjs

      - name: Execute live read-only T4R1 natural-season successor adjudication
        env:
          MCFT_SUBJECT_SHA: ${{ steps.authority.outputs.subject_sha }}
        run: node scripts/runtime_acceptance/PROBE_MCFT_CAP_09_T4R1_NATURAL_SEASON_SUCCESSOR_ADJUDICATION_V1.mjs

      - name: Verify fail-closed natural-season result contract
        shell: node {0}
        run: |
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_T4R1_NATURAL_SEASON_SUCCESSOR_ADJUDICATION_V1.json', 'utf8'));
          if (result.status !== 'PASS') throw new Error('T4R1_NATURAL_SEASON_LIVE_SCAN_PASS_REQUIRED');
          if (result.subject_sha !== '${{ steps.authority.outputs.subject_sha }}') throw new Error('T4R1_NATURAL_SEASON_EXACT_HEAD_RESULT_REQUIRED');
          const allowed = ['T4R1_NATURAL_SEASON_SUCCESSOR_CANDIDATE_EVIDENCE_OBSERVED','NO_T4R1_NATURAL_SEASON_SUCCESSOR_CANDIDATE_CURRENTLY_OBSERVED'];
          if (!allowed.includes(result.result)) throw new Error('T4R1_NATURAL_SEASON_TERMINAL_RESULT_INVALID');
          if (result.candidate_result_is_new_season_authority !== false || result.new_natural_season_created !== false || result.new_season_id !== null || result.new_crop !== null) throw new Error('T4R1_NATURAL_SEASON_PREMATURE_AUTHORITY');
          if (result.historical_geometry_reused !== false || result.new_canonical_bootstrap_authority_established !== false) throw new Error('T4R1_NATURAL_SEASON_SCOPE_REUSE_FORBIDDEN');
          if (result.cross_season_state_stitching_authorized !== false || result.cross_season_forecast_stitching_authorized !== false || result.cross_season_checkpoint_stitching_authorized !== false || result.cross_season_lineage_stitching_authorized !== false) throw new Error('T4R1_NATURAL_SEASON_CROSS_SEASON_STITCHING_FORBIDDEN');
          if (result.database_write_count !== 0 || result.runtime_process_start !== false) throw new Error('T4R1_NATURAL_SEASON_ZERO_SIDE_EFFECT_REQUIRED');
          if (result.production_owner_activation !== false || result.formal_v5_arm !== false || result.a0_bootstrap !== false || result.o00_started !== false) throw new Error('T4R1_NATURAL_SEASON_ACTIVATION_NONCLAIM_REQUIRED');
          if (result.formal_execution_count !== '0/24') throw new Error('T4R1_NATURAL_SEASON_FORMAL_NONCLAIM_REQUIRED');
          console.log(JSON.stringify({
            status: 'PASS',
            result: result.result,
            scanned_index_page_count: result.provider_scan.scanned_index_page_count,
            scanned_observation_row_count: result.provider_scan.scanned_observation_row_count,
            post_anchor_t4_planting_lead_count: result.provider_scan.post_anchor_t4_planting_lead_count,
            exact_t4r1_successor_candidate_count: result.provider_scan.exact_t4r1_successor_candidate_count
          }));

      - name: Upload immutable metadata-only T4R1 natural-season proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-t4r1-natural-season-${{ steps.authority.outputs.subject_sha }}
          path: |
            acceptance-output/MCFT_CAP_09_T4R1_NATURAL_SEASON_SUCCESSOR_ADJUDICATION_GOVERNANCE_V1.json
            acceptance-output/MCFT_CAP_09_T4R1_NATURAL_SEASON_SUCCESSOR_ADJUDICATION_V1.json
            docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-T4R1-NATURAL-SEASON-SUCCESSOR-ADJUDICATION-V1.json
          if-no-files-found: error
          retention-days: 90

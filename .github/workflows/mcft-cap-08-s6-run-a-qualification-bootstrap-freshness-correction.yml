name: mcft-cap-08-s6-run-a-qualification-bootstrap-freshness-correction

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-08-s6-run-a-qualification-bootstrap-freshness-correction.yml'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-RUN-A-QUALIFICATION-V4-BOOTSTRAP-FRESHNESS-FAILURE-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-RUN-A-QUALIFICATION-BOOTSTRAP-FRESHNESS-CORRECTION-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-RUN-A-QUALIFICATION-BOOTSTRAP-FRESHNESS-CORRECTION-BOUNDARY-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_RUN_A_QUALIFICATION_BOOTSTRAP_FRESHNESS_CORRECTION.cjs'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_RUN_A_QUALIFICATION_PORT_BINDING_CORRECTION.cjs'
      - 'scripts/runtime_acceptance/mcft_cap08_s6_run_a_qualification_ports/fresh_database_v1.cjs'
      - 'scripts/runtime_acceptance/mcft_cap08_s6_run_a_qualification_ports/index_v1.cjs'

permissions:
  contents: read

jobs:
  run-a-qualification-bootstrap-freshness-correction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
      - name: Validate bootstrap-aware qualification freshness correction without database execution
        env:
          MCFT_BASE_SHA: bcc517b54b6c667ad798e4464b9c8c74fe5c8cfb
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_RUN_A_QUALIFICATION_BOOTSTRAP_FRESHNESS_CORRECTION.cjs
      - name: Upload qualification freshness correction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap-08-s6-run-a-qualification-bootstrap-freshness-correction-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/MCFT_CAP_08_S6_RUN_A_QUALIFICATION_BOOTSTRAP_FRESHNESS_CORRECTION_RESULT.json
          if-no-files-found: error
          retention-days: 90

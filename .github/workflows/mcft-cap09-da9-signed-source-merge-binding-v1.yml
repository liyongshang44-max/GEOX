name: mcft-cap09-da9-signed-source-merge-binding-v1
on:
  pull_request:
    paths:
      - ".github/workflows/mcft-cap09-da9-signed-source-merge-binding-v1.yml"
      - ".github/workflows/mcft-cap09-da9-signed-v2-governance-readonly-v1.yml"
      - "docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-CONTROL-PLANE-V1.json"
      - "docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP09-DA9-TWO-PARENT-SOURCE-BINDING-V1.json"
      - "scripts/governance_acceptance/VERIFY_MCFT_CAP09_DA9_TWO_PARENT_SOURCE_BINDING_V1.cjs"
permissions:
  contents: read
concurrency:
  group: cap09-da9-merge-binding-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true
jobs:
  signed-source-two-parent-binding-readonly:
    if: github.event.pull_request.number == 3734
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact integration PR HEAD (no persistent credentials)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Node 20.11.1
        uses: actions/setup-node@v4
        with:
          node-version: "20.11.1"
      - name: Verify non-execution environment and original signed Git objects
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.base.sha }}" = "2162f368899e9a9b5c497d332859e4196f389660"
          test -z "${DATABASE_URL:-}"
          test -z "${MCFT_GOVERNED_RETRY_TICKET:-}"
          test -z "${MCFT_CAP09_ADOPTION_REQUEST:-}"
          test -z "${AWS_SECRET_ACCESS_KEY:-}"
          test -z "${GEOX_MCFT_CAP09_FORMAL_V5_DATABASE_URL:-}"
          git cat-file -e '6d8fb108655d9ada4b44cc7e4709a1c2ac5832b0^{commit}'
          git cat-file -e 'bc367f2ead25b9f28dfd61b1aed394fd864d73b2^{commit}'
          git cat-file -e '876cdcff39fe9c252b591236afd3b9bcdf27a4f4^{commit}'
      - name: Recompute PHASE3 exact source + Frozen two-blob successor
        run: |
          node --check scripts/governance_acceptance/REVIEW_MCFT_CAP09_DA9_SIGNED_V2_PHASE3_FROZEN_V13_V1.cjs
          node scripts/governance_acceptance/REVIEW_MCFT_CAP09_DA9_SIGNED_V2_PHASE3_FROZEN_V13_V1.cjs
      - name: Recompute prior CTO technical QCP registration and negatives
        run: |
          node --check scripts/governance_acceptance/VERIFY_MCFT_CAP09_DA9_SIGNED_V2_QCP_TECHNICAL_ENROLLMENT_V1.cjs
          node scripts/governance_acceptance/VERIFY_MCFT_CAP09_DA9_SIGNED_V2_QCP_TECHNICAL_ENROLLMENT_V1.cjs
      - name: Independently cryptographically verify all six original Ed25519 public review receipts (no key)
        run: |
          node --check scripts/governance_acceptance/VERIFY_MCFT_CAP09_DA9_V2_QCP_SIGNED_SIX_EVIDENCE_V1.cjs
          node scripts/governance_acceptance/VERIFY_MCFT_CAP09_DA9_V2_QCP_SIGNED_SIX_EVIDENCE_V1.cjs --selftest
      - name: Verify two-parent original signatures/source, owner approval + 20 negative tests
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/governance_acceptance/VERIFY_MCFT_CAP09_DA9_TWO_PARENT_SOURCE_BINDING_V1.cjs
          mkdir -p acceptance-output
          node scripts/governance_acceptance/VERIFY_MCFT_CAP09_DA9_TWO_PARENT_SOURCE_BINDING_V1.cjs | tee acceptance-output/CAP09_DA9_TWO_PARENT_SOURCE_BINDING_V1.json
      - name: Retain read-only version-chain result; NEVER Permit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cap09-da9-signed-source-merge-binding-${{ github.event.pull_request.head.sha }}
          path: |
            acceptance-output/CAP09_DA9_TWO_PARENT_SOURCE_BINDING_V1.json
            acceptance-output/MCFT_CAP09_DA9_V2_SIGNED_GOVERNANCE_TECHNICAL_AUDIT_V1.json
          if-no-files-found: warn
          retention-days: 90

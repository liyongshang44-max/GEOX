name: mcft-cap-09-ea9a-current-season-contemporaneous-phenology-qualification

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-ea9a-current-season-contemporaneous-phenology-qualification.yml'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA9A-CURRENT-SEASON-CONTEMPORANEOUS-PHENOLOGY-QUALIFICATION-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA9A_CURRENT_SEASON_CONTEMPORANEOUS_PHENOLOGY_QUALIFICATION.cjs'
      - 'scripts/runtime_acceptance/PROBE_MCFT_CAP_09_EA9A_CURRENT_SEASON_CONTEMPORANEOUS_PHENOLOGY_QUALIFICATION.mjs'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: mcft-cap09-ea9a-phenology-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  ea9a-current-season-phenology-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for EA9A public-source probe
        run: pnpm exec playwright install --with-deps chromium

      - name: Resolve exact EA9A base and subject
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "subject_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_sha=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
            echo "subject_sha=${{ github.event.merge_group.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate exact EA9A no-write governance boundary
        env:
          MCFT_BASE_SHA: ${{ steps.authority.outputs.base_sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA9A_CURRENT_SEASON_CONTEMPORANEOUS_PHENOLOGY_QUALIFICATION.cjs

      - name: Syntax-check EA9A public-source probe
        run: node --check scripts/runtime_acceptance/PROBE_MCFT_CAP_09_EA9A_CURRENT_SEASON_CONTEMPORANEOUS_PHENOLOGY_QUALIFICATION.mjs

      - name: Run fail-closed current-season phenology qualification
        env:
          MCFT_SUBJECT_SHA: ${{ steps.authority.outputs.subject_sha }}
        run: node scripts/runtime_acceptance/PROBE_MCFT_CAP_09_EA9A_CURRENT_SEASON_CONTEMPORANEOUS_PHENOLOGY_QUALIFICATION.mjs

      - name: Upload immutable EA9A qualification proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap09-ea9a-phenology-${{ steps.authority.outputs.subject_sha }}
          path: |
            acceptance-output/MCFT_CAP_09_EA9A_CURRENT_SEASON_CONTEMPORANEOUS_PHENOLOGY_QUALIFICATION_GOVERNANCE_RESULT.json
            acceptance-output/MCFT_CAP_09_EA9A_CURRENT_SEASON_CONTEMPORANEOUS_PHENOLOGY_QUALIFICATION_RESULT.json
          if-no-files-found: error
          retention-days: 90

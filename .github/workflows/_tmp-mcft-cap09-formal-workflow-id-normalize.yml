name: tmp-mcft-cap09-formal-workflow-id-normalize

on:
  push:
    branches:
      - feat/mcft-cap09-am19-formal-successor-v1
    paths:
      - '.github/workflows/_tmp-mcft-cap09-formal-workflow-id-normalize.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mcft-cap09-am19-formal-successor-v1
          fetch-depth: 0
      - name: Normalize only REST workflow_id string arguments
        shell: python
        run: |
          from pathlib import Path
          import re
          changed=[]
          for p in sorted(Path('.github/workflows').glob('mcft-cap-09-amendment19-formal-*.yml')):
              s=p.read_text(encoding='utf-8')
              n,count=re.subn(r"workflow_id: '\.github/workflows/([^']+)'",r"workflow_id: '\1'",s)
              if count:
                  p.write_text(n,encoding='utf-8')
                  changed.append((str(p),count))
          if not changed: raise SystemExit('AM19_WORKFLOW_ID_NORMALIZATION_NO_TARGETS')
          allowed={
            '.github/workflows/mcft-cap-09-amendment19-formal-arm.yml',
            '.github/workflows/mcft-cap-09-amendment19-formal-a0-bootstrap.yml',
            '.github/workflows/mcft-cap-09-amendment19-formal-hourly-evidence.yml',
            '.github/workflows/mcft-cap-09-amendment19-formal-live-runner.yml',
            '.github/workflows/mcft-cap-09-amendment19-formal-final-readback.yml',
            '.github/workflows/mcft-cap-09-amendment19-formal-graduation-wiring.yml',
          }
          unexpected=[p for p,_ in changed if p not in allowed]
          if unexpected: raise SystemExit('AM19_WORKFLOW_ID_NORMALIZATION_UNEXPECTED:'+','.join(unexpected))
          print(changed)
      - name: Require exact mechanical boundary and push
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -ge 1
          for f in "${changed[@]}"; do
            case "$f" in .github/workflows/mcft-cap-09-amendment19-formal-*.yml) ;; *) echo "UNEXPECTED:$f" >&2; exit 1;; esac
            ! grep -Eq "workflow_id: '\.github/workflows/" "$f"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${changed[@]}"
          git diff --cached --check
          git commit -m 'MCFT-CAP-09: normalize Formal workflow REST identifiers'
          git push origin HEAD:feat/mcft-cap09-am19-formal-successor-v1

# trigger-existing-helper-v2

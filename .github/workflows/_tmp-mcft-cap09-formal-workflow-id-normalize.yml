name: tmp-mcft-cap09-formal-workflow-id-probe

on:
  pull_request:
    paths:
      - '.github/workflows/_tmp-mcft-cap09-formal-workflow-id-normalize.yml'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    if: github.event.pull_request.head.ref == 'feat/mcft-cap09-am19-formal-successor-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prove full-path workflow_id values are accepted by GitHub REST
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const paths = [
              '.github/workflows/mcft-cap-09-amendment19-formal-graduation-wiring.yml',
              '.github/workflows/mcft-cap-09-amendment19-formal-arm.yml',
              '.github/workflows/mcft-cap-09-amendment19-formal-hourly-evidence.yml',
              '.github/workflows/mcft-cap-09-amendment19-formal-live-runner.yml',
              '.github/workflows/mcft-cap-09-amendment19-formal-final-readback.yml',
            ];
            const observed = [];
            for (const workflow_id of paths) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id,
                branch: 'main',
                per_page: 1,
              });
              observed.push({ workflow_id, status: response.status, total_count: response.data.total_count });
            }
            core.info(JSON.stringify({status:'PASS', observed}));

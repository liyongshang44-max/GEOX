name: MCFT CAP-09 adoption and offline admission synthetic closure
on:
  pull_request:
    paths:
      - 'scripts/cap09_adoption_v1/**'
      - 'scripts/governance_acceptance/REPLAY_MCFT_CAP09_ADOPTED_MAIN_HISTORY_FOR_CUTOVER_V1.cjs'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_CHECK_APPLICABILITY_V1.cjs'
      - '.github/workflows/mcft-cap-09-qualification-control-plane-v1.yml'
      - 'scripts/runtime_acceptance/MCFT_CAP09_GOVERNED_RETRY_HOST_V1.cjs'
      - 'scripts/runtime_acceptance/RUN_MCFT_CAP_09_CURRENT_BASELINE_QUALIFICATION_V1.cjs'
      - 'docs/digital_twin/mcft/cap_09/*ADOPTION*'
      - '.github/workflows/mcft-cap09-adoption-local-synthetic-v1.yml'
permissions:
  contents: read
jobs:
  synthetic-closure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
      - name: Sign, verify offline, consume concurrently and reject drift
        run: node scripts/cap09_adoption_v1/acceptance.cjs --bundle synthetic-proof-bundle
      - name: Offline context, installed material and real dispatch rejection
        run: |
          node scripts/cap09_adoption_v1/test-offline-context.cjs
          node scripts/cap09_adoption_v1/test-da9-retry-bundle.cjs
          node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP09_GOVERNED_RETRY_HOST_V1.cjs
          node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP09_GOVERNED_RETRY_DISPATCH_GUARD_V1.cjs
      - name: Historical ancestry does not qualify current changes
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_CHECK_APPLICABILITY_V1.cjs --historical-ancestry-selftest
      - name: Registered independent issuer acceptance
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP09_INDEPENDENT_RETRY_ISSUER_PROVISION_V1.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-proof-${{ matrix.os }}-${{ github.event.pull_request.head.sha }}
          path: synthetic-proof-bundle/
          if-no-files-found: error
  release-material-binding:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real candidate content, evidence mapping and offline negative tests
        run: python -B -m unittest discover -s scripts/cap09_adoption_v1 -p test_material_binding.py -v
      - name: Export fixed candidate objects without running historical qualification
        run: >-
          python -B scripts/cap09_adoption_v1/build_evidence.py
          --repo . --subject a44b294f684027c0d1dd7a28c3735442fca736a4
          --output candidate-material
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-material-${{ matrix.os }}-${{ github.event.pull_request.head.sha }}
          path: candidate-material/
          if-no-files-found: error

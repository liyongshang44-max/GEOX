name: mcft-cap-08-slice-exact-sha-attestation
on:
  push:
    branches: [main]
    paths:
      - 'apps/server/src/domain/twin_runtime/cap08_*'
      - '!apps/server/src/domain/twin_runtime/cap08_s2_**'
      - '!apps/server/src/domain/twin_runtime/cap08_s3_**'
      - '!apps/server/src/domain/twin_runtime/cap08_s4_**'
      - '!apps/server/src/domain/twin_runtime/cap08_s5_**'
      - '!apps/server/src/domain/twin_runtime/cap08_s6_**'
      - 'apps/server/src/runtime/twin_runtime/cap08_*'
      - '!apps/server/src/runtime/twin_runtime/cap08_s2_**'
      - '!apps/server/src/runtime/twin_runtime/cap08_s3_**'
      - '!apps/server/src/runtime/twin_runtime/cap08_s4_**'
      - '!apps/server/src/runtime/twin_runtime/cap08_s5_**'
      - '!apps/server/src/runtime/twin_runtime/cap08_s6_**'
      - 'apps/server/src/persistence/twin_runtime/postgres_forecast_scenario_repository_v1.ts'
      - 'apps/server/src/persistence/twin_runtime/postgres_twin_runtime_repository_v1.ts'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S1-DELIVERY-STATUS-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S2-DELIVERY-STATUS-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S1-CHANGED-FILE-BOUNDARY-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_SLICE_EXACT_SHA_ATTESTATION.cjs'
      - 'scripts/governance_acceptance/mcft_cap08_slice_artifact_finalize.cjs'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_08_S1_BASE_RUNTIME_DB.ts'
      - '.github/workflows/mcft-cap-08-slice-exact-sha-attestation.yml'
  workflow_dispatch:
    inputs:
      subject_sha:
        description: Exact main SHA to attest
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
  statuses: write
concurrency:
  group: mcft-cap08-slice-exact-${{ inputs.subject_sha || github.sha }}
  cancel-in-progress: false
jobs:
  s1-exact-sha-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MCFT_SUBJECT_SHA: ${{ inputs.subject_sha || github.sha }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 30
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.subject_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate automatic or current-main manual subject
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${MCFT_SUBJECT_SHA}"
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            git fetch --no-tags origin main
            test "$(git rev-parse origin/main)" = "${MCFT_SUBJECT_SHA}"
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile
      - name: Typecheck exact subject
        run: pnpm --filter @geox/server typecheck
      - name: Prove S1 exact merge authority and recover candidate identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_SLICE_EXACT_SHA_ATTESTATION.cjs
      - name: Resolve candidate identity
        id: tree
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const a = JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_08_SLICE_EXACT_SHA_ATTESTATION_RESULT.json', 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `candidate=${a.candidate_head_sha}\nsubject=${a.subject_sha}\n`);
          NODE
      - name: Create exact fresh database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS geox_mcft_cap08_s1_exact;"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE geox_mcft_cap08_s1_exact;"
      - name: Reexecute exact S1 PostgreSQL acceptance
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/geox_mcft_cap08_s1_exact
          MCFT_CANDIDATE_SHA: ${{ steps.tree.outputs.candidate }}
        run: pnpm -w exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_08_S1_BASE_RUNTIME_DB.ts
      - name: Finalize canonical exact-SHA authority artifact
        env:
          MCFT_ARTIFACT_STAGE: EXACT_MERGE_SHA
        run: node scripts/governance_acceptance/mcft_cap08_slice_artifact_finalize.cjs
      - name: Build deterministic archive
        run: |
          mkdir -p acceptance-output/archive-input
          cp acceptance-output/MCFT_CAP_08_SLICE_AUTHORITY_ARTIFACT.json acceptance-output/archive-input/canonical-artifact.json
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf acceptance-output/mcft-cap-08-slice-attestation.tar -C acceptance-output/archive-input canonical-artifact.json
          gzip -n -f acceptance-output/mcft-cap-08-slice-attestation.tar
      - name: Cleanup exact database
        if: always()
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='geox_mcft_cap08_s1_exact' AND pid<>pg_backend_pid();"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS geox_mcft_cap08_s1_exact;"
      - name: Upload exact-SHA evidence
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap-08-s1-exact-${{ inputs.subject_sha || github.sha }}
          path: acceptance-output/
          if-no-files-found: error
          retention-days: 90
      - name: Publish exact-SHA authority status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs');
            let artifact = null;
            try {
              artifact = JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_08_SLICE_AUTHORITY_ARTIFACT.json', 'utf8'));
            } catch {}
            const ok = process.env.JOB_STATUS === 'success'
              && artifact?.status === 'PASS'
              && artifact?.effective_delivery_frontier_projection?.effective_status === 'S1_BASE_RUNTIME_IMPLEMENTED_EFFECTIVE'
              && String(process.env.ARTIFACT_ID || '').length > 0;
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: process.env.MCFT_SUBJECT_SHA,
              state: ok ? 'success' : 'failure',
              context: 'mcft-cap-08/slice-exact-sha-attestation',
              description: (ok ? `PASS S1 next=S2 artifact=${process.env.ARTIFACT_ID}` : 'FAIL S1 exact-SHA').slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });

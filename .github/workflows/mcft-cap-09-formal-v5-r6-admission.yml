name: mcft-cap-09-formal-v5-r6-admission

on:
  pull_request:
    branches:
      - main
      - fix/mcft-cap09-g11-formal-v5-productionization-v1
    paths:
      - '.github/workflows/mcft-cap-09-formal-v5-r6-admission.yml'
      - 'apps/server/src/runtime/twin_runtime/external_formal_a18_crop_context_v5.ts'
      - 'apps/server/src/runtime/twin_runtime/external_formal_a18_crop_context_v5.test.ts'
      - 'apps/server/src/runtime/twin_runtime/mcft_cap09_formal_v5_twin_runtime_composition_v1.ts'
      - 'scripts/runtime_acceptance/mcft_cap09_formal_v5_manifest_from_stage_authority_v1.ts'
      - 'scripts/runtime_acceptance/mcft_cap09_formal_v5_manifest_from_stage_authority_v1.test.ts'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_AMENDMENT_21_FORMAL_V5_EPOCH_STAGE_HANDOFF_V1.cjs'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_FORMAL_V5_R6_ADMISSION_V1.cjs'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_G11_PRODUCTIONIZATION_V1.cjs'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-QUALIFICATION-CONTROL-PLANE-V1.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcft-cap09-formal-v5-r6-admission-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  r6-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: g11
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d g11"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      G11_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/g11
    steps:
      - name: Checkout exact R6 successor
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove R6 admission-only successor boundary
        run: node scripts/governance_acceptance/VERIFY_MCFT_CAP_09_20261010_CROP_ADOPTION_SUCCESSOR_V1.cjs --historic-r6

      - name: Requalify G11 productionization after ACTIVE materializer successor
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_G11_PRODUCTIONIZATION_V1.cjs

      - name: Typecheck server and Formal-v5 consumers
        run: pnpm run typecheck:server

      - name: Prove A18 R5 parity and R6 admission
        run: pnpm exec tsx --test apps/server/src/runtime/twin_runtime/external_formal_a18_crop_context_v5.test.ts

      - name: Prove Formal-v5 manifest R5 and R6 admission contracts
        run: pnpm exec tsx --test scripts/runtime_acceptance/mcft_cap09_formal_v5_manifest_from_stage_authority_v1.test.ts

      - name: Requalify Amendment-21 under exact R6 manifest successor
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base_sha" ]; then
            base_sha="$(git merge-base HEAD origin/main)"
          fi
          MCFT_BASE_SHA="$base_sha" \
          MCFT_SUBJECT_SHA="$(git rev-parse HEAD)" \
          node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_AMENDMENT_21_FORMAL_V5_EPOCH_STAGE_HANDOFF_V1.cjs

      - name: Preserve Amendment-21 late-season handoff regression
        run: node scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_FORMAL_V5_LATE_SEASON_EPOCH_STAGE_HANDOFF_V1.cjs

      - name: Reprove isolated PostgreSQL A0 to O00 G11 path
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_G11_FORMAL_V5_ISOLATED_O00_V1.ts

      - name: Upload R6 qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-formal-v5-r6-admission-${{ github.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_FORMAL_V5_R6_ADMISSION_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_AMENDMENT21_FORMAL_V5_EPOCH_STAGE_HANDOFF_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_G11_PRODUCTIONIZATION_GOVERNANCE_V1_RESULT.json
            acceptance-output/MCFT_CAP_09_G11_FORMAL_V5_ISOLATED_O00_RESULT.json
          if-no-files-found: warn
          retention-days: 14

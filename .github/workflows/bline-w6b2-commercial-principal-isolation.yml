name: bline-w6b2-commercial-principal-isolation

on:
  pull_request:
    paths:
      - 'docs/architecture/semantic_convergence/GEOX-BLINE-W6B2-COMMERCIAL-PRINCIPAL-ISOLATION-V1.json'
      - 'apps/server/src/infra/bline_commercial_principal_bootstrap_v1.ts'
      - 'apps/server/scripts/write_dist_entries.cjs'
      - 'docker-compose.commercial_v1.yml'
      - '.env.commercial_v1.example'
      - 'scripts/governance_acceptance/ACCEPTANCE_BLINE_W6B2_COMMERCIAL_PRINCIPAL_ISOLATION_V1.cjs'
      - 'scripts/runtime_acceptance/ACCEPTANCE_BLINE_W6B2_COMMERCIAL_PRINCIPAL_ISOLATION_V1.ts'
      - '.github/workflows/bline-w6b2-commercial-principal-isolation.yml'
  push:
    branches:
      - feat/bline-w6b2-commercial-principal-isolation-v1

jobs:
  bounded-closure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact W6-B2 subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact W6-B2 head
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build focused server dependencies
        run: pnpm --filter @geox/contracts build && pnpm --filter @geox/control-kernel build && pnpm --filter @geox/device-skills build && pnpm --filter @geox/skill-registry build

      - name: W6-B2 bounded source and principal graph
        run: node scripts/governance_acceptance/ACCEPTANCE_BLINE_W6B2_COMMERCIAL_PRINCIPAL_ISOLATION_V1.cjs

      - name: B-Line residual authority audit
        run: pnpm run ci:governance:bline-residual-authority-audit

      - name: B-Line active runtime surface closure
        run: pnpm run ci:governance:bline-active-runtime-surface-closure

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm -r build

  commercial-principal-proof:
    runs-on: ubuntu-latest
    needs: bounded-closure
    steps:
      - name: Checkout exact W6-B2 subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Prepare W6-B2 Commercial runtime
        shell: bash
        run: |
          set -euo pipefail
          TOKENS_JSON="$(node -e "const f=require('./config/auth/security_acceptance_tokens.json'); process.stdout.write(JSON.stringify(f))")"
          EXECUTOR_ID="$(node -e "const f=require('./config/auth/security_acceptance_tokens.json'); const t=f.tokens.find(x=>x.token==='executor_token'&&x.role==='executor'&&!x.revoked); if(!t) process.exit(1); process.stdout.write(t.actor_id)")"
          cat > .env.w6b2 <<EOF_INNER
          GEOX_RUNTIME_ENV=pilot
          GEOX_TOKENS_JSON='$TOKENS_JSON'
          POSTGRES_USER=landos
          POSTGRES_PASSWORD=w6b2-ci-postgres-strong-2026
          POSTGRES_DB=landos
          GEOX_MCFT_MIGRATOR_PASSWORD=w6b2-ci-mcft-migrator-strong-2026
          GEOX_RUNTIME_DATABASE_PASSWORD=w6b2-ci-runtime-database-strong-2026
          GEOX_DEPLOYMENT_SUBJECT_COMMIT=${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GEOX_EXECUTOR_TOKEN=executor_token
          GEOX_EXECUTOR_ID=$EXECUTOR_ID
          GEOX_EVIDENCE_S3_BUCKET=evidence-exports-v1
          GEOX_EVIDENCE_S3_PUBLIC_ENDPOINT=http://127.0.0.1:9000
          MINIO_ROOT_USER=geoxminio
          MINIO_ROOT_PASSWORD=w6b2-ci-minio-strong-2026
          CORS_ORIGINS=https://w6b2-ci.geox.invalid
          APP_SECRET=w6b2-ci-app-secret-strong-2026
          PUBLIC_BASE_URL=https://w6b2-ci.geox.invalid
          GEOX_EXECUTION_DEFAULT_DISABLED=1
          GEOX_EXECUTION_ENABLE_EXPLICITLY=0
          GEOX_EXECUTION_ENABLE_REASON=w6b2-commercial-principal-proof
          GEOX_DEVTOOLS_ENABLED=0
          EOF_INNER

      - name: Render Commercial compose with isolated secret volumes
        run: |
          set -euo pipefail
          docker compose --env-file .env.w6b2 -f docker-compose.commercial_v1.yml config > /tmp/w6b2-commercial.rendered.yml
          grep -q 'geox_telemetry_ingest_v1' /tmp/w6b2-commercial.rendered.yml
          grep -q 'geox_jobs_v1' /tmp/w6b2-commercial.rendered.yml
          grep -q 'geox_executor_runtime_v1' /tmp/w6b2-commercial.rendered.yml
          ! grep -q 'GEOX_TELEMETRY_DATABASE_PASSWORD' /tmp/w6b2-commercial.rendered.yml
          ! grep -q 'GEOX_JOBS_DATABASE_PASSWORD' /tmp/w6b2-commercial.rendered.yml
          ! grep -q 'GEOX_EXECUTOR_DATABASE_PASSWORD' /tmp/w6b2-commercial.rendered.yml

      - name: Start isolated Commercial runtime
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          trap 'rc=$?; docker compose --env-file .env.w6b2 -f docker-compose.commercial_v1.yml ps || true; docker compose --env-file .env.w6b2 -f docker-compose.commercial_v1.yml logs --tail=250 commercial-principal-secret-init bline-commercial-principal-bootstrap server mqtt telemetry-ingest jobs executor || true; exit $rc' ERR
          docker compose --env-file .env.w6b2 -f docker-compose.commercial_v1.yml up -d minio minio-init
          timeout 420 docker compose --env-file .env.w6b2 -f docker-compose.commercial_v1.yml up -d postgres mqtt server telemetry-ingest jobs executor
          docker compose --env-file .env.w6b2 -f docker-compose.commercial_v1.yml ps

      - name: Wait for server and principal bootstrap
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 bash -lc 'until curl -fsS http://127.0.0.1:3001/api/health >/dev/null; do sleep 2; done'
          docker compose --env-file .env.w6b2 -f docker-compose.commercial_v1.yml logs bline-commercial-principal-bootstrap | tee /tmp/w6b2-bootstrap.log
          grep -q '"event":"BLINE_COMMERCIAL_PRINCIPAL_BOOTSTRAP_V1"' /tmp/w6b2-bootstrap.log
          grep -q '"status":"PASS"' /tmp/w6b2-bootstrap.log

      - name: Real PostgreSQL and MQTT principal isolation proof
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env.w6b2 -f docker-compose.commercial_v1.yml run --rm --no-deps \
            -e W6B2_DB_HOST=postgres \
            -e W6B2_DB_PORT=5432 \
            -e POSTGRES_DB=landos \
            -e W6B2_MQTT_URL=mqtt://mqtt:1883 \
            --entrypoint /bin/sh bline-commercial-principal-bootstrap \
            -ceu 'pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_BLINE_W6B2_COMMERCIAL_PRINCIPAL_ISOLATION_V1.ts'

      - name: Workload runtime identity hygiene
        shell: bash
        run: |
          set -euo pipefail
          for service in telemetry-ingest jobs executor; do
            id="$(docker compose --env-file .env.w6b2 -f docker-compose.commercial_v1.yml ps -q "$service")"
            test -n "$id"
            test "$(docker inspect -f '{{.State.Running}}' "$id")" = "true"
          done
          docker compose --env-file .env.w6b2 -f docker-compose.commercial_v1.yml logs --tail=300 server telemetry-ingest jobs executor | tee /tmp/w6b2-runtime.log
          ! grep -Ei 'password authentication failed|permission denied for (table|schema|sequence|function)|FATAL:.*runtime crashed' /tmp/w6b2-runtime.log

      - name: Stop Commercial runtime and isolated credential volumes
        if: always()
        run: docker compose --env-file .env.w6b2 -f docker-compose.commercial_v1.yml down -v --remove-orphans || true

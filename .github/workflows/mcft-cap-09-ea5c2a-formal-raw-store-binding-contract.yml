name: mcft-cap-09-ea5c2a-formal-raw-store-binding-contract

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-ea5c2a-formal-raw-store-binding-contract.yml'
      - 'apps/server/src/external_evidence/formal_durable_raw_store_binding_v1.ts'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5C2A_FORMAL_RAW_STORE_BINDING.ts'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA5C2A-FORMAL-RAW-STORE-BINDING-CONTRACT-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5C2A_FORMAL_RAW_STORE_BINDING_CONTRACT.cjs'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: mcft-cap09-ea5c2a-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  ea5c2a-formal-raw-store-binding-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ea5c2a
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ea5c2a"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm

      - name: Resolve exact EA5C2A base
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_sha=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install exact repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax-check EA5C2A governance gate
        run: node --check scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5C2A_FORMAL_RAW_STORE_BINDING_CONTRACT.cjs

      - name: Validate exact EA5C2A authority and five-file boundary
        env:
          MCFT_BASE_SHA: ${{ steps.authority.outputs.base_sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5C2A_FORMAL_RAW_STORE_BINDING_CONTRACT.cjs

      - name: Typecheck server
        run: pnpm --filter @geox/server run typecheck

      - name: Prove fail-closed Formal raw-store binding contract
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5C2A_FORMAL_RAW_STORE_BINDING.ts

      - name: Start CI-only private S3-compatible regression store
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ea5c2a-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin123 \
            minio/minio:latest server /data
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then break; fi
            if [ "$attempt" = 60 ]; then docker logs ea5c2a-minio; exit 1; fi
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh minio/mc:latest -ceu '
            mc alias set local http://127.0.0.1:9000 minioadmin minioadmin123
            mc mb --ignore-existing local/geox-mcft-cap09-formal-raw-v1
            mc anonymous set private local/geox-mcft-cap09-formal-raw-v1
          '

      - name: Re-prove frozen EA5C1 adapter and restricted-ingress behavior
        env:
          EA5C1_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/ea5c2a
          EA5C1_S3_ENDPOINT: http://127.0.0.1:9000
          EA5C1_S3_BUCKET: geox-mcft-cap09-formal-raw-v1
          EA5C1_S3_ACCESS_KEY: minioadmin
          EA5C1_S3_SECRET_KEY: minioadmin123
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5C1_DURABLE_RAW_RESTRICTED_INGRESS.ts

      - name: Verify EA5C2A remains contract qualification only
        shell: node {0}
        run: |
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_EA5C2A_FORMAL_RAW_STORE_BINDING_RESULT.json','utf8'));
          if (r.status !== 'PASS' || r.binding_contract_qualified !== true) throw new Error('EA5C2A_BINDING_CONTRACT_PASS_REQUIRED');
          if (r.persistent_formal_24h_raw_store_bound !== false || r.live_formal_ingress_proved !== false) throw new Error('EA5C2A_PREMATURE_LIVE_BINDING_CLAIM');
          if (r.formal_neon_write_performed !== false || r.ea5c_complete !== false || r.ea5d_authorized !== false || r.formal_o00_start_authorized !== false) throw new Error('EA5C2A_PREMATURE_SUCCESSOR_EFFECT');
          console.log(JSON.stringify({status:'PASS',ea5c2a:true,persistent_formal_store:false,live_ingress:false,formal_neon_write:false,ea5c:false,ea5d:false,ea5e:false,o00:false,cap09:false}));

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap-09-ea5c2a-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_EA5C2A_FORMAL_RAW_STORE_BINDING_CONTRACT_GOVERNANCE_RESULT.json
            acceptance-output/MCFT_CAP_09_EA5C2A_FORMAL_RAW_STORE_BINDING_RESULT.json
            acceptance-output/MCFT_CAP_09_EA5C1_DURABLE_RAW_RESTRICTED_INGRESS_GOVERNANCE_RESULT.json
          if-no-files-found: warn
          retention-days: 90

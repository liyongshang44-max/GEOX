name: tmp mcft cap09 handoff AD materializer

on:
  push:
    branches:
      - tmp/mcft-cap09-handoff-ad-materializer-v1
    paths:
      - .github/workflows/tmp-mcft-cap09-handoff-ad-materializer-v1.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose existing carrier payload boundary only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          carrier = Path("scripts/tmp_materialize_mcft_cap09_handoff_ad.py")
          source = carrier.read_text(encoding="utf-8")
          marker = 'PREFIX = base64.b64decode("'
          start = source.index(marker) + len(marker)
          tail = source[start:]
          alphabet = set("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=")
          invalid = [(i, ch) for i, ch in enumerate(tail) if not ch.isspace() and ch not in alphabet]

          print("tail_len=", len(tail))
          print("invalid_count=", len(invalid))
          for i, ch in invalid[:20]:
              lo = max(0, i - 120)
              hi = min(len(tail), i + 120)
              print("INVALID", i, repr(ch), "SNIP", repr(tail[lo:hi]))
          print("last_700=", repr(tail[-700:]))

          # Diagnostic-only invariant: do not mutate repository content.
          assert invalid, "expected a non-base64 carrier suffix boundary"
          PY
          test -z "$(git status --porcelain)"

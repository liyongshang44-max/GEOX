name: mcft-cap-09-phase7-fresh-formal-v5-preparation

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-t4r1-formal-store-provision.yml'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-PHASE7-FRESH-FORMAL-V5-PREPARATION-AUTHORITY-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_PHASE7_FRESH_FORMAL_V5_PREPARATION_V1.cjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: mcft-cap09-phase7-fresh-formal-v5-preparation-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcft_cap09_phase7_preparation
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mcft_cap09_phase7_preparation"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      EXACT_PHASE6_HEAD: '48ceafe7c6e7d3d57a1dc17411fb4bf673486333'
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
      NODE_VERSION: '20.11.1'
      PNPM_VERSION: '9.15.4'
      DATABASE_URL: 'postgres://postgres:postgres@127.0.0.1:5432/mcft_cap09_phase7_preparation'
      V13_COLUMN_FP: 'c61154d4439a82efc256bed461386781'
      V13_CONSTRAINT_FP: '67a588bc5b8c3d213b03aa1dbfa4ff2b'
      V13_INDEX_FP: '306e26a56d419c4e08fac0912ccfdda8'

    steps:
      - name: Checkout exact Phase7 preparation subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact Phase6 stacked base and three-file zero-effect boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha }}" = "$EXACT_PHASE6_HEAD"
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          mapfile -t changed < <(git diff --name-only "$EXACT_PHASE6_HEAD" HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = "3"
          expected=$'.github/workflows/mcft-cap-09-t4r1-formal-store-provision.yml\ndocs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-PHASE7-FRESH-FORMAL-V5-PREPARATION-AUTHORITY-V1.json\nscripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_PHASE7_FRESH_FORMAL_V5_PREPARATION_V1.cjs'
          actual="$(printf '%s\n' "${changed[@]}")"
          test "$actual" = "$expected"

      - name: Verify immutable Phase6 closure artifact metadata
        uses: actions/github-script@v7
        with:
          script: |
            const expected = [
              {run:33146391000, artifact:9676455831, digest:'sha256:9a3a22b8b844fc1538d4a6986a9d3477b895208b1e88cdf13106f0f0dbf463d7'},
              {run:33146390858, artifact:9675928222, digest:'sha256:c84c06eeb04db9aa228c3415db320e8cd6eaef3502407fbc192dc80f8833497d'},
              {run:33146390954, artifact:9676026935, digest:'sha256:8af3b905af82e84b7ff9b200b715ae622dbd2c4551b7c4fe27c0d842e421af17'},
              {run:32881283336, artifact:9575878791, digest:'sha256:04630f1f869ba99e9be40d55e24967e6e26671e80d3459fb9b28ce0694aaeb40'}
            ];
            const {owner,repo}=context.repo;
            for(const e of expected){
              const run=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:e.run})).data;
              if(run.conclusion!=='success') throw new Error('PHASE7_PREP_REQUIRED_RUN_NOT_SUCCESS:'+e.run);
              const art=(await github.rest.actions.getArtifact({owner,repo,artifact_id:e.artifact})).data;
              if(art.expired) throw new Error('PHASE7_PREP_REQUIRED_ARTIFACT_EXPIRED:'+e.artifact);
              if(art.digest!==e.digest) throw new Error('PHASE7_PREP_REQUIRED_ARTIFACT_DIGEST_DRIFT:'+e.artifact);
              if(e.run!==32881283336 && run.head_sha!==process.env.EXACT_PHASE6_HEAD) throw new Error('PHASE7_PREP_PHASE6_HEAD_DRIFT:'+e.run);
              if(e.run===32881283336 && run.head_sha!=='3bbf096ee5cb73e8e0e0251dc400733d6cab501f') throw new Error('PHASE7_PREP_V13_ANCHOR_HEAD_DRIFT');
            }

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install locked workspace
        run: pnpm install --frozen-lockfile

      - name: Validate Phase7 preparation governance
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_PHASE7_FRESH_FORMAL_V5_PREPARATION_V1.cjs

      - name: Reconstruct immutable v13 29-table schema in ephemeral PostgreSQL
        env:
          MCFT_CAP09_V13_HOLISTIC_SCHEMA_DESTRUCTIVE_ACCEPTANCE: '1'
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_V13_HOLISTIC_SCHEMA_POSTGRES.ts

      - name: Require exact v13 schema fingerprints and zero production effect
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_V13_HOLISTIC_SCHEMA_POSTGRES_RESULT.json','utf8'));
          if(p.status!=='PASS'||p.predecessor_public_table_count!==26||p.v13_required_public_table_count!==29||p.operational_table_delta!==3)throw new Error('PHASE7_PREP_V13_SCHEMA_CARDINALITY');
          if(p.v13_column_fingerprint_md5!==process.env.V13_COLUMN_FP)throw new Error('PHASE7_PREP_COLUMN_FINGERPRINT_DRIFT');
          if(p.v13_constraint_fingerprint_md5!==process.env.V13_CONSTRAINT_FP)throw new Error('PHASE7_PREP_CONSTRAINT_FINGERPRINT_DRIFT');
          if(p.v13_index_fingerprint_md5!==process.env.V13_INDEX_FP)throw new Error('PHASE7_PREP_INDEX_FINGERPRINT_DRIFT');
          if(p.canonical_facts_schema_unchanged!==true||p.all_new_relations_zero_state!==true)throw new Error('PHASE7_PREP_V13_SCHEMA_SEMANTIC_DRIFT');
          if(p.production_workflow_effect!==false||p.formal_v4_mutation_performed!==false||p.mcft_cap09_completed!==false)throw new Error('PHASE7_PREP_V13_NONCLAIM_REGRESSION');

      - name: Assemble machine preparation proof
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const g=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_PHASE7_FRESH_FORMAL_V5_PREPARATION_GOVERNANCE.json','utf8'));
          const s=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_V13_HOLISTIC_SCHEMA_POSTGRES_RESULT.json','utf8'));
          const out={
            schema_version:'geox_mcft_cap09_phase7_fresh_formal_v5_preparation_proof_v1',
            status:'PASS',
            subject_sha:process.env.SUBJECT_SHA,
            phase6_predecessor_sha:process.env.EXACT_PHASE6_HEAD,
            phase6_accepted:true,
            v13_schema_anchor_reproduced:true,
            v13_public_table_count:s.v13_required_public_table_count,
            v13_column_fingerprint_md5:s.v13_column_fingerprint_md5,
            v13_constraint_fingerprint_md5:s.v13_constraint_fingerprint_md5,
            v13_index_fingerprint_md5:s.v13_index_fingerprint_md5,
            planned_fresh_stores:[
              'geox_mcft_cap09_s6_accel24t_am19_v13',
              'geox_mcft_cap09_s6_accel24t_am19_blocked_v13',
              'geox_mcft_cap09_s6_formal_t4r1_24h_v5'
            ],
            failed_v4_reuse:false,
            remote_database_provision_count:0,
            runtime_database_write_count:0,
            provider_request_count:0,
            formal_v5_arm:false,
            formal_v5_o00_started:false,
            production_effect:false,
            mcft_cap09_completed:false
          };
          if(g.status!=='PASS'||g.production_effect!==false)throw new Error('PHASE7_PREP_GOVERNANCE_PROOF_REQUIRED');
          fs.writeFileSync('acceptance-output/MCFT_CAP_09_PHASE7_FRESH_FORMAL_V5_PREPARATION_PROOF.json',JSON.stringify(out,null,2)+'\n');

      - name: Upload immutable Phase7 preparation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-phase7-fresh-formal-v5-preparation-${{ env.SUBJECT_SHA }}
          path: |
            acceptance-output/MCFT_CAP_09_PHASE7_FRESH_FORMAL_V5_PREPARATION_GOVERNANCE.json
            acceptance-output/MCFT_CAP_09_V13_HOLISTIC_SCHEMA_POSTGRES_RESULT.json
            acceptance-output/MCFT_CAP_09_PHASE7_FRESH_FORMAL_V5_PREPARATION_PROOF.json
          if-no-files-found: error
          retention-days: 90

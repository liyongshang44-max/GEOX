name: b06a-calculation-candidate-contracts-exact

on:
  push:
    branches:
      - ci/bline-b06a-calculation-candidate-contracts-exact-2026-08-27

jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Build runtime workspace dependencies
        run: |
          pnpm --filter @geox/contracts build
          pnpm --filter @geox/device-skills build
          pnpm --filter @geox/skill-registry build
      - name: Server typecheck
        run: pnpm --filter @geox/server typecheck
      - name: B-02 semantic governance
        run: node scripts/governance_acceptance/ACCEPTANCE_B02_SEMANTIC_CONTRACT_LINTER_V1.cjs
      - name: B-06a CalculationResult and CandidateDecision contracts
        run: node --import tsx --test apps/server/src/contracts/canonical_decision_v1.contract.test.ts
      - name: B-06a zero production producers
        shell: bash
        run: |
          if grep -R --include='*.ts' --exclude='*.test.ts' --exclude='*.acceptance.test.ts' -n             -e 'calculationResultV1Schema.parse('             -e 'candidateDecisionV1Schema.parse('             apps/server/src; then
            echo "B06A_UNEXPECTED_RUNTIME_PRODUCER"
            exit 1
          fi
          echo "B06A_ZERO_PRODUCTION_PRODUCERS_PASS"
      - name: B-06a guard register exactness
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const reg = JSON.parse(fs.readFileSync("docs/architecture/semantic_convergence/GEOX-SEMANTIC-OWNERSHIP-REGISTER-V1.json","utf8"));
          for (const id of ["G-B02-14-calculation-result-instantiation","G-B02-15-candidate-decision-instantiation"]) {
            const g = (reg.static_guards || []).find((x) => x.guard_id === id);
            if (!g) throw new Error("B06A_GUARD_MISSING:" + id);
            if ((g.registered_paths || []).length !== 0) throw new Error("B06A_GUARD_SHOULD_HAVE_ZERO_PATHS:" + id);
          }
          const calc = reg.semantics.find((x) => x.semantic_id === "decision.calculation");
          const cand = reg.semantics.find((x) => x.semantic_id === "decision.candidate");
          if (!String(calc?.canonical_output_type || "").includes("CalculationResultV1")) throw new Error("B06A_CALC_CANONICAL_OUTPUT_MISSING");
          if (!String(cand?.canonical_output_type || "").includes("CandidateDecisionV1")) throw new Error("B06A_CANDIDATE_CANONICAL_OUTPUT_MISSING");
          console.log("B06A_GUARD_REGISTER_EXACTNESS_PASS");
          NODE
      - name: Linter rejects unregistered CalculationResult producer
        shell: bash
        run: |
          P="apps/server/src/.b06a_unregistered_calc_probe.ts"
          printf '%s\n' 'calculationResultV1Schema.parse(' > "$P"
          set +e
          node scripts/governance_acceptance/ACCEPTANCE_B02_SEMANTIC_CONTRACT_LINTER_V1.cjs > /tmp/b06a-calc-negative.log 2>&1
          RC=$?
          set -e
          cat /tmp/b06a-calc-negative.log
          rm -f "$P"
          if [ "$RC" -eq 0 ]; then
            echo "B06A_CALC_NEGATIVE_NOT_REJECTED"
            exit 1
          fi
          grep -q "UNREGISTERED_CALCULATION_RESULT_PRODUCER" /tmp/b06a-calc-negative.log
          echo "B06A_CALC_NEGATIVE_GOVERNANCE_PASS"
      - name: Linter rejects unregistered CandidateDecision producer
        shell: bash
        run: |
          P="apps/server/src/.b06a_unregistered_candidate_probe.ts"
          printf '%s\n' 'candidateDecisionV1Schema.parse(' > "$P"
          set +e
          node scripts/governance_acceptance/ACCEPTANCE_B02_SEMANTIC_CONTRACT_LINTER_V1.cjs > /tmp/b06a-candidate-negative.log 2>&1
          RC=$?
          set -e
          cat /tmp/b06a-candidate-negative.log
          rm -f "$P"
          if [ "$RC" -eq 0 ]; then
            echo "B06A_CANDIDATE_NEGATIVE_NOT_REJECTED"
            exit 1
          fi
          grep -q "UNREGISTERED_CANDIDATE_DECISION_PRODUCER" /tmp/b06a-candidate-negative.log
          echo "B06A_CANDIDATE_NEGATIVE_GOVERNANCE_PASS"
      - name: Restored B-02 governance
        run: node scripts/governance_acceptance/ACCEPTANCE_B02_SEMANTIC_CONTRACT_LINTER_V1.cjs
      - name: B-05 overall regression boundary
        run: |
          node --import tsx --test apps/server/src/contracts/canonical_context_v1.contract.test.ts
          node --import tsx --test apps/server/src/context/field_program_context_projection_v1.test.ts
          node --import tsx --test apps/server/src/context/legacy_crop_stage_compatibility_adapter_v1.test.ts
          node --import tsx --test apps/server/src/context/crop_skill_stage_compatibility_adapter_v1.test.ts
      - name: B-03/B-04 regression boundary
        run: |
          node --import tsx --test apps/server/src/contracts/canonical_evidence_v1.contract.test.ts
          node --import tsx --test apps/server/src/evidence/raw_sample_evidence_qualification_projection_v1.test.ts
          node --import tsx --test apps/server/src/domain/judge/evidence_judge_canonical_sufficiency_shadow_v1.test.ts
      - name: Server build
        run: pnpm --filter @geox/server build
      - name: Marker
        run: |
          echo "B06A_EXACT_HEAD a2f6d64663492ce964bc6ca7d687f17dc51eae99"
          echo "B06A_CALCULATION_CANDIDATE_CONTRACTS_PASS"

name: mcft-cap-09-production-runtime-start-readiness

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-production-runtime-start-readiness.yml'
      - 'scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_PRODUCTION_RUNTIME_START_READINESS_V1.cjs'
      - 'scripts/runtime_acceptance/PREFLIGHT_MCFT_CAP_09_EA5E2_TARGET_CROP_CONSENSUS.cjs'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-PRODUCTION-RUNTIME-START-READINESS-V1.json'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S6-FORMAL-CROP-CONTEXT-AUTHORITY-V3.json'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-AMENDMENT-06-FORMAL-WINDOW-EPOCH-REBASE-AUTHORITY.md'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-PRODUCTION-EVIDENCE-ACQUISITION-HORIZON-AUTHORITY-V1.json'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: mcft-cap09-production-runtime-start-readiness-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  runtime-start-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove no current runtime-start authority may be armed
        shell: bash
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          export OBSERVED_AT="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          node scripts/governance_acceptance/PREFLIGHT_MCFT_CAP_09_PRODUCTION_RUNTIME_START_READINESS_V1.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap09-production-runtime-start-readiness-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: acceptance-output/MCFT_CAP_09_PRODUCTION_RUNTIME_START_READINESS_V1_RESULT.json
          if-no-files-found: error
          retention-days: 90

name: mcft-cap-09-closure-control-plane-audit

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-closure-control-plane-audit.yml'
      - '.github/workflows/mcft-cap-09-amendment19-formal-graduation-wiring.yml'
      - '.github/workflows/mcft-cap-09-amendment19-formal-arm.yml'
      - '.github/workflows/mcft-cap-09-amendment19-formal-a0-bootstrap.yml'
      - '.github/workflows/mcft-cap-09-amendment19-formal-hourly-evidence.yml'
      - '.github/workflows/mcft-cap-09-amendment19-formal-live-runner.yml'
      - '.github/workflows/mcft-cap-09-amendment19-formal-final-readback.yml'
      - '.github/workflows/mcft-cap-09-t4r1-rolling-hourly-scheduler.yml'
      - '.github/workflows/mcft-cap-09-t4r1-formal-store-provision.yml'
      - '.github/workflows/mcft-cap-09-t4r1-amendment19-persistent-24t-qualification.yml'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_CLOSURE_CONTROL_PLANE_AUDIT_V1.cjs'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_FINAL_SEMANTIC_CLOSURE_V1.cjs'
      - 'scripts/governance_acceptance/REHEARSE_MCFT_CAP_09_FORMAL_24H_ORCHESTRATION_V1.cjs'
      - 'scripts/governance_acceptance/ASSEMBLE_MCFT_CAP_09_AMENDMENT_19_FORMAL_ARM_V1.cjs'
      - 'scripts/governance_acceptance/ASSEMBLE_MCFT_CAP_09_AMENDMENT_19_FORMAL_COMPLETION_V1.cjs'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-AMENDMENT-19-QUALIFICATION-COMPATIBILITY-CONTRACT-V1.json'

permissions:
  contents: read

env:
  QUALIFICATION_SHA: abf0aa121001480f01ad4e39364b1df13f3c26eb

jobs:
  closure-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
      - name: Prove v11 qualification semantic boundary is unchanged on control-plane bind
        run: >-
          node scripts/governance_acceptance/ATTEST_MCFT_CAP_09_NON_SEMANTIC_CONTROL_PLANE_COMPATIBILITY_V1.cjs
          "$QUALIFICATION_SHA"
          "${{ github.event.pull_request.head.sha }}"
          acceptance-output/MCFT_CAP_09_NON_SEMANTIC_CONTROL_PLANE_COMPATIBILITY_ATTESTATION_V1.json
      - name: Require CARRY_FORWARD and forbid fresh qualification rollover
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_NON_SEMANTIC_CONTROL_PLANE_COMPATIBILITY_ATTESTATION_V1.json','utf8'));
          if(p.status!=='PASS'||p.qualification_subject_sha!==process.env.QUALIFICATION_SHA||p.deployment_subject_sha!==process.env.GITHUB_SHA)throw new Error('MCFT_CAP09_V11_BIND_COMPATIBILITY_IDENTITY_REQUIRED');
          if(p.governed_changed_paths.length!==0||p.source_governed_semantic_digest!==p.deployment_governed_semantic_digest||p.qualification_reexecution_required!==false)throw new Error('MCFT_CAP09_V11_BIND_MUST_CARRY_FORWARD');
          if(p.qualification_database_rewrite_authorized!==false||p.human_override_used!==false||p.formal_effect!==false)throw new Error('MCFT_CAP09_V11_BIND_FAIL_CLOSED_BOUNDARY_REQUIRED');
      - name: Audit remaining Graduation to Formal completion control plane
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_CLOSURE_CONTROL_PLANE_AUDIT_V1.cjs
      - name: Reprove reverse terminal semantic closure remains unchanged
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_FINAL_SEMANTIC_CLOSURE_V1.cjs
      - name: Rehearse deterministic 24h orchestration without provider or Formal DB
        run: node scripts/governance_acceptance/REHEARSE_MCFT_CAP_09_FORMAL_24H_ORCHESTRATION_V1.cjs

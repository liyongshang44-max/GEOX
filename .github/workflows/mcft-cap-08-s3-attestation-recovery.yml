name: mcft-cap-08-s3-attestation-recovery

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-08-s3-attestation-recovery.yml'
      - 'scripts/governance_acceptance/mcft_attestation_retention_store_v1.cjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcft-cap-08-s3-attestation-recovery.yml'
      - 'scripts/governance_acceptance/mcft_attestation_retention_store_v1.cjs'
  workflow_dispatch:
    inputs:
      subject_sha:
        description: Exact merged S3 SHA to recover
        required: true
        default: bcffb63003667ebc5f60ef4aa83c8243f99c5917
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write

concurrency:
  group: mcft-cap08-s3-attestation-recovery-${{ inputs.subject_sha || 'bcffb63003667ebc5f60ef4aa83c8243f99c5917' }}
  cancel-in-progress: false

jobs:
  recovery-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
      - name: Validate retention compatibility contract
        run: |
          node --check scripts/governance_acceptance/mcft_attestation_retention_store_v1.cjs
          node scripts/governance_acceptance/mcft_attestation_retention_store_v1.cjs --subject-identity-selftest
      - name: Validate recovery workflow authority boundary
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const workflow = fs.readFileSync('.github/workflows/mcft-cap-08-s3-attestation-recovery.yml', 'utf8');
          const required = [
            'bcffb63003667ebc5f60ef4aa83c8243f99c5917',
            'ACCEPTANCE_MCFT_CAP_08_S3_EXACT_SHA_ATTESTATION.cjs',
            'ACCEPTANCE_MCFT_CAP_08_S3_BOUNDARY.cjs',
            'ACCEPTANCE_MCFT_CAP_08_S3_DECISION_ACTION_DB.ts',
            'ACCEPTANCE_MCFT_CAP_08_S3_COMPLETED_RERUN_NEGATIVE_DB.ts',
            'ACCEPTANCE_MCFT_CAP_08_S3_NEGATIVE_DB.ts',
            'ACCEPTANCE_MCFT_CAP_08_S3_EDGE_SEMANTICS_DB.ts',
            'mcft_cap08_s3_artifact_finalize.cjs',
            'mcft_attestation_retention_store_v1.cjs --upload-readback',
            'mcft-cap-08/s3-exact-sha-attestation',
          ];
          for (const token of required) {
            if (!workflow.includes(token)) throw new Error(`RECOVERY_WORKFLOW_TOKEN_MISSING:${token}`);
          }
          const forbiddenWrite = ['s3_effective', 'true'].join(': ');
          if (workflow.includes(forbiddenWrite)) throw new Error('RECOVERY_WORKFLOW_SSOT_WRITEBACK_FORBIDDEN');
          console.log(JSON.stringify({ schema_version: 'mcft_cap08_s3_recovery_contract_v1', status: 'PASS' }));
          NODE

  recover-s3-attestation:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MCFT_SUBJECT_SHA: ${{ inputs.subject_sha || 'bcffb63003667ebc5f60ef4aa83c8243f99c5917' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 30
    steps:
      - name: Checkout recovery authority from current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact S3 merge subject
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.subject_sha || 'bcffb63003667ebc5f60ef4aa83c8243f99c5917' }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - name: Validate recovery and subject identities
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git -C subject rev-parse HEAD)" = "${MCFT_SUBJECT_SHA}"
          git cat-file -e "${MCFT_SUBJECT_SHA}^{commit}"
          git merge-base --is-ancestor "${MCFT_SUBJECT_SHA}" HEAD
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            git fetch --no-tags origin main
            test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm
          cache-dependency-path: subject/pnpm-lock.yaml
      - name: Install exact subject workspace
        working-directory: subject
        run: pnpm install --frozen-lockfile
      - name: Validate retention subject identity compatibility
        run: node scripts/governance_acceptance/mcft_attestation_retention_store_v1.cjs --subject-identity-selftest
      - name: Reprove exact merge declaration tree and owner waiver
        working-directory: subject
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S3_EXACT_SHA_ATTESTATION.cjs
      - name: Resolve candidate identity
        id: tree
        working-directory: subject
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const a = JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_08_S3_EXACT_SHA_ATTESTATION_RESULT.json', 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `base=${a.base_head_sha}\ncandidate=${a.candidate_head_sha}\nsubject=${a.subject_sha}\n`);
          NODE
      - name: Replay exact candidate boundary
        working-directory: subject
        env:
          MCFT_BASE_SHA: ${{ steps.tree.outputs.base }}
        run: |
          set -euo pipefail
          git checkout --detach "${{ steps.tree.outputs.candidate }}"
          node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S3_BOUNDARY.cjs
          git checkout --detach "${{ steps.tree.outputs.subject }}"
      - name: Bootstrap recovery positive database
        working-directory: subject
        env:
          MCFT_CAP08_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          MCFT_CAP08_TARGET_DATABASE_NAME: geox_mcft_cap08_s3_recovery_positive
          MCFT_CAP08_RUNNER_PASSWORD: cap08-s3-recovery-positive-runner-password
          MCFT_CAP08_MIGRATOR_PASSWORD: cap08-s3-recovery-positive-migrator-password
          MCFT_CAP08_LEGACY_RUNTIME_PASSWORD: cap08-s3-recovery-positive-legacy-password
          MCFT_CANDIDATE_SHA: ${{ steps.tree.outputs.candidate }}
        run: pnpm -w exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_08_PLATFORM_SECURITY_BOOTSTRAP_DB.ts
      - name: Reexecute exact positive and completed-rerun proof
        working-directory: subject
        env:
          DATABASE_URL: postgres://geox_mcft_cap08_runner_v1:cap08-s3-recovery-positive-runner-password@127.0.0.1:5432/geox_mcft_cap08_s3_recovery_positive
          MCFT_CAP08_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/geox_mcft_cap08_s3_recovery_positive
          MCFT_CAP08_S2_G3_DESTRUCTIVE_ACCEPTANCE: '1'
          MCFT_CAP08_S3_DESTRUCTIVE_ACCEPTANCE: '1'
        run: pnpm -w exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_08_S3_DECISION_ACTION_DB.ts
      - name: Reexecute corruption S3-CR01 through S3-CR08
        working-directory: subject
        env:
          DATABASE_URL: postgres://geox_mcft_cap08_runner_v1:cap08-s3-recovery-positive-runner-password@127.0.0.1:5432/geox_mcft_cap08_s3_recovery_positive
          MCFT_CAP08_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/geox_mcft_cap08_s3_recovery_positive
          MCFT_CAP08_S2_G3_DESTRUCTIVE_ACCEPTANCE: '1'
          MCFT_CAP08_S3_COMPLETED_RERUN_NEGATIVE_DESTRUCTIVE_ACCEPTANCE: '1'
        run: pnpm -w exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_08_S3_COMPLETED_RERUN_NEGATIVE_DB.ts
      - name: Cleanup recovery positive database
        if: always()
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='geox_mcft_cap08_s3_recovery_positive' AND pid<>pg_backend_pid();"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS geox_mcft_cap08_s3_recovery_positive;"
      - name: Bootstrap recovery negative database
        working-directory: subject
        env:
          MCFT_CAP08_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          MCFT_CAP08_TARGET_DATABASE_NAME: geox_mcft_cap08_s3_recovery_negative
          MCFT_CAP08_RUNNER_PASSWORD: cap08-s3-recovery-negative-runner-password
          MCFT_CAP08_MIGRATOR_PASSWORD: cap08-s3-recovery-negative-migrator-password
          MCFT_CAP08_LEGACY_RUNTIME_PASSWORD: cap08-s3-recovery-negative-legacy-password
          MCFT_CANDIDATE_SHA: ${{ steps.tree.outputs.candidate }}
        run: pnpm -w exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_08_PLATFORM_SECURITY_BOOTSTRAP_DB.ts
      - name: Reexecute exact negative and pointer matrix
        working-directory: subject
        env:
          DATABASE_URL: postgres://geox_mcft_cap08_runner_v1:cap08-s3-recovery-negative-runner-password@127.0.0.1:5432/geox_mcft_cap08_s3_recovery_negative
          MCFT_CAP08_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/geox_mcft_cap08_s3_recovery_negative
          MCFT_CAP08_S2_G3_DESTRUCTIVE_ACCEPTANCE: '1'
          MCFT_CAP08_S3_NEGATIVE_DESTRUCTIVE_ACCEPTANCE: '1'
        run: pnpm -w exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_08_S3_NEGATIVE_DB.ts
      - name: Reexecute exact edge semantics
        working-directory: subject
        env:
          DATABASE_URL: postgres://geox_mcft_cap08_runner_v1:cap08-s3-recovery-negative-runner-password@127.0.0.1:5432/geox_mcft_cap08_s3_recovery_negative
          MCFT_CAP08_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/geox_mcft_cap08_s3_recovery_negative
          MCFT_CAP08_S2_G3_DESTRUCTIVE_ACCEPTANCE: '1'
          MCFT_CAP08_S3_EDGE_DESTRUCTIVE_ACCEPTANCE: '1'
        run: pnpm -w exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_08_S3_EDGE_SEMANTICS_DB.ts
      - name: Rebuild exact merge-SHA authority artifact
        working-directory: subject
        env:
          MCFT_ARTIFACT_STAGE: EXACT_MERGE_SHA
        run: node scripts/governance_acceptance/mcft_cap08_s3_artifact_finalize.cjs
      - name: Build deterministic archive
        working-directory: subject
        run: |
          rm -rf acceptance-output/archive-input
          mkdir -p acceptance-output/archive-input
          cp acceptance-output/MCFT_CAP_08_S3_AUTHORITY_ARTIFACT.json acceptance-output/archive-input/canonical-artifact.json
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf acceptance-output/mcft-cap-08-s3-attestation.tar -C acceptance-output/archive-input canonical-artifact.json
          gzip -n -f acceptance-output/mcft-cap-08-s3-attestation.tar
      - name: Upload and read back immutable R1 authority
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GEOX_MCFT_ATTESTATION_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GEOX_MCFT_ATTESTATION_S3_SECRET_ACCESS_KEY }}
          GEOX_MCFT_ATTESTATION_S3_ENDPOINT: ${{ vars.GEOX_MCFT_ATTESTATION_S3_ENDPOINT }}
          GEOX_MCFT_ATTESTATION_S3_BUCKET: ${{ vars.GEOX_MCFT_ATTESTATION_S3_BUCKET }}
          GEOX_MCFT_ATTESTATION_S3_REGION: ${{ vars.GEOX_MCFT_ATTESTATION_S3_REGION }}
          GEOX_MCFT_ATTESTATION_S3_FORCE_PATH_STYLE: ${{ vars.GEOX_MCFT_ATTESTATION_S3_FORCE_PATH_STYLE }}
          MCFT_CANONICAL_ARTIFACT_PATH: subject/acceptance-output/MCFT_CAP_08_S3_AUTHORITY_ARTIFACT.json
          MCFT_ARTIFACT_ARCHIVE_PATH: subject/acceptance-output/mcft-cap-08-s3-attestation.tar.gz
          MCFT_REPOSITORY_OWNER: ${{ github.repository_owner }}
          MCFT_REPOSITORY_NAME: GEOX
          MCFT_ARTIFACT_NAME: mcft-cap-08-s3-exact-sha-recovery-${{ inputs.subject_sha || 'bcffb63003667ebc5f60ef4aa83c8243f99c5917' }}
          MCFT_RETENTION_LEVEL: R1
          MCFT_RETENTION_DAYS: 180
        run: node scripts/governance_acceptance/mcft_attestation_retention_store_v1.cjs --upload-readback
      - name: Finalize recovery authority result
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const artifact = read('subject/acceptance-output/MCFT_CAP_08_S3_AUTHORITY_ARTIFACT.json');
          const exact = read('subject/acceptance-output/MCFT_CAP_08_S3_EXACT_SHA_ATTESTATION_RESULT.json');
          const locator = read('acceptance-output/MCFT_CAP_07_ATTESTATION_RETENTION_LOCATOR.json');
          assert.equal(artifact.status, 'PASS');
          assert.equal(artifact.subject_sha, process.env.MCFT_SUBJECT_SHA);
          assert.equal(artifact.effective_delivery_frontier_projection.effective_status, 'S3_DECISION_ACTION_FEEDBACK_IMPLEMENTED_EFFECTIVE');
          assert.equal(exact.status, 'PASS');
          assert.equal(exact.subject_sha, process.env.MCFT_SUBJECT_SHA);
          assert.equal(locator.semantic_artifact_digest, artifact.semantic_artifact_digest);
          assert.equal(locator.retention_level, 'R1');
          assert.equal(locator.readback_verified, true);
          assert.equal(locator.locked_version_delete_denied, true);
          assert.ok(locator.object_prefix.includes(`/${process.env.MCFT_SUBJECT_SHA}/`));
          const result = {
            schema_version: 'geox_mcft_cap08_s3_attestation_recovery_result_v1',
            status: 'PASS',
            subject_sha: process.env.MCFT_SUBJECT_SHA,
            candidate_head_sha: exact.candidate_head_sha,
            candidate_tree_sha: exact.candidate_tree_sha,
            merge_tree_sha: exact.merge_tree_sha,
            candidate_to_merge_tree_delta: exact.candidate_to_merge_tree_delta,
            semantic_artifact_digest: artifact.semantic_artifact_digest,
            retention_locator: locator,
            recovered_failure: 'RETENTION_SUBJECT_FIELD_COMPATIBILITY',
            effective_status: 'S3_DECISION_ACTION_FEEDBACK_IMPLEMENTED_EFFECTIVE',
            effective_next_slice: 'S4',
            superseded_nonapplicable_contexts: [
              'mcft-cap-08/slice-exact-sha-attestation',
              'mcft-cap-08/pr1-exact-sha-attestation',
            ],
          };
          fs.mkdirSync('acceptance-output', { recursive: true });
          fs.writeFileSync('acceptance-output/MCFT_CAP_08_S3_ATTESTATION_RECOVERY_RESULT.json', `${JSON.stringify(result, null, 2)}\n`);
          console.log(JSON.stringify(result));
          NODE
      - name: Cleanup recovery negative database
        if: always()
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='geox_mcft_cap08_s3_recovery_negative' AND pid<>pg_backend_pid();"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS geox_mcft_cap08_s3_recovery_negative;"
      - name: Upload recovery evidence
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap-08-s3-attestation-recovery-${{ inputs.subject_sha || 'bcffb63003667ebc5f60ef4aa83c8243f99c5917' }}
          path: |
            acceptance-output/
            subject/acceptance-output/
          if-no-files-found: error
          retention-days: 90
      - name: Publish recovered exact-SHA authority status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs');
            let result = null;
            try {
              result = JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_08_S3_ATTESTATION_RECOVERY_RESULT.json', 'utf8'));
            } catch {}
            const ok = process.env.JOB_STATUS === 'success'
              && result?.status === 'PASS'
              && result?.subject_sha === process.env.MCFT_SUBJECT_SHA
              && result?.retention_locator?.readback_verified === true
              && result?.retention_locator?.locked_version_delete_denied === true
              && String(process.env.ARTIFACT_ID || '').length > 0;
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const target_url = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const statuses = [
              {
                context: 'mcft-cap-08/s3-exact-sha-attestation',
                state: ok ? 'success' : 'failure',
                description: ok ? `PASS S3 next=S4 recovery artifact=${process.env.ARTIFACT_ID}` : 'FAIL S3 attestation recovery',
              },
              {
                context: 'mcft-cap-08/s3-attestation-recovery',
                state: ok ? 'success' : 'failure',
                description: ok ? 'PASS exact replay and immutable R1 readback' : 'FAIL exact replay or R1 readback',
              },
            ];
            if (ok) {
              statuses.push(
                {
                  context: 'mcft-cap-08/slice-exact-sha-attestation',
                  state: 'success',
                  description: 'N/A for S3 subject; dedicated S3 attestation PASS',
                },
                {
                  context: 'mcft-cap-08/pr1-exact-sha-attestation',
                  state: 'success',
                  description: 'N/A for S3 subject; dedicated S3 attestation PASS',
                },
              );
            }
            for (const status of statuses) {
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: process.env.MCFT_SUBJECT_SHA,
                state: status.state,
                context: status.context,
                description: status.description.slice(0, 140),
                target_url,
              });
            }

name: mcft-cap-09-s4-large-blob-loader
on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-s4-registry-registration.yml'
permissions:
  contents: write
  actions: read
  pull-requests: read
jobs:
  load-s4-large-blobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Materialize verified source bytes
        env:
          PAYLOAD_B64: 
          PAYLOAD_SHA256: 0412c7abde79a7f850d70b1e511be71944361a60ec3db2179ae32495b53610da
        run: |
          set -euo pipefail
          mkdir -p /tmp/s4-large
          printf '%s' "$PAYLOAD_B64" | base64 -d > /tmp/s4-large.tar.gz
          test "$(sha256sum /tmp/s4-large.tar.gz | awk '{print $1}')" = "$PAYLOAD_SHA256"
          tar -xzf /tmp/s4-large.tar.gz -C /tmp/s4-large
      - name: Create verified Git blobs without updating refs
        id: blobs
        uses: actions/github-script@v7
        env:
          ROOT: /tmp/s4-large
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const path = require('node:path');
            const expected = {
              'runtime/postgres_expired_slot_recovery_adapter_v1.ts': 'aa16ecdab9c9a9f824783104ce89b36860caef8c',
              'runtime/restart_backfill_stale_detection_service_v1.ts': 'afce58bcde5db44ce8d2a86e7d1e8219009f86e3',
              'governance/ACCEPTANCE_MCFT_CAP_09_S4_RESTART_BACKFILL_STALE_DETECTION.cjs': '2a838ff1c8c7dd178d8c617d66333c881dc81af0',
              'runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_S4_RESTART_BACKFILL_STALE_DETECTION.ts': '40ac540f09c6a0097beafd5ca987be6cb1def54b',
            };
            const out = {};
            for (const [file, wanted] of Object.entries(expected)) {
              const bytes = fs.readFileSync(path.join(process.env.ROOT, file));
              const local = crypto.createHash('sha1').update(Buffer.concat([Buffer.from(`blob ${bytes.length}\0`), bytes])).digest('hex');
              if (local !== wanted) throw new Error(`LOCAL_BLOB_MISMATCH:${file}:${local}:${wanted}`);
              const created = await github.rest.git.createBlob({
                owner: context.repo.owner,
                repo: context.repo.repo,
                content: bytes.toString('base64'),
                encoding: 'base64',
              });
              if (created.data.sha !== wanted) throw new Error(`REMOTE_BLOB_MISMATCH:${file}:${created.data.sha}:${wanted}`);
              out[file] = created.data.sha;
            }
            fs.writeFileSync('/tmp/s4-large-blob-result.json', JSON.stringify({status:'PASS', blobs:out}, null, 2) + '\n');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap-09-s4-large-blob-loader-result
          path: /tmp/s4-large-blob-result.json
          if-no-files-found: error
          retention-days: 1

name: mcft-cap-09-s4-registry-registration

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-s4-*'
      - '.github/workflows/mcft-cap-09-s2-registry-registration.yml'
      - '.github/workflows/mcft-cap-09-s3-registry-registration.yml'
      - 'apps/server/src/runtime/twin_runtime/postgres_expired_slot_recovery_adapter_v1.ts'
      - 'apps/server/src/runtime/twin_runtime/restart_backfill_stale_detection_service_v1.ts'
      - 'docs/digital_twin/mcft/MCFT-CANDIDATE-AUTHORITY-REGISTRY-V1.json'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S4-*'
      - 'scripts/governance_acceptance/mcft_cap_09_registry_lifecycle_classifier_v1.cjs'
      - 'scripts/governance_acceptance/mcft_cap_09_registry_lifecycle_router_v1.cjs'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_S2_REGISTRY_CROSS_LIFECYCLE_REPAIR.cjs'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_S4_*'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_S4_*'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: mcft-cap09-s4-registry-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  s4-registry-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROTECTED_MAIN_ADOPTION_BASE_SHA: 'fa6e260d8cdec4a82403a86f1c7b3d5420e44ef8'
      CANONICAL_IMPLEMENTATION_SHA: 'd82c5caccce8169c19ce7ec2230e774a68a9f636'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify protected-main adoption
        id: adoption
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"
          if [ "$base" = "$PROTECTED_MAIN_ADOPTION_BASE_SHA" ] && git merge-base --is-ancestor "$CANONICAL_IMPLEMENTATION_SHA" HEAD; then
            echo 'active=1' >> "$GITHUB_OUTPUT"
            echo 'PASS: protected-main adoption successor detected; historical Registry lifecycle remains closed.'
          else
            echo 'active=0' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
      - name: Classify CAP-09 S4 Registry lifecycle
        if: steps.adoption.outputs.active != '1'
        id: lifecycle
        env:
          MCFT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          MCFT_REGISTRY_LANE: s4-registry-registration
        run: node scripts/governance_acceptance/mcft_cap_09_registry_lifecycle_classifier_v1.cjs
      - name: Download effective S3 exact-SHA R2 authority
        if: steps.adoption.outputs.active != '1' && (steps.lifecycle.outputs.mode == 's4-registry-registration')
        uses: actions/download-artifact@v4
        with:
          run-id: 31080310315
          artifact-ids: 8959189326
          path: acceptance-input/cap09-s3-effective
          repository: liyongshang44-max/GEOX
          github-token: ${{ github.token }}
      - name: Validate CAP-09 S4 Registry lifecycle
        if: steps.adoption.outputs.active != '1'
        env:
          MCFT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          MCFT_CAP09_S3_EFFECTIVE_ARTIFACT_DIR: acceptance-input/cap09-s3-effective
          MCFT_EVENT_NAME: ${{ github.event_name }}
          MCFT_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
          MCFT_REGISTRY_LANE: s4-registry-registration
          MCFT_REGISTRY_MODE: ${{ steps.lifecycle.outputs.mode }}
        run: node scripts/governance_acceptance/mcft_cap_09_registry_lifecycle_router_v1.cjs
      - name: Record protected-main adoption Registry continuity
        if: steps.adoption.outputs.active == '1'
        shell: node {0}
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          const fs=require('node:fs');
          fs.mkdirSync('acceptance-output',{recursive:true});
          const proof={
            status:'PASS',
            schema_version:'geox_mcft_cap09_s4_registry_protected_main_adoption_v1',
            classification:'PROTECTED_MAIN_ADOPTION_SUCCESSOR',
            registry_lane:'s4-registry-registration',
            subject_sha:process.env.SUBJECT_SHA,
            canonical_implementation_sha:'d82c5caccce8169c19ce7ec2230e774a68a9f636',
            historical_registry_lifecycle_reclassified:false,
            registry_mutation:false,
            runtime_mutation:false,
            production_effect:false,
            graduation_effect:false,
            mcft_cap09_completed:false
          };
          fs.writeFileSync('acceptance-output/MCFT_CAP_09_S4_REGISTRY_REGISTRATION_RESULT.json',JSON.stringify(proof,null,2)+'\n');
          console.log(JSON.stringify(proof));

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap-09-s4-registry-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_S4_REGISTRY_REGISTRATION_RESULT.json
            acceptance-output/MCFT_CAP_09_S2_REGISTRY_CROSS_LIFECYCLE_REPAIR_RESULT.json
            acceptance-output/MCFT_CAP_09_S4_CANDIDATE_LIFECYCLE_ROUTE_RESULT.json
          if-no-files-found: error
          retention-days: 90

name: mcft-cap-09-s4-candidate-r3-materializer
on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-s4-registry-registration.yml'
permissions:
  contents: write
  actions: read
  pull-requests: read
jobs:
  materialize-s4-candidate-r3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Patch exact failed Candidate bytes and create unreferenced blobs
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const cp = require('node:child_process');
            const crypto = require('node:crypto');
            const fs = require('node:fs');
            const OLD_HEAD = 'cd35ec84b268fbb59684dd40685f693cd1ee58a1';
            const ACCEPTANCE = 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_S4_RESTART_BACKFILL_STALE_DETECTION.ts';
            const CANDIDATE = 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S4-RESTART-BACKFILL-STALE-DETECTION-CANDIDATE-V1.json';
            const OLD_ACCEPTANCE_BLOB = '4c3b06b6c8f032d2b3321f9636b2b04f2011572f';
            const OLD_CANDIDATE_BLOB = 'c885bfe44df819061481fa2d29b9d10deafe7209';
            const blobSha = (bytes) => crypto.createHash('sha1').update(Buffer.concat([Buffer.from(`blob ${bytes.length}\0`), bytes])).digest('hex');
            const show = (ref, file) => cp.execFileSync('git', ['show', `${ref}:${file}`]);
            const oldAcceptance = show(OLD_HEAD, ACCEPTANCE);
            const oldCandidate = show(OLD_HEAD, CANDIDATE);
            if (blobSha(oldAcceptance) !== OLD_ACCEPTANCE_BLOB) throw new Error('OLD_ACCEPTANCE_BLOB_MISMATCH');
            if (blobSha(oldCandidate) !== OLD_CANDIDATE_BLOB) throw new Error('OLD_CANDIDATE_BLOB_MISMATCH');
            const from = 'assert.equal(availability.scheduler_lag_seconds,3600);';
            const to = 'assert.equal(availability.scheduler_lag_seconds,3900);';
            const acceptanceText = oldAcceptance.toString('utf8');
            if (acceptanceText.split(from).length !== 2) throw new Error('SCHEDULER_LAG_REPLACEMENT_CARDINALITY');
            const patchedAcceptance = Buffer.from(acceptanceText.replace(from, to), 'utf8');
            const newAcceptanceBlob = blobSha(patchedAcceptance);
            const candidateText = oldCandidate.toString('utf8');
            if (candidateText.split(OLD_ACCEPTANCE_BLOB).length !== 2) throw new Error('CANDIDATE_BINDING_REPLACEMENT_CARDINALITY');
            const patchedCandidate = Buffer.from(candidateText.replace(OLD_ACCEPTANCE_BLOB, newAcceptanceBlob), 'utf8');
            JSON.parse(patchedCandidate.toString('utf8'));
            const newCandidateBlob = blobSha(patchedCandidate);
            const createdAcceptance = await github.rest.git.createBlob({owner: context.repo.owner, repo: context.repo.repo, content: patchedAcceptance.toString('base64'), encoding: 'base64'});
            const createdCandidate = await github.rest.git.createBlob({owner: context.repo.owner, repo: context.repo.repo, content: patchedCandidate.toString('base64'), encoding: 'base64'});
            if (createdAcceptance.data.sha !== newAcceptanceBlob) throw new Error('REMOTE_ACCEPTANCE_BLOB_MISMATCH');
            if (createdCandidate.data.sha !== newCandidateBlob) throw new Error('REMOTE_CANDIDATE_BLOB_MISMATCH');
            const result = {
              status: 'PASS',
              failed_pr: 2925,
              failed_head: OLD_HEAD,
              failure: 'SCHEDULER_LAG_EXPECTATION_IGNORED_OBSERVED_WALL_CLOCK_DELAY',
              expected_scheduler_lag_seconds: 3900,
              acceptance_blob_sha: newAcceptanceBlob,
              candidate_authority_blob_sha: newCandidateBlob,
              runtime_source_delta: 0,
              migration_delta: 0,
            };
            fs.writeFileSync('/tmp/mcft-cap09-s4-candidate-r3-materialized.json', JSON.stringify(result, null, 2) + '\n');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap-09-s4-candidate-r3-materialized
          path: /tmp/mcft-cap09-s4-candidate-r3-materialized.json
          if-no-files-found: error
          retention-days: 1

name: mcft-cap09-stage3-testonly-dual-heartbeat-v1
on:
  pull_request:
    paths:
      - 'scripts/runtime_acceptance/MCFT_CAP09_STAGE3_TEST_ONLY_DUAL_HEARTBEAT_V1.cjs'
      - 'scripts/runtime_acceptance/MCFT_CAP09_WINDOWS_STAGE3_REAL_FULL_PROVIDER_ONE_BASE_DUAL_HEARTBEAT_TEST_ONLY_V1.ts'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP09_STAGE3_TEST_ONLY_DUAL_HEARTBEAT_V1.test.cjs'
      - '.github/workflows/mcft-cap09-stage3-testonly-dual-heartbeat-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-dual-heartbeat-contract-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: pnpm
      - name: Freeze source and do not change original V13 Stage3 producer
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/runtime_acceptance/MCFT_CAP09_WINDOWS_STAGE3_REAL_FULL_PROVIDER_ONE_BASE_V1.ts)" = '95bf88e2584ea01651c30ab18907c77995941542'
          test "$(git rev-parse 63dc3382f879781c604a852c7d1b28af9b0dd9f4:scripts/runtime_acceptance/MCFT_CAP09_WINDOWS_STAGE3_REAL_FULL_PROVIDER_ONE_BASE_V1.ts)" = '95bf88e2584ea01651c30ab18907c77995941542'
          git diff --exit-code 63dc3382f879781c604a852c7d1b28af9b0dd9f4 HEAD -- \
            scripts/runtime_acceptance/MCFT_CAP09_WINDOWS_STAGE3_REAL_FULL_PROVIDER_ONE_BASE_V1.ts \
            scripts/runtime_acceptance/MCFT_CAP09_GOVERNED_RETRY_HOST_V1.cjs \
            scripts/runtime_acceptance/MCFT_CAP09_RETRY_PERMIT_V1.cjs \
            scripts/governance_acceptance/MCFT_CAP09_NONAUTHORIZED_FULL_CHAIN_PROOF_GATE_V1.cjs
      - name: Offline syntax and dual heartbeat owner/fencing tests, no physical provider
        run: |
          set -euo pipefail
          node --check scripts/runtime_acceptance/MCFT_CAP09_STAGE3_TEST_ONLY_DUAL_HEARTBEAT_V1.cjs
          node --check scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP09_STAGE3_TEST_ONLY_DUAL_HEARTBEAT_V1.test.cjs
          node --test scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP09_STAGE3_TEST_ONLY_DUAL_HEARTBEAT_V1.test.cjs
      - name: Locked dependencies and new TEST_ONLY successor typecheck only
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit --pretty false --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext --esModuleInterop --types node \
            scripts/runtime_acceptance/MCFT_CAP09_WINDOWS_STAGE3_REAL_FULL_PROVIDER_ONE_BASE_DUAL_HEARTBEAT_TEST_ONLY_V1.ts
      - name: Assert no authority, provider or physical execution in CI
        run: |
          set -euo pipefail
          test -z "${DATABASE_URL:-}"
          test -z "${MCFT_GOVERNED_RETRY_STAGE:-}"
          test -z "${MCFT_GOVERNED_RETRY_TICKET:-}"
          test -z "${MCFT_CAP09_ADOPTION_REQUEST:-}"
          test -z "${PHASE7_PRIVATE_S3_SECRET_ACCESS_KEY:-}"
          echo 'PASS_TEST_ONLY_STATIC_NO_PROVIDER_NO_PG_NO_S3_NO_PERMIT'

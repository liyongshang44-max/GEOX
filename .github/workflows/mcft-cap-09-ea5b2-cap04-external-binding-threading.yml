name: mcft-cap-09-ea5b2-cap04-external-binding-threading

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-ea5b2-cap04-external-binding-threading.yml'
      - 'apps/server/src/runtime/twin_runtime/forecast_scenario_single_tick_service_v1.ts'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5B2_CAP04_EXTERNAL_BINDING_THREADING.ts'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA5B2-CAP04-EXTERNAL-BINDING-THREADING-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5B2_CAP04_EXTERNAL_BINDING_THREADING.cjs'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: mcft-cap09-ea5b2-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  cap04-external-binding-threading:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm

      - name: Resolve exact EA5B2 base
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_sha=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install exact repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax-check EA5B2 governance gate
        run: node --check scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5B2_CAP04_EXTERNAL_BINDING_THREADING.cjs

      - name: Validate exact EA5B2 governance boundary
        env:
          MCFT_BASE_SHA: ${{ steps.authority.outputs.base_sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5B2_CAP04_EXTERNAL_BINDING_THREADING.cjs

      - name: Re-prove CAP08 G3 frozen-core successor compatibility
        env:
          MCFT_BASE_SHA: ${{ steps.authority.outputs.base_sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S2_G3_BOUNDARY.cjs

      - name: Typecheck server
        run: pnpm --filter @geox/server run typecheck

      - name: Prove EA5B2 CAP04 External soil binding threading
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5B2_CAP04_EXTERNAL_BINDING_THREADING.ts

      - name: Re-prove EA5B1 External Evidence binding seam
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5B_EXTERNAL_EVIDENCE_BINDING_SEAM.ts

      - name: Re-prove historical CAP04 single-tick behavior
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_04_SINGLE_TICK_INTEGRATION.ts

      - name: Re-prove historical CAP04 negative behavior
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_04_SINGLE_TICK_INTEGRATION_NEGATIVE.ts

      - name: Re-prove historical CAP03 default binding behavior
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_03_R4_A_EVIDENCE_CLASSIFICATION.ts

      - name: Verify EA5B2 remains bounded and non-formal
        shell: node {0}
        run: |
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_EA5B2_CAP04_EXTERNAL_BINDING_THREADING_GOVERNANCE_RESULT.json','utf8'));
          if (result.status !== 'PASS') throw new Error('EA5B2_GOVERNANCE_PASS_REQUIRED');
          if (result.cap04_external_soil_binding_threading_qualified !== true) throw new Error('EA5B2_CAP04_THREADING_REQUIRED');
          if (result.replay_default_preserved !== true || result.retry_authority_drift_fail_closed !== true) throw new Error('EA5B2_DEFAULT_OR_RETRY_GUARD_REQUIRED');
          if (result.cap08_frozen_a0_bootstrap_core_unchanged !== true) throw new Error('EA5B2_CAP08_A0_CORE_INVARIANT_REQUIRED');
          if (result.ea5b_external_runtime_profile_complete !== false || result.external_package_formal_eligible !== false || result.ea5c_authorized !== false || result.formal_o00_start_authorized !== false) throw new Error('EA5B2_PREMATURE_FORMAL_EFFECT');
          if (result.database_write_count !== 0 || result.formal_evidence_write_count !== 0 || result.public_provider_request_count !== 0 || result.formal_window_started !== false || result.mcft_cap09_completed !== false) throw new Error('EA5B2_ZERO_WRITE_NONCLAIM_REQUIRED');
          console.log(JSON.stringify({status:'PASS',cap04_external_soil_binding_threading:true,replay_default:true,retry_drift_fail_closed:true,ea5b_complete:false,ea5c:false,o00:false}));

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap-09-ea5b2-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_EA5B2_CAP04_EXTERNAL_BINDING_THREADING_GOVERNANCE_RESULT.json
            acceptance-output/MCFT_CAP_08_S2_G3_BOUNDARY_RESULT.json
          if-no-files-found: warn
          retention-days: 90

name: mcft-cap-08-s6-witness-producer-effectiveness

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-08-s6-witness-producer-effectiveness.yml'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-WITNESS-PRODUCER-EFFECTIVENESS-AUTHORITY-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-FINAL-FORMAL-RUN-ORCHESTRATOR-IMPLEMENTATION-AUTHORITY-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S6-WITNESS-PRODUCER-EFFECTIVENESS-BOUNDARY-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_WITNESS_PRODUCER_EFFECTIVENESS.cjs'

permissions:
  contents: read

jobs:
  witness-producer-effectiveness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate producer effectiveness and orchestrator authority
        env:
          MCFT_BASE_SHA: 71848c201b83c03eaeaf6bf6ee6f564a51bdf0f6
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S6_WITNESS_PRODUCER_EFFECTIVENESS.cjs
      - name: Upload effectiveness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap-08-s6-witness-producer-effectiveness-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/MCFT_CAP_08_S6_WITNESS_PRODUCER_EFFECTIVENESS_RESULT.json
          if-no-files-found: error
          retention-days: 90

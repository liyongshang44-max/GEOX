name: mcft-cap-09-phase7-candidate-promotion-composition

on:
  pull_request:
    paths:
      - 'apps/server/src/external_evidence/mcft_cap09_phase7_private_candidate_capture_promotion_v1.ts'
      - 'apps/server/src/external_evidence/s3_compatible_private_candidate_manifest_store_v1.ts'
      - 'apps/server/src/external_evidence/s3_compatible_private_evidence_object_client_v1.ts'
      - 'apps/server/src/external_evidence/s3_compatible_private_retained_raw_reader_v1.ts'
      - 'apps/server/src/external_evidence/s3_compatible_raw_evidence_retention_adapter_v1.ts'
      - 'apps/server/src/external_evidence/mcft_cap09_external_collector_canonicalizer_v1.ts'
      - 'apps/server/src/external_evidence/mcft_cap09_production_evidence_work_items_v1.ts'
      - 'apps/server/src/external_evidence/provider/gfs_nomads_bundle_transport_v1.ts'
      - 'apps/server/src/external_evidence/provider/gfs_raw_bundle_evidence_decoder_v1.ts'
      - 'apps/server/src/external_evidence/provider/kbs_variate25_soil_provider_v1.ts'
      - 'apps/server/src/persistence/twin_runtime/postgres_external_formal_evidence_ingress_v1.ts'
      - 'apps/server/src/persistence/twin_runtime/postgres_external_formal_fenced_exact_base_fact_promotion_v1.ts'
      - 'apps/server/src/runtime/twin_runtime/external_formal_exact_base_fact_promotion_v1.ts'
      - 'apps/server/src/runtime/twin_runtime/external_formal_forcing_autonomous_controller_service_v1.ts'
      - 'apps/server/src/runtime/twin_runtime/postgres_external_formal_forcing_base_continuity_repository_v1.ts'
      - 'apps/server/src/runtime/twin_runtime/postgres_external_formal_forcing_controller_lifecycle_v1.ts'
      - 'apps/server/src/runtime/twin_runtime/postgres_external_formal_forcing_supply_admission_v1.ts'
      - 'apps/server/db/migrations/2026_08_25_mcft_cap_09_v13_forcing_base_continuity.sql'
      - 'apps/server/db/migrations/2026_08_25_mcft_cap_09_v13_forcing_controller_admission.sql'
      - 'apps/server/db/migrations/2026_08_25_mcft_cap_09_v13_forcing_controller_lifecycle.sql'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PHASE7_CANDIDATE_PROMOTION_COMPOSITION_V1.ts'
      - '.github/workflows/mcft-cap-09-phase7-candidate-promotion-composition.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '20.11.1'
  PNPM_VERSION: '9.15.4'
  EXACT_PREDECESSOR_SHA: '46c9c7b6b59c113848fc69daff88fb183fccc954'
  DATABASE_URL: 'postgres://postgres:postgres@127.0.0.1:5432/mcft_cap09_phase7_composition'

concurrency:
  group: mcft-cap09-phase7-candidate-promotion-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: true

jobs:
  candidate-promotion-composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcft_cap09_phase7_composition
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mcft_cap09_phase7_composition"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install exact repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Require exact stacked predecessor and zero production activation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "${{ github.event.pull_request.base.sha }}" = "$EXACT_PREDECESSOR_SHA"
          fi
          test -z "${GEOX_MCFT_CAP09_T4R1_S6_DATABASE_URL:-}"
          test -z "${GEOX_MCFT_CAP09_FORMAL_V5_DATABASE_URL:-}"
          test -z "${GEOX_MCFT_CAP09_FORMAL_V5_EPOCH_ID:-}"

      - name: Typecheck candidate/promotion composition graph
        run: |
          pnpm --filter @geox/server run typecheck
          pnpm exec tsc --noEmit --pretty false --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext --esModuleInterop --types node \
            apps/server/src/external_evidence/mcft_cap09_phase7_private_candidate_capture_promotion_v1.ts \
            scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PHASE7_CANDIDATE_PROMOTION_COMPOSITION_V1.ts

      - name: Start isolated private formal raw/candidate store
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f mcft-cap09-phase7-composition-minio >/dev/null 2>&1 || true
          docker run -d --name mcft-cap09-phase7-composition-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=phase7composition \
            -e MINIO_ROOT_PASSWORD=phase7-composition-secret-key-001 \
            minio/minio:latest server /data
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null
          docker run --rm --network host \
            -e MC_HOST_phase7=http://phase7composition:phase7-composition-secret-key-001@127.0.0.1:9000 \
            minio/mc:latest mb --ignore-existing phase7/geox-mcft-cap09-formal-raw-v1
          docker run --rm --network host \
            -e MC_HOST_phase7=http://phase7composition:phase7-composition-secret-key-001@127.0.0.1:9000 \
            minio/mc:latest anonymous set private phase7/geox-mcft-cap09-formal-raw-v1

      - name: Run real private candidate to PostgreSQL fenced promotion qualification
        env:
          MCFT_CAP09_PHASE7_COMPOSITION_DESTRUCTIVE_ACCEPTANCE: '1'
          PHASE7_COMPOSITION_SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PHASE7_PRIVATE_S3_ENDPOINT: http://127.0.0.1:9000
          PHASE7_PRIVATE_S3_BUCKET: geox-mcft-cap09-formal-raw-v1
          PHASE7_PRIVATE_S3_REGION: us-east-1
          PHASE7_PRIVATE_S3_ACCESS_KEY_ID: phase7composition
          PHASE7_PRIVATE_S3_SECRET_ACCESS_KEY: phase7-composition-secret-key-001
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_PHASE7_CANDIDATE_PROMOTION_COMPOSITION_V1.ts

      - name: Validate composition machine proof
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_PHASE7_CANDIDATE_PROMOTION_COMPOSITION_V1_RESULT.json','utf8'));
          if(p.status!=='PASS')throw new Error('PHASE7_CANDIDATE_PROMOTION_COMPOSITION_NOT_PASS');
          if(p.subject_sha!=='${{ github.event.pull_request.head.sha || github.sha }}')throw new Error('PHASE7_COMPOSITION_SUBJECT_MISMATCH');
          for(const key of [
            'candidate_manifest_private_readback',
            'replay_authority_fields_complete',
            'rehydration_semantic_manifest_exact_match',
            'real_postgres_fenced_promotion',
            'exact_three_facts_single_fenced_transaction',
            'promotion_did_not_advance_cursor',
            'controller_attestation_after_promotion',
            'cursor_advanced_only_after_attestation',
            'pre_mutation_failure_fails_closed'
          ]) if(p[key]!==true)throw new Error('PHASE7_COMPOSITION_PROOF_MISSING:'+key);
          if(
            p.capture_raw_object_count!==2
            ||p.candidate_semantic_record_count!==3
            ||p.promotion_provider_refetch_count!==0
            ||p.promotion_github_artifact_rehydration_count!==0
            ||p.promotion_raw_store_write_count!==0
            ||p.real_postgres_formal_fact_present_count!==3
            ||p.capture_formal_database_write_count!==0
          )throw new Error('PHASE7_COMPOSITION_COUNT_OR_BOUNDARY_REGRESSION');
          if(
            p.production_process_graph_wiring!==false
            ||p.production_owner_activation!==false
            ||p.formal_v5_store_provisioned!==false
            ||p.formal_v5_epoch_selected!==false
            ||p.formal_v5_armed!==false
            ||p.o00_started!==false
            ||p.protected_main_mutated!==false
            ||p.mcft_cap09_completed!==false
          )throw new Error('PHASE7_COMPOSITION_NONCLAIM_REGRESSION');

      - name: Stop isolated private object store
        if: always()
        run: docker rm -f mcft-cap09-phase7-composition-minio >/dev/null 2>&1 || true

      - name: Upload Phase7 candidate/promotion composition proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-phase7-candidate-promotion-composition-${{ github.event.pull_request.head.sha || github.sha }}
          path: acceptance-output/MCFT_CAP_09_PHASE7_CANDIDATE_PROMOTION_COMPOSITION_V1_RESULT.json
          if-no-files-found: error
          retention-days: 90

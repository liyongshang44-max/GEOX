name: tmp-mcft-cap09-3130-successor-gate-repair

on:
  push:
    branches:
      - agent/mcft-cap09-evidence-snapshot-callsite-migration
    paths:
      - '.github/workflows/tmp-mcft-cap09-3130-successor-gate-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mcft-cap09-evidence-snapshot-callsite-migration
          fetch-depth: 0

      - name: Apply successor-only workflow routing
        run: python scripts/tmp_mcft_cap09_3130_successor_gate_repair.py

      - name: Validate repaired governance syntax and preservation contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_SUCCESSOR_HISTORICAL_QUALIFICATION_COMPATIBILITY.cjs
          node --check scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_AMENDMENT_11_SUCCESSOR_RUNNER_QUALIFICATION.cjs
          current='839d320b118d37a51b659730d0a9e2a1058e433b'
          MCFT_SUCCESSOR_GATE_ID=EA5E2_FIXED_LAG MCFT_CURRENT_BASE_SHA="$current" MCFT_HISTORICAL_BASE_SHA='f150b18a2ab9691fec64eaecb00105911857994c' node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_SUCCESSOR_HISTORICAL_QUALIFICATION_COMPATIBILITY.cjs
          MCFT_SUCCESSOR_GATE_ID=EA5B1 MCFT_CURRENT_BASE_SHA="$current" MCFT_HISTORICAL_BASE_SHA='9dc8f99303e9d1efaec52afe5eac7ed816c5a8d2' node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_SUCCESSOR_HISTORICAL_QUALIFICATION_COMPATIBILITY.cjs
          MCFT_SUCCESSOR_GATE_ID=EA5B5C MCFT_CURRENT_BASE_SHA="$current" MCFT_HISTORICAL_BASE_SHA='5b911ad78fa1c66622368cb01d154d14fc3f8377' node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_SUCCESSOR_HISTORICAL_QUALIFICATION_COMPATIBILITY.cjs
          MCFT_SUCCESSOR_GATE_ID=EXTERNAL_FORMAL_V3 MCFT_CURRENT_BASE_SHA="$current" MCFT_HISTORICAL_BASE_SHA='c31a5533521a671d6059cadfe4209182ce3b1926' node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_SUCCESSOR_HISTORICAL_QUALIFICATION_COMPATIBILITY.cjs
          node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_AMENDMENT_11_SUCCESSOR_PREFLIGHT.cjs
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_EA5E2_AMENDMENT_11_SUCCESSOR_PREFLIGHT.json','utf8'));
          if(p.status!=='PASS') throw new Error('PREFLIGHT_PASS_REQUIRED');
          const codes=p.readiness_blockers.map(x=>x.code);
          if(codes.includes('EVIDENCE_SNAPSHOT_CALLSITE_MIGRATION_NOT_COMPLETE')) throw new Error('SNAPSHOT_MIGRATION_BLOCKER_STILL_PRESENT');
          if(JSON.stringify(codes)!==JSON.stringify(['CURRENT_CROP_AUTHORITY_HAS_NO_FUTURE_LEGAL_TARGET'])) throw new Error('READINESS_MUST_BE_CROP_ONLY:'+JSON.stringify(codes));
          console.log(JSON.stringify({status:'PASS',readiness_blockers:codes}));
          NODE
          rm -rf acceptance-output

      - name: Commit repaired successor gate routing and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-mcft-cap09-3130-successor-gate-repair.yml
          rm scripts/tmp_mcft_cap09_3130_successor_gate_repair.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/mcft-cap-09-ea5e2-fixed-lag-collector-runtime-schedule-readiness.yml \
                  .github/workflows/mcft-cap-09-ea5b1-external-evidence-binding-seam.yml \
                  .github/workflows/mcft-cap-09-ea5b5c-external-cap04-orchestration.yml \
                  .github/workflows/mcft-cap-09-external-formal-v3-persistent-tick-qualification.yml \
                  scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_AMENDMENT_11_SUCCESSOR_RUNNER_QUALIFICATION.cjs \
                  .github/workflows/tmp-mcft-cap09-3130-successor-gate-repair.yml \
                  scripts/tmp_mcft_cap09_3130_successor_gate_repair.py
          git diff --cached --check
          git commit -m 'test(mcft-cap09): separate historical exact gates from successor regression'
          git push origin HEAD:agent/mcft-cap09-evidence-snapshot-callsite-migration

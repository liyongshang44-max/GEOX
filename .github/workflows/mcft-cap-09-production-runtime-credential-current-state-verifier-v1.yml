name: mcft-cap-09-production-runtime-credential-current-state-verifier-v1

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-production-runtime-credential-current-state-verifier-v1.yml'
      - 'scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_RUNTIME_CREDENTIAL_READINESS_V1.cjs'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_PRODUCTION_RUNTIME_CREDENTIAL_CURRENT_STATE_VERIFIER_V1.cjs'

permissions:
  contents: read

concurrency:
  group: mcft-cap09-runtime-credential-current-state-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  current-state-verifier-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact subject and current main base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.base.ref }}" = "main"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${{ github.event.pull_request.base.sha }}"

      - name: Syntax-check current-state verifier
        run: node --check scripts/runtime_acceptance/VERIFY_MCFT_CAP_09_PRODUCTION_RUNTIME_CREDENTIAL_READINESS_V1.cjs

      - name: Syntax-check verifier qualification
        run: node --check scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_PRODUCTION_RUNTIME_CREDENTIAL_CURRENT_STATE_VERIFIER_V1.cjs

      - name: Qualify residue-aware current-state verifier
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_PRODUCTION_RUNTIME_CREDENTIAL_CURRENT_STATE_VERIFIER_V1.cjs

      - name: Upload verifier qualification proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-runtime-credential-current-state-verifier-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/MCFT_CAP_09_PRODUCTION_RUNTIME_CREDENTIAL_CURRENT_STATE_VERIFIER_V1_RESULT.json
          if-no-files-found: error
          retention-days: 90

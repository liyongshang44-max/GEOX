name: b09ac-eligibility-policy-v2-action-window-contract-shape-exact

on:
  pull_request:
    branches:
      - docs/bline-b09ac-eligibility-policy-v2-action-window-contract-shape-v1

jobs:
  exact-product-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove literal B-09ac product head
        run: |
          git checkout 6787989f509d96ffb0500ad7999955189b5a76c2
          test "$(git rev-parse HEAD)" = "6787989f509d96ffb0500ad7999955189b5a76c2"
          test "$(git rev-parse HEAD^)" = "88ed1f6139f12b2ca61d1c494d2ec979b1f96500"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace dependencies
        run: |
          pnpm --filter @geox/contracts build
          pnpm --filter @geox/device-skills build
          pnpm --filter @geox/skill-registry build

      - name: B-02 semantic governance
        run: node scripts/governance_acceptance/ACCEPTANCE_B02_SEMANTIC_CONTRACT_LINTER_V1.cjs

      - name: B-09ac contract-shape acceptance
        run: node scripts/governance_acceptance/ACCEPTANCE_B09AC_ELIGIBILITY_POLICY_V2_ACTION_WINDOW_CONTRACT_SHAPE_V1.cjs

      - name: B-09ab predecessor preservation
        run: |
          git diff --exit-code 88ed1f6139f12b2ca61d1c494d2ec979b1f96500 6787989f509d96ffb0500ad7999955189b5a76c2 -- \
            docs/architecture/semantic_convergence/GEOX-B09AB-ACTION-WINDOW-HORIZON-AUTHORITY-TOPOLOGY-DECISION-PACKAGE-V1.json \
            docs/architecture/semantic_convergence/GEOX-B09AB-ACTION-WINDOW-HORIZON-AUTHORITY-TOPOLOGY-DECISION-PACKAGE-V1.md \
            scripts/governance_acceptance/ACCEPTANCE_B09AB_ACTION_WINDOW_HORIZON_AUTHORITY_TOPOLOGY_V1.cjs
          echo "B09AB_PREDECESSOR_PRESERVED_PASS"

      - name: B-09v selector regression
        run: node --import tsx --test apps/server/src/domain/decision/decision_eligibility_policy_selector_v1.contract.test.ts

      - name: B-09s writer regression
        run: node --import tsx --test apps/server/src/domain/decision/decision_eligibility_policy_declaration_fact_v1.contract.test.ts

      - name: B-09m declaration regression
        run: node --import tsx --test apps/server/src/contracts/decision_eligibility_policy_declaration_v1.contract.test.ts

      - name: B-07d evaluator regression
        run: node --import tsx --test apps/server/src/domain/decision/decision_eligibility_evaluator_v1.contract.test.ts

      - name: B-07e runtime regression
        run: node --import tsx --test apps/server/src/domain/decision/decision_eligibility_runtime_v1.contract.test.ts

      - name: Product diff remains bounded
        run: |
          git diff --name-only 88ed1f6139f12b2ca61d1c494d2ec979b1f96500 6787989f509d96ffb0500ad7999955189b5a76c2 > /tmp/b09ac-files.txt
          cat /tmp/b09ac-files.txt
          test "$(wc -l < /tmp/b09ac-files.txt | tr -d ' ')" = "4"
          git diff --check 88ed1f6139f12b2ca61d1c494d2ec979b1f96500 6787989f509d96ffb0500ad7999955189b5a76c2

      - name: Prove production and MCFT surfaces unchanged
        run: |
          git diff --exit-code 88ed1f6139f12b2ca61d1c494d2ec979b1f96500 6787989f509d96ffb0500ad7999955189b5a76c2 -- \
            apps/server/src apps/server/db packages config .github/workflows docs/digital_twin docs/twin_kernel scripts/runtime_acceptance
          echo "B09AC_PRODUCTION_MCFT_UNCHANGED_PASS"

      - name: Server typecheck
        run: pnpm --filter @geox/server typecheck

      - name: Server build
        run: pnpm --filter @geox/server build

      - name: Prove validation did not mutate product
        run: |
          test "$(git rev-parse HEAD)" = "6787989f509d96ffb0500ad7999955189b5a76c2"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "B09AC_VALIDATION_ONLY_NO_PRODUCT_MUTATION_PASS"

      - name: Marker
        run: |
          echo "B09AC_EXACT_HEAD 6787989f509d96ffb0500ad7999955189b5a76c2"
          echo "B09AC_CONTRACT_SHAPE_PROPOSAL_PASS"

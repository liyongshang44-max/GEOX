name: mcft-cap-08-s6-formal-comparator-post-dispatch-observer

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-08-s6-formal-comparator-post-dispatch-observer.yml'

permissions:
  contents: read
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTHORITY_MAIN_SHA: 54365415ffb25d8620b0aea0546e1fbd792425a5
      BROKER_WORKFLOW: mcft-cap-08-s6-formal-comparator-replacement-001-one-shot-dispatch-broker.yml
      TARGET_WORKFLOW: mcft-cap-08-s6-formal-cross-run-comparator-execution.yml
      COMPARATOR_EXECUTION_ID: MCFT-CAP-08-S6-FORMAL-CROSS-RUN-COMPARATOR-20260804-REPLACEMENT-001
    steps:
      - name: Observe unique broker and comparator terminal runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p acceptance-output
          python - <<'PY'
          import io
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          import zipfile

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          head_sha = os.environ['AUTHORITY_MAIN_SHA']
          broker_workflow = os.environ['BROKER_WORKFLOW']
          target_workflow = os.environ['TARGET_WORKFLOW']
          execution_id = os.environ['COMPARATOR_EXECUTION_ID']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'mcft-cap08-s6-formal-comparator-post-dispatch-observer',
          }

          def get_json(path):
              request = urllib.request.Request(f'https://api.github.com/repos/{repo}{path}', headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def list_matching(workflow, event):
              encoded = urllib.parse.quote(workflow, safe='')
              data = get_json(f'/actions/workflows/{encoded}/runs?event={event}&branch=main&per_page=100')
              return [item for item in data.get('workflow_runs', []) if item.get('head_sha') == head_sha and item.get('run_attempt') == 1]

          broker = None
          for _ in range(120):
              matches = list_matching(broker_workflow, 'push')
              if len(matches) > 1:
                  raise SystemExit('MULTIPLE_MATCHING_BROKER_RUNS')
              if len(matches) == 1 and matches[0].get('status') == 'completed':
                  broker = matches[0]
                  break
              time.sleep(5)
          if broker is None:
              raise SystemExit('BROKER_TERMINAL_RUN_NOT_RESOLVED')

          target = None
          if broker.get('conclusion') == 'success':
              for _ in range(120):
                  matches = list_matching(target_workflow, 'workflow_dispatch')
                  if len(matches) > 1:
                      raise SystemExit('MULTIPLE_MATCHING_COMPARATOR_RUNS')
                  if len(matches) == 1 and matches[0].get('status') == 'completed':
                      target = matches[0]
                      break
                  time.sleep(5)
              if target is None:
                  raise SystemExit('COMPARATOR_TERMINAL_RUN_NOT_RESOLVED')

          def artifacts(run_id):
              return get_json(f'/actions/runs/{run_id}/artifacts?per_page=100').get('artifacts', [])

          def download_jsons(artifact):
              request = urllib.request.Request(artifact['archive_download_url'], headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  payload = response.read()
              found = {}
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  for name in archive.namelist():
                      if name.endswith('.json'):
                          with archive.open(name) as handle:
                              found[name] = json.load(handle)
                      elif name.endswith('dispatch-http-status.txt') or name.endswith('dispatch-response.txt'):
                          with archive.open(name) as handle:
                              found[name] = handle.read().decode('utf-8', errors='replace')
              return found

          broker_artifacts = artifacts(broker['id'])
          broker_artifact = next((item for item in broker_artifacts if item['name'].startswith('mcft-cap-08-s6-formal-comparator-replacement-001-dispatch-broker-')), None)
          if broker_artifact is None:
              raise SystemExit('BROKER_ARTIFACT_NOT_FOUND')
          broker_files = download_jsons(broker_artifact)

          result = {
              'schema_version': 'geox_mcft_cap08_s6_formal_comparator_post_dispatch_observation_v1',
              'authority_main_sha': head_sha,
              'comparator_execution_id': execution_id,
              'broker': {
                  'workflow_run_id': broker['id'],
                  'workflow_run_number': broker['run_number'],
                  'workflow_run_attempt': broker['run_attempt'],
                  'event': broker['event'],
                  'status': broker['status'],
                  'conclusion': broker['conclusion'],
                  'head_sha': broker['head_sha'],
                  'created_at': broker['created_at'],
                  'updated_at': broker['updated_at'],
                  'artifact': {
                      'id': broker_artifact['id'],
                      'name': broker_artifact['name'],
                      'digest': broker_artifact.get('digest'),
                      'expired': broker_artifact.get('expired'),
                  },
                  'files': broker_files,
              },
              'comparator': None,
              'rerun_performed': False,
              'duplicate_dispatch_performed': False,
              'observer_permissions': ['contents:read', 'actions:read'],
          }

          if target is not None:
              target_artifacts = artifacts(target['id'])
              expected_name = f'mcft-cap-08-s6-formal-cross-run-comparator-{execution_id}'
              target_artifact = next((item for item in target_artifacts if item['name'] == expected_name), None)
              if target_artifact is None:
                  raise SystemExit('FORMAL_COMPARATOR_ARTIFACT_NOT_FOUND')
              target_files = download_jsons(target_artifact)
              result['comparator'] = {
                  'workflow_run_id': target['id'],
                  'workflow_run_number': target['run_number'],
                  'workflow_run_attempt': target['run_attempt'],
                  'event': target['event'],
                  'status': target['status'],
                  'conclusion': target['conclusion'],
                  'head_sha': target['head_sha'],
                  'created_at': target['created_at'],
                  'updated_at': target['updated_at'],
                  'artifact': {
                      'id': target_artifact['id'],
                      'name': target_artifact['name'],
                      'digest': target_artifact.get('digest'),
                      'expired': target_artifact.get('expired'),
                  },
                  'files': target_files,
              }

          result['status'] = 'OBSERVED_TERMINAL'
          with open('acceptance-output/MCFT_CAP_08_S6_FORMAL_COMPARATOR_POST_DISPATCH_OBSERVATION.json', 'w', encoding='utf-8') as handle:
              json.dump(result, handle, indent=2)
              handle.write('\n')
          print(json.dumps(result, indent=2))
          PY

      - name: Upload read-only observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap-08-s6-formal-comparator-post-dispatch-observation-${{ github.run_id }}
          path: acceptance-output/
          if-no-files-found: error
          retention-days: 365

name: mcft-cap-08-s6-formal-comparator-post-dispatch-observer

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-08-s6-formal-comparator-post-dispatch-observer.yml'

permissions:
  contents: read
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTHORITY_MAIN_SHA: 54365415ffb25d8620b0aea0546e1fbd792425a5
      BROKER_WORKFLOW: mcft-cap-08-s6-formal-comparator-replacement-001-one-shot-dispatch-broker.yml
      TARGET_WORKFLOW: mcft-cap-08-s6-formal-cross-run-comparator-execution.yml
      COMPARATOR_EXECUTION_ID: MCFT-CAP-08-S6-FORMAL-CROSS-RUN-COMPARATOR-20260804-REPLACEMENT-001
    steps:
      - name: Record unique terminal run and artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p acceptance-output
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          head_sha = os.environ['AUTHORITY_MAIN_SHA']
          execution_id = os.environ['COMPARATOR_EXECUTION_ID']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'mcft-cap08-s6-formal-comparator-post-dispatch-observer',
          }

          def get_json(path):
              request = urllib.request.Request(f'https://api.github.com/repos/{repo}{path}', headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def matching(workflow, event):
              encoded = urllib.parse.quote(workflow, safe='')
              data = get_json(f'/actions/workflows/{encoded}/runs?event={event}&branch=main&per_page=100')
              return [item for item in data.get('workflow_runs', []) if item.get('head_sha') == head_sha and item.get('run_attempt') == 1]

          broker_matches = matching(os.environ['BROKER_WORKFLOW'], 'push')
          target_matches = matching(os.environ['TARGET_WORKFLOW'], 'workflow_dispatch')
          assert len(broker_matches) == 1, f'BROKER_MATCH_COUNT_{len(broker_matches)}'
          assert len(target_matches) == 1, f'COMPARATOR_MATCH_COUNT_{len(target_matches)}'
          broker = broker_matches[0]
          target = target_matches[0]
          assert broker['status'] == 'completed'
          assert target['status'] == 'completed'

          broker_artifacts = get_json(f"/actions/runs/{broker['id']}/artifacts?per_page=100").get('artifacts', [])
          target_artifacts = get_json(f"/actions/runs/{target['id']}/artifacts?per_page=100").get('artifacts', [])
          broker_artifact = next((x for x in broker_artifacts if x['name'].startswith('mcft-cap-08-s6-formal-comparator-replacement-001-dispatch-broker-')), None)
          target_name = f'mcft-cap-08-s6-formal-cross-run-comparator-{execution_id}'
          target_artifact = next((x for x in target_artifacts if x['name'] == target_name), None)
          assert broker_artifact is not None
          assert target_artifact is not None

          def run_record(run):
              return {
                  'workflow_run_id': run['id'],
                  'workflow_run_number': run['run_number'],
                  'workflow_run_attempt': run['run_attempt'],
                  'event': run['event'],
                  'status': run['status'],
                  'conclusion': run['conclusion'],
                  'head_sha': run['head_sha'],
                  'created_at': run['created_at'],
                  'updated_at': run['updated_at'],
              }

          def artifact_record(item):
              return {
                  'id': item['id'],
                  'name': item['name'],
                  'digest': item.get('digest'),
                  'expired': item.get('expired'),
                  'size_in_bytes': item.get('size_in_bytes'),
                  'created_at': item.get('created_at'),
                  'expires_at': item.get('expires_at'),
              }

          result = {
              'schema_version': 'geox_mcft_cap08_s6_formal_comparator_post_dispatch_observation_v1',
              'status': 'OBSERVED_UNIQUE_TERMINAL_METADATA',
              'authority_main_sha': head_sha,
              'comparator_execution_id': execution_id,
              'broker': {**run_record(broker), 'artifact': artifact_record(broker_artifact)},
              'comparator': {**run_record(target), 'artifact': artifact_record(target_artifact)},
              'matching_broker_run_count': 1,
              'matching_comparator_run_count': 1,
              'rerun_performed': False,
              'duplicate_dispatch_performed': False,
              'observer_permissions': ['contents:read', 'actions:read'],
          }
          output = 'acceptance-output/MCFT_CAP_08_S6_FORMAL_COMPARATOR_POST_DISPATCH_OBSERVATION.json'
          with open(output, 'w', encoding='utf-8') as handle:
              json.dump(result, handle, indent=2)
              handle.write('\n')
          print(json.dumps(result, indent=2))
          PY

      - name: Upload read-only observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap-08-s6-formal-comparator-post-dispatch-observation-${{ github.run_id }}
          path: acceptance-output/
          if-no-files-found: error
          retention-days: 365

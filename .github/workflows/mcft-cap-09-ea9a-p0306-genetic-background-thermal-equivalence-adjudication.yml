name: mcft-cap-09-ea9a-p0306-genetic-background-thermal-equivalence-adjudication

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-ea9a-p0306-genetic-background-thermal-equivalence-adjudication.yml'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA9A-P0306-GENETIC-BACKGROUND-THERMAL-EQUIVALENCE-ADJUDICATION-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA9A_P0306_GENETIC_BACKGROUND_THERMAL_EQUIVALENCE_ADJUDICATION.cjs'
      - 'scripts/runtime_acceptance/PROBE_MCFT_CAP_09_EA9A_P0306_GENETIC_BACKGROUND_THERMAL_EQUIVALENCE_ADJUDICATION.mjs'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: mcft-cap09-ea9a-p0306-equivalence-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  p0306-genetic-background-thermal-equivalence-adjudication:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 20.11.1
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.1

      - name: Resolve exact P0306 equivalence adjudication base
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_sha=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Syntax-check P0306 adjudication proof code
        run: |
          node --check scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA9A_P0306_GENETIC_BACKGROUND_THERMAL_EQUIVALENCE_ADJUDICATION.cjs
          node --check scripts/runtime_acceptance/PROBE_MCFT_CAP_09_EA9A_P0306_GENETIC_BACKGROUND_THERMAL_EQUIVALENCE_ADJUDICATION.mjs

      - name: Validate exact P0306 adjudication governance boundary
        env:
          MCFT_BASE_SHA: ${{ steps.authority.outputs.base_sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA9A_P0306_GENETIC_BACKGROUND_THERMAL_EQUIVALENCE_ADJUDICATION.cjs

      - name: Execute live P0306 genetic-background thermal-equivalence evidence adjudication
        env:
          MCFT_SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: node scripts/runtime_acceptance/PROBE_MCFT_CAP_09_EA9A_P0306_GENETIC_BACKGROUND_THERMAL_EQUIVALENCE_ADJUDICATION.mjs

      - name: Upload immutable P0306 equivalence adjudication proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-ea9a-p0306-equivalence-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_EA9A_P0306_GENETIC_BACKGROUND_THERMAL_EQUIVALENCE_GOVERNANCE_RESULT.json
            acceptance-output/MCFT_CAP_09_EA9A_P0306_GENETIC_BACKGROUND_THERMAL_EQUIVALENCE_ADJUDICATION_RESULT.json
            docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA9A-P0306-GENETIC-BACKGROUND-THERMAL-EQUIVALENCE-ADJUDICATION-V1.json
          if-no-files-found: error
          retention-days: 90

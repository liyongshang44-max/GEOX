name: mcft-cap-09-phase6-retire-github-production-execution

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-phase6-retire-github-production-execution.yml'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-PHASE6-GITHUB-PRODUCTION-EXECUTION-RETIREMENT-AUTHORITY-V1.json'
      - 'scripts/governance_acceptance/AUDIT_MCFT_CAP_09_PHASE6_GITHUB_PRODUCTION_OWNERS_V1.cjs'
      - '.github/workflows/mcft-cap-09-rolling-preboundary-capture.yml'
      - '.github/workflows/mcft-cap-09-t4r1-rolling-hourly-scheduler.yml'
      - '.github/workflows/mcft-cap-09-t4r1-rolling-preboundary-capture.yml'
      - '.github/workflows/mcft-cap-09-amendment19-formal-hourly-evidence.yml'
      - '.github/workflows/mcft-cap-09-amendment19-formal-arm.yml'
      - '.github/workflows/mcft-cap-09-amendment19-formal-a0-bootstrap.yml'
      - '.github/workflows/mcft-cap-09-amendment19-formal-live-runner.yml'
      - '.github/workflows/mcft-cap-09-pre-runtime-hardening.yml'
      - '.github/workflows/mcft-cap-09-s6-formal-24-hour-stage-1b-closure.yml'
      - '.github/workflows/mcft-cap-09-formal-bootstrap-evidence-authority.yml'
      - '.github/workflows/mcft-cap-09-t4r1-formal-v3-o01-recovery.yml'
      - '.github/workflows/mcft-cap-09-ea5e2-rolling-operational-activation-live.yml'
      - '.github/workflows/mcft-cap-09-rolling-kbs-intersection.yml'
      - '.github/workflows/mcft-cap-09-kbs-batch-qualification-window.yml'
      - '.github/workflows/mcft-cap-09-kbs-publication-cadence-observer.yml'
      - '.github/workflows/mcft-cap-09-ea9b-current-main-window-observer.yml'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: mcft-cap09-phase6-github-owner-retirement-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  zero-github-production-owners:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact Phase6 subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact stacked Phase5 closure ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor '75d4961279bd64dc1c9dd7d68aac189c72c98846' HEAD
          test "$(git rev-parse '75d4961279bd64dc1c9dd7d68aac189c72c98846^{commit}')" = '75d4961279bd64dc1c9dd7d68aac189c72c98846'

      - name: Selftest Phase6 owner auditor
        run: node scripts/governance_acceptance/AUDIT_MCFT_CAP_09_PHASE6_GITHUB_PRODUCTION_OWNERS_V1.cjs selftest

      - name: Enforce zero retired GitHub production owners and triggers
        run: node scripts/governance_acceptance/AUDIT_MCFT_CAP_09_PHASE6_GITHUB_PRODUCTION_OWNERS_V1.cjs enforce

      - name: Validate Phase6 retirement machine proof
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_PHASE6_GITHUB_PRODUCTION_OWNERS_AUDIT_V1.json','utf8'));
          if(p.status!=='PASS')throw new Error('PHASE6_GITHUB_OWNER_AUDIT_PASS_REQUIRED');
          for(const key of ['active_retired_owner_or_trigger_count','retired_actions_write_count','unclassified_scheduled_count','unclassified_workflow_run_count'])if(p[key]!==0)throw new Error('PHASE6_GITHUB_OWNER_ZERO_REQUIRED:'+key);
          if(p.historical_phase5_workflow_blob_count!==16||p.historical_phase5_workflow_blobs_all_match!==true)throw new Error('PHASE6_HISTORICAL_WORKFLOW_BINDING_REQUIRED');
          const t=p.target_after_retirement;
          for(const key of ['github_provider_request_count_during_formal','github_formal_twin_db_mutation_count','github_production_tick_execution_count','github_hourly_wake_dependency_count'])if(t[key]!==0)throw new Error('PHASE6_HARD_ZERO_TARGET_REQUIRED:'+key);
          if(p.production_runtime_mutation!==false||p.formal_v5_armed!==false||p.mcft_cap09_completed!==false)throw new Error('PHASE6_NON_EFFECT_BOUNDARY_REQUIRED');

      - name: Upload Phase6 GitHub owner retirement proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-phase6-github-owner-retirement-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: acceptance-output/MCFT_CAP_09_PHASE6_GITHUB_PRODUCTION_OWNERS_AUDIT_V1.json
          if-no-files-found: error
          retention-days: 90

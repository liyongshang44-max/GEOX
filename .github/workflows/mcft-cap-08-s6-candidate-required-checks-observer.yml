name: mcft-cap-08-s6-candidate-required-checks-observer

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-08-s6-candidate-required-checks-observer.yml'

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read
  pull-requests: read

jobs:
  observe-required-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: 4c7afd9b0c80de89c20a478771e7d14f7908f981
      TARGET_PR: '2814'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read exact Candidate checks and trusted enforcement runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p acceptance-output
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; sha=os.environ['TARGET_SHA']; pr=int(os.environ['TARGET_PR'])
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'mcft-cap08-s6-required-checks-observer'}
          def get(path):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}{path}',headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: return {'status':r.status,'body':json.load(r)}
              except urllib.error.HTTPError as e:
                  return {'status':e.code,'body':e.read().decode('utf-8','replace')}
          checks=get(f'/commits/{sha}/check-runs?per_page=100')
          statuses=get(f'/commits/{sha}/status')
          protection=get('/branches/main/protection/required_status_checks')
          runs=get('/actions/runs?per_page=100')
          matching=[]
          if isinstance(runs['body'],dict):
              for r in runs['body'].get('workflow_runs',[]):
                  prs=[x.get('number') for x in r.get('pull_requests',[])]
                  if pr in prs or r.get('head_sha')==sha:
                      matching.append({k:r.get(k) for k in ['id','name','event','status','conclusion','head_sha','run_attempt','workflow_id','created_at']})
          result={'schema_version':'geox_mcft_cap08_s6_candidate_required_checks_observation_v1','status':'PASS','target_sha':sha,'target_pr':pr,'check_runs_http_status':checks['status'],'check_runs':checks['body'].get('check_runs',[]) if isinstance(checks['body'],dict) else checks['body'],'combined_status_http_status':statuses['status'],'combined_status':statuses['body'],'required_status_checks_http_status':protection['status'],'required_status_checks':protection['body'],'matching_workflow_runs':matching,'write_performed':False}
          with open('acceptance-output/MCFT_CAP_08_S6_CANDIDATE_REQUIRED_CHECKS_OBSERVATION.json','w') as f: json.dump(result,f,indent=2);f.write('\n')
          print(json.dumps({'target_sha':sha,'checks':[(x.get('name'),x.get('status'),x.get('conclusion'),x.get('app',{}).get('slug')) for x in result['check_runs']],'required':result['required_status_checks'],'matching_runs':matching},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mcft-cap-08-s6-candidate-required-checks-${{ github.run_id }}
          path: acceptance-output/MCFT_CAP_08_S6_CANDIDATE_REQUIRED_CHECKS_OBSERVATION.json
          if-no-files-found: error
          retention-days: 90

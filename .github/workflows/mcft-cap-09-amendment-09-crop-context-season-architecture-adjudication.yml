name: mcft-cap-09-amendment-09-crop-context-season-architecture-adjudication

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-amendment-09-crop-context-season-architecture-adjudication.yml'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_AMENDMENT_09_CROP_CONTEXT_SEASON_ARCHITECTURE_ADJUDICATION.cjs'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-AMENDMENT-09-CROP-CONTEXT-SEASON-ARCHITECTURE-ADJUDICATION-AUTHORITY.md'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: mcft-cap09-amendment09-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  amendment-09-crop-context-season-architecture-adjudication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact Amendment-09 base
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_sha=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Syntax-check Amendment-09 governance gate
        run: node --check scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_AMENDMENT_09_CROP_CONTEXT_SEASON_ARCHITECTURE_ADJUDICATION.cjs

      - name: Validate exact Amendment-09 authority boundary
        env:
          MCFT_BASE_SHA: ${{ steps.authority.outputs.base_sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_AMENDMENT_09_CROP_CONTEXT_SEASON_ARCHITECTURE_ADJUDICATION.cjs

      - name: Upload immutable Amendment-09 proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-amendment09-crop-season-adjudication-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_AMENDMENT_09_CROP_CONTEXT_SEASON_ARCHITECTURE_ADJUDICATION_GOVERNANCE_RESULT.json
            docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-AMENDMENT-09-CROP-CONTEXT-SEASON-ARCHITECTURE-ADJUDICATION-AUTHORITY.md
          if-no-files-found: error
          retention-days: 90

name: mcft-cap-09-ea5e2-collector-phase-orchestration

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-ea5e2-collector-phase-orchestration.yml'
      - 'apps/server/src/external_evidence/mcft_cap09_external_collector_canonicalizer_v1.ts'
      - 'apps/server/src/external_evidence/mcft_cap09_external_formal_collector_phase_orchestrator_v1.ts'
      - 'apps/server/src/runtime/twin_runtime/postgres_external_formal_evidence_source_v1.ts'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_COLLECTOR_PHASE_ORCHESTRATION.ts'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_EXTERNAL_FORMAL_DATABASE_EVIDENCE_SOURCE.ts'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_DATABASE_SOURCE_TO_EXTERNAL_CAP04.ts'
      - 'scripts/runtime_acceptance/MCFT_CAP_09_EA5E2_LIVE_PROVIDER_TWO_PHASE.py'
      - 'scripts/runtime_acceptance/RUN_MCFT_CAP_09_EA5E2_LIVE_PROVIDER_PHASE_LOCAL_DB.ts'
      - 'scripts/runtime_acceptance/RUN_MCFT_CAP_09_EA5E2_LIVE_PROVIDER_PHASE_PRIVATE_TRANSIENT_R2.ts'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA5E2-COLLECTOR-RUNTIME-SCHEDULE-READINESS-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_FIXED_LAG_COLLECTOR_RUNTIME_SCHEDULE_READINESS.cjs'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: mcft-cap09-ea5e2-collector-phase-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  ea5e2-collector-phase-orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax-check raw-first live provider helpers
        run: |
          python -m py_compile \
            scripts/runtime_acceptance/MCFT_CAP_09_EA5E2_LIVE_PROVIDER_TWO_PHASE.py \
            scripts/runtime_acceptance/PROBE_MCFT_CAP_09_EA4_LIVE_SOURCE_EXACT_HEAD_QUALIFICATION.py

      - name: Typecheck server with collector phase composition
        run: pnpm --filter @geox/server run typecheck

      - name: Typecheck both isolated live provider phase runners
        run: |
          pnpm exec tsc --noEmit \
            --target ES2022 \
            --lib ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --strict \
            --esModuleInterop \
            --types node \
            --skipLibCheck \
            scripts/runtime_acceptance/RUN_MCFT_CAP_09_EA5E2_LIVE_PROVIDER_PHASE_LOCAL_DB.ts \
            scripts/runtime_acceptance/RUN_MCFT_CAP_09_EA5E2_LIVE_PROVIDER_PHASE_PRIVATE_TRANSIENT_R2.ts

      - name: Prove same-slot two-phase collector composition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance-output
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_COLLECTOR_PHASE_ORCHESTRATION.ts \
            2>&1 | tee acceptance-output/EA5E2_COLLECTOR_PHASE_ORCHESTRATION.log
          grep -q '"status":"PASS"' acceptance-output/EA5E2_COLLECTOR_PHASE_ORCHESTRATION.log
          grep -q '"canonical_fact_write_count":0' acceptance-output/EA5E2_COLLECTOR_PHASE_ORCHESTRATION.log
          grep -q '"same_slot_key_both_phases":true' acceptance-output/EA5E2_COLLECTOR_PHASE_ORCHESTRATION.log
          grep -q '"whole_phase_validation_before_ingress":true' acceptance-output/EA5E2_COLLECTOR_PHASE_ORCHESTRATION.log
          grep -q '"raw_retention_before_decode":true' acceptance-output/EA5E2_COLLECTOR_PHASE_ORCHESTRATION.log

      - name: Prove External Formal DB-only delayed Evidence source
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_EXTERNAL_FORMAL_DATABASE_EVIDENCE_SOURCE.ts \
            2>&1 | tee acceptance-output/EA5E2_EXTERNAL_FORMAL_DATABASE_EVIDENCE_SOURCE.log
          grep -q '"status":"PASS"' acceptance-output/EA5E2_EXTERNAL_FORMAL_DATABASE_EVIDENCE_SOURCE.log
          grep -q '"exact_interval_cutoff_minutes":432' acceptance-output/EA5E2_EXTERNAL_FORMAL_DATABASE_EVIDENCE_SOURCE.log
          grep -q '"future_forcing_post_logical_time_excluded":true' acceptance-output/EA5E2_EXTERNAL_FORMAL_DATABASE_EVIDENCE_SOURCE.log
          grep -q '"database_write_count":0' acceptance-output/EA5E2_EXTERNAL_FORMAL_DATABASE_EVIDENCE_SOURCE.log
          grep -q '"provider_request_count":0' acceptance-output/EA5E2_EXTERNAL_FORMAL_DATABASE_EVIDENCE_SOURCE.log
          grep -q '"historical_s2_s5_reader_modified":false' acceptance-output/EA5E2_EXTERNAL_FORMAL_DATABASE_EVIDENCE_SOURCE.log

      - name: Prove DB-only Evidence feeds External CAP04 candidate
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_DATABASE_SOURCE_TO_EXTERNAL_CAP04.ts \
            2>&1 | tee acceptance-output/EA5E2_DATABASE_SOURCE_TO_EXTERNAL_CAP04.log
          grep -q '"status":"PASS"' acceptance-output/EA5E2_DATABASE_SOURCE_TO_EXTERNAL_CAP04.log
          grep -q '"delayed_rainfall_to_external_cap04":true' acceptance-output/EA5E2_DATABASE_SOURCE_TO_EXTERNAL_CAP04.log
          grep -q '"delayed_historical_et0_to_external_cap04":true' acceptance-output/EA5E2_DATABASE_SOURCE_TO_EXTERNAL_CAP04.log
          grep -q '"external_cap04_forecast_status":"COMPLETED"' acceptance-output/EA5E2_DATABASE_SOURCE_TO_EXTERNAL_CAP04.log
          grep -q '"external_cap04_forecast_point_count":72' acceptance-output/EA5E2_DATABASE_SOURCE_TO_EXTERNAL_CAP04.log
          grep -q '"canonical_persistence_authorized":false' acceptance-output/EA5E2_DATABASE_SOURCE_TO_EXTERNAL_CAP04.log
          grep -q '"database_write_count":0' acceptance-output/EA5E2_DATABASE_SOURCE_TO_EXTERNAL_CAP04.log
          grep -q '"provider_request_count":0' acceptance-output/EA5E2_DATABASE_SOURCE_TO_EXTERNAL_CAP04.log

      - name: Upload collector and DB-source proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-ea5e2-collector-phase-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: |
            acceptance-output/EA5E2_COLLECTOR_PHASE_ORCHESTRATION.log
            acceptance-output/EA5E2_EXTERNAL_FORMAL_DATABASE_EVIDENCE_SOURCE.log
            acceptance-output/EA5E2_DATABASE_SOURCE_TO_EXTERNAL_CAP04.log
          if-no-files-found: error
          retention-days: 90

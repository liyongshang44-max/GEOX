name: mcft-cap-09-ea5e2-collector-phase-orchestration

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-ea5e2-collector-phase-orchestration.yml'
      - 'apps/server/src/external_evidence/mcft_cap09_external_formal_collector_phase_orchestrator_v1.ts'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_COLLECTOR_PHASE_ORCHESTRATION.ts'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA5E2-COLLECTOR-RUNTIME-SCHEDULE-READINESS-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_FIXED_LAG_COLLECTOR_RUNTIME_SCHEDULE_READINESS.cjs'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: mcft-cap09-ea5e2-collector-phase-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  ea5e2-collector-phase-orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm

      - name: Install exact repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck server with collector phase composition
        run: pnpm --filter @geox/server run typecheck

      - name: Prove same-slot two-phase collector composition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance-output
          pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5E2_COLLECTOR_PHASE_ORCHESTRATION.ts \
            2>&1 | tee acceptance-output/EA5E2_COLLECTOR_PHASE_ORCHESTRATION.log
          grep -q '"status":"PASS"' acceptance-output/EA5E2_COLLECTOR_PHASE_ORCHESTRATION.log
          grep -q '"canonical_fact_write_count":0' acceptance-output/EA5E2_COLLECTOR_PHASE_ORCHESTRATION.log
          grep -q '"same_slot_key_both_phases":true' acceptance-output/EA5E2_COLLECTOR_PHASE_ORCHESTRATION.log
          grep -q '"whole_phase_validation_before_ingress":true' acceptance-output/EA5E2_COLLECTOR_PHASE_ORCHESTRATION.log
          grep -q '"raw_retention_before_decode":true' acceptance-output/EA5E2_COLLECTOR_PHASE_ORCHESTRATION.log

      - name: Upload collector phase proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-ea5e2-collector-phase-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: acceptance-output/EA5E2_COLLECTOR_PHASE_ORCHESTRATION.log
          if-no-files-found: error
          retention-days: 90

name: MCFT CAP-09 A18 Biological Stage Context V4

on:
  pull_request:
    branches:
      - feat/mcft-cap09-t4r1-current-crop-authority-composition-v1
      - qual/mcft-cap09-current-main-requal-cb9-v1
      - main
    paths:
      - .github/workflows/mcft-cap-09-a18-biological-stage-context-v4.yml
      - apps/server/src/runtime/twin_runtime/external_formal_a18_crop_context_v4.ts
      - apps/server/src/runtime/twin_runtime/external_formal_a18_crop_context_v4.test.ts
      - scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_A18_BIOLOGICAL_STAGE_CONTEXT_V4.cjs
      - scripts/runtime_acceptance/PROBE_MCFT_CAP_09_A18_BIOLOGICAL_STAGE_CONTEXT_V4.ts

permissions:
  contents: read

jobs:
  qualification:
    if: >-
      github.base_ref == 'feat/mcft-cap09-t4r1-current-crop-authority-composition-v1' ||
      github.base_ref == 'qual/mcft-cap09-current-main-requal-cb9-v1' ||
      (
        github.base_ref == 'main' &&
        github.head_ref == 'fix/mcft-cap09-current-main-requal-pr-carrier-v1' &&
        github.event.pull_request.base.sha == 'a8a5046f38e51fdd7b745c9e211ed61299164b23'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MCFT_CAP09_A18_V4_BASE_SHA: f55dfb2d928d4846f45e808ac2ff3040543a3151
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ ((github.base_ref == 'qual/mcft-cap09-current-main-requal-cb9-v1' && github.head_ref == 'main' && github.event.pull_request.base.sha == 'cb9fea1c7e37c4aea34ae9a7985dd371cd7fe4e4') || (github.base_ref == 'main' && github.head_ref == 'fix/mcft-cap09-current-main-requal-pr-carrier-v1' && github.event.pull_request.base.sha == 'a8a5046f38e51fdd7b745c9e211ed61299164b23')) && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve bounded qualification mode
        shell: bash
        run: |
          set -euo pipefail

          MODE=HISTORICAL

          if [ '${{ github.base_ref }}' = 'qual/mcft-cap09-current-main-requal-cb9-v1' ]; then
            test '${{ github.head_ref }}' = 'main'
            test '${{ github.event.pull_request.base.sha }}' = 'cb9fea1c7e37c4aea34ae9a7985dd371cd7fe4e4'

            SUBJECT='${{ github.event.pull_request.head.sha }}'

            test "$(git rev-parse HEAD)" = "$SUBJECT"

            git fetch --no-tags origin main
            test "$(git rev-parse origin/main)" = "$SUBJECT"

            MODE=CURRENT_MAIN_REQUALIFICATION_PR

          elif [ '${{ github.base_ref }}' = 'main' ] && \
               [ '${{ github.head_ref }}' = 'fix/mcft-cap09-current-main-requal-pr-carrier-v1' ]; then

            test '${{ github.event.pull_request.base.sha }}' = 'a8a5046f38e51fdd7b745c9e211ed61299164b23'
            test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'

            git fetch --no-tags origin main
            test "$(git rev-parse origin/main)" = 'a8a5046f38e51fdd7b745c9e211ed61299164b23'

            MODE=ROUTING_INSTALLATION_PR
          fi

          echo "MCFT_CAP09_REQUAL_MODE=$MODE" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for current lifecycle proof
        run: pnpm exec playwright install --with-deps chromium
      - name: Server typecheck
        run: pnpm run typecheck:server
      - name: V4 materializer tests
        run: node --import tsx --test apps/server/src/runtime/twin_runtime/external_formal_a18_crop_context_v4.test.ts
      - name: Exact candidate governance
        if: env.MCFT_CAP09_REQUAL_MODE == 'HISTORICAL'
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_A18_BIOLOGICAL_STAGE_CONTEXT_V4.cjs
      - name: Fresh lifecycle
        env:
          MCFT_SUBJECT_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/runtime_acceptance/PROBE_MCFT_CAP_09_T4R1_PERSISTENT_LIFECYCLE_QUALIFICATION.mjs
      - name: Fresh stage and Kc
        run: python3 scripts/runtime_acceptance/PROBE_MCFT_CAP_09_T4R1_THERMAL_BIOLOGICAL_STAGE_AUTHORITY_V1.py
      - name: Compose current crop authority
        run: node scripts/runtime_acceptance/COMPOSE_MCFT_CAP_09_T4R1_CURRENT_CROP_AUTHORITY_V1.cjs
      - name: Prove V4 materialization from bounded current authority
        if: env.MCFT_CAP09_REQUAL_MODE != 'HISTORICAL'
        shell: bash
        run: |
          set -euo pipefail

          node --import tsx --input-type=module <<'NODE'
          import fs from "node:fs";

          const {
            deriveExternalFormalA18CropContextIdentityHashV4,
            materializeExternalFormalA18CropContextV4,
          } = await import(
            "./apps/server/src/runtime/twin_runtime/external_formal_a18_crop_context_v4.ts"
          );

          const crop = JSON.parse(fs.readFileSync(
            "docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-S6-FORMAL-CROP-CONTEXT-AUTHORITY-V3.json",
            "utf8"
          ));

          const matrix = JSON.parse(fs.readFileSync(
            "docs/digital_twin/mcft/GEOX-MCFT-00-CONFIGURATION-BINDING-MATRIX.json",
            "utf8"
          ));

          const currentPath =
            "acceptance-output/MCFT_CAP09_T4R1_CURRENT_CROP_AUTHORITY_COMPOSITION_RESULT.json";

          const current =
            JSON.parse(fs.readFileSync(currentPath,"utf8"));

          if (
            current.status !== "PASS" ||
            current.qualification_outcome !==
              "CURRENT_CROP_CONTEXT_AUTHORITY_CANDIDATE_RESOLVED"
          ) {
            throw new Error(
              "A18_V4_CURRENT_CROP_COMPOSITION_PASS_REQUIRED"
            );
          }

          const logical =
            current?.biological_stage?.authority_as_of;

          if (
            typeof logical !== "string" ||
            !logical.endsWith(":00:00.000Z")
          ) {
            throw new Error(
              "A18_V4_CURRENT_STAGE_AUTHORITY_TIME_REQUIRED"
            );
          }

          const expected =
            deriveExternalFormalA18CropContextIdentityHashV4({
              logical_time: logical,
              crop_stage_code: current.crop_water_use_stage,
              current_crop_authority_evidence_digest:
                current.evidence_digest,
            });

          const result =
            materializeExternalFormalA18CropContextV4({
              logical_time: logical,
              expected_identity_hash: expected,
              crop_authority: crop,
              configuration_matrix: matrix,
              current_crop_authority: current,
              activation_mode: "QUALIFICATION_ONLY",
            });

          if (result.stage_code !== "LATE" || result.kc !== 0.6) {
            throw new Error(
              "A18_V4_EXPECTED_LATE_KC_REQUIRED"
            );
          }

          if (result.production_effective !== false) {
            throw new Error(
              "A18_V4_PRODUCTION_EFFECT_FORBIDDEN"
            );
          }

          fs.mkdirSync("acceptance-output",{recursive:true});

          fs.writeFileSync(
            "acceptance-output/MCFT_CAP09_A18_BIOLOGICAL_STAGE_CONTEXT_V4_RESULT.json",
            JSON.stringify({
              schema_version:
                "geox_mcft_cap09_a18_biological_stage_context_v4_result_v1",
              status: "PASS",
              logical_time: logical,
              stage_code: result.stage_code,
              kc: result.kc,
              crop_stage_schedule:
                result.context.crop_stage_schedule,
              current_crop_authority_evidence_digest:
                result.current_crop_authority_evidence_digest,
              context_identity_hash:
                result.context_identity_hash,
              context_materialization_hash:
                result.context_materialization_hash,
              water_use_stage_forward_stable_under_thermal_progression:
                true,
              lifecycle_requires_separate_validation:
                true,
              historical_v3_mid_authority_rewritten:
                false,
              production_effective:
                false,
              runtime_write_count:
                0,
              database_write_count:
                0,
              formal_execution_count:
                "0/24",
              qualification_time_basis:
                "CURRENT_STAGE_AUTHORITY_AS_OF"
            },null,2) + "\n"
          );

          console.log(JSON.stringify({
            status: "PASS",
            logical_time: logical,
            stage_code: result.stage_code,
            kc: result.kc,
            production_effective: false,
            qualification_time_basis:
              "CURRENT_STAGE_AUTHORITY_AS_OF"
          }));
          NODE
      - name: Prove V4 materialization from fresh authority
        if: env.MCFT_CAP09_REQUAL_MODE == 'HISTORICAL'
        run: node --import tsx scripts/runtime_acceptance/PROBE_MCFT_CAP_09_A18_BIOLOGICAL_STAGE_CONTEXT_V4.ts
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-a18-biological-stage-context-v4
          path: |
            acceptance-output/MCFT_CAP09_T4R1_CURRENT_CROP_AUTHORITY_COMPOSITION_RESULT.json
            acceptance-output/MCFT_CAP09_A18_BIOLOGICAL_STAGE_CONTEXT_V4_RESULT.json
          if-no-files-found: warn
          retention-days: 90

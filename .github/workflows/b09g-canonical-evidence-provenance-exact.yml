name: b09g-canonical-evidence-provenance-exact

on:
  push:
    branches:
      - ci/bline-b09g-canonical-evidence-provenance-exact-2026-08-28

jobs:
  exact-product-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove literal B-09g product head checkout
        run: |
          git checkout 1abb9c2fa818efb455c43da93e4efeadd492e199
          test "$(git rev-parse HEAD)" = "1abb9c2fa818efb455c43da93e4efeadd492e199"
          test "$(git rev-parse HEAD^)" = "f3fa6e4a27f833859e6d5bea77a43a02272a265d"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace dependencies
        run: |
          pnpm --filter @geox/contracts build
          pnpm --filter @geox/device-skills build
          pnpm --filter @geox/skill-registry build

      - name: Server typecheck
        run: pnpm --filter @geox/server typecheck

      - name: B-02 semantic governance
        run: node scripts/governance_acceptance/ACCEPTANCE_B02_SEMANTIC_CONTRACT_LINTER_V1.cjs

      - name: B-09g provenance acceptance
        run: node scripts/governance_acceptance/ACCEPTANCE_B09G_CANONICAL_EVIDENCE_QUALIFICATION_PROVENANCE_V1.cjs

      - name: B-09g Evidence Judge provenance contracts
        run: node --import tsx --test apps/server/src/domain/judge/evidence_judge_canonical_sufficiency_shadow_v1.test.ts

      - name: B-09g Agronomy referential binding contracts
        run: node --import tsx --test apps/server/src/domain/decision/agronomy_evidence_dependency_shadow_binding_v1.contract.test.ts

      - name: B-09e analysis regression
        run: node scripts/governance_acceptance/ACCEPTANCE_B09E_EVIDENCE_CONSUMER_DEPENDENCY_V1.cjs

      - name: B-09d inventory regression
        run: node --import tsx --test apps/server/src/domain/decision/evidence_semantic_shadow_inventory_v1.contract.test.ts

      - name: B-09c collector regression
        run: node --import tsx --test apps/server/src/domain/decision/evidence_semantic_shadow_runtime_collector_v1.contract.test.ts

      - name: B-09b comparator regression
        run: node --import tsx --test apps/server/src/domain/decision/evidence_semantic_shadow_comparator_v1.contract.test.ts

      - name: B-09a migration inventory regression
        run: node --import tsx --test apps/server/src/contracts/semantic_migration_v1.contract.test.ts

      - name: B-07 Agronomy criterion regression
        run: node --import tsx --test apps/server/src/domain/decision/agronomy_judge_eligibility_precursor_adapter_v1.contract.test.ts

      - name: B-07 eligibility evaluator/runtime regression
        run: |
          node --import tsx --test apps/server/src/domain/decision/decision_eligibility_evaluator_v1.contract.test.ts
          node --import tsx --test apps/server/src/domain/decision/decision_eligibility_runtime_v1.contract.test.ts

      - name: Lock governance and authority boundaries
        run: |
          node <<'NODE'
          const fs=require("fs");
          const cp=require("child_process");
          const reg=JSON.parse(fs.readFileSync("docs/architecture/semantic_convergence/GEOX-SEMANTIC-OWNERSHIP-REGISTER-V1.json","utf8"));
          const readiness=JSON.parse(fs.readFileSync("docs/architecture/semantic_convergence/GEOX-B09-REPLACEMENT-READINESS-V1.json","utf8"));
          const before=JSON.parse(cp.execFileSync("git",["show","f3fa6e4a27f833859e6d5bea77a43a02272a265d:docs/architecture/semantic_convergence/GEOX-SEMANTIC-OWNERSHIP-REGISTER-V1.json"],{encoding:"utf8"}));

          const flatten=(r)=>(r.semantics||[]).flatMap(s=>(s.registered_producers||[])
            .filter(p=>p.grandfathered_duplicate===true)
            .map(p=>({semantic_id:s.semantic_id,...p})))
            .sort((a,b)=>(a.semantic_id+"::"+a.producer_id).localeCompare(b.semantic_id+"::"+b.producer_id));
          const b=flatten(before),a=flatten(reg);
          if(b.length!==29||a.length!==29||JSON.stringify(b)!==JSON.stringify(a)) {
            throw new Error("B09G_GRANDFATHERED_AUTHORITY_MUTATED");
          }

          const criterionGuard=(reg.static_guards||[]).find(g=>g.guard_id==="G-B02-17-decision-eligibility-criterion-instantiation");
          const expectedCriterion=[
            "apps/server/src/domain/decision/stage1_eligibility_precursor_adapter_v1.ts",
            "apps/server/src/domain/decision/agronomy_judge_eligibility_precursor_adapter_v1.ts"
          ];
          if(!criterionGuard||JSON.stringify(criterionGuard.registered_paths)!==JSON.stringify(expectedCriterion)) {
            throw new Error("B09G_CRITERION_PRODUCER_SET_CHANGED");
          }

          const stageGuard=(reg.static_guards||[]).find(g=>g.guard_id==="G-B02-25-stage1-shadow-comparator-runtime-disconnection");
          if(!stageGuard||JSON.stringify(stageGuard.registered_paths)!==JSON.stringify(["apps/server/src/domain/decision/evidence_semantic_shadow_comparator_v1.ts"])) {
            throw new Error("B09G_STAGE1_COMPARATOR_CONNECTED");
          }

          if(readiness.authority_removal_performed!==false) throw new Error("B09G_AUTHORITY_REMOVAL_PERFORMED");
          const family=(readiness.families||[]).find(x=>x.semantic_id==="evidence.qualification");
          if(!family||family.consumer_migration_state!=="PARTIAL"||family.authority_removal_state!=="PENDING_CONSUMER_MIGRATION") {
            throw new Error("B09G_READINESS_CHANGED");
          }

          console.log("B09G_29_GRANDFATHERED_UNCHANGED_PASS");
          console.log("B09G_B07_CRITERION_PRODUCER_SET_UNCHANGED_PASS");
          console.log("B09G_STAGE1_COMPARATOR_DISCONNECTED_PASS");
          console.log("B09G_READINESS_UNCHANGED_PASS");
          NODE

      - name: Graph and historical runtime boundaries remain unchanged
        run: |
          git diff --exit-code f3fa6e4a27f833859e6d5bea77a43a02272a265d 1abb9c2fa818efb455c43da93e4efeadd492e199 -- \
            docs/architecture/semantic_convergence/GEOX-PARALLEL-AUTHORITY-GRAPH-V1.json \
            docs/architecture/semantic_convergence/GEOX-B09-REPLACEMENT-READINESS-V1.json \
            apps/server/src/routes/judge_v2.ts \
            apps/server/src/domain/judge/agronomy_judge_v2.ts \
            apps/server/src/domain/decision/stage1_action_boundary_v1.ts \
            apps/server/src/domain/decision/agronomy_judge_eligibility_precursor_adapter_v1.ts \
            apps/server/src/domain/decision/decision_eligibility_runtime_v1.ts \
            apps/server/db \
            packages \
            .github/workflows \
            docs/digital_twin \
            docker-compose.commercial_v1.yml
          echo "B09G_GRAPH_RUNTIME_SCHEMA_MCFT_UNTOUCHED_PASS"

      - name: Lock C-004 C-036 C-037 unchanged
        run: |
          node <<'NODE'
          const fs=require("fs");
          const cp=require("child_process");
          const before=JSON.parse(cp.execFileSync("git",["show","f3fa6e4a27f833859e6d5bea77a43a02272a265d:docs/architecture/semantic_convergence/GEOX-PARALLEL-AUTHORITY-GRAPH-V1.json"],{encoding:"utf8"}));
          const after=JSON.parse(fs.readFileSync("docs/architecture/semantic_convergence/GEOX-PARALLEL-AUTHORITY-GRAPH-V1.json","utf8"));
          for(const id of ["C-004","C-036","C-037"]){
            const b=(before.current_connectivity_edges||[]).find(e=>e.edge_id===id);
            const a=(after.current_connectivity_edges||[]).find(e=>e.edge_id===id);
            if(JSON.stringify(b)!==JSON.stringify(a)) throw new Error("B09G_CONNECTIVITY_EDGE_CHANGED:"+id);
          }
          console.log("B09G_C004_C036_C037_UNCHANGED_PASS");
          NODE

      - name: Product diff remains bounded
        run: |
          git diff --name-only f3fa6e4a27f833859e6d5bea77a43a02272a265d 1abb9c2fa818efb455c43da93e4efeadd492e199 > /tmp/b09g-files.txt
          cat /tmp/b09g-files.txt
          test "$(wc -l < /tmp/b09g-files.txt | tr -d ' ')" = "7"
          grep -qx "apps/server/src/domain/decision/agronomy_evidence_dependency_shadow_binding_v1.contract.test.ts" /tmp/b09g-files.txt
          grep -qx "apps/server/src/domain/decision/agronomy_evidence_dependency_shadow_binding_v1.ts" /tmp/b09g-files.txt
          grep -qx "apps/server/src/domain/judge/evidence_judge_canonical_sufficiency_shadow_v1.test.ts" /tmp/b09g-files.txt
          grep -qx "apps/server/src/domain/judge/evidence_judge_v2.ts" /tmp/b09g-files.txt
          grep -qx "docs/architecture/semantic_convergence/GEOX-B09G-CANONICAL-EVIDENCE-QUALIFICATION-PROVENANCE-SHADOW-V1.md" /tmp/b09g-files.txt
          grep -qx "docs/architecture/semantic_convergence/GEOX-SEMANTIC-OWNERSHIP-REGISTER-V1.json" /tmp/b09g-files.txt
          grep -qx "scripts/governance_acceptance/ACCEPTANCE_B09G_CANONICAL_EVIDENCE_QUALIFICATION_PROVENANCE_V1.cjs" /tmp/b09g-files.txt
          git diff --check f3fa6e4a27f833859e6d5bea77a43a02272a265d 1abb9c2fa818efb455c43da93e4efeadd492e199
          echo "B09G_BOUNDED_PRODUCT_DIFF_PASS"

      - name: Prepare isolated runtime env
        run: |
          cat > .env.b09g <<'EOF_INNER'
          GEOX_RUNTIME_ENV=pilot
          POSTGRES_USER=landos
          POSTGRES_PASSWORD=b09g-postgres-strong-2026
          POSTGRES_DB=landos
          GEOX_MCFT_MIGRATOR_PASSWORD=b09g-mcft-migrator-strong-2026
          GEOX_RUNTIME_DATABASE_PASSWORD=b09g-runtime-database-strong-2026
          GEOX_DEPLOYMENT_SUBJECT_COMMIT=1abb9c2fa818efb455c43da93e4efeadd492e199
          GEOX_AO_ACT_TOKEN=admin_token
          GEOX_EXECUTOR_TOKEN=tenant_a_admin_token
          GEOX_EVIDENCE_S3_BUCKET=evidence-exports-v1
          GEOX_EVIDENCE_S3_PUBLIC_ENDPOINT=http://127.0.0.1:9000
          MINIO_ROOT_USER=geoxminio
          MINIO_ROOT_PASSWORD=b09g-minio-strong-2026
          MQTT_AUTH_REQUIRED=1
          GEOX_MQTT_AUTH_REQUIRED=1
          MQTT_USERNAME=geoxmqtt
          MQTT_PASSWORD=b09g-mqtt-strong-2026
          CORS_ORIGINS=https://b09g-ci.geox.invalid
          GEOX_ALLOWED_ORIGINS=https://b09g-ci.geox.invalid
          APP_SECRET=b09g-app-secret-strong-2026
          GEOX_APP_SECRET=b09g-app-secret-strong-2026
          PUBLIC_BASE_URL=https://b09g-ci.geox.invalid
          GEOX_PUBLIC_BASE_URL=https://b09g-ci.geox.invalid
          GEOX_EXECUTION_DEFAULT_DISABLED=1
          GEOX_EXECUTION_ENABLE_EXPLICITLY=0
          GEOX_EXECUTION_ENABLE_REASON=b09g-provenance-shadow-validation
          GEOX_DEVTOOLS_ENABLED=0
          EOF_INNER

      - name: Start isolated commercial runtime
        timeout-minutes: 10
        run: |
          set -euo pipefail
          timeout 180 docker compose --env-file .env.b09g -f docker-compose.commercial_v1.yml up -d minio minio-init
          timeout 300 docker compose --env-file .env.b09g -f docker-compose.commercial_v1.yml up -d postgres mqtt server
          docker compose --env-file .env.b09g -f docker-compose.commercial_v1.yml ps

      - name: Wait for API ready
        run: |
          set -euo pipefail
          timeout 180 bash -lc 'until curl -fsS http://127.0.0.1:3001/api/health >/dev/null; do sleep 2; done'
          curl -fsS http://127.0.0.1:3001/api/health

      - name: Exact runtime canonical qualification provenance proof
        run: |
          set -euo pipefail
          mkdir -p acceptance-output
          export DATABASE_URL="postgres://landos:b09g-postgres-strong-2026@127.0.0.1:5433/landos"
          node <<'NODE'
          const fs=require("fs");
          const assert=require("assert/strict");
          const {Pool}=require("pg");

          const base="http://127.0.0.1:3001";
          const token="admin_token";
          const tenant={tenant_id:"tenantA",project_id:"projectA",group_id:"groupA"};
          const suffix=Date.now();
          const field="field_b09g_"+suffix;
          const emptyField="field_b09g_empty_"+suffix;
          const device="device_b09g_"+suffix;
          const sampleId="rs_b09g_"+suffix;
          const pool=new Pool({connectionString:process.env.DATABASE_URL});

          async function call(path,method="GET",body){
            const res=await fetch(base+path,{
              method,
              headers:{
                authorization:"Bearer "+token,
                ...(body===undefined?{}:{"content-type":"application/json"})
              },
              body:body===undefined?undefined:JSON.stringify(body)
            });
            const text=await res.text();
            let json=null; try{json=text?JSON.parse(text):null}catch{}
            assert.equal(res.ok,true,method+" "+path+" failed "+res.status+" "+text);
            assert.equal(json?.ok,true,method+" "+path+" json.ok!=true "+text);
            return json;
          }

          (async()=>{
            const sampleTs=Date.now()-60_000;
            await pool.query(
              `INSERT INTO raw_samples
                (sample_id,sensor_id,ts_ms,metric,value,qc_quality,source,payload_json)
               VALUES ($1,$2,$3,'soil_moisture',0.5,'ok','device',$4::jsonb)`,
              [sampleId,device,sampleTs,JSON.stringify({
                ...tenant,field_id:field,device_id:device,sensor_id:device,
                ts_ms:sampleTs,metric:"soil_moisture",value:0.5,
                sample_kind:"raw",interpolated:false,synthetic:false,fake_sample:false
              })]
            );

            const decisionTime=Date.now()+1000;
            const evidence=await call("/api/v1/judge/evidence/evaluate","POST",{
              ...tenant,
              field_id:field,
              device_id:device,
              soil_moisture:0.5,
              observed_at_ts_ms:sampleTs,
              now_ts_ms:decisionTime,
              last_heartbeat_ts_ms:decisionTime-30_000,
              last_telemetry_ts_ms:decisionTime-30_000,
              evidence_refs:["b09g:runtime"]
            });

            const shadow=evidence.judge_result.outputs.canonical_evidence_sufficiency_shadow_v1;
            const expectedRef="evidence_qualification_v1:raw_sample:"+sampleId+":"+decisionTime;
            assert.equal(shadow.canonical_evidence_qualification_ref_basis,"QUALIFICATION_ID_DIRECT");
            assert.equal(shadow.canonical_evidence_qualification_refs_state,"AVAILABLE");
            assert.deepEqual(shadow.canonical_evidence_qualification_refs,[expectedRef]);
            assert.equal(shadow.counts.total,1);
            assert.equal(shadow.authority_mode,"SHADOW_NON_AUTHORITATIVE");

            const evidenceRead=await call(
              "/api/v1/judge/results/"+encodeURIComponent(evidence.judge_result.judge_id)+"?"+
              new URLSearchParams(tenant).toString()
            );
            assert.deepEqual(
              evidenceRead.judge_result.outputs.canonical_evidence_sufficiency_shadow_v1.canonical_evidence_qualification_refs,
              [expectedRef]
            );

            const agronomy=await call("/api/v1/judge/agronomy/evaluate","POST",{
              ...tenant,
              field_id:field,
              device_id:device,
              evidence_judge_id:evidence.judge_result.judge_id,
              evidence_judge_verdict:evidence.judge_result.verdict,
              soil_moisture:0.7,
              target_soil_moisture:0.5,
              root_zone_depth_mm:300,
              rain_forecast_mm_72h:0,
              et0_mm_72h:0,
              crop_stage:"V6",
              application_efficiency:0.8,
              evidence_refs:["b09g:runtime"]
            });
            const binding=agronomy.judge_result.outputs.agronomy_evidence_dependency_shadow_v1;
            assert.equal(binding.binding_state,"BOUND");
            assert.deepEqual(binding.canonical_evidence_qualification_refs,[expectedRef]);
            assert.equal(binding.canonical_evidence_qualification_refs_state,"AVAILABLE_FROM_PERSISTED_CANONICAL_SHADOW");
            assert.equal(binding.criterion_shadow_provenance_readiness,"READY_FOR_CRITERION_SHADOW");
            assert.equal(binding.migration_readiness,"NOT_READY_FOR_CRITERION_CUTOVER");
            assert.equal(binding.consumer_migration_performed,false);
            assert.equal(binding.authority_removal_permitted,false);
            assert.equal("criterion" in binding,false);
            assert.equal("verdict" in binding,false);

            const emptyDecisionTime=Date.now()+2000;
            const emptyEvidence=await call("/api/v1/judge/evidence/evaluate","POST",{
              ...tenant,
              field_id:emptyField,
              device_id:"device_b09g_empty_"+suffix,
              soil_moisture:0.5,
              observed_at_ts_ms:emptyDecisionTime-60_000,
              now_ts_ms:emptyDecisionTime,
              last_heartbeat_ts_ms:emptyDecisionTime-30_000,
              last_telemetry_ts_ms:emptyDecisionTime-30_000,
              evidence_refs:["b09g:empty"]
            });
            const emptyShadow=emptyEvidence.judge_result.outputs.canonical_evidence_sufficiency_shadow_v1;
            assert.equal(emptyShadow.canonical_evidence_qualification_refs_state,"EMPTY_NO_CANONICAL_QUALIFICATIONS");
            assert.deepEqual(emptyShadow.canonical_evidence_qualification_refs,[]);
            assert.equal(emptyShadow.counts.total,0);
            assert.equal(emptyShadow.status,"NEEDS_EVIDENCE");

            const out={
              schema_version:"b09g_runtime_canonical_evidence_provenance_proof_v1",
              product_head:"1abb9c2fa818efb455c43da93e4efeadd492e199",
              evidence_judge_id:evidence.judge_result.judge_id,
              agronomy_judge_id:agronomy.judge_result.judge_id,
              sample_id:sampleId,
              decision_time_ms:decisionTime,
              exact_qualification_ref:expectedRef,
              qualification_refs_state:shadow.canonical_evidence_qualification_refs_state,
              qualification_ref_basis:shadow.canonical_evidence_qualification_ref_basis,
              binding_refs_state:binding.canonical_evidence_qualification_refs_state,
              criterion_shadow_provenance_readiness:binding.criterion_shadow_provenance_readiness,
              migration_readiness:binding.migration_readiness,
              consumer_migration_performed:binding.consumer_migration_performed,
              authority_removal_permitted:binding.authority_removal_permitted,
              empty_field_ref_state:emptyShadow.canonical_evidence_qualification_refs_state,
              empty_field_ref_count:emptyShadow.canonical_evidence_qualification_refs.length,
              nonclaims:[
                "PROVENANCE_READY_DOES_NOT_MEAN_CRITERION_CUTOVER",
                "NO_DECISION_ELIGIBILITY_CRITERION_INSTANTIATED",
                "NO_CONSUMER_MIGRATION",
                "NO_AUTHORITY_REMOVAL"
              ]
            };
            fs.writeFileSync("acceptance-output/b09g-runtime-canonical-evidence-provenance-proof.json",JSON.stringify(out,null,2)+"\n");
            console.log(JSON.stringify(out,null,2));
            console.log("B09G_RUNTIME_CANONICAL_EVIDENCE_PROVENANCE_PROOF_PASS");
          })().finally(()=>pool.end()).catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Prove validation did not mutate product
        run: |
          test "$(git rev-parse HEAD)" = "1abb9c2fa818efb455c43da93e4efeadd492e199"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "B09G_VALIDATION_ONLY_NO_PRODUCT_MUTATION_PASS"

      - name: Upload B-09g runtime proof
        uses: actions/upload-artifact@v4
        with:
          name: b09g-runtime-canonical-evidence-provenance-proof
          path: acceptance-output/b09g-runtime-canonical-evidence-provenance-proof.json
          if-no-files-found: error

      - name: Stop isolated runtime
        if: always()
        run: docker compose --env-file .env.b09g -f docker-compose.commercial_v1.yml down -v || true

      - name: Server build
        run: pnpm --filter @geox/server build

      - name: Marker
        run: |
          echo "B09G_EXACT_HEAD 1abb9c2fa818efb455c43da93e4efeadd492e199"
          echo "B09G_CANONICAL_EVIDENCE_QUALIFICATION_PROVENANCE_SHADOW_PASS"

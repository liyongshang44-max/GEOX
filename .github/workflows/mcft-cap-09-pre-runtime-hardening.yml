# Phase 6 retirement sentinel.
# Complete pre-cutover implementation remains immutable at:
# 75d4961279bd64dc1c9dd7d68aac189c72c98846:.github/workflows/mcft-cap-09-pre-runtime-hardening.yml
# historical blob: dcd80e91a357087fb3771f9490e623b0c7d6a05a
# No production schedule, dispatch, workflow-run, push, or callable trigger remains.
name: mcft-cap-09-pre-runtime-hardening

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-pre-runtime-hardening.yml'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-PHASE6-GITHUB-PRODUCTION-EXECUTION-RETIREMENT-AUTHORITY-V1.json'
      - 'scripts/governance_acceptance/AUDIT_MCFT_CAP_09_PHASE6_GITHUB_PRODUCTION_OWNERS_V1.cjs'
      - '.github/workflows/mcft-cap-09-phase6-retire-github-production-execution.yml'

permissions:
  contents: read

jobs:
  phase6-retirement-sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove immutable historical binding and retired trigger surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse '75d4961279bd64dc1c9dd7d68aac189c72c98846:.github/workflows/mcft-cap-09-pre-runtime-hardening.yml')" = 'dcd80e91a357087fb3771f9490e623b0c7d6a05a'
          node scripts/governance_acceptance/AUDIT_MCFT_CAP_09_PHASE6_GITHUB_PRODUCTION_OWNERS_V1.cjs selftest
          node scripts/governance_acceptance/AUDIT_MCFT_CAP_09_PHASE6_GITHUB_PRODUCTION_OWNERS_V1.cjs enforce >/tmp/mcft-cap09-phase6-owner-audit.json
          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('/tmp/mcft-cap09-phase6-owner-audit.json','utf8'));
          if(p.status!=='PASS'||p.active_retired_owner_or_trigger_count!==0||p.retired_actions_write_count!==0||p.historical_phase5_workflow_blobs_all_match!==true)throw new Error('PHASE6_RETIREMENT_SENTINEL_REQUIRED');
          NODE

name: mcft-cap-08-s5-exact-sha-attestation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcft-cap-08-s5-pre-candidate-governance.yml'
      - '.github/workflows/mcft-cap-08-s5-residual-calibration-shadow.yml'
      - '.github/workflows/mcft-cap-08-s5-exact-sha-attestation.yml'
      - 'apps/server/src/domain/calibration/cap08_s5_**'
      - 'apps/server/src/domain/twin_runtime/cap08_s5_**'
      - 'apps/server/src/infra/mcft_cap08_database_platform_bootstrap_v1.ts'
      - 'apps/server/src/persistence/twin_runtime/postgres_cap08_s5_**'
      - 'apps/server/src/runtime/twin_runtime/cap08_s5_**'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S5-CANDIDATE-CHANGED-FILE-BOUNDARY-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S5-IMPLEMENTATION-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S5-DELIVERY-STATUS-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S5-PREDECESSOR-CONSUMPTION-V1.json'
      - 'docs/digital_twin/mcft/cap_08/GEOX-MCFT-CAP-08-S5-WORKFLOW-DECLARATION-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S5_FORMAL_CANDIDATE_BOUNDARY.cjs'
      - 'scripts/governance_acceptance/mcft_cap08_s5_artifact_finalize.cjs'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_08_S5_V2_FORMAL_PREFLIGHT_DB.ts'
      - 'scripts/runtime_acceptance/mcft_cap08_s5_v2_formal_acceptance_support_v1.ts'
  workflow_dispatch:
    inputs:
      subject_sha: { description: 'Exact current main merge SHA', required: true, type: string }

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: mcft-cap08-s5-exact-${{ inputs.subject_sha || github.sha }}
  cancel-in-progress: false

jobs:
  exact-sha-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MCFT_SUBJECT_SHA: ${{ inputs.subject_sha || github.sha }}
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 30
    steps:
      - name: Checkout exact merge SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.subject_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve exact base candidate and tree equality
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MCFT_SUBJECT_SHA"
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            git fetch --no-tags origin main
            test "$(git rev-parse origin/main)" = "$MCFT_SUBJECT_SHA"
          fi
          read -r subject base candidate extra < <(git rev-list --parents -n 1 "$MCFT_SUBJECT_SHA")
          test -z "${extra:-}"
          test -n "$base"
          test -n "$candidate"
          test "$(git rev-parse "$candidate^1")" = "$base"
          test "$(git rev-list --count "$base..$candidate")" = 1
          test "$(git rev-parse "$candidate^{tree}")" = "$(git rev-parse "$subject^{tree}")"
          test -z "$(git diff --name-only "$candidate" "$subject")"
          printf 'base=%s\ncandidate=%s\nsubject=%s\n' "$base" "$candidate" "$subject" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 20.11.1, cache: pnpm }
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile
      - name: Replay candidate boundary on detached candidate
        env:
          MCFT_BASE_SHA: ${{ steps.identity.outputs.base }}
        run: |
          git checkout --detach '${{ steps.identity.outputs.candidate }}'
          node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S5_FORMAL_CANDIDATE_BOUNDARY.cjs
          git checkout --detach '${{ steps.identity.outputs.subject }}'
      - name: Typecheck exact merge SHA
        run: pnpm --filter @geox/server typecheck
      - name: Bootstrap exact database
        env:
          MCFT_CAP08_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          MCFT_CAP08_TARGET_DATABASE_NAME: geox_mcft_cap08_s5_exact
          MCFT_CAP08_RUNNER_PASSWORD: cap08-s5-exact-runner
          MCFT_CAP08_MIGRATOR_PASSWORD: cap08-s5-exact-migrator
          MCFT_CAP08_LEGACY_RUNTIME_PASSWORD: cap08-s5-exact-legacy
          MCFT_CANDIDATE_SHA: ${{ steps.identity.outputs.candidate }}
        run: pnpm -w exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_08_PLATFORM_SECURITY_BOOTSTRAP_DB.ts
      - name: Execute exact fresh PostgreSQL S5 proof
        shell: bash
        env:
          DATABASE_URL: postgres://geox_mcft_cap08_runner_v1:cap08-s5-exact-runner@127.0.0.1:5432/geox_mcft_cap08_s5_exact
          MCFT_CAP08_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/geox_mcft_cap08_s5_exact
          MCFT_CAP08_S2_G3_DESTRUCTIVE_ACCEPTANCE: '1'
          MCFT_CAP08_S4_DESTRUCTIVE_ACCEPTANCE: '1'
          MCFT_CAP08_S5_V2_FORMAL_PREFLIGHT_DESTRUCTIVE: '1'
        run: |
          set -o pipefail
          pnpm -w exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_08_S5_V2_FORMAL_PREFLIGHT_DB.ts 2>&1 \
            | tee acceptance-output/MCFT_CAP_08_S5_EXACT_SHA_RUN.log
      - name: Finalize exact authority artifact
        env:
          MCFT_ARTIFACT_STAGE: EXACT_MERGE_SHA
        run: node scripts/governance_acceptance/mcft_cap08_s5_artifact_finalize.cjs
      - name: Build deterministic archive
        run: |
          mkdir -p acceptance-output/archive-input
          cp acceptance-output/MCFT_CAP_08_S5_AUTHORITY_ARTIFACT.json acceptance-output/archive-input/canonical-artifact.json
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf acceptance-output/mcft-cap-08-s5-attestation.tar \
            -C acceptance-output/archive-input canonical-artifact.json
          gzip -n -f acceptance-output/mcft-cap-08-s5-attestation.tar
      - name: Upload and read back immutable R1 authority
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GEOX_MCFT_ATTESTATION_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GEOX_MCFT_ATTESTATION_S3_SECRET_ACCESS_KEY }}
          GEOX_MCFT_ATTESTATION_S3_ENDPOINT: ${{ vars.GEOX_MCFT_ATTESTATION_S3_ENDPOINT }}
          GEOX_MCFT_ATTESTATION_S3_BUCKET: ${{ vars.GEOX_MCFT_ATTESTATION_S3_BUCKET }}
          GEOX_MCFT_ATTESTATION_S3_REGION: ${{ vars.GEOX_MCFT_ATTESTATION_S3_REGION }}
          GEOX_MCFT_ATTESTATION_S3_FORCE_PATH_STYLE: ${{ vars.GEOX_MCFT_ATTESTATION_S3_FORCE_PATH_STYLE }}
          MCFT_CANONICAL_ARTIFACT_PATH: acceptance-output/MCFT_CAP_08_S5_AUTHORITY_ARTIFACT.json
          MCFT_ARTIFACT_ARCHIVE_PATH: acceptance-output/mcft-cap-08-s5-attestation.tar.gz
          MCFT_REPOSITORY_OWNER: ${{ github.repository_owner }}
          MCFT_REPOSITORY_NAME: GEOX
          MCFT_ARTIFACT_NAME: mcft-cap-08-s5-exact-sha-${{ inputs.subject_sha || github.sha }}
          MCFT_RETENTION_LEVEL: R1
          MCFT_RETENTION_DAYS: 180
        run: node scripts/governance_acceptance/mcft_attestation_retention_store_v1.cjs --upload-readback
      - name: Cleanup exact database
        if: always()
        env: { PGPASSWORD: postgres }
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='geox_mcft_cap08_s5_exact' AND pid<>pg_backend_pid();"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS geox_mcft_cap08_s5_exact;"
      - name: Upload exact evidence
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap-08-s5-exact-sha-${{ inputs.subject_sha || github.sha }}
          path: acceptance-output/
          if-no-files-found: error
          retention-days: 90
      - name: Publish exact-SHA status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs=require('node:fs');
            let a=null;
            try { a=JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_08_S5_AUTHORITY_ARTIFACT.json','utf8')); } catch {}
            const ok=process.env.JOB_STATUS==='success'
              && a?.status==='PASS'
              && a?.effective_delivery_frontier_projection?.effective_status==='S5_RESIDUAL_CALIBRATION_SHADOW_IMPLEMENTED_EFFECTIVE'
              && a?.effective_delivery_frontier_projection?.effective_next_slice==='S6'
              && a?.residual_count===24
              && a?.calibration_case_count===16
              && a?.objective_case_count===15
              && a?.diagnostic_only_case_count===1
              && a?.holdout_case_count===8
              && a?.candidate_parameter_value==='0.034000'
              && a?.model_activation_count===0
              && a?.active_runtime_config_switch_count===0
              && String(process.env.ARTIFACT_ID||'').length>0;
            const [owner,repo]=process.env.GITHUB_REPOSITORY.split('/');
            await github.rest.repos.createCommitStatus({
              owner,repo,sha:process.env.MCFT_SUBJECT_SHA,
              state:ok?'success':'failure',
              context:'mcft-cap-08/s5-exact-sha-attestation',
              description:ok?`PASS S5 artifact=${process.env.ARTIFACT_ID}`:'FAIL S5 exact attestation',
              target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            });

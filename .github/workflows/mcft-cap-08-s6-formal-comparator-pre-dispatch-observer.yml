name: mcft-cap-08-s6-formal-comparator-pre-dispatch-observer

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-08-s6-formal-comparator-pre-dispatch-observer.yml'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact observer base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "09a320f9b855c36ff7b37a4f8b3815fad30ac1e4"
          test "${{ github.event.pull_request.base.sha }}" = "09a320f9b855c36ff7b37a4f8b3815fad30ac1e4"
      - name: Audit formal comparator workflow dispatch uniqueness
        uses: actions/github-script@v7
        env:
          EXPECTED_MAIN_SHA: 09a320f9b855c36ff7b37a4f8b3815fad30ac1e4
          EXPECTED_EXECUTION_ID: MCFT-CAP-08-S6-FORMAL-CROSS-RUN-COMPARATOR-20260804-REPLACEMENT-001
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const {owner, repo} = context.repo;
            const workflow_id = '.github/workflows/mcft-cap-08-s6-formal-cross-run-comparator-execution.yml';
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id,
              event: 'workflow_dispatch',
              per_page: 100,
            });
            const normalized = runs.map(run => ({
              id: run.id,
              run_number: run.run_number,
              run_attempt: run.run_attempt,
              event: run.event,
              status: run.status,
              conclusion: run.conclusion,
              head_sha: run.head_sha,
              created_at: run.created_at,
              html_url: run.html_url,
            }));
            const result = {
              schema_version: 'geox_mcft_cap08_s6_formal_comparator_pre_dispatch_observer_v1',
              status: normalized.length === 0 ? 'PASS' : 'FAIL',
              repository: `${owner}/${repo}`,
              observed_main_sha: process.env.EXPECTED_MAIN_SHA,
              comparator_execution_id: process.env.EXPECTED_EXECUTION_ID,
              workflow_path: workflow_id,
              workflow_dispatch_count: normalized.length,
              matching_runs: normalized,
              dispatch_performed: normalized.length > 0,
              observer_only: true,
              dispatch_authorized: false,
              rerun_authorized: false,
            };
            fs.mkdirSync('acceptance-output', {recursive: true});
            fs.writeFileSync(
              path.join('acceptance-output', 'MCFT_CAP_08_S6_FORMAL_COMPARATOR_PRE_DISPATCH_OBSERVER_RESULT.json'),
              `${JSON.stringify(result, null, 2)}\n`,
            );
            core.info(JSON.stringify(result, null, 2));
            if (normalized.length !== 0) {
              core.setFailed(`FORMAL_COMPARATOR_WORKFLOW_DISPATCH_ALREADY_EXISTS:${normalized.length}`);
            }
      - name: Upload read-only observer result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcft-cap-08-s6-formal-comparator-pre-dispatch-observer-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/MCFT_CAP_08_S6_FORMAL_COMPARATOR_PRE_DISPATCH_OBSERVER_RESULT.json
          if-no-files-found: error
          retention-days: 30

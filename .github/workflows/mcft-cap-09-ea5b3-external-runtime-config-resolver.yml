name: mcft-cap-09-ea5b3-external-runtime-config-resolver

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-ea5b3-external-runtime-config-resolver.yml'
      - 'apps/server/src/domain/twin_runtime/external_formal_runtime_config_v1.ts'
      - 'apps/server/src/domain/twin_runtime/runtime_config_execution_view_v1.ts'
      - 'apps/server/src/domain/twin_runtime/external_formal_cap04_execution_config_resolver_v1.ts'
      - 'scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5B3_EXTERNAL_RUNTIME_CONFIG_RESOLVER.ts'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA5B3-EXTERNAL-RUNTIME-CONFIG-RESOLVER-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5B3_EXTERNAL_RUNTIME_CONFIG_RESOLVER.cjs'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: mcft-cap09-ea5b3-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  external-runtime-config-resolver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: pnpm

      - name: Resolve exact EA5B3 base
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_sha=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install exact repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax-check EA5B3 governance gate
        run: node --check scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5B3_EXTERNAL_RUNTIME_CONFIG_RESOLVER.cjs

      - name: Validate exact EA5B3 governance boundary
        env:
          MCFT_BASE_SHA: ${{ steps.authority.outputs.base_sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5B3_EXTERNAL_RUNTIME_CONFIG_RESOLVER.cjs

      - name: Re-prove CAP08 G3 frozen-core successor compatibility
        env:
          MCFT_BASE_SHA: ${{ steps.authority.outputs.base_sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_08_S2_G3_BOUNDARY.cjs

      - name: Typecheck server
        run: pnpm --filter @geox/server run typecheck

      - name: Prove External canonical Runtime Config and CAP04 compatibility resolver
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5B3_EXTERNAL_RUNTIME_CONFIG_RESOLVER.ts

      - name: Re-prove EA5B2 CAP04 External soil binding threading
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_EA5B2_CAP04_EXTERNAL_BINDING_THREADING.ts

      - name: Re-prove historical CAP04 single-tick behavior
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_04_SINGLE_TICK_INTEGRATION.ts

      - name: Re-prove historical CAP04 negative behavior
        run: pnpm exec tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_04_SINGLE_TICK_INTEGRATION_NEGATIVE.ts

      - name: Verify EA5B3 remains qualification-only
        shell: node {0}
        run: |
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('acceptance-output/MCFT_CAP_09_EA5B3_EXTERNAL_RUNTIME_CONFIG_RESOLVER_GOVERNANCE_RESULT.json','utf8'));
          if (result.status !== 'PASS') throw new Error('EA5B3_GOVERNANCE_PASS_REQUIRED');
          if (result.external_canonical_runtime_config_contract_qualified !== true || result.noncanonical_cap04_compatibility_resolver_qualified !== true) throw new Error('EA5B3_CONFIG_RESOLVER_QUALIFICATION_REQUIRED');
          if (result.external_cap04_canonical_execution_effective !== false || result.external_a0_profile_effective !== false || result.ea5b_external_runtime_profile_complete !== false) throw new Error('EA5B3_PREMATURE_RUNTIME_PROFILE_EFFECT');
          if (result.external_package_formal_eligible !== false || result.ea5c_authorized !== false || result.formal_o00_start_authorized !== false) throw new Error('EA5B3_PREMATURE_FORMAL_EFFECT');
          if (result.database_write_count !== 0 || result.formal_evidence_write_count !== 0 || result.public_provider_request_count !== 0 || result.formal_window_started !== false || result.mcft_cap09_completed !== false) throw new Error('EA5B3_ZERO_WRITE_NONCLAIM_REQUIRED');
          console.log(JSON.stringify({status:'PASS',external_config:true,compatibility_resolver:true,cap04_execution:false,a0_profile:false,ea5b_complete:false,ea5c:false,o00:false}));

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap-09-ea5b3-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: |
            acceptance-output/MCFT_CAP_09_EA5B3_EXTERNAL_RUNTIME_CONFIG_RESOLVER_GOVERNANCE_RESULT.json
            acceptance-output/MCFT_CAP_08_S2_G3_BOUNDARY_RESULT.json
          if-no-files-found: warn
          retention-days: 90

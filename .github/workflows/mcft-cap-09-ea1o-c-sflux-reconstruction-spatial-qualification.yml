name: mcft-cap-09-ea1o-c-sflux-reconstruction-spatial-qualification

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-ea1o-c-sflux-reconstruction-spatial-qualification.yml'
      - 'docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-EA1O-C-SFLUX-RECONSTRUCTION-SPATIAL-QUALIFICATION-V1.json'
      - 'scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA1O_C_SFLUX_RECONSTRUCTION_SPATIAL_QUALIFICATION.cjs'
      - 'scripts/runtime_acceptance/PROBE_MCFT_CAP_09_EA1O_C_SFLUX_RECONSTRUCTION_SPATIAL_QUALIFICATION.py'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: mcft-cap09-ea1o-c-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  live-sflux-reconstruction-spatial-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve exact EA1O-C base and subject
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "subject_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "base_sha=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
            echo "subject_sha=${{ github.event.merge_group.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_sha=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
            echo "subject_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate exact EA1O-C value-rejection governance boundary
        env:
          MCFT_BASE_SHA: ${{ steps.authority.outputs.base_sha }}
        run: node scripts/governance_acceptance/ACCEPTANCE_MCFT_CAP_09_EA1O_C_SFLUX_RECONSTRUCTION_SPATIAL_QUALIFICATION.cjs

      - name: Syntax-check live qualification probes
        run: |
          node --check scripts/runtime_acceptance/PROBE_MCFT_CAP_09_EA1K_GFS_EXACT_CYCLE_72H_AUTHORITY.mjs
          python -m py_compile scripts/runtime_acceptance/PROBE_MCFT_CAP_09_EA1O_C_SFLUX_RECONSTRUCTION_SPATIAL_QUALIFICATION.py

      - name: Install pinned ecCodes decoder
        run: |
          python -m pip install --disable-pip-version-check "eccodes==2.47.0" "eccodeslib==2.47.3.23"
          python -m eccodes selfcheck

      - name: Re-prove governed pgrb2 exact-cycle chronology at this exact head
        env:
          MCFT_SUBJECT_SHA: ${{ steps.authority.outputs.subject_sha }}
        run: node scripts/runtime_acceptance/PROBE_MCFT_CAP_09_EA1K_GFS_EXACT_CYCLE_72H_AUTHORITY.mjs

      - name: Re-prove sflux reconstruction value rejection and native spatial pass
        env:
          MCFT_SUBJECT_SHA: ${{ steps.authority.outputs.subject_sha }}
        run: python scripts/runtime_acceptance/PROBE_MCFT_CAP_09_EA1O_C_SFLUX_RECONSTRUCTION_SPATIAL_QUALIFICATION.py

      - name: Verify frozen fail-closed value rejection
        shell: python
        run: |
          import json
          from pathlib import Path

          result = json.loads(Path('acceptance-output/MCFT_CAP_09_EA1O_C_SFLUX_RECONSTRUCTION_SPATIAL_QUALIFICATION_RESULT.json').read_text())
          assert result['status'] == 'PASS'
          assert result['qualification_tick_boundary_utc'] == '2026-08-08T17:00:00Z'
          assert result['same_cycle_binding']['ea1k_selected_cycle_utc'] == '2026-08-08T12:00:00Z'
          assert result['same_cycle_binding']['lead_start'] == 6
          assert result['same_cycle_binding']['lead_end'] == 77
          assert result['same_cycle_binding']['canonical_target_count'] == 72
          assert result['same_cycle_binding']['support_lead'] == 5
          assert result['source_transport']['required_message_count'] == 73
          assert result['source_transport']['exact_range_message_count'] == 73
          assert result['grib_parameter_identity']['discipline_set'] == [0]
          assert result['grib_parameter_identity']['parameter_category_set'] == [4]
          assert result['grib_parameter_identity']['parameter_number_set'] == [192]
          assert result['grib_parameter_identity']['param_id_set'] == [260087]
          assert result['grib_parameter_identity']['short_name_set'] == ['sdswrf']
          assert result['packing_quantization']['packing_type_set'] == ['grid_complex_spatial_differencing']
          assert result['packing_quantization']['maximum_reconstructed_quantization_bound_bucket'] == 'LT_1E_1'
          reconstruction = result['reconstruction_qualification']
          assert reconstruction['canonical_reconstructed_count'] == 72
          assert reconstruction['finite_count'] == 72
          assert reconstruction['nonnegative_count'] == 67
          assert reconstruction['negative_count'] == 5
          assert reconstruction['nonfinite_count'] == 0
          assert reconstruction['negative_lead_set_sha256'] == 'sha256:960a129168895e150beea315387f3d38f3b9db5ded656c4bfa2d28762c230a60'
          assert reconstruction['negative_clipping_performed'] is False
          assert reconstruction['zero_thresholding_performed'] is False
          assert reconstruction['silent_imputation_performed'] is False
          assert reconstruction['pgrb2_fallback_used'] is False
          spatial = result['live_sflux_spatial_qualification']
          assert spatial['spatial_qualified'] is True
          assert spatial['grid_type'] == 'regular_gg'
          assert spatial['gaussian_n'] == 768
          assert spatial['grid_point_count'] == 4718592
          assert spatial['centroid_and_all_vertices_same_native_point_for_all_messages'] is True
          assert spatial['pgrb2_grid_coordinate_reused'] is False
          assert spatial['interpolation_performed'] is False
          assert result['adjudication']['decision'] == 'REJECTED_AS_AMENDMENT03_SFLUX_RECONSTRUCTION_VALUE_AUTHORITY'
          assert result['adjudication']['value_qualified'] is False
          assert result['adjudication']['spatial_qualified'] is True
          assert result['adjudication']['source_spatial_candidate_qualified'] is False
          assert result['database_write_count'] == 0
          assert result['formal_evidence_write_count'] == 0
          assert result['ea2_authorized'] is False
          assert result['formal_window_started'] is False
          print(json.dumps({
              'status': 'PASS',
              'decision': result['adjudication']['decision'],
              'negative_count': reconstruction['negative_count'],
              'spatial_qualified': spatial['spatial_qualified'],
              'support_lead': result['same_cycle_binding']['support_lead'],
          }, sort_keys=True))

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcft-cap-09-ea1o-c-${{ steps.authority.outputs.subject_sha }}
          path: |
            acceptance-output/MCFT_CAP_09_EA1O_C_SFLUX_RECONSTRUCTION_SPATIAL_QUALIFICATION_GOVERNANCE_RESULT.json
            acceptance-output/MCFT_CAP_09_EA1K_GFS_EXACT_CYCLE_72H_AUTHORITY_RESULT.json
            acceptance-output/MCFT_CAP_09_EA1O_C_SFLUX_RECONSTRUCTION_SPATIAL_QUALIFICATION_RESULT.json
          if-no-files-found: warn
          retention-days: 90

name: b04b4-mqtt-runtime-durability-oneoff
on:
  push:
    branches:
      - docs/bline-b02-semantic-ownership-register-v1-test
permissions:
  contents: read
jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d262f912c2b60cc4bf627aac5a34f7d41d963634
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Server typecheck
        run: pnpm --filter @geox/server run typecheck
      - name: Build telemetry-ingest compile prerequisites
        run: pnpm --filter @geox/contracts build && pnpm --filter @geox/device-skills build && pnpm --filter @geox/skill-registry build
      - name: Telemetry ingest package build
        run: pnpm --filter @geox/telemetry-ingest build
      - name: MQTT source-preserving fixtures
        run: pnpm --filter @geox/telemetry-ingest exec node --import tsx --test src/mqtt_observation_input_v1.test.ts
      - name: MQTT durable raw fixtures
        run: pnpm --filter @geox/telemetry-ingest exec node --import tsx --test src/mqtt_durable_raw_v1.test.ts
      - name: Commercial compose render
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: geox
          GEOX_MCFT_MIGRATOR_PASSWORD: migrator
          GEOX_RUNTIME_DATABASE_PASSWORD: runtime
          GEOX_DEPLOYMENT_SUBJECT_COMMIT: d262f912c2b60cc4bf627aac5a34f7d41d963634
          MINIO_ROOT_USER: minio
          MINIO_ROOT_PASSWORD: minio123
          MQTT_USERNAME: geox
          MQTT_PASSWORD: geoxpass
          CORS_ORIGINS: http://localhost
          APP_SECRET: testsecret
          PUBLIC_BASE_URL: http://localhost
          GEOX_AO_ACT_TOKEN: operator_token
          GEOX_EXECUTOR_TOKEN: operator_token
        run: docker compose -f docker-compose.commercial_v1.yml config >/tmp/b04b4-compose.yml
      - name: Telemetry ingest runtime image packaging probe
        run: |
          docker build             -f docker/runtime.Dockerfile             --build-arg "BUILD_COMMAND=pnpm --filter @geox/contracts build && pnpm --filter @geox/device-skills build && pnpm --filter @geox/skill-registry build && pnpm --filter @geox/telemetry-ingest build"             -t geox/telemetry-ingest-b04b4 .
          docker run --rm --entrypoint ./node_modules/.bin/tsx geox/telemetry-ingest-b04b4 --version
          docker run --rm --entrypoint /bin/sh geox/telemetry-ingest-b04b4 -lc 'test -f apps/telemetry-ingest/src/main.ts && test -x node_modules/.bin/tsx'
      - name: B04a fixtures
        run: pnpm --filter @geox/server exec node --import tsx --test src/evidence/physical_qc_v1.test.ts
      - name: B04b1 fixtures
        run: pnpm --filter @geox/server exec node --import tsx --test src/evidence/ingress_physical_qc_snapshot_v1.test.ts
      - name: B04b2 fixtures
        run: pnpm --filter @geox/server exec node --import tsx --test src/services/telemetry_ingest_durable_raw_v1.test.ts
      - name: B02 linter
        run: node scripts/governance_acceptance/ACCEPTANCE_B02_SEMANTIC_CONTRACT_LINTER_V1.cjs
      - name: Marker
        run: |
          echo "B04B4_EXACT_HEAD $(git rev-parse HEAD)"
          echo "B04B4_MQTT_RUNTIME_DURABILITY_PASS"

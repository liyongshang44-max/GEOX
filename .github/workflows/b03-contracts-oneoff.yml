name: b04a-physical-qc-oneoff
on:
  push:
    branches:
      - docs/bline-b02-semantic-ownership-register-v1-test
permissions:
  contents: read
jobs:
  exact-head-physical-qc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact B-04a target head
        uses: actions/checkout@v4
        with:
          ref: 3ceb9ec68c947624bde2d547bf5ce9f55c22f796
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Server typecheck
        run: pnpm --filter @geox/server run typecheck
      - name: B-04a physical QC fixtures
        run: pnpm --filter @geox/server exec node --import tsx --test src/evidence/physical_qc_v1.test.ts
      - name: B-02 semantic contract linter
        run: node scripts/governance_acceptance/ACCEPTANCE_B02_SEMANTIC_CONTRACT_LINTER_V1.cjs
      - name: Exact-head marker
        run: |
          echo "B04A_EXACT_HEAD $(git rev-parse HEAD)"
          echo "B04A_PHYSICAL_QC_PASS"

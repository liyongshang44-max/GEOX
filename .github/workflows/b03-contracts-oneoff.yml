name: b04d2r1-postgres-placeholder-correction-oneoff
on:
  push:
    branches:
      - docs/bline-b02-semantic-ownership-register-v1-test
permissions:
  contents: read
jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7306e9bad103b1284fbab0f6e280d47ec53fe6af
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Server typecheck
        run: pnpm --filter @geox/server run typecheck
      - name: B04d2r1 exact SQL placeholder + authority fixtures
        run: pnpm --filter @geox/server exec node --import tsx --test src/domain/sensing/raw_sample_authority_time_scope_v1.test.ts
      - name: B04d1 raw-sample guard fixtures
        run: pnpm --filter @geox/server exec node --import tsx --test src/evidence/raw_sample_stage1_physical_qc_v1.test.ts
      - name: B04d1 raw-sample ingress physical QC fixture
        run: pnpm --filter @geox/server exec node --import tsx --test src/domain/sensing/raw_sample_ingress_physical_qc_v1.test.ts
      - name: B04d1 Apple-II physical QC fixture
        run: pnpm --filter @geox/server exec node --import tsx --test src/domain/sensing/appleii_evidence_physical_qc_v1.test.ts
      - name: B04c pure guard fixtures
        run: pnpm --filter @geox/server exec node --import tsx --test src/evidence/stage1_physical_qc_consumption_guard_v1.test.ts
      - name: B04c Stage-1 loader fixtures
        run: pnpm --filter @geox/server exec node --import tsx --test src/services/device_observation_stage1_physical_qc_guard_v1.test.ts
      - name: B04a fixtures
        run: pnpm --filter @geox/server exec node --import tsx --test src/evidence/physical_qc_v1.test.ts
      - name: B04b ingress and persistence regressions
        run: |
          pnpm --filter @geox/server exec node --import tsx --test src/evidence/ingress_physical_qc_snapshot_v1.test.ts
          pnpm --filter @geox/server exec node --import tsx --test src/services/device_observation_ingress_physical_qc_v1.test.ts
          pnpm --filter @geox/server exec node --import tsx --test src/services/telemetry_ingest_durable_raw_v1.test.ts
      - name: Build telemetry-ingest compile prerequisites
        run: pnpm --filter @geox/contracts build && pnpm --filter @geox/device-skills build && pnpm --filter @geox/skill-registry build
      - name: Telemetry ingest package build
        run: pnpm --filter @geox/telemetry-ingest build
      - name: MQTT regressions
        run: |
          pnpm --filter @geox/telemetry-ingest exec node --import tsx --test src/mqtt_observation_input_v1.test.ts
          pnpm --filter @geox/telemetry-ingest exec node --import tsx --test src/mqtt_durable_raw_v1.test.ts
      - name: B02 linter
        run: node scripts/governance_acceptance/ACCEPTANCE_B02_SEMANTIC_CONTRACT_LINTER_V1.cjs
      - name: Marker
        run: |
          echo "B04D2R1_EXACT_HEAD $(git rev-parse HEAD)"
          echo "B04D2R1_POSTGRES_PLACEHOLDER_CORRECTION_PASS"

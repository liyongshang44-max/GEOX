name: P6-B/C1 manager soil fixture
on:
  pull_request:
    paths:
      - 'apps/server/src/auth/manager_authority_v1.ts'
      - 'apps/server/src/domain/field/manager_polygon_v1.ts'
      - 'apps/server/src/domain/field/soil_csv_p2_v1.ts'
      - 'apps/server/src/routes/manager_soil_documents_v1.ts'
      - 'apps/server/src/routes/manager_field_commands_v1.ts'
      - 'apps/server/test/manager_native_commands_v1.fixture.ts'
      - 'apps/server/test/manager_browser_recovery_v1.fixture.mjs'
      - 'apps/web/src/features/manager/**'
      - 'apps/web/src/api/managerWorkspaceV1.ts'
      - 'scripts/product/e2e01/build-web.mjs'
      - 'scripts/acceptance/p6-bc-native-commands.sh'
      - 'apps/server/test/manager_soil_documents_v1.fixture.ts'
      - '.github/workflows/p6-b-c1-manager-soil.yml'
permissions:
  contents: read
jobs:
  manager-soil-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: p6_fixture_admin_only
          POSTGRES_DB: geox_p6_soil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d geox_p6_soil_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      P6_TEST_ONLY: '1'
      P6_TEST_DATABASE_URL: postgres://postgres:p6_fixture_admin_only@127.0.0.1:5432/geox_p6_soil_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx apps/server/test/manager_soil_documents_v1.fixture.ts
  native-manager-commands:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @geox/contracts build && pnpm --filter @geox/control-kernel build && pnpm --filter @geox/device-skills build && pnpm --filter @geox/skill-registry build && pnpm --filter @geox/server build
      - run: node scripts/product/e2e01/build-web.mjs
      - name: Install isolated browser fixture dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/geox-p6-browser" --no-audit --no-fund --save-exact playwright@1.56.1
          "$RUNNER_TEMP/geox-p6-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "P6_PLAYWRIGHT_MODULE=$RUNNER_TEMP/geox-p6-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - run: bash scripts/acceptance/p6-bc-native-commands.sh

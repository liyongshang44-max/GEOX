name: MCFT CAP-09 AM22 start chain V2 engineering
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-am22-start-chain-v2-engineering.yml'
      - 'docker-compose.mcft-cap09-production-preformal-am22-v2.yml'
      - 'scripts/runtime_acceptance/*AM22*V2*'
      - 'scripts/runtime_acceptance/*CUTOVER_V2.cjs'
      - 'scripts/runtime_acceptance/*ARM_V2.cjs'
permissions:
  contents: read
jobs:
  engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: am22_o00
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d am22_o00"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
      - run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @geox/contracts build && pnpm --filter @geox/control-kernel build && pnpm --filter @geox/device-skills build && pnpm --filter @geox/skill-registry build
      - name: New chain boundary tests and inactive effect rejection
        run: node scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_AM22_START_CHAIN_V2.cjs
      - name: Preserve revoked identity guard
        run: node scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_FORMAL_ARM_RETIREMENT_V1.cjs
      - name: New V2 ARM DTO through real isolated PostgreSQL A0 and O00
        env:
          AM22_ISOLATED_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/am22_o00
        run: node --import tsx scripts/runtime_acceptance/ACCEPTANCE_MCFT_CAP_09_AM22_START_CHAIN_ISOLATED_O00_V2.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: am22-start-chain-engineering-${{ github.event.pull_request.head.sha || github.sha }}
          path: acceptance-output/MCFT_CAP_09_AM22_START_CHAIN_ISOLATED_O00_RESULT.json
          if-no-files-found: warn

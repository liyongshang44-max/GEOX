name: mcft-cap-09-v13-producer-driven-qualification-preflight

on:
  pull_request:
    paths:
      - '.github/workflows/mcft-cap-09-v13-producer-driven-qualification-preflight.yml'
      - 'apps/server/src/external_evidence/mcft_cap09_v13_forcing_production_composition_v1.ts'

permissions:
  contents: read

concurrency:
  group: mcft-cap09-v13-producer-driven-preflight-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  remote-read-only-preflight:
    if: >-
      github.head_ref == 'feat/mcft-cap09-v13-producer-driven-qualification-v1' &&
      github.event.pull_request.base.sha == '46367333d228a2b90a86ff6a33aebc334f3d73a2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SEED_DATABASE_URL: ${{ secrets.GEOX_MCFT_CAP09_T3R1_S6_DATABASE_URL }}
      S3_ENDPOINT: ${{ secrets.GEOX_MCFT_CAP09_FORMAL_RAW_S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.GEOX_MCFT_CAP09_FORMAL_RAW_S3_BUCKET }}
      S3_REGION: ${{ secrets.GEOX_MCFT_CAP09_FORMAL_RAW_S3_REGION }}
      S3_ACCESS_KEY_ID: ${{ secrets.GEOX_MCFT_CAP09_FORMAL_RAW_S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.GEOX_MCFT_CAP09_FORMAL_RAW_S3_SECRET_ACCESS_KEY }}
      EVIDENCE_RUNTIME_DATABASE_URL_SECRET: ${{ secrets.GEOX_MCFT_CAP09_EVIDENCE_RUNTIME_DATABASE_URL }}
      EVIDENCE_RUNTIME_PASSWORD_SECRET: ${{ secrets.GEOX_MCFT_CAP09_EVIDENCE_RUNTIME_DATABASE_PASSWORD }}
      V13_DB: geox_mcft_cap09_s6_accel24t_am19_v13
      BLOCKED_V13_DB: geox_mcft_cap09_s6_accel24t_am19_blocked_v13
      FORMAL_V5_DB: geox_mcft_cap09_s6_formal_t4r1_24h_v5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact subject and frozen authority
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha }}" = "46367333d228a2b90a86ff6a33aebc334f3d73a2"
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "fa6e260d8cdec4a82403a86f1c7b3d5420e44ef8"
          node - <<'NODE'
          const fs=require('node:fs');
          const a=JSON.parse(fs.readFileSync('docs/digital_twin/mcft/cap_09/GEOX-MCFT-CAP-09-T4R1-ACTUAL-FORMAL-STORE-AUTHORITY-V3.json','utf8'));
          if(a.activation_sequence?.[3]!=='RUN_PRODUCER_DRIVEN_V13_QUALIFICATION') throw new Error('V13_QUALIFICATION_SEQUENCE_DRIFT');
          if(a.qualification_generation?.qualification_database!==process.env.V13_DB) throw new Error('V13_QUALIFICATION_DB_DRIFT');
          if(a.qualification_generation?.blocked_database!==process.env.BLOCKED_V13_DB) throw new Error('V13_BLOCKED_DB_DRIFT');
          if(a.database_identity?.database_name!==process.env.FORMAL_V5_DB) throw new Error('FORMAL_V5_DB_DRIFT');
          if(a.schema_contract?.v13_required_public_table_count!==29) throw new Error('V13_29_TABLE_SCHEMA_REQUIRED');
          if(a.qualification_generation?.producer_supply_graph_must_be_exercised!==true) throw new Error('V13_PRODUCER_GRAPH_REQUIRED');
          if(a.qualification_generation?.preinsert_all_24_hourly_forcing_pairs_forbidden!==true) throw new Error('V13_PREINSERT_24_FORBIDDEN');
          NODE

      - name: Normalize governed connection targets
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const raw=String(process.env.SEED_DATABASE_URL||'').trim();
          if(!raw) throw new Error('V13_QUALIFICATION_SEED_DATABASE_URL_REQUIRED');
          const u=new URL(raw);
          if(!['postgres:','postgresql:'].includes(u.protocol)) throw new Error('V13_QUALIFICATION_POSTGRES_URL_REQUIRED');
          function target(name){
            const x=new URL(raw); x.pathname='/'+name;
            const value=x.toString(); console.log('::add-mask::'+value); return value;
          }
          fs.appendFileSync(process.env.GITHUB_ENV,
            'V13_URL='+target(process.env.V13_DB)+'\n'+
            'BLOCKED_V13_URL='+target(process.env.BLOCKED_V13_DB)+'\n'+
            'FORMAL_V5_URL='+target(process.env.FORMAL_V5_DB)+'\n'
          );

      - name: Require exact fresh zero-state store inventory
        shell: bash
        run: |
          set -euo pipefail
          for pair in "$V13_DB|$V13_URL" "$BLOCKED_V13_DB|$BLOCKED_V13_URL" "$FORMAL_V5_DB|$FORMAL_V5_URL"; do
            name="${pair%%|*}"; url="${pair#*|}"
            counts="$(psql "$url" -AtF '|' -v ON_ERROR_STOP=1 -c "
              SELECT
                (SELECT count(*)::int FROM pg_catalog.pg_class c JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN ('r','p','v','m','S','f')),
                (SELECT count(*)::int FROM pg_catalog.pg_proc p JOIN pg_catalog.pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public')")"
            test "$counts" = "0|0" || { echo "V13_QUALIFICATION_STORE_NOT_ZERO_STATE:$name:$counts" >&2; exit 1; }
          done

      - name: Inspect pre-activation Evidence role topology without mutation
        shell: bash
        run: |
          set -euo pipefail
          roles="$(psql "$SEED_DATABASE_URL" -AtF '|' -v ON_ERROR_STOP=1 -c "
            SELECT rolname,rolcanlogin::text,rolinherit::text,rolsuper::text,rolcreatedb::text,rolcreaterole::text
              FROM pg_catalog.pg_roles
             WHERE rolname IN ('geox_mcft_cap09_evidence_runtime_v1','geox_mcft_cap09_evidence_runtime_login_v1')
             ORDER BY rolname")"
          printf '%s\n' "$roles"

          privilege_present=false
          login_present=false
          login_membership=false

          if grep -q '^geox_mcft_cap09_evidence_runtime_v1|' <<<"$roles"; then
            privilege_present=true
            grep -Fx 'geox_mcft_cap09_evidence_runtime_v1|false|true|false|false|false' <<<"$roles"
            assumed="$(psql "$SEED_DATABASE_URL" -qAt -v ON_ERROR_STOP=1 -c "
              SET ROLE geox_mcft_cap09_evidence_runtime_v1;
              SELECT current_user::text;" | tail -n 1)"
            test "$assumed" = "geox_mcft_cap09_evidence_runtime_v1"
          fi

          if grep -q '^geox_mcft_cap09_evidence_runtime_login_v1|' <<<"$roles"; then
            login_present=true
            grep -Fx 'geox_mcft_cap09_evidence_runtime_login_v1|true|true|false|false|false' <<<"$roles"
            membership="$(psql "$SEED_DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "
              SELECT count(*)::int
                FROM pg_catalog.pg_auth_members m
                JOIN pg_catalog.pg_roles granted ON granted.oid=m.roleid
                JOIN pg_catalog.pg_roles member ON member.oid=m.member
               WHERE member.rolname='geox_mcft_cap09_evidence_runtime_login_v1'
                 AND granted.rolname='geox_mcft_cap09_evidence_runtime_v1'")"
            test "$membership" = "1"
            login_membership=true
          fi

          {
            echo "EVIDENCE_PRIVILEGE_PRESENT=$privilege_present"
            echo "EVIDENCE_LOGIN_PRESENT=$login_present"
            echo "EVIDENCE_LOGIN_MEMBERSHIP=$login_membership"
          } >> "$GITHUB_ENV"

      - name: Require exact private raw-store credential surface
        shell: bash
        run: |
          set -euo pipefail
          test -n "$S3_ENDPOINT"
          test "$S3_BUCKET" = "geox-mcft-cap09-formal-raw-v1"
          test -n "$S3_REGION"
          test -n "$S3_ACCESS_KEY_ID"
          test -n "$S3_SECRET_ACCESS_KEY"

      - name: Emit read-only preflight proof
        shell: node {0}
        run: |
          const fs=require('node:fs');
          const proof={
            schema_version:'geox_mcft_cap09_v13_producer_driven_qualification_preflight_v1',
            status:'PASS',
            subject_sha:process.env.GITHUB_SHA,
            implementation_base_sha:'46367333d228a2b90a86ff6a33aebc334f3d73a2',
            protected_main_sha:'fa6e260d8cdec4a82403a86f1c7b3d5420e44ef8',
            v13_zero_state:true,
            blocked_v13_zero_state:true,
            formal_v5_zero_state:true,
            evidence_privilege_role_present:process.env.EVIDENCE_PRIVILEGE_PRESENT==='true',
            evidence_login_present:process.env.EVIDENCE_LOGIN_PRESENT==='true',
            evidence_login_exact_membership:process.env.EVIDENCE_LOGIN_MEMBERSHIP==='true',
            evidence_runtime_database_url_secret_present:Boolean(process.env.EVIDENCE_RUNTIME_DATABASE_URL_SECRET),
            evidence_runtime_password_secret_present:Boolean(process.env.EVIDENCE_RUNTIME_PASSWORD_SECRET),
            admin_can_assume_evidence_privilege_role_for_qualification:true,
            private_raw_bucket_exact:true,
            remote_mutation_count:0,
            provider_request_count:0,
            schema_migration_performed:false,
            timing_budget_frozen:false,
            production_owner_activation:false,
            formal_v5_arm:false,
            a0_bootstrap:false,
            o00_started:false,
            mcft_cap09_completed:false
          };
          fs.mkdirSync('acceptance-output',{recursive:true});
          fs.writeFileSync('acceptance-output/MCFT_CAP_09_V13_PRODUCER_DRIVEN_QUALIFICATION_PREFLIGHT.json',JSON.stringify(proof,null,2)+'\n');
          console.log(JSON.stringify(proof,null,2));

      - uses: actions/upload-artifact@v4
        with:
          name: mcft-cap09-v13-producer-driven-preflight-${{ github.event.pull_request.head.sha }}
          path: acceptance-output/MCFT_CAP_09_V13_PRODUCER_DRIVEN_QUALIFICATION_PREFLIGHT.json
          if-no-files-found: error
          retention-days: 90

name: P6-A2 manager persistence fixture
on:
  pull_request:
    paths:
      - 'apps/server/db/migrations/product/**'
      - 'apps/server/src/infra/product_manager_migration_v1.ts'
      - 'apps/server/src/product_manager_migration_v1.ts'
      - 'apps/server/test/product_manager_migration_v1.fixture.ts'
      - '.github/workflows/p6-a2-manager-persistence.yml'
      - 'scripts/acceptance/p6-a2-native-bootstrap-reentry.sh'
permissions:
  contents: read
jobs:
  postgres-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: p6_fixture_admin_only
          POSTGRES_DB: geox_p6_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d geox_p6_migration_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      P6_TEST_ONLY: '1'
      P6_TEST_DATABASE_URL: postgres://postgres:p6_fixture_admin_only@127.0.0.1:5432/geox_p6_migration_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx apps/server/test/product_manager_migration_v1.fixture.ts
  native-bootstrap-reentry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @geox/contracts build && pnpm --filter @geox/control-kernel build && pnpm --filter @geox/device-skills build && pnpm --filter @geox/skill-registry build && pnpm --filter @geox/server build
      - run: bash scripts/acceptance/p6-a2-native-bootstrap-reentry.sh
